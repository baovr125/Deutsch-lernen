  note_vi: 'Phần in đậm cần nhớ: du heißt (chỉ -t) và cả cột sein.'
examples:
- de: Ich heiße Mai. Und wie heißt du?
  vi: Mình tên là Mai. Còn bạn tên gì?
- de: Guten Tag! Wie heißen Sie?
  vi: Xin chào! Ông/Bà tên là gì?
- de: Ich bin Herr Tran.
  vi: Tôi là ông Trần.
- de: Bist du Lisa?
  vi: Bạn là Lisa à?
  note_vi: Trong câu hỏi có/không, động từ đứng đầu câu – học kỹ ở Kapitel 2.
- de: Sind Sie Frau Berg?
  vi: Bà có phải là bà Berg không ạ?
common_mistakes:
- wrong: Du heißst Tom.
  right: Du heißt Tom.
  explanation_vi: Gốc heiß- đã có âm s, không thêm -st mà chỉ thêm -t.
- wrong: Ich heißen Lan.
  right: Ich heiße Lan.
  explanation_vi: Với ich phải dùng đuôi -e. Dạng -en chỉ dùng với Sie (và với wir/sie số nhiều – Kapitel 2).
- wrong: Sie ist Frau Weber? (khi hỏi người đối diện)
  right: Sind Sie Frau Weber?
  explanation_vi: Sie (trang trọng) luôn đi với dạng động từ -en/sind, không đi với ist.
- wrong: Ich bin heiße Minh.
  right: Ich heiße Minh. / Ich bin Minh.
  explanation_vi: Một câu đơn chỉ có MỘT động từ chia. Chọn hoặc heiße, hoặc bin.
comparison_vi: 'So sánh với sein: “Ich bin Minh” và “Ich heiße Minh” đều dùng để giới thiệu tên và gần như cùng nghĩa. “Mein Name ist Minh” trang trọng hơn một chút. Không ghép hai động từ: “Ich bin heiße…” là sai.'
vietnamese_contrast_vi: 'Tiếng Việt: “tôi nghe, bạn nghe, ông nghe” – động từ không đổi. Tiếng Đức: ich höre, du hörst, Sie hören – đuôi đổi. Người Việt thường quên chia động từ khi nói nhanh; hãy tập nói thật chậm, chú ý âm cuối (-e, -st, -en) cho tới khi thành phản xạ.'
recap_vi: 'ich → -e, du → -st (heißen: du heißt), Sie → -en. Riêng sein: ich bin, du bist, Sie sind.'
next_level_note_vi: er/sie/es học ở bài 3 (Kapitel 1). wir, ihr, sie (số nhiều) và động từ bất quy tắc khác học ở Kapitel 2.
