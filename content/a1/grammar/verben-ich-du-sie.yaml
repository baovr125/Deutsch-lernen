title_de: 'Verben und Personalpronomen: ich, du, Sie'
title_vi: Chia động từ với ich, du và Sie (thì hiện tại)
summary_vi: '**Đại từ nhân xưng** (Personalpronomen) là các từ chỉ người nói hoặc người được nói tới: *ich* (tôi), *du* (bạn – thân mật), *Sie* (ông/bà – trang trọng).


  Trong tiếng Đức, **động từ thay đổi đuôi** tùy theo đại từ đứng trước nó. Việc thay đổi này gọi là **chia động từ** (konjugieren).


  **Bước 1 – Tìm gốc động từ.** Động từ trong từ điển ở dạng nguyên mẫu (Infinitiv), thường tận cùng bằng **-en**.

  Bỏ -en đi, ta có **gốc**: *heiß-en → heiß-*, *hör-en → hör-*, *schreib-en → schreib-*.


  **Bước 2 – Gắn đuôi theo người:**

  - **ich** → gốc + **-e**: *ich höre, ich schreibe, ich heiße*

  - **du** → gốc + **-st**: *du hörst, du schreibst*

  - **Sie** → gốc + **-en** (giống hệt dạng nguyên mẫu): *Sie hören, Sie schreiben, Sie heißen*


  **Hai trường hợp đặc biệt cần nhớ ngay:**

  1. *heißen*: gốc *heiß-* đã kết thúc bằng âm s (ß), nên với *du* chỉ thêm **-t**: *du heißt* (không phải "du heißst").

  2. *sein* (là) **bất quy tắc hoàn toàn**: *ich bin, du bist, Sie sind*. Phải học thuộc.'
usage_vi: 'Dùng mỗi khi nói một câu có chủ ngữ ich, du hoặc Sie: giới thiệu tên, hỏi tên, hỏi thăm. Ở bài 3 bạn sẽ học thêm er/sie (anh ấy, cô ấy).'
objectives:
- id: a1.g.verben-ich-du-sie.obj1
  text_vi: Chia động từ với ich, du và Sie.
  skill: grammar
rules:
- id: a1.g.verben-ich-du-sie.r1
  title_vi: Tìm gốc động từ
  body_vi: Gốc động từ = nguyên mẫu bỏ đuôi -en.
  examples:
  - de: heißen → heiß-
    vi: tên là
  - de: schreiben → schreib-
    vi: viết
- id: a1.g.verben-ich-du-sie.r2
  title_vi: Đuôi cho ich, du, Sie
  body_vi: ich → gốc + e; du → gốc + st; Sie → gốc + en.
  examples:
  - de: ich höre – du hörst – Sie hören
    vi: tôi nghe – bạn nghe – ông/bà nghe
  - de: ich schreibe – du schreibst – Sie schreiben
    vi: tôi viết – bạn viết – ông/bà viết
- id: a1.g.verben-ich-du-sie.r3
  title_vi: Gốc tận cùng -s, -ß, -z
  body_vi: 'Gốc tận cùng bằng s, ß, z: với du chỉ thêm -t.'
  examples:
  - de: du heißt
    vi: bạn tên là
- id: a1.g.verben-ich-du-sie.r4
  title_vi: sein là động từ bất quy tắc
  body_vi: 'sein là động từ bất quy tắc: ich bin, du bist, Sie sind.'
  examples:
  - de: Ich bin Minh. Bist du Anna? Sind Sie Herr Weber?
    vi: Tôi là Minh. Bạn là Anna à? Ông là ông Weber phải không ạ?
sentence_structures:
- pattern: ich + gốc-e
  example:
    de: Ich heiße Lan.
    vi: Tôi tên là Lan.
- pattern: du + gốc-st
  example:
    de: Hörst du?
    vi: Bạn có nghe không?
- pattern: Sie + gốc-en (= nguyên mẫu)
  example:
    de: Wie heißen Sie?
    vi: Ông/Bà tên là gì?
tables:
- title_vi: Bảng chia động từ (thì hiện tại – Präsens)
  header:
  - ''
  - heißen
  - hören
  - schreiben
  - sein
  rows:
  - - ich
    - heiße
    - höre
    - schreibe
    - bin
  - - du
    - heißt
    - hörst
    - schreibst
