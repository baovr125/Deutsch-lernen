id: g-a1-unbestimmter-artikel
level: A1
title_de: "Der unbestimmte und der bestimmte Artikel"
title_vi: "Mạo từ không xác định ein/eine và mạo từ xác định der/die/das"
introduced_in: a1-k03-l02
source:
  type: netzwerk-neu
  kapitel: 3
  sections: ["Die Taxifahrt"]
  note_vi: "Tương ứng Grammatik „unbestimmter + bestimmter Artikel“ của Kapitel 3."
prerequisites: [g-a1-bestimmter-artikel]
explanation_vi: |
  Tiếng Đức có hai loại mạo từ:

  | | Giống đực | Giống trung | Giống cái | Số nhiều |
  |---|---|---|---|---|
  | **xác định** (cái đã biết) | der | das | die | die |
  | **không xác định** (một cái nào đó) | **ein** | **ein** | **eine** | – (không có) |

  **Khi nào dùng ein/eine?** Khi nói về một người/vật **lần đầu**, **chưa xác định**, hoặc **một trong nhiều**:
  *Da ist **ein** Hotel.* – Kia có một khách sạn (người nghe chưa biết khách sạn nào).

  **Khi nào dùng der/die/das?** Khi người nghe **đã biết** đang nói về cái nào (đã nhắc trước đó, hoặc chỉ có một):
  ***Das** Hotel heißt „Elbblick“.* – Khách sạn (vừa nói đến) tên là “Elbblick”.

  **Mẫu rất thường gặp:** câu 1 dùng ein/eine, câu 2 dùng der/die/das:
  *Das ist **eine** Kirche. **Die** Kirche ist sehr alt.*

  **Số nhiều không có ein:** *Das sind Brücken.* (Đó là những cây cầu.)
usage_vi: "ein/eine khi giới thiệu cái mới; der/die/das khi cái đó đã được biết. Gọi tên đồ vật: Was ist das? – Das ist ein/eine …"
structure:
  - pattern: "Das ist ein/eine + danh từ."
    example_de: "Das ist ein Bahnhof."
    example_vi: "Đây là một nhà ga."
  - pattern: "Der/Die/Das + danh từ + ist …"
    example_de: "Der Bahnhof ist groß."
    example_vi: "Nhà ga (đó) lớn."
rules:
  - rule_vi: "ein cho giống đực và giống trung, eine cho giống cái; số nhiều không có mạo từ không xác định."
    examples:
      - { de: "ein Turm, ein Schiff, eine Brücke – Türme, Schiffe, Brücken", vi: "một tòa tháp, một con tàu, một cây cầu – các tòa tháp, …" }
  - rule_vi: "Dùng ein/eine khi nhắc đến lần đầu; dùng der/die/das khi đã biết."
    examples:
      - { de: "Da ist ein Hotel. Das Hotel ist schön.", vi: "Kia có một khách sạn. Khách sạn đó đẹp." }
      - { de: "Hamburg hat einen Hafen. Der Hafen ist groß.", vi: "Hamburg có một bến cảng. Bến cảng đó lớn.", note_vi: "einen = ein ở cách Akkusativ (sau haben) – học ở Kapitel 4." }
  - rule_vi: "Cái duy nhất hoặc ai cũng biết dùng der/die/das."
    examples:
      - { de: "Die Elbe ist ein Fluss.", vi: "Sông Elbe là một con sông." }
tables:
  - title_vi: "So sánh hai loại mạo từ (Nominativ)"
    columns: ["Giống", "xác định", "không xác định", "Ví dụ"]
    rows:
      - ["đực (m)", "der", "ein", "der/ein Turm"]
      - ["trung (n)", "das", "ein", "das/ein Schiff"]
      - ["cái (f)", "die", "eine", "die/eine Brücke"]
      - ["số nhiều", "die", "–", "die Brücken / Brücken"]
examples:
  - { de: "Was ist das? – Das ist eine Kirche.", vi: "Đó là gì? – Đó là một nhà thờ." }
  - { de: "Die Kirche heißt „Michel“.", vi: "Nhà thờ đó tên là “Michel”." }
  - { de: "Da ist ein See. Der See ist schön.", vi: "Kia có một cái hồ. Cái hồ đẹp." }
  - { de: "Das sind Schiffe.", vi: "Đó là những con tàu." }
  - { de: "Ist das ein Hotel? – Ja, das ist das Hotel „Elbblick“.", vi: "Đó là khách sạn à? – Vâng, đó là khách sạn “Elbblick”." }
common_mistakes:
  - wrong: "Das ist ein Brücke."
    right: "Das ist eine Brücke."
    explanation_vi: "die Brücke (giống cái) → eine."
  - wrong: "Das sind eine Schiffe."
    right: "Das sind Schiffe."
    explanation_vi: "Số nhiều không dùng ein/eine."
  - wrong: "Da ist ein Hotel. Ein Hotel ist schön."
    right: "Da ist ein Hotel. Das Hotel ist schön."
    explanation_vi: "Lần thứ hai nhắc đến → người nghe đã biết → dùng der/die/das."
comparison_vi: "Giống tiếng Anh: a/an ↔ ein/eine, the ↔ der/die/das; quy tắc dùng gần như giống nhau. Khác: tiếng Đức ein/eine thay đổi theo giống (và cách), tiếng Anh “a” thì không."
vietnamese_contrast_vi: "Tiếng Việt dùng “một” (một cái hồ) và “đó/này” (cái hồ đó) – tương tự ein và der/die/das. Nhưng tiếng Việt thường bỏ cả hai (“Kia có hồ, hồ đẹp lắm”), còn tiếng Đức hầu như luôn phải có mạo từ trước danh từ số ít."
exercises:
  - id: g-a1-unbestimmter-artikel-ex01
    type: gap-fill
    skill: grammar
    objectives: [r1]
    difficulty: 1
    instructions_vi: "Điền ein hoặc eine."
    items:
      - { id: q1, prompt: "Das ist ___ Brücke.", answer: ["eine"], explanation_vi: "die Brücke → eine." }
      - { id: q2, prompt: "Das ist ___ Turm.", answer: ["ein"], explanation_vi: "der Turm → ein." }
      - { id: q3, prompt: "Das ist ___ Schiff.", answer: ["ein"], explanation_vi: "das Schiff → ein." }
      - { id: q4, prompt: "Das ist ___ Kirche.", answer: ["eine"], explanation_vi: "die Kirche → eine." }
  - id: g-a1-unbestimmter-artikel-ex02
    type: gap-fill
    skill: grammar
    objectives: [r2, r3]
    difficulty: 2
    instructions_vi: "Điền mạo từ phù hợp: ein/eine hoặc der/die/das."
    items:
      - { id: q1, prompt: "Da ist ___ See. ___ See ist schön.", answer: ["ein", "Der"], explanation_vi: "Lần đầu: ein; lần hai: Der." }
      - { id: q2, prompt: "Das ist ___ Kirche. ___ Kirche ist alt.", answer: ["eine", "Die"], explanation_vi: "eine → Die." }
      - { id: q3, prompt: "___ Elbe ist ein Fluss.", answer: ["Die"], explanation_vi: "Sông Elbe là duy nhất → die." }
summary_vi: "ein (m/n), eine (f), số nhiều không có. Lần đầu nhắc đến: ein/eine; đã biết: der/die/das. Mẫu: Das ist eine Kirche. Die Kirche ist alt."
next_level_note_vi: "ein/eine ở cách Akkusativ (einen) học ở Kapitel 4; ở Dativ (einem/einer) ở Kapitel 7."
