title_de: 'Konjugation im Präsens: regelmäßige und unregelmäßige Verben'
title_vi: Chia động từ thì hiện tại đầy đủ (số ít và số nhiều)
summary_vi: "Ở Kapitel 1 bạn đã chia động từ với **ich, du, er/sie/es, Sie**. Bây giờ thêm **số nhiều**:\n**wir** (chúng tôi), **ihr** (các bạn – thân mật), **sie** (họ).\n\n**Bảng đuôi đầy đủ** (gốc = nguyên mẫu bỏ -en):\n\n| Người | Đuôi | Ví dụ: spielen |\n|---|---|---|\n| ich | **-e** | ich spiel**e** |\n| du | **-st** | du spiel**st** |\n| er/sie/es | **-t** | er spiel**t** |\n| wir | **-en** | wir spiel**en** |\n| ihr | **-t** | ihr spiel**t** |\n| sie / Sie | **-en** | sie spiel**en** / Sie spiel**en** |\n\n**Mẹo nhớ:** wir, sie, Sie đều giống dạng nguyên mẫu. ihr và er cùng đuôi -t.\n\n**Ba nhóm cần chú ý:**\n1. Gốc tận cùng bằng **-t / -d** (arbeiten, antworten, warten): thêm **e** trước đuôi ở du, er, ihr để dễ đọc → *du arbeit**e**st, er arbeit**e**t, ihr arbeit**e**t*.\n2. Gốc tận cùng bằng **-s, -ß, -z** (reisen, heißen, tanzen): với du chỉ thêm **-t** → *du reist, du heißt, du tanzt*.\n3. **Động từ đổi nguyên âm** (bất quy tắc) – CHỈ ở **du** và **er/sie/es**:\n   - e → i:\
  \ *sprechen → du sprichst, er spricht*; *geben → du gibst, er gibt*\n   - e → ie: *lesen → du liest, er liest*\n   - a → ä: *fahren → du fährst, er fährt*\n\nVà **sein** bất quy tắc hoàn toàn: *ich bin, du bist, er ist, wir sind, ihr seid, sie/Sie sind*."
usage_vi: 'Dùng mỗi khi nói về hành động ở hiện tại (và cả tương lai gần: Morgen spiele ich Tennis). Thì hiện tại tiếng Đức tương ứng cả “I play” và “I am playing” của tiếng Anh.'
objectives:
- id: a1.g.verben-praesens.obj1
  text_vi: Chia động từ thì hiện tại cho mọi ngôi.
  skill: grammar
rules:
- id: a1.g.verben-praesens.r1
  title_vi: Bảng đuôi đầy đủ
  body_vi: 'Đuôi: ich -e, du -st, er/sie/es -t, wir -en, ihr -t, sie/Sie -en.'
  examples:
  - de: wir kochen, ihr kocht, sie kochen
    vi: chúng tôi nấu, các bạn nấu, họ nấu
  - de: Wir wohnen in Köln. Wo wohnt ihr?
    vi: Chúng tôi sống ở Köln. Các bạn sống ở đâu?
- id: a1.g.verben-praesens.r2
  title_vi: Gốc tận cùng -t, -d
  body_vi: 'Gốc tận cùng bằng -t/-d: thêm e ở du, er/sie/es, ihr.'
  examples:
  - de: du arbeitest, er arbeitet, ihr arbeitet
    vi: bạn làm việc, anh ấy làm việc, các bạn làm việc
- id: a1.g.verben-praesens.r3
  title_vi: Gốc tận cùng -s, -ß, -z
  body_vi: 'Gốc tận cùng bằng -s/-ß/-z: du chỉ thêm -t.'
  examples:
  - de: du reist, du heißt, du tanzt
    vi: bạn du lịch, bạn tên là, bạn nhảy
- id: a1.g.verben-praesens.r4
  title_vi: Đổi nguyên âm ở du và er/sie/es
  body_vi: Một số động từ đổi nguyên âm ở du và er/sie/es (e → i, e → ie, a → ä). Các ngôi khác không đổi.
  examples:
  - de: ich lese – du liest – er liest – wir lesen
    vi: tôi đọc – bạn đọc – anh ấy đọc – chúng tôi đọc
  - de: ich fahre – du fährst – er fährt – ihr fahrt
    vi: tôi đi – bạn đi – anh ấy đi – các bạn đi
- id: a1.g.verben-praesens.r5
  title_vi: Chia sein
  body_vi: 'sein: bin, bist, ist, sind, seid, sind.'
  examples:
  - de: Wir sind Studenten. Seid ihr auch Studenten?
    vi: Chúng tôi là sinh viên. Các bạn cũng là sinh viên à?
sentence_structures:
- pattern: wir/sie/Sie + gốc-en
  example:
    de: Wir spielen Fußball.
    vi: Chúng tôi chơi bóng đá.
- pattern: ihr + gốc-t
  example:
    de: Kocht ihr gern?
    vi: Các bạn có thích nấu ăn không?
- pattern: du/er + gốc đổi nguyên âm
  example:
    de: Er fährt nach Wien. Du liest viel.
    vi: Anh ấy đi Viên. Bạn đọc nhiều.
