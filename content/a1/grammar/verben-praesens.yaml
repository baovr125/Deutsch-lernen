exercises:
- id: a1.g.verben-praesens.ex.01
  type: fill-blank
  skill: grammar
  difficulty: 1
  objective_refs:
  - a1.g.verben-praesens.r1
  - a1.g.verben-praesens.r2
  - a1.g.verben-praesens.obj1
  instructions_vi: Chia động từ trong ngoặc.
  items:
  - id: a1.g.verben-praesens.ex.01.q1
    prompt: Wir ___ Deutsch. (lernen)
    answers:
    - lernen
    explanation_vi: wir → -en.
  - id: a1.g.verben-praesens.ex.01.q2
    prompt: ___ ihr gern? (tanzen)
    answers:
    - Tanzt
    explanation_vi: ihr → -t.
  - id: a1.g.verben-praesens.ex.01.q3
    prompt: Sie (họ) ___ in Hamburg. (wohnen)
    answers:
    - wohnen
    explanation_vi: sie số nhiều → -en.
  - id: a1.g.verben-praesens.ex.01.q4
    prompt: Du ___ viel. (arbeiten)
    answers:
    - arbeitest
    explanation_vi: Gốc tận cùng t → arbeitest.
  - id: a1.g.verben-praesens.ex.01.q5
    prompt: Er ___ auf Paul. (warten)
    answers:
    - wartet
    explanation_vi: Gốc tận cùng t → wartet.
- id: a1.g.verben-praesens.ex.02
  type: multiple-choice
  skill: grammar
  difficulty: 2
  objective_refs:
  - a1.g.verben-praesens.r4
  - a1.g.verben-praesens.r5
  - a1.g.verben-praesens.obj1
  instructions_vi: Chọn dạng đúng.
  items:
  - id: a1.g.verben-praesens.ex.02.q1
    prompt: ___ du ein Buch? (lesen)
    options:
    - id: a
      text: Liest
    - id: b
      text: Lest
    - id: c
      text: Lesest
    answer:
    - a
    explanation_vi: 'du: e → ie → liest.'
  - id: a1.g.verben-praesens.ex.02.q2
    prompt: Ihr ___ nach Wien. (fahren)
    options:
    - id: a
      text: fährt
    - id: b
      text: fahren
    - id: c
      text: fahrt
    answer:
    - c
    explanation_vi: ihr không đổi nguyên âm.
  - id: a1.g.verben-praesens.ex.02.q3
    prompt: Wir ___ Studenten. (sein)
    options:
    - id: a
      text: sind
    - id: b
      text: sein
    - id: c
      text: seid
    answer:
    - a
    explanation_vi: wir sind.
  - id: a1.g.verben-praesens.ex.02.q4
    prompt: ___ ihr müde? (sein)
    options:
    - id: a
      text: Ist
    - id: b
      text: Sind
    - id: c
      text: Seid
    answer:
    - c
    explanation_vi: ihr seid. (müde = mệt)
- id: a1.g.verben-praesens.ex.03
  type: true-false
  skill: grammar
  difficulty: 2
  objective_refs:
  - a1.g.verben-praesens.r3
  - a1.g.verben-praesens.r4
  - a1.g.verben-praesens.obj1
  instructions_vi: Đúng hay sai?
  items:
  - id: a1.g.verben-praesens.ex.03.q1
    prompt: „du reist“ là đúng (không phải „du reisst“).
    answer: true
    explanation_vi: Gốc tận cùng bằng s → chỉ thêm t.
  - id: a1.g.verben-praesens.ex.03.q2
    prompt: 'Động từ sprechen đổi nguyên âm ở „wir“: wir sprichen.'
    answer: false
    explanation_vi: 'Chỉ đổi ở du và er/sie/es: wir sprechen.'
