  items:
  - id: a1.g.praeteritum-haben-sein.ex.02.q1
    prompt: Gestern ___ (sein) ein schöner Tag. Wir ___ (haben) frei und ___ (sein) am See.
    answers:
    - war
    - hatten
    - waren
    explanation_vi: 1. ein schöner Tag (es) → war. 2. wir haben frei → wir hatten. 3. wir sind am See → wir waren.
