exercises:
- id: a1.g.ordinalzahlen.ex.01
  type: multiple-choice
  skill: grammar
  difficulty: 1
  objective_refs:
  - a1.g.ordinalzahlen.r1
  - a1.g.ordinalzahlen.obj1
  instructions_vi: Chọn dạng đúng của số thứ tự đi sau am.
  items:
  - id: a1.g.ordinalzahlen.ex.01.q1
    prompt: Wann hast du Geburtstag? – Am ___ (1.) Mai.
    options:
    - id: a
      text: erst
    - id: b
      text: eins
    - id: c
      text: ersten
    - id: d
      text: erste
    answer:
    - c
    explanation_vi: 'Sau am, số thứ tự thêm đuôi -ten: am ersten.'
  - id: a1.g.ordinalzahlen.ex.01.q2
    prompt: Das Konzert ist am ___ (20.) Juli.
    options:
    - id: a
      text: zwanzigste
    - id: b
      text: zwanzig
    - id: c
      text: zwanzigsten
    - id: d
      text: zwanzigster
    answer:
    - c
    explanation_vi: 'Từ 20 trở lên, sau am thêm đuôi -sten: am zwanzigsten.'
  - id: a1.g.ordinalzahlen.ex.01.q3
    prompt: Wir treffen uns am ___ (3.) Oktober.
    options:
    - id: a
      text: dritten
    - id: b
      text: dritte
    - id: c
      text: drei
    - id: d
      text: dreiten
    answer:
    - a
    explanation_vi: 'Số 3 biến đổi bất quy tắc thành dritt- và thêm đuôi -en: am dritten.'
- id: a1.g.ordinalzahlen.ex.02
  type: fill-blank
  skill: grammar
  difficulty: 2
  objective_refs:
  - a1.g.ordinalzahlen.r2
  - a1.g.ordinalzahlen.obj1
  instructions_vi: Điền dạng chữ của số thứ tự vào chỗ trống (am achten, am siebten, am ersten).
  items:
  - id: a1.g.ordinalzahlen.ex.02.q1
    prompt: Der Neujahrstag ist ___ (1.) Januar. Mein Vater hat ___ (7.) März Geburtstag und meine Mutter ___ (8.) August.
    answers:
    - am ersten
    - am siebten
    - am achten
    explanation_vi: 1. am ersten (mùng 1). 2. am siebten (mùng 7). 3. am achten (mùng 8).
