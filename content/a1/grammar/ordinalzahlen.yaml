title_de: Ordinalzahlen und Datumsangaben
title_vi: Số thứ tự và cách nói ngày tháng
summary_vi: "Số thứ tự (Ordinalzahlen) được dùng để nói về ngày tháng (Datum), thứ hạng hoặc ngày sinh nhật trong tiếng Đức.\n\n**1. Quy tắc thành lập số thứ tự:**\n- **Từ 1 đến 19:** Lấy số đếm + **-te** (hoặc **-ten** sau giới từ am):\n  * 1.: *der erste* (bất quy tắc: ein $\\rightarrow$ erst)\n  * 2.: *der zweite*\n  * 3.: *der dritte* (bất quy tắc: drei $\\rightarrow$ dritt)\n  * 4.: *der vierte*\n  * 7.: *der siebte* (chú ý: sieb-te, không phải siebente)\n  * 8.: *der achte* (chỉ thêm -te: acht + e)\n- **Từ 20 trở lên:** Lấy số đếm + **-ste** (hoặc **-sten** sau giới từ am):\n  * 20.: *der zwanzigste*\n  * 21.: *der einundzwanzigste*\n  * 30.: *der dreißigste*\n  * 31.: *der einunddreißigste*\n\n**2. Cách nói ngày trong tháng (Datumsangabe):**\n- Khi có giới từ **am** (vào ngày nào): Đuôi luôn là **-ten** (hoặc **-sten** từ 20 trở lên):\n  * *am ersten Mai* (vào ngày mùng 1 tháng 5)\n  * *am dritten Oktober* (vào ngày mùng 3 tháng 10)\n  * *am zwanzigsten Juli* (vào ngày 20 tháng 7)\n\
  - Trong văn viết, dấu chấm sau con số biểu thị số thứ tự:\n  * *1. Mai* = *der erste Mai* hoặc *am ersten Mai*."
usage_vi: Dùng để nói về ngày sinh nhật, hẹn ngày gặp, ngày lễ và thứ hạng. Đi với am + đuôi -ten / -sten.
objectives:
- id: a1.g.ordinalzahlen.obj1
  text_vi: Đọc và nói số thứ tự và ngày tháng.
  skill: grammar
rules:
- id: a1.g.ordinalzahlen.r1
  title_vi: Đuôi -te và -ste
  body_vi: Số thứ tự từ 1 đến 19 thêm đuôi -te (sau am thêm -ten), từ 20 trở lên thêm đuôi -ste (sau am thêm -sten).
  examples:
  - de: der vierte – am vierten Mai
    vi: ngày 4 – vào ngày 4 tháng 5
  - de: der zwanzigste – am zwanzigsten August
    vi: ngày 20 – vào ngày 20 tháng 8
- id: a1.g.ordinalzahlen.r2
  title_vi: Các số thứ tự bất quy tắc
  body_vi: 'Các dạng bất quy tắc quan trọng: 1. (erst-), 3. (dritt-), 7. (siebt-), 8. (acht-).'
  examples:
  - de: am ersten Januar
    vi: vào ngày mùng 1 tháng 1
  - de: am dritten März
    vi: vào ngày mùng 3 tháng 3
sentence_structures:
- pattern: Wann hast du Geburtstag? – Am + Số thứ tự (-ten/-sten) + Tháng.
  example:
    de: Ich habe am vierten Juli Geburtstag.
    vi: Tôi sinh nhật vào ngày 4 tháng 7.
- pattern: Der wievielte ist heute? – Heute ist der + Số thứ tự (-te/-ste) + Tháng.
  example:
    de: Heute ist der dritte Oktober.
    vi: Hôm nay là ngày 3 tháng 10.
