examples:
- de: Mein Geburtstag ist am fünfzehnten September.
  vi: Sinh nhật của tôi vào ngày 15 tháng 9.
- de: Das Fest findet am zweiten Juni statt.
  vi: Lễ hội diễn ra vào ngày 2 tháng 6.
- de: Vom ersten bis zum zehnten August habe ich Urlaub.
  vi: Từ mùng 1 đến mùng 10 tháng 8 tôi nghỉ phép.
- de: Heute ist der einunddreißigste Dezember, Silvester!
  vi: Hôm nay là ngày 31 tháng 12, đêm giao thừa!
common_mistakes:
- wrong: Ich habe am ein Mai Geburtstag.
  right: Ich habe am ersten Mai Geburtstag.
  explanation_vi: Nói ngày tháng phải dùng số thứ tự sau am (am ersten), không dùng số đếm (am ein).
- wrong: am dreiten Oktober
  right: am dritten Oktober
  explanation_vi: 'Số thứ tự 3 là bất quy tắc: dritt- (không phải dreit-).'
comparison_vi: 'Trong tiếng Anh: dùng hậu tố st, nd, rd, th (1st, 2nd, 3rd, 4th). Trong tiếng Đức: văn viết chỉ đặt một dấu chấm sau số (1., 2., 3., 4.).'
vietnamese_contrast_vi: 'Tiếng Việt nói ''ngày một tháng năm'' dùng số đếm thông thường. Tiếng Đức bắt buộc dùng số thứ tự có biến đuôi: ''am ersten Mai'' (thêm đuôi -ten sau am).'
recap_vi: 'Số thứ tự: 1–19 thêm đuôi -te, từ 20 trở lên thêm đuôi -ste. Khi nói ngày tháng sau giới từ am, tất cả đều thêm đuôi -en (am ersten, am zwanzigsten). Các dạng bất quy tắc: 1. (erst), 3. (dritt), 7. (siebt), 8. (acht).'
next_level_note_vi: Ở trình độ cao hơn, số thứ tự sẽ được học đầy đủ cách chia tính từ khi đứng trước danh từ ở các cách khác nhau (Nominativ, Akkusativ, Dativ, Genitiv).
