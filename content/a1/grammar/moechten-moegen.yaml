examples:
- de: Guten Tag, was möchten Sie bestellen? – Ich möchte ein Hähnchen mit Pommes.
  vi: Xin chào, quý khách muốn gọi món gì? – Tôi muốn một phần gà với khoai tây chiên.
- de: Magst du Kaffee? – Nein, ich trinke lieber Tee.
  vi: Bạn có thích cà phê không? – Không, tôi thích uống trà hơn.
- de: Möchtet ihr noch etwas essen? – Ja, wir möchten eine Pizza.
  vi: Các bạn có muốn ăn thêm gì không? – Có, chúng tôi muốn một chiếc pizza.
- de: Mein Sohn mag keine Suppe.
  vi: Con trai tôi không thích súp.
- de: Was möchtest du zum Frühstück? – Ein Brötchen mit Käse, bitte.
  vi: Bạn muốn dùng gì cho bữa sáng? – Cho tôi một bánh mì nhỏ kẹp phô mai.
common_mistakes:
- wrong: Er möchtet einen Tee.
  right: Er möchte einen Tee.
  explanation_vi: Ngôi er/sie/es của möchten là möchte (giống hệt ich), không thêm đuôi -t.
- wrong: Er magt keinen Fisch.
  right: Er mag keinen Fisch.
  explanation_vi: Ngôi er/sie/es của mögen là mag (giống hệt ich), không chia magt.
- wrong: Ich mag trinken Bier.
  right: Ich trinke gern Bier. / Ich mag Bier.
  explanation_vi: mögen đi với danh từ (Ich mag Bier); khi có động từ hành động thì dùng động từ đó kết hợp với phó từ gern (Ich trinke gern Bier).
comparison_vi: Tiếng Anh dùng 'would like' tương đương với möchten và 'like' tương đương với mögen. 'I would like a coffee' = 'Ich möchte einen Kaffee'; 'I like coffee' = 'Ich mag Kaffee'.
vietnamese_contrast_vi: Tiếng Việt dùng từ 'muốn' và 'thích' không phân biệt danh từ hay động từ đi kèm. Trong tiếng Đức, khi thích làm một việc gì đó (động từ), người Đức ưa chuộng dùng cấu trúc 'động từ + gern' thay vì dùng động từ 'mögen'.
recap_vi: möchten (muốn lịch sự khi gọi món) và mögen (thích danh từ). Cả hai động từ đều có ngôi ich và er/sie/es giống hệt nhau (ich möchte/er möchte; ich mag/er mag). Sau chúng là tân ngữ Akkusativ.
next_level_note_vi: Cấu trúc möchten đi kèm động từ nguyên thể ở cuối câu (khung câu với Modalverb) được mở rộng toàn diện ở Kapitel 5 với các động từ khuyết thiếu können, müssen, dürfen.
