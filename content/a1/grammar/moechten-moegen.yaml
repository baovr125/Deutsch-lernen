title_de: Die Verben möchten und mögen
title_vi: Động từ möchten (muốn) và mögen (thích)
summary_vi: 'Trong giao tiếp hằng ngày, đặc biệt là khi ăn uống, mua sắm hoặc gọi món tại nhà hàng, hai động từ **möchten** và **mögen** được sử dụng rất thường xuyên:


  **1. Động từ möchten (muốn, mong muốn một cách lịch sự):**

  - Về bản chất ngữ pháp, *möchten* là dạng Konjunktiv II lịch sự của động từ *mögen*, nhưng ở trình độ A1 bạn học và dùng nó như một động từ riêng biệt với nghĩa **“tôi muốn / cho tôi xin…”**.

  - Dùng khi gọi món hoặc nêu nguyện vọng: *Ich möchte einen Kaffee, bitte.* (Cho tôi xin một ly cà phê.)

  - Chia động từ: Điểm đặc biệt là ngôi **ich** và ngôi **er/sie/es** có dạng giống hệt nhau: **ich möchte**, **er/sie/es möchte** (không có đuôi -t ở ngôi thứ 3).


  **2. Động từ mögen (thích):**

  - Dùng để diễn tả sở thích đối với một món ăn, đồ uống hoặc sự vật nói chung: *Ich mag Schokolade.* (Tôi thích sô-cô-la.)

  - Ở A1, *mögen* thường đi trực tiếp với một **danh từ (ở cách Akkusativ)**.

  - Chia động từ bất quy tắc: ở số ít nguyên âm đổi từ **ö** thành **a**, và ngôi **ich** cũng giống hệt ngôi **er/sie/es**: **ich mag**, **er/sie/es mag** (không có đuôi chia).


  **3. Phân biệt mögen, möchten và phó từ gern:**

  - *Ich möchte Kaffee.* = Tôi muốn một ly cà phê (ngay lúc này, ví dụ khi đang gọi đồ uống).

  - *Ich mag Kaffee.* = Tôi thích cà phê (sở thích nói chung đối với cà phê).

  - *Ich trinke gern Kaffee.* = Tôi thích uống cà phê (dùng phó từ *gern* bổ nghĩa cho động từ *trinken*).'
usage_vi: möchten dùng để gọi món và đưa ra yêu cầu lịch sự; mögen dùng để nói về sở thích đối với đồ ăn, thức uống hoặc sự vật.
objectives:
- id: a1.g.moechten-moegen.obj1
  text_vi: Nói muốn gì và thích gì bằng möchten và mögen.
  skill: grammar
rules:
- id: a1.g.moechten-moegen.r1
  title_vi: Chia möchten
  body_vi: Động từ möchten có ngôi ich và er/sie/es giống hệt nhau (ich möchte, er möchte). Ngôi du thêm đuôi -st (du möchtest).
  examples:
  - de: Was möchtest du trinken? – Ich möchte einen Tee.
    vi: Bạn muốn uống gì? – Tôi muốn một tách trà.
  - de: Er möchte auch ein Stück Kuchen.
    vi: Anh ấy cũng muốn một miếng bánh ngọt.
- id: a1.g.moechten-moegen.r2
  title_vi: Chia mögen
  body_vi: Động từ mögen đổi nguyên âm ö → a ở số ít, và ngôi ich cùng er/sie/es đều là mag (không thêm đuôi -t).
  examples:
  - de: Magst du Gemüse? – Ja, ich mag Karotten und Tomaten.
    vi: Bạn có thích rau củ không? – Có, tôi thích cà rốt và cà chua.
  - de: Sie mag keinen Fisch.
    vi: Cô ấy không thích cá.
- id: a1.g.moechten-moegen.r3
  title_vi: Tân ngữ ở Akkusativ
  body_vi: Sau möchten và mögen, danh từ đóng vai trò tân ngữ trực tiếp và phải ở cách Akkusativ.
  examples:
  - de: Ich möchte einen Apfel (m).
    vi: Tôi muốn một quả táo.
  - de: Wir mögen den Salat (m) hier sehr.
    vi: Chúng tôi rất thích món salad ở đây.
sentence_structures:
- pattern: Chủ ngữ + möchten + Tân ngữ (Akkusativ) + (bitte).
  example:
    de: Ich möchte ein Glas Wasser, bitte.
    vi: Cho tôi xin một ly nước.
- pattern: Chủ ngữ + mögen + Tân ngữ (Akkusativ).
  example:
    de: Er mag keinen Käse.
    vi: Anh ấy không thích phô mai.
