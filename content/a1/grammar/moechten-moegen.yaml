exercises:
- id: a1.g.moechten-moegen.ex.01
  type: multiple-choice
  skill: grammar
  difficulty: 1
  objective_refs:
  - a1.g.moechten-moegen.r1
  - a1.g.moechten-moegen.r2
  - a1.g.moechten-moegen.obj1
  instructions_vi: Chọn dạng đúng của möchten hoặc mögen điền vào chỗ trống.
  items:
  - id: a1.g.moechten-moegen.ex.01.q1
    prompt: Was ___ du trinken? (möchten)
    options:
    - id: a
      text: möchte
    - id: b
      text: möchtet
    - id: c
      text: möchtest
    - id: d
      text: magst
    answer:
    - c
    explanation_vi: Chủ ngữ du → chia möchten là du möchtest.
  - id: a1.g.moechten-moegen.ex.01.q2
    prompt: Er ___ keine Bananen. (mögen)
    options:
    - id: a
      text: mögt
    - id: b
      text: magt
    - id: c
      text: mag
    - id: d
      text: magst
    answer:
    - c
    explanation_vi: Chủ ngữ er → chia mögen là mag (giống ich, không có đuôi -t).
  - id: a1.g.moechten-moegen.ex.01.q3
    prompt: Frau Müller, ___ Sie noch Kaffee? (möchten)
    options:
    - id: a
      text: möchten
    - id: b
      text: möchte
    - id: c
      text: möchtest
    - id: d
      text: mögt
    answer:
    - a
    explanation_vi: Chủ ngữ Sie lịch sự → möchten.
  - id: a1.g.moechten-moegen.ex.01.q4
    prompt: Wir ___ den Käsekuchen hier sehr. (mögen)
    options:
    - id: a
      text: möchten
    - id: b
      text: mag
    - id: c
      text: mögt
    - id: d
      text: mögen
    answer:
    - d
    explanation_vi: Chủ ngữ wir → mögen.
- id: a1.g.moechten-moegen.ex.02
  type: fill-blank
  skill: grammar
  difficulty: 2
  objective_refs:
  - a1.g.moechten-moegen.r1
  - a1.g.moechten-moegen.r3
  - a1.g.moechten-moegen.obj1
  instructions_vi: Điền dạng chia đúng của möchten hoặc dạng mạo từ thích hợp.
  items:
  - id: a1.g.moechten-moegen.ex.02.q1
    prompt: Ich ___ (möchten) einen Apfelsaft, bitte.
    answers:
    - möchte
    explanation_vi: Ngôi ich chia là möchte.
  - id: a1.g.moechten-moegen.ex.02.q2
    prompt: Peter ___ (möchten) einen Salat bestellen.
    answers:
    - möchte
    explanation_vi: Ngôi Peter (er) chia là möchte.
  - id: a1.g.moechten-moegen.ex.02.q3
    prompt: Ich möchte ___ (der) Kaffee und ein Wasser.
    answers:
    - den
    explanation_vi: der Kaffee ở Akkusativ đổi thành den Kaffee.
