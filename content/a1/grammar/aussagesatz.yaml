- id: a1.g.aussagesatz.ex.02
  type: true-false
  skill: grammar
  difficulty: 2
  objective_refs:
  - a1.g.aussagesatz.r1
  - a1.g.aussagesatz.r3
  - a1.g.aussagesatz.obj1
  instructions_vi: Câu có đúng trật tự từ không?
  items:
  - id: a1.g.aussagesatz.ex.02.q1
    prompt: Ich Deutsch spreche.
    answer: false
    explanation_vi: 'Đúng phải là: Ich spreche Deutsch.'
  - id: a1.g.aussagesatz.ex.02.q2
    prompt: Er kommt aus Polen und wohnt in Köln.
    answer: true
    explanation_vi: Hai câu kể nối bằng und, động từ đều ở vị trí 2 (câu sau lược chủ ngữ).
  - id: a1.g.aussagesatz.ex.02.q3
    prompt: Das ist Herr Braun.
    answer: true
    explanation_vi: Das (1) – ist (2) – Herr Braun.
