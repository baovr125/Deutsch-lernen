id: g-a1-aussagesatz
level: A1
title_de: "Der Aussagesatz: Das Verb auf Position 2"
title_vi: "Câu kể: động từ ở vị trí thứ 2"
introduced_in: a1-k01-l03
source:
  type: netzwerk-neu
  kapitel: 1
  sections: ["Woher kommen Sie?"]
  note_vi: "Tương ứng Grammatik „Aussagesatz“ của Kapitel 1."
prerequisites: [g-a1-verben-singular]
explanation_vi: |
  **Câu kể** (Aussagesatz) là câu dùng để nói, kể, cung cấp thông tin – kết thúc bằng dấu chấm.

  **Quy tắc vàng của tiếng Đức:** trong câu kể, **động từ đã chia luôn ở vị trí 2**.

  "Vị trí" không phải là "từ thứ mấy", mà là **khối nghĩa**. Một vị trí có thể gồm nhiều từ:

  | Vị trí 1 | Vị trí 2 (động từ) | Phần còn lại |
  |---|---|---|
  | Ich | komme | aus Vietnam. |
  | Mein Name | ist | Hoa. |
  | Frau Weber | wohnt | in Berlin. |

  Ở Kapitel 1, vị trí 1 thường là **chủ ngữ** (ai/cái gì làm hành động). Ở Kapitel 4, bạn sẽ học rằng vị trí 1
  cũng có thể là thông tin khác (ví dụ thời gian) – nhưng động từ **vẫn ở vị trí 2**.
usage_vi: "Dùng để giới thiệu bản thân, trả lời W-Fragen bằng câu đầy đủ, kể về người khác."
structure:
  - pattern: "Subjekt (1) + Verb (2) + Ergänzung."
    example_de: "Ich wohne in Hanoi."
    example_vi: "Tôi sống ở Hà Nội."
  - pattern: "[Cụm chủ ngữ nhiều từ] (1) + Verb (2) + …"
    example_de: "Mein Vorname ist Linh."
    example_vi: "Tên tôi là Linh."
rules:
  - rule_vi: "Động từ chia luôn đứng ở vị trí 2 trong câu kể."
    examples:
      - { de: "Ich spreche Vietnamesisch.", vi: "Tôi nói tiếng Việt." }
      - { de: "Paul kommt aus Deutschland.", vi: "Paul đến từ Đức." }
  - rule_vi: "Một vị trí có thể gồm nhiều từ (ví dụ Mein Name, Frau Weber). Đếm vị trí theo khối nghĩa, không theo số từ."
    examples:
      - { de: "Mein Name ist Hoa.", vi: "Tên tôi là Hoa.", note_vi: "Vị trí 1 = Mein Name (2 từ)." }
      - { de: "Herr Klein wohnt in Wien.", vi: "Ông Klein sống ở Viên.", note_vi: "Vị trí 1 = Herr Klein." }
  - rule_vi: "Có thể nối hai câu kể bằng und; sau und, câu thứ hai vẫn có động từ ở vị trí 2 (und không tính là một vị trí)."
    examples:
      - { de: "Ich heiße Minh und ich wohne in Leipzig.", vi: "Tôi tên là Minh và tôi sống ở Leipzig." }
      - { de: "Sie kommt aus Polen und spricht Polnisch.", vi: "Cô ấy đến từ Ba Lan và nói tiếng Ba Lan.", note_vi: "Khi chủ ngữ giống nhau có thể bỏ chủ ngữ thứ hai." }
tables:
  - title_vi: "So sánh câu kể và W-Frage"
    columns: ["Loại câu", "Vị trí 1", "Vị trí 2", "Phần còn lại"]
    rows:
      - ["Câu kể", "Ich", "wohne", "in Hamburg."]
      - ["W-Frage", "Wo", "wohnst", "du?"]
      - ["Câu kể", "Das", "ist", "Frau Lang."]
      - ["W-Frage", "Wer", "ist", "das?"]
    note_vi: "Trong cả hai loại câu, động từ đều ở vị trí 2."
examples:
  - { de: "Ich heiße Lan.", vi: "Tôi tên là Lan." }
  - { de: "Ich komme aus Vietnam.", vi: "Tôi đến từ Việt Nam." }
  - { de: "Mein Nachname ist Pham.", vi: "Họ của tôi là Phạm." }
  - { de: "Er wohnt in Hamburg und spricht Englisch.", vi: "Anh ấy sống ở Hamburg và nói tiếng Anh." }
  - { de: "Das ist Frau Becker.", vi: "Đây là bà Becker." }
common_mistakes:
  - wrong: "Ich aus Vietnam komme."
    right: "Ich komme aus Vietnam."
    explanation_vi: "Động từ phải ở vị trí 2, ngay sau chủ ngữ ở câu này."
  - wrong: "Ich Vietnamesisch spreche."
    right: "Ich spreche Vietnamesisch."
    explanation_vi: "Tiếng Việt có thể đảo “Tiếng Việt thì tôi nói”, nhưng động từ tiếng Đức không được rời vị trí 2."
  - wrong: "Mein Name Hoa ist."
    right: "Mein Name ist Hoa."
    explanation_vi: "Mein Name là một khối (vị trí 1), động từ ist phải đứng ngay sau."
comparison_vi: "So sánh với W-Frage: câu kể và W-Frage có cùng quy tắc động từ ở vị trí 2. Khác ở vị trí 1: câu kể thường là chủ ngữ, W-Frage là từ để hỏi."
vietnamese_contrast_vi: "Ở Kapitel 1, câu kể tiếng Đức giống tiếng Việt (Chủ ngữ – Động từ – …): “Tôi đến từ Việt Nam” = “Ich komme aus Vietnam”. Khác biệt lớn xuất hiện ở Kapitel 4: tiếng Việt nói “Hôm nay tôi học”, tiếng Đức phải nói “Heute lerne ich” (động từ vẫn ở vị trí 2, chủ ngữ ra sau) – hãy nhớ trước quy tắc vị trí 2 để không bị bất ngờ."
exercises:
  - id: g-a1-aussagesatz-ex01
    type: ordering
    skill: grammar
    objectives: [r1, r2]
    difficulty: 1
    instructions_vi: "Sắp xếp thành câu kể đúng."
    items:
      - { id: q1, tokens: ["aus", "Ich", "komme", "Vietnam"], answer: "Ich komme aus Vietnam.", explanation_vi: "Ich (1) – komme (2) – aus Vietnam." }
      - { id: q2, tokens: ["ist", "Name", "Mein", "Hoa"], answer: "Mein Name ist Hoa.", explanation_vi: "Mein Name (1) – ist (2) – Hoa." }
      - { id: q3, tokens: ["Berlin", "in", "wohnt", "Frau", "Weber"], answer: "Frau Weber wohnt in Berlin.", explanation_vi: "Frau Weber (1) – wohnt (2) – in Berlin." }
  - id: g-a1-aussagesatz-ex02
    type: true-false
    skill: grammar
    objectives: [r1, r3]
    difficulty: 2
    instructions_vi: "Câu có đúng trật tự từ không?"
    items:
      - { id: q1, prompt: "Ich Deutsch spreche.", answer: false, explanation_vi: "Đúng phải là: Ich spreche Deutsch." }
      - { id: q2, prompt: "Er kommt aus Polen und wohnt in Köln.", answer: true, explanation_vi: "Hai câu kể nối bằng und, động từ đều ở vị trí 2 (câu sau lược chủ ngữ)." }
      - { id: q3, prompt: "Das ist Herr Braun.", answer: true, explanation_vi: "Das (1) – ist (2) – Herr Braun." }
summary_vi: "Câu kể: động từ chia ở vị trí 2. Một vị trí có thể gồm nhiều từ (Mein Name, Frau Weber). und không tính là một vị trí."
next_level_note_vi: "Đưa thông tin khác lên vị trí 1 (Heute lerne ich…) và các khung câu (Satzklammer) học ở Kapitel 4, 5, 6 và 10."
