id: g-a1-verben-praesens
level: A1
title_de: "Konjugation im Präsens: regelmäßige und unregelmäßige Verben"
title_vi: "Chia động từ thì hiện tại đầy đủ (số ít và số nhiều)"
introduced_in: a1-k02-l02
source:
  type: netzwerk-neu
  kapitel: 2
  sections: ["Meine Hobbys, meine Freunde"]
  note_vi: "Tương ứng Grammatik „Konjugation regelmäßige und unregelmäßige Verben“ của Kapitel 2."
prerequisites: [g-a1-verben-singular]
explanation_vi: |
  Ở Kapitel 1 bạn đã chia động từ với **ich, du, er/sie/es, Sie**. Bây giờ thêm **số nhiều**:
  **wir** (chúng tôi), **ihr** (các bạn – thân mật), **sie** (họ).

  **Bảng đuôi đầy đủ** (gốc = nguyên mẫu bỏ -en):

  | Người | Đuôi | Ví dụ: spielen |
  |---|---|---|
  | ich | **-e** | ich spiel**e** |
  | du | **-st** | du spiel**st** |
  | er/sie/es | **-t** | er spiel**t** |
  | wir | **-en** | wir spiel**en** |
  | ihr | **-t** | ihr spiel**t** |
  | sie / Sie | **-en** | sie spiel**en** / Sie spiel**en** |

  **Mẹo nhớ:** wir, sie, Sie đều giống dạng nguyên mẫu. ihr và er cùng đuôi -t.

  **Ba nhóm cần chú ý:**
  1. Gốc tận cùng bằng **-t / -d** (arbeiten, antworten, warten): thêm **e** trước đuôi ở du, er, ihr để dễ đọc → *du arbeit**e**st, er arbeit**e**t, ihr arbeit**e**t*.
  2. Gốc tận cùng bằng **-s, -ß, -z** (reisen, heißen, tanzen): với du chỉ thêm **-t** → *du reist, du heißt, du tanzt*.
  3. **Động từ đổi nguyên âm** (bất quy tắc) – CHỈ ở **du** và **er/sie/es**:
     - e → i: *sprechen → du sprichst, er spricht*; *geben → du gibst, er gibt*
     - e → ie: *lesen → du liest, er liest*
     - a → ä: *fahren → du fährst, er fährt*

  Và **sein** bất quy tắc hoàn toàn: *ich bin, du bist, er ist, wir sind, ihr seid, sie/Sie sind*.
usage_vi: "Dùng mỗi khi nói về hành động ở hiện tại (và cả tương lai gần: Morgen spiele ich Tennis). Thì hiện tại tiếng Đức tương ứng cả “I play” và “I am playing” của tiếng Anh."
structure:
  - pattern: "wir/sie/Sie + gốc-en"
    example_de: "Wir spielen Fußball."
    example_vi: "Chúng tôi chơi bóng đá."
  - pattern: "ihr + gốc-t"
    example_de: "Kocht ihr gern?"
    example_vi: "Các bạn có thích nấu ăn không?"
  - pattern: "du/er + gốc đổi nguyên âm"
    example_de: "Er fährt nach Wien. Du liest viel."
    example_vi: "Anh ấy đi Viên. Bạn đọc nhiều."
rules:
  - rule_vi: "Đuôi: ich -e, du -st, er/sie/es -t, wir -en, ihr -t, sie/Sie -en."
    examples:
      - { de: "wir kochen, ihr kocht, sie kochen", vi: "chúng tôi nấu, các bạn nấu, họ nấu" }
      - { de: "Wir wohnen in Köln. Wo wohnt ihr?", vi: "Chúng tôi sống ở Köln. Các bạn sống ở đâu?" }
  - rule_vi: "Gốc tận cùng bằng -t/-d: thêm e ở du, er/sie/es, ihr."
    examples:
      - { de: "du arbeitest, er arbeitet, ihr arbeitet", vi: "bạn làm việc, anh ấy làm việc, các bạn làm việc" }
  - rule_vi: "Gốc tận cùng bằng -s/-ß/-z: du chỉ thêm -t."
    examples:
      - { de: "du reist, du heißt, du tanzt", vi: "bạn du lịch, bạn tên là, bạn nhảy" }
  - rule_vi: "Một số động từ đổi nguyên âm ở du và er/sie/es (e → i, e → ie, a → ä). Các ngôi khác không đổi."
    examples:
      - { de: "ich lese – du liest – er liest – wir lesen", vi: "tôi đọc – bạn đọc – anh ấy đọc – chúng tôi đọc" }
      - { de: "ich fahre – du fährst – er fährt – ihr fahrt", vi: "tôi đi – bạn đi – anh ấy đi – các bạn đi" }
  - rule_vi: "sein: bin, bist, ist, sind, seid, sind."
    examples:
      - { de: "Wir sind Studenten. Seid ihr auch Studenten?", vi: "Chúng tôi là sinh viên. Các bạn cũng là sinh viên à?" }
tables:
  - title_vi: "Bảng chia động từ thì hiện tại"
    columns: ["", "spielen", "arbeiten", "sprechen", "lesen", "fahren", "sein"]
    rows:
      - ["ich", "spiele", "arbeite", "spreche", "lese", "fahre", "bin"]
      - ["du", "spielst", "arbeitest", "sprichst", "liest", "fährst", "bist"]
      - ["er/sie/es", "spielt", "arbeitet", "spricht", "liest", "fährt", "ist"]
      - ["wir", "spielen", "arbeiten", "sprechen", "lesen", "fahren", "sind"]
      - ["ihr", "spielt", "arbeitet", "sprecht", "lest", "fahrt", "seid"]
      - ["sie/Sie", "spielen", "arbeiten", "sprechen", "lesen", "fahren", "sind"]
    note_vi: "Chú ý: ihr sprecht, ihr lest, ihr fahrt – KHÔNG đổi nguyên âm ở ihr."
examples:
  - { de: "Wir kochen am Wochenende Spaghetti.", vi: "Cuối tuần chúng tôi nấu mì Ý." }
  - { de: "Joggt ihr morgen auch?", vi: "Ngày mai các bạn cũng chạy bộ chứ?" }
  - { de: "Lisa und Paul tanzen gern.", vi: "Lisa và Paul thích nhảy." }
  - { de: "Was arbeitest du?", vi: "Bạn làm nghề gì?" }
  - { de: "Er liest ein Buch und sie fährt nach Hause.", vi: "Anh ấy đọc sách còn cô ấy về nhà (bằng xe)." }
common_mistakes:
  - wrong: "Wir spielt Fußball."
    right: "Wir spielen Fußball."
    explanation_vi: "wir luôn đi với -en."
  - wrong: "Du arbeitst viel."
    right: "Du arbeitest viel."
    explanation_vi: "Gốc tận cùng bằng t → thêm e: arbeitest."
  - wrong: "Ihr fährt nach Berlin."
    right: "Ihr fahrt nach Berlin."
    explanation_vi: "Đổi nguyên âm chỉ ở du và er/sie/es, không ở ihr."
  - wrong: "Ich lies gern."
    right: "Ich lese gern."
    explanation_vi: "ich không đổi nguyên âm."
comparison_vi: "So sánh ba dạng giống nhau về chữ: “sie spielt” (cô ấy chơi) – “sie spielen” (họ chơi) – “Sie spielen” (ông/bà chơi). Phân biệt nhờ đuôi động từ và chữ hoa S."
vietnamese_contrast_vi: "Tiếng Việt chỉ thêm “đang”, “sẽ” khi cần và không bao giờ đổi động từ. Tiếng Đức đổi đuôi cho cả 6 ngôi. Mẹo cho người Việt: học thuộc bảng theo NHỊP: “-e, -st, -t, -en, -t, -en” và luyện nói to với 2–3 động từ mỗi ngày."
exercises:
  - id: g-a1-verben-praesens-ex01
    type: gap-fill
    skill: grammar
    objectives: [r1, r2]
    difficulty: 1
    instructions_vi: "Chia động từ trong ngoặc."
    items:
      - { id: q1, prompt: "Wir ___ Deutsch. (lernen)", answer: ["lernen"], explanation_vi: "wir → -en." }
      - { id: q2, prompt: "___ ihr gern? (tanzen)", answer: ["Tanzt"], explanation_vi: "ihr → -t." }
      - { id: q3, prompt: "Sie (họ) ___ in Hamburg. (wohnen)", answer: ["wohnen"], explanation_vi: "sie số nhiều → -en." }
      - { id: q4, prompt: "Du ___ viel. (arbeiten)", answer: ["arbeitest"], explanation_vi: "Gốc tận cùng t → arbeitest." }
      - { id: q5, prompt: "Er ___ auf Paul. (warten)", answer: ["wartet"], explanation_vi: "Gốc tận cùng t → wartet." }
  - id: g-a1-verben-praesens-ex02
    type: multiple-choice
    skill: grammar
    objectives: [r4, r5]
    difficulty: 2
    instructions_vi: "Chọn dạng đúng."
    items:
      - { id: q1, prompt: "___ du ein Buch? (lesen)", options: ["Lest", "Liest", "Lesest"], answer: "Liest", explanation_vi: "du: e → ie → liest." }
      - { id: q2, prompt: "Ihr ___ nach Wien. (fahren)", options: ["fahrt", "fährt", "fahren"], answer: "fahrt", explanation_vi: "ihr không đổi nguyên âm." }
      - { id: q3, prompt: "Wir ___ Studenten. (sein)", options: ["sind", "seid", "sein"], answer: "sind", explanation_vi: "wir sind." }
      - { id: q4, prompt: "___ ihr müde? (sein)", options: ["Seid", "Sind", "Ist"], answer: "Seid", explanation_vi: "ihr seid. (müde = mệt)" }
  - id: g-a1-verben-praesens-ex03
    type: true-false
    skill: grammar
    objectives: [r3, r4]
    difficulty: 2
    instructions_vi: "Đúng hay sai?"
    items:
      - { id: q1, prompt: "„du reist“ là đúng (không phải „du reisst“).", answer: true, explanation_vi: "Gốc tận cùng bằng s → chỉ thêm t." }
      - { id: q2, prompt: "Động từ sprechen đổi nguyên âm ở „wir“: wir sprichen.", answer: false, explanation_vi: "Chỉ đổi ở du và er/sie/es: wir sprechen." }
summary_vi: "Đuôi: -e, -st, -t, -en, -t, -en. Gốc -t/-d thêm e (du arbeitest). Gốc -s/-ß/-z: du -t (du reist). Đổi nguyên âm chỉ ở du và er/sie/es (sprichst, liest, fährt). sein: bin, bist, ist, sind, seid, sind."
next_level_note_vi: "Động từ tách (Kapitel 6), động từ khuyết thiếu (Kapitel 5) và các động từ đổi nguyên âm khác sẽ học dần."
