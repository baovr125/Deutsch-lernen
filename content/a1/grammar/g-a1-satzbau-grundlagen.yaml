id: g-a1-satzbau-grundlagen
level: A1
title_de: "Grundlagen: Nomen, Artikel, Verb, Satz"
title_vi: "Những điều cơ bản về câu tiếng Đức"
introduced_in: a1-u00-l04
source:
  type: supplement
  note_vi: "Nội dung nhập môn bổ sung cho người bắt đầu từ con số 0; không thuộc một Kapitel cụ thể của Netzwerk neu A1."
prerequisites: []
explanation_vi: |
  Trước khi học bài đầu tiên, bạn cần biết **5 đặc điểm** làm tiếng Đức khác hẳn tiếng Việt.
  Bạn chưa cần thuộc hết các quy tắc chi tiết – chỉ cần *nhận ra* chúng khi đọc ví dụ.
  Mỗi đặc điểm sẽ được học kỹ trong các Kapitel sau.

  1. **Danh từ luôn viết hoa chữ cái đầu**, ở bất kỳ vị trí nào trong câu: *der Kaffee, das Hotel, die Musik*.
  2. **Mỗi danh từ có một "giống"**: giống đực (*der*), giống cái (*die*) hoặc giống trung (*das*).
     Giống là đặc điểm ngữ pháp, **không** phụ thuộc vào nghĩa. Vì vậy luôn học danh từ **cùng mạo từ**.
  3. **Động từ thay đổi theo người** (gọi là *chia động từ*): *ich bin* (tôi là), *du bist* (bạn là).
     Tiếng Việt nói "tôi là", "bạn là" – động từ "là" không đổi; tiếng Đức thì đổi.
  4. **Trong câu kể, động từ đứng ở vị trí thứ 2**: *Ich **heiße** Minh.*
  5. **Có hai cách nói "bạn"**: *du* (thân mật) và *Sie* (trang trọng, luôn viết hoa).
usage_vi: "Áp dụng cho mọi câu tiếng Đức. Ở phần nhập môn, chỉ cần nhận biết; các bài trong Kapitel 1 sẽ luyện tập từng điểm."
structure:
  - pattern: "Danh từ = Mạo từ + Danh từ viết hoa"
    example_de: "der Kaffee · die Pizza · das Hotel"
    example_vi: "cà phê · bánh pizza · khách sạn"
  - pattern: "Câu kể = [Vị trí 1] + ĐỘNG TỪ (vị trí 2) + …"
    example_de: "Ich heiße Minh."
    example_vi: "Tôi tên là Minh."
rules:
  - rule_vi: "Danh từ luôn viết hoa chữ cái đầu. Đại từ (ich, du), động từ, tính từ thì viết thường (trừ khi đứng đầu câu)."
    examples:
      - { de: "Das ist der Tee.", vi: "Đây là trà.", note_vi: "Tee là danh từ → viết hoa." }
      - { de: "Die Musik ist gut.", vi: "Âm nhạc hay.", note_vi: "gut là tính từ → viết thường." }
  - rule_vi: "Mỗi danh từ có một giống: der (giống đực), die (giống cái), das (giống trung). Số nhiều của mọi giống đều dùng die. Giống không đoán được từ nghĩa, nên phải học thuộc cùng danh từ."
    examples:
      - { de: "der Kaffee – die Pizza – das Taxi", vi: "cà phê – bánh pizza – xe taxi" }
      - { de: "das Mädchen", vi: "cô bé", note_vi: "Chỉ một cô gái nhưng lại là giống TRUNG – bằng chứng giống ngữ pháp không theo nghĩa." }
  - rule_vi: "Động từ thay đổi hình thức theo chủ ngữ (ich, du, …). Dạng gốc trong từ điển gọi là động từ nguyên mẫu, thường tận cùng bằng -en."
    examples:
      - { de: "sein → ich bin, du bist", vi: "là → tôi là, bạn là" }
      - { de: "heißen → ich heiße, du heißt", vi: "tên là → tôi tên là, bạn tên là" }
  - rule_vi: "Trong câu kể (câu trần thuật), động từ đã chia luôn đứng ở vị trí thứ 2."
    examples:
      - { de: "Ich bin Lan.", vi: "Tôi là Lan." }
      - { de: "Das ist das Hotel.", vi: "Đây là khách sạn." }
  - rule_vi: "Có hai cách xưng hô với người đối diện: du (thân mật) và Sie (trang trọng). Sie luôn viết hoa."
    examples:
      - { de: "Bist du Anna?", vi: "Bạn là Anna à?", note_vi: "thân mật" }
      - { de: "Sind Sie Frau Weber?", vi: "Bà có phải là bà Weber không ạ?", note_vi: "trang trọng" }
tables:
  - title_vi: "Ba giống của danh từ"
    columns: ["Giống", "Mạo từ xác định", "Ví dụ"]
    rows:
      - ["giống đực (maskulin)", "der", "der Kaffee, der Tee"]
      - ["giống cái (feminin)", "die", "die Pizza, die Musik"]
      - ["giống trung (neutral)", "das", "das Hotel, das Taxi, das Internet"]
      - ["số nhiều (mọi giống)", "die", "die Hotels, die Taxis"]
    note_vi: "Mạo từ xác định (der/die/das) tương đương “the” trong tiếng Anh. Mạo từ không xác định (ein/eine) học ở Kapitel 3."
examples:
  - { de: "Das ist der Kaffee.", vi: "Đây là cà phê." }
  - { de: "Ich bin Lan.", vi: "Tôi là Lan." }
  - { de: "Du bist Tom.", vi: "Bạn là Tom." }
  - { de: "Hallo, ich heiße Minh.", vi: "Xin chào, tôi tên là Minh." }
  - { de: "Die Pizza ist gut.", vi: "Bánh pizza ngon." }
common_mistakes:
  - wrong: "Das ist der kaffee."
    right: "Das ist der Kaffee."
    explanation_vi: "Danh từ phải viết hoa. Lỗi rất hay gặp vì tiếng Việt chỉ viết hoa tên riêng."
  - wrong: "Ich Lan."
    right: "Ich bin Lan."
    explanation_vi: "Tiếng Việt có thể lược “là” (“Tôi Lan đây”), tiếng Đức thì câu bắt buộc có động từ."
  - wrong: "Ich heißen Minh."
    right: "Ich heiße Minh."
    explanation_vi: "Động từ phải chia theo chủ ngữ: với ich thường tận cùng -e."
  - wrong: "Kaffee"
    right: "der Kaffee"
    explanation_vi: "Học danh từ mà không học mạo từ thì sau này không dùng đúng được. Luôn ghi vào sổ từ: der Kaffee, die Kaffees."
comparison_vi: "So với tiếng Anh: tiếng Anh chỉ có một mạo từ xác định “the” và động từ gần như không chia (I am, you are là ngoại lệ). Tiếng Đức có ba mạo từ theo giống và chia động từ cho mọi ngôi. Điểm giống tiếng Anh: câu kể thường có dạng Chủ ngữ – Động từ – …"
vietnamese_contrast_vi: "Tiếng Việt không có giống ngữ pháp, không chia động từ và chỉ viết hoa tên riêng. Có một điểm tương tự giúp dễ nhớ: tiếng Việt có loại từ (cái, con, chiếc, quyển…) và bạn phải biết danh từ nào đi với loại từ nào (con mèo, cái bàn, quyển sách). Tiếng Đức cũng vậy – mỗi danh từ đi với một mạo từ cố định (der/die/das) – nhưng khác ở chỗ không thể đoán theo nghĩa."
exercises:
  - id: g-a1-satzbau-grundlagen-ex01
    type: multiple-choice
    skill: grammar
    objectives: [r1]
    difficulty: 1
    instructions_vi: "Chọn câu viết đúng chính tả."
    items:
      - id: q1
        prompt: "Câu nào đúng?"
        options: ["Das ist der kaffee.", "Das ist der Kaffee.", "das ist der kaffee."]
        answer: "Das ist der Kaffee."
        explanation_vi: "Đầu câu viết hoa (Das) và danh từ viết hoa (Kaffee)."
      - id: q2
        prompt: "Câu nào đúng?"
        options: ["Die Musik ist Gut.", "die musik ist gut.", "Die Musik ist gut."]
        answer: "Die Musik ist gut."
        explanation_vi: "Musik là danh từ → viết hoa; gut là tính từ → viết thường."
  - id: g-a1-satzbau-grundlagen-ex02
    type: gap-fill
    skill: grammar
    objectives: [r2]
    difficulty: 1
    instructions_vi: "Điền mạo từ der, die hoặc das. Bạn đã gặp các từ này ở bài 2 phần nhập môn."
    items:
      - { id: q1, prompt: "___ Hotel", answer: ["das"], explanation_vi: "das Hotel – giống trung." }
      - { id: q2, prompt: "___ Pizza", answer: ["die"], explanation_vi: "die Pizza – giống cái." }
      - { id: q3, prompt: "___ Kaffee", answer: ["der"], explanation_vi: "der Kaffee – giống đực." }
      - { id: q4, prompt: "___ Taxi", answer: ["das"], explanation_vi: "das Taxi – giống trung." }
      - { id: q5, prompt: "___ Musik", answer: ["die"], explanation_vi: "die Musik – giống cái." }
  - id: g-a1-satzbau-grundlagen-ex03
    type: true-false
    skill: grammar
    objectives: [r3, r4, r5]
    difficulty: 1
    instructions_vi: "Đúng (richtig) hay sai (falsch)?"
    items:
      - { id: q1, prompt: "Trong câu “Ich bin Lan.”, động từ đứng ở vị trí thứ 2.", answer: true, explanation_vi: "Ich (1) – bin (2) – Lan." }
      - { id: q2, prompt: "Động từ tiếng Đức không thay đổi theo chủ ngữ, giống tiếng Việt.", answer: false, explanation_vi: "Có thay đổi: ich bin, du bist." }
      - { id: q3, prompt: "Khi nói chuyện trang trọng, ta dùng “Sie” và luôn viết hoa.", answer: true, explanation_vi: "Sie (trang trọng) luôn viết hoa chữ S." }
      - { id: q4, prompt: "Số nhiều của danh từ giống trung dùng mạo từ “das”.", answer: false, explanation_vi: "Số nhiều của mọi giống đều dùng die: die Hotels." }
summary_vi: "Danh từ viết hoa và luôn đi kèm mạo từ (der/die/das). Động từ chia theo chủ ngữ và đứng ở vị trí 2 trong câu kể. Xưng hô có hai dạng: du (thân mật) và Sie (trang trọng)."
next_level_note_vi: "Cách (Nominativ, Akkusativ…), mạo từ không xác định và câu hỏi Ja/Nein sẽ được học dần trong các Kapitel 2–4."
