id: g-a1-haben-sein
level: A1
title_de: "Die Verben haben und sein"
title_vi: "Hai động từ quan trọng nhất: haben và sein"
introduced_in: a1-k02-l05
source:
  type: netzwerk-neu
  kapitel: 2
  sections: ["Mein Beruf"]
  note_vi: "Tương ứng Grammatik „Verben haben und sein“ của Kapitel 2."
prerequisites: [g-a1-verben-praesens]
explanation_vi: |
  **sein** (là, thì, ở) và **haben** (có) là hai động từ dùng nhiều nhất trong tiếng Đức. Cả hai đều **bất quy tắc**.

  | | sein | haben |
  |---|---|---|
  | ich | bin | habe |
  | du | bist | **hast** |
  | er/sie/es | ist | **hat** |
  | wir | sind | haben |
  | ihr | seid | habt |
  | sie/Sie | sind | haben |

  **haben** chỉ bất quy tắc ở *du hast, er hat* (mất chữ b).

  **Khi nào dùng sein, khi nào dùng haben?**
  - **sein** + tên, nghề, quốc tịch, tính chất, **tuổi**: *Ich bin Lan. Er ist Arzt. Das Auto ist neu. Ich bin 22 (Jahre alt).*
  - **haben** + danh từ (vật sở hữu, thời gian, công việc…): *Ich habe ein Auto. Wir haben am Montag frei. Sie hat drei Kurse.*
usage_vi: "Hai động từ này xuất hiện trong gần như mọi câu giới thiệu và mô tả. Sau này (Kapitel 10) chúng còn là trợ động từ để tạo thì quá khứ Perfekt."
structure:
  - pattern: "Subjekt + sein + tên/nghề/tính từ/tuổi"
    example_de: "Sie ist 30 Jahre alt."
    example_vi: "Cô ấy 30 tuổi."
  - pattern: "Subjekt + haben + danh từ"
    example_de: "Wir haben zwei Computer."
    example_vi: "Chúng tôi có hai cái máy tính."
rules:
  - rule_vi: "sein: bin, bist, ist, sind, seid, sind."
    examples:
      - { de: "Wir sind Krankenpfleger. Seid ihr auch Krankenpfleger?", vi: "Chúng tôi là điều dưỡng. Các bạn cũng là điều dưỡng à?" }
  - rule_vi: "haben: habe, hast, hat, haben, habt, haben."
    examples:
      - { de: "Hast du am Sonntag frei? – Ja, ich habe frei.", vi: "Chủ nhật bạn có được nghỉ không? – Có, mình được nghỉ." }
  - rule_vi: "Nói tuổi dùng sein (không dùng haben như nhiều ngôn ngữ khác)."
    examples:
      - { de: "Wie alt bist du? – Ich bin 25.", vi: "Bạn bao nhiêu tuổi? – Mình 25." }
  - rule_vi: "haben + danh từ chỉ thứ mình có (vật, thời gian, công việc, bạn bè…)."
    examples:
      - { de: "Er hat viel Arbeit.", vi: "Anh ấy có nhiều việc." }
      - { de: "Das Krankenhaus hat 500 Zimmer.", vi: "Bệnh viện có 500 phòng." }
tables:
  - title_vi: "sein hay haben?"
    columns: ["Nội dung", "Động từ", "Ví dụ"]
    rows:
      - ["tên, nghề", "sein", "Ich bin Informatiker."]
      - ["tuổi", "sein", "Ich bin 30 Jahre alt."]
      - ["tính chất", "sein", "Der Kurs ist toll."]
      - ["sở hữu", "haben", "Ich habe ein Auto."]
      - ["thời gian rảnh", "haben", "Ich habe am Montag frei."]
examples:
  - { de: "Ich bin Krankenpflegerin und habe viele Patienten.", vi: "Tôi là điều dưỡng và có nhiều bệnh nhân." }
  - { de: "Hast du ein Wörterbuch?", vi: "Bạn có từ điển không?" }
  - { de: "Paul ist 28 und hat am Wochenende frei.", vi: "Paul 28 tuổi và cuối tuần được nghỉ." }
  - { de: "Ihr habt viel Zeit!", vi: "Các bạn có nhiều thời gian quá!" }
common_mistakes:
  - wrong: "Ich habe 22 Jahre."
    right: "Ich bin 22 Jahre alt. / Ich bin 22."
    explanation_vi: "Người biết tiếng Pháp/Tây Ban Nha hay nói “có … tuổi”. Tiếng Đức dùng sein."
  - wrong: "Er habt ein Auto."
    right: "Er hat ein Auto."
    explanation_vi: "er hat (bất quy tắc)."
  - wrong: "Du habst Zeit."
    right: "Du hast Zeit."
    explanation_vi: "du hast (mất b)."
comparison_vi: "So sánh sein và haben: sein nói “là gì / như thế nào”, haben nói “có gì”. Tiếng Anh cũng vậy (be/have), trừ tuổi: tiếng Anh và tiếng Đức đều dùng “be/sein” cho tuổi."
vietnamese_contrast_vi: "Tiếng Việt nói “Tôi 22 tuổi” – không có động từ. Tiếng Đức bắt buộc có sein: Ich BIN 22. Ngoài ra tiếng Việt dùng “có” rất rộng (“Bạn có khỏe không?”) – trong tiếng Đức câu này KHÔNG dùng haben mà dùng “Wie geht's?”."
exercises:
  - id: g-a1-haben-sein-ex01
    type: gap-fill
    skill: grammar
    objectives: [r1, r2]
    difficulty: 1
    instructions_vi: "Điền dạng đúng của sein hoặc haben."
    items:
      - { id: q1, prompt: "Er ___ Koch. (sein)", answer: ["ist"], explanation_vi: "er ist." }
      - { id: q2, prompt: "Du ___ am Montag frei. (haben)", answer: ["hast"], explanation_vi: "du hast." }
      - { id: q3, prompt: "Wir ___ zwei Kinder. (haben)", answer: ["haben"], explanation_vi: "wir haben." }
      - { id: q4, prompt: "___ ihr Studenten? (sein)", answer: ["Seid"], explanation_vi: "ihr seid." }
      - { id: q5, prompt: "Sie (cô ấy) ___ ein Auto. (haben)", answer: ["hat"], explanation_vi: "sie hat." }
  - id: g-a1-haben-sein-ex02
    type: multiple-choice
    skill: grammar
    objectives: [r3, r4]
    difficulty: 2
    instructions_vi: "sein hay haben?"
    items:
      - { id: q1, prompt: "Ich ___ 30 Jahre alt.", options: ["bin", "habe"], answer: "bin", explanation_vi: "Tuổi → sein." }
      - { id: q2, prompt: "Ich ___ ein Wörterbuch.", options: ["bin", "habe"], answer: "habe", explanation_vi: "Sở hữu → haben." }
      - { id: q3, prompt: "Der Film ___ toll.", options: ["ist", "hat"], answer: "ist", explanation_vi: "Tính chất → sein." }
summary_vi: "sein: bin, bist, ist, sind, seid, sind – dùng cho tên, nghề, tuổi, tính chất. haben: habe, hast, hat, haben, habt, haben – dùng cho thứ mình có. Tuổi dùng sein!"
next_level_note_vi: "Präteritum (war, hatte) học ở Kapitel 6; haben/sein làm trợ động từ trong Perfekt ở Kapitel 10."
