  instructions_vi: Tình huống nào dùng du, tình huống nào dùng Sie?
  items:
  - id: a1.g.du-und-sie.ex.01.q1
    prompt: Bạn nói chuyện với một bạn học cùng lớp tiếng Đức (cùng là sinh viên).
    options:
    - id: a
      text: du
    - id: b
      text: Sie
    answer:
    - a
    explanation_vi: Sinh viên với nhau thường dùng du.
  - id: a1.g.du-und-sie.ex.01.q2
    prompt: Bạn hỏi đường một người đàn ông lớn tuổi trên phố.
    options:
    - id: a
      text: du
    - id: b
      text: Sie
    answer:
    - b
    explanation_vi: Người lạ, lớn tuổi → Sie.
  - id: a1.g.du-und-sie.ex.01.q3
    prompt: Bạn gọi điện tới văn phòng đăng ký cư trú (Bürgeramt).
    options:
    - id: a
      text: Sie
    - id: b
      text: du
    answer:
    - a
    explanation_vi: Cơ quan nhà nước → luôn dùng Sie.
  - id: a1.g.du-und-sie.ex.01.q4
    prompt: Bạn nói chuyện với đứa em họ 8 tuổi.
    options:
    - id: a
      text: Sie
    - id: b
      text: du
    answer:
    - b
    explanation_vi: Gia đình, trẻ em → du.
