id: g-a1-verben-singular
level: A1
title_de: "Verben und Personalpronomen im Singular: ich, du, er/sie/es, Sie"
title_vi: "Chia động từ ở số ít: ich, du, er/sie/es và Sie"
introduced_in: a1-k01-l03
source:
  type: netzwerk-neu
  kapitel: 1
  sections: ["Woher kommen Sie?"]
  note_vi: "Tương ứng Grammatik „Verben und Personalpronomen (Singular)“ của Kapitel 1."
prerequisites: [g-a1-verben-ich-du-sie]
explanation_vi: |
  Ở bài 2 bạn đã chia động từ với *ich, du, Sie*. Bây giờ thêm ngôi thứ ba – khi **nói về một người khác**:

  - **er** = anh ấy / ông ấy / cậu ấy (người nam) – và mọi danh từ giống đực (*der*)
  - **sie** = cô ấy / bà ấy / chị ấy (người nữ) – và mọi danh từ giống cái (*die*)
  - **es** = nó – cho danh từ giống trung (*das*)

  **Quy tắc:** er/sie/es → gốc + **-t**: *er kommt, sie wohnt, es heißt*.

  **Động từ đổi nguyên âm:** một số động từ đổi **e → i** ở *du* và *er/sie/es* (không đổi ở ich và Sie):
  *sprechen → ich spreche, du **sprich**st, er **sprich**t*. Bạn cần học thuộc từng động từ loại này –
  trong sổ từ vựng, chúng có cột "forms" ghi sẵn.

  **sie hay Sie?** Khi nói, hai từ đọc giống nhau [ziː]. Phân biệt bằng **động từ**:
  *sie kommt* (cô ấy đến) – *Sie kommen* (ông/bà đến). Khi viết, phân biệt thêm bằng **chữ hoa**.
usage_vi: "Dùng khi giới thiệu và nói về người khác: Das ist Paul. Er kommt aus Wien. Er spricht Deutsch."
structure:
  - pattern: "er/sie/es + gốc-t"
    example_de: "Er wohnt in Hamburg."
    example_vi: "Anh ấy sống ở Hamburg."
  - pattern: "du/er/sie/es + gốc đổi nguyên âm (e → i)"
    example_de: "Sie spricht Vietnamesisch."
    example_vi: "Cô ấy nói tiếng Việt."
rules:
  - rule_vi: "er = người nam / danh từ der; sie = người nữ / danh từ die; es = danh từ das."
    examples:
      - { de: "Das ist Paul. Er kommt aus Deutschland.", vi: "Đây là Paul. Anh ấy đến từ Đức." }
      - { de: "Das ist Mai. Sie wohnt in Köln.", vi: "Đây là Mai. Cô ấy sống ở Köln." }
  - rule_vi: "er/sie/es + gốc + t."
    examples:
      - { de: "er kommt, sie wohnt, es heißt", vi: "anh ấy đến, cô ấy sống, nó tên là" }
  - rule_vi: "Một số động từ đổi e → i ở du và er/sie/es, ví dụ sprechen."
    examples:
      - { de: "ich spreche – du sprichst – er spricht – Sie sprechen", vi: "tôi nói – bạn nói – anh ấy nói – ông/bà nói" }
  - rule_vi: "sein ở ngôi thứ ba số ít là ist."
    examples:
      - { de: "Er ist Reiseführer. Sie ist Reiseführerin.", vi: "Anh ấy là hướng dẫn viên du lịch. Cô ấy là hướng dẫn viên du lịch." }
  - rule_vi: "sie (cô ấy) + động từ -t; Sie (ông/bà) + động từ -en. Khi nghe, nhận biết qua đuôi động từ."
    examples:
      - { de: "Woher kommt sie? – Woher kommen Sie?", vi: "Cô ấy đến từ đâu? – Ông/Bà đến từ đâu?" }
tables:
  - title_vi: "Bảng chia động từ số ít + Sie (Präsens)"
    columns: ["", "kommen", "wohnen", "heißen", "sprechen", "sein"]
    rows:
      - ["ich", "komme", "wohne", "heiße", "spreche", "bin"]
      - ["du", "kommst", "wohnst", "heißt", "sprichst", "bist"]
      - ["er/sie/es", "kommt", "wohnt", "heißt", "spricht", "ist"]
      - ["Sie", "kommen", "wohnen", "heißen", "sprechen", "sind"]
    note_vi: "Lưu ý: du heißt và er heißt giống nhau. sprechen đổi e→i ở du và er/sie/es."
examples:
  - { de: "Das ist Herr Becker. Er kommt aus Österreich.", vi: "Đây là ông Becker. Ông ấy đến từ Áo.", note_vi: "Österreich học ở bài 5." }
  - { de: "Woher kommst du? – Ich komme aus Vietnam.", vi: "Bạn đến từ đâu? – Mình đến từ Việt Nam." }
  - { de: "Sie heißt Hoa und wohnt in Berlin.", vi: "Cô ấy tên là Hoa và sống ở Berlin." }
  - { de: "Er spricht Englisch und Deutsch.", vi: "Anh ấy nói tiếng Anh và tiếng Đức." }
  - { de: "Wo wohnen Sie, Frau Lang?", vi: "Bà sống ở đâu, thưa bà Lang?" }
common_mistakes:
  - wrong: "Er kommen aus Vietnam."
    right: "Er kommt aus Vietnam."
    explanation_vi: "er/sie/es luôn đi với đuôi -t."
  - wrong: "Sie sprecht Deutsch. (cô ấy)"
    right: "Sie spricht Deutsch."
    explanation_vi: "sprechen đổi e → i ở er/sie/es: spricht."
  - wrong: "Ich spriche Deutsch."
    right: "Ich spreche Deutsch."
    explanation_vi: "Với ich KHÔNG đổi nguyên âm – chỉ đổi ở du và er/sie/es."
  - wrong: "Das ist Paul. Sie kommt aus Wien."
    right: "Das ist Paul. Er kommt aus Wien."
    explanation_vi: "Paul là nam → er. Tiếng Việt nói “bạn ấy” cho cả nam lẫn nữ, nên người Việt hay nhầm er/sie."
comparison_vi: "So sánh ba đuôi -st / -t / -en: du kommst (bạn) – er kommt (anh ấy) – Sie kommen (ông/bà). Chỉ khác vài chữ cuối nhưng đổi hoàn toàn người được nói tới, nên phải phát âm rõ phụ âm cuối."
vietnamese_contrast_vi: "Tiếng Việt có “bạn ấy”, “người đó” dùng chung cho nam và nữ; tiếng Đức phải chọn er hoặc sie. Ngoài ra, er/sie còn dùng cho đồ vật (der Tee → er, die Pizza → sie), điều tiếng Việt không có – bạn sẽ gặp nhiều hơn từ Kapitel 2."
exercises:
  - id: g-a1-verben-singular-ex01
    type: gap-fill
    skill: grammar
    objectives: [r2, r3, r4]
    difficulty: 2
    instructions_vi: "Chia động từ trong ngoặc."
    items:
      - { id: q1, prompt: "Er ___ aus Polen. (kommen)", answer: ["kommt"], explanation_vi: "er + gốc + t." }
      - { id: q2, prompt: "Sie ___ in Hamburg. (wohnen) – (cô ấy)", answer: ["wohnt"], explanation_vi: "sie (cô ấy) + t." }
      - { id: q3, prompt: "___ du Englisch? (sprechen)", answer: ["Sprichst"], explanation_vi: "du: e → i, sprichst." }
      - { id: q4, prompt: "Tom ___ Reiseführer. (sein)", answer: ["ist"], explanation_vi: "er (Tom) → ist." }
      - { id: q5, prompt: "Frau Weber ___ Deutsch und Französisch. (sprechen)", answer: ["spricht"], explanation_vi: "sie (Frau Weber) → spricht." }
  - id: g-a1-verben-singular-ex02
    type: multiple-choice
    skill: grammar
    objectives: [r1, r5]
    difficulty: 2
    instructions_vi: "Chọn đại từ phù hợp."
    items:
      - { id: q1, prompt: "Das ist Anna. ___ kommt aus Wien.", options: ["Er", "Sie", "Es"], answer: "Sie", explanation_vi: "Anna là nữ → sie (viết hoa vì đầu câu)." }
      - { id: q2, prompt: "Das ist Minh. ___ wohnt in Leipzig.", options: ["Er", "Sie", "Du"], answer: "Er", explanation_vi: "Minh là nam → er." }
      - { id: q3, prompt: "Woher kommen ___, Herr Klein?", options: ["sie", "Sie", "er"], answer: "Sie", explanation_vi: "Hỏi trực tiếp ông Klein (trang trọng) + kommen → Sie viết hoa." }
summary_vi: "er/sie/es + -t (er kommt). sprechen đổi e→i ở du/er (du sprichst, er spricht). sein: er ist. sie (cô ấy) + -t ≠ Sie (ông/bà) + -en."
next_level_note_vi: "Số nhiều wir/ihr/sie, thêm các động từ bất quy tắc khác và haben học ở Kapitel 2."
