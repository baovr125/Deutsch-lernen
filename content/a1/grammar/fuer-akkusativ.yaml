exercises:
- id: a1.g.fuer-akkusativ.ex.01
  type: multiple-choice
  skill: grammar
  difficulty: 1
  objective_refs:
  - a1.g.fuer-akkusativ.r1
  - a1.g.fuer-akkusativ.obj1
  instructions_vi: Chọn dạng đúng của mạo từ đi sau giới từ für.
  items:
  - id: a1.g.fuer-akkusativ.ex.01.q1
    prompt: Das Geschenk ist für ___ (mein) Freund Paul.
    options:
    - id: a
      text: meine
    - id: b
      text: meinen
    - id: c
      text: mein
    - id: d
      text: meinem
    answer:
    - b
    explanation_vi: der Freund là giống đực, sau für là Akkusativ → meinen.
  - id: a1.g.fuer-akkusativ.ex.01.q2
    prompt: Wir kochen eine Suppe für ___ (das) Fest.
    options:
    - id: a
      text: des
    - id: b
      text: dem
    - id: c
      text: das
    - id: d
      text: den
    answer:
    - c
    explanation_vi: das Fest là giống trung, ở Akkusativ giữ nguyên là das.
  - id: a1.g.fuer-akkusativ.ex.01.q3
    prompt: Hast du Blumen für ___ (die) Lehrerin gekauft?
    options:
    - id: a
      text: die
    - id: b
      text: den
    - id: c
      text: dem
    - id: d
      text: der
    answer:
    - a
    explanation_vi: die Lehrerin là giống cái, ở Akkusativ giữ nguyên là die.
- id: a1.g.fuer-akkusativ.ex.02
  type: fill-blank
  skill: grammar
  difficulty: 2
  objective_refs:
  - a1.g.fuer-akkusativ.r1
  - a1.g.fuer-akkusativ.obj1
  instructions_vi: Điền mạo từ thích hợp vào chỗ trống sau giới từ für (einen, eine, ein).
  items:
  - id: a1.g.fuer-akkusativ.ex.02.q1
    prompt: Ich suche ein Geschenk für ___ Kollegen (m), für ___ Kollegin (f) und für ___ Kind (n).
    answers:
    - einen
    - eine
    - ein
    explanation_vi: 1. einen (der Kollege ở Akkusativ). 2. eine (die Kollegin). 3. ein (das Kind).
