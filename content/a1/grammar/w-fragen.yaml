    - Deutsch und Englisch.
examples:
- de: Wie heißt du?
  vi: Bạn tên là gì?
- de: Woher kommen Sie?
  vi: Ông/Bà đến từ đâu?
- de: Wo wohnt Herr Schmidt?
  vi: Ông Schmidt sống ở đâu?
- de: Wer ist das?
  vi: Đó là ai?
- de: Welche Sprachen spricht sie?
  vi: Cô ấy nói những ngôn ngữ nào?
common_mistakes:
- wrong: Woher du kommst?
  right: Woher kommst du?
  explanation_vi: 'Tiếng Việt nói “Bạn đến từ đâu?” (chủ ngữ trước). Tiếng Đức: từ để hỏi – ĐỘNG TỪ – chủ ngữ.'
- wrong: Was heißt du?
  right: Wie heißt du?
  explanation_vi: 'Hỏi tên dùng wie, không dùng was. (“Was heißt …?” có nghĩa khác: … nghĩa là gì?)'
- wrong: Wo kommst du?
  right: Woher kommst du?
  explanation_vi: kommen (đến từ) đi với woher; wohnen (sống ở) đi với wo.
- wrong: Wer wohnst du?
  right: Wo wohnst du?
  explanation_vi: wer = ai, wo = ở đâu. Ba từ wer/wo/wie rất dễ nhầm, hãy học kèm ví dụ.
comparison_vi: 'So với câu kể: cả hai đều có động từ ở vị trí 2. Câu kể: Ich (1) komme (2) aus Vietnam. W-Frage: Woher (1) kommst (2) du? So với tiếng Anh: Where do you live? cần trợ động từ “do”, tiếng Đức thì không: Wo wohnst du?'
vietnamese_contrast_vi: 'Tiếng Việt để từ để hỏi ở CUỐI hoặc giữa câu (Bạn tên là GÌ? Bạn sống ở ĐÂU?), tiếng Đức luôn đưa từ để hỏi lên ĐẦU câu. Ngoài ra tiếng Việt dùng thanh điệu cho từng chữ, còn tiếng Đức dùng ngữ điệu cả câu: W-Frage hạ giọng ở cuối.'
recap_vi: 'W-Frage: từ để hỏi (1) – động từ (2) – chủ ngữ (3). wer = ai, was = gì, wie = thế nào, wo = ở đâu (→ in), woher = từ đâu (→ aus). Hạ giọng ở cuối câu.'
next_level_note_vi: 'Câu hỏi có/không (Ja/Nein-Frage: Kommst du aus Vietnam?) học ở Kapitel 2. Các từ để hỏi wann, wie lange, wohin học ở Kapitel 5 và 9.'
