  items:
  - id: a1.g.w-fragen.ex.01.q1
    prompt: ___ kommst du? – Aus Japan.
    options:
    - id: a
      text: Wo
    - id: b
      text: Woher
    - id: c
      text: Wer
    answer:
    - b
    explanation_vi: Trả lời bằng aus → hỏi woher.
  - id: a1.g.w-fragen.ex.01.q2
    prompt: ___ wohnt Anna? – In Wien.
    options:
    - id: a
      text: Woher
    - id: b
      text: Wo
    - id: c
      text: Wie
    answer:
    - b
    explanation_vi: Trả lời bằng in → hỏi wo.
  - id: a1.g.w-fragen.ex.01.q3
    prompt: ___ heißen Sie? – Weber.
    options:
    - id: a
      text: Wie
    - id: b
      text: Was
    - id: c
      text: Wer
    answer:
    - a
    explanation_vi: Hỏi tên dùng wie.
  - id: a1.g.w-fragen.ex.01.q4
    prompt: ___ ist das? – Das ist Paul.
    options:
    - id: a
      text: Was
    - id: b
      text: Wer
    - id: c
      text: Wo
    answer:
    - b
    explanation_vi: Hỏi người → wer.
- id: a1.g.w-fragen.ex.02
  type: word-order
  skill: grammar
  difficulty: 2
  objective_refs:
  - a1.g.w-fragen.r1
  - a1.g.w-fragen.obj1
  instructions_vi: Sắp xếp thành câu hỏi đúng.
  items:
  - id: a1.g.w-fragen.ex.02.q1
    tokens:
    - du
    - wohnst
    - Wo
    answer: Wo wohnst du?
    explanation_vi: W-Wort (Wo) – động từ (wohnst) – chủ ngữ (du).
  - id: a1.g.w-fragen.ex.02.q2
    tokens:
    - Sie
    - Woher
    - kommen
    answer: Woher kommen Sie?
    explanation_vi: Woher – kommen – Sie.
  - id: a1.g.w-fragen.ex.02.q3
    tokens:
    - sprichst
    - Sprachen
    - du
    - Welche
    answer: Welche Sprachen sprichst du?
    explanation_vi: Vị trí 1 là cả cụm “Welche Sprachen”, động từ vẫn ở vị trí 2.
