title_de: W-Fragen
title_vi: Câu hỏi với từ để hỏi W- (W-Fragen)
summary_vi: '**W-Fragen** là câu hỏi bắt đầu bằng một **từ để hỏi** (Fragewort). Hầu hết từ để hỏi tiếng Đức bắt đầu bằng chữ **W** – vì vậy có tên W-Fragen.


  **Trật tự từ – rất quan trọng:**


  | Vị trí 1 | Vị trí 2 | Vị trí 3 | … |

  |---|---|---|---|

  | **Từ để hỏi** | **Động từ chia** | Chủ ngữ | (phần còn lại) |

  | Wie | heißt | du | ? |

  | Woher | kommen | Sie | ? |

  | Wo | wohnt | Anna | ? |


  Động từ **luôn đứng ở vị trí 2**, ngay sau từ để hỏi – giống như trong câu kể.


  **Các từ để hỏi trong Kapitel 1:**

  - **wer?** – ai? → *Wer ist das?*

  - **was?** – cái gì? → *Was ist das?*

  - **wie?** – như thế nào? → *Wie heißt du? Wie geht''s?*

  - **wo?** – ở đâu? → *Wo wohnst du?*

  - **woher?** – từ đâu? → *Woher kommen Sie?*

  - **welche?** – (những) … nào? → *Welche Sprachen sprechen Sie?*


  **Ngữ điệu:** trong W-Frage, giọng thường **đi xuống** ở cuối câu (↘), không lên giọng như câu hỏi có/không.'
usage_vi: 'Dùng để hỏi thông tin cụ thể: tên, quê quán, nơi ở, ngôn ngữ. Trả lời bằng câu kể đầy đủ hoặc chỉ bằng thông tin chính.'
objectives:
- id: a1.g.w-fragen.obj1
  text_vi: Lập và trả lời câu hỏi với từ để hỏi W-.
  skill: grammar
rules:
- id: a1.g.w-fragen.r1
  title_vi: Từ để hỏi ở vị trí 1
  body_vi: Từ để hỏi đứng ở vị trí 1, động từ chia đứng ở vị trí 2, chủ ngữ đứng sau động từ.
  examples:
  - de: Wie heißen Sie?
    vi: Ông/Bà tên là gì?
  - de: Wo wohnt Paul?
    vi: Paul sống ở đâu?
- id: a1.g.w-fragen.r2
  title_vi: Chọn từ để hỏi theo thông tin
  body_vi: 'Chọn đúng từ để hỏi theo thông tin cần hỏi: wer (người), was (vật), wie (cách thức, tên, tình trạng), wo (nơi chốn), woher (xuất xứ).'
  examples:
  - de: Wer ist das? – Das ist Frau Lang.
    vi: Đó là ai? – Đó là bà Lang.
  - de: Woher kommt sie? – Aus Spanien.
    vi: Cô ấy đến từ đâu? – Từ Tây Ban Nha.
- id: a1.g.w-fragen.r3
  title_vi: Trả lời cho wo và woher
  body_vi: Câu trả lời cho wo dùng in; câu trả lời cho woher dùng aus.
  examples:
  - de: Wo wohnst du? – In Hanoi.
    vi: Bạn sống ở đâu? – Ở Hà Nội.
  - de: Woher kommst du? – Aus Vietnam.
    vi: Bạn đến từ đâu? – Từ Việt Nam.
- id: a1.g.w-fragen.r4
  title_vi: Ngữ điệu đi xuống
  body_vi: W-Frage có ngữ điệu đi xuống ở cuối câu.
  examples:
  - de: Wie heißt du? ↘
    vi: Bạn tên là gì?
sentence_structures:
- pattern: W-Wort (1) + Verb (2) + Subjekt (3) + …?
  example:
    de: Woher kommst du?
    vi: Bạn đến từ đâu?
- pattern: W-Wort (1) + Verb (2) + Subjekt (3) + Ergänzung?
  example:
    de: Welche Sprachen sprechen Sie?
    vi: Ông/Bà nói những ngôn ngữ nào?
