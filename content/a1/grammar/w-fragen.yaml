    - tên, cách thức, tình trạng
    - Wie heißt du?
    - Ich heiße Mai.
  - - wo
    - ở đâu
    - nơi chốn
    - Wo wohnen Sie?
    - In Köln.
  - - woher
    - từ đâu
    - xuất xứ
