exercises:
- id: a1.g.verben-singular.ex.01
  type: fill-blank
  skill: grammar
  difficulty: 2
  objective_refs:
  - a1.g.verben-singular.r2
  - a1.g.verben-singular.r3
  - a1.g.verben-singular.r4
  - a1.g.verben-singular.obj1
  instructions_vi: Chia động từ trong ngoặc.
  items:
  - id: a1.g.verben-singular.ex.01.q1
    prompt: Er ___ aus Polen. (kommen)
    answers:
    - kommt
    explanation_vi: er + gốc + t.
  - id: a1.g.verben-singular.ex.01.q2
    prompt: Sie ___ in Hamburg. (wohnen) – (cô ấy)
    answers:
    - wohnt
    explanation_vi: sie (cô ấy) + t.
  - id: a1.g.verben-singular.ex.01.q3
    prompt: ___ du Englisch? (sprechen)
    answers:
    - Sprichst
    explanation_vi: 'du: e → i, sprichst.'
  - id: a1.g.verben-singular.ex.01.q4
    prompt: Tom ___ Reiseführer. (sein)
    answers:
    - ist
    explanation_vi: er (Tom) → ist.
  - id: a1.g.verben-singular.ex.01.q5
    prompt: Frau Weber ___ Deutsch und Französisch. (sprechen)
    answers:
    - spricht
    explanation_vi: sie (Frau Weber) → spricht.
- id: a1.g.verben-singular.ex.02
  type: multiple-choice
  skill: grammar
  difficulty: 2
  objective_refs:
  - a1.g.verben-singular.r1
  - a1.g.verben-singular.r5
  - a1.g.verben-singular.obj1
  instructions_vi: Chọn đại từ phù hợp.
  items:
  - id: a1.g.verben-singular.ex.02.q1
    prompt: Das ist Anna. ___ kommt aus Wien.
    options:
    - id: a
      text: Er
    - id: b
      text: Sie
    - id: c
      text: Es
    answer:
    - b
    explanation_vi: Anna là nữ → sie (viết hoa vì đầu câu).
  - id: a1.g.verben-singular.ex.02.q2
    prompt: Das ist Minh. ___ wohnt in Leipzig.
    options:
    - id: a
      text: Du
    - id: b
      text: Er
    - id: c
      text: Sie
    answer:
    - b
    explanation_vi: Minh là nam → er.
  - id: a1.g.verben-singular.ex.02.q3
    prompt: Woher kommen ___, Herr Klein?
    options:
    - id: a
      text: Sie
    - id: b
      text: er
    - id: c
      text: sie
    answer:
    - a
    explanation_vi: Hỏi trực tiếp ông Klein (trang trọng) + kommen → Sie viết hoa.
