title_de: Der Negationsartikel kein, keine – und nicht
title_vi: Phủ định danh từ với kein/keine (so sánh với nicht)
summary_vi: "Ở Kapitel 1 bạn đã dùng **nicht** để phủ định: *Ich verstehe das nicht.*\nNhưng khi phủ định một **danh từ đi với ein/eine** (hoặc danh từ không có mạo từ), tiếng Đức dùng **kein/keine**:\n\n| Khẳng định | Phủ định |\n|---|---|\n| Das ist **ein** Bus. | Das ist **kein** Bus. |\n| Das ist **eine** U-Bahn. | Das ist **keine** U-Bahn. |\n| Ich habe Zeit. (không mạo từ) | Ich habe **keine** Zeit. |\n| Das sind Fahrräder. (số nhiều) | Das sind **keine** Fahrräder. |\n\n**Mẹo:** kein = **k + ein**. Đuôi giống ein/eine: *kein* (der, das), *keine* (die, số nhiều).\n\n**nicht hay kein?**\n- **kein** phủ định **danh từ** có ein/eine hoặc không có mạo từ.\n- **nicht** phủ định **động từ, tính từ, danh từ có der/die/das, tên riêng**:\n  *Der Bus kommt **nicht**. Die U-Bahn ist **nicht** schnell. Das ist **nicht** der Bus nach Altona. Das ist **nicht** Paul.*"
usage_vi: 'Dùng khi nói không có/không phải một thứ gì: Heute fährt kein Bus. Ich habe keine Fahrkarte. Đây là một trong những cấu trúc người học A1 hay sai nhất.'
objectives:
- id: a1.g.negation-kein.obj1
  text_vi: Chọn đúng kein/keine hay nicht để phủ định.
  skill: grammar
rules:
- id: a1.g.negation-kein.r1
  title_vi: ein → kein
  body_vi: ein → kein, eine → keine. Số nhiều và danh từ không mạo từ → keine (hoặc kein với danh từ giống đực/trung không đếm được).
  examples:
  - de: Das ist kein Taxi. Das ist keine Straßenbahn.
    vi: Đó không phải taxi. Đó không phải tàu điện.
  - de: Das sind keine Busse.
    vi: Đó không phải là những chiếc xe buýt.
- id: a1.g.negation-kein.r2
  title_vi: nicht phủ định động từ, tính từ, tên riêng
  body_vi: nicht phủ định động từ, tính từ, tên riêng và danh từ có der/die/das.
  examples:
  - de: Der Bus kommt nicht.
    vi: Xe buýt không đến.
  - de: Das ist nicht die U-Bahn nach Altona.
    vi: Đó không phải tàu điện ngầm đi Altona.
- id: a1.g.negation-kein.r3
  title_vi: Trả lời ‘không’ với kein
  body_vi: Câu trả lời “không” cho câu hỏi với ein/eine dùng kein/keine.
  examples:
  - de: Ist das ein Bus? – Nein, das ist kein Bus.
    vi: Đó có phải xe buýt không? – Không, đó không phải xe buýt.
sentence_structures:
- pattern: Das ist kein/keine + danh từ.
  example:
    de: Das ist kein Zug, das ist eine S-Bahn.
    vi: Đó không phải tàu hỏa, đó là tàu S-Bahn.
- pattern: Subjekt + Verb + kein/keine + danh từ.
  example:
    de: Ich habe keine Fahrkarte.
    vi: Tôi không có vé.
tables:
- title_vi: kein/keine (Nominativ)
  header:
  - Giống
