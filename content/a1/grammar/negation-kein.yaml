examples:
- de: Heute fährt kein Bus.
  vi: Hôm nay không có xe buýt nào chạy.
- de: Ich habe keine Fahrkarte!
  vi: Tôi không có vé!
- de: Kein Bus? Also gehen wir zu Fuß.
  vi: Không có xe buýt à? Vậy mình đi bộ.
- de: Die S-Bahn ist nicht schnell.
  vi: Tàu S-Bahn không nhanh.
- de: Hamburg hat kein Meer, aber einen Hafen.
  vi: Hamburg không có biển, nhưng có cảng.
  note_vi: 'einen: Akkusativ – Kapitel 4.'
common_mistakes:
- wrong: Das ist nicht ein Bus.
  right: Das ist kein Bus.
  explanation_vi: Danh từ có ein → dùng kein, không dùng “nicht ein”.
- wrong: Ich habe nicht Fahrkarte.
  right: Ich habe keine Fahrkarte.
  explanation_vi: Phủ định danh từ → keine. Người Việt hay dịch “không có” = “nicht haben”.
- wrong: Der Bus kommt kein.
  right: Der Bus kommt nicht.
  explanation_vi: Phủ định động từ → nicht.
comparison_vi: 'So sánh nicht và kein: nicht ≈ “không” đứng với động từ/tính từ; kein ≈ “không … nào / không phải là một …” đứng trước danh từ. Tiếng Anh: not a / no (I have no ticket) ≈ kein.'
vietnamese_contrast_vi: 'Tiếng Việt chỉ có “không” (và “không phải”) cho mọi trường hợp, đặt TRƯỚC động từ. Tiếng Đức chia hai từ: kein (trước danh từ) và nicht (thường đứng sau động từ, cuối câu). Khi định nói “không có …”, hãy nghĩ ngay đến kein.'
recap_vi: kein/keine phủ định danh từ có ein/eine hoặc không mạo từ (kein Bus, keine Fahrkarte, keine Fahrräder). nicht phủ định động từ, tính từ, tên riêng, danh từ có der/die/das.
next_level_note_vi: 'keinen (Akkusativ, giống đực) học ở Kapitel 4: Ich habe keinen Stift.'
