exercises:
- id: a1.g.modalverben.ex.01
  type: multiple-choice
  skill: grammar
  difficulty: 1
  objective_refs:
  - a1.g.modalverben.r1
  - a1.g.modalverben.obj1
  instructions_vi: Chọn dạng chia đúng của động từ können hoặc wollen.
  items:
  - id: a1.g.modalverben.ex.01.q1
    prompt: ___ du am Samstag mitkommen? (können)
    options:
    - id: a
      text: Kannst
    - id: b
      text: Können
    - id: c
      text: Kann
    - id: d
      text: Könnt
    answer:
    - a
    explanation_vi: Chủ ngữ du → chia können là Kannst.
  - id: a1.g.modalverben.ex.01.q2
    prompt: Mein Sohn ___ Arzt werden. (wollen)
    options:
    - id: a
      text: willst
    - id: b
      text: will
    - id: c
      text: wollt
    - id: d
      text: wollte
    answer:
    - b
    explanation_vi: Chủ ngữ er (mein Sohn) → chia wollen là will (không đuôi).
  - id: a1.g.modalverben.ex.01.q3
    prompt: Wir ___ heute Abend zusammen kochen. (wollen)
    options:
    - id: a
      text: willt
    - id: b
      text: will
    - id: c
      text: wollt
    - id: d
      text: wollen
    answer:
    - d
    explanation_vi: Chủ ngữ wir → wollen.
- id: a1.g.modalverben.ex.02
  type: word-order
  skill: grammar
  difficulty: 2
  objective_refs:
  - a1.g.modalverben.r2
  - a1.g.modalverben.obj1
  instructions_vi: Sắp xếp các từ thành câu hoàn chỉnh tuân thủ cấu trúc khung câu (động từ nguyên thể ở cuối).
  items:
  - id: a1.g.modalverben.ex.02.q1
    tokens:
    - gut
    - kann
    - kochen
    - Ich
    answer: Ich kann gut kochen.
    prompt_vi: 'Sắp xếp: Ich / gut / kann / kochen .'
    explanation_vi: Ich (chủ ngữ) + kann (vị trí 2) + gut + kochen (nguyên thể ở cuối câu).
  - id: a1.g.modalverben.ex.02.q2
    tokens:
    - heute
    - nicht
    - kann
    - kommen
    - Er
    answer: Er kann heute nicht kommen.
    prompt_vi: 'Sắp xếp: Er / heute / kommen / nicht / kann .'
    explanation_vi: Er (chủ ngữ) + kann (vị trí 2) + heute nicht + kommen (nguyên thể ở cuối câu).
