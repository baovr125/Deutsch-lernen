title_de: Die Ja/Nein-Frage
title_vi: Câu hỏi có/không (Ja/Nein-Frage)
summary_vi: '**Câu hỏi có/không** là câu hỏi mà người nghe trả lời bằng **ja** (có) hoặc **nein** (không).


  **Cấu tạo:** đưa **động từ chia lên vị trí 1** (đầu câu), chủ ngữ đứng ngay sau:


  | Vị trí 1 | Vị trí 2 | Phần còn lại |

  |---|---|---|

  | **Kommst** | du | aus Vietnam? |

  | **Spielen** | Sie | Tennis? |

  | **Gehen** | wir | ins Kino? |


  **Ngữ điệu:** giọng **đi lên** ở cuối câu (↗) – khác với câu hỏi W- (đi xuống ↘).


  **Trả lời:** *Ja, …* hoặc *Nein, …* (thường kèm câu đầy đủ hoặc thông tin đúng).

  *Kommst du aus Japan? – Nein, ich komme aus Vietnam.*


  **Gợi ý rủ rê:** *Gehen wir …?* (Chúng ta đi … nhé?) cũng là câu hỏi có/không với wir.'
usage_vi: Dùng để xác nhận thông tin, hỏi sở thích (Kochst du gern?) và rủ rê (Gehen wir ins Café?).
objectives:
- id: a1.g.ja-nein-frage.obj1
  text_vi: Lập và trả lời câu hỏi có/không.
  skill: grammar
rules:
- id: a1.g.ja-nein-frage.r1
  title_vi: Động từ ở vị trí 1
  body_vi: Động từ chia đứng ở vị trí 1, chủ ngữ ngay sau động từ.
  examples:
  - de: Wohnst du in Berlin?
    vi: Bạn sống ở Berlin à?
  - de: Sprechen Sie Englisch?
    vi: Ông/Bà có nói tiếng Anh không?
- id: a1.g.ja-nein-frage.r2
  title_vi: Lên giọng ở cuối câu
  body_vi: Câu hỏi có/không lên giọng ở cuối câu.
  examples:
  - de: Kochst du gern? ↗
    vi: Bạn có thích nấu ăn không?
- id: a1.g.ja-nein-frage.r3
  title_vi: Trả lời ja hoặc nein
  body_vi: Trả lời bằng ja hoặc nein, thường thêm câu đầy đủ.
  examples:
  - de: Spielst du Fußball? – Ja, sehr gern.
    vi: Bạn có chơi bóng đá không? – Có, rất thích.
  - de: Bist du Lehrerin? – Nein, ich bin Ärztin.
    vi: Bạn là giáo viên à? – Không, mình là bác sĩ.
sentence_structures:
- pattern: Verb (1) + Subjekt (2) + …? ↗
  example:
    de: Tanzt du gern?
    vi: Bạn có thích nhảy không?
- pattern: Gehen wir + ins/in … ? ↗
  example:
    de: Gehen wir am Freitag ins Theater?
    vi: Thứ Sáu mình đi nhà hát nhé?
