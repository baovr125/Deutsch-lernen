exercises:
- id: a1.g.personalpronomen-akkusativ.ex.01
  type: multiple-choice
  skill: grammar
  difficulty: 1
  objective_refs:
  - a1.g.personalpronomen-akkusativ.r1
  - a1.g.personalpronomen-akkusativ.obj1
  instructions_vi: Chọn đại từ nhân xưng ở Akkusativ phù hợp.
  items:
  - id: a1.g.personalpronomen-akkusativ.ex.01.q1
    prompt: Rufst du ___ (ich) heute Abend an?
    options:
    - id: a
      text: mich
    - id: b
      text: ich
    - id: c
      text: mir
    - id: d
      text: dich
    answer:
    - a
    explanation_vi: Tân ngữ của anrufen (ngôi ich) chia ở Akkusativ là mich.
  - id: a1.g.personalpronomen-akkusativ.ex.01.q2
    prompt: Ich liebe ___ (du) sehr!
    options:
    - id: a
      text: ihn
    - id: b
      text: dich
    - id: c
      text: dir
    - id: d
      text: du
    answer:
    - b
    explanation_vi: Tân ngữ của lieben (ngôi du) chia ở Akkusativ là dich.
  - id: a1.g.personalpronomen-akkusativ.ex.01.q3
    prompt: Kennst du Herrn Weber? – Ja, ich kenne ___ (er) gut.
    options:
    - id: a
      text: es
    - id: b
      text: ihm
    - id: c
      text: er
    - id: d
      text: ihn
    answer:
    - d
    explanation_vi: Herr Weber (er) ở Akkusativ đổi thành ihn.
- id: a1.g.personalpronomen-akkusativ.ex.02
  type: fill-blank
  skill: grammar
  difficulty: 2
  objective_refs:
  - a1.g.personalpronomen-akkusativ.r1
  - a1.g.personalpronomen-akkusativ.obj1
  instructions_vi: Điền đại từ nhân xưng Akkusativ thích hợp (uns, euch, ihn, sie).
  items:
  - id: a1.g.personalpronomen-akkusativ.ex.02.q1
    prompt: Lisa lädt ___ (wir) zur Party ein. Kinder, ich hole ___ (ihr) um 16 Uhr ab. Wo ist der Salat? Ich esse ___ (er) jetzt.
    answers:
    - uns
    - euch
    - ihn
    explanation_vi: 1. wir → uns. 2. ihr → euch. 3. der Salat (er) → ihn.
