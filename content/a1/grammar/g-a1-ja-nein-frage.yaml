id: g-a1-ja-nein-frage
level: A1
title_de: "Die Ja/Nein-Frage"
title_vi: "Câu hỏi có/không (Ja/Nein-Frage)"
introduced_in: a1-k02-l03
source:
  type: netzwerk-neu
  kapitel: 2
  sections: ["Gehen wir ins Kino?"]
  note_vi: "Tương ứng Grammatik „Ja/Nein-Frage“ và Aussprache „Satzmelodie: Fragen und Antworten“ của Kapitel 2."
prerequisites: [g-a1-w-fragen, g-a1-verben-praesens]
explanation_vi: |
  **Câu hỏi có/không** là câu hỏi mà người nghe trả lời bằng **ja** (có) hoặc **nein** (không).

  **Cấu tạo:** đưa **động từ chia lên vị trí 1** (đầu câu), chủ ngữ đứng ngay sau:

  | Vị trí 1 | Vị trí 2 | Phần còn lại |
  |---|---|---|
  | **Kommst** | du | aus Vietnam? |
  | **Spielen** | Sie | Tennis? |
  | **Gehen** | wir | ins Kino? |

  **Ngữ điệu:** giọng **đi lên** ở cuối câu (↗) – khác với câu hỏi W- (đi xuống ↘).

  **Trả lời:** *Ja, …* hoặc *Nein, …* (thường kèm câu đầy đủ hoặc thông tin đúng).
  *Kommst du aus Japan? – Nein, ich komme aus Vietnam.*

  **Gợi ý rủ rê:** *Gehen wir …?* (Chúng ta đi … nhé?) cũng là câu hỏi có/không với wir.
usage_vi: "Dùng để xác nhận thông tin, hỏi sở thích (Kochst du gern?) và rủ rê (Gehen wir ins Café?)."
structure:
  - pattern: "Verb (1) + Subjekt (2) + …? ↗"
    example_de: "Tanzt du gern?"
    example_vi: "Bạn có thích nhảy không?"
  - pattern: "Gehen wir + ins/in … ? ↗"
    example_de: "Gehen wir am Freitag ins Theater?"
    example_vi: "Thứ Sáu mình đi nhà hát nhé?"
rules:
  - rule_vi: "Động từ chia đứng ở vị trí 1, chủ ngữ ngay sau động từ."
    examples:
      - { de: "Wohnst du in Berlin?", vi: "Bạn sống ở Berlin à?" }
      - { de: "Sprechen Sie Englisch?", vi: "Ông/Bà có nói tiếng Anh không?" }
  - rule_vi: "Câu hỏi có/không lên giọng ở cuối câu."
    examples:
      - { de: "Kochst du gern? ↗", vi: "Bạn có thích nấu ăn không?" }
  - rule_vi: "Trả lời bằng ja hoặc nein, thường thêm câu đầy đủ."
    examples:
      - { de: "Spielst du Fußball? – Ja, sehr gern.", vi: "Bạn có chơi bóng đá không? – Có, rất thích." }
      - { de: "Bist du Lehrerin? – Nein, ich bin Ärztin.", vi: "Bạn là giáo viên à? – Không, mình là bác sĩ." }
tables:
  - title_vi: "So sánh ba loại câu"
    columns: ["Loại câu", "Vị trí 1", "Vị trí 2", "Ngữ điệu"]
    rows:
      - ["Câu kể", "Du", "spielst Tennis.", "↘"]
      - ["Câu hỏi W-", "Was", "spielst du?", "↘"]
      - ["Câu hỏi có/không", "Spielst", "du Tennis?", "↗"]
examples:
  - { de: "Kommst du aus Vietnam? – Ja.", vi: "Bạn đến từ Việt Nam à? – Ừ." }
  - { de: "Gehen wir ins Kino? – Nein, das geht leider nicht.", vi: "Mình đi xem phim nhé? – Không được rồi, tiếc quá." }
  - { de: "Arbeitest du am Samstag? – Nein, am Samstag habe ich frei.", vi: "Thứ Bảy bạn có làm không? – Không, thứ Bảy mình được nghỉ." }
  - { de: "Seid ihr Studenten? – Ja, wir studieren in Wien.", vi: "Các bạn là sinh viên à? – Ừ, chúng mình học ở Viên." }
common_mistakes:
  - wrong: "Du kommst aus Vietnam? (khi viết)"
    right: "Kommst du aus Vietnam?"
    explanation_vi: "Văn nói có thể chỉ lên giọng, nhưng câu hỏi chuẩn phải đưa động từ lên đầu."
  - wrong: "Kommst du aus Vietnam? ↘ (xuống giọng)"
    right: "Kommst du aus Vietnam? ↗"
    explanation_vi: "Câu hỏi có/không phải lên giọng ở cuối."
  - wrong: "Spielen du Tennis?"
    right: "Spielst du Tennis?"
    explanation_vi: "Động từ vẫn phải chia theo chủ ngữ, kể cả khi đứng đầu câu."
comparison_vi: "So với câu hỏi W-: câu hỏi W- có từ để hỏi ở vị trí 1 và xuống giọng; câu hỏi có/không có ĐỘNG TỪ ở vị trí 1 và lên giọng. So với tiếng Anh: tiếng Anh cần “do/does” (Do you play?), tiếng Đức chỉ cần đảo động từ (Spielst du?)."
vietnamese_contrast_vi: "Tiếng Việt tạo câu hỏi có/không bằng từ ở cuối câu: “… không?”, “… à?”, “… phải không?”. Tiếng Đức không có các từ này – thay vào đó đổi trật tự từ (động từ lên đầu) và lên giọng."
exercises:
  - id: g-a1-ja-nein-frage-ex01
    type: ordering
    skill: grammar
    objectives: [r1]
    difficulty: 1
    instructions_vi: "Sắp xếp thành câu hỏi có/không."
    items:
      - { id: q1, tokens: ["du", "gern", "Kochst"], answer: "Kochst du gern?", explanation_vi: "Động từ (Kochst) đứng đầu." }
      - { id: q2, tokens: ["ins", "wir", "Kino", "Gehen"], answer: "Gehen wir ins Kino?", explanation_vi: "Gehen (1) – wir (2) – ins Kino." }
      - { id: q3, tokens: ["Englisch", "Sie", "Sprechen"], answer: "Sprechen Sie Englisch?", explanation_vi: "Sprechen (1) – Sie (2) – Englisch." }
  - id: g-a1-ja-nein-frage-ex02
    type: multiple-choice
    skill: grammar
    objectives: [r2, r3]
    difficulty: 1
    instructions_vi: "Chọn đáp án đúng."
    items:
      - { id: q1, prompt: "Ngữ điệu cuối câu „Tanzt du gern?“", options: ["↗ lên giọng", "↘ xuống giọng"], answer: "↗ lên giọng", explanation_vi: "Câu hỏi có/không lên giọng." }
      - { id: q2, prompt: "„Bist du Student?“ – Bạn là kỹ sư. Bạn trả lời:", options: ["Ja, ich bin Student.", "Nein, ich bin Ingenieur.", "Ja, ich bin Ingenieur."], answer: "Nein, ich bin Ingenieur.", explanation_vi: "Không phải sinh viên → Nein + thông tin đúng." }
summary_vi: "Câu hỏi có/không: động từ chia ở vị trí 1, chủ ngữ ở vị trí 2, lên giọng cuối câu. Trả lời ja/nein + câu đầy đủ."
next_level_note_vi: "Trả lời “doch” cho câu hỏi phủ định (Kommst du nicht? – Doch!) sẽ học sau."
