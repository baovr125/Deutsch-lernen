exercises:
- id: a1.g.trennbare-verben.ex.01
  type: multiple-choice
  skill: grammar
  difficulty: 1
  objective_refs:
  - a1.g.trennbare-verben.r1
  - a1.g.trennbare-verben.obj1
  instructions_vi: Chọn tiền tố đúng ở cuối câu để hoàn chỉnh câu.
  items:
  - id: a1.g.trennbare-verben.ex.01.q1
    prompt: Ich rufe dich heute Abend ___.
    options:
    - id: a
      text: mit
    - id: b
      text: aus
    - id: c
      text: an
    - id: d
      text: auf
    answer:
    - c
    explanation_vi: anrufen (gọi điện thoại) → tiền tố an ở cuối câu.
  - id: a1.g.trennbare-verben.ex.01.q2
    prompt: Bringst du zur Party einen Salat ___?
    options:
    - id: a
      text: ein
    - id: b
      text: ab
    - id: c
      text: an
    - id: d
      text: mit
    answer:
    - d
    explanation_vi: mitbringen (mang theo) → tiền tố mit ở cuối câu.
  - id: a1.g.trennbare-verben.ex.01.q3
    prompt: Am Samstag gehen wir mit Freunden ___.
    options:
    - id: a
      text: an
    - id: b
      text: mit
    - id: c
      text: auf
    - id: d
      text: aus
    answer:
    - d
    explanation_vi: ausgehen (đi chơi buổi tối) → tiền tố aus ở cuối câu.
- id: a1.g.trennbare-verben.ex.02
  type: word-order
  skill: grammar
  difficulty: 2
  objective_refs:
  - a1.g.trennbare-verben.r1
  - a1.g.trennbare-verben.r2
  - a1.g.trennbare-verben.obj1
  instructions_vi: Sắp xếp các từ thành câu hoàn chỉnh với động từ tách.
  items:
  - id: a1.g.trennbare-verben.ex.02.q1
    tokens:
    - dich
    - lade
    - Ich
    - ein
    - Geburtstag
    - zum
    answer: Ich lade dich zum Geburtstag ein.
    prompt_vi: 'Sắp xếp câu với động từ einladen:'
    explanation_vi: Chủ ngữ 'Ich' + 'lade' ở vị trí 2 + 'dich zum Geburtstag' + tiền tố 'ein' ở cuối câu.
  - id: a1.g.trennbare-verben.ex.02.q2
    tokens:
    - kann
    - mitkommen
    - Er
    - heute
    - nicht
    answer: Er kann heute nicht mitkommen.
    prompt_vi: 'Sắp xếp câu với Modalverb và động từ tách:'
    explanation_vi: Chủ ngữ 'Er' + Modalverb 'kann' vị trí 2 + 'heute nicht' + Infinitiv 'mitkommen' ở cuối câu.
