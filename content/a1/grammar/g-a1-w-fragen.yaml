id: g-a1-w-fragen
level: A1
title_de: "W-Fragen"
title_vi: "Câu hỏi với từ để hỏi W- (W-Fragen)"
introduced_in: a1-k01-l03
source:
  type: netzwerk-neu
  kapitel: 1
  sections: ["Woher kommen Sie?"]
  note_vi: "Tương ứng Grammatik „W-Frage“ của Kapitel 1."
prerequisites: [g-a1-verben-singular]
explanation_vi: |
  **W-Fragen** là câu hỏi bắt đầu bằng một **từ để hỏi** (Fragewort). Hầu hết từ để hỏi tiếng Đức bắt đầu bằng chữ **W** – vì vậy có tên W-Fragen.

  **Trật tự từ – rất quan trọng:**

  | Vị trí 1 | Vị trí 2 | Vị trí 3 | … |
  |---|---|---|---|
  | **Từ để hỏi** | **Động từ chia** | Chủ ngữ | (phần còn lại) |
  | Wie | heißt | du | ? |
  | Woher | kommen | Sie | ? |
  | Wo | wohnt | Anna | ? |

  Động từ **luôn đứng ở vị trí 2**, ngay sau từ để hỏi – giống như trong câu kể.

  **Các từ để hỏi trong Kapitel 1:**
  - **wer?** – ai? → *Wer ist das?*
  - **was?** – cái gì? → *Was ist das?*
  - **wie?** – như thế nào? → *Wie heißt du? Wie geht's?*
  - **wo?** – ở đâu? → *Wo wohnst du?*
  - **woher?** – từ đâu? → *Woher kommen Sie?*
  - **welche?** – (những) … nào? → *Welche Sprachen sprechen Sie?*

  **Ngữ điệu:** trong W-Frage, giọng thường **đi xuống** ở cuối câu (↘), không lên giọng như câu hỏi có/không.
usage_vi: "Dùng để hỏi thông tin cụ thể: tên, quê quán, nơi ở, ngôn ngữ. Trả lời bằng câu kể đầy đủ hoặc chỉ bằng thông tin chính."
structure:
  - pattern: "W-Wort (1) + Verb (2) + Subjekt (3) + …?"
    example_de: "Woher kommst du?"
    example_vi: "Bạn đến từ đâu?"
  - pattern: "W-Wort (1) + Verb (2) + Subjekt (3) + Ergänzung?"
    example_de: "Welche Sprachen sprechen Sie?"
    example_vi: "Ông/Bà nói những ngôn ngữ nào?"
rules:
  - rule_vi: "Từ để hỏi đứng ở vị trí 1, động từ chia đứng ở vị trí 2, chủ ngữ đứng sau động từ."
    examples:
      - { de: "Wie heißen Sie?", vi: "Ông/Bà tên là gì?" }
      - { de: "Wo wohnt Paul?", vi: "Paul sống ở đâu?" }
  - rule_vi: "Chọn đúng từ để hỏi theo thông tin cần hỏi: wer (người), was (vật), wie (cách thức, tên, tình trạng), wo (nơi chốn), woher (xuất xứ)."
    examples:
      - { de: "Wer ist das? – Das ist Frau Lang.", vi: "Đó là ai? – Đó là bà Lang." }
      - { de: "Woher kommt sie? – Aus Spanien.", vi: "Cô ấy đến từ đâu? – Từ Tây Ban Nha." }
  - rule_vi: "Câu trả lời cho wo dùng in; câu trả lời cho woher dùng aus."
    examples:
      - { de: "Wo wohnst du? – In Hanoi.", vi: "Bạn sống ở đâu? – Ở Hà Nội." }
      - { de: "Woher kommst du? – Aus Vietnam.", vi: "Bạn đến từ đâu? – Từ Việt Nam." }
  - rule_vi: "W-Frage có ngữ điệu đi xuống ở cuối câu."
    examples:
      - { de: "Wie heißt du? ↘", vi: "Bạn tên là gì?" }
tables:
  - title_vi: "Từ để hỏi và câu trả lời"
    columns: ["Từ để hỏi", "Nghĩa", "Hỏi về", "Ví dụ câu hỏi", "Ví dụ trả lời"]
    rows:
      - ["wer", "ai", "người", "Wer ist das?", "Das ist Tom."]
      - ["was", "cái gì", "vật, sự việc", "Was ist das?", "Das ist ein Taxi."]
      - ["wie", "thế nào", "tên, cách thức, tình trạng", "Wie heißt du?", "Ich heiße Mai."]
      - ["wo", "ở đâu", "nơi chốn", "Wo wohnen Sie?", "In Köln."]
      - ["woher", "từ đâu", "xuất xứ", "Woher kommst du?", "Aus Vietnam."]
      - ["welche", "nào", "lựa chọn trong một nhóm", "Welche Sprachen sprichst du?", "Deutsch und Englisch."]
examples:
  - { de: "Wie heißt du?", vi: "Bạn tên là gì?" }
  - { de: "Woher kommen Sie?", vi: "Ông/Bà đến từ đâu?" }
  - { de: "Wo wohnt Herr Schmidt?", vi: "Ông Schmidt sống ở đâu?" }
  - { de: "Wer ist das?", vi: "Đó là ai?" }
  - { de: "Welche Sprachen spricht sie?", vi: "Cô ấy nói những ngôn ngữ nào?" }
common_mistakes:
  - wrong: "Woher du kommst?"
    right: "Woher kommst du?"
    explanation_vi: "Tiếng Việt nói “Bạn đến từ đâu?” (chủ ngữ trước). Tiếng Đức: từ để hỏi – ĐỘNG TỪ – chủ ngữ."
  - wrong: "Was heißt du?"
    right: "Wie heißt du?"
    explanation_vi: "Hỏi tên dùng wie, không dùng was. (“Was heißt …?” có nghĩa khác: … nghĩa là gì?)"
  - wrong: "Wo kommst du?"
    right: "Woher kommst du?"
    explanation_vi: "kommen (đến từ) đi với woher; wohnen (sống ở) đi với wo."
  - wrong: "Wer wohnst du?"
    right: "Wo wohnst du?"
    explanation_vi: "wer = ai, wo = ở đâu. Ba từ wer/wo/wie rất dễ nhầm, hãy học kèm ví dụ."
comparison_vi: "So với câu kể: cả hai đều có động từ ở vị trí 2. Câu kể: Ich (1) komme (2) aus Vietnam. W-Frage: Woher (1) kommst (2) du? So với tiếng Anh: Where do you live? cần trợ động từ “do”, tiếng Đức thì không: Wo wohnst du?"
vietnamese_contrast_vi: "Tiếng Việt để từ để hỏi ở CUỐI hoặc giữa câu (Bạn tên là GÌ? Bạn sống ở ĐÂU?), tiếng Đức luôn đưa từ để hỏi lên ĐẦU câu. Ngoài ra tiếng Việt dùng thanh điệu cho từng chữ, còn tiếng Đức dùng ngữ điệu cả câu: W-Frage hạ giọng ở cuối."
exercises:
  - id: g-a1-w-fragen-ex01
    type: multiple-choice
    skill: grammar
    objectives: [r2, r3]
    difficulty: 1
    instructions_vi: "Chọn từ để hỏi đúng."
    items:
      - { id: q1, prompt: "___ kommst du? – Aus Japan.", options: ["Wo", "Woher", "Wer"], answer: "Woher", explanation_vi: "Trả lời bằng aus → hỏi woher." }
      - { id: q2, prompt: "___ wohnt Anna? – In Wien.", options: ["Wo", "Woher", "Wie"], answer: "Wo", explanation_vi: "Trả lời bằng in → hỏi wo." }
      - { id: q3, prompt: "___ heißen Sie? – Weber.", options: ["Was", "Wer", "Wie"], answer: "Wie", explanation_vi: "Hỏi tên dùng wie." }
      - { id: q4, prompt: "___ ist das? – Das ist Paul.", options: ["Wer", "Wo", "Was"], answer: "Wer", explanation_vi: "Hỏi người → wer." }
  - id: g-a1-w-fragen-ex02
    type: ordering
    skill: grammar
    objectives: [r1]
    difficulty: 2
    instructions_vi: "Sắp xếp thành câu hỏi đúng."
    items:
      - { id: q1, tokens: ["du", "wohnst", "Wo"], answer: "Wo wohnst du?", explanation_vi: "W-Wort (Wo) – động từ (wohnst) – chủ ngữ (du)." }
      - { id: q2, tokens: ["Sie", "Woher", "kommen"], answer: "Woher kommen Sie?", explanation_vi: "Woher – kommen – Sie." }
      - { id: q3, tokens: ["sprichst", "Sprachen", "du", "Welche"], answer: "Welche Sprachen sprichst du?", explanation_vi: "Vị trí 1 là cả cụm “Welche Sprachen”, động từ vẫn ở vị trí 2." }
summary_vi: "W-Frage: từ để hỏi (1) – động từ (2) – chủ ngữ (3). wer = ai, was = gì, wie = thế nào, wo = ở đâu (→ in), woher = từ đâu (→ aus). Hạ giọng ở cuối câu."
next_level_note_vi: "Câu hỏi có/không (Ja/Nein-Frage: Kommst du aus Vietnam?) học ở Kapitel 2. Các từ để hỏi wann, wie lange, wohin học ở Kapitel 5 và 9."
