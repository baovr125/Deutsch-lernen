grammar:
  topics: []
  notes:
    - title_vi: "Khi không có bàn phím tiếng Đức"
      explanation_vi: "Nếu không gõ được ä, ö, ü, ß, hãy viết ae, oe, ue, ss. Cách viết này được chấp nhận rộng rãi (ví dụ trong địa chỉ email, tên đăng nhập). Lưu ý: ở Thụy Sĩ người ta không dùng ß mà luôn viết ss."
      examples:
        - { de: "Müller → Mueller", vi: "họ Müller" }
        - { de: "Österreich → Oesterreich", vi: "nước Áo" }
        - { de: "Straße → Strasse", vi: "đường phố" }
redemittel:
  - id: a1-u00-l01-r01
    de: "Wie schreibt man das?"
    vi: "Cái đó viết thế nào?"
    context_vi: "Hỏi cách viết một từ hoặc tên."
    register: neutral
    dialogue:
      - { speaker: "Lan", de: "Wie schreibt man das?", vi: "Cái đó viết thế nào ạ?" }
      - { speaker: "Lehrerin", de: "M – Ü – L – L – E – R.", vi: "M – Ü – L – L – E – R." }
  - id: a1-u00-l01-r02
    de: "Groß oder klein?"
    vi: "Viết hoa hay viết thường?"
    context_vi: "Hỏi lại khi người khác đánh vần cho bạn."
    register: neutral
    dialogue:
      - { speaker: "Minh", de: "Groß oder klein?", vi: "Viết hoa hay viết thường ạ?" }
      - { speaker: "Lehrer", de: "Groß: M.", vi: "Viết hoa: M." }
pronunciation:
  - id: a1-u00-l01-p01
    focus_vi: "Tên 26 chữ cái"
    explanation_vi: |
      Nghe và nhắc lại theo nhóm. Những chữ có dấu ⚠ là chữ người Việt hay đọc nhầm (do quen đọc theo tiếng Anh hoặc tiếng Việt):
      A [aː] · B [beː] · C [tseː] ⚠ · D [deː] · E [eː] ⚠ · F [ɛf] · G [ɡeː] ⚠ · H [haː] · I [iː] ⚠ · J [jɔt] ⚠ · K [kaː] · L [ɛl] · M [ɛm]
      N [ɛn] · O [oː] · P [peː] · Q [kuː] · R [ɛʁ] ⚠ · S [ɛs] · T [teː] · U [uː] · V [faʊ̯] ⚠ · W [veː] ⚠ · X [ɪks] · Y [ˈʏpsilɔn] ⚠ · Z [tsɛt] ⚠

      - **E** đọc là "ê" [eː] – không đọc "i" như tiếng Anh.
      - **I** đọc là "i" [iː] – không đọc "ai".
      - **G** đọc "ghê" [ɡeː]; **J** đọc "giót" [jɔt] (âm đầu như "d" giọng miền Nam).
      - **V** đọc "phao" [faʊ̯]; **W** đọc "vê" [veː]. Đây là cặp dễ nhầm nhất!
      - **Z** đọc "tset" [tsɛt]; **C** đọc "tsê" [tseː].
      - **R** đọc "e" + âm r phát ra ở cuống họng [ɛʁ].
    examples:
      - { de: "A, B, C", vi: "a, bê, tsê", ipa: "[aː] [beː] [tseː]" }
      - { de: "V, W", vi: "phao, vê", ipa: "[faʊ̯] [veː]" }
      - { de: "J, Y, Z", vi: "giót, uýp-xi-lon, tset", ipa: "[jɔt] [ˈʏpsilɔn] [tsɛt]" }
    practice_vi: "Đọc to cả bảng chữ cái 3 lần. Lần 3, tự ghi âm và so sánh với audio mẫu."
  - id: a1-u00-l01-p02
    focus_vi: "Ä, Ö, Ü và ß"
    explanation_vi: |
      - **ä** [ɛ] hoặc [ɛː]: gần giống **"e"** tiếng Việt (như trong "em").
      - **ö** [ø] hoặc [œ]: miệng đặt như đọc **"ê"**, rồi **tròn môi** như đọc "ô". Không có trong tiếng Việt.
      - **ü** [y] hoặc [ʏ]: miệng đặt như đọc **"i"**, rồi **tròn môi** như đọc "u". Không có trong tiếng Việt.
      - **ß** [s]: đọc như **s** (không rung). Tên chữ: *Eszett* [ɛsˈtsɛt].
      Mẹo tập ö/ü: nói "iiii" kéo dài, giữ nguyên lưỡi, từ từ chu môi tròn lại → bạn sẽ nghe ra "üüüü".
    examples:
      - { de: "schon – schön", vi: "đã, rồi – đẹp", ipa: "[ʃoːn] – [ʃøːn]", note_vi: "Chỉ khác Umlaut nhưng khác nghĩa." }
      - { de: "Tür", vi: "cửa", ipa: "[tyːɐ̯]" }
      - { de: "Käse", vi: "phô mai", ipa: "[ˈkɛːzə]" }
      - { de: "heißen", vi: "tên là", ipa: "[ˈhaɪ̯sn̩]" }
    practice_vi: "Tập trước gương: đọc i → ü, ê → ö. Môi phải tròn rõ ràng."
examples:
  - { de: "Das ist das Alphabet.", vi: "Đây là bảng chữ cái." }
  - { de: "Ä, Ö und Ü sind Umlaute.", vi: "Ä, Ö và Ü là các nguyên âm biến âm." }
  - { de: "ß ist das Eszett.", vi: "ß là chữ Eszett." }
  - { de: "Das ist der Buchstabe W.", vi: "Đây là chữ cái W." }
  - { de: "Müller – M, Ü, L, L, E, R.", vi: "Müller – đánh vần: M, Ü, L, L, E, R." }
skills:
  listening:
    - id: a1-u00-l01-listen-01
      title_vi: "Nghe đánh vần"
      situation_vi: "Một giáo viên đánh vần một số từ quốc tế và tên người."
      audio: { status: pending-tts, speed: slow }
      script:
        - { speaker: "Lehrerin", de: "T – A – X – I. Taxi.", vi: "T – A – X – I. Taxi." }
        - { speaker: "Lehrerin", de: "H – O – T – E – L. Hotel.", vi: "H – O – T – E – L. Hotel." }
        - { speaker: "Lehrerin", de: "W – E – B – E – R. Weber.", vi: "W – E – B – E – R. Weber." }
        - { speaker: "Lehrerin", de: "J – U – L – I – A. Julia.", vi: "J – U – L – I – A. Julia." }
      exercises: [a1-u00-l01-ex02, a1-u00-l01-ex03]
  reading:
    - id: a1-u00-l01-read-01
      title_vi: "Biển hiệu trên phố"
      text_type_vi: "Biển hiệu, bảng tên cửa hàng"
      text_de: |
        Hauptstraße 5
        Bäckerei Müller
        Café Schön
        Hotel Österreich
        Fußball heute!
      translation_vi: |
        Phố Chính số 5
        Tiệm bánh Müller
        Quán cà phê Schön
        Khách sạn Österreich (Áo)
        Hôm nay có bóng đá!
      glossary:
        - { de: "die Straße", vi: "đường phố" }
        - { de: "die Bäckerei", vi: "tiệm bánh" }
        - { de: "der Fußball", vi: "bóng đá" }
      exercises: [a1-u00-l01-ex06]
  speaking:
    - id: a1-u00-l01-speak-01
      title_vi: "Đánh vần tên của bạn"
      task_vi: "Đọc to từng chữ cái trong tên và họ của bạn theo cách đọc tiếng Đức."
      steps_vi:
        - "Viết tên bạn ra giấy (không dấu tiếng Việt), ví dụ: NGUYEN THI LAN."
        - "Gạch chân các chữ dễ nhầm (E, I, G, J, V, W, Y, Z)."
        - "Đọc to từng chữ, chậm và rõ. Ghi âm lại và nghe."
      model:
        - { speaker: "Lan", de: "Lan: L – A – N. Nguyen: N – G – U – Y – E – N.", vi: "Lan: L – A – N. Nguyễn: N – G – U – Y – E – N." }
      exercises: [a1-u00-l01-ex07]
  writing:
    - id: a1-u00-l01-write-01
      title_vi: "Viết không có Umlaut"
      task_vi: "Bàn phím của bạn không có ä, ö, ü, ß. Hãy viết lại các tên và từ theo quy tắc ae, oe, ue, ss."
      model_de: "Müller → Mueller · Schön → Schoen · Straße → Strasse"
      model_vi: "Ví dụ mẫu chuyển đổi."
      checklist_vi:
        - "ä → ae, ö → oe, ü → ue"
        - "ß → ss"
        - "Giữ chữ hoa ở đầu: Ö → Oe"
      exercises: [a1-u00-l01-ex05, a1-u00-l01-ex08]
exercises:
  - id: a1-u00-l01-ex01
    type: matching
    skill: pronunciation
    objectives: [o1, o3]
    difficulty: 1
    instructions_vi: "Nối chữ cái với cách đọc đúng."
    items:
      - id: q1
        pairs:
          - { left: "V", right: "[faʊ̯]" }
          - { left: "W", right: "[veː]" }
          - { left: "J", right: "[jɔt]" }
          - { left: "Z", right: "[tsɛt]" }
          - { left: "E", right: "[eː]" }
          - { left: "I", right: "[iː]" }
        explanation_vi: "V đọc như “phao”, W đọc như “vê”, J đọc “giót”, Z đọc “tset”, E đọc “ê”, I đọc “i”."
  - id: a1-u00-l01-ex02
    type: multiple-choice
    skill: listening
    objectives: [o3]
    difficulty: 1
    stimulus: a1-u00-l01-listen-01
    instructions_vi: "Nghe đoạn đánh vần. Từ nào được đánh vần?"
    items:
      - { id: q1, prompt: "Từ thứ ba được đánh vần là:", options: ["Weber", "Veber", "Wever"], answer: "Weber", explanation_vi: "W [veː] – E – B – E – R. Chữ đầu là W (vê), không phải V (phao)." }
      - { id: q2, prompt: "Từ thứ tư được đánh vần là:", options: ["Gulia", "Julia", "Yulia"], answer: "Julia", explanation_vi: "Chữ đầu đọc [jɔt] là J." }
  - id: a1-u00-l01-ex03
    type: dictation
    skill: listening
    objectives: [o1, o3]
    difficulty: 2
    instructions_vi: "Nghe đánh vần và viết lại từ (viết hoa chữ cái đầu)."
    items:
      - { id: q1, tts: "Z – O – O. Zoo.", answer: "Zoo", explanation_vi: "Z đọc [tsɛt]. Zoo = vườn thú." }
      - { id: q2, tts: "V – A – S – E. Vase.", answer: "Vase", explanation_vi: "V đọc [faʊ̯]. Vase = bình hoa." }
      - { id: q3, tts: "J – E – N – S. Jens.", answer: "Jens", explanation_vi: "J đọc [jɔt], E đọc [eː]. Jens là một tên nam." }
  - id: a1-u00-l01-ex04
    type: true-false
    skill: vocabulary
    objectives: [o2]
    difficulty: 1
    instructions_vi: "Đúng hay sai?"
    items:
      - { id: q1, prompt: "Chữ ß có thể đứng ở đầu từ.", answer: false, explanation_vi: "ß không bao giờ đứng đầu từ." }
      - { id: q2, prompt: "schon và schön có cùng nghĩa.", answer: false, explanation_vi: "schon = đã/rồi, schön = đẹp. Umlaut làm thay đổi nghĩa." }
      - { id: q3, prompt: "Ở Thụy Sĩ, người ta viết ss thay cho ß.", answer: true, explanation_vi: "Tiếng Đức ở Thụy Sĩ không dùng ß." }
      - { id: q4, prompt: "Để đọc ü, ta đặt lưỡi như đọc “i” và tròn môi như đọc “u”.", answer: true, explanation_vi: "Đây là cách tập âm ü [y]." }
  - id: a1-u00-l01-ex05
    type: gap-fill
    skill: writing
    objectives: [o4]
    difficulty: 1
    instructions_vi: "Viết lại không dùng Umlaut/ß. Điền phần còn thiếu."
    items:
      - { id: q1, prompt: "Müller → M___ller", answer: ["ue"], explanation_vi: "ü → ue." }
      - { id: q2, prompt: "Straße → Stra___e", answer: ["ss"], explanation_vi: "ß → ss." }
      - { id: q3, prompt: "Österreich → ___sterreich", answer: ["Oe"], explanation_vi: "Ö → Oe (giữ chữ hoa)." }
      - { id: q4, prompt: "Bäckerei → B___ckerei", answer: ["ae"], explanation_vi: "ä → ae." }
  - id: a1-u00-l01-ex06
    type: multiple-choice
    skill: reading
    objectives: [o2]
    difficulty: 1
    stimulus: a1-u00-l01-read-01
    instructions_vi: "Đọc các biển hiệu. Trả lời câu hỏi."
    items:
      - { id: q1, prompt: "Từ nào có chữ ß?", options: ["Hauptstraße", "Bäckerei", "Café"], answer: "Hauptstraße", explanation_vi: "Haupt-stra-ß-e." }
      - { id: q2, prompt: "Biển nào có chữ ö?", options: ["Bäckerei Müller", "Café Schön", "Fußball heute!"], answer: "Café Schön", explanation_vi: "Schön có ö. (Österreich cũng có Ö.)" }
      - { id: q3, prompt: "Tiệm bánh tên là gì?", options: ["Bäckerei Müller", "Café Schön", "Hotel Österreich"], answer: "Bäckerei Müller", explanation_vi: "die Bäckerei = tiệm bánh; tên chủ: Müller." }
  - id: a1-u00-l01-ex07
    type: speaking
    skill: speaking
    objectives: [o1, o3]
    difficulty: 1
    grading: self
    instructions_vi: "Ghi âm bạn đánh vần tên và họ của mình. Nghe lại và tự chấm theo tiêu chí."
    rubric:
      - { criterion_vi: "Đọc đúng tên chữ cái (đặc biệt E, I, G, J, V, W, Y, Z)", points: 2 }
      - { criterion_vi: "Đọc chậm, rõ, có ngắt giữa các chữ", points: 1 }
    items:
      - { id: q1, prompt: "Đánh vần tên và họ của bạn.", model_answer: "Lan: L – A – N. Nguyen: N – G – U – Y – E – N.", explanation_vi: "Chú ý: G [ɡeː], U [uː], Y [ˈʏpsilɔn], E [eː]." }
  - id: a1-u00-l01-ex08
    type: writing
    skill: writing
    objectives: [o4]
    difficulty: 1
    grading: self
    instructions_vi: "Viết lại 3 từ sau không dùng Umlaut/ß: Schön, Fußball, Tür."
    rubric:
      - { criterion_vi: "Chuyển đổi đúng cả 3 từ", points: 3 }
    items:
      - { id: q1, prompt: "Schön, Fußball, Tür", model_answer: "Schoen, Fussball, Tuer", explanation_vi: "ö → oe, ß → ss, ü → ue." }
summary_vi: "Tiếng Đức có 26 chữ cái Latinh cộng với ä, ö, ü và ß. Chú ý tên các chữ dễ nhầm: E [eː], I [iː], J [jɔt], V [faʊ̯], W [veː], Z [tsɛt]. Umlaut có thể làm đổi nghĩa (schon ≠ schön). Khi không có bàn phím Đức: ae, oe, ue, ss."
self_check:
  - "Tôi đọc được cả bảng chữ cái tiếng Đức."
  - "Tôi phân biệt được V và W, E và I khi nghe."
  - "Tôi đọc được ä, ö, ü và biết ß đọc như s."
  - "Tôi viết được Müller thành Mueller khi cần."
