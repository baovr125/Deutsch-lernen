id: a1-u00-l01
kind: lesson
level: A1
unit: a1-u00
order: 1
title_de: "Das Alphabet"
title_vi: "Bảng chữ cái tiếng Đức, Umlaut và ß"
topic_vi: "Chữ cái và cách gọi tên chữ cái"
source:
  type: supplement
  note_vi: "Nhập môn bổ sung. Kapitel 1 (bài 4 – Zahlen und Buchstaben) sẽ dùng bảng chữ cái để đánh vần tên và email."
cefr: [A1.H2, A1.S4, A1.L1]
objectives:
  - { id: o1, vi: "Gọi tên được 26 chữ cái tiếng Đức và các chữ đặc biệt ä, ö, ü, ß." }
  - { id: o2, vi: "Hiểu rằng ä, ö, ü, ß là chữ riêng, có âm riêng và có thể làm thay đổi nghĩa của từ." }
  - { id: o3, vi: "Nghe và nhận ra các chữ cái dễ nhầm với người Việt: E/I, G/J, V/W, Y, Z." }
  - { id: o4, vi: "Viết được từ có ä, ö, ü, ß khi bàn phím không có các chữ này (ae, oe, ue, ss)." }
estimated_minutes: 50
prerequisites: []
intro_vi: |
  **Chào mừng bạn đến với tiếng Đức!**

  Tin vui đầu tiên: tiếng Đức dùng **bảng chữ cái Latinh** giống tiếng Việt và tiếng Anh, nên bạn đã biết viết gần hết các chữ.
  Khác biệt nằm ở **cách gọi tên chữ cái** và **bốn chữ đặc biệt**: **ä, ö, ü** (gọi là *Umlaut*) và **ß** (gọi là *Eszett*).

  **Cách học bài này:**
  1. Nghe và nhắc lại tên từng chữ cái (phần Phát âm).
  2. Chú ý những chữ người Việt hay đọc nhầm – được đánh dấu trong bài.
  3. Làm bài tập nghe và đánh vần.

  Trong mọi bài học, bạn sẽ thấy **phiên âm IPA** trong ngoặc vuông, ví dụ *[aː]*. Dấu **ː** nghĩa là nguyên âm **dài**.
  Bạn sẽ học cách đọc IPA kỹ hơn ở bài 2.
vocabulary:
  file: vocabulary/00-einstieg.csv
  new: [a1-u00-v001, a1-u00-v002, a1-u00-v003, a1-u00-v004]
