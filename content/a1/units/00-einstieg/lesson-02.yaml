      title_vi: "Từ quốc tế theo cách đọc Đức"
      situation_vi: "Nghe các từ quốc tế được đọc theo quy tắc tiếng Đức."
      audio: { status: pending-tts, speed: slow }
      script:
        - { speaker: "Sprecher", de: "das Hotel", vi: "khách sạn" }
        - { speaker: "Sprecher", de: "das Taxi", vi: "taxi" }
        - { speaker: "Sprecher", de: "der Kaffee", vi: "cà phê" }
        - { speaker: "Sprecher", de: "die Pizza", vi: "pizza" }
        - { speaker: "Sprecher", de: "die Musik", vi: "âm nhạc" }
      exercises: [a1-u00-l02-ex04]
  reading:
    - id: a1-u00-l02-read-01
      title_vi: "Bảng giá ở quán cà phê"
      text_type_vi: "Thực đơn"
      text_de: |
        Café Bella
        Kaffee · Tee · Cappuccino
        Pizza Margherita · Pizza Salami
        Internet: gratis
      translation_vi: |
        Quán cà phê Bella
        Cà phê · Trà · Cappuccino
        Pizza Margherita · Pizza Salami
        Internet: miễn phí
      glossary:
        - { de: "gratis", vi: "miễn phí" }
      exercises: [a1-u00-l02-ex06]
  speaking:
    - id: a1-u00-l02-speak-01
      title_vi: "Gọi món ở quán cà phê"
      task_vi: "Đọc to thực đơn ở phần Đọc, sau đó gọi 2 món bằng mẫu “Ein …, bitte!” / “Eine Pizza, bitte!”."
      steps_vi:
        - "Đọc to từng dòng thực đơn, chú ý z = [ts] trong Pizza và s = [z] trong Musik."
        - "Gọi một đồ uống và một đồ ăn."
        - "Ghi âm và nghe lại: bạn có bật rõ âm cuối không?"
      model:
        - { speaker: "Gast", de: "Ein Tee, bitte! Und eine Pizza Margherita, bitte!", vi: "Cho tôi một tách trà! Và một pizza Margherita!" }
      exercises: [a1-u00-l02-ex07]
  writing:
    - id: a1-u00-l02-write-01
      title_vi: "Sổ từ đầu tiên"
      task_vi: "Viết 5 từ quốc tế đã học vào sổ từ theo đúng mẫu: mạo từ + danh từ – số nhiều."
      model_de: "das Hotel – die Hotels\nder Kaffee – die Kaffees\ndie Pizza – die Pizzas"
      model_vi: "khách sạn – những khách sạn; cà phê – những ly cà phê; pizza – những cái pizza"
      checklist_vi:
        - "Mỗi danh từ có mạo từ."
        - "Danh từ viết hoa."
        - "Có ghi dạng số nhiều (hoặc ghi “—” nếu không có)."
      exercises: [a1-u00-l02-ex05, a1-u00-l02-ex08]
exercises:
  - id: a1-u00-l02-ex01
    type: multiple-choice
    skill: pronunciation
    objectives: [o1, o5]
    difficulty: 1
    instructions_vi: "Nguyên âm được gạch chân/được hỏi là dài hay ngắn?"
    items:
      - { id: q1, prompt: "e trong „Tee“", options: ["dài", "ngắn"], answer: "dài", explanation_vi: "ee → dài [teː]." }
      - { id: q2, prompt: "a trong „Kaffee“", options: ["dài", "ngắn"], answer: "ngắn", explanation_vi: "a + ff (hai phụ âm) → ngắn." }
      - { id: q3, prompt: "e trong „sehr“", options: ["dài", "ngắn"], answer: "dài", explanation_vi: "e + h → dài; h không đọc." }
      - { id: q4, prompt: "i trong „Pizza“", options: ["dài", "ngắn"], answer: "ngắn", explanation_vi: "i + zz → ngắn [ˈpɪtsa]." }
  - id: a1-u00-l02-ex02
    type: matching
    skill: pronunciation
    objectives: [o2, o3]
    difficulty: 2
    instructions_vi: "Nối chữ viết với âm (IPA) tương ứng."
    items:
      - id: q1
        pairs:
          - { left: "ei (nein)", right: "[aɪ̯]" }
          - { left: "ie (vier)", right: "[iː]" }
          - { left: "eu (neun)", right: "[ɔʏ̯]" }
          - { left: "z (Pizza)", right: "[ts]" }
          - { left: "ch (acht)", right: "[x]" }
          - { left: "ch (ich)", right: "[ç]" }
        explanation_vi: "ei = ai, ie = i dài, eu = oi, z = ts, ch sau a = kh [x], ch sau i = [ç]."
  - id: a1-u00-l02-ex03
    type: multiple-choice
    skill: listening
    objectives: [o1]
    difficulty: 2
    stimulus: a1-u00-l02-listen-01
    instructions_vi: "Nghe từng cặp. Từ nào có nguyên âm DÀI?"
    items:
      - { id: q1, prompt: "Cặp 1", options: ["Staat", "Stadt"], answer: "Staat", explanation_vi: "aa → dài; Stadt có dt → a ngắn." }
      - { id: q2, prompt: "Cặp 2", options: ["Miete", "Mitte"], answer: "Miete", explanation_vi: "ie → i dài; tt → i ngắn." }
      - { id: q3, prompt: "Cặp 3", options: ["Ofen", "offen"], answer: "Ofen", explanation_vi: "o + một phụ âm f → dài; ff → ngắn." }
  - id: a1-u00-l02-ex04
    type: dictation
    skill: listening
    objectives: [o3, o5]
    difficulty: 2
    stimulus: a1-u00-l02-listen-02
    instructions_vi: "Nghe và viết từ kèm mạo từ."
    items:
      - { id: q1, tts: "das Taxi", answer: "das Taxi", explanation_vi: "Giống trung: das Taxi." }
      - { id: q2, tts: "die Musik", answer: "die Musik", explanation_vi: "s giữa hai nguyên âm đọc [z]; giống cái." }
      - { id: q3, tts: "die Pizza", answer: "die Pizza", explanation_vi: "zz đọc [ts]; giống cái." }
  - id: a1-u00-l02-ex05
    type: gap-fill
    skill: vocabulary
    objectives: [o5]
    difficulty: 1
    instructions_vi: "Điền mạo từ der, die hoặc das (xem sổ từ của bài)."
    items:
      - { id: q1, prompt: "___ Tee", answer: ["der"], explanation_vi: "der Tee." }
      - { id: q2, prompt: "___ Internet", answer: ["das"], explanation_vi: "das Internet." }
      - { id: q3, prompt: "___ Pizza", answer: ["die"], explanation_vi: "die Pizza." }
      - { id: q4, prompt: "___ Hotel", answer: ["das"], explanation_vi: "das Hotel." }
  - id: a1-u00-l02-ex06
    type: true-false
    skill: reading
    objectives: [o3, o4]
    difficulty: 1
    stimulus: a1-u00-l02-read-01
    instructions_vi: "Đọc thực đơn Café Bella. Đúng hay sai?"
    items:
      - { id: q1, prompt: "Internet ở quán miễn phí.", answer: true, explanation_vi: "Internet: gratis = miễn phí." }
      - { id: q2, prompt: "Trong „Pizza“, zz đọc như „dd“.", answer: false, explanation_vi: "zz đọc [ts]." }
      - { id: q3, prompt: "Quán có trà.", answer: true, explanation_vi: "Tee = trà." }
      - { id: q4, prompt: "d trong „und“ đọc là [t].", answer: true, explanation_vi: "b, d, g ở cuối từ đọc thành p, t, k." }
  - id: a1-u00-l02-ex07
    type: speaking
    skill: speaking
    objectives: [o3, o4]
    difficulty: 1
    grading: self
    instructions_vi: "Ghi âm bạn gọi món: một đồ uống, một đồ ăn. Tự chấm."
    rubric:
      - { criterion_vi: "Đọc đúng z [ts] trong Pizza và ee [eː] trong Tee", points: 2 }
      - { criterion_vi: "Bật rõ phụ âm cuối, không thêm thanh điệu tiếng Việt", points: 2 }
    items:
      - { id: q1, prompt: "Gọi một đồ uống và một đồ ăn.", model_answer: "Ein Kaffee, bitte! Und eine Pizza Salami, bitte!", explanation_vi: "Kaffee: nhấn KAF; Pizza: [ˈpɪtsa]." }
  - id: a1-u00-l02-ex08
