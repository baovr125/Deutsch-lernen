id: a1-u00-l03
kind: lesson
level: A1
unit: a1-u00
order: 3
title_de: "Betonung und Satzmelodie"
title_vi: "Trọng âm, ngữ điệu và các yêu cầu trong bài tập"
topic_vi: "Nhịp điệu tiếng Đức; hiểu đề bài tiếng Đức"
source:
  type: supplement
  note_vi: "Nhập môn bổ sung. Satzmelodie (ngữ điệu câu hỏi – câu trả lời) được Netzwerk neu A1 luyện ở Kapitel 2; bài này giới thiệu trước để người học tự học nhận biết sớm."
cefr: [A1.SP3, A1.H2, A1.L4]
objectives:
  - { id: o1, vi: "Nhận biết trọng âm từ: đa số từ tiếng Đức nhấn âm tiết đầu; biết các ngoại lệ thường gặp." }
  - { id: o2, vi: "Nhận biết ngữ điệu: câu kể và câu hỏi W- đi xuống, câu hỏi có/không đi lên." }
  - { id: o3, vi: "Hiểu và làm theo các yêu cầu bài tập: hören, lesen, schreiben, nachsprechen, richtig/falsch." }
  - { id: o4, vi: "Đọc to câu ngắn với âm tiết nhấn mạnh và âm tiết đọc lướt, không đọc đều từng chữ." }
estimated_minutes: 50
prerequisites: [a1-u00-l02]
intro_vi: |
  Tiếng Việt là ngôn ngữ **thanh điệu**: mỗi chữ có dấu thanh riêng và các chữ được đọc gần như **dài bằng nhau**.
  Tiếng Đức thì khác:
  - **Không có thanh điệu** cho từng chữ.
  - Trong mỗi từ có **một âm tiết được nhấn** (to hơn, dài hơn, rõ hơn), các âm tiết còn lại đọc **nhẹ và lướt**.
  - Cả câu có **ngữ điệu**: giọng đi lên hoặc đi xuống ở cuối câu.

  Nếu bạn đọc mọi âm tiết đều nhau như tiếng Việt, người Đức sẽ khó hiểu dù bạn phát âm từng âm đúng.

  Bài này cũng dạy bạn **các yêu cầu tiếng Đức thường gặp trong bài tập** (*Hören Sie. Lesen Sie. Sprechen Sie nach.*),
  để bạn quen với chúng ngay từ đầu.
vocabulary:
  file: vocabulary/00-einstieg.csv
  new: [a1-u00-v012, a1-u00-v013, a1-u00-v014, a1-u00-v015, a1-u00-v016, a1-u00-v017]
  review: [a1-u00-v005, a1-u00-v006, a1-u00-v007, a1-u00-v009, a1-u00-v010]
grammar:
  topics: []
  notes:
    - title_vi: "Câu yêu cầu trong đề bài: động từ + Sie"
      explanation_vi: "Đề bài tiếng Đức thường có dạng ĐỘNG TỪ + Sie (lịch sự): Hören Sie. = Hãy nghe. Đây là thể mệnh lệnh trang trọng, sẽ học kỹ ở Kapitel 3. Bây giờ chỉ cần học thuộc như cụm từ."
      examples:
        - { de: "Hören Sie.", vi: "Hãy nghe." }
        - { de: "Lesen Sie.", vi: "Hãy đọc." }
        - { de: "Hören Sie und sprechen Sie nach.", vi: "Hãy nghe và nhắc lại." }
redemittel:
  - id: a1-u00-l03-r01
    de: "Hören Sie und sprechen Sie nach."
    vi: "Hãy nghe và nhắc lại."
    context_vi: "Yêu cầu thường gặp nhất trong bài luyện phát âm."
    register: formal
    dialogue:
      - { speaker: "Lehrerin", de: "Hören Sie und sprechen Sie nach: Hotel.", vi: "Hãy nghe và nhắc lại: Hotel." }
      - { speaker: "Lan", de: "Hotel.", vi: "Hotel." }
  - id: a1-u00-l03-r02
    de: "Richtig oder falsch?"
    vi: "Đúng hay sai?"
    context_vi: "Câu hỏi trong bài tập đúng/sai; cũng dùng khi hỏi lại giáo viên câu trả lời của mình."
    register: neutral
    dialogue:
      - { speaker: "Minh", de: "„Taxi“ – richtig oder falsch?", vi: "“Taxi” – đúng hay sai ạ?" }
      - { speaker: "Lehrer", de: "Richtig!", vi: "Đúng!" }
pronunciation:
  - id: a1-u00-l03-p01
    focus_vi: "Trọng âm từ (Wortakzent)"
    explanation_vi: |
      **Quy tắc chung:** từ gốc Đức thường nhấn **âm tiết đầu**: *HÖ-ren, LE-sen, SCHREI-ben, RICH-tig, DAN-ke*.

      **Ngoại lệ thường gặp ở A1:**
      - Nhiều **từ vay mượn** nhấn ở **cuối**: *Ho-TEL, Mu-SIK, Al-pha-BET*.
      - Động từ tận cùng **-ieren** nhấn vào **ie**: *buch-sta-BIE-ren*.
      - Từ có tiền tố **be-, ver-, ent-** không nhấn tiền tố: *ver-STE-hen, Ent-SCHUL-di-gung*.

      Trong sổ từ, IPA có dấu **ˈ** đứng trước âm tiết được nhấn: *Musik* [muˈziːk].
    examples:
      - { de: "Hotel", vi: "khách sạn", ipa: "[hoˈtɛl]" }
      - { de: "Taxi", vi: "taxi", ipa: "[ˈtaksi]" }
      - { de: "richtig", vi: "đúng", ipa: "[ˈʁɪçtɪç]" }
      - { de: "Musik", vi: "âm nhạc", ipa: "[muˈziːk]" }
    practice_vi: "Đọc từng từ, vỗ tay mạnh ở âm tiết nhấn và vỗ nhẹ ở âm tiết còn lại."
  - id: a1-u00-l03-p02
    focus_vi: "Ngữ điệu câu (Satzmelodie)"
    explanation_vi: |
      - **Câu kể** → giọng **đi xuống** ở cuối (↘): *Das ist ein Taxi.* ↘
      - **Câu hỏi W-** (wie, wo, wer…) → giọng **đi xuống** (↘): *Wie heißt du?* ↘
      - **Câu hỏi có/không** (động từ đứng đầu) → giọng **đi lên** (↗): *Ist das ein Taxi?* ↗

      Người Việt hay lên giọng ở mọi câu hỏi. Nhớ: câu hỏi W- của tiếng Đức hạ giọng!
    examples:
      - { de: "Das ist ein Taxi. ↘", vi: "Đó là một chiếc taxi." }
      - { de: "Ist das ein Taxi? ↗", vi: "Đó có phải là taxi không?" }
      - { de: "Wie heißt du? ↘", vi: "Bạn tên là gì?" }
    practice_vi: "Đọc ba câu trên, dùng tay vẽ mũi tên lên/xuống trong không khí khi đọc phần cuối câu."
  - id: a1-u00-l03-p03
    focus_vi: "Nhịp: âm tiết mạnh – âm tiết yếu"
    explanation_vi: "Các âm tiết không nhấn, đặc biệt đuôi -e [ə] và -en, được đọc rất nhẹ và nhanh: lesen [ˈleːzn̩] gần như chỉ còn “LÊ-zn”. Ngược lại, âm tiết nhấn được kéo dài và đọc rõ."
    examples:
      - { de: "lesen", vi: "đọc", ipa: "[ˈleːzn̩]" }
      - { de: "schreiben", vi: "viết", ipa: "[ˈʃʁaɪ̯bn̩]" }
    practice_vi: "Đọc “lesen – schreiben – hören” thật nhanh như nhịp trống: MẠNH-nhẹ, MẠNH-nhẹ."
examples:
  - { de: "Hören Sie, bitte.", vi: "Xin hãy nghe." }
  - { de: "Lesen Sie, bitte.", vi: "Xin hãy đọc." }
  - { de: "Ich schreibe.", vi: "Tôi viết." }
  - { de: "Richtig oder falsch?", vi: "Đúng hay sai?" }
  - { de: "Das ist falsch.", vi: "Cái đó sai." }
skills:
  listening:
    - id: a1-u00-l03-listen-01
      title_vi: "Lên giọng hay xuống giọng?"
      situation_vi: "Nghe ba câu và chú ý phần cuối câu."
      audio: { status: pending-tts, speed: slow }
      script:
        - { speaker: "Sprecherin", de: "Das ist ein Hotel.", vi: "Đó là một khách sạn." }
        - { speaker: "Sprecherin", de: "Ist das ein Hotel?", vi: "Đó có phải là khách sạn không?" }
        - { speaker: "Sprecherin", de: "Wo ist das Hotel?", vi: "Khách sạn ở đâu?" }
      exercises: [a1-u00-l03-ex02]
  reading:
    - id: a1-u00-l03-read-01
      title_vi: "Đề bài tiếng Đức"
      text_type_vi: "Yêu cầu bài tập"
      text_de: |
        1. Hören Sie.
        2. Lesen Sie den Text.
        3. Hören Sie und sprechen Sie nach.
        4. Schreiben Sie die Wörter.
        5. Richtig oder falsch? Kreuzen Sie an.
      translation_vi: |
        1. Hãy nghe.
        2. Hãy đọc bài đọc.
        3. Hãy nghe và nhắc lại.
        4. Hãy viết các từ.
        5. Đúng hay sai? Hãy đánh dấu (x).
      glossary:
        - { de: "der Text", vi: "bài đọc, văn bản" }
        - { de: "die Wörter", vi: "các từ (số nhiều của das Wort)" }
        - { de: "an|kreuzen", vi: "đánh dấu x" }
      exercises: [a1-u00-l03-ex03]
  speaking:
    - id: a1-u00-l03-speak-01
      title_vi: "Đọc với trọng âm và ngữ điệu"
      task_vi: "Đọc to 5 từ và 3 câu, chú ý âm tiết nhấn và ngữ điệu cuối câu."
      steps_vi:
        - "Đọc: Hotel – Taxi – Musik – Internet – richtig."
        - "Đọc: Das ist ein Taxi. ↘ / Ist das ein Taxi? ↗ / Wie heißt du? ↘"
        - "Ghi âm, nghe lại và so sánh với audio mẫu."
      model:
        - { speaker: "Sprecher", de: "Ho-TEL, TA-xi, Mu-SIK, IN-ter-net, RICH-tig.", vi: "(chữ in hoa = âm tiết nhấn)" }
      exercises: [a1-u00-l03-ex06]
  writing:
    - id: a1-u00-l03-write-01
      title_vi: "Chép đề bài"
      task_vi: "Chép lại chính xác 3 yêu cầu đề bài và viết nghĩa tiếng Việt bên cạnh."
      model_de: "Hören Sie. – Lesen Sie. – Sprechen Sie nach."
      model_vi: "Hãy nghe. – Hãy đọc. – Hãy nhắc lại."
      checklist_vi:
        - "Viết hoa chữ đầu câu và chữ Sie."
        - "Có dấu chấm cuối câu."
      exercises: [a1-u00-l03-ex07]
exercises:
  - id: a1-u00-l03-ex01
    type: multiple-choice
    skill: pronunciation
    objectives: [o1]
    difficulty: 1
    instructions_vi: "Âm tiết nào được nhấn?"
    items:
      - { id: q1, prompt: "Hotel", options: ["HO-tel", "ho-TEL"], answer: "ho-TEL", explanation_vi: "Từ vay mượn, nhấn ở cuối: [hoˈtɛl]." }
      - { id: q2, prompt: "Taxi", options: ["TA-xi", "ta-XI"], answer: "TA-xi", explanation_vi: "[ˈtaksi]." }
      - { id: q3, prompt: "lesen", options: ["LE-sen", "le-SEN"], answer: "LE-sen", explanation_vi: "Từ gốc Đức, nhấn âm tiết đầu." }
      - { id: q4, prompt: "Musik", options: ["MU-sik", "mu-SIK"], answer: "mu-SIK", explanation_vi: "[muˈziːk]." }
  - id: a1-u00-l03-ex02
    type: multiple-choice
    skill: listening
    objectives: [o2]
    difficulty: 2
    stimulus: a1-u00-l03-listen-01
    instructions_vi: "Nghe từng câu. Giọng cuối câu đi lên (↗) hay đi xuống (↘)?"
    items:
      - { id: q1, prompt: "Câu 1: Das ist ein Hotel.", options: ["↗", "↘"], answer: "↘", explanation_vi: "Câu kể → xuống giọng." }
      - { id: q2, prompt: "Câu 2: Ist das ein Hotel?", options: ["↗", "↘"], answer: "↗", explanation_vi: "Câu hỏi có/không → lên giọng." }
      - { id: q3, prompt: "Câu 3: Wo ist das Hotel?", options: ["↗", "↘"], answer: "↘", explanation_vi: "Câu hỏi W- → xuống giọng." }
  - id: a1-u00-l03-ex03
    type: matching
    skill: reading
    objectives: [o3]
    difficulty: 1
    stimulus: a1-u00-l03-read-01
    instructions_vi: "Nối yêu cầu tiếng Đức với nghĩa tiếng Việt."
    items:
      - id: q1
        pairs:
          - { left: "Hören Sie.", right: "Hãy nghe." }
          - { left: "Lesen Sie.", right: "Hãy đọc." }
          - { left: "Schreiben Sie.", right: "Hãy viết." }
          - { left: "Sprechen Sie nach.", right: "Hãy nhắc lại." }
          - { left: "Richtig oder falsch?", right: "Đúng hay sai?" }
        explanation_vi: "hören = nghe, lesen = đọc, schreiben = viết, nachsprechen = nói theo, richtig/falsch = đúng/sai."
  - id: a1-u00-l03-ex04
    type: true-false
    skill: pronunciation
    objectives: [o1, o2]
    difficulty: 1
    instructions_vi: "Đúng hay sai?"
    items:
      - { id: q1, prompt: "Từ gốc Đức thường nhấn ở âm tiết đầu.", answer: true, explanation_vi: "Ví dụ: HÖ-ren, LE-sen, RICH-tig." }
      - { id: q2, prompt: "Câu hỏi với „wie, wo, wer“ thường lên giọng ở cuối.", answer: false, explanation_vi: "Câu hỏi W- thường xuống giọng." }
      - { id: q3, prompt: "Tiếng Đức có thanh điệu cho từng chữ như tiếng Việt.", answer: false, explanation_vi: "Tiếng Đức không có thanh điệu; chỉ có trọng âm và ngữ điệu câu." }
  - id: a1-u00-l03-ex05
    type: ordering
    skill: reading
    objectives: [o3]
    difficulty: 1
    instructions_vi: "Sắp xếp thành câu yêu cầu đúng."
    items:
      - { id: q1, tokens: ["nach", "Sprechen", "Sie"], answer: "Sprechen Sie nach.", explanation_vi: "Động từ tách: Sprechen … nach – phần nach ở cuối." }
      - { id: q2, tokens: ["Sie", "Hören"], answer: "Hören Sie.", explanation_vi: "Câu yêu cầu: động từ đứng đầu + Sie." }
  - id: a1-u00-l03-ex06
    type: speaking
    skill: speaking
    objectives: [o1, o2, o4]
    difficulty: 1
    grading: self
    instructions_vi: "Ghi âm phần Nói (5 từ + 3 câu). Nghe lại và tự chấm."
    rubric:
      - { criterion_vi: "Nhấn đúng âm tiết ở cả 5 từ", points: 2 }
      - { criterion_vi: "Ngữ điệu đúng ở 3 câu (↘ ↗ ↘)", points: 2 }
      - { criterion_vi: "Âm tiết không nhấn được đọc nhẹ, không đọc đều như tiếng Việt", points: 1 }
    items:
      - { id: q1, prompt: "Hotel – Taxi – Musik – Internet – richtig. / Das ist ein Taxi. / Ist das ein Taxi? / Wie heißt du?", model_answer: "ho-TEL, TA-xi, mu-SIK, IN-ter-net, RICH-tig. Das ist ein Taxi ↘. Ist das ein Taxi ↗? Wie heißt du ↘?", explanation_vi: "So sánh với audio mẫu; chú ý câu hỏi W- xuống giọng." }
  - id: a1-u00-l03-ex07
    type: writing
    skill: writing
    objectives: [o3]
    difficulty: 1
    grading: self
    instructions_vi: "Chép lại 3 yêu cầu và viết nghĩa tiếng Việt."
    rubric:
      - { criterion_vi: "Chép đúng chính tả, viết hoa Sie và chữ đầu câu", points: 2 }
      - { criterion_vi: "Nghĩa tiếng Việt đúng", points: 1 }
    items:
      - { id: q1, prompt: "Hören Sie. / Lesen Sie. / Sprechen Sie nach.", model_answer: "Hören Sie. = Hãy nghe. / Lesen Sie. = Hãy đọc. / Sprechen Sie nach. = Hãy nhắc lại.", explanation_vi: "Sie luôn viết hoa khi là cách xưng trang trọng." }
summary_vi: "Mỗi từ tiếng Đức có một âm tiết nhấn – thường là âm tiết đầu (trừ nhiều từ vay mượn, động từ -ieren, tiền tố be-/ver-/ent-). Câu kể và câu hỏi W- xuống giọng; câu hỏi có/không lên giọng. Đề bài thường có dạng: Hören Sie. Lesen Sie. Sprechen Sie nach."
self_check:
  - "Tôi nói được âm tiết nhấn của Hotel, Taxi, Musik."
  - "Tôi biết câu hỏi W- xuống giọng ở cuối."
  - "Tôi hiểu các yêu cầu: Hören Sie, Lesen Sie, Schreiben Sie, Sprechen Sie nach, Richtig oder falsch."
