id: a1-k01-l04
kind: lesson
level: A1
unit: a1-k01
order: 4
title_de: "Zahlen und Buchstaben"
title_vi: "Số 0–20, số điện thoại, đánh vần và email"
topic_vi: "Trao đổi thông tin liên lạc; báo rằng mình chưa hiểu"
source:
  type: netzwerk-neu
  kapitel: 1
  sections: ["Zahlen und Buchstaben"]
  note_vi: "Sprachhandlungen: Zahlen hören und nachsprechen; Handynummern verstehen und notieren; die Telefonnummer erfragen; das Alphabet verstehen; die E-Mail-Adresse notieren; nachfragen und buchstabieren. Wortschatz: Zahlen 1–20, Alphabet, E-Mail-Adresse, Unverständnis ausdrücken. Strategie: E-Mail-Adressen schreiben und sagen."
cefr: [A1.H3, A1.SI3, A1.SI4, A1.L3, A1.S1, A1.S4]
objectives:
  - { id: o1, vi: "Đếm, nghe và đọc các số từ 0 đến 20." }
  - { id: o2, vi: "Hỏi, nói và ghi lại số điện thoại." }
  - { id: o3, vi: "Đánh vần tên của mình và ghi lại tên khi người khác đánh vần." }
  - { id: o4, vi: "Đọc và ghi lại địa chỉ email (Punkt, at, Unterstrich, Bindestrich)." }
  - { id: o5, vi: "Báo rằng mình chưa hiểu và đề nghị nhắc lại, nói chậm hoặc đánh vần." }
estimated_minutes: 90
prerequisites: [a1-k01-l03, a1-u00-l01]
intro_vi: |
  Khi đăng ký khóa học, mở tài khoản hay hẹn gặp ai đó, bạn luôn phải trao đổi **số điện thoại**, **email**
  và **đánh vần tên** – nhất là tên tiếng Việt, người Đức thường không biết viết thế nào!

  Bài này gồm bốn phần:
  1. **Số 0–20** – cách đếm và mẹo nhớ.
  2. **Số điện thoại** – người Đức đọc từng chữ số, đôi khi theo cặp.
  3. **Đánh vần** – dùng bảng chữ cái bạn đã học ở phần nhập môn.
  4. **Email** – cách đọc các ký hiệu @ . _ -

  Và quan trọng nhất: **khi không hiểu, đừng im lặng!** Hãy nói *Wie bitte? Noch einmal, bitte. Langsam, bitte.*
vocabulary:
