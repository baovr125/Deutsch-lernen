grammar:
  topics: []
  notes:
    - title_vi: "Số 13–19: đơn vị + zehn (và hai ngoại lệ chính tả)"
      explanation_vi: "Từ 13 đến 19: số hàng đơn vị đứng TRƯỚC, zehn đứng SAU – ngược với tiếng Việt (mười ba). Hai ngoại lệ chính tả: sechzehn (mất s), siebzehn (mất en). 11 (elf) và 12 (zwölf) phải học thuộc."
      examples:
        - { de: "drei + zehn = dreizehn", vi: "13 (nghĩa đen: ba-mười)" }
        - { de: "sechs → sechzehn, sieben → siebzehn", vi: "16, 17 – chú ý chính tả" }
    - title_vi: "mein/dein/Ihr + danh từ giống cái thêm -e"
      explanation_vi: "Trước danh từ giống cái (die Nummer, die E-Mail-Adresse), thêm -e: meine, deine, Ihre. Trước danh từ giống đực/trung (der Name, das Handy) giữ nguyên: mein, dein, Ihr. Quy tắc đầy đủ học ở Kapitel 5."
      examples:
        - { de: "Wie ist deine Handynummer?", vi: "Số di động của bạn là gì?", note_vi: "die Handynummer → deine" }
        - { de: "Wie ist Ihr Name?", vi: "Tên của ông/bà là gì?", note_vi: "der Name → Ihr" }
    - title_vi: "Phủ định đơn giản với nicht"
      explanation_vi: "nicht phủ định động từ hoặc tính từ. Trong câu ngắn, nicht thường đứng ở CUỐI câu – khác tiếng Việt (“không” đứng trước động từ). Phủ định danh từ bằng kein/keine học ở Kapitel 3."
      examples:
        - { de: "Ich verstehe das nicht.", vi: "Tôi không hiểu cái đó." }
        - { de: "Das ist nicht richtig.", vi: "Cái đó không đúng." }
    - title_vi: "Danh từ ghép: giống theo từ cuối"
      explanation_vi: "Khi ghép hai danh từ, mạo từ (và số nhiều) theo từ CUỐI: das Telefon + die Nummer → die Telefonnummer. Đây là mẹo rất hữu ích để đoán giống."
      examples:
        - { de: "das Handy + die Nummer → die Handynummer", vi: "số điện thoại di động" }
        - { de: "die E-Mail + die Adresse → die E-Mail-Adresse", vi: "địa chỉ email" }
redemittel:
  - id: a1-k01-l04-r01
    de: "Wie ist deine/Ihre Telefonnummer? – Meine Nummer ist …"
    vi: "Số điện thoại của bạn/ông bà là gì? – Số của tôi là …"
    context_vi: "Hỏi và nói số điện thoại. Đọc từng chữ số; người Đức hay nói “zwo” thay “zwei” để khỏi nhầm với “drei”."
    register: neutral
    dialogue:
      - { speaker: "Tom", de: "Wie ist deine Handynummer?", vi: "Số di động của bạn là gì?" }
      - { speaker: "Lan", de: "Null, eins, sieben, sechs – drei, vier, acht – neun, null, zwo.", vi: "0176 – 348 – 902." }
      - { speaker: "Tom", de: "Danke!", vi: "Cảm ơn!" }
  - id: a1-k01-l04-r02
    de: "Wie ist Ihre E-Mail-Adresse?"
    vi: "Địa chỉ email của ông/bà là gì?"
    context_vi: "Hỏi email. Đọc ký hiệu: @ = at [ɛt], . = Punkt, _ = Unterstrich, - = Bindestrich (hoặc Minus)."
    register: formal
    dialogue:
      - { speaker: "Frau Lang", de: "Wie ist Ihre E-Mail-Adresse?", vi: "Địa chỉ email của anh là gì?" }
      - { speaker: "Minh", de: "minh Punkt tran at web Punkt de.", vi: "minh.tran@web.de" }
  - id: a1-k01-l04-r03
    de: "Wie schreibt man das? / Buchstabieren Sie, bitte."
    vi: "Cái đó viết thế nào? / Xin ông/bà đánh vần giúp."
    context_vi: "Đề nghị đánh vần một tên hoặc một từ."
    register: formal
    dialogue:
      - { speaker: "Frau Lang", de: "Wie heißen Sie?", vi: "Chị tên là gì?" }
      - { speaker: "Lan", de: "Nguyen.", vi: "Nguyễn." }
      - { speaker: "Frau Lang", de: "Wie schreibt man das? Buchstabieren Sie, bitte.", vi: "Viết thế nào ạ? Chị đánh vần giúp tôi." }
      - { speaker: "Lan", de: "N – G – U – Y – E – N.", vi: "N – G – U – Y – E – N." }
  - id: a1-k01-l04-r04
    de: "Wie bitte? / Noch einmal, bitte. / Langsam, bitte."
    vi: "Xin lỗi, gì cơ? / Làm ơn nói lại. / Làm ơn nói chậm thôi."
    context_vi: "Ba câu cứu nguy khi chưa nghe kịp hoặc chưa hiểu."
    register: neutral
    dialogue:
      - { speaker: "Herr Bauer", de: "Meine Nummer ist null-eins-fünf-zwo-acht-sieben-drei.", vi: "Số của tôi là 0152 873." }
      - { speaker: "Lan", de: "Entschuldigung, langsam, bitte. Noch einmal, bitte.", vi: "Xin lỗi, làm ơn nói chậm thôi. Làm ơn nói lại." }
      - { speaker: "Herr Bauer", de: "Null – eins – fünf – zwo …", vi: "0 – 1 – 5 – 2 …" }
  - id: a1-k01-l04-r05
    de: "Ich spreche ein bisschen Deutsch. – Ich verstehe das nicht."
    vi: "Tôi nói được một chút tiếng Đức. – Tôi không hiểu cái đó."
    context_vi: "Cho người đối diện biết trình độ của bạn để họ nói chậm, đơn giản hơn."
    register: neutral
    dialogue:
      - { speaker: "Mann", de: "Entschuldigung, wo ist die Bushaltestelle?", vi: "Xin lỗi, trạm xe buýt ở đâu ạ?" }
      - { speaker: "Minh", de: "Entschuldigung, ich spreche nur ein bisschen Deutsch. Ich verstehe das nicht.", vi: "Xin lỗi, tôi chỉ nói được một chút tiếng Đức. Tôi không hiểu." }
pronunciation:
  - id: a1-k01-l04-p01
    focus_vi: "Các số dễ nhầm"
    explanation_vi: |
      - **vier [fiːɐ̯] – vierzehn [ˈfɪʁtseːn]**: ie dài trong vier nhưng NGẮN trong vierzehn.
      - **zwei – drei**: dễ nghe nhầm qua điện thoại → người Đức nói **zwo** cho số 2.
      - **sechs [zɛks]**: chs = [ks]. **sechzehn [ˈzɛçtseːn]**: ch = [ç].
      - **13–19 và 20**: nhấn âm tiết đầu: DREI-zehn, ZWAN-zig.
      - Đuôi **-zig [tsɪç]** trong zwanzig.
    examples:
      - { de: "vier – vierzehn", vi: "4 – 14", ipa: "[fiːɐ̯] – [ˈfɪʁtseːn]" }
      - { de: "zwei / zwo", vi: "2", ipa: "[tsvaɪ̯] / [tsvoː]" }
      - { de: "sechs – sechzehn", vi: "6 – 16", ipa: "[zɛks] – [ˈzɛçtseːn]" }
    practice_vi: "Đếm 0 → 20 rồi 20 → 0. Sau đó đọc số điện thoại của chính bạn 3 lần."
  - id: a1-k01-l04-p02
    focus_vi: "Ký hiệu trong email"
    explanation_vi: "@ đọc là “at” [ɛt] (như tiếng Anh), dấu chấm là Punkt [pʊŋkt], _ là Unterstrich, - là Bindestrich (nhiều người nói Minus). Tên miền .de đọc là “de” [deː]: Punkt de."
    examples:
      - { de: "lan.pham@gmx.de", vi: "lan Punkt pham at g-m-x Punkt de", ipa: "[… ɛt ɡeː ɛm ɪks pʊŋkt deː]" }
    practice_vi: "Đọc to địa chỉ email thật của bạn theo cách tiếng Đức."
examples:
  - { de: "Wie ist deine Handynummer? – 0176 348902.", vi: "Số di động của bạn là gì? – 0176 348902." }
  - { de: "Mein Nachname ist Nguyen: N – G – U – Y – E – N.", vi: "Họ của tôi là Nguyễn: N – G – U – Y – E – N." }
  - { de: "Wie schreibt man das?", vi: "Cái đó viết thế nào?" }
  - { de: "Noch einmal, bitte. Langsam, bitte!", vi: "Làm ơn nói lại. Làm ơn nói chậm thôi!" }
  - { de: "Wie sagt man „cảm ơn“ auf Deutsch? – Danke.", vi: "“Cảm ơn” tiếng Đức nói thế nào? – Danke." }
  - { de: "Ich verstehe das nicht.", vi: "Tôi không hiểu cái đó." }
  - { de: "Zehn plus fünf ist fünfzehn.", vi: "Mười cộng năm là mười lăm." }
skills:
  listening:
    - id: a1-k01-l04-listen-01
      title_vi: "Đăng ký khóa học qua điện thoại"
      situation_vi: "Lan gọi điện cho trường ngôn ngữ để đăng ký khóa học tiếng Đức. Nhân viên hỏi tên, số điện thoại và email."
      audio: { status: pending-tts, speed: slow }
      script:
        - { speaker: "Frau Wolf", de: "Sprachschule Linden, Wolf, guten Tag!", vi: "Trường ngôn ngữ Linden, Wolf nghe, xin chào!" }
        - { speaker: "Lan", de: "Guten Tag! Mein Name ist Lan Nguyen. Ich spreche ein bisschen Deutsch.", vi: "Xin chào! Tôi tên là Lan Nguyễn. Tôi nói được một chút tiếng Đức." }
        - { speaker: "Frau Wolf", de: "Kein Problem. Wie ist Ihr Nachname? Buchstabieren Sie, bitte.", vi: "Không sao. Họ của chị là gì? Chị đánh vần giúp tôi." }
        - { speaker: "Lan", de: "N – G – U – Y – E – N.", vi: "N – G – U – Y – E – N." }
        - { speaker: "Frau Wolf", de: "Danke. Und wie ist Ihre Telefonnummer?", vi: "Cảm ơn. Còn số điện thoại của chị là gì?" }
        - { speaker: "Lan", de: "Null, eins, sieben, sechs – zwo, vier, acht – fünf, null, drei.", vi: "0176 – 248 – 503." }
        - { speaker: "Frau Wolf", de: "Wie bitte? Noch einmal, bitte. Langsam, bitte.", vi: "Xin lỗi? Chị nói lại giúp. Chậm thôi ạ." }
        - { speaker: "Lan", de: "Null – eins – sieben – sechs – zwo – vier – acht – fünf – null – drei.", vi: "0 – 1 – 7 – 6 – 2 – 4 – 8 – 5 – 0 – 3." }
        - { speaker: "Frau Wolf", de: "Danke. Und Ihre E-Mail-Adresse?", vi: "Cảm ơn. Còn địa chỉ email của chị?" }
        - { speaker: "Lan", de: "lan Unterstrich nguyen at web Punkt de.", vi: "lan_nguyen@web.de" }
        - { speaker: "Frau Wolf", de: "Super, danke, Frau Nguyen. Auf Wiedersehen!", vi: "Tuyệt, cảm ơn chị Nguyễn. Tạm biệt!" }
        - { speaker: "Lan", de: "Auf Wiedersehen!", vi: "Tạm biệt!" }
      exercises: [a1-k01-l04-ex03, a1-k01-l04-ex04]
    - id: a1-k01-l04-listen-02
      title_vi: "Nghe số"
      situation_vi: "Một người đọc các con số riêng lẻ."
      audio: { status: pending-tts, speed: slow }
      script:
        - { speaker: "Sprecher", de: "vierzehn – zwölf – sechzehn – siebzehn – zwanzig", vi: "14 – 12 – 16 – 17 – 20" }
      exercises: [a1-k01-l04-ex02]
  reading:
    - id: a1-k01-l04-read-01
      title_vi: "Phiếu đăng ký khóa học"
      text_type_vi: "Biểu mẫu"
      text_de: |
        Sprachschule Linden – Anmeldung Deutschkurs A1

        Nachname:      Nguyen
        Vorname:       Thi Lan
        Land:          Vietnam
        Wohnort:       Leipzig
        Telefon:       0176 248503
        E-Mail:        lan_nguyen@web.de
        Sprachen:      Vietnamesisch, Englisch
      translation_vi: |
        Trường ngôn ngữ Linden – Đăng ký khóa học tiếng Đức A1

        Họ:            Nguyễn
        Tên:           Thị Lan
        Nước:          Việt Nam
        Nơi ở:         Leipzig
        Điện thoại:    0176 248503
        Email:         lan_nguyen@web.de
        Ngôn ngữ:      tiếng Việt, tiếng Anh
      glossary:
        - { de: "die Anmeldung", vi: "sự đăng ký, phiếu đăng ký" }
        - { de: "der Deutschkurs", vi: "khóa học tiếng Đức" }
        - { de: "der Wohnort", vi: "nơi ở" }
      exercises: [a1-k01-l04-ex07]
  speaking:
    - id: a1-k01-l04-speak-01
      title_vi: "Trao đổi thông tin liên lạc"
      task_vi: "Đóng vai: bạn và một bạn học mới trao đổi số điện thoại và email. Ít nhất một lần, hãy đề nghị nhắc lại hoặc nói chậm, và đánh vần họ của bạn."
      steps_vi:
        - "Hỏi số điện thoại: Wie ist deine Handynummer?"
        - "Đọc số của bạn theo từng chữ số (dùng zwo cho số 2)."
        - "Hỏi email; khi nghe chưa rõ, nói: Wie bitte? / Langsam, bitte."
        - "Đánh vần họ của bạn."
      model:
        - { speaker: "A", de: "Wie ist deine Handynummer?", vi: "Số di động của bạn là gì?" }
        - { speaker: "B", de: "Null, eins, fünf, zwo – sieben, acht, drei – null, neun.", vi: "0152 – 783 – 09." }
        - { speaker: "A", de: "Langsam, bitte!", vi: "Chậm thôi!" }
        - { speaker: "B", de: "Null – eins – fünf – zwo – sieben – acht – drei – null – neun.", vi: "0 – 1 – 5 – 2 – 7 – 8 – 3 – 0 – 9." }
        - { speaker: "A", de: "Danke! Und deine E-Mail-Adresse?", vi: "Cảm ơn! Còn email của bạn?" }
        - { speaker: "B", de: "tom Punkt berg at gmx Punkt de.", vi: "tom.berg@gmx.de" }
      exercises: [a1-k01-l04-ex10]
  writing:
    - id: a1-k01-l04-write-01
      title_vi: "Điền phiếu đăng ký"
      task_vi: "Điền phiếu đăng ký khóa học với thông tin của chính bạn (giống mẫu ở phần Đọc)."
      model_de: "Nachname: Pham · Vorname: Minh · Land: Vietnam · Wohnort: Hamburg · Telefon: 0152 78309 · E-Mail: minh.pham@gmx.de · Sprachen: Vietnamesisch, Englisch, ein bisschen Deutsch"
      model_vi: "Họ: Phạm · Tên: Minh · Nước: Việt Nam · Nơi ở: Hamburg · Điện thoại · Email · Ngôn ngữ: tiếng Việt, tiếng Anh, một chút tiếng Đức"
      checklist_vi:
        - "Nachname = họ, Vorname = tên (có thể ghi cả tên đệm)."
        - "Tên nước và ngôn ngữ viết hoa."
        - "Viết đúng ký hiệu email."
      exercises: [a1-k01-l04-ex11]
