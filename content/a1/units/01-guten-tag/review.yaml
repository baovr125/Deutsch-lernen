id: a1-k01-review
kind: review
level: A1
unit: a1-k01
order: 6
title_de: "Kurz und klar – Test Kapitel 1"
title_vi: "Tổng kết và kiểm tra Kapitel 1"
topic_vi: "Ôn Redemittel và ngữ pháp Kapitel 1; kiểm tra 4 kỹ năng"
source:
  type: netzwerk-neu
  kapitel: 1
  sections: ["kurz und klar: Redemittel und Grammatik"]
  note_vi: "Tương ứng phần tổng kết cuối Kapitel của giáo trình. Bảng tổng kết, đề kiểm tra và đáp án là nội dung tự biên soạn; không dùng Kapiteltest của nhà xuất bản."
cefr: [A1.SI1, A1.SI2, A1.SI3, A1.H1, A1.H3, A1.L1, A1.L3, A1.S1, A1.S2, A1.SP1]
objectives:
  - { id: o1, vi: "Kiểm tra từ vựng và Redemittel: chào hỏi, giới thiệu, quê quán, số, đánh vần." }
  - { id: o2, vi: "Kiểm tra ngữ pháp: du/Sie, chia động từ số ít, câu hỏi W-, câu kể." }
  - { id: o3, vi: "Kiểm tra nghe hiểu: thông tin cá nhân, số điện thoại, đánh vần." }
  - { id: o4, vi: "Kiểm tra đọc hiểu: tìm thông tin cá nhân trong văn bản ngắn." }
  - { id: o5, vi: "Kiểm tra viết và nói: điền biểu mẫu, giới thiệu bản thân." }
estimated_minutes: 60
prerequisites: [a1-k01-l05]
intro_vi: |
  **Bạn đã hoàn thành 5 bài của Kapitel 1!** Bài này có hai phần:

  **Phần A – Tổng kết (kurz und klar):** đọc lại bảng Redemittel và các chủ điểm ngữ pháp. Nếu phần nào chưa chắc, quay lại bài tương ứng.

  **Phần B – Kiểm tra:** 10 bài tập kiểm tra cả 4 kỹ năng. Hệ thống sẽ ghi nhận kết quả theo **từng mục tiêu**, không chỉ điểm trung bình:
  - Mỗi kỹ năng (từ vựng, ngữ pháp, nghe, đọc, viết, nói) cần đạt **ít nhất 60%**.
  - Nếu một kỹ năng dưới 60%, hệ thống sẽ đề xuất bài cần ôn lại trước khi sang Kapitel 2.

  Hãy làm bài **không xem lại bài học**, sau đó mới xem đáp án và giải thích.
vocabulary:
  file: vocabulary/01-guten-tag.csv
  new: []
  review: [a1-k01-v003, a1-k01-v004, a1-k01-v006, a1-k01-v015, a1-k01-v023, a1-k01-v026, a1-k01-v027, a1-k01-v029, a1-k01-v030, a1-k01-v031, a1-k01-v032, a1-k01-v040, a1-k01-v042, a1-k01-v043, a1-k01-v044, a1-k01-v046, a1-k01-v052, a1-k01-v087, a1-k01-v090, a1-k01-v095, a1-k01-v097, a1-k01-v098, a1-k01-v105, a1-k01-v108]
grammar:
  topics:
    - { topic: g-a1-du-und-sie, focus_vi: "Ôn: chọn du/Sie, cặp câu thân mật – trang trọng." }
    - { topic: g-a1-verben-ich-du-sie, focus_vi: "Ôn: đuôi -e, -st, -en; sein." }
    - { topic: g-a1-verben-singular, focus_vi: "Ôn: er/sie/es -t; sprechen e → i." }
    - { topic: g-a1-w-fragen, focus_vi: "Ôn: từ để hỏi và trật tự câu hỏi W-." }
    - { topic: g-a1-aussagesatz, focus_vi: "Ôn: động từ ở vị trí 2." }
  notes:
    - title_vi: "Bảng tổng kết ngữ pháp Kapitel 1"
      explanation_vi: |
        | | sein | heißen | kommen | wohnen | sprechen |
        |---|---|---|---|---|---|
        | ich | bin | heiße | komme | wohne | spreche |
        | du | bist | heißt | kommst | wohnst | sprichst |
        | er/sie/es | ist | heißt | kommt | wohnt | spricht |
        | Sie | sind | heißen | kommen | wohnen | sprechen |

        **Câu hỏi W-:** W-Wort (1) – động từ (2) – chủ ngữ: *Woher kommst du?*
        **Câu kể:** chủ ngữ (1) – động từ (2) – …: *Ich komme aus Vietnam.*
      examples:
        - { de: "Woher kommen Sie? – Ich komme aus Vietnam.", vi: "Ông/Bà đến từ đâu? – Tôi đến từ Việt Nam." }
        - { de: "Wo wohnt sie? – Sie wohnt in Wien.", vi: "Cô ấy sống ở đâu? – Cô ấy sống ở Viên." }
redemittel:
  - id: a1-k01-review-r01
    de: "Begrüßen und verabschieden: Hallo! / Guten Morgen/Tag/Abend! – Tschüs! / Auf Wiedersehen! / Gute Nacht!"
    vi: "Chào khi gặp và khi chia tay"
    context_vi: "Thân mật: Hallo – Tschüs. Trang trọng: Guten Tag – Auf Wiedersehen."
    register: neutral
    dialogue:
      - { speaker: "A", de: "Guten Tag, Frau Berg!", vi: "Xin chào bà Berg!" }
      - { speaker: "B", de: "Guten Tag, Herr Le! Auf Wiedersehen!", vi: "Xin chào ông Lê! (… sau đó) Tạm biệt!" }
  - id: a1-k01-review-r02
    de: "Sich vorstellen: Ich bin … / Ich heiße … / Mein Name ist … – Das ist …"
    vi: "Giới thiệu bản thân và người khác"
    context_vi: "Mein Name ist … trang trọng hơn một chút."
    register: neutral
    dialogue:
      - { speaker: "A", de: "Mein Name ist Lan Pham. Und das ist Herr Becker.", vi: "Tên tôi là Lan Phạm. Còn đây là ông Becker." }
      - { speaker: "B", de: "Guten Tag! Freut mich!", vi: "Xin chào! Rất vui được gặp chị!" }
  - id: a1-k01-review-r03
    de: "Nach dem Befinden fragen: Wie geht's? / Wie geht es Ihnen? – Gut, danke. Und dir? / Und Ihnen?"
    vi: "Hỏi thăm sức khỏe"
    context_vi: "Chọn câu hỏi và câu đáp theo du/Sie."
    register: neutral
    dialogue:
      - { speaker: "A", de: "Wie geht es Ihnen?", vi: "Ông/Bà khỏe không?" }
      - { speaker: "B", de: "Danke, gut. Und Ihnen?", vi: "Cảm ơn, khỏe. Còn ông/bà?" }
  - id: a1-k01-review-r04
    de: "Herkunft, Wohnort, Sprachen, Kontakt: Woher …? Wo …? Welche Sprachen …? Wie ist Ihre Telefonnummer/E-Mail-Adresse? – Wie bitte? Langsam, bitte. Buchstabieren Sie, bitte."
    vi: "Hỏi quê quán, nơi ở, ngôn ngữ, thông tin liên lạc; xử lý khi chưa hiểu"
    context_vi: "Bộ câu hỏi cơ bản khi làm quen hoặc đăng ký."
    register: neutral
    dialogue:
      - { speaker: "A", de: "Woher kommen Sie und wo wohnen Sie?", vi: "Ông/Bà đến từ đâu và sống ở đâu?" }
      - { speaker: "B", de: "Ich komme aus Vietnam und wohne in Dresden.", vi: "Tôi đến từ Việt Nam và sống ở Dresden." }
pronunciation:
  - id: a1-k01-review-p01
    focus_vi: "Ôn phát âm Kapitel 1"
    explanation_vi: "Tự kiểm tra: ü (tschüs), ß (heißen), ch [ç] (ich, nicht), ch [x] (acht, auch), sp [ʃp] (sprechen), z [ts] (zehn, zwanzig), v [f] (vier), w [v] (wo, wie, woher), phụ âm cuối rõ (Text, nicht, fünf), câu hỏi W- xuống giọng."
    examples:
      - { de: "Ich spreche ein bisschen Deutsch.", vi: "Tôi nói được một chút tiếng Đức.", ipa: "[ɪç ˈʃpʁɛçə aɪ̯n ˈbɪsçən dɔʏ̯tʃ]" }
      - { de: "Woher kommen Sie? ↘", vi: "Ông/Bà đến từ đâu?" }
    practice_vi: "Đọc to hai câu ví dụ và ghi âm; so sánh với audio mẫu."
examples:
  - { de: "Guten Abend! Mein Name ist Minh Tran.", vi: "Chào buổi tối! Tên tôi là Minh Trần." }
  - { de: "Das ist Anna. Sie kommt aus der Schweiz und spricht Deutsch und Französisch.", vi: "Đây là Anna. Cô ấy đến từ Thụy Sĩ và nói tiếng Đức và tiếng Pháp." }
  - { de: "Wie ist Ihre Telefonnummer? – Null, eins, sieben, zwo …", vi: "Số điện thoại của ông/bà là gì? – 0, 1, 7, 2 …" }
  - { de: "Langsam, bitte! Noch einmal, bitte.", vi: "Làm ơn nói chậm thôi! Làm ơn nói lại." }
skills:
  listening:
    - id: a1-k01-review-listen-01
      title_vi: "Ở văn phòng sinh viên quốc tế"
      situation_vi: "Một sinh viên mới đến văn phòng quốc tế (International Office) của trường đại học để đăng ký."
      audio: { status: pending-tts, speed: normal }
      script:
        - { speaker: "Herr Krüger", de: "Guten Morgen! Wie heißen Sie?", vi: "Chào buổi sáng! Anh tên là gì?" }
        - { speaker: "Student", de: "Guten Morgen! Mein Name ist Duc Vo.", vi: "Chào buổi sáng! Tên tôi là Đức Võ." }
        - { speaker: "Herr Krüger", de: "Wie schreibt man das? Buchstabieren Sie, bitte.", vi: "Viết thế nào ạ? Anh đánh vần giúp." }
        - { speaker: "Student", de: "Vorname: D – U – C. Nachname: V – O.", vi: "Tên: D – U – C. Họ: V – O." }
        - { speaker: "Herr Krüger", de: "Danke. Woher kommen Sie?", vi: "Cảm ơn. Anh đến từ đâu?" }
        - { speaker: "Student", de: "Ich komme aus Vietnam, aus Hue.", vi: "Tôi đến từ Việt Nam, từ Huế." }
        - { speaker: "Herr Krüger", de: "Und wo wohnen Sie jetzt?", vi: "Còn bây giờ anh sống ở đâu?" }
        - { speaker: "Student", de: "In Dresden.", vi: "Ở Dresden." }
        - { speaker: "Herr Krüger", de: "Welche Sprachen sprechen Sie?", vi: "Anh nói những ngôn ngữ nào?" }
        - { speaker: "Student", de: "Vietnamesisch, Englisch und ein bisschen Deutsch.", vi: "Tiếng Việt, tiếng Anh và một chút tiếng Đức." }
        - { speaker: "Herr Krüger", de: "Und Ihre Handynummer?", vi: "Còn số di động của anh?" }
        - { speaker: "Student", de: "Null, eins, sechs, null – vier, vier, sieben – eins, neun, acht.", vi: "0160 – 447 – 198." }
        - { speaker: "Herr Krüger", de: "Danke, Herr Vo. Auf Wiedersehen!", vi: "Cảm ơn anh Võ. Tạm biệt!" }
      exercises: [a1-k01-review-ex06, a1-k01-review-ex07]
  reading:
    - id: a1-k01-review-read-01
      title_vi: "Tìm bạn học tandem"
      text_type_vi: "Thông báo trên bảng tin"
      text_de: |
        Tandempartner gesucht!
        Hallo! Ich heiße Julia Berger. Ich komme aus Österreich, aus Graz.
        Ich wohne jetzt in Dresden. Ich spreche Deutsch und Englisch.
        Ich lerne Vietnamesisch – aber nur ein bisschen!
        Sprichst du Vietnamesisch und lernst du Deutsch?
        Meine E-Mail-Adresse: julia.berger@web.de
        Telefon: 0172 581346
      translation_vi: |
        Tìm bạn học tandem (học trao đổi ngôn ngữ)!
        Xin chào! Mình tên là Julia Berger. Mình đến từ Áo, từ Graz.
        Bây giờ mình sống ở Dresden. Mình nói tiếng Đức và tiếng Anh.
        Mình đang học tiếng Việt – nhưng chỉ một chút thôi!
        Bạn nói tiếng Việt và đang học tiếng Đức không?
        Email của mình: julia.berger@web.de
        Điện thoại: 0172 581346
      glossary:
        - { de: "der Tandempartner", vi: "bạn học tandem (hai người dạy ngôn ngữ cho nhau)" }
        - { de: "gesucht", vi: "đang tìm" }
        - { de: "nur", vi: "chỉ" }
      exercises: [a1-k01-review-ex08]
  speaking:
    - id: a1-k01-review-speak-01
      title_vi: "Kiểm tra nói: giới thiệu và trả lời câu hỏi"
      task_vi: "Phần 1: tự giới thiệu (tên, quê, nơi ở, ngôn ngữ, đánh vần họ). Phần 2: trả lời 3 câu hỏi trang trọng: Wie geht es Ihnen? / Wie ist Ihre Telefonnummer? / Welche Sprachen sprechen Sie?"
      steps_vi:
        - "Chuẩn bị 1 phút, không viết thành câu hoàn chỉnh – chỉ ghi từ khóa."
        - "Nói phần 1 (khoảng 1 phút) và ghi âm."
        - "Nghe câu hỏi phần 2 (audio) và trả lời."
      model:
        - { speaker: "Lernende", de: "Guten Tag! Mein Name ist Lan Pham. Pham: P – H – A – M. Ich komme aus Vietnam und wohne in Leipzig. Ich spreche Vietnamesisch, Englisch und ein bisschen Deutsch.", vi: "Xin chào! Tên tôi là Lan Phạm. Phạm: P – H – A – M. Tôi đến từ Việt Nam và sống ở Leipzig. Tôi nói tiếng Việt, tiếng Anh và một chút tiếng Đức." }
        - { speaker: "Prüfer", de: "Wie geht es Ihnen?", vi: "Chị khỏe không?" }
        - { speaker: "Lernende", de: "Danke, gut. Und Ihnen?", vi: "Cảm ơn, tôi khỏe. Còn ông?" }
      exercises: [a1-k01-review-ex10]
  writing:
    - id: a1-k01-review-write-01
      title_vi: "Kiểm tra viết: trả lời thông báo tìm bạn tandem"
      task_vi: "Viết tin nhắn ngắn trả lời Julia (5–6 câu): chào, giới thiệu (tên, quê, nơi ở), ngôn ngữ bạn nói và đang học, số điện thoại hoặc email của bạn, chào tạm biệt."
      model_de: "Hallo Julia! Ich heiße Minh. Ich komme aus Vietnam und wohne in Dresden. Ich spreche Vietnamesisch und Englisch. Ich lerne Deutsch. Meine Nummer ist 0151 2736481. Tschüs, Minh"
      model_vi: "Chào Julia! Mình tên là Minh. Mình đến từ Việt Nam và sống ở Dresden. Mình nói tiếng Việt và tiếng Anh. Mình đang học tiếng Đức. Số của mình là 0151 2736481. Tạm biệt, Minh"
      checklist_vi:
        - "Xưng du (Julia dùng du trong thông báo)."
        - "Đủ các ý: chào – tên – quê – nơi ở – ngôn ngữ – liên lạc – tạm biệt."
        - "Động từ chia đúng, ở vị trí 2."
      exercises: [a1-k01-review-ex09]
exercises:
  - id: a1-k01-review-ex01
    type: multiple-choice
    skill: vocabulary
    objectives: [o1]
    difficulty: 1
    instructions_vi: "Phần B1 – Từ vựng và Redemittel. Chọn câu phù hợp."
    items:
      - { id: q1, prompt: "18:30, bạn gặp giáo viên ở hành lang.", options: ["Guten Abend!", "Gute Nacht!", "Tschüs!"], answer: "Guten Abend!", explanation_vi: "Buổi tối, khi gặp → Guten Abend." }
      - { id: q2, prompt: "Bạn được giới thiệu với một người mới.", options: ["Freut mich!", "Bis bald!", "Wie bitte?"], answer: "Freut mich!", explanation_vi: "Freut mich! = Rất vui được gặp." }
      - { id: q3, prompt: "Người kia đọc số điện thoại quá nhanh.", options: ["Langsam, bitte!", "Danke!", "Auf Wiedersehen!"], answer: "Langsam, bitte!", explanation_vi: "Đề nghị nói chậm." }
      - { id: q4, prompt: "„Wie ist Ihre E-Mail-Adresse?“ hỏi về:", options: ["địa chỉ email", "số điện thoại", "nơi ở"], answer: "địa chỉ email", explanation_vi: "die E-Mail-Adresse = địa chỉ email." }
      - { id: q5, prompt: "Số 17 là:", options: ["siebzehn", "siebenzehn", "siebzig"], answer: "siebzehn", explanation_vi: "siebzehn (mất en). siebzig = 70 (Kapitel 2)." }
  - id: a1-k01-review-ex02
    type: gap-fill
    skill: grammar
    objectives: [o2]
    difficulty: 2
    instructions_vi: "Phần B2 – Ngữ pháp. Chia động từ trong ngoặc."
    items:
      - { id: q1, prompt: "Wie ___ du? (heißen)", answer: ["heißt"], explanation_vi: "du heißt." }
      - { id: q2, prompt: "Ich ___ aus Vietnam. (kommen)", answer: ["komme"], explanation_vi: "ich → -e." }
      - { id: q3, prompt: "Frau Berg ___ in Graz. (wohnen)", answer: ["wohnt"], explanation_vi: "sie → -t." }
      - { id: q4, prompt: "___ Sie Herr Vo? (sein)", answer: ["Sind"], explanation_vi: "Sie sind." }
      - { id: q5, prompt: "Er ___ Englisch und Deutsch. (sprechen)", answer: ["spricht"], explanation_vi: "er spricht (e → i)." }
      - { id: q6, prompt: "Du ___ Lan, richtig? (sein)", answer: ["bist"], explanation_vi: "du bist." }
  - id: a1-k01-review-ex03
    type: multiple-choice
    skill: grammar
    objectives: [o2]
    difficulty: 2
    instructions_vi: "Phần B2 – Câu hỏi W-. Chọn từ để hỏi đúng."
    items:
      - { id: q1, prompt: "___ wohnen Sie? – In Dresden.", options: ["Wo", "Woher", "Wer"], answer: "Wo", explanation_vi: "in → wo." }
      - { id: q2, prompt: "___ kommt Julia? – Aus Österreich.", options: ["Wo", "Woher", "Wie"], answer: "Woher", explanation_vi: "aus → woher." }
      - { id: q3, prompt: "___ heißt du? – Duc.", options: ["Was", "Wie", "Wer"], answer: "Wie", explanation_vi: "Hỏi tên → wie." }
  - id: a1-k01-review-ex04
    type: ordering
    skill: grammar
    objectives: [o2]
    difficulty: 2
    instructions_vi: "Phần B2 – Sắp xếp thành câu đúng."
    items:
      - { id: q1, tokens: ["Sprachen", "Sie", "sprechen", "Welche"], answer: "Welche Sprachen sprechen Sie?", explanation_vi: "Welche Sprachen (1) – sprechen (2) – Sie." }
      - { id: q2, tokens: ["wohnt", "Dresden", "in", "Julia"], answer: "Julia wohnt in Dresden.", explanation_vi: "Julia (1) – wohnt (2) – in Dresden." }
  - id: a1-k01-review-ex05
    type: multiple-choice
    skill: grammar
    objectives: [o2, o1]
    difficulty: 2
    instructions_vi: "Phần B2 – du hay Sie? Chọn câu đúng cho tình huống."
    items:
      - { id: q1, prompt: "Bạn hỏi tên một nhân viên ngân hàng.", options: ["Wie heißt du?", "Wie heißen Sie?"], answer: "Wie heißen Sie?", explanation_vi: "Công việc, người lạ → Sie." }
      - { id: q2, prompt: "Bạn chào tạm biệt bạn cùng phòng.", options: ["Auf Wiedersehen, Frau Berger!", "Tschüs, Julia!"], answer: "Tschüs, Julia!", explanation_vi: "Bạn bè → du, gọi tên riêng." }
  - id: a1-k01-review-ex06
    type: multiple-choice
    skill: listening
    objectives: [o3]
    difficulty: 2
    stimulus: a1-k01-review-listen-01
    instructions_vi: "Phần B3 – Nghe “Ở văn phòng sinh viên quốc tế” (tốc độ bình thường). Chọn đáp án đúng."
    items:
      - { id: q1, prompt: "Họ của sinh viên là gì?", options: ["Duc", "Vo", "Krüger"], answer: "Vo", explanation_vi: "Nachname: V – O." }
      - { id: q2, prompt: "Anh ấy đến từ thành phố nào?", options: ["Hue", "Hanoi", "Dresden"], answer: "Hue", explanation_vi: "Ich komme aus Vietnam, aus Hue." }
      - { id: q3, prompt: "Bây giờ anh ấy sống ở đâu?", options: ["Hue", "Dresden", "Graz"], answer: "Dresden", explanation_vi: "In Dresden." }
  - id: a1-k01-review-ex07
    type: gap-fill
    skill: listening
    objectives: [o3]
    difficulty: 3
    stimulus: a1-k01-review-listen-01
    instructions_vi: "Phần B3 – Nghe lại và ghi số di động của anh Vo."
    items:
      - { id: q1, prompt: "Handynummer: 0160 ___", answer: ["447198"], accept: [["447 198"]], explanation_vi: "vier, vier, sieben – eins, neun, acht." }
  - id: a1-k01-review-ex08
    type: true-false
    skill: reading
    objectives: [o4]
    difficulty: 2
    stimulus: a1-k01-review-read-01
    instructions_vi: "Phần B4 – Đọc thông báo “Tìm bạn học tandem”. Đúng hay sai?"
