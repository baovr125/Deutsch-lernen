id: a1-k01-l05
kind: lesson
level: A1
unit: a1-k01
order: 5
title_de: "Länder und Sprachen"
title_vi: "Các nước và ngôn ngữ – viết đoạn giới thiệu bản thân"
topic_vi: "Tên nước, ngôn ngữ, các nước nói tiếng Đức (D-A-CH); viết về bản thân"
source:
  type: netzwerk-neu
  kapitel: 1
  sections: ["Landeskunde: Länder und Sprachen"]
  note_vi: "Sprachhandlungen: Vorstellungstexte verstehen und eine Tabelle ergänzen; Sprachen zu Ländern ergänzen; fragen und auf Fragen reagieren; Ländernamen mit der eigenen Sprache vergleichen; einen Text über sich schreiben."
cefr: [A1.L1, A1.S2, A1.SP1, A1.H1, A1.SI2]
objectives:
  - { id: o1, vi: "Gọi tên các nước và ngôn ngữ thường gặp, đặc biệt ba nước nói tiếng Đức: Deutschland, Österreich, die Schweiz." }
  - { id: o2, vi: "Dùng đúng aus/in với tên nước có mạo từ như cụm cố định: aus der Schweiz, in den USA." }
  - { id: o3, vi: "Hiểu các đoạn tự giới thiệu ngắn và điền thông tin vào bảng." }
  - { id: o4, vi: "Viết và nói một đoạn 5–6 câu giới thiệu bản thân (tên, quê, nơi ở, ngôn ngữ, đang học gì)." }
estimated_minutes: 75
prerequisites: [a1-k01-l04]
intro_vi: |
  Tiếng Đức là ngôn ngữ chính thức ở **Đức (Deutschland)**, **Áo (Österreich)** và **Thụy Sĩ (die Schweiz)** –
  người Đức gọi ba nước này là **D-A-CH** (theo ký hiệu quốc gia D, A, CH). Ở Thụy Sĩ người ta còn nói tiếng Pháp,
  tiếng Ý và tiếng Romansh.

  Trong bài này bạn học:
  - Tên các nước và ngôn ngữ (nhiều ngôn ngữ tận cùng bằng **-isch**).
  - Một điểm đặc biệt: **vài tên nước có mạo từ** – *die Schweiz, die Türkei, die USA*.
  - Cuối bài, bạn viết **đoạn văn đầu tiên về chính mình** bằng tiếng Đức – tổng hợp mọi thứ đã học ở Kapitel 1.
vocabulary:
  file: vocabulary/01-guten-tag.csv
  new: [a1-k01-v105, a1-k01-v106, a1-k01-v107, a1-k01-v108, a1-k01-v109, a1-k01-v110, a1-k01-v111, a1-k01-v112, a1-k01-v113, a1-k01-v114, a1-k01-v115, a1-k01-v116, a1-k01-v117, a1-k01-v118, a1-k01-v119, a1-k01-v120, a1-k01-v121, a1-k01-v122, a1-k01-v123, a1-k01-v124]
  review: [a1-k01-v040, a1-k01-v041, a1-k01-v044, a1-k01-v045, a1-k01-v046, a1-k01-v047, a1-k01-v048, a1-k01-v049, a1-k01-v050, a1-k01-v051, a1-k01-v052, a1-k01-v053, a1-k01-v099]
grammar:
  topics:
    - { topic: g-a1-aussagesatz, focus_vi: "Ôn: viết đoạn văn với nhiều câu kể, động từ luôn ở vị trí 2; nối câu bằng und." }
  notes:
    - title_vi: "Tên nước có mạo từ"
      explanation_vi: |
        Phần lớn tên nước KHÔNG có mạo từ: aus Vietnam, in Deutschland, aus Österreich.
        Một số ít tên nước CÓ mạo từ và phải học kèm:
        - die Schweiz, die Türkei, die Ukraine → aus **der** Schweiz, in **der** Türkei
        - die USA (số nhiều) → aus **den** USA, in **den** USA
        Sau aus và in, mạo từ đổi dạng (die → der, die số nhiều → den) vì đây là cách Dativ – bạn sẽ học quy tắc ở Kapitel 7 và 9.
        Bây giờ hãy học thuộc như cụm từ cố định.
      examples:
        - { de: "Ich komme aus der Schweiz.", vi: "Tôi đến từ Thụy Sĩ." }
        - { de: "Sie wohnt in den USA.", vi: "Cô ấy sống ở Mỹ." }
        - { de: "Er kommt aus Österreich.", vi: "Anh ấy đến từ Áo.", note_vi: "Không có mạo từ." }
    - title_vi: "Từ tên nước đến tên ngôn ngữ"
      explanation_vi: "Nhiều ngôn ngữ được tạo bằng đuôi -isch: Spanien → Spanisch, Japan → Japanisch, China → Chinesisch, Vietnam → Vietnamesisch. Nhưng có ngoại lệ: Deutschland → Deutsch, Frankreich → Französisch, England → Englisch. Ở Áo và Thụy Sĩ, người ta nói tiếng Đức (Deutsch) – không có tiếng “Österreichisch” hay “Schweizerisch” như một ngôn ngữ riêng."
      examples:
        - { de: "Spanien – Spanisch", vi: "Tây Ban Nha – tiếng Tây Ban Nha" }
        - { de: "Österreich – Deutsch", vi: "Áo – tiếng Đức" }
redemittel:
  - id: a1-k01-l05-r01
    de: "Ich komme aus … und wohne in …"
    vi: "Tôi đến từ … và sống ở …"
    context_vi: "Nói quê quán và nơi ở trong một câu."
    register: neutral
    dialogue:
      - { speaker: "Kursleiterin", de: "Stellen Sie sich bitte vor.", vi: "Mời anh/chị tự giới thiệu." }
      - { speaker: "Minh", de: "Ich heiße Minh. Ich komme aus Vietnam und wohne in Wien.", vi: "Tôi tên là Minh. Tôi đến từ Việt Nam và sống ở Viên." }
  - id: a1-k01-l05-r02
    de: "Ich spreche … und ein bisschen …"
    vi: "Tôi nói tiếng … và một chút tiếng …"
    context_vi: "Nói các ngôn ngữ mình biết và mức độ."
    register: neutral
    dialogue:
      - { speaker: "Anna", de: "Welche Sprachen sprichst du?", vi: "Bạn nói những thứ tiếng nào?" }
      - { speaker: "Hoa", de: "Ich spreche Vietnamesisch, Englisch und ein bisschen Deutsch.", vi: "Mình nói tiếng Việt, tiếng Anh và một chút tiếng Đức." }
  - id: a1-k01-l05-r03
    de: "Ich lerne …"
    vi: "Tôi đang học …"
    context_vi: "Nói ngôn ngữ/môn mình đang học."
    register: neutral
    dialogue:
      - { speaker: "Paul", de: "Was lernst du?", vi: "Bạn đang học gì?" }
      - { speaker: "Lan", de: "Ich lerne Deutsch. Und du?", vi: "Mình học tiếng Đức. Còn bạn?" }
      - { speaker: "Paul", de: "Ich lerne Vietnamesisch!", vi: "Mình học tiếng Việt!" }
  - id: a1-k01-l05-r04
    de: "… ist in …"
    vi: "… ở …"
    context_vi: "Nói một thành phố nằm ở nước nào."
    register: neutral
    dialogue:
      - { speaker: "Tom", de: "Wo ist Zürich?", vi: "Zürich ở đâu?" }
      - { speaker: "Mai", de: "Zürich ist in der Schweiz.", vi: "Zürich ở Thụy Sĩ." }
pronunciation:
  - id: a1-k01-l05-p01
    focus_vi: "Trọng âm của tên nước và ngôn ngữ"
    explanation_vi: "Tên nước thường nhấn âm tiết đầu: DEUTSCH-land, ÖS-ter-reich, FRANK-reich, SPA-ni-en. Ngoại lệ: I-TA-li-en, die Tür-KEI. Ngôn ngữ đuôi -isch: nhấn âm tiết ngay trước -isch nếu có nhiều âm tiết: ja-PA-nisch, chi-NE-sisch, viet-na-ME-sisch; nhưng ENG-lisch, SPA-nisch (chỉ hai âm tiết)."
    examples:
      - { de: "Österreich", vi: "nước Áo", ipa: "[ˈøːstəʁaɪ̯ç]" }
      - { de: "Italien", vi: "nước Ý", ipa: "[iˈtaːli̯ən]" }
      - { de: "Japanisch", vi: "tiếng Nhật", ipa: "[jaˈpaːnɪʃ]" }
      - { de: "die Türkei", vi: "Thổ Nhĩ Kỳ", ipa: "[tʏʁˈkaɪ̯]" }
    practice_vi: "Đọc to các cặp nước – ngôn ngữ trong bài, vỗ tay ở âm tiết nhấn."
examples:
  - { de: "Wien ist in Österreich.", vi: "Viên ở nước Áo." }
  - { de: "Zürich ist in der Schweiz.", vi: "Zürich ở Thụy Sĩ." }
  - { de: "In der Schweiz spricht man Deutsch, Französisch und Italienisch.", vi: "Ở Thụy Sĩ người ta nói tiếng Đức, tiếng Pháp và tiếng Ý.", note_vi: "man = người ta (học ở Kapitel 12); động từ vẫn ở vị trí 2." }
  - { de: "Olivia kommt aus den USA.", vi: "Olivia đến từ Mỹ." }
  - { de: "Ich lerne Deutsch.", vi: "Tôi học tiếng Đức." }
  - { de: "Hanoi ist eine Stadt in Vietnam.", vi: "Hà Nội là một thành phố ở Việt Nam." }
skills:
  listening:
    - id: a1-k01-l05-listen-01
      title_vi: "Ba người, ba nước D-A-CH"
      situation_vi: "Ba người tự giới thiệu ngắn trong một video của trường ngôn ngữ."
      audio: { status: pending-tts, speed: slow }
      script:
        - { speaker: "Lukas", de: "Hallo! Ich bin Lukas. Ich komme aus Österreich und wohne in Wien. Ich spreche Deutsch und Englisch.", vi: "Chào! Mình là Lukas. Mình đến từ Áo và sống ở Viên. Mình nói tiếng Đức và tiếng Anh." }
        - { speaker: "Chiara", de: "Ciao! Ich heiße Chiara. Ich komme aus der Schweiz, aus Lugano. Ich spreche Italienisch, Deutsch und Französisch.", vi: "Chào! Mình tên là Chiara. Mình đến từ Thụy Sĩ, từ Lugano. Mình nói tiếng Ý, tiếng Đức và tiếng Pháp." }
        - { speaker: "Hoa", de: "Hallo! Mein Name ist Hoa. Ich komme aus Vietnam. Ich wohne in Hamburg. Ich spreche Vietnamesisch und Englisch. Ich lerne Deutsch.", vi: "Chào! Mình tên là Hoa. Mình đến từ Việt Nam. Mình sống ở Hamburg. Mình nói tiếng Việt và tiếng Anh. Mình đang học tiếng Đức." }
      exercises: [a1-k01-l05-ex04, a1-k01-l05-ex05]
  reading:
    - id: a1-k01-l05-read-01
      title_vi: "Lớp tiếng Đức của chúng tôi"
      text_type_vi: "Đoạn tự giới thiệu trên trang web của lớp"
      text_de: |
        Unser Deutschkurs A1

        Ich heiße Ana. Ich komme aus Spanien, aus Madrid. Ich wohne jetzt in Köln.
        Ich spreche Spanisch und Englisch. Ich lerne Deutsch.

        Mein Name ist Kenji. Ich komme aus Japan. Ich wohne in Köln.
        Ich spreche Japanisch und ein bisschen Englisch.

        Ich bin Emre. Ich komme aus der Türkei, aber ich wohne schon lange in Deutschland.
        Ich spreche Türkisch und Deutsch. Ich lerne Französisch.
      translation_vi: |
        Lớp tiếng Đức A1 của chúng tôi

        Mình tên là Ana. Mình đến từ Tây Ban Nha, từ Madrid. Bây giờ mình sống ở Köln.
        Mình nói tiếng Tây Ban Nha và tiếng Anh. Mình đang học tiếng Đức.

        Tên mình là Kenji. Mình đến từ Nhật Bản. Mình sống ở Köln.
        Mình nói tiếng Nhật và một chút tiếng Anh.

        Mình là Emre. Mình đến từ Thổ Nhĩ Kỳ, nhưng mình đã sống ở Đức lâu rồi.
        Mình nói tiếng Thổ Nhĩ Kỳ và tiếng Đức. Mình đang học tiếng Pháp.
      glossary:
        - { de: "unser", vi: "của chúng tôi" }
        - { de: "jetzt", vi: "bây giờ" }
        - { de: "aber", vi: "nhưng (học ở Kapitel 7)" }
        - { de: "schon lange", vi: "đã lâu rồi" }
        - { de: "Türkisch", vi: "tiếng Thổ Nhĩ Kỳ" }
      exercises: [a1-k01-l05-ex06]
  speaking:
    - id: a1-k01-l05-speak-01
      title_vi: "Giới thiệu bản thân trước lớp"
      task_vi: "Nói 5–6 câu giới thiệu bản thân: tên, quê, nơi ở, ngôn ngữ, đang học gì. Nói chậm, rõ, không đọc từ giấy ở lần thứ hai."
      steps_vi:
        - "Lần 1: nhìn dàn ý và nói."
        - "Lần 2: không nhìn, nói lại và ghi âm."
        - "Nghe lại: động từ có ở vị trí 2 không? Có bật rõ phụ âm cuối không?"
      model:
        - { speaker: "Lan", de: "Hallo! Ich heiße Lan. Ich komme aus Vietnam, aus Da Nang. Ich wohne jetzt in Leipzig. Ich spreche Vietnamesisch und Englisch. Ich lerne Deutsch.", vi: "Xin chào! Tôi tên là Lan. Tôi đến từ Việt Nam, từ Đà Nẵng. Bây giờ tôi sống ở Leipzig. Tôi nói tiếng Việt và tiếng Anh. Tôi đang học tiếng Đức." }
      exercises: [a1-k01-l05-ex09]
  writing:
    - id: a1-k01-l05-write-01
      title_vi: "Đoạn văn đầu tiên về bản thân"
      task_vi: "Viết một đoạn 5–6 câu về bản thân để đăng lên trang web của lớp (giống các đoạn ở phần Đọc)."
      model_de: "Hallo! Ich heiße Minh. Ich komme aus Vietnam, aus Hanoi. Ich wohne in Hamburg. Ich spreche Vietnamesisch, Englisch und ein bisschen Deutsch. Ich lerne Deutsch."
      model_vi: "Xin chào! Tôi tên là Minh. Tôi đến từ Việt Nam, từ Hà Nội. Tôi sống ở Hamburg. Tôi nói tiếng Việt, tiếng Anh và một chút tiếng Đức. Tôi đang học tiếng Đức."
      checklist_vi:
        - "Có đủ: tên – quê – nơi ở – ngôn ngữ – đang học gì."
        - "Mỗi câu có động từ ở vị trí 2, chia đúng với ich (-e; riêng sein: bin)."
        - "kommen aus …, wohnen in …"
        - "Tên nước, thành phố, ngôn ngữ viết hoa."
      exercises: [a1-k01-l05-ex10]
exercises:
  - id: a1-k01-l05-ex01
    type: matching
    skill: vocabulary
    objectives: [o1]
    difficulty: 1
    instructions_vi: "Nối nước với ngôn ngữ chính."
    items:
      - id: q1
        pairs:
          - { left: "Frankreich", right: "Französisch" }
          - { left: "Spanien", right: "Spanisch" }
          - { left: "Japan", right: "Japanisch" }
          - { left: "Österreich", right: "Deutsch" }
          - { left: "China", right: "Chinesisch" }
          - { left: "Italien", right: "Italienisch" }
        explanation_vi: "Áo nói tiếng Đức. Frankreich → Französisch (ngoại lệ, không phải “Frankreichisch”)."
  - id: a1-k01-l05-ex02
    type: multiple-choice
    skill: grammar
    objectives: [o2]
    difficulty: 2
    instructions_vi: "Chọn dạng đúng."
    items:
      - { id: q1, prompt: "Chiara kommt ___ Schweiz.", options: ["aus", "aus der", "aus die"], answer: "aus der", explanation_vi: "die Schweiz → aus der Schweiz." }
      - { id: q2, prompt: "Olivia wohnt ___ USA.", options: ["in", "in der", "in den"], answer: "in den", explanation_vi: "die USA (số nhiều) → in den USA." }
      - { id: q3, prompt: "Lukas kommt ___ Österreich.", options: ["aus", "aus der", "aus den"], answer: "aus", explanation_vi: "Österreich không có mạo từ." }
      - { id: q4, prompt: "Emre kommt ___ Türkei.", options: ["aus", "aus der", "aus den"], answer: "aus der", explanation_vi: "die Türkei → aus der Türkei." }
  - id: a1-k01-l05-ex03
    type: gap-fill
    skill: vocabulary
    objectives: [o1, o2]
    difficulty: 2
    instructions_vi: "Điền tên nước hoặc ngôn ngữ."
    items:
      - { id: q1, prompt: "Wien ist in ___.", answer: ["Österreich"], explanation_vi: "Viên là thủ đô nước Áo." }
      - { id: q2, prompt: "Zürich ist in der ___.", answer: ["Schweiz"], explanation_vi: "Zürich ở Thụy Sĩ." }
      - { id: q3, prompt: "In Japan spricht man ___.", answer: ["Japanisch"], explanation_vi: "man = người ta; tiếng Nhật = Japanisch." }
      - { id: q4, prompt: "Hoa kommt aus Vietnam. Sie spricht ___.", answer: ["Vietnamesisch"], explanation_vi: "Vietnam → Vietnamesisch." }
  - id: a1-k01-l05-ex04
    type: multiple-choice
    skill: listening
    objectives: [o1, o3]
    difficulty: 2
    stimulus: a1-k01-l05-listen-01
    instructions_vi: "Nghe ba người tự giới thiệu. Chọn đáp án đúng."
    items:
      - { id: q1, prompt: "Lukas sống ở đâu?", options: ["Wien", "Zürich", "Hamburg"], answer: "Wien", explanation_vi: "Ich wohne in Wien." }
      - { id: q2, prompt: "Chiara nói mấy ngôn ngữ?", options: ["zwei", "drei", "vier"], answer: "drei", explanation_vi: "Italienisch, Deutsch und Französisch." }
      - { id: q3, prompt: "Ai đang học tiếng Đức?", options: ["Lukas", "Chiara", "Hoa"], answer: "Hoa", explanation_vi: "Hoa: Ich lerne Deutsch." }
  - id: a1-k01-l05-ex05
    type: true-false
    skill: listening
    objectives: [o2, o3]
    difficulty: 2
    stimulus: a1-k01-l05-listen-01
    instructions_vi: "Nghe lại. Đúng hay sai?"
    items:
      - { id: q1, prompt: "Chiara đến từ Thụy Sĩ.", answer: true, explanation_vi: "Ich komme aus der Schweiz, aus Lugano." }
      - { id: q2, prompt: "Hoa sống ở Việt Nam.", answer: false, explanation_vi: "Hoa đến từ Việt Nam nhưng sống ở Hamburg." }
      - { id: q3, prompt: "Lukas nói tiếng Anh.", answer: true, explanation_vi: "Ich spreche Deutsch und Englisch." }
  - id: a1-k01-l05-ex06
    type: gap-fill
    skill: reading
    objectives: [o3]
    difficulty: 2
    stimulus: a1-k01-l05-read-01
    instructions_vi: "Đọc “Lớp tiếng Đức của chúng tôi”. Điền vào bảng."
    items:
      - { id: q1, prompt: "Ana – Land: ___ – Wohnort: ___", answer: ["Spanien", "Köln"], explanation_vi: "Ich komme aus Spanien … Ich wohne jetzt in Köln." }
      - { id: q2, prompt: "Kenji – Land: ___ – Sprachen: Japanisch und ein bisschen ___", answer: ["Japan", "Englisch"], explanation_vi: "Ich komme aus Japan … Japanisch und ein bisschen Englisch." }
      - { id: q3, prompt: "Emre – Land: die ___ – lernt: ___", answer: ["Türkei", "Französisch"], explanation_vi: "aus der Türkei … Ich lerne Französisch." }
  - id: a1-k01-l05-ex07
    type: ordering
    skill: grammar
    objectives: [o4]
    difficulty: 1
    instructions_vi: "Sắp xếp thành câu đúng."
    items:
      - { id: q1, tokens: ["Deutsch", "lerne", "Ich"], answer: "Ich lerne Deutsch.", explanation_vi: "Ich (1) – lerne (2) – Deutsch." }
      - { id: q2, tokens: ["in", "ist", "Zürich", "der", "Schweiz"], answer: "Zürich ist in der Schweiz.", explanation_vi: "Zürich (1) – ist (2) – in der Schweiz." }
      - { id: q3, tokens: ["aus", "kommt", "Sie", "den", "USA"], answer: "Sie kommt aus den USA.", explanation_vi: "die USA (số nhiều) → aus den USA." }
  - id: a1-k01-l05-ex08
    type: translation
    skill: vocabulary
    objectives: [o2, o4]
    difficulty: 2
    direction: vi-de
    instructions_vi: "Dịch sang tiếng Đức."
    items:
      - { id: q1, prompt: "Tôi đến từ Việt Nam và đang học tiếng Đức.", answer: "Ich komme aus Vietnam und lerne Deutsch.", accept: ["Ich komme aus Vietnam und ich lerne Deutsch."], explanation_vi: "Cùng chủ ngữ → có thể bỏ ich thứ hai." }
      - { id: q2, prompt: "Anh ấy sống ở Thụy Sĩ.", answer: "Er wohnt in der Schweiz.", explanation_vi: "in der Schweiz." }
      - { id: q3, prompt: "Viên ở nước Áo.", answer: "Wien ist in Österreich.", explanation_vi: "Österreich không có mạo từ." }
  - id: a1-k01-l05-ex09
    type: speaking
    skill: speaking
    objectives: [o4]
