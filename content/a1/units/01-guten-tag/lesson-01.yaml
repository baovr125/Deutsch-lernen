id: a1-k01-l01
kind: lesson
level: A1
unit: a1-k01
order: 1
title_de: "Hallo! Tschüs!"
title_vi: "Chào hỏi thân mật và tự giới thiệu"
topic_vi: "Chào, giới thiệu bản thân và người khác, hỏi thăm sức khỏe (thân mật)"
source:
  type: netzwerk-neu
  kapitel: 1
  sections: ["Guten Tag! (Kapitelauftakt)", "Hallo! Tschüs!"]
  note_vi: "Sprachhandlungen theo giáo trình: Begrüßung und Verabschiedung; sich und andere vorstellen; nach dem Befinden fragen und darauf reagieren (Kurzdialoge informell)."
cefr: [A1.SI1, A1.SI2, A1.H1, A1.SP1]
objectives:
  - { id: o1, vi: "Chào khi gặp và khi chia tay trong tình huống thân mật." }
  - { id: o2, vi: "Tự giới thiệu (Ich bin… / Ich heiße…) và hỏi tên người khác (Wie heißt du? / Wer bist du?)." }
  - { id: o3, vi: "Giới thiệu người khác bằng “Das ist…” và đáp lại “Freut mich!”." }
  - { id: o4, vi: "Hỏi thăm sức khỏe và trả lời với nhiều mức độ (sehr gut, gut, ganz gut, es geht, nicht so gut)." }
estimated_minutes: 60
prerequisites: [a1-u00-l04]
intro_vi: |
  **Kapitel 1 bắt đầu!** Trong bài này bạn ở một buổi gặp mặt của lớp tiếng Đức: mọi người là sinh viên trẻ,
  nên tất cả nói chuyện **thân mật** với nhau (xưng *du*).

  **Bạn đã biết nhiều từ tiếng Đức hơn bạn nghĩ.** Một số từ tiếng Đức đã "di cư" sang các ngôn ngữ khác:
  tiếng Anh dùng *Kindergarten* (nhà trẻ), *Rucksack* (ba lô), *Angst* (nỗi sợ). Ngược lại, tiếng Đức cũng dùng nhiều từ
  quốc tế mà bạn đã học ở phần nhập môn: *Hotel, Taxi, Kaffee, Pizza*.

  **Mục tiêu của bài:** sau 60 phút, bạn có thể chào một bạn học mới, nói tên mình, hỏi tên bạn ấy, giới thiệu một người
  bạn khác và hỏi thăm "Khỏe không?".

  **Lưu ý ngữ pháp:** trong bài này, *ich bin, du bist, ich heiße, du heißt* được học như **cụm câu cố định**.
  Quy tắc chia động từ được giải thích kỹ ở bài 2.
