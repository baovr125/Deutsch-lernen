id: a1-p1-l01
kind: lesson
level: A1
unit: a1-p1
order: 1
title_de: "Wiederholen und trainieren: Kapitel 1–3"
title_vi: "Ôn tập tổng hợp Kapitel 1–3"
topic_vi: "Thông tin cá nhân, sở thích, nghề nghiệp, thành phố – ôn từ vựng, Redemittel và ngữ pháp"
source:
  type: netzwerk-neu
  plattform: 1
  sections: ["Plattform 1: wiederholen und trainieren (Kapitel 1–3)"]
  note_vi: "Thay cho trò chơi ôn tập của giáo trình: bài ôn tổng hợp theo dạng câu đố, kèm 4 kỹ năng."
cefr: [A1.SI2, A1.SP1, A1.H1, A1.L1, A1.S2]
objectives:
  - { id: o1, vi: "Ôn và dùng lại từ vựng Kapitel 1–3 (người, nghề, địa điểm, phương tiện, thời gian)." }
  - { id: o2, vi: "Ôn ngữ pháp: chia động từ, câu hỏi W- và có/không, mạo từ der/die/das – ein/eine – kein/keine." }
  - { id: o3, vi: "Kết hợp thông tin từ Kapitel 1–3 để giới thiệu một người hoàn chỉnh (nói và viết)." }
estimated_minutes: 90
prerequisites: [a1-k03-review]
intro_vi: |
  **Chúc mừng!** Bạn đã học xong ba Kapitel đầu. Đây là lúc **ôn tập và kết nối** mọi thứ:
  tên, quê, nơi ở, ngôn ngữ (Kapitel 1) – sở thích, nghề, tuổi (Kapitel 2) – thành phố, phương tiện, mùa (Kapitel 3).

  Bài này có dạng **câu đố (Quiz)** để bạn tự kiểm tra nhanh. Câu nào sai, hãy xem phần giải thích và quay lại bài tương ứng.
  Cuối bài, bạn viết và nói một **lời giới thiệu hoàn chỉnh** dùng kiến thức của cả ba Kapitel.
vocabulary:
  file: vocabulary/03-plattform-1.csv
  new: []
  review: [a1-k01-v040, a1-k01-v044, a1-k01-v046, a1-k02-v001, a1-k02-v062, a1-k02-v120, a1-k02-v121, a1-k03-v001, a1-k03-v030, a1-k03-v051, a1-k03-v052, a1-k03-v068]
grammar:
  topics:
    - { topic: g-a1-verben-praesens, focus_vi: "Ôn chia động từ (kể cả bất quy tắc)." }
    - { topic: g-a1-w-fragen, focus_vi: "Ôn câu hỏi W-." }
    - { topic: g-a1-ja-nein-frage, focus_vi: "Ôn câu hỏi có/không." }
    - { topic: g-a1-negation-kein, focus_vi: "Ôn kein/keine – nicht." }
  notes:
    - title_vi: "Bản đồ kiến thức Kapitel 1–3"
      explanation_vi: |
        | Chủ đề | Câu hỏi | Trả lời mẫu |
        |---|---|---|
        | Tên | Wie heißen Sie? | Ich heiße … |
        | Quê | Woher kommen Sie? | Ich komme aus … |
        | Nơi ở | Wo wohnen Sie? | Ich wohne in … |
        | Ngôn ngữ | Welche Sprachen sprechen Sie? | Ich spreche … |
        | Tuổi | Wie alt sind Sie? | Ich bin … (Jahre alt). |
        | Nghề | Was sind Sie von Beruf? | Ich bin … / Ich arbeite bei … |
        | Sở thích | Was machen Sie gern? | Ich … gern. |
        | Phương tiện | Wie kommen Sie zum Kurs? | Ich fahre Fahrrad. / Ich gehe zu Fuß. |
      examples:
        - { de: "Ich heiße Lan, ich bin 25 und komme aus Vietnam.", vi: "Tôi tên Lan, 25 tuổi, đến từ Việt Nam." }
redemittel:
  - id: a1-p1-l01-r01
    de: "Erzähl mal: Wer bist du?"
    vi: "Kể đi: bạn là ai?"
    context_vi: "Mời người khác tự giới thiệu (thân mật)."
    register: informal
    dialogue:
      - { speaker: "Anna", de: "Erzähl mal: Wer bist du?", vi: "Kể đi: bạn là ai?" }
      - { speaker: "Huy", de: "Ich heiße Huy, ich bin 28 und komme aus Vietnam. Ich bin Koch und wohne in Köln.", vi: "Mình tên Huy, 28 tuổi, đến từ Việt Nam. Mình là đầu bếp và sống ở Köln." }
  - id: a1-p1-l01-r02
    de: "Wie kommst du zum Kurs? – Ich fahre Fahrrad / mit dem Bus."
    vi: "Bạn đến lớp bằng gì? – Mình đi xe đạp / xe buýt."
    context_vi: "Hỏi phương tiện (mit dem Bus: Dativ – Kapitel 7, học như cụm)."
    register: informal
    dialogue:
      - { speaker: "Lisa", de: "Wie kommst du zum Kurs?", vi: "Bạn đến lớp bằng gì?" }
      - { speaker: "Minh", de: "Ich gehe zu Fuß. Und du?", vi: "Mình đi bộ. Còn bạn?" }
pronunciation:
  - id: a1-p1-l01-p01
    focus_vi: "Ôn những âm khó nhất của Kapitel 1–3"
    explanation_vi: "ich [ç] – acht [x]; ü (tschüs, Brücke) – ö (schön, Österreich); z [ts] (zwei, Zug); sp/st [ʃp/ʃt] (sprechen, Stadt); w [v] – v [f] (wo, vier); phụ âm cuối rõ (Text, rechts, Herbst)."
    examples:
      - { de: "Ich spreche Deutsch und fahre zwei Stationen mit dem Zug.", vi: "Tôi nói tiếng Đức và đi tàu hai trạm.", ipa: "[ɪç ˈʃpʁɛçə dɔʏ̯tʃ ʊnt ˈfaːʁə tsvaɪ̯ ʃtaˈtsi̯oːnən mɪt deːm tsuːk]" }
    practice_vi: "Đọc chậm câu ví dụ 3 lần, rồi ghi âm."
examples:
  - { de: "Mein Name ist Lan Pham. Ich komme aus Vietnam und wohne in Leipzig.", vi: "Tên tôi là Lan Phạm. Tôi đến từ Việt Nam và sống ở Leipzig." }
  - { de: "Ich bin Krankenpflegerin und arbeite im Krankenhaus.", vi: "Tôi là điều dưỡng và làm ở bệnh viện." }
  - { de: "Ich koche gern und lese viel.", vi: "Tôi thích nấu ăn và đọc nhiều." }
  - { de: "Ich habe kein Auto. Ich fahre Fahrrad.", vi: "Tôi không có ô tô. Tôi đi xe đạp." }
skills:
  listening:
    - id: a1-p1-l01-listen-01
      title_vi: "Làm quen ở tiệc"
      situation_vi: "Hai người làm quen ở một bữa tiệc của lớp tiếng Đức."
      audio: { status: pending-tts, speed: normal }
      script:
        - { speaker: "Jonas", de: "Hallo! Ich bin Jonas. Und du?", vi: "Chào! Mình là Jonas. Còn bạn?" }
        - { speaker: "Hoa", de: "Ich heiße Hoa. Ich komme aus Vietnam, aus Hue.", vi: "Mình tên Hoa. Mình đến từ Việt Nam, từ Huế." }
        - { speaker: "Jonas", de: "Was machst du in Leipzig?", vi: "Bạn làm gì ở Leipzig?" }
        - { speaker: "Hoa", de: "Ich studiere Informatik. Und du? Was bist du von Beruf?", vi: "Mình học tin học. Còn bạn? Bạn làm nghề gì?" }
        - { speaker: "Jonas", de: "Ich bin Lehrer. Am Wochenende spiele ich gern Basketball. Spielst du auch?", vi: "Mình là giáo viên. Cuối tuần mình thích chơi bóng rổ. Bạn có chơi không?" }
        - { speaker: "Hoa", de: "Nein, ich spiele nicht so gern. Aber ich schwimme sehr gern!", vi: "Không, mình không thích chơi lắm. Nhưng mình rất thích bơi!" }
      exercises: [a1-p1-l01-ex05]
  reading:
    - id: a1-p1-l01-read-01
      title_vi: "Hồ sơ trên trang tìm bạn học tandem"
      text_type_vi: "Hồ sơ cá nhân"
      text_de: |
        Name: Felix Wagner · Alter: 31 · Land: Österreich · Wohnort: Graz
        Beruf: Ingenieur bei einer Firma in Graz
        Sprachen: Deutsch, Englisch, ein bisschen Spanisch
        Hobbys: Ich reise sehr gern und fotografiere gern. Ich koche nicht so gern.
        Ich suche: einen Tandempartner für Vietnamesisch! Ich habe am Mittwoch und am Freitag Zeit.
      translation_vi: |
        Tên: Felix Wagner · Tuổi: 31 · Nước: Áo · Nơi ở: Graz
        Nghề: kỹ sư ở một công ty tại Graz
        Ngôn ngữ: tiếng Đức, tiếng Anh, một chút tiếng Tây Ban Nha
        Sở thích: Tôi rất thích du lịch và thích chụp ảnh. Tôi không thích nấu ăn lắm.
        Tôi tìm: một bạn học tandem cho tiếng Việt! Tôi rảnh vào thứ Tư và thứ Sáu.
      glossary:
        - { de: "das Alter", vi: "tuổi" }
        - { de: "die Zeit", vi: "thời gian" }
      exercises: [a1-p1-l01-ex06]
  speaking:
    - id: a1-p1-l01-speak-01
      title_vi: "Giới thiệu hoàn chỉnh"
      task_vi: "Nói 8 câu giới thiệu bản thân theo bản đồ kiến thức: tên, tuổi, quê, nơi ở, ngôn ngữ, nghề, sở thích, phương tiện."
      steps_vi:
        - "Nhìn bảng ở phần Ngữ pháp, chuẩn bị 8 câu trả lời."
        - "Nói không nhìn giấy, ghi âm."
      model:
        - { speaker: "Lan", de: "Ich heiße Lan Pham. Ich bin 25 Jahre alt. Ich komme aus Vietnam und wohne in Leipzig. Ich spreche Vietnamesisch, Englisch und ein bisschen Deutsch. Ich bin Krankenpflegerin. Ich koche gern und schwimme gern. Ich habe kein Auto – ich fahre Fahrrad.", vi: "Tôi tên Lan Phạm. Tôi 25 tuổi. Tôi đến từ Việt Nam và sống ở Leipzig. Tôi nói tiếng Việt, tiếng Anh và một chút tiếng Đức. Tôi là điều dưỡng. Tôi thích nấu ăn và bơi. Tôi không có ô tô – tôi đi xe đạp." }
      exercises: [a1-p1-l01-ex08]
  writing:
    - id: a1-p1-l01-write-01
      title_vi: "Hồ sơ tandem của bạn"
      task_vi: "Viết hồ sơ giống của Felix (phần Đọc) với thông tin của bạn: tên, tuổi, nước, nơi ở, nghề, ngôn ngữ, sở thích, thời gian rảnh."
      model_de: "Name: Minh Tran · Alter: 26 · Land: Vietnam · Wohnort: Hamburg · Beruf: Informatiker · Sprachen: Vietnamesisch, Englisch, ein bisschen Deutsch · Hobbys: Ich koche sehr gern. Ich spiele gern Fußball. · Ich suche: einen Tandempartner für Deutsch. Ich habe am Samstag Zeit."
      model_vi: "Hồ sơ mẫu."
      checklist_vi:
        - "Đủ 8 mục thông tin."
        - "Câu sở thích dùng gern đúng."
        - "Ngày dùng am."
      exercises: [a1-p1-l01-ex09]
exercises:
  - id: a1-p1-l01-ex01
    type: multiple-choice
    skill: vocabulary
    objectives: [o1]
    difficulty: 1
    instructions_vi: "Quiz – Phần 1: Từ vựng."
    items:
      - { id: q1, prompt: "„Woher kommen Sie?“ hỏi về:", options: ["quê quán", "nơi ở", "nghề"], answer: "quê quán", explanation_vi: "woher = từ đâu (Kapitel 1)." }
      - { id: q2, prompt: "Từ nào KHÔNG phải nghề?", options: ["Lehrerin", "Kellner", "Kirche"], answer: "Kirche", explanation_vi: "die Kirche = nhà thờ (Kapitel 3)." }
      - { id: q3, prompt: "Từ nào KHÔNG phải phương tiện?", options: ["die S-Bahn", "der Turm", "das Fahrrad"], answer: "der Turm", explanation_vi: "der Turm = tòa tháp." }
      - { id: q4, prompt: "„Am Wochenende“ nghĩa là:", options: ["vào cuối tuần", "vào buổi tối", "vào tháng sau"], answer: "vào cuối tuần", explanation_vi: "das Wochenende (Kapitel 2)." }
  - id: a1-p1-l01-ex02
    type: gap-fill
    skill: grammar
    objectives: [o2]
    difficulty: 2
    instructions_vi: "Quiz – Phần 2: Chia động từ."
    items:
      - { id: q1, prompt: "Woher ___ du? (kommen)", answer: ["kommst"], explanation_vi: "du → -st." }
      - { id: q2, prompt: "Er ___ Englisch. (sprechen)", answer: ["spricht"], explanation_vi: "e → i." }
      - { id: q3, prompt: "___ ihr am Samstag frei? (haben)", answer: ["Habt"], explanation_vi: "ihr habt." }
      - { id: q4, prompt: "Da ___ Sie das Rathaus. (sehen)", answer: ["sehen"], explanation_vi: "Sie sehen." }
      - { id: q5, prompt: "Wir ___ Studenten. (sein)", answer: ["sind"], explanation_vi: "wir sind." }
  - id: a1-p1-l01-ex03
    type: gap-fill
    skill: grammar
    objectives: [o2]
    difficulty: 2
    instructions_vi: "Quiz – Phần 3: Mạo từ (der/die/das, ein/eine, kein/keine)."
    items:
      - { id: q1, prompt: "Das ist ___ Bahnhof. ___ Bahnhof ist groß.", answer: ["ein", "Der"], explanation_vi: "ein → Der (lần thứ hai)." }
      - { id: q2, prompt: "Ich habe ___ Fahrkarte.", answer: ["keine"], explanation_vi: "die Fahrkarte → keine." }
      - { id: q3, prompt: "___ Rechnung, bitte!", answer: ["Die"], explanation_vi: "die Rechnung." }
  - id: a1-p1-l01-ex04
    type: matching
    skill: grammar
    objectives: [o2, o3]
    difficulty: 1
    instructions_vi: "Quiz – Phần 4: Nối câu hỏi với câu trả lời."
    items:
      - id: q1
        pairs:
          - { left: "Wie alt sind Sie?", right: "Ich bin 34." }
          - { left: "Was sind Sie von Beruf?", right: "Ich bin Koch." }
          - { left: "Was machen Sie gern?", right: "Ich fotografiere gern." }
          - { left: "Wo wohnen Sie?", right: "In Graz." }
          - { left: "Haben Sie ein Auto?", right: "Nein, ich habe kein Auto." }
        explanation_vi: "Ôn các câu hỏi chính của Kapitel 1–3."
  - id: a1-p1-l01-ex05
    type: true-false
    skill: listening
    objectives: [o1, o3]
    difficulty: 2
    stimulus: a1-p1-l01-listen-01
    instructions_vi: "Nghe hội thoại ở tiệc (tốc độ bình thường). Đúng hay sai?"
    items:
      - { id: q1, prompt: "Hoa học tin học.", answer: true, explanation_vi: "„Ich studiere Informatik.“" }
      - { id: q2, prompt: "Jonas là kỹ sư.", answer: false, explanation_vi: "„Ich bin Lehrer.“" }
      - { id: q3, prompt: "Hoa rất thích chơi bóng rổ.", answer: false, explanation_vi: "„Nein, ich spiele nicht so gern. Aber ich schwimme sehr gern!“" }
  - id: a1-p1-l01-ex06
    type: multiple-choice
    skill: reading
    objectives: [o1, o3]
    difficulty: 1
    stimulus: a1-p1-l01-read-01
    instructions_vi: "Đọc hồ sơ của Felix. Chọn đáp án đúng."
    items:
      - { id: q1, prompt: "Felix làm nghề gì?", options: ["Ingenieur", "Lehrer", "Koch"], answer: "Ingenieur", explanation_vi: "„Beruf: Ingenieur …“" }
      - { id: q2, prompt: "Felix muốn học ngôn ngữ nào?", options: ["Spanisch", "Vietnamesisch", "Englisch"], answer: "Vietnamesisch", explanation_vi: "„… einen Tandempartner für Vietnamesisch!“" }
      - { id: q3, prompt: "Felix rảnh khi nào?", options: ["Montag und Dienstag", "Mittwoch und Freitag", "am Wochenende"], answer: "Mittwoch und Freitag", explanation_vi: "„… am Mittwoch und am Freitag Zeit.“" }
  - id: a1-p1-l01-ex07
    type: ordering
    skill: grammar
    objectives: [o2]
    difficulty: 2
    instructions_vi: "Quiz – Phần 5: Sắp xếp câu."
    items:
      - { id: q1, tokens: ["Sie", "Sprachen", "sprechen", "Welche"], answer: "Welche Sprachen sprechen Sie?", explanation_vi: "W-Frage." }
      - { id: q2, tokens: ["du", "gern", "Spielst", "Tennis"], answer: "Spielst du gern Tennis?", explanation_vi: "Ja/Nein-Frage." }
      - { id: q3, tokens: ["Sie", "links", "Gehen", "dann"], answer: "Gehen Sie dann links.", explanation_vi: "Imperativ mit Sie." }
  - id: a1-p1-l01-ex08
    type: speaking
    skill: speaking
    objectives: [o3]
    difficulty: 2
    grading: self
    instructions_vi: "Ghi âm phần giới thiệu hoàn chỉnh 8 câu (phần Nói)."
    rubric:
      - { criterion_vi: "Đủ 8 thông tin", points: 4 }
      - { criterion_vi: "Động từ chia đúng, vị trí 2", points: 2 }
      - { criterion_vi: "Nói trôi chảy, không nhìn giấy", points: 2 }
    items:
      - { id: q1, prompt: "Giới thiệu hoàn chỉnh", model_answer: "Ich heiße Lan Pham. Ich bin 25 Jahre alt. Ich komme aus Vietnam und wohne in Leipzig. Ich spreche Vietnamesisch, Englisch und ein bisschen Deutsch. Ich bin Krankenpflegerin. Ich koche gern und schwimme gern. Ich habe kein Auto – ich fahre Fahrrad.", explanation_vi: "So sánh với mẫu." }
  - id: a1-p1-l01-ex09
    type: writing
    skill: writing
    objectives: [o3]
    difficulty: 2
    grading: self
    instructions_vi: "Viết hồ sơ tandem của bạn (phần Viết)."
    rubric:
      - { criterion_vi: "Đủ 8 mục", points: 4 }
      - { criterion_vi: "Câu đúng ngữ pháp (gern, am, nghề không mạo từ)", points: 2 }
    items:
      - { id: q1, prompt: "Hồ sơ tandem", model_answer: "Name: Minh Tran · Alter: 26 · Land: Vietnam · Wohnort: Hamburg · Beruf: Informatiker · Sprachen: Vietnamesisch, Englisch, ein bisschen Deutsch · Hobbys: Ich koche sehr gern. Ich spiele gern Fußball. · Ich suche: einen Tandempartner für Deutsch. Ich habe am Samstag Zeit.", explanation_vi: "So sánh với hồ sơ của Felix." }
summary_vi: "Ôn Kapitel 1–3: giới thiệu bản thân đầy đủ (tên, tuổi, quê, nơi ở, ngôn ngữ, nghề, sở thích, phương tiện); chia động từ; câu hỏi W- và có/không; der/die/das – ein/eine – kein/keine; Imperativ mit Sie."
self_check:
  - "Tôi giới thiệu được bản thân bằng 8 câu không cần nhìn giấy."
  - "Tôi trả lời đúng ít nhất 80% câu đố."
  - "Tôi biết phần nào cần ôn lại (xem kết quả từng phần của Quiz)."
