id: a1-p1-l03
kind: lesson
level: A1
unit: a1-p1
order: 3
title_de: "Prüfungstraining: Hören Teil 1 und Sprechen Teil 1"
title_vi: "Luyện thi A1: Nghe phần 1 và Nói phần 1"
topic_vi: "Làm quen dạng đề thi A1; chiến lược nghe hội thoại ngắn; tự giới thiệu theo từ khóa"
source:
  type: netzwerk-neu
  plattform: 1
  sections: ["Prüfungstraining: Hören Teil 1", "Prüfungstraining: Sprechen Teil 1"]
  note_vi: "Đề luyện tự biên soạn theo dạng đề A1 thường gặp (ví dụ Goethe-Zertifikat A1: Start Deutsch 1). Không sao chép đề thi hay đề luyện của giáo trình."
cefr: [A1.H1, A1.H3, A1.H4, A1.SI2, A1.SI3, A1.SP1]
objectives:
  - { id: o1, vi: "Hiểu cấu trúc phần Nghe 1 của đề A1 và áp dụng chiến lược: đọc câu hỏi trước, nghe thông tin chính (số, ngày, địa điểm)." }
  - { id: o2, vi: "Trả lời đúng câu hỏi trắc nghiệm về các hội thoại ngắn hằng ngày." }
  - { id: o3, vi: "Tự giới thiệu theo 7 từ khóa (Name, Alter, Land, Wohnort, Sprachen, Beruf, Hobby), đánh vần tên và đọc số." }
estimated_minutes: 90
prerequisites: [a1-p1-l02]
intro_vi: |
  Các kỳ thi A1 phổ biến (ví dụ **Goethe-Zertifikat A1: Start Deutsch 1**) có 4 phần: **Hören** (nghe), **Lesen** (đọc), **Schreiben** (viết), **Sprechen** (nói).
  Bốn Plattform của chương trình sẽ lần lượt giúp bạn làm quen với từng phần. Hôm nay là hai phần đầu tiên:

  **Hören, Teil 1 (Nghe, phần 1):** bạn nghe các **hội thoại ngắn hằng ngày** (thường được nghe **hai lần**)
  và chọn đáp án đúng trong 3 lựa chọn. Câu hỏi thường hỏi về **số, giờ, ngày, địa điểm, giá tiền**.

  **Sprechen, Teil 1 (Nói, phần 1):** bạn **tự giới thiệu** theo các **từ khóa** trên một tấm thẻ, sau đó
  **đánh vần** tên mình và **đọc một con số** (ví dụ số điện thoại).

  ⚠️ Đây là bài luyện tập theo dạng đề, không phải đề thi thật. Hãy luôn kiểm tra thông tin mới nhất về kỳ thi trên trang chính thức của đơn vị tổ chức.
