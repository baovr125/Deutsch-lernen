grammar:
  topics: []
  notes:
    - title_vi: "Chiến lược cho Hören Teil 1"
      explanation_vi: |
        1. **Trước khi nghe:** đọc câu hỏi và 3 lựa chọn, gạch chân từ để hỏi (Wann? Wo? Wie viel?).
        2. **Nghe lần 1:** chỉ tập trung vào thông tin được hỏi – đừng cố hiểu từng từ.
        3. **Nghe lần 2:** kiểm tra lại. Cẩn thận “bẫy”: hội thoại thường nhắc đến **cả 3 lựa chọn**, nhưng chỉ một cái là đúng (ví dụ: “Montag? – Nein, Montag geht nicht. Dienstag!”).
      examples:
        - { de: "Wann ist der Termin? – Am Montag? – Nein, am Dienstag.", vi: "Hẹn khi nào? – Thứ Hai à? – Không, thứ Ba." }
    - title_vi: "Chiến lược cho Sprechen Teil 1"
      explanation_vi: "Thẻ từ khóa thường có: Name? Alter? Land? Wohnort? Sprachen? Beruf? Hobby? – Mỗi từ khóa nói MỘT câu hoàn chỉnh. Sau đó giám khảo yêu cầu đánh vần tên và đọc một số (số nhà, số điện thoại). Nói chậm, rõ; nếu không hiểu, dùng: Wie bitte? / Noch einmal, bitte."
      examples:
        - { de: "Name? → Ich heiße Minh Tran.", vi: "Tên? → Tôi tên là Minh Trần." }
        - { de: "Hobby? → Ich spiele gern Fußball.", vi: "Sở thích? → Tôi thích chơi bóng đá." }
redemittel:
  - id: a1-p1-l03-r01
    de: "Können Sie das bitte buchstabieren? – Ja: T – R – A – N."
    vi: "Ông/Bà đánh vần giúp được không? – Vâng: T – R – A – N."
    context_vi: "Yêu cầu thường gặp trong phần thi nói (können: Kapitel 5 – học như cụm)."
    register: formal
    dialogue:
      - { speaker: "Prüferin", de: "Können Sie Ihren Namen bitte buchstabieren?", vi: "Anh đánh vần tên mình giúp được không?" }
      - { speaker: "Minh", de: "Ja. Minh: M – I – N – H. Tran: T – R – A – N.", vi: "Vâng. Minh: M – I – N – H. Tran: T – R – A – N." }
  - id: a1-p1-l03-r02
    de: "Entschuldigung, noch einmal, bitte."
    vi: "Xin lỗi, xin nhắc lại ạ."
    context_vi: "Khi không hiểu câu hỏi của giám khảo – hoàn toàn được phép trong bài thi."
    register: formal
    dialogue:
      - { speaker: "Prüfer", de: "Wie ist Ihre Telefonnummer?", vi: "Số điện thoại của chị là gì?" }
      - { speaker: "Lan", de: "Entschuldigung, noch einmal, bitte.", vi: "Xin lỗi, xin nhắc lại ạ." }
pronunciation:
  - id: a1-p1-l03-p01
    focus_vi: "Nói rõ ràng trong bài thi"
    explanation_vi: "Giám khảo chấm việc người nghe có hiểu bạn không. Ưu tiên: (1) phụ âm cuối rõ (heiße, komme, wohne), (2) trọng âm đúng ở các từ quan trọng (Vietnam, Deutschland, Informatiker), (3) đọc số rõ từng chữ số, dùng zwo cho 2."
    examples:
      - { de: "Meine Telefonnummer ist null, eins, sieben, zwo …", vi: "Số điện thoại của tôi là 0, 1, 7, 2 …" }
    practice_vi: "Ghi âm phần tự giới thiệu, nghe lại và đánh dấu chỗ nói chưa rõ."
examples:
  - { de: "Ich heiße Lan Nguyen. Ich bin 25 Jahre alt.", vi: "Tôi tên Lan Nguyễn. Tôi 25 tuổi." }
  - { de: "Ich komme aus Vietnam und wohne in Leipzig.", vi: "Tôi đến từ Việt Nam và sống ở Leipzig." }
  - { de: "Ich spreche Vietnamesisch, Englisch und ein bisschen Deutsch.", vi: "Tôi nói tiếng Việt, tiếng Anh và một chút tiếng Đức." }
  - { de: "Ich bin Studentin. Mein Hobby ist Kochen.", vi: "Tôi là sinh viên. Sở thích của tôi là nấu ăn." }
  - { de: "Die Prüfung hat vier Teile: Hören, Lesen, Schreiben und Sprechen.", vi: "Kỳ thi có bốn phần: nghe, đọc, viết và nói." }
skills:
  listening:
    - id: a1-p1-l03-listen-01
      title_vi: "Đề luyện Hören Teil 1 – Hội thoại 1"
      situation_vi: "Ở quầy lễ tân phòng khám: hẹn ngày."
      audio: { status: pending-tts, speed: normal }
      script:
        - { speaker: "Frau", de: "Praxis Dr. Klein, guten Tag.", vi: "Phòng khám bác sĩ Klein, xin chào." }
        - { speaker: "Mann", de: "Guten Tag, hier ist Tran. Ich habe am Montag einen Termin. Aber Montag geht leider nicht.", vi: "Xin chào, tôi là Trần. Tôi có lịch hẹn thứ Hai. Nhưng tiếc là thứ Hai không được." }
        - { speaker: "Frau", de: "Kein Problem. Mittwoch?", vi: "Không sao. Thứ Tư nhé?" }
        - { speaker: "Mann", de: "Mittwoch arbeite ich. Geht Donnerstag?", vi: "Thứ Tư tôi làm việc. Thứ Năm được không?" }
        - { speaker: "Frau", de: "Ja, Donnerstag geht.", vi: "Vâng, thứ Năm được." }
      exercises: [a1-p1-l03-ex01]
    - id: a1-p1-l03-listen-02
      title_vi: "Đề luyện Hören Teil 1 – Hội thoại 2"
      situation_vi: "Ở nhà ga: hỏi giá vé."
      audio: { status: pending-tts, speed: normal }
      script:
        - { speaker: "Frau", de: "Eine Fahrkarte nach Hamburg, bitte. Was kostet das?", vi: "Cho tôi một vé đi Hamburg. Giá bao nhiêu?" }
        - { speaker: "Mann", de: "Neunundzwanzig Euro.", vi: "Hai mươi chín euro." }
        - { speaker: "Frau", de: "Neunzehn?", vi: "Mười chín ạ?" }
        - { speaker: "Mann", de: "Nein, neunundzwanzig.", vi: "Không, hai mươi chín." }
      exercises: [a1-p1-l03-ex02]
    - id: a1-p1-l03-listen-03
      title_vi: "Đề luyện Hören Teil 1 – Hội thoại 3"
      situation_vi: "Hai đồng nghiệp: đi ăn trưa ở đâu."
      audio: { status: pending-tts, speed: normal }
      script:
        - { speaker: "Kollegin", de: "Gehen wir heute ins Restaurant?", vi: "Hôm nay mình đi nhà hàng nhé?" }
        - { speaker: "Kollege", de: "Das Restaurant ist teuer. Gehen wir lieber ins Café am Markt.", vi: "Nhà hàng đắt. Mình đi quán cà phê ở chợ thì hơn." }
        - { speaker: "Kollegin", de: "Okay, ins Café. Aber nicht ins Café am Bahnhof – das ist so laut!", vi: "Ok, đi cà phê. Nhưng đừng đi quán ở nhà ga – ở đó ồn lắm!" }
      exercises: [a1-p1-l03-ex03]
  reading:
    - id: a1-p1-l03-read-01
      title_vi: "Thẻ từ khóa Sprechen Teil 1"
      text_type_vi: "Thẻ đề thi nói"
      text_de: |
        Sprechen, Teil 1 – Sich vorstellen
        Name? · Alter? · Land? · Wohnort? · Sprachen? · Beruf? · Hobby?
        Buchstabieren Sie Ihren Namen.
        Wie ist Ihre Telefonnummer?
      translation_vi: |
        Nói, phần 1 – Tự giới thiệu
        Tên? · Tuổi? · Nước? · Nơi ở? · Ngôn ngữ? · Nghề? · Sở thích?
        Hãy đánh vần tên của bạn.
        Số điện thoại của bạn là gì?
      glossary:
        - { de: "sich vorstellen", vi: "tự giới thiệu" }
        - { de: "das Alter", vi: "tuổi" }
      exercises: [a1-p1-l03-ex04]
  speaking:
    - id: a1-p1-l03-speak-01
      title_vi: "Luyện Sprechen Teil 1"
      task_vi: "Tự giới thiệu theo 7 từ khóa trên thẻ, đánh vần tên và đọc số điện thoại. Bấm giờ: khoảng 1–1,5 phút."
      steps_vi:
        - "Mỗi từ khóa một câu hoàn chỉnh."
        - "Đánh vần họ và tên."
        - "Đọc số điện thoại từng chữ số (zwo cho 2)."
      model:
        - { speaker: "Lan", de: "Ich heiße Lan Nguyen. Ich bin 25 Jahre alt. Ich komme aus Vietnam. Ich wohne in Leipzig. Ich spreche Vietnamesisch, Englisch und ein bisschen Deutsch. Ich bin Studentin. Mein Hobby ist Kochen.", vi: "Tôi tên Lan Nguyễn. Tôi 25 tuổi. Tôi đến từ Việt Nam. Tôi sống ở Leipzig. Tôi nói tiếng Việt, tiếng Anh và một chút tiếng Đức. Tôi là sinh viên. Sở thích của tôi là nấu ăn." }
        - { speaker: "Lan", de: "Lan: L – A – N. Nguyen: N – G – U – Y – E – N. Meine Telefonnummer ist null, eins, sieben, sechs, zwo, vier, acht, fünf, null, drei.", vi: "Lan: L – A – N. Nguyễn: N – G – U – Y – E – N. Số điện thoại của tôi là 0176 248503." }
      exercises: [a1-p1-l03-ex06]
  writing:
    - id: a1-p1-l03-write-01
      title_vi: "Chuẩn bị thẻ trả lời"
      task_vi: "Viết 7 câu trả lời cho 7 từ khóa của thẻ Sprechen Teil 1 (để luyện nói)."
      model_de: "Ich heiße Minh Tran. Ich bin 26 Jahre alt. Ich komme aus Vietnam. Ich wohne in Hamburg. Ich spreche Vietnamesisch und Englisch. Ich bin Informatiker. Ich spiele gern Fußball."
      model_vi: "7 câu trả lời mẫu."
      checklist_vi:
        - "7 câu hoàn chỉnh, động từ chia đúng."
        - "Tuổi dùng sein; nghề không mạo từ; sở thích với gern."
      exercises: [a1-p1-l03-ex07]
