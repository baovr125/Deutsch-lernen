id: a1-k03-l02
kind: lesson
level: A1
unit: a1-k03
order: 2
title_de: "Die Taxifahrt"
title_vi: "Đi taxi – ein/eine và der/die/das"
topic_vi: "Mạo từ không xác định và xác định; lời chào vùng miền; nguyên âm dài – ngắn"
source:
  type: netzwerk-neu
  kapitel: 3
  sections: ["Die Taxifahrt"]
  note_vi: "Sprachhandlungen: Orte aus einem Hörtext heraushören; einen Dialog lesen und mit dem Stadtplan vergleichen; Artikel ergänzen; Artikelspiel; Wörter mit langen/kurzen Vokalen aussprechen. Grammatik: unbestimmter + bestimmter Artikel. Wortschatz: Richtungen, Orte in der Stadt. Aussprache: lange/kurze Vokale."
cefr: [A1.H4, A1.L1, A1.SP3, A1.SI1]
objectives:
  - { id: o1, vi: "Dùng ein/eine khi nhắc đến lần đầu và der/die/das khi đã biết." }
  - { id: o2, vi: "Hiểu một đoạn hội thoại trên taxi và nhận ra các địa điểm được nhắc đến." }
  - { id: o3, vi: "Phân biệt và đọc đúng nguyên âm dài – ngắn (schon/schön, Plan/Stadt)." }
  - { id: o4, vi: "Nhận biết lời chào vùng miền: Moin (miền Bắc Đức), Grüß Gott (miền Nam Đức, Áo), Grüezi (Thụy Sĩ)." }
estimated_minutes: 75
prerequisites: [a1-k03-l01]
intro_vi: |
  Bạn vừa đến Hamburg và đi **taxi** về khách sạn. Người lái xe vừa chạy vừa giới thiệu: *„Da ist **ein** See. **Der** See heißt Alster.“*

  Đó chính là ngữ pháp của bài: **ein/eine** khi nói đến một thứ **lần đầu**, **der/die/das** khi đã **biết** là thứ nào
  (xem chủ điểm *Mạo từ không xác định ein/eine và mạo từ xác định der/die/das*).

  Bạn cũng sẽ nghe người Hamburg chào **„Moin!“** – và biết thêm hai lời chào vùng miền khác của D-A-CH.
vocabulary:
  file: vocabulary/03-in-hamburg.csv
  new: [a1-k03-v030, a1-k03-v031, a1-k03-v032, a1-k03-v033, a1-k03-v034, a1-k03-v035, a1-k03-v036, a1-k03-v037, a1-k03-v038, a1-k03-v039, a1-k03-v040, a1-k03-v041, a1-k03-v042, a1-k03-v043, a1-k03-v044, a1-k03-v045, a1-k03-v046, a1-k03-v047, a1-k03-v048, a1-k03-v049, a1-k03-v050]
  review: [a1-u00-v005, a1-u00-v016, a1-k03-v006, a1-k03-v011, a1-k03-v026, a1-k03-v017]
grammar:
  topics:
    - { topic: g-a1-unbestimmter-artikel, focus_vi: "ein/eine – der/die/das; mẫu câu “Da ist ein … Der … ist …”." }
  notes:
    - title_vi: "schon hay schön?"
      explanation_vi: "schon [ʃoːn] = đã, rồi; schön [ʃøːn] = đẹp. Chỉ khác Umlaut – tròn môi khi đọc ö."
      examples:
        - { de: "Da ist schon das Hotel.", vi: "Khách sạn kia rồi." }
        - { de: "Das Hotel ist schön.", vi: "Khách sạn đẹp." }
redemittel:
  - id: a1-k03-l02-r01
    de: "Zum Hotel …, bitte."
    vi: "Cho tôi đến khách sạn …"
    context_vi: "Nói với tài xế taxi điểm đến."
    register: formal
    dialogue:
      - { speaker: "Fahrer", de: "Moin! Wohin?", vi: "Chào! Đi đâu ạ?" }
      - { speaker: "Lan", de: "Zum Hotel Elbblick, bitte.", vi: "Cho tôi đến khách sạn Elbblick." }
  - id: a1-k03-l02-r02
    de: "Da ist ein … Der/Die/Das … ist …"
    vi: "Kia có một … Cái … đó …"
    context_vi: "Chỉ và giới thiệu một địa điểm."
    register: neutral
    dialogue:
      - { speaker: "Fahrer", de: "Da rechts ist ein See. Der See heißt Alster.", vi: "Kia bên phải có một cái hồ. Hồ đó tên là Alster." }
      - { speaker: "Lan", de: "Der See ist sehr schön!", vi: "Cái hồ đẹp quá!" }
  - id: a1-k03-l02-r03
    de: "Moin! / Grüß Gott! / Grüezi!"
    vi: "Xin chào! (vùng miền)"
    context_vi: "Moin – Hamburg, miền Bắc Đức; Grüß Gott – Bayern, Áo; Grüezi – Thụy Sĩ. Guten Tag dùng được ở mọi nơi."
    register: neutral
    dialogue:
      - { speaker: "Verkäuferin in Wien", de: "Grüß Gott!", vi: "Xin chào!" }
      - { speaker: "Minh", de: "Grüß Gott! Ein Kaffee, bitte.", vi: "Xin chào! Cho tôi một ly cà phê." }
pronunciation:
  - id: a1-k03-l02-p01
    focus_vi: "Nguyên âm dài và ngắn"
    explanation_vi: |
      Ôn lại quy tắc ở phần nhập môn:
      - **Dài**: nguyên âm đôi chữ (See, Meer), nguyên âm + h (Zahl), ie, nguyên âm + MỘT phụ âm (Plan, Weg, schon).
      - **Ngắn**: nguyên âm + HAI phụ âm trở lên (Stadt, Fluss, Brücke, rechts).
      Nguyên âm dài kéo dài như đếm “một-hai”; nguyên âm ngắn đọc gọn và căng.
    examples:
      - { de: "der Plan – die Stadt", vi: "bản đồ – thành phố", ipa: "[plaːn] – [ʃtat]" }
      - { de: "der Weg – rechts", vi: "con đường – bên phải", ipa: "[veːk] – [ʁɛçts]" }
      - { de: "schon – schön", vi: "đã – đẹp", ipa: "[ʃoːn] – [ʃøːn]" }
    practice_vi: "Đọc các cặp, vỗ tay hai lần cho nguyên âm dài và một lần cho nguyên âm ngắn."
examples:
  - { de: "Da ist ein Hotel. Das Hotel heißt „Elbblick“.", vi: "Kia có một khách sạn. Khách sạn đó tên là “Elbblick”." }
  - { de: "Das ist eine Kirche. Die Kirche ist alt.", vi: "Đó là một nhà thờ. Nhà thờ đó cổ." }
  - { de: "Hamburg ist interessant!", vi: "Hamburg thú vị thật!" }
  - { de: "Da rechts ist schon das Hotel.", vi: "Khách sạn ở bên phải kia rồi." }
  - { de: "Wir arbeiten in Gruppen.", vi: "Chúng ta làm việc theo nhóm." }
skills:
  listening:
    - id: a1-k03-l02-listen-01
      title_vi: "Trên taxi đến khách sạn"
      situation_vi: "Lan đi taxi từ nhà ga đến khách sạn. Tài xế giới thiệu các địa điểm."
      audio: { status: pending-tts, speed: slow }
      script:
        - { speaker: "Fahrer", de: "Moin! Wohin?", vi: "Chào! Đi đâu ạ?" }
        - { speaker: "Lan", de: "Moin! Zum Hotel Elbblick, bitte.", vi: "Chào! Cho tôi đến khách sạn Elbblick." }
        - { speaker: "Fahrer", de: "Okay. Sind Sie neu in Hamburg?", vi: "Ok. Chị mới đến Hamburg à?" }
        - { speaker: "Lan", de: "Ja. Hamburg ist sehr interessant!", vi: "Vâng. Hamburg thú vị quá!" }
        - { speaker: "Fahrer", de: "Da rechts ist ein See. Der See heißt Alster.", vi: "Kia bên phải có một cái hồ. Hồ đó tên là Alster." }
        - { speaker: "Lan", de: "Oh, der See ist schön! Und das? Ist das eine Kirche?", vi: "Ồ, cái hồ đẹp quá! Còn kia? Đó có phải nhà thờ không?" }
        - { speaker: "Fahrer", de: "Nein, das ist das Rathaus. – So, da ist schon das Hotel!", vi: "Không, đó là tòa thị chính. – Nào, khách sạn đây rồi!" }
      exercises: [a1-k03-l02-ex03, a1-k03-l02-ex04]
  reading:
    - id: a1-k03-l02-read-01
      title_vi: "Lời chào ở D-A-CH"
      text_type_vi: "Đoạn thông tin ngắn"
      text_de: |
        In Deutschland, Österreich und der Schweiz sagt man „Guten Tag“. Aber es gibt auch andere Wörter:
        In Hamburg und im Norden sagt man „Moin!“ – auch am Abend.
        In Bayern und in Österreich sagt man „Grüß Gott!“.
        In der Schweiz sagt man „Grüezi!“.
      translation_vi: |
        Ở Đức, Áo và Thụy Sĩ người ta nói “Guten Tag”. Nhưng cũng có những từ khác:
        Ở Hamburg và miền Bắc người ta nói “Moin!” – kể cả buổi tối.
        Ở Bayern và ở Áo người ta nói “Grüß Gott!”.
        Ở Thụy Sĩ người ta nói “Grüezi!”.
      glossary:
        - { de: "man sagt", vi: "người ta nói" }
        - { de: "der Norden", vi: "miền Bắc" }
        - { de: "Bayern", vi: "bang Bayern (Bavaria, miền Nam nước Đức)" }
      exercises: [a1-k03-l02-ex05]
  speaking:
    - id: a1-k03-l02-speak-01
      title_vi: "Đóng vai: hướng dẫn viên trên xe"
      task_vi: "Bạn là tài xế/hướng dẫn viên. Giới thiệu 3 địa điểm theo mẫu: Da ist ein/eine … Der/Die/Das … ist …"
      steps_vi:
        - "Chọn 3 địa điểm (một der, một die, một das)."
        - "Câu 1 với ein/eine, câu 2 với der/die/das + mô tả."
      model:
        - { speaker: "Fahrer", de: "Da links ist eine Brücke. Die Brücke ist sehr lang. Da ist ein Turm. Der Turm ist alt. Und da ist ein Museum. Das Museum ist interessant.", vi: "Kia bên trái có một cây cầu. Cây cầu rất dài. Kia có một tòa tháp. Tòa tháp cổ. Và kia có một bảo tàng. Bảo tàng thú vị." }
      exercises: [a1-k03-l02-ex08]
  writing:
    - id: a1-k03-l02-write-01
      title_vi: "Tin nhắn từ Hamburg"
      task_vi: "Viết tin nhắn ngắn (4 câu) cho bạn: bạn đang ở thành phố mới, có gì (ein/eine), mô tả (der/die/das)."
      model_de: "Hallo Mai! Ich bin in Hamburg. Hier ist ein See. Der See ist sehr schön!"
      model_vi: "Chào Mai! Mình đang ở Hamburg. Ở đây có một cái hồ. Hồ đẹp lắm!"
      checklist_vi:
        - "Lần đầu: ein/eine; lần hai: der/die/das."
        - "Mạo từ hợp với giống của danh từ."
      exercises: [a1-k03-l02-ex09]
exercises:
  - id: a1-k03-l02-ex01
    type: gap-fill
    skill: grammar
    objectives: [o1]
    difficulty: 1
    instructions_vi: "Điền ein/eine, rồi der/die/das."
    items:
      - { id: q1, prompt: "Da ist ___ See. ___ See heißt Alster.", answer: ["ein", "Der"], explanation_vi: "der See: lần đầu ein, lần hai Der." }
      - { id: q2, prompt: "Das ist ___ Brücke. ___ Brücke ist lang.", answer: ["eine", "Die"], explanation_vi: "die Brücke." }
      - { id: q3, prompt: "Da ist ___ Haus. ___ Haus ist alt.", answer: ["ein", "Das"], explanation_vi: "das Haus." }
  - id: a1-k03-l02-ex02
    type: multiple-choice
    skill: grammar
    objectives: [o1]
    difficulty: 1
    instructions_vi: "Chọn mạo từ đúng."
    items:
      - { id: q1, prompt: "Was ist das? – Das ist ___ Plan.", options: ["ein", "eine"], answer: "ein", explanation_vi: "der Plan → ein." }
      - { id: q2, prompt: "Hast du ___ Lösung?", options: ["ein", "eine"], answer: "eine", explanation_vi: "die Lösung → eine." }
      - { id: q3, prompt: "Das sind ___ Häuser.", options: ["ein", "eine", "(không có mạo từ)"], answer: "(không có mạo từ)", explanation_vi: "Số nhiều không có ein/eine." }
  - id: a1-k03-l02-ex03
    type: multiple-choice
    skill: listening
    objectives: [o2]
    difficulty: 1
    stimulus: a1-k03-l02-listen-01
    instructions_vi: "Nghe hội thoại trên taxi. Chọn đáp án đúng."
    items:
      - { id: q1, prompt: "Lan đi đâu?", options: ["zum Bahnhof", "zum Hotel Elbblick", "zum Rathaus"], answer: "zum Hotel Elbblick", explanation_vi: "„Zum Hotel Elbblick, bitte.“" }
      - { id: q2, prompt: "Hồ tên là gì?", options: ["Elbe", "Alster", "Michel"], answer: "Alster", explanation_vi: "„Der See heißt Alster.“" }
      - { id: q3, prompt: "Tòa nhà Lan hỏi là gì?", options: ["eine Kirche", "das Rathaus", "ein Hotel"], answer: "das Rathaus", explanation_vi: "„Nein, das ist das Rathaus.“" }
  - id: a1-k03-l02-ex04
    type: true-false
    skill: listening
    objectives: [o2, o4]
    difficulty: 1
    stimulus: a1-k03-l02-listen-01
    instructions_vi: "Nghe lại. Đúng hay sai?"
    items:
      - { id: q1, prompt: "Tài xế chào bằng „Moin!“.", answer: true, explanation_vi: "Lời chào ở Hamburg." }
      - { id: q2, prompt: "Hồ ở bên trái.", answer: false, explanation_vi: "„Da rechts ist ein See.“" }
      - { id: q3, prompt: "Lan mới đến Hamburg.", answer: true, explanation_vi: "„Sind Sie neu in Hamburg?“ – „Ja.“" }
  - id: a1-k03-l02-ex05
    type: matching
    skill: reading
    objectives: [o4]
    difficulty: 1
    stimulus: a1-k03-l02-read-01
    instructions_vi: "Đọc đoạn thông tin. Nối lời chào với vùng."
    items:
      - id: q1
        pairs:
          - { left: "Moin!", right: "Hamburg, miền Bắc Đức" }
          - { left: "Grüß Gott!", right: "Bayern, Áo" }
          - { left: "Grüezi!", right: "Thụy Sĩ" }
          - { left: "Guten Tag!", right: "khắp D-A-CH" }
        explanation_vi: "Moin – Norden; Grüß Gott – Bayern/Österreich; Grüezi – Schweiz; Guten Tag – überall."
  - id: a1-k03-l02-ex06
    type: multiple-choice
    skill: pronunciation
    objectives: [o3]
    difficulty: 2
    instructions_vi: "Nguyên âm in đậm là dài hay ngắn?"
    items:
      - { id: q1, prompt: "W**e**g", options: ["dài", "ngắn"], answer: "dài", explanation_vi: "e + một phụ âm → dài [veːk]." }
      - { id: q2, prompt: "St**a**dt", options: ["dài", "ngắn"], answer: "ngắn", explanation_vi: "a + dt → ngắn." }
      - { id: q3, prompt: "S**ee**", options: ["dài", "ngắn"], answer: "dài", explanation_vi: "ee → dài." }
      - { id: q4, prompt: "Fl**u**ss", options: ["dài", "ngắn"], answer: "ngắn", explanation_vi: "u + ss → ngắn." }
  - id: a1-k03-l02-ex07
    type: translation
    skill: grammar
    objectives: [o1]
    difficulty: 2
    direction: vi-de
    instructions_vi: "Dịch sang tiếng Đức."
    items:
      - { id: q1, prompt: "Kia có một cái hồ. Cái hồ đó đẹp.", answer: "Da ist ein See. Der See ist schön.", explanation_vi: "ein → Der." }
      - { id: q2, prompt: "Đó là một ngôi nhà.", answer: "Das ist ein Haus.", explanation_vi: "das Haus → ein." }
  - id: a1-k03-l02-ex08
    type: speaking
    skill: speaking
    objectives: [o1, o3]
    difficulty: 2
    grading: self
    instructions_vi: "Ghi âm phần đóng vai hướng dẫn viên (phần Nói)."
    rubric:
      - { criterion_vi: "Dùng đúng ein/eine rồi der/die/das cho 3 địa điểm", points: 3 }
      - { criterion_vi: "Phát âm đúng nguyên âm dài/ngắn", points: 1 }
    items:
      - { id: q1, prompt: "Giới thiệu 3 địa điểm", model_answer: "Da links ist eine Brücke. Die Brücke ist sehr lang. Da ist ein Turm. Der Turm ist alt. Und da ist ein Museum. Das Museum ist interessant.", explanation_vi: "So sánh với mẫu." }
  - id: a1-k03-l02-ex09
    type: writing
    skill: writing
    objectives: [o1]
    difficulty: 1
    grading: self
    instructions_vi: "Viết tin nhắn từ thành phố mới (phần Viết)."
    rubric:
      - { criterion_vi: "Dùng đúng ein/eine – der/die/das", points: 2 }
      - { criterion_vi: "Có lời chào và mô tả", points: 1 }
    items:
      - { id: q1, prompt: "Tin nhắn từ Hamburg", model_answer: "Hallo Mai! Ich bin in Hamburg. Hier ist ein See. Der See ist sehr schön!", explanation_vi: "So sánh với mẫu." }
summary_vi: "ein (der/das), eine (die), số nhiều không có ein. Lần đầu nhắc: ein/eine; đã biết: der/die/das. Nguyên âm dài (See, Weg, Plan) – ngắn (Stadt, Fluss). Lời chào vùng miền: Moin (Bắc Đức), Grüß Gott (Nam Đức, Áo), Grüezi (Thụy Sĩ)."
self_check:
  - "Tôi biết khi nào dùng ein/eine và khi nào dùng der/die/das."
  - "Tôi phân biệt được schon và schön khi nghe và khi nói."
  - "Tôi biết ba lời chào vùng miền ở D-A-CH."
