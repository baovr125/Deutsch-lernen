id: a1-k03-review
kind: review
level: A1
unit: a1-k03
order: 7
title_de: "Kurz und klar – Test Kapitel 3"
title_vi: "Tổng kết và kiểm tra Kapitel 3"
topic_vi: "Ôn Redemittel và ngữ pháp Kapitel 3; kiểm tra 4 kỹ năng"
source:
  type: netzwerk-neu
  kapitel: 3
  sections: ["kurz und klar: Redemittel und Grammatik"]
  note_vi: "Bảng tổng kết, đề kiểm tra và đáp án tự biên soạn."
cefr: [A1.SI5, A1.H2, A1.H4, A1.L1, A1.L3, A1.L4, A1.S2, A1.SP1]
objectives:
  - { id: o1, vi: "Kiểm tra từ vựng: địa điểm trong thành phố, phương tiện, hướng, tháng và mùa." }
  - { id: o2, vi: "Kiểm tra ngữ pháp: ein/eine – der/die/das, kein/keine – nicht, Imperativ mit Sie." }
  - { id: o3, vi: "Kiểm tra nghe hiểu: chỉ đường." }
  - { id: o4, vi: "Kiểm tra đọc hiểu: thông tin du lịch, sự kiện." }
  - { id: o5, vi: "Kiểm tra viết và nói: giới thiệu thành phố, chỉ đường." }
estimated_minutes: 60
prerequisites: [a1-k03-l06]
intro_vi: |
  **Hoàn thành Kapitel 3!** Phần tổng kết giúp bạn ôn nhanh; phần kiểm tra đánh giá 4 kỹ năng (mỗi kỹ năng ≥ 60%).
  Sau Kapitel 3 là **Plattform 1** – ôn tập Kapitel 1–3 và làm quen với dạng đề thi A1.
vocabulary:
  file: vocabulary/03-in-hamburg.csv
  new: []
  review: [a1-k03-v001, a1-k03-v006, a1-k03-v011, a1-k03-v013, a1-k03-v026, a1-k03-v030, a1-k03-v035, a1-k03-v051, a1-k03-v052, a1-k03-v054, a1-k03-v062, a1-k03-v068, a1-k03-v069, a1-k03-v077, a1-k03-v078, a1-k03-v088, a1-k03-v091, a1-k03-v106, a1-k03-v109]
grammar:
  topics:
    - { topic: g-a1-unbestimmter-artikel, focus_vi: "Ôn: ein/eine – der/die/das." }
    - { topic: g-a1-negation-kein, focus_vi: "Ôn: kein/keine – nicht." }
    - { topic: g-a1-imperativ-sie, focus_vi: "Ôn: Verb + Sie." }
  notes:
    - title_vi: "Bảng tổng kết ngữ pháp Kapitel 3"
      explanation_vi: |
        | | der (m) | das (n) | die (f) | số nhiều |
        |---|---|---|---|---|
        | xác định | der Bus | das Schiff | die Brücke | die Busse |
        | không xác định | ein Bus | ein Schiff | eine Brücke | – Busse |
        | phủ định | kein Bus | kein Schiff | keine Brücke | keine Busse |

        **nicht:** phủ định động từ/tính từ: *Der Bus kommt nicht.* · **Imperativ mit Sie:** *Gehen Sie geradeaus!*
      examples:
        - { de: "Da ist ein Park. Der Park ist schön. Aber heute ist kein Konzert.", vi: "Kia có một công viên. Công viên đẹp. Nhưng hôm nay không có buổi hòa nhạc nào." }
redemittel:
  - id: a1-k03-review-r01
    de: "Nach dem Weg fragen und den Weg beschreiben: Entschuldigung, wo ist …? – Gehen Sie zuerst …, dann …"
    vi: "Hỏi và chỉ đường"
    context_vi: "Tổng kết bài 4."
    register: formal
    dialogue:
      - { speaker: "A", de: "Entschuldigung, wo ist die Kirche?", vi: "Xin lỗi, nhà thờ ở đâu ạ?" }
      - { speaker: "B", de: "Gehen Sie zuerst geradeaus und dann links.", vi: "Đi thẳng trước rồi rẽ trái." }
  - id: a1-k03-review-r02
    de: "Über eine Stadt sprechen: Das ist ein/eine … Der/Die/Das … ist hoch/lang/alt."
    vi: "Giới thiệu thành phố"
    context_vi: "Tổng kết bài 1–2."
    register: neutral
    dialogue:
      - { speaker: "A", de: "Was ist das?", vi: "Đó là gì?" }
      - { speaker: "B", de: "Das ist eine Brücke. Die Brücke ist sehr lang.", vi: "Đó là một cây cầu. Cây cầu rất dài." }
  - id: a1-k03-review-r03
    de: "Meinung: Wie findest du …? – Ich finde … toll."
    vi: "Ý kiến"
    context_vi: "Tổng kết bài 5."
    register: informal
    dialogue:
      - { speaker: "A", de: "Wie findest du das Festival?", vi: "Bạn thấy lễ hội thế nào?" }
      - { speaker: "B", de: "Ich finde es toll!", vi: "Mình thấy tuyệt!" }
pronunciation:
  - id: a1-k03-review-p01
    focus_vi: "Ôn: nguyên âm dài – ngắn; links, rechts, geradeaus"
    explanation_vi: "Weg [veːk] (dài) – Stadt [ʃtat] (ngắn); schon [ʃoːn] – schön [ʃøːn]; links [lɪŋks], rechts [ʁɛçts], geradeaus (nhấn AUS)."
    examples:
      - { de: "Gehen Sie geradeaus und dann rechts.", vi: "Hãy đi thẳng rồi rẽ phải." }
    practice_vi: "Đọc to và ghi âm câu ví dụ."
examples:
  - { de: "Hamburg hat einen Hafen und viele Brücken.", vi: "Hamburg có một bến cảng và nhiều cây cầu." }
  - { de: "Heute fährt keine U-Bahn. Also gehe ich zu Fuß.", vi: "Hôm nay không có tàu điện ngầm. Vậy tôi đi bộ." }
  - { de: "Im Winter fahren viele Leute Ski.", vi: "Mùa đông nhiều người đi trượt tuyết." }
skills:
  listening:
    - id: a1-k03-review-listen-01
      title_vi: "Hỏi đường đến bảo tàng"
      situation_vi: "Một du khách hỏi đường (tốc độ bình thường)."
      audio: { status: pending-tts, speed: normal }
      script:
        - { speaker: "Touristin", de: "Entschuldigung, wo ist das Museum?", vi: "Xin lỗi, bảo tàng ở đâu ạ?" }
        - { speaker: "Mann", de: "Das Museum? Gehen Sie zuerst rechts. Dann gehen Sie geradeaus, circa 200 Meter. Da ist eine Brücke. Gehen Sie über die Brücke. Das Museum ist dann links.", vi: "Bảo tàng à? Trước tiên chị rẽ phải. Sau đó đi thẳng khoảng 200 mét. Ở đó có một cây cầu. Chị đi qua cầu. Khi đó bảo tàng ở bên trái." }
        - { speaker: "Touristin", de: "Und gibt es hier einen Bus?", vi: "Ở đây có xe buýt không ạ?" }
        - { speaker: "Mann", de: "Nein, hier fährt kein Bus. Aber zu Fuß ist es nicht weit.", vi: "Không, ở đây không có xe buýt. Nhưng đi bộ thì không xa." }
      exercises: [a1-k03-review-ex05]
  reading:
    - id: a1-k03-review-read-01
      title_vi: "Thông tin cho du khách"
      text_type_vi: "Trang thông tin du lịch"
      text_de: |
        Willkommen in Lübeck!
        Lübeck ist eine Stadt im Norden von Deutschland. Die Altstadt ist sehr alt und schön.
        Das Holstentor ist ein Symbol der Stadt. Die Marienkirche hat zwei Türme – sie sind 125 Meter hoch.
        Vom Bahnhof zur Altstadt: zu Fuß circa 10 Minuten. Fahrräder gibt es am Bahnhof.
        Tipp: Im Dezember gibt es einen Weihnachtsmarkt.
      translation_vi: |
        Chào mừng đến Lübeck!
        Lübeck là một thành phố ở miền Bắc nước Đức. Phố cổ rất cổ và đẹp.
        Cổng Holstentor là biểu tượng của thành phố. Nhà thờ Marienkirche có hai tòa tháp – cao 125 mét.
        Từ nhà ga đến phố cổ: đi bộ khoảng 10 phút. Có xe đạp (cho thuê) ở nhà ga.
        Mẹo: Tháng Mười Hai có chợ Giáng sinh.
      glossary:
        - { de: "die Altstadt", vi: "phố cổ" }
        - { de: "das Tor", vi: "cổng" }
        - { de: "das Symbol", vi: "biểu tượng" }
      exercises: [a1-k03-review-ex06]
  speaking:
    - id: a1-k03-review-speak-01
      title_vi: "Kiểm tra nói"
      task_vi: "Phần 1: Giới thiệu một thành phố (4 câu, có ein/eine và der/die/das). Phần 2: Chỉ đường từ nhà ga đến một địa điểm (Imperativ mit Sie, zuerst/dann)."
      steps_vi:
        - "Phần 1 khoảng 1 phút."
        - "Phần 2: dùng bản đồ tưởng tượng: Bahnhof → rechts → geradeaus → Park → links → Rathaus."
      model:
        - { speaker: "Lernende", de: "Das ist Hanoi. Da ist ein See. Der See ist sehr schön. Die Long-Bien-Brücke ist lang.", vi: "Đây là Hà Nội. Ở đó có một cái hồ. Cái hồ rất đẹp. Cầu Long Biên dài." }
        - { speaker: "Lernende", de: "Gehen Sie zuerst rechts. Dann gehen Sie geradeaus. Da ist ein Park. Gehen Sie links. Da ist das Rathaus.", vi: "Trước tiên rẽ phải. Rồi đi thẳng. Ở đó có một công viên. Rẽ trái. Tòa thị chính ở đó." }
      exercises: [a1-k03-review-ex09]
  writing:
    - id: a1-k03-review-write-01
      title_vi: "Kiểm tra viết"
      task_vi: "Viết email ngắn (5–6 câu) cho bạn sắp đến thăm: thành phố của bạn có gì (ein/eine), chỉ đường từ nhà ga đến nhà bạn (Imperativ mit Sie hoặc câu kể), một hoạt động theo mùa."
      model_de: "Hallo Tom! Leipzig ist toll. Hier ist ein Zoo. Der Zoo ist sehr groß. Vom Bahnhof: Gehen Sie zuerst links, dann geradeaus. Im Sommer schwimmen wir im See!"
      model_vi: "Chào Tom! Leipzig tuyệt lắm. Ở đây có một vườn thú. Vườn thú rất lớn. Từ nhà ga: đi trái trước, rồi đi thẳng. Mùa hè chúng mình bơi ở hồ!"
      checklist_vi:
        - "ein/eine – der/die/das đúng."
        - "Có lời chỉ đường với zuerst/dann."
        - "Có im + mùa."
      exercises: [a1-k03-review-ex08]
exercises:
  - id: a1-k03-review-ex01
    type: multiple-choice
    skill: vocabulary
    objectives: [o1]
    difficulty: 1
    instructions_vi: "Phần B1 – Từ vựng. Chọn đáp án đúng."
    items:
      - { id: q1, prompt: "Ở đâu có nhiều tàu thủy?", options: ["im Hafen", "im Museum", "im Rathaus"], answer: "im Hafen", explanation_vi: "der Hafen = bến cảng." }
      - { id: q2, prompt: "Phương tiện nào chạy dưới mặt đất?", options: ["die U-Bahn", "die Straßenbahn", "das Flugzeug"], answer: "die U-Bahn", explanation_vi: "U = Untergrund." }
      - { id: q3, prompt: "Tháng sau Juli là:", options: ["Juni", "August", "September"], answer: "August", explanation_vi: "Juli (7) → August (8)." }
      - { id: q4, prompt: "„geradeaus“ nghĩa là:", options: ["rẽ trái", "đi thẳng", "rẽ phải"], answer: "đi thẳng", explanation_vi: "geradeaus = thẳng." }
  - id: a1-k03-review-ex02
    type: gap-fill
    skill: grammar
    objectives: [o2]
    difficulty: 2
    instructions_vi: "Phần B2 – Điền ein/eine hoặc der/die/das."
    items:
      - { id: q1, prompt: "Da ist ___ Turm. ___ Turm ist 100 Meter hoch.", answer: ["ein", "Der"], explanation_vi: "ein → Der." }
      - { id: q2, prompt: "Das ist ___ Kirche. ___ Kirche ist alt.", answer: ["eine", "Die"], explanation_vi: "eine → Die." }
  - id: a1-k03-review-ex03
    type: multiple-choice
    skill: grammar
    objectives: [o2]
    difficulty: 2
    instructions_vi: "Phần B2 – kein/keine hay nicht?"
    items:
      - { id: q1, prompt: "Heute fährt ___ Straßenbahn.", options: ["keine", "kein", "nicht"], answer: "keine", explanation_vi: "die Straßenbahn → keine." }
      - { id: q2, prompt: "Der Zug ist ___ schnell.", options: ["keine", "kein", "nicht"], answer: "nicht", explanation_vi: "Tính từ → nicht." }
      - { id: q3, prompt: "Ich habe ___ Ticket.", options: ["keine", "kein", "nicht"], answer: "kein", explanation_vi: "das Ticket → kein." }
  - id: a1-k03-review-ex04
    type: sentence-building
    skill: grammar
    objectives: [o2]
    difficulty: 2
    instructions_vi: "Phần B2 – Viết câu mệnh lệnh với Sie."
    items:
      - { id: q1, prompt: "zuerst links gehen", answer: "Gehen Sie zuerst links.", accept: ["Gehen Sie zuerst links!"], explanation_vi: "Gehen Sie …" }
      - { id: q2, prompt: "bitte hier warten", answer: "Warten Sie bitte hier.", accept: ["Warten Sie bitte hier!", "Bitte warten Sie hier."], explanation_vi: "Warten Sie bitte hier." }
  - id: a1-k03-review-ex05
    type: multiple-choice
    skill: listening
    objectives: [o3]
    difficulty: 2
    stimulus: a1-k03-review-listen-01
    instructions_vi: "Phần B3 – Nghe (tốc độ bình thường). Chọn đáp án đúng."
    items:
      - { id: q1, prompt: "Bước đầu tiên là gì?", options: ["links", "rechts", "geradeaus"], answer: "rechts", explanation_vi: "„Gehen Sie zuerst rechts.“" }
      - { id: q2, prompt: "Bảo tàng ở đâu sau khi qua cầu?", options: ["links", "rechts", "geradeaus"], answer: "links", explanation_vi: "„Das Museum ist dann links.“" }
      - { id: q3, prompt: "Ở đó có xe buýt không?", options: ["Ja", "Nein"], answer: "Nein", explanation_vi: "„Nein, hier fährt kein Bus.“" }
  - id: a1-k03-review-ex06
    type: true-false
    skill: reading
    objectives: [o4]
    difficulty: 2
    stimulus: a1-k03-review-read-01
    instructions_vi: "Phần B4 – Đọc thông tin về Lübeck. Đúng hay sai?"
    items:
      - { id: q1, prompt: "Lübeck ở miền Nam nước Đức.", answer: false, explanation_vi: "„… im Norden von Deutschland.“" }
      - { id: q2, prompt: "Nhà thờ Marienkirche có hai tòa tháp.", answer: true, explanation_vi: "„… hat zwei Türme …“" }
      - { id: q3, prompt: "Từ nhà ga đi bộ đến phố cổ mất khoảng 10 phút.", answer: true, explanation_vi: "„zu Fuß circa 10 Minuten“." }
      - { id: q4, prompt: "Chợ Giáng sinh diễn ra vào mùa hè.", answer: false, explanation_vi: "„Im Dezember …“ – mùa đông." }
  - id: a1-k03-review-ex07
    type: translation
    skill: grammar
    objectives: [o2, o1]
    difficulty: 2
    direction: vi-de
    instructions_vi: "Phần B2 – Dịch sang tiếng Đức."
    items:
      - { id: q1, prompt: "Đó không phải là tàu hỏa.", answer: "Das ist kein Zug.", explanation_vi: "der Zug → kein." }
      - { id: q2, prompt: "Mùa đông tôi thích nấu ăn.", answer: "Im Winter koche ich gern.", accept: ["Ich koche im Winter gern."], explanation_vi: "Im Winter (1) – koche (2) – ich – gern." }
  - id: a1-k03-review-ex08
    type: writing
    skill: writing
    objectives: [o5]
    difficulty: 2
    grading: self
    instructions_vi: "Phần B5 – Viết email cho bạn (phần Viết). Tối đa 8 điểm."
    rubric:
      - { criterion_vi: "Nội dung: thành phố, chỉ đường, hoạt động theo mùa", points: 4 }
      - { criterion_vi: "Ngữ pháp: mạo từ, Imperativ/câu kể, im + mùa", points: 2 }
      - { criterion_vi: "Chính tả và dấu câu", points: 2 }
    items:
      - { id: q1, prompt: "Email cho bạn sắp đến thăm", model_answer: "Hallo Tom! Leipzig ist toll. Hier ist ein Zoo. Der Zoo ist sehr groß. Vom Bahnhof: Gehen Sie zuerst links, dann geradeaus. Im Sommer schwimmen wir im See!", explanation_vi: "Với bạn bè có thể chỉ đường bằng câu kể: Du gehst zuerst links… (Imperativ với du – Kapitel 8)." }
  - id: a1-k03-review-ex09
    type: speaking
    skill: speaking
    objectives: [o5]
    difficulty: 2
    grading: self
    instructions_vi: "Phần B6 – Kiểm tra nói (phần Nói). Tối đa 8 điểm."
    rubric:
      - { criterion_vi: "Phần 1: giới thiệu thành phố với mạo từ đúng", points: 3 }
      - { criterion_vi: "Phần 2: chỉ đường đúng cấu trúc Imperativ mit Sie", points: 3 }
      - { criterion_vi: "Phát âm: links, rechts, geradeaus; nguyên âm dài/ngắn", points: 2 }
    items:
      - { id: q1, prompt: "Giới thiệu thành phố và chỉ đường", model_answer: "Das ist Hanoi. Da ist ein See. Der See ist sehr schön. Die Long-Bien-Brücke ist lang. – Gehen Sie zuerst rechts. Dann gehen Sie geradeaus. Da ist ein Park. Gehen Sie links. Da ist das Rathaus.", explanation_vi: "So sánh với mẫu." }
summary_vi: "Kapitel 3 – bạn có thể: gọi tên và mô tả địa điểm trong thành phố; dùng ein/eine và der/die/das; nói về phương tiện giao thông và phủ định bằng kein/keine hoặc nicht; hỏi đường và chỉ đường với Imperativ mit Sie; hiểu thông báo sự kiện nhờ từ quốc tế và nêu ý kiến; nói tháng và mùa với im."
self_check:
  - "Tôi giới thiệu được một thành phố với các địa điểm chính."
  - "Tôi dùng đúng ein/eine – der/die/das và kein/keine – nicht."
  - "Tôi hỏi đường và chỉ đường được."
  - "Tôi hiểu thông báo sự kiện và thông tin du lịch ngắn."
  - "Tôi nói được tháng, mùa và hoạt động theo mùa."
