id: a1-k03-l04
kind: lesson
level: A1
unit: a1-k03
order: 4
title_de: "Links, rechts, geradeaus"
title_vi: "Hỏi đường và chỉ đường – câu mệnh lệnh với Sie"
topic_vi: "Chỉ đường; Imperativ mit Sie; thứ tự zuerst – dann"
source:
  type: netzwerk-neu
  kapitel: 3
  sections: ["Links, rechts, geradeaus"]
  note_vi: "Sprachhandlungen: Wegbeschreibungen verstehen; Redemittel-Clip; nach dem Weg fragen und den Weg beschreiben. Grammatik: Imperativ mit Sie. Wortschatz: Wegbeschreibung. Aussprache: Richtungen. (Redemittel-Clip của giáo trình không sử dụng.)"
cefr: [A1.SI5, A1.H2, A1.L4, A1.SI3]
objectives:
  - { id: o1, vi: "Hỏi đường lịch sự: Entschuldigung, wo ist …? / Wie komme ich zum …?" }
  - { id: o2, vi: "Chỉ đường bằng câu mệnh lệnh với Sie: Gehen Sie geradeaus/links/rechts." }
  - { id: o3, vi: "Hiểu lời chỉ đường đơn giản (nghe/đọc) và theo dõi trên bản đồ." }
  - { id: o4, vi: "Sắp xếp các bước bằng zuerst – dann và cảm ơn: Vielen Dank!" }
estimated_minutes: 70
prerequisites: [a1-k03-l03]
intro_vi: |
  Ở một thành phố lạ, câu hỏi bạn dùng nhiều nhất có lẽ là: **„Entschuldigung, wo ist …?“** – Xin lỗi, … ở đâu ạ?

  Người Đức sẽ chỉ đường bằng **câu mệnh lệnh lịch sự với Sie**: *Gehen Sie geradeaus. Dann gehen Sie links.*
  Cấu tạo rất đơn giản: **động từ (nguyên mẫu) + Sie** đứng đầu câu (chủ điểm *Câu mệnh lệnh với Sie*).

  Ba từ chỉ hướng cần thuộc lòng: **links** (trái) ⬅️, **rechts** (phải) ➡️, **geradeaus** (thẳng) ⬆️.
vocabulary:
  file: vocabulary/03-in-hamburg.csv
  new: [a1-k03-v068, a1-k03-v069, a1-k03-v070, a1-k03-v071, a1-k03-v072, a1-k03-v073, a1-k03-v074, a1-k03-v075, a1-k03-v076, a1-k03-v077, a1-k03-v078, a1-k03-v079]
  review: [a1-k03-v035, a1-k03-v031, a1-k03-v034, a1-k03-v001, a1-k01-v043, a1-u00-v024]
grammar:
  topics:
    - { topic: g-a1-imperativ-sie, focus_vi: "Verb + Sie (+ bitte); Seien Sie; động từ tách." }
  notes:
    - title_vi: "zum / zur – đến (chỉ học như cụm)"
      explanation_vi: "Khi hỏi đường: Wie komme ich zum Bahnhof? (der/das → zum) / zur Kirche? (die → zur). Đây là zu + Dativ, sẽ học ở Kapitel 7. Bây giờ chỉ cần nhớ: zum + der/das-Wort, zur + die-Wort."
      examples:
        - { de: "Wie komme ich zum Bahnhof?", vi: "Làm sao để tôi đến nhà ga?" }
        - { de: "Wie komme ich zur Kirche?", vi: "Làm sao để tôi đến nhà thờ?" }
redemittel:
  - id: a1-k03-l04-r01
    de: "Entschuldigung, wo ist …? / Wie komme ich zum/zur …?"
    vi: "Xin lỗi, … ở đâu ạ? / Làm sao để tôi đến …?"
    context_vi: "Hỏi đường một người lạ (trang trọng)."
    register: formal
    dialogue:
      - { speaker: "Lan", de: "Entschuldigung, wo ist der Markt?", vi: "Xin lỗi, chợ ở đâu ạ?" }
      - { speaker: "Mann", de: "Gehen Sie geradeaus und dann links.", vi: "Chị đi thẳng rồi rẽ trái." }
  - id: a1-k03-l04-r02
    de: "Gehen Sie zuerst …, dann …"
    vi: "Trước tiên … rồi sau đó …"
    context_vi: "Chỉ đường theo từng bước."
    register: formal
    dialogue:
      - { speaker: "Frau", de: "Gehen Sie zuerst geradeaus. Dann gehen Sie rechts. Da ist der Park.", vi: "Trước tiên anh đi thẳng. Sau đó rẽ phải. Công viên ở đó." }
      - { speaker: "Minh", de: "Geradeaus, dann rechts. Okay!", vi: "Đi thẳng, rồi rẽ phải. Được rồi!" }
  - id: a1-k03-l04-r03
    de: "Vielen Dank! – Bitte, gern!"
    vi: "Cảm ơn nhiều! – Không có gì!"
    context_vi: "Cảm ơn sau khi được chỉ đường và đáp lại."
    register: neutral
    dialogue:
      - { speaker: "Lan", de: "Vielen Dank!", vi: "Cảm ơn nhiều!" }
      - { speaker: "Mann", de: "Bitte, gern!", vi: "Không có gì!" }
  - id: a1-k03-l04-r04
    de: "Ja, genau. / Ist das einfach?"
    vi: "Đúng vậy. / Có dễ không?"
    context_vi: "Xác nhận đã hiểu đúng lời chỉ đường."
    register: neutral
    dialogue:
      - { speaker: "Minh", de: "Also zuerst geradeaus und dann links?", vi: "Vậy là đi thẳng trước rồi rẽ trái ạ?" }
      - { speaker: "Frau", de: "Ja, genau. Ganz einfach!", vi: "Đúng vậy. Rất đơn giản!" }
pronunciation:
  - id: a1-k03-l04-p01
    focus_vi: "Từ chỉ hướng: links, rechts, geradeaus"
    explanation_vi: "links [lɪŋks]: n trước k đọc [ŋ]. rechts [ʁɛçts]: ch [ç] + ts – đọc rõ cả cụm. geradeaus [ɡəʁaːdəˈʔaʊ̯s]: nhấn AUS ở cuối, có ngắt nhẹ trước aus."
    examples:
      - { de: "links", vi: "trái", ipa: "[lɪŋks]" }
      - { de: "rechts", vi: "phải", ipa: "[ʁɛçts]" }
      - { de: "geradeaus", vi: "thẳng", ipa: "[ɡəʁaːdəˈʔaʊ̯s]" }
    practice_vi: "Vừa nói vừa chỉ tay: links ⬅️ – rechts ➡️ – geradeaus ⬆️, nhanh dần."
examples:
  - { de: "Entschuldigung, wo ist der Bahnhof?", vi: "Xin lỗi, nhà ga ở đâu ạ?" }
  - { de: "Gehen Sie geradeaus und dann rechts.", vi: "Hãy đi thẳng rồi rẽ phải." }
  - { de: "Fahren Sie zuerst links, dann geradeaus.", vi: "Hãy rẽ trái trước, rồi đi thẳng." }
  - { de: "Das Ziel ist der Park.", vi: "Điểm đến là công viên." }
  - { de: "Vielen Dank! Das ist ganz einfach.", vi: "Cảm ơn nhiều! Cái đó rất đơn giản." }
skills:
  listening:
    - id: a1-k03-l04-listen-01
      title_vi: "Hỏi đường đến chợ"
      situation_vi: "Minh hỏi một người phụ nữ đường đến chợ."
      audio: { status: pending-tts, speed: slow }
      script:
        - { speaker: "Minh", de: "Entschuldigung, wo ist der Markt?", vi: "Xin lỗi, chợ ở đâu ạ?" }
        - { speaker: "Frau", de: "Der Markt? Gehen Sie zuerst hier geradeaus. Dann gehen Sie links. Da ist ein Park. Gehen Sie durch den Park. Dann sehen Sie den Markt.", vi: "Chợ à? Trước tiên anh đi thẳng đây. Rồi rẽ trái. Ở đó có một công viên. Anh đi xuyên qua công viên. Rồi anh sẽ thấy chợ." }
        - { speaker: "Minh", de: "Also geradeaus, links, durch den Park?", vi: "Vậy là đi thẳng, rẽ trái, đi qua công viên ạ?" }
        - { speaker: "Frau", de: "Ja, genau! Ganz einfach.", vi: "Đúng vậy! Rất đơn giản." }
        - { speaker: "Minh", de: "Vielen Dank!", vi: "Cảm ơn nhiều!" }
        - { speaker: "Frau", de: "Bitte, gern!", vi: "Không có gì!" }
      exercises: [a1-k03-l04-ex03, a1-k03-l04-ex04]
  reading:
    - id: a1-k03-l04-read-01
      title_vi: "Chỉ đường đến khách sạn"
      text_type_vi: "Email xác nhận đặt phòng có chỉ đường"
      text_de: |
        Liebe Frau Pham,
        Ihr Hotel „Elbblick“: So kommen Sie vom Bahnhof zum Hotel:
        Gehen Sie zuerst rechts. Gehen Sie dann circa 300 Meter geradeaus.
        Da ist eine Kirche. Gehen Sie links. Das Hotel ist dann rechts.
        Zu Fuß: circa 10 Minuten.
        Viele Grüße, Ihr Hotel-Team
      translation_vi: |
        Kính gửi chị Phạm,
        Khách sạn “Elbblick” của chị: Đi từ nhà ga đến khách sạn như sau:
        Trước tiên chị rẽ phải. Sau đó đi thẳng khoảng 300 mét.
        Ở đó có một nhà thờ. Chị rẽ trái. Khách sạn sẽ ở bên phải.
        Đi bộ: khoảng 10 phút.
        Trân trọng, đội ngũ khách sạn
      glossary:
        - { de: "Liebe Frau …", vi: "Kính gửi bà/chị … (mở đầu thư)" }
        - { de: "so", vi: "như thế này" }
        - { de: "die Minute, die Minuten", vi: "phút" }
        - { de: "Viele Grüße", vi: "Trân trọng (kết thư)" }
      exercises: [a1-k03-l04-ex05]
  speaking:
    - id: a1-k03-l04-speak-01
      title_vi: "Đóng vai: hỏi và chỉ đường"
      task_vi: "Nhìn bản đồ đơn giản: Bahnhof → (geradeaus) → Kirche → (links) → Park → (rechts) → Museum. Vai A hỏi đường đến bảo tàng, vai B chỉ đường."
      steps_vi:
        - "A: Entschuldigung, wo ist das Museum?"
        - "B: Gehen Sie zuerst …, dann …"
        - "A xác nhận lại và cảm ơn."
      model:
        - { speaker: "A", de: "Entschuldigung, wo ist das Museum?", vi: "Xin lỗi, bảo tàng ở đâu ạ?" }
        - { speaker: "B", de: "Gehen Sie zuerst geradeaus. Da ist eine Kirche. Gehen Sie links. Da ist ein Park. Gehen Sie dann rechts. Da ist das Museum.", vi: "Trước tiên đi thẳng. Ở đó có một nhà thờ. Rẽ trái. Ở đó có một công viên. Sau đó rẽ phải. Bảo tàng ở đó." }
        - { speaker: "A", de: "Geradeaus, links, rechts. Vielen Dank!", vi: "Thẳng, trái, phải. Cảm ơn nhiều!" }
      exercises: [a1-k03-l04-ex08]
  writing:
    - id: a1-k03-l04-write-01
      title_vi: "Chỉ đường đến nhà bạn"
      task_vi: "Viết tin nhắn chỉ đường (4–5 câu) từ trạm xe buýt/nhà ga đến nhà bạn cho một người bạn sắp đến chơi (dùng Imperativ mit Sie nếu là người không quen, hoặc viết như hướng dẫn chung)."
      model_de: "Gehen Sie zuerst geradeaus. Dann gehen Sie rechts. Da ist ein Markt. Gehen Sie links. Mein Haus ist dann rechts, Nummer 12."
      model_vi: "Trước tiên đi thẳng. Sau đó rẽ phải. Ở đó có một cái chợ. Rẽ trái. Nhà tôi khi đó ở bên phải, số 12."
      checklist_vi:
        - "Câu mệnh lệnh: động từ + Sie ở đầu câu."
        - "Có zuerst và dann."
        - "Có ít nhất một địa điểm mốc với ein/eine."
      exercises: [a1-k03-l04-ex09]
exercises:
  - id: a1-k03-l04-ex01
    type: matching
    skill: vocabulary
    objectives: [o2]
    difficulty: 1
    instructions_vi: "Nối hướng với ký hiệu."
    items:
      - id: q1
        pairs:
          - { left: "links", right: "⬅️" }
          - { left: "rechts", right: "➡️" }
          - { left: "geradeaus", right: "⬆️" }
        explanation_vi: "links = trái, rechts = phải, geradeaus = thẳng."
  - id: a1-k03-l04-ex02
    type: sentence-building
    skill: grammar
    objectives: [o2, o4]
    difficulty: 1
    instructions_vi: "Viết câu chỉ đường (Imperativ mit Sie)."
    items:
      - { id: q1, prompt: "geradeaus gehen", answer: "Gehen Sie geradeaus.", accept: ["Gehen Sie geradeaus!"], explanation_vi: "Gehen Sie …" }
      - { id: q2, prompt: "zuerst links gehen", answer: "Gehen Sie zuerst links.", accept: ["Gehen Sie zuerst links!"], explanation_vi: "zuerst sau Sie." }
      - { id: q3, prompt: "dann rechts fahren", answer: "Fahren Sie dann rechts.", accept: ["Fahren Sie dann rechts!", "Dann fahren Sie rechts."], explanation_vi: "dann có thể đứng sau Sie hoặc đầu câu (Dann fahren Sie …)." }
  - id: a1-k03-l04-ex03
    type: ordering
    skill: listening
    objectives: [o3]
    difficulty: 2
    stimulus: a1-k03-l04-listen-01
    instructions_vi: "Nghe lời chỉ đường đến chợ. Sắp xếp các bước theo thứ tự (cách nhau bằng dấu cách)."
    items:
      - { id: q1, tokens: ["Park", "links", "geradeaus", "Markt"], answer: "geradeaus links Park Markt", explanation_vi: "Đi thẳng → rẽ trái → qua công viên → thấy chợ." }
  - id: a1-k03-l04-ex04
    type: true-false
    skill: listening
    objectives: [o3, o4]
    difficulty: 1
    stimulus: a1-k03-l04-listen-01
    instructions_vi: "Nghe lại. Đúng hay sai?"
    items:
      - { id: q1, prompt: "Minh hỏi đường đến công viên.", answer: false, explanation_vi: "Minh hỏi đường đến chợ (der Markt)." }
      - { id: q2, prompt: "Người phụ nữ nói đường đi rất đơn giản.", answer: true, explanation_vi: "„Ganz einfach.“" }
      - { id: q3, prompt: "Minh cảm ơn bằng „Vielen Dank!“.", answer: true, explanation_vi: "Đúng." }
  - id: a1-k03-l04-ex05
    type: multiple-choice
    skill: reading
    objectives: [o3]
    difficulty: 2
    stimulus: a1-k03-l04-read-01
    instructions_vi: "Đọc email của khách sạn. Chọn đáp án đúng."
    items:
      - { id: q1, prompt: "Từ nhà ga, bước đầu tiên là gì?", options: ["links", "rechts", "geradeaus"], answer: "rechts", explanation_vi: "„Gehen Sie zuerst rechts.“" }
      - { id: q2, prompt: "Ở chỗ có nhà thờ, rẽ hướng nào?", options: ["links", "rechts"], answer: "links", explanation_vi: "„Da ist eine Kirche. Gehen Sie links.“" }
      - { id: q3, prompt: "Đi bộ mất bao lâu?", options: ["circa 3 Minuten", "circa 10 Minuten", "circa 30 Minuten"], answer: "circa 10 Minuten", explanation_vi: "„Zu Fuß: circa 10 Minuten.“" }
  - id: a1-k03-l04-ex06
    type: multiple-choice
    skill: grammar
    objectives: [o2]
    difficulty: 2
    instructions_vi: "Câu nào là câu mệnh lệnh đúng?"
    items:
      - { id: q1, prompt: "Chọn câu đúng.", options: ["Sie gehen links!", "Gehen Sie links!", "Geht Sie links!"], answer: "Gehen Sie links!", explanation_vi: "Động từ nguyên mẫu + Sie ở đầu câu." }
      - { id: q2, prompt: "Chọn câu đúng (sein).", options: ["Sind Sie pünktlich!", "Seien Sie pünktlich!", "Sein Sie pünktlich!"], answer: "Seien Sie pünktlich!", explanation_vi: "sein → Seien Sie." }
  - id: a1-k03-l04-ex07
    type: translation
    skill: vocabulary
    objectives: [o1, o4]
    difficulty: 2
    direction: vi-de
    instructions_vi: "Dịch sang tiếng Đức."
    items:
      - { id: q1, prompt: "Xin lỗi, nhà ga ở đâu ạ?", answer: "Entschuldigung, wo ist der Bahnhof?", explanation_vi: "Hỏi đường lịch sự." }
      - { id: q2, prompt: "Hãy đi thẳng rồi rẽ trái.", answer: "Gehen Sie geradeaus und dann links.", accept: ["Gehen Sie geradeaus, dann links."], explanation_vi: "Imperativ + dann." }
      - { id: q3, prompt: "Cảm ơn nhiều!", answer: "Vielen Dank!", explanation_vi: "Vielen Dank!" }
  - id: a1-k03-l04-ex08
    type: speaking
    skill: speaking
    objectives: [o1, o2, o4]
    difficulty: 2
    grading: self
    instructions_vi: "Đóng vai hỏi và chỉ đường đến bảo tàng (phần Nói)."
    rubric:
      - { criterion_vi: "Hỏi đường lịch sự với Entschuldigung", points: 1 }
      - { criterion_vi: "Chỉ đường bằng Imperativ mit Sie, có zuerst/dann", points: 3 }
      - { criterion_vi: "Phát âm rõ links, rechts, geradeaus", points: 1 }
    items:
      - { id: q1, prompt: "Hỏi và chỉ đường đến bảo tàng", model_answer: "Entschuldigung, wo ist das Museum? – Gehen Sie zuerst geradeaus. Da ist eine Kirche. Gehen Sie links. Da ist ein Park. Gehen Sie dann rechts. Da ist das Museum. – Vielen Dank!", explanation_vi: "So sánh với hội thoại mẫu." }
  - id: a1-k03-l04-ex09
    type: writing
    skill: writing
    objectives: [o2, o4]
    difficulty: 2
    grading: self
    instructions_vi: "Viết chỉ đường đến nhà bạn (phần Viết)."
    rubric:
      - { criterion_vi: "Câu mệnh lệnh đúng cấu trúc", points: 2 }
      - { criterion_vi: "Có zuerst/dann và một mốc địa điểm", points: 2 }
    items:
      - { id: q1, prompt: "Chỉ đường đến nhà bạn", model_answer: "Gehen Sie zuerst geradeaus. Dann gehen Sie rechts. Da ist ein Markt. Gehen Sie links. Mein Haus ist dann rechts, Nummer 12.", explanation_vi: "So sánh với mẫu." }
summary_vi: "Hỏi đường: Entschuldigung, wo ist …? / Wie komme ich zum/zur …? Chỉ đường: Gehen Sie geradeaus / links / rechts. Thứ tự: zuerst … dann … Cảm ơn: Vielen Dank! – Bitte, gern! Imperativ mit Sie: động từ nguyên mẫu + Sie đầu câu."
self_check:
  - "Tôi hỏi đường được một cách lịch sự."
  - "Tôi chỉ đường được bằng câu mệnh lệnh với Sie."
  - "Tôi hiểu một lời chỉ đường đơn giản."
  - "Tôi dùng được zuerst và dann."
