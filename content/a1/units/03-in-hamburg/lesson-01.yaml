      - { id: q2, prompt: "___ Schiff", answer: ["das"], explanation_vi: "das Schiff." }
      - { id: q3, prompt: "___ Ausstellung", answer: ["die"], explanation_vi: "-ung → die." }
      - { id: q4, prompt: "___ Meer", answer: ["das"], explanation_vi: "das Meer." }
      - { id: q5, prompt: "___ Rathaus (der Rat + das Haus)", answer: ["das"], explanation_vi: "Theo từ cuối: das Haus." }
  - id: a1-k03-l01-ex03
