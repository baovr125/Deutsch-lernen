    instructions_vi: "Nghe chuyến tham quan. Chọn đáp án đúng."
    items:
      - { id: q1, prompt: "Điểm dừng đầu tiên là gì?", options: ["das Rathaus", "der Hafen", "die Kirche"], answer: "das Rathaus", explanation_vi: "„Die erste Station ist das Rathaus.“" }
      - { id: q2, prompt: "„Der Michel“ là gì?", options: ["ein Turm", "eine Kirche", "ein Schiff"], answer: "eine Kirche", explanation_vi: "„Der Michel ist eine Kirche.“" }
      - { id: q3, prompt: "Elbphilharmonie là gì?", options: ["ein Bahnhof", "ein Konzerthaus", "ein Museum"], answer: "ein Konzerthaus", explanation_vi: "„… ein Konzerthaus und ein Star in Hamburg!“" }
  - id: a1-k03-l01-ex04
    type: true-false
    skill: listening
    objectives: [o2, o3]
    difficulty: 2
    stimulus: a1-k03-l01-listen-01
    instructions_vi: "Nghe lại. Đúng hay sai?"
    items:
      - { id: q1, prompt: "Tòa tháp của Michel cao hơn 130 mét.", answer: true, explanation_vi: "„über 130 Meter hoch“." }
      - { id: q2, prompt: "Ở bến cảng, sông Elbe hẹp.", answer: false, explanation_vi: "„Die Elbe ist hier sehr breit.“ – rộng." }
      - { id: q3, prompt: "Tòa thị chính hơn 100 năm tuổi.", answer: true, explanation_vi: "„… über 100 Jahre alt.“" }
  - id: a1-k03-l01-ex05
    type: multiple-choice
    skill: reading
    objectives: [o3, o2]
    difficulty: 1
    stimulus: a1-k03-l01-read-01
    instructions_vi: "Đọc tờ thông tin. Chọn đáp án đúng."
    items:
      - { id: q1, prompt: "Chuyến tham quan giá bao nhiêu?", options: ["2 Euro", "15 Euro", "110 Euro"], answer: "15 Euro", explanation_vi: "„15 Euro“." }
      - { id: q2, prompt: "Chuyến tham quan bắt đầu ở đâu?", options: ["am Hafen", "am Rathaus", "am Michel"], answer: "am Rathaus", explanation_vi: "„Start: am Rathaus“." }
      - { id: q3, prompt: "Cái gì cao khoảng 110 mét?", options: ["der Michel", "die Elbphilharmonie", "das Rathaus"], answer: "die Elbphilharmonie", explanation_vi: "Station 4." }
  - id: a1-k03-l01-ex06
    type: sentence-building
    skill: grammar
    objectives: [o2]
    difficulty: 2
    instructions_vi: "Viết câu mô tả."
    items:
      - { id: q1, prompt: "die Brücke / sein / 500 Meter / lang", answer: "Die Brücke ist 500 Meter lang.", explanation_vi: "sein + số đo + tính từ." }
      - { id: q2, prompt: "der Fluss / sein / breit", answer: "Der Fluss ist breit.", explanation_vi: "sein + tính từ." }
      - { id: q3, prompt: "du / sehen / das Rathaus ?", answer: "Siehst du das Rathaus?", explanation_vi: "du siehst (e → ie); câu hỏi có/không." }
  - id: a1-k03-l01-ex07
    type: gap-fill
    skill: grammar
    objectives: [o2]
    difficulty: 2
    instructions_vi: "Chia động từ sehen hoặc fahren."
    items:
      - { id: q1, prompt: "Da ___ Sie das Rathaus. (sehen)", answer: ["sehen"], explanation_vi: "Sie sehen." }
      - { id: q2, prompt: "___ du die Schiffe? (sehen)", answer: ["Siehst"], explanation_vi: "du siehst." }
      - { id: q3, prompt: "Der Zug ___ nach Berlin. (fahren)", answer: ["fährt"], explanation_vi: "er fährt." }
  - id: a1-k03-l01-ex08
    type: speaking
    skill: speaking
    objectives: [o4, o2]
    difficulty: 2
    grading: self
    instructions_vi: "Ghi âm phần giới thiệu thành phố của bạn (phần Nói)."
    rubric:
      - { criterion_vi: "Giới thiệu được tên và ít nhất 2 địa điểm (kèm mạo từ)", points: 2 }
      - { criterion_vi: "Có ít nhất 2 câu mô tả với sein + tính từ", points: 2 }
    items:
      - { id: q1, prompt: "Thành phố của bạn", model_answer: "Das ist Hanoi. Hanoi ist eine Stadt in Vietnam. Da ist der Rote Fluss. Er ist breit. Die Long-Bien-Brücke ist sehr lang und alt.", explanation_vi: "So sánh với mẫu ở phần Nói." }
  - id: a1-k03-l01-ex09
    type: writing
    skill: writing
    objectives: [o4, o1]
    difficulty: 1
    grading: self
    instructions_vi: "Viết tờ thông tin tham quan thành phố của bạn (phần Viết)."
    rubric:
      - { criterion_vi: "4 điểm dừng, mạo từ đúng", points: 2 }
      - { criterion_vi: "Có mô tả bằng tính từ", points: 1 }
    items:
      - { id: q1, prompt: "Tờ thông tin tham quan", model_answer: "Hanoi – Stadttour: Station 1: der See Hoan Kiem – in der Mitte der Stadt. Station 2: die Long-Bien-Brücke – sehr lang und alt. Station 3: der Bahnhof. Station 4: das Theater.", explanation_vi: "So sánh với mẫu." }
summary_vi: "Địa điểm: der Bahnhof, der Hafen, der Turm, der Fluss, die Kirche, die Brücke, die Ausstellung, das Rathaus, das Konzerthaus, das Meer, das Schiff. Mô tả: sein + (số đo) + tính từ: Der Turm ist 130 Meter hoch. sehen: du siehst, er sieht. nach + thành phố: Der Zug fährt nach Berlin."
self_check:
  - "Tôi gọi tên được 10 địa điểm trong thành phố kèm mạo từ."
  - "Tôi mô tả được một địa điểm: hoch, lang, breit, alt, schön."
  - "Tôi hiểu thông tin chính của một chuyến tham quan."
  - "Tôi giới thiệu được ngắn gọn thành phố của mình."
