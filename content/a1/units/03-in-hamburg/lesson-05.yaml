id: a1-k03-l05
kind: lesson
level: A1
unit: a1-k03
order: 5
title_de: "Events in Hamburg"
title_vi: "Sự kiện ở Hamburg – đọc hiểu nhờ từ quốc tế"
topic_vi: "Sự kiện văn hóa; chiến lược hiểu văn bản bằng từ quốc tế; bày tỏ ý kiến với finden"
source:
  type: netzwerk-neu
  kapitel: 3
  sections: ["Landeskunde: Events in Hamburg"]
  note_vi: "Sprachhandlungen: Veranstaltungstexte verstehen und Fotos zuordnen; über Wörter in der eigenen Sprache sprechen; über interessante Events sprechen. Strategie: Texte mit internationalen Wörtern verstehen. Wortschatz: Events. Văn bản về sự kiện là tự viết."
cefr: [A1.L1, A1.L3, A1.SP2, A1.H4]
objectives:
  - { id: o1, vi: "Hiểu nội dung chính của thông báo sự kiện ngắn nhờ từ quốc tế (Festival, Film, Ticket, Event…)." }
  - { id: o2, vi: "Tìm thông tin cụ thể trong thông báo: tên, ngày, giá vé, địa điểm." }
  - { id: o3, vi: "Bày tỏ ý kiến đơn giản: Ich finde … interessant / toll / nicht so interessant." }
  - { id: o4, vi: "Nhận biết mạo từ sở hữu sein/seine, ihr/ihre (của anh ấy, của cô ấy) khi đọc." }
estimated_minutes: 70
prerequisites: [a1-k03-l04]
intro_vi: |
  **Chiến lược đọc quan trọng:** khi gặp một văn bản tiếng Đức khó, đừng hoảng! Hãy tìm **từ quốc tế** trước –
  những từ giống tiếng Anh hoặc tiếng Việt: *das Festival, der Film, das Ticket, das Event, das Konzert, der Star…*
  Chỉ với những từ này, bạn đã đoán được văn bản nói về chuyện gì.

  Bài này dùng các **thông báo sự kiện** (phim, nhạc, kịch) để luyện chiến lược đó.
  Bạn cũng học cách nói **ý kiến**: *Ich **finde** das Festival interessant.* (Tôi thấy lễ hội thú vị.)
vocabulary:
  file: vocabulary/03-in-hamburg.csv
  new: [a1-k03-v080, a1-k03-v081, a1-k03-v082, a1-k03-v083, a1-k03-v084, a1-k03-v085, a1-k03-v086, a1-k03-v087, a1-k03-v088, a1-k03-v089, a1-k03-v090, a1-k03-v091, a1-k03-v092]
  review: [a1-k03-v007, a1-k03-v004, a1-k03-v025, a1-k03-v032, a1-k02-v028, a1-k02-v057]
grammar:
  topics: []
  notes:
    - title_vi: "Ý kiến với finden"
      explanation_vi: "finden + vật/người + tính từ = thấy (đánh giá): Ich finde den Film toll. (den = der ở Akkusativ – Kapitel 4). Hỏi ý kiến: Wie findest du …? Đơn giản hơn ở A1: Ich finde das interessant. / Das finde ich toll."
      examples:
        - { de: "Wie findest du das Festival? – Ich finde es super!", vi: "Bạn thấy lễ hội thế nào? – Mình thấy tuyệt lắm!" }
        - { de: "Ich finde Theater nicht so interessant.", vi: "Tôi thấy kịch không thú vị lắm." }
    - title_vi: "sein/seine – ihr/ihre: của anh ấy – của cô ấy"
      explanation_vi: "Mạo từ sở hữu ngôi thứ ba: sein (của anh ấy), ihr (của cô ấy/của họ); thêm -e trước danh từ giống cái/số nhiều: seine Filme, ihre Musik. Bây giờ chỉ cần NHẬN RA khi đọc; quy tắc đầy đủ học ở Kapitel 5."
      examples:
        - { de: "Der Regisseur zeigt seinen neuen Film.", vi: "Đạo diễn giới thiệu bộ phim mới của ông ấy." }
        - { de: "Die Sängerin singt ihre Lieder.", vi: "Nữ ca sĩ hát những bài hát của cô ấy." }
redemittel:
  - id: a1-k03-l05-r01
    de: "Wie findest du …? – Ich finde … toll / interessant / nicht so interessant."
    vi: "Bạn thấy … thế nào? – Tôi thấy … tuyệt / thú vị / không thú vị lắm."
    context_vi: "Hỏi và nêu ý kiến."
    register: informal
    dialogue:
      - { speaker: "Lisa", de: "Wie findest du das Filmfestival?", vi: "Bạn thấy liên hoan phim thế nào?" }
      - { speaker: "Minh", de: "Ich finde es super! Die Filme sind toll.", vi: "Mình thấy tuyệt! Các bộ phim hay lắm." }
  - id: a1-k03-l05-r02
    de: "Was kostet das Ticket? – … Euro."
    vi: "Vé giá bao nhiêu? – … euro."
    context_vi: "Hỏi giá vé."
    register: neutral
    dialogue:
      - { speaker: "Mai", de: "Was kostet das Ticket?", vi: "Vé giá bao nhiêu ạ?" }
      - { speaker: "Kasse", de: "Zwölf Euro, bitte.", vi: "Mười hai euro ạ." }
  - id: a1-k03-l05-r03
    de: "Gehen wir zum Festival?"
    vi: "Mình đi lễ hội nhé?"
    context_vi: "Rủ đi sự kiện (ôn Kapitel 2; zum = zu dem, học như cụm)."
    register: informal
    dialogue:
      - { speaker: "Tom", de: "Am Samstag ist ein Konzert. Gehen wir zum Konzert?", vi: "Thứ Bảy có buổi hòa nhạc. Mình đi nghe nhé?" }
      - { speaker: "Anna", de: "Ja, gern!", vi: "Ừ, thích lắm!" }
pronunciation:
  - id: a1-k03-l05-p01
    focus_vi: "Từ quốc tế – đọc kiểu Đức"
    explanation_vi: "Nhiều từ quốc tế giữ cách đọc tiếng Anh (Event, Ticket, Festival gần với tiếng Anh) nhưng thường nhấn âm tiết khác hoặc đọc r, a theo kiểu Đức: Festival [ˈfɛstival], Film [fɪlm] (không đọc “phim” có thanh), Konzert [kɔnˈtsɛʁt]."
    examples:
      - { de: "das Festival", vi: "lễ hội", ipa: "[ˈfɛstival]" }
      - { de: "das Ticket", vi: "vé", ipa: "[ˈtɪkət]" }
    practice_vi: "Đọc to thông báo sự kiện ở phần Đọc, chú ý không thêm thanh điệu tiếng Việt."
examples:
  - { de: "Das Festival ist im Sommer.", vi: "Lễ hội diễn ra vào mùa hè." }
  - { de: "Das Ticket kostet 15 Euro.", vi: "Vé giá 15 euro." }
  - { de: "Viele Gäste kommen aus der ganzen Welt.", vi: "Nhiều khách đến từ khắp thế giới." }
  - { de: "Ich finde den Film sehr interessant.", vi: "Tôi thấy bộ phim rất thú vị." }
  - { de: "Die Schauspielerin zeigt ihren Film.", vi: "Nữ diễn viên giới thiệu bộ phim của cô ấy." }
skills:
  listening:
    - id: a1-k03-l05-listen-01
      title_vi: "Nói chuyện về sự kiện"
      situation_vi: "Lisa và Minh xem thông báo sự kiện và chọn đi đâu."
      audio: { status: pending-tts, speed: slow }
      script:
        - { speaker: "Lisa", de: "Schau mal: ein Filmfestival! An zehn Tagen gibt es über 100 Filme.", vi: "Xem này: một liên hoan phim! Trong mười ngày có hơn 100 bộ phim." }
        - { speaker: "Minh", de: "Wie viel kostet ein Ticket?", vi: "Một vé bao nhiêu tiền?" }
        - { speaker: "Lisa", de: "Zehn Euro. Und da ist ein Konzert mit einem Orchester aus Wien.", vi: "Mười euro. Và kia có một buổi hòa nhạc với một dàn nhạc từ Viên." }
        - { speaker: "Minh", de: "Hm, ich finde Konzerte nicht so interessant. Aber Filme finde ich toll!", vi: "Hừm, mình thấy hòa nhạc không thú vị lắm. Nhưng phim thì mình thấy tuyệt!" }
        - { speaker: "Lisa", de: "Okay, gehen wir zum Filmfestival!", vi: "Ok, mình đi liên hoan phim nhé!" }
      exercises: [a1-k03-l05-ex04]
  reading:
    - id: a1-k03-l05-read-01
      title_vi: "Thông báo sự kiện cuối tuần"
      text_type_vi: "Thông báo sự kiện (Veranstaltungstipps)"
      text_de: |
        EVENTS AM WOCHENENDE
        ① Filmfestival: 100 Filme aus der ganzen Welt. Viele Stars sind Gäste. Tickets: 10 Euro.
        ② Konzert im Konzerthaus: Ein Orchester aus Wien spielt Mozart. Tickets: 25–60 Euro.
        ③ Theater-Festival im Park: Schauspieler aus zehn Ländern zeigen ihre Produktionen. Der Eintritt ist frei!
      translation_vi: |
        SỰ KIỆN CUỐI TUẦN
        ① Liên hoan phim: 100 bộ phim từ khắp thế giới. Nhiều ngôi sao là khách mời. Vé: 10 euro.
        ② Hòa nhạc ở nhà hòa nhạc: Một dàn nhạc từ Viên chơi nhạc Mozart. Vé: 25–60 euro.
        ③ Lễ hội sân khấu trong công viên: Diễn viên từ mười quốc gia trình diễn các vở của họ. Vào cửa miễn phí!
      glossary:
        - { de: "das Orchester", vi: "dàn nhạc" }
        - { de: "die Produktion", vi: "vở diễn, sản phẩm" }
        - { de: "der Eintritt ist frei", vi: "vào cửa miễn phí" }
      exercises: [a1-k03-l05-ex02, a1-k03-l05-ex03]
  speaking:
    - id: a1-k03-l05-speak-01
      title_vi: "Bạn thích sự kiện nào?"
      task_vi: "Chọn một sự kiện trong thông báo, nói vì sao bạn thích (Ich finde …), và rủ một người bạn đi cùng."
      steps_vi:
        - "Nói sự kiện bạn chọn và giá vé."
        - "Nói ý kiến với finden."
        - "Rủ: Gehen wir zum …?"
      model:
        - { speaker: "Lan", de: "Das Theater-Festival finde ich toll. Der Eintritt ist frei! Schauspieler aus zehn Ländern – das ist interessant. Gehen wir zum Festival?", vi: "Mình thấy lễ hội sân khấu tuyệt. Vào cửa miễn phí! Diễn viên từ mười nước – thú vị thật. Mình đi lễ hội nhé?" }
      exercises: [a1-k03-l05-ex07]
  writing:
    - id: a1-k03-l05-write-01
      title_vi: "Viết thông báo sự kiện"
      task_vi: "Viết thông báo ngắn (3 dòng) cho một sự kiện ở thành phố của bạn: tên sự kiện, nội dung (dùng từ quốc tế), giá vé."
      model_de: "Food-Festival am See: Essen aus der ganzen Welt. Viele Gäste aus Vietnam, Japan und Italien. Tickets: 5 Euro."
      model_vi: "Lễ hội ẩm thực bên hồ: Món ăn từ khắp thế giới. Nhiều khách từ Việt Nam, Nhật Bản và Ý. Vé: 5 euro."
      checklist_vi:
        - "Có ít nhất 3 từ quốc tế."
        - "Danh từ viết hoa, có giá vé bằng Euro."
      exercises: [a1-k03-l05-ex08]
exercises:
  - id: a1-k03-l05-ex01
    type: matching
    skill: vocabulary
    objectives: [o1]
    difficulty: 1
    instructions_vi: "Nối từ quốc tế với nghĩa tiếng Việt."
    items:
      - id: q1
        pairs:
          - { left: "das Festival", right: "lễ hội" }
          - { left: "der Film", right: "bộ phim" }
          - { left: "das Ticket", right: "vé" }
          - { left: "der Star", right: "ngôi sao" }
          - { left: "das Event", right: "sự kiện" }
        explanation_vi: "Những từ quốc tế này giúp bạn hiểu nhanh một văn bản."
  - id: a1-k03-l05-ex02
    type: multiple-choice
    skill: reading
    objectives: [o2, o1]
    difficulty: 1
    stimulus: a1-k03-l05-read-01
    instructions_vi: "Đọc thông báo sự kiện. Chọn đáp án đúng."
    items:
      - { id: q1, prompt: "Sự kiện nào vào cửa miễn phí?", options: ["Filmfestival", "Konzert", "Theater-Festival"], answer: "Theater-Festival", explanation_vi: "„Der Eintritt ist frei!“" }
      - { id: q2, prompt: "Dàn nhạc đến từ đâu?", options: ["aus Hamburg", "aus Wien", "aus zehn Ländern"], answer: "aus Wien", explanation_vi: "„Ein Orchester aus Wien …“" }
      - { id: q3, prompt: "Vé liên hoan phim giá bao nhiêu?", options: ["10 Euro", "25 Euro", "60 Euro"], answer: "10 Euro", explanation_vi: "„Tickets: 10 Euro.“" }
  - id: a1-k03-l05-ex03
    type: true-false
    skill: reading
    objectives: [o1, o4]
    difficulty: 2
    stimulus: a1-k03-l05-read-01
    instructions_vi: "Đúng hay sai?"
    items:
      - { id: q1, prompt: "Liên hoan phim có 100 bộ phim.", answer: true, explanation_vi: "„100 Filme …“" }
      - { id: q2, prompt: "Lễ hội sân khấu diễn ra trong nhà hòa nhạc.", answer: false, explanation_vi: "„… im Park“." }
      - { id: q3, prompt: "„ihre Produktionen“ = các vở diễn của họ (các diễn viên).", answer: true, explanation_vi: "ihre = của họ/của cô ấy." }
  - id: a1-k03-l05-ex04
    type: multiple-choice
    skill: listening
    objectives: [o3, o2]
    difficulty: 2
    stimulus: a1-k03-l05-listen-01
    instructions_vi: "Nghe Lisa và Minh. Chọn đáp án đúng."
    items:
      - { id: q1, prompt: "Minh thấy hòa nhạc thế nào?", options: ["toll", "nicht so interessant", "super"], answer: "nicht so interessant", explanation_vi: "„… ich finde Konzerte nicht so interessant.“" }
      - { id: q2, prompt: "Họ chọn đi đâu?", options: ["zum Konzert", "zum Filmfestival", "ins Theater"], answer: "zum Filmfestival", explanation_vi: "„Okay, gehen wir zum Filmfestival!“" }
      - { id: q3, prompt: "Một vé liên hoan phim giá bao nhiêu?", options: ["10 Euro", "100 Euro", "12 Euro"], answer: "10 Euro", explanation_vi: "„Zehn Euro.“" }
  - id: a1-k03-l05-ex05
    type: gap-fill
    skill: grammar
    objectives: [o3]
    difficulty: 2
    instructions_vi: "Chia động từ finden."
    items:
      - { id: q1, prompt: "Ich ___ das Festival toll.", answer: ["finde"], explanation_vi: "ich finde." }
      - { id: q2, prompt: "Wie ___ du den Film?", answer: ["findest"], explanation_vi: "Gốc -d → du findest." }
      - { id: q3, prompt: "Er ___ Konzerte interessant.", answer: ["findet"], explanation_vi: "Gốc -d → er findet." }
  - id: a1-k03-l05-ex06
    type: translation
    skill: vocabulary
    objectives: [o3, o2]
    difficulty: 2
    direction: vi-de
    instructions_vi: "Dịch sang tiếng Đức."
    items:
      - { id: q1, prompt: "Tôi thấy bộ phim thú vị.", answer: "Ich finde den Film interessant.", accept: ["Ich finde den Film sehr interessant."], explanation_vi: "finden + den Film (Akkusativ – Kapitel 4) + tính từ." }
      - { id: q2, prompt: "Vé giá bao nhiêu?", answer: "Was kostet das Ticket?", accept: ["Wie viel kostet das Ticket?"], explanation_vi: "Was kostet …?" }
  - id: a1-k03-l05-ex07
    type: speaking
    skill: speaking
    objectives: [o3, o2]
    difficulty: 2
    grading: self
    instructions_vi: "Ghi âm: chọn sự kiện, nói ý kiến và rủ bạn (phần Nói)."
    rubric:
      - { criterion_vi: "Nói được sự kiện và ít nhất một thông tin (giá, nơi)", points: 2 }
      - { criterion_vi: "Bày tỏ ý kiến với finden đúng", points: 2 }
    items:
      - { id: q1, prompt: "Bạn thích sự kiện nào?", model_answer: "Das Theater-Festival finde ich toll. Der Eintritt ist frei! Schauspieler aus zehn Ländern – das ist interessant. Gehen wir zum Festival?", explanation_vi: "So sánh với mẫu." }
  - id: a1-k03-l05-ex08
    type: writing
    skill: writing
    objectives: [o1, o2]
    difficulty: 1
    grading: self
    instructions_vi: "Viết thông báo sự kiện (phần Viết)."
    rubric:
      - { criterion_vi: "Có tên, nội dung, giá vé", points: 2 }
      - { criterion_vi: "Dùng ít nhất 3 từ quốc tế, chính tả đúng", points: 1 }
    items:
      - { id: q1, prompt: "Thông báo sự kiện", model_answer: "Food-Festival am See: Essen aus der ganzen Welt. Viele Gäste aus Vietnam, Japan und Italien. Tickets: 5 Euro.", explanation_vi: "So sánh với mẫu." }
summary_vi: "Chiến lược: tìm từ quốc tế trước (Festival, Film, Ticket, Event, Konzert, Star) để hiểu ý chính. Ý kiến: Ich finde … toll/interessant/nicht so interessant; Wie findest du …? Giá: Was kostet das Ticket? Mạo từ sở hữu: sein/seine (của anh ấy), ihr/ihre (của cô ấy/họ)."
self_check:
  - "Tôi hiểu ý chính của một thông báo sự kiện nhờ từ quốc tế."
  - "Tôi tìm được giá vé, địa điểm trong thông báo."
  - "Tôi nói được ý kiến với finden."
