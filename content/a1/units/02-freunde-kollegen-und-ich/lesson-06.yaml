id: a1-k02-l06
kind: lesson
level: A1
unit: a1-k02
order: 6
title_de: "Neu im Club"
title_vi: "Đăng ký câu lạc bộ thể thao – điền biểu mẫu"
topic_vi: "Biểu mẫu đăng ký; địa chỉ kiểu Đức; môn thể thao"
source:
  type: netzwerk-neu
  kapitel: 2
  sections: ["Landeskunde: Neu im Club"]
  note_vi: "Sprachhandlungen: Angaben zuordnen; ein Formular ergänzen. Wortschatz: Wortschatz zum Formular. Textsorten: Visitenkarten, Sportclub: Kurse, Anmeldeformular."
cefr: [A1.S1, A1.L3, A1.SI2, A1.H3]
objectives:
  - { id: o1, vi: "Hiểu các mục trong biểu mẫu (Familienname, Vorname, Geburtsdatum, Geburtsort, Adresse, PLZ, Wohnort, männlich/weiblich…) và điền đúng." }
  - { id: o2, vi: "Đọc và viết địa chỉ theo kiểu Đức: Straße + Hausnummer, Postleitzahl + Ort." }
  - { id: o3, vi: "Đọc thông tin khóa học ở câu lạc bộ thể thao và chọn khóa phù hợp." }
estimated_minutes: 60
prerequisites: [a1-k02-l05]
intro_vi: |
  Ở Đức, Áo, Thụy Sĩ có rất nhiều **câu lạc bộ (Verein/Club)**: thể thao, âm nhạc, nấu ăn…
  Khi tham gia, bạn phải **điền biểu mẫu (Formular)**. Biểu mẫu cũng xuất hiện khi bạn đăng ký cư trú, mở tài khoản ngân hàng,
  đăng ký khóa học – và trong **đề thi A1** (phần Viết, Teil 1).

  **Hai điểm khác Việt Nam khi viết địa chỉ:**
  1. **Số nhà đứng SAU tên đường:** *Lindenstraße 12* (không phải “12 Lindenstraße”).
  2. **Mã bưu chính (5 số) đứng TRƯỚC tên thành phố:** *04109 Leipzig*.
vocabulary:
  file: vocabulary/02-freunde-kollegen-und-ich.csv
  new: [a1-k02-v164, a1-k02-v165, a1-k02-v166, a1-k02-v167, a1-k02-v168, a1-k02-v169, a1-k02-v170, a1-k02-v171, a1-k02-v172, a1-k02-v173, a1-k02-v174, a1-k02-v175, a1-k02-v176, a1-k02-v177, a1-k02-v178, a1-k02-v179, a1-k02-v180, a1-k02-v181, a1-k02-v182]
  review: [a1-k01-v031, a1-k01-v032, a1-k01-v087, a1-k01-v090, a1-k02-v025, a1-k02-v102, a1-k02-v121]
grammar:
  topics: []
  notes:
    - title_vi: "Viết địa chỉ và ngày sinh"
      explanation_vi: |
        Địa chỉ: [Tên đường][Số nhà], [Mã bưu chính] [Thành phố] → Lindenstraße 12, 04109 Leipzig.
        Ngày sinh: ngày.tháng.năm → 12.05.2001 (giống Việt Nam, dùng dấu chấm).
        Trong biểu mẫu, Vorname = tên (có thể ghi cả tên đệm), Familienname/Nachname = họ.
      examples:
        - { de: "Adresse: Goethestraße 7, 10115 Berlin", vi: "Địa chỉ: số 7 phố Goethe, 10115 Berlin" }
        - { de: "Geburtsdatum: 03.09.1999", vi: "Ngày sinh: 03/09/1999" }
redemittel:
  - id: a1-k02-l06-r01
    de: "Wie ist Ihre Adresse? – Meine Adresse ist …"
    vi: "Địa chỉ của ông/bà là gì? – Địa chỉ của tôi là …"
    context_vi: "Hỏi và nói địa chỉ khi đăng ký."
    register: formal
    dialogue:
      - { speaker: "Mitarbeiter", de: "Wie ist Ihre Adresse?", vi: "Địa chỉ của chị là gì?" }
      - { speaker: "Lan", de: "Lindenstraße 12, 04109 Leipzig.", vi: "Số 12 phố Linden, 04109 Leipzig." }
  - id: a1-k02-l06-r02
    de: "Ich bin neu hier / neu im Club."
    vi: "Tôi mới đến đây / mới vào câu lạc bộ."
    context_vi: "Giới thiệu mình là người mới."
    register: neutral
    dialogue:
      - { speaker: "Huy", de: "Hallo! Ich bin neu im Club.", vi: "Xin chào! Tôi mới vào câu lạc bộ." }
      - { speaker: "Trainerin", de: "Willkommen! Spielst du Tennis oder Basketball?", vi: "Chào mừng! Bạn chơi tennis hay bóng rổ?" }
  - id: a1-k02-l06-r03
    de: "Wann ist der Kurs? – Am …"
    vi: "Khóa học vào khi nào? – Vào …"
    context_vi: "Hỏi lịch của khóa học."
    register: neutral
    dialogue:
      - { speaker: "Mai", de: "Wann ist der Yoga-Kurs?", vi: "Lớp yoga vào khi nào ạ?" }
      - { speaker: "Mitarbeiterin", de: "Am Dienstag und am Donnerstag.", vi: "Thứ Ba và thứ Năm." }
pronunciation:
  - id: a1-k02-l06-p01
    focus_vi: "Từ ghép dài trong biểu mẫu"
    explanation_vi: "Đọc từ ghép theo từng phần, nhấn phần ĐẦU: POST-leit-zahl, ge-BURTS-da-tum, FA-mi-li-en-na-me (Familie nhấn mi: fa-MI-li-e)."
    examples:
      - { de: "die Postleitzahl", vi: "mã bưu chính", ipa: "[ˈpɔstlaɪ̯tˌtsaːl]" }
      - { de: "das Geburtsdatum", vi: "ngày sinh", ipa: "[ɡəˈbuːɐ̯tsˌdaːtʊm]" }
    practice_vi: "Đọc to các mục của biểu mẫu ở phần Đọc."
examples:
  - { de: "Ich bin neu im Club.", vi: "Tôi mới vào câu lạc bộ." }
  - { de: "Wir spielen Basketball und Tennis.", vi: "Chúng tôi chơi bóng rổ và quần vợt." }
  - { de: "Meine Postleitzahl ist 20095.", vi: "Mã bưu chính của tôi là 20095." }
  - { de: "Wählen Sie einen Kurs.", vi: "Hãy chọn một khóa học." }
  - { de: "Ich mache gern Yoga.", vi: "Tôi thích tập yoga." }
skills:
  listening:
    - id: a1-k02-l06-listen-01
      title_vi: "Đăng ký qua điện thoại"
      situation_vi: "Huy gọi đến câu lạc bộ thể thao để đăng ký."
      audio: { status: pending-tts, speed: slow }
      script:
        - { speaker: "Mitarbeiterin", de: "Sportclub Lindenau, guten Tag!", vi: "Câu lạc bộ thể thao Lindenau, xin chào!" }
        - { speaker: "Huy", de: "Guten Tag! Mein Name ist Huy Le. Ich bin neu in Leipzig und spiele gern Basketball.", vi: "Xin chào! Tôi tên là Huy Lê. Tôi mới đến Leipzig và thích chơi bóng rổ." }
        - { speaker: "Mitarbeiterin", de: "Super! Der Basketball-Kurs ist am Mittwoch. Wie ist Ihre Adresse?", vi: "Tuyệt! Lớp bóng rổ vào thứ Tư. Địa chỉ của anh là gì?" }
        - { speaker: "Huy", de: "Karl-Heine-Straße 28, 04229 Leipzig.", vi: "Số 28 phố Karl-Heine, 04229 Leipzig." }
        - { speaker: "Mitarbeiterin", de: "Und Ihr Geburtsdatum?", vi: "Còn ngày sinh của anh?" }
        - { speaker: "Huy", de: "Der 14.07.1998.", vi: "Ngày 14/07/1998." }
        - { speaker: "Mitarbeiterin", de: "Danke, Herr Le. Bis Mittwoch!", vi: "Cảm ơn anh Lê. Hẹn thứ Tư!" }
      exercises: [a1-k02-l06-ex03]
  reading:
    - id: a1-k02-l06-read-01
      title_vi: "Khóa học và phiếu đăng ký"
      text_type_vi: "Bảng khóa học và biểu mẫu"
      text_de: |
        SPORTCLUB LINDENAU – Kurse
        Montag: Yoga · Mittwoch: Basketball · Freitag: Tennis · Samstag: Fußball

        ANMELDUNG
        Familienname: Pham          Vorname: Mai
        ☐ männlich   ☒ weiblich
        Geburtsdatum: 03.09.1999    Geburtsort: Da Nang
        Straße, Hausnummer: Goethestraße 7
        Postleitzahl, Wohnort: 04109 Leipzig
        E-Mail: mai.pham@web.de
        Kurs: Yoga
      translation_vi: |
        CÂU LẠC BỘ THỂ THAO LINDENAU – Các khóa
        Thứ Hai: Yoga · Thứ Tư: Bóng rổ · Thứ Sáu: Quần vợt · Thứ Bảy: Bóng đá

        PHIẾU ĐĂNG KÝ
        Họ: Phạm          Tên: Mai
        ☐ nam   ☒ nữ
        Ngày sinh: 03/09/1999    Nơi sinh: Đà Nẵng
        Đường, số nhà: số 7 phố Goethe
        Mã bưu chính, nơi ở: 04109 Leipzig
        Email: mai.pham@web.de
        Khóa: Yoga
      glossary:
        - { de: "die Anmeldung", vi: "đăng ký, phiếu đăng ký" }
      exercises: [a1-k02-l06-ex04]
  speaking:
    - id: a1-k02-l06-speak-01
      title_vi: "Đóng vai: đăng ký ở câu lạc bộ"
      task_vi: "Bạn đến quầy câu lạc bộ. Nhân viên hỏi họ tên, địa chỉ, ngày sinh, email và khóa học bạn chọn. Trả lời bằng thông tin của bạn."
      steps_vi:
        - "Chào và nói bạn là người mới."
        - "Trả lời các câu hỏi; đánh vần họ nếu cần."
        - "Chọn một khóa học và hỏi lịch."
      model:
        - { speaker: "Lan", de: "Guten Tag! Ich bin neu hier. Mein Name ist Lan Nguyen.", vi: "Xin chào! Tôi là người mới. Tôi tên là Lan Nguyễn." }
        - { speaker: "Mitarbeiter", de: "Wie ist Ihre Adresse?", vi: "Địa chỉ của chị là gì?" }
        - { speaker: "Lan", de: "Lindenstraße 12, 04109 Leipzig.", vi: "Số 12 phố Linden, 04109 Leipzig." }
        - { speaker: "Lan", de: "Ich mache gern Yoga. Wann ist der Kurs?", vi: "Tôi thích tập yoga. Lớp học vào khi nào ạ?" }
      exercises: [a1-k02-l06-ex07]
  writing:
    - id: a1-k02-l06-write-01
      title_vi: "Điền phiếu đăng ký"
      task_vi: "Điền phiếu đăng ký câu lạc bộ với thông tin của bạn (có thể dùng địa chỉ tưởng tượng ở Đức)."
      model_de: "Familienname: Nguyen · Vorname: Lan · weiblich · Geburtsdatum: 21.02.2000 · Geburtsort: Hanoi · Straße, Hausnummer: Lindenstraße 12 · PLZ, Wohnort: 04109 Leipzig · E-Mail: lan.nguyen@web.de · Kurs: Tennis"
      model_vi: "Phiếu mẫu đã điền."
      checklist_vi:
        - "Họ và tên đúng ô."
        - "Số nhà sau tên đường; mã bưu chính trước thành phố."
        - "Ngày sinh dạng ngày.tháng.năm."
      exercises: [a1-k02-l06-ex08]
exercises:
  - id: a1-k02-l06-ex01
    type: matching
    skill: vocabulary
    objectives: [o1]
    difficulty: 1
    instructions_vi: "Nối mục trong biểu mẫu với nghĩa tiếng Việt."
    items:
      - id: q1
        pairs:
          - { left: "Familienname", right: "họ" }
          - { left: "Geburtsdatum", right: "ngày sinh" }
          - { left: "Geburtsort", right: "nơi sinh" }
          - { left: "Postleitzahl", right: "mã bưu chính" }
          - { left: "Wohnort", right: "nơi ở" }
          - { left: "weiblich", right: "nữ" }
        explanation_vi: "Các mục thường gặp trong biểu mẫu."
  - id: a1-k02-l06-ex02
    type: multiple-choice
    skill: writing
    objectives: [o2]
    difficulty: 1
    instructions_vi: "Cách viết địa chỉ nào đúng kiểu Đức?"
    items:
      - { id: q1, prompt: "Chọn địa chỉ viết đúng.", options: ["12 Lindenstraße, Leipzig 04109", "Lindenstraße 12, 04109 Leipzig", "Lindenstraße, 12 Leipzig, 04109"], answer: "Lindenstraße 12, 04109 Leipzig", explanation_vi: "Đường + số nhà; mã bưu chính + thành phố." }
  - id: a1-k02-l06-ex03
    type: gap-fill
    skill: listening
    objectives: [o1, o2]
    difficulty: 2
    stimulus: a1-k02-l06-listen-01
    instructions_vi: "Nghe cuộc gọi. Điền thông tin của Huy."
    items:
      - { id: q1, prompt: "Kurs: ___ (am Mittwoch)", answer: ["Basketball"], explanation_vi: "„Der Basketball-Kurs ist am Mittwoch.“" }
      - { id: q2, prompt: "Straße: Karl-Heine-Straße ___", answer: ["28"], explanation_vi: "achtundzwanzig." }
      - { id: q3, prompt: "PLZ, Ort: ___ Leipzig", answer: ["04229"], explanation_vi: "null, vier, zwei, zwei, neun." }
      - { id: q4, prompt: "Geburtsdatum: ___", answer: ["14.07.1998"], explanation_vi: "Ngày 14 tháng 7 năm 1998." }
  - id: a1-k02-l06-ex04
    type: true-false
    skill: reading
    objectives: [o1, o3]
    difficulty: 1
    stimulus: a1-k02-l06-read-01
    instructions_vi: "Đọc bảng khóa học và phiếu đăng ký của Mai. Đúng hay sai?"
    items:
      - { id: q1, prompt: "Mai chọn khóa học vào thứ Hai.", answer: true, explanation_vi: "Kurs: Yoga – Yoga vào Montag." }
      - { id: q2, prompt: "Mai sinh ra ở Leipzig.", answer: false, explanation_vi: "Geburtsort: Da Nang." }
      - { id: q3, prompt: "Lớp quần vợt vào thứ Sáu.", answer: true, explanation_vi: "Freitag: Tennis." }
      - { id: q4, prompt: "Mai sống ở phố Goethe số 7.", answer: true, explanation_vi: "Goethestraße 7." }
  - id: a1-k02-l06-ex05
    type: multiple-choice
    skill: vocabulary
    objectives: [o3]
    difficulty: 1
    instructions_vi: "Chọn động từ phù hợp."
    items:
      - { id: q1, prompt: "Ich ___ gern Yoga.", options: ["mache", "spiele", "fahre"], answer: "mache", explanation_vi: "Yoga machen." }
      - { id: q2, prompt: "Wir ___ Basketball.", options: ["machen", "spielen", "lesen"], answer: "spielen", explanation_vi: "Basketball spielen." }
  - id: a1-k02-l06-ex06
    type: translation
    skill: vocabulary
    objectives: [o1, o2]
    difficulty: 2
    direction: vi-de
    instructions_vi: "Dịch sang tiếng Đức."
    items:
      - { id: q1, prompt: "Địa chỉ của ông/bà là gì?", answer: "Wie ist Ihre Adresse?", explanation_vi: "die Adresse → Ihre." }
      - { id: q2, prompt: "Tôi mới vào câu lạc bộ.", answer: "Ich bin neu im Club.", explanation_vi: "neu im Club." }
  - id: a1-k02-l06-ex07
    type: speaking
    skill: speaking
    objectives: [o1, o2]
    difficulty: 2
    grading: self
    instructions_vi: "Đóng vai đăng ký ở câu lạc bộ (phần Nói). Ghi âm phần của bạn."
    rubric:
      - { criterion_vi: "Nói đúng họ tên, địa chỉ (đọc số đúng), ngày sinh", points: 3 }
      - { criterion_vi: "Chọn khóa học và hỏi lịch", points: 1 }
    items:
      - { id: q1, prompt: "Đăng ký ở câu lạc bộ", model_answer: "Guten Tag! Ich bin neu hier. Mein Name ist Lan Nguyen. – Lindenstraße 12, 04109 Leipzig. – Ich mache gern Yoga. Wann ist der Kurs?", explanation_vi: "Đọc mã bưu chính từng chữ số hoặc theo cặp: null-vier-eins-null-neun." }
  - id: a1-k02-l06-ex08
    type: writing
    skill: writing
    objectives: [o1, o2]
    difficulty: 1
    grading: self
    instructions_vi: "Điền phiếu đăng ký câu lạc bộ (phần Viết)."
    rubric:
      - { criterion_vi: "Mọi ô điền đúng loại thông tin", points: 3 }
      - { criterion_vi: "Địa chỉ và ngày sinh đúng định dạng Đức", points: 1 }
    items:
      - { id: q1, prompt: "Phiếu đăng ký Sportclub Lindenau", model_answer: "Familienname: Nguyen · Vorname: Lan · weiblich · Geburtsdatum: 21.02.2000 · Geburtsort: Hanoi · Straße, Hausnummer: Lindenstraße 12 · PLZ, Wohnort: 04109 Leipzig · E-Mail: lan.nguyen@web.de · Kurs: Tennis", explanation_vi: "So sánh với phiếu mẫu ở phần Đọc." }
summary_vi: "Biểu mẫu: Familienname/Nachname, Vorname, Geburtsdatum, Geburtsort, Straße + Hausnummer, Postleitzahl + Wohnort, männlich/weiblich, E-Mail. Địa chỉ Đức: Lindenstraße 12, 04109 Leipzig. Môn thể thao: Fußball/Tennis/Basketball spielen, Yoga machen."
self_check:
  - "Tôi hiểu các mục trong một biểu mẫu đăng ký."
  - "Tôi viết được địa chỉ theo kiểu Đức."
  - "Tôi điền được phiếu đăng ký với thông tin của mình."
