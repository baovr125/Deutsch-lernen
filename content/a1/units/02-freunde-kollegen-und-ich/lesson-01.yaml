id: a1-k02-l01
kind: lesson
level: A1
unit: a1-k02
order: 1
title_de: "Freunde, Kollegen und ich"
title_vi: "Sở thích: Tôi thích làm gì?"
topic_vi: "Hoạt động thời gian rảnh; nói thích/không thích với gern"
source:
  type: netzwerk-neu
  kapitel: 2
  sections: ["Freunde, Kollegen und ich"]
  note_vi: "Sprachhandlungen: Freizeitaktivitäten von Personen notieren; eigene Freizeitaktivitäten; Fragen und Antworten. Wortschatz: Hobbys und Aktivitäten."
cefr: [A1.SP2, A1.SI2, A1.H1, A1.L1]
objectives:
  - { id: o1, vi: "Gọi tên các hoạt động thời gian rảnh (kochen, tanzen, schwimmen, Fußball spielen…)." }
  - { id: o2, vi: "Nói mình thích/không thích làm gì với gern, sehr gern, nicht so gern, nicht gern." }
  - { id: o3, vi: "Hỏi người khác thích làm gì: Was machst du gern? / Tanzt du gern?" }
  - { id: o4, vi: "Nói về bạn bè và đồng nghiệp: Mein Freund/Meine Kollegin … gern." }
estimated_minutes: 70
prerequisites: [a1-k01-review]
intro_vi: |
  **Kapitel 2** bắt đầu với chủ đề ai cũng thích: **sở thích và thời gian rảnh**.

  Trong tiếng Việt, ta nói “tôi **thích** nấu ăn” – “thích” là một động từ. Tiếng Đức thường nói khác:
  **Ich koche gern.** – nghĩa đen “tôi nấu ăn **một cách vui vẻ**”. Từ **gern** đứng **sau động từ**.

  Bài này dạy bạn khoảng 20 động từ hoạt động và cách nói mức độ thích:

  **sehr gern** 😍 → **gern** 🙂 → **nicht so gern** 😐 → **nicht gern** 🙁

  Bạn cũng sẽ dùng lại các ngôi **ich, du, er/sie** đã học ở Kapitel 1 để nói về bạn bè và đồng nghiệp.
vocabulary:
  file: vocabulary/02-freunde-kollegen-und-ich.csv
  new: [a1-k02-v001, a1-k02-v002, a1-k02-v003, a1-k02-v004, a1-k02-v005, a1-k02-v006, a1-k02-v007, a1-k02-v008, a1-k02-v009, a1-k02-v010, a1-k02-v011, a1-k02-v012, a1-k02-v013, a1-k02-v014, a1-k02-v015, a1-k02-v016, a1-k02-v017, a1-k02-v018, a1-k02-v019, a1-k02-v020, a1-k02-v021]
  review: [a1-u00-v009, a1-u00-v012, a1-u00-v013, a1-u00-v022, a1-u00-v023, a1-k01-v012, a1-k01-v010]
grammar:
  topics: []
  notes:
    - title_vi: "gern đứng sau động từ"
      explanation_vi: "Cấu trúc: Chủ ngữ + ĐỘNG TỪ + (tân ngữ) + gern. Phủ định: nicht gern (nicht đứng trước gern). Hỏi: Was machst du gern? hoặc đưa động từ lên đầu: Tanzt du gern? (câu hỏi có/không – học kỹ ở bài 3)."
      examples:
        - { de: "Ich koche gern.", vi: "Tôi thích nấu ăn." }
        - { de: "Er spielt gern Fußball.", vi: "Anh ấy thích chơi bóng đá." }
        - { de: "Ich tanze nicht gern.", vi: "Tôi không thích nhảy." }
    - title_vi: "Môn thể thao không có mạo từ"
      explanation_vi: "Sau spielen, tên môn thể thao không dùng mạo từ: Fußball spielen, Tennis spielen. Một số môn đi với machen: Yoga machen, Sport machen."
      examples:
        - { de: "Wir spielen Fußball.", vi: "Chúng tôi chơi bóng đá." }
redemittel:
  - id: a1-k02-l01-r01
    de: "Was machst du gern? – Ich … gern."
    vi: "Bạn thích làm gì? – Tôi thích …"
    context_vi: "Hỏi và nói về sở thích (thân mật). Trang trọng: Was machen Sie gern?"
    register: informal
    dialogue:
      - { speaker: "Lisa", de: "Was machst du gern, Minh?", vi: "Minh thích làm gì?" }
      - { speaker: "Minh", de: "Ich koche gern. Und ich fotografiere gern.", vi: "Mình thích nấu ăn. Và mình thích chụp ảnh." }
  - id: a1-k02-l01-r02
    de: "Ja, sehr gern! / Nein, nicht so gern."
    vi: "Có, rất thích! / Không, không thích lắm."
    context_vi: "Trả lời câu hỏi “… du gern …?” với các mức độ."
    register: informal
    dialogue:
      - { speaker: "Paul", de: "Tanzt du gern?", vi: "Bạn có thích nhảy không?" }
      - { speaker: "Mai", de: "Nein, nicht so gern. Aber ich singe sehr gern!", vi: "Không, không thích lắm. Nhưng mình rất thích hát!" }
  - id: a1-k02-l01-r03
    de: "Ich auch! / Ich nicht."
    vi: "Mình cũng vậy! / Mình thì không."
    context_vi: "Phản ứng nhanh khi người khác nói về sở thích."
    register: informal
    dialogue:
      - { speaker: "Lisa", de: "Ich schwimme gern.", vi: "Mình thích bơi." }
      - { speaker: "Minh", de: "Ich auch!", vi: "Mình cũng vậy!" }
      - { speaker: "Paul", de: "Ich nicht.", vi: "Mình thì không." }
  - id: a1-k02-l01-r04
    de: "Es geht so."
    vi: "Tàm tạm."
    context_vi: "Trả lời trung tính khi không thích cũng không ghét."
    register: informal
    dialogue:
      - { speaker: "Anna", de: "Joggst du gern?", vi: "Bạn có thích chạy bộ không?" }
      - { speaker: "Tom", de: "Es geht so.", vi: "Tàm tạm." }
pronunciation:
  - id: a1-k02-l01-p01
    focus_vi: "ng [ŋ], sch [ʃ] và j [dʒ] trong từ mượn"
    explanation_vi: "singen [ˈzɪŋən]: ng như “ng” tiếng Việt, KHÔNG có âm g sau. schwimmen [ˈʃvɪmən]: sch + w [v]. joggen [ˈdʒɔɡn̩]: từ mượn tiếng Anh nên j đọc [dʒ], khác với ja [jaː]."
    examples:
      - { de: "singen", vi: "hát", ipa: "[ˈzɪŋən]" }
      - { de: "schwimmen", vi: "bơi", ipa: "[ˈʃvɪmən]" }
      - { de: "joggen", vi: "chạy bộ", ipa: "[ˈdʒɔɡn̩]" }
    practice_vi: "Đọc liền: Ich singe gern, ich schwimme gern, ich jogge nicht so gern."
examples:
  - { de: "Ich koche gern.", vi: "Tôi thích nấu ăn." }
  - { de: "Meine Freundin tanzt sehr gern.", vi: "Bạn tôi rất thích nhảy." }
  - { de: "Mein Kollege spielt gern Fußball.", vi: "Đồng nghiệp tôi thích chơi bóng đá." }
  - { de: "Ich reise gern, aber ich fotografiere nicht gern.", vi: "Tôi thích du lịch nhưng không thích chụp ảnh." }
  - { de: "Was machst du gern? – Ich gehe gern ins Kino.", vi: "Bạn thích làm gì? – Mình thích đi xem phim." }
  - { de: "Kennst du Lisa? – Ja! Sie singt sehr gern.", vi: "Bạn có quen Lisa không? – Có! Cô ấy rất thích hát." }
skills:
  listening:
    - id: a1-k02-l01-listen-01
      title_vi: "Khảo sát trong lớp: Bạn thích làm gì?"
      situation_vi: "Giáo viên hỏi ba học viên về sở thích."
      audio: { status: pending-tts, speed: slow }
      script:
        - { speaker: "Lehrerin", de: "Minh, was machst du gern?", vi: "Minh, em thích làm gì?" }
        - { speaker: "Minh", de: "Ich koche gern und ich fotografiere sehr gern.", vi: "Em thích nấu ăn và rất thích chụp ảnh." }
        - { speaker: "Lehrerin", de: "Und du, Ana?", vi: "Còn em, Ana?" }
        - { speaker: "Ana", de: "Ich tanze sehr gern! Aber ich schwimme nicht so gern.", vi: "Em rất thích nhảy! Nhưng em không thích bơi lắm." }
        - { speaker: "Lehrerin", de: "Kenji, spielst du gern Fußball?", vi: "Kenji, em có thích chơi bóng đá không?" }
        - { speaker: "Kenji", de: "Nein, nicht gern. Ich joggen gern … Entschuldigung: Ich jogge gern!", vi: "Không ạ. Em thích chạy bộ … Xin lỗi: Em thích chạy bộ!" }
      exercises: [a1-k02-l01-ex02, a1-k02-l01-ex03]
  reading:
    - id: a1-k02-l01-read-01
      title_vi: "Hồ sơ trên ứng dụng tìm bạn tập thể thao"
      text_type_vi: "Hồ sơ cá nhân ngắn"
      text_de: |
        Lena, 24, Leipzig: Ich schwimme gern und ich jogge sehr gern. Ich koche nicht so gern. 😄
        Huy, 31, Berlin: Ich spiele gern Fußball. Ich reise auch gern. Ich tanze nicht gern!
        Sara, 27, Wien: Ich singe sehr gern. Meine Kollegin und ich gehen gern ins Kino.
      translation_vi: |
        Lena, 24 tuổi, Leipzig: Mình thích bơi và rất thích chạy bộ. Mình không thích nấu ăn lắm. 😄
        Huy, 31 tuổi, Berlin: Mình thích chơi bóng đá. Mình cũng thích du lịch. Mình không thích nhảy!
        Sara, 27 tuổi, Viên: Mình rất thích hát. Mình và đồng nghiệp thích đi xem phim.
      exercises: [a1-k02-l01-ex07]
  speaking:
    - id: a1-k02-l01-speak-01
      title_vi: "Bạn và bạn bè thích làm gì?"
      task_vi: "Nói 4–5 câu: hai điều bạn thích, một điều bạn không thích, và sở thích của một người bạn hoặc đồng nghiệp."
      steps_vi:
        - "Chọn 3–4 động từ trong bài."
        - "Nói với mức độ khác nhau (sehr gern, gern, nicht so gern, nicht gern)."
        - "Nói về một người: Mein Freund … / Meine Kollegin …"
      model:
        - { speaker: "Lan", de: "Ich reise sehr gern. Ich koche auch gern. Ich schwimme nicht so gern. Meine Freundin Mai singt gern.", vi: "Tôi rất thích du lịch. Tôi cũng thích nấu ăn. Tôi không thích bơi lắm. Bạn tôi, Mai, thích hát." }
      exercises: [a1-k02-l01-ex09]
  writing:
    - id: a1-k02-l01-write-01
      title_vi: "Hồ sơ sở thích của bạn"
      task_vi: "Viết hồ sơ ngắn cho ứng dụng tìm bạn (giống phần Đọc): tên, tuổi, thành phố, 3 sở thích với mức độ khác nhau."
      model_de: "Minh, 25, Hamburg: Ich koche sehr gern. Ich spiele gern Fußball. Ich tanze nicht so gern."
      model_vi: "Minh, 25 tuổi, Hamburg: Tôi rất thích nấu ăn. Tôi thích chơi bóng đá. Tôi không thích nhảy lắm."
      checklist_vi:
        - "Động từ chia đúng với ich (-e)."
        - "gern đứng sau động từ (và sau tân ngữ nếu có: Fußball spielen → Ich spiele gern Fußball)."
        - "Có ít nhất một câu với nicht (so) gern."
      exercises: [a1-k02-l01-ex10]
exercises:
  - id: a1-k02-l01-ex01
    type: matching
    skill: vocabulary
    objectives: [o1]
    difficulty: 1
    instructions_vi: "Nối hoạt động với nghĩa tiếng Việt."
    items:
      - id: q1
        pairs:
          - { left: "kochen", right: "nấu ăn" }
          - { left: "schwimmen", right: "bơi" }
          - { left: "tanzen", right: "nhảy" }
          - { left: "reisen", right: "du lịch" }
          - { left: "fotografieren", right: "chụp ảnh" }
          - { left: "singen", right: "hát" }
        explanation_vi: "Sáu hoạt động thời gian rảnh của bài."
  - id: a1-k02-l01-ex02
    type: multiple-choice
    skill: listening
    objectives: [o2, o1]
    difficulty: 1
    stimulus: a1-k02-l01-listen-01
    instructions_vi: "Nghe khảo sát. Mỗi người thích làm gì nhất?"
    items:
      - { id: q1, prompt: "Minh rất thích …", options: ["kochen", "fotografieren", "tanzen"], answer: "fotografieren", explanation_vi: "Minh: “… ich fotografiere sehr gern.” (nấu ăn: gern, chụp ảnh: sehr gern)." }
      - { id: q2, prompt: "Ana rất thích …", options: ["schwimmen", "tanzen", "singen"], answer: "tanzen", explanation_vi: "Ana: “Ich tanze sehr gern!”" }
      - { id: q3, prompt: "Kenji thích …", options: ["Fußball spielen", "joggen", "kochen"], answer: "joggen", explanation_vi: "Kenji: “Ich jogge gern!”" }
  - id: a1-k02-l01-ex03
    type: true-false
    skill: listening
    objectives: [o2]
    difficulty: 2
    stimulus: a1-k02-l01-listen-01
    instructions_vi: "Nghe lại. Đúng hay sai?"
    items:
      - { id: q1, prompt: "Ana không thích bơi lắm.", answer: true, explanation_vi: "“Ich schwimme nicht so gern.”" }
      - { id: q2, prompt: "Kenji thích chơi bóng đá.", answer: false, explanation_vi: "“Nein, nicht gern.”" }
      - { id: q3, prompt: "Kenji tự sửa lỗi chia động từ: „ich joggen“ → „ich jogge“.", answer: true, explanation_vi: "Với ich phải là jogge." }
  - id: a1-k02-l01-ex04
    type: multiple-choice
    skill: vocabulary
    objectives: [o2]
    difficulty: 1
    instructions_vi: "Chọn câu đúng với hình biểu tượng cảm xúc."
    items:
      - { id: q1, prompt: "😍 kochen", options: ["Ich koche sehr gern.", "Ich koche nicht gern.", "Ich koche nicht so gern."], answer: "Ich koche sehr gern.", explanation_vi: "😍 = sehr gern." }
      - { id: q2, prompt: "🙁 tanzen", options: ["Ich tanze gern.", "Ich tanze nicht gern.", "Ich tanze sehr gern."], answer: "Ich tanze nicht gern.", explanation_vi: "🙁 = nicht gern." }
      - { id: q3, prompt: "😐 joggen", options: ["Ich jogge nicht so gern.", "Ich jogge sehr gern.", "Ich jogge gern."], answer: "Ich jogge nicht so gern.", explanation_vi: "😐 = nicht so gern." }
  - id: a1-k02-l01-ex05
    type: gap-fill
    skill: grammar
    objectives: [o4, o3]
    difficulty: 2
    instructions_vi: "Chia động từ trong ngoặc (ôn ngôi số ít từ Kapitel 1)."
    items:
      - { id: q1, prompt: "Was ___ du gern? (machen)", answer: ["machst"], explanation_vi: "du → -st." }
      - { id: q2, prompt: "Meine Kollegin ___ gern. (singen)", answer: ["singt"], explanation_vi: "sie → -t." }
      - { id: q3, prompt: "Mein Freund ___ gern Fußball. (spielen)", answer: ["spielt"], explanation_vi: "er → -t." }
      - { id: q4, prompt: "___ du gern? (tanzen)", answer: ["Tanzt"], explanation_vi: "Gốc tận cùng z → du tanzt." }
      - { id: q5, prompt: "Er ___ in Hamburg. (arbeiten)", answer: ["arbeitet"], explanation_vi: "Gốc tận cùng t → arbeitet (thêm e)." }
  - id: a1-k02-l01-ex06
    type: ordering
    skill: grammar
    objectives: [o2, o3]
    difficulty: 1
    instructions_vi: "Sắp xếp thành câu đúng."
    items:
      - { id: q1, tokens: ["gern", "koche", "Ich"], answer: "Ich koche gern.", explanation_vi: "gern đứng sau động từ." }
      - { id: q2, tokens: ["Fußball", "gern", "spielt", "Er"], answer: "Er spielt gern Fußball.", explanation_vi: "Er – spielt – gern – Fußball." }
      - { id: q3, tokens: ["gern", "du", "machst", "Was"], answer: "Was machst du gern?", explanation_vi: "W-Frage: Was – machst – du – gern." }
  - id: a1-k02-l01-ex07
    type: multiple-choice
    skill: reading
    objectives: [o2, o4]
    difficulty: 1
    stimulus: a1-k02-l01-read-01
    instructions_vi: "Đọc ba hồ sơ. Ai …?"
    items:
      - { id: q1, prompt: "Ai không thích nấu ăn lắm?", options: ["Lena", "Huy", "Sara"], answer: "Lena", explanation_vi: "Lena: “Ich koche nicht so gern.”" }
      - { id: q2, prompt: "Ai thích chơi bóng đá?", options: ["Lena", "Huy", "Sara"], answer: "Huy", explanation_vi: "Huy: “Ich spiele gern Fußball.”" }
      - { id: q3, prompt: "Ai đi xem phim với đồng nghiệp?", options: ["Lena", "Huy", "Sara"], answer: "Sara", explanation_vi: "Sara: “Meine Kollegin und ich gehen gern ins Kino.”" }
  - id: a1-k02-l01-ex08
    type: translation
    skill: grammar
    objectives: [o2, o3]
    difficulty: 2
    direction: vi-de
    instructions_vi: "Dịch sang tiếng Đức."
    items:
      - { id: q1, prompt: "Tôi thích du lịch.", answer: "Ich reise gern.", explanation_vi: "Thích = động từ + gern." }
      - { id: q2, prompt: "Bạn thích làm gì?", answer: "Was machst du gern?", accept: ["Was machen Sie gern?"], explanation_vi: "Thân mật: du; trang trọng: Sie." }
      - { id: q3, prompt: "Anh ấy không thích bơi.", answer: "Er schwimmt nicht gern.", explanation_vi: "nicht gern." }
  - id: a1-k02-l01-ex09
    type: speaking
    skill: speaking
    objectives: [o2, o4]
    difficulty: 1
    grading: self
    instructions_vi: "Ghi âm 4–5 câu về sở thích của bạn và của một người bạn (phần Nói)."
    rubric:
      - { criterion_vi: "Có ít nhất 3 hoạt động với 2 mức độ khác nhau", points: 2 }
      - { criterion_vi: "gern ở đúng vị trí, động từ chia đúng", points: 2 }
      - { criterion_vi: "Có một câu về người khác (er/sie)", points: 1 }
    items:
      - { id: q1, prompt: "Sở thích của tôi và bạn tôi.", model_answer: "Ich reise sehr gern. Ich koche auch gern. Ich schwimme nicht so gern. Meine Freundin Mai singt gern.", explanation_vi: "So sánh với mẫu ở phần Nói." }
  - id: a1-k02-l01-ex10
    type: writing
    skill: writing
    objectives: [o1, o2]
    difficulty: 1
    grading: self
    instructions_vi: "Viết hồ sơ sở thích của bạn (phần Viết)."
    rubric:
      - { criterion_vi: "Có tên, tuổi, thành phố và 3 sở thích", points: 2 }
      - { criterion_vi: "Dùng đúng gern / nicht (so) gern", points: 2 }
    items:
      - { id: q1, prompt: "Hồ sơ sở thích", model_answer: "Minh, 25, Hamburg: Ich koche sehr gern. Ich spiele gern Fußball. Ich tanze nicht so gern.", explanation_vi: "Tuổi viết bằng số là đủ." }
summary_vi: "Nói sở thích: ĐỘNG TỪ + gern (Ich koche gern). Mức độ: sehr gern, gern, nicht so gern, nicht gern. Hỏi: Was machst du gern? / Tanzt du gern? Môn thể thao không dùng mạo từ: Fußball spielen. Phản ứng: Ich auch! / Ich nicht."
self_check:
  - "Tôi gọi tên được ít nhất 10 hoạt động thời gian rảnh."
  - "Tôi nói được điều tôi thích và không thích với gern."
  - "Tôi hỏi được người khác thích làm gì."
  - "Tôi kể được sở thích của một người bạn."
