grammar:
  topics:
    - { topic: g-a1-bestimmter-artikel, focus_vi: "der/die/das; dấu hiệu -in, -ung, -tion; danh từ ghép theo từ cuối; ký hiệu m/f/n trong từ điển; mẹo dùng màu." }
  notes:
    - title_vi: "Nói nghề: không có mạo từ"
      explanation_vi: "Ich bin Arzt. / Sie ist Ärztin. – KHÔNG nói “Ich bin der Arzt” hay “Ich bin ein Arzt” khi chỉ nói nghề. Nơi làm việc: Ich arbeite bei + tên công ty (bei Siemens) hoặc im + nơi chốn (im Krankenhaus, im Restaurant – cụm cố định)."
      examples:
        - { de: "Ich bin Informatikerin. Ich arbeite bei Siemens.", vi: "Tôi là kỹ sư tin học. Tôi làm ở Siemens." }
        - { de: "Er ist Koch. Er arbeitet im Restaurant.", vi: "Anh ấy là đầu bếp. Anh ấy làm ở nhà hàng." }
    - title_vi: "es gibt = có"
      explanation_vi: "es gibt + danh từ = có (tồn tại). Đây là cụm cố định, rất thường dùng."
      examples:
        - { de: "Im Deutschen gibt es drei Artikel.", vi: "Trong tiếng Đức có ba mạo từ." }
redemittel:
  - id: a1-k02-l04-r01
    de: "Was sind Sie von Beruf? / Was machst du beruflich? – Ich bin …"
    vi: "Ông/Bà làm nghề gì? / Bạn làm nghề gì? – Tôi là …"
    context_vi: "Hỏi và trả lời về nghề nghiệp."
    register: neutral
    dialogue:
      - { speaker: "Frau Lang", de: "Was sind Sie von Beruf?", vi: "Anh làm nghề gì?" }
      - { speaker: "Herr Vo", de: "Ich bin Krankenpfleger.", vi: "Tôi là điều dưỡng." }
  - id: a1-k02-l04-r02
    de: "Ich arbeite bei … / im …"
    vi: "Tôi làm ở …"
    context_vi: "Nói nơi làm việc."
    register: neutral
    dialogue:
      - { speaker: "Lisa", de: "Wo arbeitest du?", vi: "Bạn làm ở đâu?" }
      - { speaker: "Minh", de: "Ich arbeite bei SAP. Ich bin Informatiker.", vi: "Mình làm ở SAP. Mình là kỹ sư tin học." }
  - id: a1-k02-l04-r03
    de: "Was ist das? – Das ist der/die/das …"
    vi: "Đây là cái gì? – Đây là …"
    context_vi: "Hỏi và gọi tên đồ vật kèm mạo từ."
    register: neutral
    dialogue:
      - { speaker: "Kind", de: "Was ist das?", vi: "Cái này là gì ạ?" }
      - { speaker: "Ärztin", de: "Das ist das Medikament. Und das ist die Tablette.", vi: "Đây là thuốc. Còn đây là viên thuốc." }
  - id: a1-k02-l04-r04
    de: "Welcher Artikel? – der / die / das."
    vi: "Mạo từ nào? – der / die / das."
    context_vi: "Hỏi mạo từ của một từ khi học."
    register: neutral
    dialogue:
      - { speaker: "Lan", de: "Schlüssel – welcher Artikel?", vi: "Schlüssel – mạo từ nào ạ?" }
      - { speaker: "Lehrer", de: "Der Schlüssel. Er ist blau!", vi: "Der Schlüssel. Nó màu xanh dương (theo mẹo màu)!" }
pronunciation:
  - id: a1-k02-l04-p01
    focus_vi: "Từ gốc Pháp: Friseur, Ingenieur, Journalist"
    explanation_vi: "Nhiều nghề mượn từ tiếng Pháp và đọc theo tiếng Pháp: eu = [øː] (Friseur [fʁiˈzøːɐ̯]), g/j = [ʒ] (Ingenieur [ɪnʒeˈni̯øːɐ̯], Journalist [ʒʊʁnaˈlɪst]). Trọng âm thường ở âm tiết cuối."
    examples:
      - { de: "der Friseur", vi: "thợ cắt tóc", ipa: "[fʁiˈzøːɐ̯]" }
      - { de: "der Ingenieur", vi: "kỹ sư", ipa: "[ɪnʒeˈni̯øːɐ̯]" }
    practice_vi: "Đọc to cặp nam/nữ: Friseur – Friseurin, Ingenieur – Ingenieurin."
  - id: a1-k02-l04-p02
    focus_vi: "Đuôi -in [ɪn] và -innen"
    explanation_vi: "Đuôi -in của dạng nữ đọc ngắn và nhẹ: LEH-re-rin. Số nhiều -innen: LEH-re-rin-nen. Trọng âm không đổi."
    examples:
      - { de: "die Lehrerin – die Lehrerinnen", vi: "cô giáo – các cô giáo", ipa: "[ˈleːʁəʁɪn] – [ˈleːʁəʁɪnən]" }
    practice_vi: "Nói dạng nữ của 5 nghề bất kỳ trong bài."
examples:
  - { de: "Was sind Sie von Beruf? – Ich bin Ärztin.", vi: "Bà làm nghề gì? – Tôi là bác sĩ." }
  - { de: "Der Kellner bringt die Rechnung.", vi: "Người bồi bàn mang hóa đơn tới." }
  - { de: "Der Taxifahrer sucht den Schlüssel.", vi: "Người tài xế taxi đang tìm chìa khóa.", note_vi: "den = der ở cách Akkusativ – học ở Kapitel 4." }
  - { de: "Das Medikament ist für den Patienten.", vi: "Thuốc này dành cho bệnh nhân." }
  - { de: "Die Rechnung – rot! Der Schlüssel – blau! Das Glas – grün!", vi: "Hóa đơn – đỏ! Chìa khóa – xanh dương! Cái ly – xanh lá! (mẹo màu)" }
  - { de: "Im Wörterbuch steht: Stift, der, -e.", vi: "Trong từ điển ghi: Stift, der, -e." }
skills:
  listening:
    - id: a1-k02-l04-listen-01
      title_vi: "Trò chơi: Tôi làm nghề gì?"
      situation_vi: "Ba người mô tả đồ vật của mình, bạn đoán nghề."
      audio: { status: pending-tts, speed: slow }
      script:
        - { speaker: "Person 1", de: "Das sind meine Dinge: das Glas, die Rechnung, der Stift. Ich arbeite im Restaurant. Was bin ich?", vi: "Đây là đồ của tôi: cái ly, hóa đơn, cây bút. Tôi làm ở nhà hàng. Tôi là ai?" }
        - { speaker: "Person 2", de: "Meine Dinge: das Auto, der Schlüssel, das Geld. Ich fahre viel. Was bin ich?", vi: "Đồ của tôi: ô tô, chìa khóa, tiền. Tôi lái xe nhiều. Tôi là ai?" }
        - { speaker: "Person 3", de: "Meine Dinge: das Medikament, die Tablette. Ich arbeite im Krankenhaus. Die Ärztin ist meine Kollegin. Was bin ich?", vi: "Đồ của tôi: thuốc, viên thuốc. Tôi làm ở bệnh viện. Bà bác sĩ là đồng nghiệp của tôi. Tôi là ai?" }
      exercises: [a1-k02-l04-ex05]
  reading:
    - id: a1-k02-l04-read-01
      title_vi: "Mẹo học mạo từ của Lan"
      text_type_vi: "Bài viết ngắn trên blog học tiếng"
      text_de: |
        Hallo! Ich bin Lan und ich lerne Deutsch. Artikel sind schwer!
        Mein Tipp: Ich lerne jedes Wort mit Artikel und Farbe.
        „der“ ist blau: der Stift, der Computer.
        „die“ ist rot: die Rechnung, die Tablette.
        „das“ ist grün: das Auto, das Glas.
        Und das Wörterbuch hilft: Da steht „Stift, der“ oder „Stift m.“.
      translation_vi: |
        Xin chào! Mình là Lan và mình đang học tiếng Đức. Mạo từ khó quá!
        Mẹo của mình: Mình học mỗi từ kèm mạo từ và màu.
        “der” màu xanh dương: der Stift, der Computer.
        “die” màu đỏ: die Rechnung, die Tablette.
        “das” màu xanh lá: das Auto, das Glas.
        Và từ điển giúp ích: ở đó ghi “Stift, der” hoặc “Stift m.”.
      glossary:
        - { de: "schwer", vi: "khó" }
        - { de: "der Tipp", vi: "mẹo" }
        - { de: "helfen (er hilft)", vi: "giúp" }
      exercises: [a1-k02-l04-ex06]
  speaking:
    - id: a1-k02-l04-speak-01
      title_vi: "Giới thiệu nghề của bạn (hoặc nghề mơ ước)"
      task_vi: "Nói 4 câu: bạn làm nghề gì (hoặc học gì), làm ở đâu, và 2 đồ vật bạn dùng (kèm mạo từ)."
      steps_vi:
        - "Ich bin … / Ich bin Student(in)."
        - "Ich arbeite bei … / im …"
        - "Meine Dinge: der/die/das …"
      model:
        - { speaker: "Huy", de: "Ich bin Koch. Ich arbeite im Restaurant. Meine Dinge: das Glas und der Stift. Und ich liebe Spaghetti!", vi: "Tôi là đầu bếp. Tôi làm ở nhà hàng. Đồ của tôi: cái ly và cây bút. Và tôi mê mì Ý!" }
      exercises: [a1-k02-l04-ex09]
  writing:
    - id: a1-k02-l04-write-01
      title_vi: "Thẻ học mạo từ"
      task_vi: "Viết 6 thẻ học: mạo từ + danh từ (+ số nhiều trong sổ từ), dùng màu theo mẹo: der = xanh dương, die = đỏ, das = xanh lá."
      model_de: "der Schlüssel · die Rechnung · das Medikament · der Computer · die Straße · das Glas"
      model_vi: "chìa khóa · hóa đơn · thuốc · máy tính · đường phố · cái ly"
      checklist_vi:
        - "Mỗi danh từ có mạo từ và viết hoa."
        - "Màu đúng với giống."
      exercises: [a1-k02-l04-ex10]
exercises:
  - id: a1-k02-l04-ex01
    type: matching
    skill: vocabulary
    objectives: [o2]
    difficulty: 1
    instructions_vi: "Nối dạng nam với dạng nữ."
    items:
      - id: q1
        pairs:
          - { left: "der Arzt", right: "die Ärztin" }
          - { left: "der Koch", right: "die Köchin" }
          - { left: "der Lehrer", right: "die Lehrerin" }
          - { left: "der Student", right: "die Studentin" }
          - { left: "der Verkäufer", right: "die Verkäuferin" }
        explanation_vi: "Dạng nữ: thêm -in; Arzt và Koch còn có biến âm (Ärztin, Köchin)."
  - id: a1-k02-l04-ex02
    type: gap-fill
    skill: grammar
    objectives: [o3, o4]
    difficulty: 2
    instructions_vi: "Điền der, die hoặc das."
    items:
      - { id: q1, prompt: "___ Rechnung", answer: ["die"], explanation_vi: "-ung → die." }
      - { id: q2, prompt: "___ Kellnerin", answer: ["die"], explanation_vi: "-in → die." }
      - { id: q3, prompt: "___ Medikament", answer: ["das"], explanation_vi: "das Medikament – học thuộc." }
      - { id: q4, prompt: "___ Schlüssel", answer: ["der"], explanation_vi: "der Schlüssel." }
      - { id: q5, prompt: "___ Wörterbuch (die Wörter + das Buch)", answer: ["das"], explanation_vi: "Theo từ cuối: das Buch." }
      - { id: q6, prompt: "___ Taxifahrer", answer: ["der"], explanation_vi: "Người nam / từ cuối der Fahrer." }
  - id: a1-k02-l04-ex03
    type: multiple-choice
    skill: vocabulary
    objectives: [o1, o3]
    difficulty: 1
    instructions_vi: "Đồ vật này thuộc về nghề nào?"
    items:
      - { id: q1, prompt: "das Medikament, die Tablette", options: ["Ärztin", "Kellner", "Taxifahrer"], answer: "Ärztin", explanation_vi: "Thuốc → bác sĩ." }
      - { id: q2, prompt: "das Glas, die Rechnung", options: ["Kellnerin", "Lehrer", "Mechaniker"], answer: "Kellnerin", explanation_vi: "Ly, hóa đơn → bồi bàn." }
      - { id: q3, prompt: "der Computer", options: ["Informatiker", "Koch", "Polizist"], answer: "Informatiker", explanation_vi: "Máy tính → kỹ sư tin học." }
  - id: a1-k02-l04-ex04
    type: true-false
    skill: grammar
    objectives: [o1, o4]
    difficulty: 2
    instructions_vi: "Đúng hay sai?"
    items:
      - { id: q1, prompt: "„Ich bin Lehrerin.“ đúng (không cần mạo từ).", answer: true, explanation_vi: "Nói nghề không dùng mạo từ." }
      - { id: q2, prompt: "Trong từ điển, „f.“ nghĩa là giống đực.", answer: false, explanation_vi: "f. = feminin = giống cái (die)." }
      - { id: q3, prompt: "Danh từ đuôi -ung luôn là „die“.", answer: true, explanation_vi: "die Rechnung, die Wohnung…" }
  - id: a1-k02-l04-ex05
    type: multiple-choice
    skill: listening
    objectives: [o1, o3]
    difficulty: 1
    stimulus: a1-k02-l04-listen-01
    instructions_vi: "Nghe trò chơi đoán nghề. Mỗi người làm nghề gì?"
    items:
      - { id: q1, prompt: "Person 1", options: ["Kellner/in", "Arzt/Ärztin", "Lehrer/in"], answer: "Kellner/in", explanation_vi: "Ly, hóa đơn, làm ở nhà hàng." }
      - { id: q2, prompt: "Person 2", options: ["Koch/Köchin", "Taxifahrer/in", "Student/in"], answer: "Taxifahrer/in", explanation_vi: "Ô tô, chìa khóa, tiền, lái xe nhiều." }
      - { id: q3, prompt: "Person 3", options: ["Arzt", "Krankenpfleger/in", "Verkäufer/in"], answer: "Krankenpfleger/in", explanation_vi: "Thuốc, làm ở bệnh viện, và bác sĩ là đồng nghiệp → điều dưỡng." }
  - id: a1-k02-l04-ex06
    type: true-false
    skill: reading
    objectives: [o4]
    difficulty: 1
    stimulus: a1-k02-l04-read-01
    instructions_vi: "Đọc blog của Lan. Đúng hay sai?"
    items:
      - { id: q1, prompt: "Theo mẹo của Lan, „die“ có màu đỏ.", answer: true, explanation_vi: "„die“ ist rot." }
      - { id: q2, prompt: "„das Auto“ có màu xanh dương.", answer: false, explanation_vi: "das = xanh lá (grün)." }
      - { id: q3, prompt: "Lan học từ không kèm mạo từ.", answer: false, explanation_vi: "„Ich lerne jedes Wort mit Artikel und Farbe.“" }
  - id: a1-k02-l04-ex07
    type: sentence-building
    skill: grammar
    objectives: [o1, o2]
    difficulty: 2
    instructions_vi: "Viết câu nói nghề (chú ý dạng nam/nữ, không mạo từ)."
    items:
      - { id: q1, prompt: "Mai / sein / Ärztin", answer: "Mai ist Ärztin.", explanation_vi: "Không mạo từ." }
      - { id: q2, prompt: "Herr Kaya / sein / Taxifahrer", answer: "Herr Kaya ist Taxifahrer.", explanation_vi: "Herr → dạng nam." }
      - { id: q3, prompt: "ich / arbeiten / bei Siemens", answer: "Ich arbeite bei Siemens.", explanation_vi: "arbeiten bei + tên công ty." }
  - id: a1-k02-l04-ex08
