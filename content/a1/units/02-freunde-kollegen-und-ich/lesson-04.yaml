    difficulty: 2
    direction: vi-de
    instructions_vi: "Dịch sang tiếng Đức."
    items:
      - { id: q1, prompt: "Ông làm nghề gì?", answer: "Was sind Sie von Beruf?", explanation_vi: "Câu hỏi nghề trang trọng." }
      - { id: q2, prompt: "Cô ấy là y tá.", answer: "Sie ist Krankenpflegerin.", explanation_vi: "Dạng nữ, không mạo từ." }
      - { id: q3, prompt: "Hóa đơn ở đây.", answer: "Die Rechnung ist hier.", explanation_vi: "die Rechnung." }
  - id: a1-k02-l04-ex09
    type: speaking
    skill: speaking
    objectives: [o1, o3]
    difficulty: 1
    grading: self
    instructions_vi: "Ghi âm phần giới thiệu nghề (phần Nói)."
    rubric:
      - { criterion_vi: "Nói đúng nghề (dạng nam/nữ, không mạo từ) và nơi làm việc", points: 2 }
      - { criterion_vi: "Nói 2 đồ vật với mạo từ đúng", points: 2 }
    items:
      - { id: q1, prompt: "Nghề của bạn và đồ vật bạn dùng.", model_answer: "Ich bin Koch. Ich arbeite im Restaurant. Meine Dinge: das Glas und der Stift.", explanation_vi: "Sinh viên có thể nói: Ich bin Student. Meine Dinge: der Computer und das Buch." }
  - id: a1-k02-l04-ex10
    type: writing
    skill: writing
    objectives: [o3, o4]
    difficulty: 1
    grading: self
    instructions_vi: "Viết 6 thẻ học mạo từ có màu (phần Viết)."
    rubric:
      - { criterion_vi: "6 danh từ với mạo từ đúng", points: 3 }
