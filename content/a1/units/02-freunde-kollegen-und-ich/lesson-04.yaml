id: a1-k02-l04
kind: lesson
level: A1
unit: a1-k02
order: 4
title_de: "Mein Beruf – Artikel lernen"
title_vi: "Nghề nghiệp, đồ vật và mạo từ der/die/das"
topic_vi: "Nghề nghiệp (nam/nữ), đồ vật của nghề, mạo từ xác định và chiến lược học mạo từ"
source:
  type: netzwerk-neu
  kapitel: 2
  sections: ["Mein Beruf", "Strategie: Artikel lernen"]
  note_vi: "Sprachhandlungen: Objekte zu den Berufen zuordnen; Artikel markieren; mit dem Wörterbuch / einem Artikelbild arbeiten. Grammatik: Definitartikel, Artikel. Wortschatz: Berufe. Phần số và haben/sein của mục „Mein Beruf“ ở bài 5."
cefr: [A1.SI2, A1.SP1, A1.L1, A1.H1]
objectives:
  - { id: o1, vi: "Hỏi và nói về nghề nghiệp: Was sind Sie von Beruf? – Ich bin … / Ich arbeite bei …" }
  - { id: o2, vi: "Dùng dạng nam và nữ của nghề nghiệp (-in)." }
  - { id: o3, vi: "Dùng đúng mạo từ der/die/das với đồ vật và người." }
  - { id: o4, vi: "Áp dụng chiến lược học mạo từ: dấu hiệu đuôi từ, danh từ ghép, màu, từ điển." }
estimated_minutes: 90
prerequisites: [a1-k02-l03]
intro_vi: |
  Hai phần trong bài này:

  **1. Nghề nghiệp.** Hầu hết nghề có dạng **nam** và **nữ**: *der Lehrer – die Lehrer**in***.
  Khi nói “tôi là …”, tiếng Đức **không dùng mạo từ**: *Ich bin Lehrerin.* (không nói “Ich bin die Lehrerin”).

  **2. Mạo từ der/die/das.** Mỗi nghề có những **đồ vật** đặc trưng: bác sĩ có *das Medikament*, người bồi bàn có *die Rechnung*,
  tài xế taxi có *der Schlüssel*… Bạn học đồ vật **kèm mạo từ** và học **mẹo đoán mạo từ** (xem chủ điểm *Mạo từ xác định và cách học mạo từ*).

  Bài này có nhiều từ mới (khoảng 60), nhưng phần lớn là cặp nam/nữ – thực chất chỉ khoảng 35 từ gốc. Hãy chia làm 2 buổi nếu cần.
