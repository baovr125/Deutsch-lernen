id: a1-k02-l05
kind: lesson
level: A1
unit: a1-k02
order: 5
title_de: "Mein Arbeitstag – haben, sein und Zahlen ab 20"
title_vi: "Công việc của tôi: haben, sein, số nhiều và số từ 20"
topic_vi: "Văn bản ngắn về nghề nghiệp; tuổi; thời gian làm việc; số đếm lớn; số nhiều"
source:
  type: netzwerk-neu
  kapitel: 2
  sections: ["Mein Beruf"]
  note_vi: "Phần thứ hai của mục „Mein Beruf“: Texte verstehen und ergänzen; Zahlen ab 20 hören und nachsprechen; Informationen sammeln und präsentieren; Pluralformen erkennen und Lernkarten schreiben; Partnerarbeit; einen Ich-Text schreiben. Grammatik: Plural, Verben haben und sein. Wortschatz: Zahlen ab 20. Aussprache: Zahlen ab 20."
cefr: [A1.SP2, A1.H3, A1.L1, A1.S2, A1.SI2]
objectives:
  - { id: o1, vi: "Chia và dùng haben và sein; nói tuổi bằng sein." }
  - { id: o2, vi: "Nghe, đọc và nói các số từ 20 đến 1 triệu." }
  - { id: o3, vi: "Nhận biết và tạo dạng số nhiều của danh từ đã học." }
  - { id: o4, vi: "Hiểu văn bản ngắn về công việc (giờ làm, ngày nghỉ, số liệu) và viết một đoạn giới thiệu nghề nghiệp của mình." }
estimated_minutes: 90
prerequisites: [a1-k02-l04]
intro_vi: |
  Trong bài này, ba người kể về công việc của họ: **bao nhiêu tuổi**, **làm bao nhiêu giờ mỗi tuần**,
  **nghỉ ngày nào**, **chạy bao nhiêu km**… Để hiểu và kể như vậy, bạn cần ba công cụ:

  1. **haben và sein** – hai động từ quan trọng nhất (chủ điểm *haben và sein*). Chú ý: nói tuổi dùng **sein**: *Ich bin 22.*
  2. **Số từ 20** – tiếng Đức đọc **hàng đơn vị trước, hàng chục sau**: 21 = *ein**und**zwanzig* (“một-và-hai mươi”).
  3. **Số nhiều** – *der Patient → die Patient**en***, *das Jahr → die Jahr**e*** (chủ điểm *Số nhiều của danh từ*).
