grammar:
  topics:
    - { topic: g-a1-haben-sein, focus_vi: "Bảng chia haben/sein; tuổi dùng sein; haben + danh từ; frei|haben." }
    - { topic: g-a1-plural, focus_vi: "Năm cách tạo số nhiều; sau số đếm dùng số nhiều; viết thẻ học có số nhiều." }
  notes:
    - title_vi: "Số từ 21 đến 99: đơn vị + und + chục"
      explanation_vi: |
        Tiếng Việt: hai mươi mốt (chục trước). Tiếng Đức: **ein-und-zwanzig** (đơn vị + und + chục), viết liền thành MỘT từ.
        21 einundzwanzig · 22 zweiundzwanzig · 35 fünfunddreißig · 47 siebenundvierzig · 99 neunundneunzig.
        Chú ý: 21 là ein**und**zwanzig (không phải „einsundzwanzig“). Hàng chục: zwanzig, dreißig (ß!), vierzig, fünfzig, sechzig, siebzig, achtzig, neunzig.
        Số lớn: 100 (ein)hundert, 125 hundertfünfundzwanzig, 1000 (ein)tausend, 2500 zweitausendfünfhundert, 1.000.000 eine Million.
        Người Đức viết dấu chấm ngăn hàng nghìn: 1.250 = một nghìn hai trăm năm mươi (giống Việt Nam).
      examples:
        - { de: "24 = vierundzwanzig", vi: "hai mươi tư (nghĩa đen: bốn và hai mươi)" }
        - { de: "68 = achtundsechzig", vi: "sáu mươi tám" }
        - { de: "1.250 = tausendzweihundertfünfzig", vi: "một nghìn hai trăm năm mươi" }
    - title_vi: "Wie alt bist du? – Ich bin … (Jahre alt)."
      explanation_vi: "Hỏi tuổi: Wie alt bist du? / Wie alt sind Sie? Trả lời: Ich bin 25. hoặc Ich bin 25 Jahre alt. KHÔNG dùng haben."
      examples:
        - { de: "Wie alt sind Sie? – Ich bin 42 Jahre alt.", vi: "Ông bao nhiêu tuổi? – Tôi 42 tuổi." }
redemittel:
  - id: a1-k02-l05-r01
    de: "Wie alt bist du / sind Sie? – Ich bin …"
    vi: "Bạn / Ông bà bao nhiêu tuổi? – Tôi … tuổi."
    context_vi: "Hỏi và nói tuổi (ở Đức hỏi tuổi người lạ có thể bị coi là tò mò – hãy dùng trong tình huống phù hợp)."
    register: neutral
    dialogue:
      - { speaker: "Lisa", de: "Wie alt bist du?", vi: "Bạn bao nhiêu tuổi?" }
      - { speaker: "Minh", de: "Ich bin 24. Und du?", vi: "Mình 24. Còn bạn?" }
      - { speaker: "Lisa", de: "Ich bin 23.", vi: "Mình 23." }
  - id: a1-k02-l05-r02
    de: "Ich arbeite von … bis … / … Stunden pro Woche."
    vi: "Tôi làm việc từ … đến … / … giờ mỗi tuần."
    context_vi: "Nói thời gian làm việc."
    register: neutral
    dialogue:
      - { speaker: "Reporterin", de: "Wie viel arbeiten Sie?", vi: "Chị làm việc bao nhiêu?" }
      - { speaker: "Hoa", de: "Ich arbeite von Montag bis Freitag, 38 Stunden pro Woche.", vi: "Tôi làm từ thứ Hai đến thứ Sáu, 38 giờ mỗi tuần." }
  - id: a1-k02-l05-r03
    de: "Am … habe ich frei."
    vi: "Thứ … tôi được nghỉ."
    context_vi: "Nói ngày nghỉ."
    register: neutral
    dialogue:
      - { speaker: "Tom", de: "Wann hast du frei?", vi: "Khi nào bạn được nghỉ?" }
      - { speaker: "Huy", de: "Am Montag und am Dienstag habe ich frei.", vi: "Thứ Hai và thứ Ba mình được nghỉ." }
pronunciation:
  - id: a1-k02-l05-p01
    focus_vi: "Số từ 20: trọng âm và đuôi -zig"
    explanation_vi: "Trong số ghép, trọng âm rơi vào phần ĐƠN VỊ: EIN-und-zwan-zig, FÜNF-und-drei-ßig. Đuôi -zig đọc [tsɪç]; dreißig [ˈdʁaɪ̯sɪç] không có [ts]."
    examples:
      - { de: "einundzwanzig", vi: "21", ipa: "[ˈaɪ̯nʊntˌtsvantsɪç]" }
      - { de: "dreißig", vi: "30", ipa: "[ˈdʁaɪ̯sɪç]" }
      - { de: "hundert", vi: "100", ipa: "[ˈhʊndɐt]" }
    practice_vi: "Đếm theo hàng chục 20 → 100; rồi đọc năm sinh và số nhà của bạn."
examples:
  - { de: "Ich bin 22 Jahre alt und studiere Informatik.", vi: "Tôi 22 tuổi và học ngành tin học." }
  - { de: "Er hat am Wochenende frei.", vi: "Cuối tuần anh ấy được nghỉ." }
  - { de: "Das Krankenhaus ist groß: Es hat Platz für 600 Patienten.", vi: "Bệnh viện lớn: có chỗ cho 600 bệnh nhân." }
  - { de: "Ich fahre 300 Kilometer pro Tag.", vi: "Mỗi ngày tôi lái 300 km." }
  - { de: "Die Patienten warten nicht gern.", vi: "Bệnh nhân không thích phải chờ." }
  - { de: "Ich arbeite viel, aber ich habe am Montag frei.", vi: "Tôi làm việc nhiều, nhưng thứ Hai tôi được nghỉ." }
skills:
  listening:
    - id: a1-k02-l05-listen-01
      title_vi: "Phỏng vấn trên radio: Nghề của tôi"
      situation_vi: "Một chương trình radio phỏng vấn hai người về công việc."
      audio: { status: pending-tts, speed: slow }
      script:
        - { speaker: "Reporterin", de: "Herr Kaya, was sind Sie von Beruf?", vi: "Ông Kaya, ông làm nghề gì?" }
        - { speaker: "Herr Kaya", de: "Ich bin Taxifahrer in Hamburg. Ich bin 46 Jahre alt.", vi: "Tôi là tài xế taxi ở Hamburg. Tôi 46 tuổi." }
        - { speaker: "Reporterin", de: "Fahren Sie viel?", vi: "Ông có lái xe nhiều không?" }
        - { speaker: "Herr Kaya", de: "Ja! Ich fahre 250 Kilometer pro Tag. Ich arbeite meistens nachts. Am Sonntag habe ich frei.", vi: "Có! Tôi lái 250 km mỗi ngày. Tôi thường làm ban đêm. Chủ nhật tôi được nghỉ." }
        - { speaker: "Reporterin", de: "Und Sie, Frau Tran?", vi: "Còn chị, chị Trần?" }
        - { speaker: "Frau Tran", de: "Ich bin Krankenpflegerin. Ich bin 31 und arbeite im Krankenhaus. Das Krankenhaus ist sehr groß – es hat 800 Zimmer. Ich arbeite 38 Stunden pro Woche.", vi: "Tôi là điều dưỡng. Tôi 31 tuổi và làm ở bệnh viện. Bệnh viện rất lớn – có 800 phòng. Tôi làm 38 giờ mỗi tuần." }
      exercises: [a1-k02-l05-ex04, a1-k02-l05-ex05]
  reading:
    - id: a1-k02-l05-read-01
      title_vi: "Ba người, ba nghề"
      text_type_vi: "Đoạn văn ngắn tự giới thiệu nghề"
      text_de: |
        Ich heiße Mai und bin 22 Jahre alt. Ich bin Studentin. Ich studiere Medizin an der Universität Leipzig. Ich habe 24 Stunden Seminare pro Woche. Am Wochenende arbeite ich im Café.

        Mein Name ist Jonas. Ich bin 35 und Lehrer. Ich habe 28 Schüler. Ich arbeite von Montag bis Freitag, aber am Nachmittag habe ich meistens frei.

        Ich bin Frau Weber und ich bin Köchin. Ich arbeite im Restaurant „Lindenhof“. Wir kochen jeden Tag für 120 Gäste. Am Montag und am Dienstag habe ich frei.
      translation_vi: |
        Mình tên là Mai và 22 tuổi. Mình là sinh viên. Mình học y ở Đại học Leipzig. Mỗi tuần mình có 24 giờ seminar. Cuối tuần mình làm ở quán cà phê.

        Tôi tên là Jonas. Tôi 35 tuổi và là giáo viên. Tôi có 28 học sinh. Tôi làm từ thứ Hai đến thứ Sáu, nhưng buổi chiều tôi thường được nghỉ.

        Tôi là bà Weber và tôi là đầu bếp. Tôi làm ở nhà hàng “Lindenhof”. Chúng tôi nấu ăn mỗi ngày cho 120 khách. Thứ Hai và thứ Ba tôi được nghỉ.
      glossary:
        - { de: "die Medizin", vi: "y khoa" }
        - { de: "das Seminar, die Seminare", vi: "buổi seminar (thảo luận ở đại học)" }
        - { de: "der Schüler, die Schüler", vi: "học sinh" }
        - { de: "der Gast, die Gäste", vi: "khách" }
      exercises: [a1-k02-l05-ex06]
  speaking:
    - id: a1-k02-l05-speak-01
      title_vi: "Phỏng vấn về công việc"
      task_vi: "Trả lời 5 câu hỏi về bạn (hoặc một nhân vật tưởng tượng): Was sind Sie von Beruf? Wie alt sind Sie? Wo arbeiten Sie? Wie viele Stunden arbeiten Sie pro Woche? Wann haben Sie frei?"
      steps_vi:
        - "Chuẩn bị số liệu (tuổi, số giờ, ngày nghỉ)."
        - "Trả lời bằng câu đầy đủ, dùng sein cho tuổi và haben cho ngày nghỉ."
      model:
        - { speaker: "Lan", de: "Ich bin Verkäuferin. Ich bin 29 Jahre alt. Ich arbeite bei Rewe. Ich arbeite 30 Stunden pro Woche. Am Sonntag habe ich frei.", vi: "Tôi là nhân viên bán hàng. Tôi 29 tuổi. Tôi làm ở Rewe. Tôi làm 30 giờ mỗi tuần. Chủ nhật tôi được nghỉ." }
      exercises: [a1-k02-l05-ex09]
  writing:
    - id: a1-k02-l05-write-01
      title_vi: "Đoạn văn: Nghề của tôi"
      task_vi: "Viết 5–6 câu về nghề (hoặc việc học) của bạn: tên, tuổi, nghề, nơi làm/học, thời gian làm việc, ngày nghỉ."
      model_de: "Ich heiße Minh und bin 26 Jahre alt. Ich bin Informatiker. Ich arbeite bei einer Firma in Hamburg. Ich arbeite 40 Stunden pro Woche, von Montag bis Freitag. Am Wochenende habe ich frei."
      model_vi: "Tôi tên là Minh, 26 tuổi. Tôi là kỹ sư tin học. Tôi làm ở một công ty tại Hamburg. Tôi làm 40 giờ mỗi tuần, từ thứ Hai đến thứ Sáu. Cuối tuần tôi được nghỉ."
      checklist_vi:
        - "Tuổi dùng sein (Ich bin …)."
        - "Nghề không có mạo từ."
        - "Có ít nhất một số lớn hơn 20 viết bằng số."
        - "frei|haben: frei đứng cuối câu."
      exercises: [a1-k02-l05-ex10]
