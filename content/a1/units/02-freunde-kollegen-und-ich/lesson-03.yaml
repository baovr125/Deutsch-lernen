id: a1-k02-l03
kind: lesson
level: A1
unit: a1-k02
order: 3
title_de: "Gehen wir ins Kino?"
title_vi: "Mình đi xem phim nhé? – Hẹn đi chơi"
topic_vi: "Ngày trong tuần, địa điểm giải trí, câu hỏi có/không, hẹn và từ chối lịch sự"
source:
  type: netzwerk-neu
  kapitel: 2
  sections: ["Gehen wir ins Kino?"]
  note_vi: "Sprachhandlungen: Gespräch verstehen; Wochentage vergleichen; Fragen und Antworten mit richtiger Satzmelodie; Dialoge spielen. Grammatik: Ja/Nein-Frage. Wortschatz: Wochentage, Orte. Aussprache: Satzmelodie."
cefr: [A1.SI5, A1.H3, A1.H4, A1.L2, A1.S3, A1.SP3]
objectives:
  - { id: o1, vi: "Nói và hiểu bảy ngày trong tuần, dùng am + ngày." }
  - { id: o2, vi: "Đặt câu hỏi có/không với động từ ở đầu câu và ngữ điệu lên giọng; trả lời ja/nein." }
  - { id: o3, vi: "Rủ đi chơi và trả lời: Gehen wir …? – Ja, gern! / Das geht leider nicht." }
  - { id: o4, vi: "Gọi tên các địa điểm giải trí với ins: ins Kino, ins Café, ins Museum, ins Theater, ins Schwimmbad, ins Restaurant." }
estimated_minutes: 75
prerequisites: [a1-k02-l02]
intro_vi: |
  Bạn đã biết nói sở thích. Bây giờ hãy **rủ bạn bè đi chơi**!

  Bài này có ba công cụ:
  1. **Bảy ngày trong tuần** – tất cả đều là giống đực (*der Montag…*) và “vào thứ …” là **am**: *am Montag*.
  2. **Câu hỏi có/không** – đưa động từ lên đầu câu và **lên giọng** ở cuối: *Gehen wir ins Kino?* ↗ (chủ điểm *Câu hỏi có/không*).
  3. **Địa điểm**: *ins Kino, ins Café, ins Museum…* – tất cả là danh từ giống trung, nên đều dùng **ins**.

  Và một câu rất lịch sự khi phải từ chối: *Das geht leider nicht.* – Tiếc là không được.
vocabulary:
  file: vocabulary/02-freunde-kollegen-und-ich.csv
  new: [a1-k02-v042, a1-k02-v043, a1-k02-v044, a1-k02-v045, a1-k02-v046, a1-k02-v047, a1-k02-v048, a1-k02-v049, a1-k02-v050, a1-k02-v051, a1-k02-v052, a1-k02-v053, a1-k02-v054, a1-k02-v055, a1-k02-v056, a1-k02-v057, a1-k02-v058, a1-k02-v059, a1-k02-v060, a1-k02-v061]
  review: [a1-k02-v011, a1-k02-v012, a1-k02-v029, a1-k02-v033, a1-k02-v037, a1-k01-v037, a1-k01-v057]
grammar:
  topics:
    - { topic: g-a1-ja-nein-frage, focus_vi: "Động từ ở vị trí 1, lên giọng; rủ rê với Gehen wir …?" }
  notes:
    - title_vi: "ins + địa điểm (giống trung)"
      explanation_vi: "ins = in + das. Các địa điểm trong bài đều là das, nên: ins Kino, ins Café, ins Museum, ins Theater, ins Restaurant, ins Schwimmbad. Với địa điểm giống đực/cái, dạng khác (in den Park, in die Bibliothek) – học ở Kapitel 9. Bây giờ học như cụm cố định."
      examples:
        - { de: "Ich gehe ins Kino.", vi: "Tôi đi xem phim." }
        - { de: "Gehen wir ins Museum?", vi: "Chúng ta đi bảo tàng nhé?" }
    - title_vi: "am + ngày trong tuần"
      explanation_vi: "Vào thứ mấy → am + ngày: am Montag, am Freitag, am Wochenende. Hỏi: Wann? (khi nào?)."
      examples:
        - { de: "Wann gehen wir ins Café? – Am Freitag.", vi: "Khi nào mình đi cà phê? – Thứ Sáu." }
redemittel:
  - id: a1-k02-l03-r01
    de: "Gehen wir am … ins …?"
    vi: "Thứ … mình đi … nhé?"
    context_vi: "Rủ một người bạn đi chơi."
    register: informal
    dialogue:
      - { speaker: "Lisa", de: "Gehen wir am Freitag ins Kino?", vi: "Thứ Sáu mình đi xem phim nhé?" }
      - { speaker: "Minh", de: "Ja, gern!", vi: "Ừ, thích lắm!" }
  - id: a1-k02-l03-r02
    de: "Das geht leider nicht. Am … arbeite ich."
    vi: "Tiếc là không được. Thứ … mình phải làm."
    context_vi: "Từ chối lịch sự và nêu lý do."
    register: neutral
    dialogue:
      - { speaker: "Paul", de: "Gehen wir am Montag ins Schwimmbad?", vi: "Thứ Hai đi bơi nhé?" }
      - { speaker: "Mai", de: "Das geht leider nicht. Am Montag arbeite ich. Am Dienstag?", vi: "Tiếc là không được. Thứ Hai mình làm việc. Thứ Ba nhé?" }
      - { speaker: "Paul", de: "Ja, das geht!", vi: "Ừ, được!" }
  - id: a1-k02-l03-r03
    de: "Wann? – Am …"
    vi: "Khi nào? – Vào thứ …"
    context_vi: "Hỏi và trả lời về ngày."
    register: neutral
    dialogue:
      - { speaker: "Anna", de: "Wann gehen wir ins Theater?", vi: "Khi nào mình đi nhà hát?" }
      - { speaker: "Tom", de: "Am Samstag.", vi: "Thứ Bảy." }
  - id: a1-k02-l03-r04
    de: "Gute Idee! / Super!"
    vi: "Ý hay đấy! / Tuyệt!"
    context_vi: "Nhận lời một cách vui vẻ."
    register: informal
    dialogue:
      - { speaker: "Huy", de: "Gehen wir ins Restaurant?", vi: "Mình đi nhà hàng nhé?" }
      - { speaker: "Lan", de: "Gute Idee!", vi: "Ý hay đấy!" }
pronunciation:
  - id: a1-k02-l03-p01
    focus_vi: "Ngữ điệu câu hỏi và câu trả lời"
    explanation_vi: "Câu hỏi có/không → lên giọng: Gehen wir ins Kino? ↗. Câu trả lời → xuống giọng: Ja, gern. ↘ / Das geht leider nicht. ↘. Câu hỏi W- → xuống giọng: Wann gehen wir? ↘"
    examples:
      - { de: "Gehen wir ins Kino? ↗", vi: "Mình đi xem phim nhé?" }
      - { de: "Ja, gern. ↘", vi: "Ừ, thích." }
      - { de: "Wann? ↘ – Am Freitag. ↘", vi: "Khi nào? – Thứ Sáu." }
    practice_vi: "Đọc hội thoại mẫu theo cặp, đánh dấu ↗ ↘ trước khi đọc."
  - id: a1-k02-l03-p02
    focus_vi: "Ngày trong tuần: trọng âm ở đầu"
    explanation_vi: "MON-tag, DIENS-tag, MITT-woch, DON-ners-tag, FREI-tag, SAMS-tag, SONN-tag. g cuối đọc [k]."
    examples:
      - { de: "Montag", vi: "thứ Hai", ipa: "[ˈmoːnˌtaːk]" }
      - { de: "Mittwoch", vi: "thứ Tư", ipa: "[ˈmɪtvɔx]" }
    practice_vi: "Đọc bảy ngày theo thứ tự, rồi ngược lại."
examples:
  - { de: "Gehen wir ins Café?", vi: "Mình đi cà phê nhé?" }
  - { de: "Am Montag arbeite ich, aber am Dienstag geht es.", vi: "Thứ Hai tôi làm việc, nhưng thứ Ba thì được." }
  - { de: "Gehst du oft ins Theater? – Nein, nicht oft.", vi: "Bạn có hay đi nhà hát không? – Không, không hay lắm." }
  - { de: "Jede Woche gehe ich ins Schwimmbad.", vi: "Tuần nào tôi cũng đi bơi." }
  - { de: "Am Donnerstag habe ich einen Termin.", vi: "Thứ Năm tôi có một cuộc hẹn.", note_vi: "habe … einen Termin: học kỹ ở bài 5 và Kapitel 4." }
skills:
  listening:
    - id: a1-k02-l03-listen-01
      title_vi: "Hẹn đi xem phim"
      situation_vi: "Lisa gọi điện rủ Minh đi chơi."
      audio: { status: pending-tts, speed: slow }
      script:
        - { speaker: "Lisa", de: "Hallo, Minh! Gehen wir am Montag ins Kino?", vi: "Chào Minh! Thứ Hai mình đi xem phim nhé?" }
        - { speaker: "Minh", de: "Am Montag? Das geht leider nicht. Am Montag arbeite ich.", vi: "Thứ Hai à? Tiếc là không được. Thứ Hai mình làm việc." }
        - { speaker: "Lisa", de: "Und am Mittwoch?", vi: "Thế thứ Tư?" }
        - { speaker: "Minh", de: "Am Mittwoch spiele ich Fußball. Aber am Donnerstag geht es!", vi: "Thứ Tư mình chơi bóng đá. Nhưng thứ Năm thì được!" }
        - { speaker: "Lisa", de: "Donnerstag? Super! Gehen wir dann auch ins Café?", vi: "Thứ Năm à? Tuyệt! Thế mình đi cà phê luôn nhé?" }
        - { speaker: "Minh", de: "Ja, gern! Bis Donnerstag!", vi: "Ừ, thích lắm! Hẹn thứ Năm nhé!" }
      exercises: [a1-k02-l03-ex04, a1-k02-l03-ex05]
  reading:
    - id: a1-k02-l03-read-01
      title_vi: "Nhóm chat: đi đâu cuối tuần?"
      text_type_vi: "Tin nhắn nhóm"
      text_de: |
        Anna: Gehen wir am Samstag ins Museum? 🖼️
        Tom: Samstag geht leider nicht. Ich arbeite. Sonntag?
        Huy: Am Sonntag schwimme ich. Aber am Samstag geht es!
        Anna: Okay: Huy und ich gehen am Samstag ins Museum. Tom, gehen wir am Sonntag ins Café?
        Tom: Ja, gern! ☕
      translation_vi: |
        Anna: Thứ Bảy mình đi bảo tàng nhé? 🖼️
        Tom: Tiếc là thứ Bảy không được. Mình làm việc. Chủ nhật nhé?
        Huy: Chủ nhật mình đi bơi. Nhưng thứ Bảy thì được!
        Anna: Ok: Huy và mình đi bảo tàng thứ Bảy. Tom, Chủ nhật mình đi cà phê nhé?
        Tom: Ừ, thích lắm! ☕
      exercises: [a1-k02-l03-ex06]
  speaking:
    - id: a1-k02-l03-speak-01
      title_vi: "Đóng vai: tìm ngày rảnh"
      task_vi: "Bạn có lịch tuần (Mo: arbeiten, Di: Deutschkurs, Mi: frei, Do: arbeiten, Fr: frei). Rủ bạn đi chơi và cùng tìm một ngày cả hai đều rảnh."
      steps_vi:
        - "Rủ: Gehen wir am … ins …?"
        - "Nếu bận: Das geht leider nicht. Am … arbeite ich. Am …?"
        - "Khi tìm được ngày: Ja, das geht! / Super!"
      model:
        - { speaker: "A", de: "Gehen wir am Dienstag ins Theater?", vi: "Thứ Ba đi nhà hát nhé?" }
        - { speaker: "B", de: "Das geht leider nicht. Am Dienstag habe ich Deutschkurs. Am Mittwoch?", vi: "Tiếc là không được. Thứ Ba mình có lớp tiếng Đức. Thứ Tư nhé?" }
        - { speaker: "A", de: "Ja, am Mittwoch geht es. Super!", vi: "Ừ, thứ Tư được. Tuyệt!" }
      exercises: [a1-k02-l03-ex09]
  writing:
    - id: a1-k02-l03-write-01
      title_vi: "Tin nhắn rủ đi chơi"
      task_vi: "Viết tin nhắn (3 câu) rủ một người bạn đi chơi: chào, rủ đi đâu và ngày nào, hỏi bạn có đi được không."
      model_de: "Hallo Tom! Gehen wir am Freitag ins Restaurant? Geht das?"
      model_vi: "Chào Tom! Thứ Sáu mình đi nhà hàng nhé? Được không?"
      checklist_vi:
        - "Có am + ngày và ins + địa điểm."
        - "Câu hỏi có/không: động từ đầu câu, có dấu ?"
      exercises: [a1-k02-l03-ex10]
