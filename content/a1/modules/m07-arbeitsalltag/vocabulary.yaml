entries:
  # ---- Danh từ ----
  - { id: a1.m07.v.arbeitstag, de: "Arbeitstag", pos: noun, article: der, plural: "Arbeitstage", vi: "ngày làm việc", ipa: "/ˈaʁbaɪtsˌtaːk/", example: { de: "Mein Arbeitstag beginnt um acht Uhr.", vi: "Ngày làm việc của tôi bắt đầu lúc tám giờ." }, usage_vi: "Từ ghép: Arbeit + Tag, Artikel theo từ cuối (der Tag).", lesson_refs: [a1.m07.l01] }
  - { id: a1.m07.v.arbeit, de: "Arbeit", pos: noun, article: die, no_plural: true, vi: "công việc, việc làm", ipa: "/ˈaʁbaɪt/", example: { de: "Die Arbeit macht mir Spaß.", vi: "Công việc làm tôi thấy vui." }, usage_vi: "Nói chung là không đếm được. „bei der Arbeit“ = đang làm việc; „zur Arbeit gehen“ = đi làm.", lesson_refs: [a1.m07.l01] }
  - { id: a1.m07.v.buero, de: "Büro", pos: noun, article: das, plural: "Büros", vi: "văn phòng", ipa: "/byˈʁoː/", example: { de: "Das Büro ist im ersten Stock.", vi: "Văn phòng ở tầng một (tầng trên tầng trệt)." }, usage_vi: "„im Büro“ = ở văn phòng (in + dem).", lesson_refs: [a1.m07.l01] }
  - { id: a1.m07.v.chef, de: "Chef", pos: noun, article: der, plural: "Chefs", vi: "sếp (nam)", ipa: "/ʃɛf/", example: { de: "Der Chef ruft einen Kunden an.", vi: "Sếp gọi điện cho một khách hàng." }, usage_vi: "Nữ: die Chefin (số nhiều die Chefinnen). Phát âm „sch“, không phải „ch“.", lesson_refs: [a1.m07.l01] }
  - { id: a1.m07.v.kollege, de: "Kollege", pos: noun, article: der, plural: "Kollegen", vi: "đồng nghiệp (nam)", ipa: "/kɔˈleːɡə/", example: { de: "Mein Kollege kommt heute später.", vi: "Đồng nghiệp của tôi hôm nay đến muộn hơn." }, usage_vi: "Danh từ yếu (n-Deklination): der Kollege – den Kollegen – mit dem Kollegen.", lesson_refs: [a1.m07.l01] }
  - { id: a1.m07.v.kollegin, de: "Kollegin", pos: noun, article: die, plural: "Kolleginnen", vi: "đồng nghiệp (nữ)", ipa: "/kɔˈleːɡɪn/", example: { de: "Die Kollegin trinkt Kaffee in der Kantine.", vi: "Đồng nghiệp nữ uống cà phê ở căng-tin." }, usage_vi: "Thêm -in để chỉ nữ; số nhiều thêm -innen.", lesson_refs: [a1.m07.l01] }
  - { id: a1.m07.v.termin, de: "Termin", pos: noun, article: der, plural: "Termine", vi: "cuộc hẹn, lịch hẹn", ipa: "/tɛʁˈmiːn/", example: { de: "Ich habe um zehn Uhr einen Termin.", vi: "Lúc mười giờ tôi có một cuộc hẹn." }, usage_vi: "Dùng cho cuộc hẹn chính thức (bác sĩ, công việc). Hẹn bạn bè thường nói „Treffen“ hoặc „Verabredung“.", lesson_refs: [a1.m07.l01] }
  - { id: a1.m07.v.besprechung, de: "Besprechung", pos: noun, article: die, plural: "Besprechungen", vi: "cuộc họp", ipa: "/bəˈʃpʁɛçʊŋ/", example: { de: "Die Besprechung dauert eine Stunde.", vi: "Cuộc họp kéo dài một tiếng." }, usage_vi: "Danh từ đuôi -ung luôn là „die“.", lesson_refs: [a1.m07.l01] }
  - { id: a1.m07.v.pause, de: "Pause", pos: noun, article: die, plural: "Pausen", vi: "giờ nghỉ, sự nghỉ giải lao", ipa: "/ˈpaʊzə/", example: { de: "Wir machen jetzt zehn Minuten Pause.", vi: "Bây giờ chúng ta nghỉ mười phút." }, usage_vi: "Cụm cố định: „Pause machen“ = nghỉ giải lao.", lesson_refs: [a1.m07.l01] }
  - { id: a1.m07.v.mittagspause, de: "Mittagspause", pos: noun, article: die, plural: "Mittagspausen", vi: "giờ nghỉ trưa", ipa: "/ˈmɪtaːksˌpaʊzə/", example: { de: "In der Mittagspause essen wir in der Kantine.", vi: "Giờ nghỉ trưa chúng tôi ăn ở căng-tin." }, usage_vi: "Từ ghép: Mittag + Pause.", lesson_refs: [a1.m07.l01] }
  - { id: a1.m07.v.feierabend, de: "Feierabend", pos: noun, article: der, no_plural: true, vi: "giờ tan làm; thời gian sau giờ làm", ipa: "/ˈfaɪɐˌʔaːbn̩t/", example: { de: "Um fünf Uhr ist Feierabend.", vi: "Năm giờ là hết giờ làm." }, usage_vi: "„Feierabend haben/machen“ = tan làm. Lời chào: „Schönen Feierabend!“ (chúc buổi tối vui vẻ sau giờ làm).", lesson_refs: [a1.m07.l01] }
  - { id: a1.m07.v.firma, de: "Firma", pos: noun, article: die, plural: "Firmen", vi: "công ty", ipa: "/ˈfɪʁma/", example: { de: "Meine Firma ist in der Stadt.", vi: "Công ty của tôi ở trong thành phố." }, usage_vi: "Số nhiều „Firmen“ (không phải Firmas). „in der Firma“ = ở công ty.", lesson_refs: [a1.m07.l01] }
  - { id: a1.m07.v.kantine, de: "Kantine", pos: noun, article: die, plural: "Kantinen", vi: "căng-tin", ipa: "/kanˈtiːnə/", example: { de: "Die Kantine ist im Erdgeschoss.", vi: "Căng-tin ở tầng trệt." }, usage_vi: "Nơi nhân viên ăn trưa trong công ty hoặc trường học.", lesson_refs: [a1.m07.l01] }
  - { id: a1.m07.v.kaffee, de: "Kaffee", pos: noun, article: der, no_plural: true, vi: "cà phê", ipa: "/ˈkafe/", example: { de: "Der Kaffee im Büro ist heiß.", vi: "Cà phê ở văn phòng thì nóng." }, usage_vi: "Là chất lỏng nên thường không dùng số nhiều. Đếm bằng „eine Tasse Kaffee“.", lesson_refs: [a1.m07.l01] }
  - { id: a1.m07.v.computer, de: "Computer", pos: noun, article: der, plural: "Computer", vi: "máy tính", ipa: "/kɔmˈpjuːtɐ/", example: { de: "Der Computer ist sehr langsam.", vi: "Máy tính chạy rất chậm." }, usage_vi: "Số nhiều giống số ít. Từ gần nghĩa: der Laptop.", lesson_refs: [a1.m07.l02] }
  - { id: a1.m07.v.drucker, de: "Drucker", pos: noun, article: der, plural: "Drucker", vi: "máy in", ipa: "/ˈdʁʊkɐ/", example: { de: "Der Drucker funktioniert nicht.", vi: "Máy in không hoạt động." }, usage_vi: "Danh từ đuôi -er chỉ vật/người làm việc gì đó thường là „der“; số nhiều không đổi.", lesson_refs: [a1.m07.l02] }
  - { id: a1.m07.v.telefon, de: "Telefon", pos: noun, article: das, plural: "Telefone", vi: "điện thoại", ipa: "/teleˈfoːn/", example: { de: "Das Telefon klingelt schon wieder.", vi: "Điện thoại lại reo nữa rồi." }, usage_vi: "Nói chuyện qua điện thoại: „am Telefon“.", lesson_refs: [a1.m07.l02] }
  - { id: a1.m07.v.email, de: "E-Mail", pos: noun, article: die, plural: "E-Mails", vi: "thư điện tử", ipa: "/ˈiːmeɪl/", example: { de: "Ich schreibe eine kurze E-Mail.", vi: "Tôi viết một e-mail ngắn." }, usage_vi: "Dùng „die E-Mail“ (giống cái). „eine E-Mail schreiben/schicken“.", lesson_refs: [a1.m07.l02, a1.m07.l04] }
  - { id: a1.m07.v.schreibtisch, de: "Schreibtisch", pos: noun, article: der, plural: "Schreibtische", vi: "bàn làm việc", ipa: "/ˈʃʁaɪptɪʃ/", example: { de: "Der Drucker steht neben dem Schreibtisch.", vi: "Máy in đứng cạnh bàn làm việc." }, usage_vi: "„am Schreibtisch“ = ở bàn làm việc (an + dem).", lesson_refs: [a1.m07.l02] }
  - { id: a1.m07.v.passwort, de: "Passwort", pos: noun, article: das, plural: "Passwörter", vi: "mật khẩu", ipa: "/ˈpasvɔʁt/", example: { de: "Ich brauche ein neues Passwort.", vi: "Tôi cần một mật khẩu mới." }, usage_vi: "Số nhiều có Umlaut: Passwörter.", lesson_refs: [a1.m07.l02] }
  - { id: a1.m07.v.internet, de: "Internet", pos: noun, article: das, no_plural: true, vi: "mạng Internet", ipa: "/ˈɪntɐnɛt/", example: { de: "Das Internet geht heute nicht.", vi: "Hôm nay Internet không vào được." }, usage_vi: "Hay nói „das Internet funktioniert nicht“ hoặc „das WLAN ist weg“ trong đời thường.", lesson_refs: [a1.m07.l02] }
  - { id: a1.m07.v.problem, de: "Problem", pos: noun, article: das, plural: "Probleme", vi: "vấn đề, sự cố", ipa: "/pʁoˈbleːm/", example: { de: "Wir haben ein Problem mit dem Drucker.", vi: "Chúng tôi có vấn đề với cái máy in." }, usage_vi: "„ein Problem mit + Dativ“ = vấn đề với cái gì. „Kein Problem!“ = không sao cả.", lesson_refs: [a1.m07.l02] }
  - { id: a1.m07.v.fehler, de: "Fehler", pos: noun, article: der, plural: "Fehler", vi: "lỗi, sai sót", ipa: "/ˈfeːlɐ/", example: { de: "Im Text ist ein Fehler.", vi: "Trong văn bản có một lỗi." }, usage_vi: "Số nhiều không đổi: ein Fehler – zwei Fehler.", lesson_refs: [a1.m07.l02] }
  - { id: a1.m07.v.frage, de: "Frage", pos: noun, article: die, plural: "Fragen", vi: "câu hỏi", ipa: "/ˈfʁaːɡə/", example: { de: "Ich habe eine Frage zur E-Mail.", vi: "Tôi có một câu hỏi về cái e-mail." }, usage_vi: "„eine Frage stellen“ = đặt câu hỏi; „zu + Dativ“ = về (một chủ đề).", lesson_refs: [a1.m07.l02, a1.m07.l04] }
  - { id: a1.m07.v.kunde, de: "Kunde", pos: noun, article: der, plural: "Kunden", vi: "khách hàng (nam)", ipa: "/ˈkʊndə/", example: { de: "Der Kunde wartet im Café.", vi: "Vị khách hàng đang đợi ở quán cà phê." }, usage_vi: "Nữ: die Kundin. Danh từ yếu: den Kunden, mit dem Kunden.", lesson_refs: [a1.m07.l02] }
  - { id: a1.m07.v.brief, de: "Brief", pos: noun, article: der, plural: "Briefe", vi: "bức thư", ipa: "/bʁiːf/", example: { de: "Ich schreibe einen Brief an meine Tante.", vi: "Tôi viết một bức thư cho dì tôi." }, usage_vi: "„Liebe/Lieber …“ mở đầu thư thân mật; „Sehr geehrte …“ mở đầu thư trang trọng.", lesson_refs: [a1.m07.l04] }
  - { id: a1.m07.v.bahnhof, de: "Bahnhof", pos: noun, article: der, plural: "Bahnhöfe", vi: "nhà ga", ipa: "/ˈbaːnhoːf/", example: { de: "Der Bahnhof ist nicht weit von hier.", vi: "Nhà ga không xa đây." }, usage_vi: "Số nhiều có Umlaut: Bahnhöfe. „zum Bahnhof“ = đến nhà ga.", lesson_refs: [a1.m07.l03] }
  - { id: a1.m07.v.bank, de: "Bank", pos: noun, article: die, plural: "Banken", vi: "ngân hàng", ipa: "/baŋk/", example: { de: "Die Bank öffnet um neun Uhr.", vi: "Ngân hàng mở cửa lúc chín giờ." }, usage_vi: "Chú ý: „die Bank“ còn nghĩa là „ghế dài“ (số nhiều Bänke). Ngữ cảnh quyết định.", lesson_refs: [a1.m07.l03] }
  - { id: a1.m07.v.post, de: "Post", pos: noun, article: die, no_plural: true, vi: "bưu điện; thư từ", ipa: "/pɔst/", example: { de: "Ich gehe zur Post und kaufe Briefmarken.", vi: "Tôi đi đến bưu điện và mua tem." }, usage_vi: "„zur Post gehen“ = đi đến bưu điện; „bei der Post“ = ở bưu điện.", lesson_refs: [a1.m07.l03] }
  - { id: a1.m07.v.apotheke, de: "Apotheke", pos: noun, article: die, plural: "Apotheken", vi: "hiệu thuốc", ipa: "/apoˈteːkə/", example: { de: "Die Apotheke ist neben der Bank.", vi: "Hiệu thuốc ở cạnh ngân hàng." }, usage_vi: "Chữ „th“ trong từ này đọc là /t/, không phải /θ/.", lesson_refs: [a1.m07.l03] }
  - { id: a1.m07.v.supermarkt, de: "Supermarkt", pos: noun, article: der, plural: "Supermärkte", vi: "siêu thị", ipa: "/ˈzuːpɐˌmaʁkt/", example: { de: "Nach der Arbeit gehe ich zum Supermarkt.", vi: "Sau giờ làm tôi đi siêu thị." }, usage_vi: "Số nhiều có Umlaut: Supermärkte. „zum Supermarkt“ = đến siêu thị.", lesson_refs: [a1.m07.l03] }
  - { id: a1.m07.v.cafe, de: "Café", pos: noun, article: das, plural: "Cafés", vi: "quán cà phê", ipa: "/kaˈfeː/", example: { de: "Wir treffen uns im Café am Bahnhof.", vi: "Chúng ta gặp nhau ở quán cà phê gần nhà ga." }, usage_vi: "Có dấu sắc trên é; khác với „der Kaffee“ (đồ uống).", lesson_refs: [a1.m07.l03] }
  # ---- Động từ ----
  - { id: a1.m07.v.arbeiten, de: "arbeiten", pos: verb, forms: { er: "arbeitet" }, vi: "làm việc", ipa: "/ˈaʁbaɪtn̩/", example: { de: "Meine Kollegin arbeitet bei einer Bank.", vi: "Đồng nghiệp nữ của tôi làm việc ở một ngân hàng." }, usage_vi: "Thân động từ kết thúc bằng -t nên thêm „e“: du arbeitest, er arbeitet, ihr arbeitet.", lesson_refs: [a1.m07.l01] }
  - { id: a1.m07.v.anfangen, de: "anfangen", pos: verb, forms: { er: "fängt an", separable: true }, vi: "bắt đầu", ipa: "/ˈanˌfaŋən/", example: { de: "Die Besprechung fängt um neun Uhr an.", vi: "Cuộc họp bắt đầu lúc chín giờ." }, usage_vi: "Động từ tách: tiền tố „an“ đứng cuối câu. Bất quy tắc: er fängt an.", lesson_refs: [a1.m07.l01] }
  - { id: a1.m07.v.aufhoeren, de: "aufhören", pos: verb, forms: { er: "hört auf", separable: true }, vi: "kết thúc, dừng lại", ipa: "/ˈaʊfˌhøːʁən/", example: { de: "Die Arbeit hört um fünf Uhr auf.", vi: "Công việc kết thúc lúc năm giờ." }, usage_vi: "Động từ tách: „auf“ đứng cuối câu. Trái nghĩa: anfangen.", lesson_refs: [a1.m07.l01] }
  - { id: a1.m07.v.schreiben, de: "schreiben", pos: verb, forms: { er: "schreibt" }, vi: "viết", ipa: "/ˈʃʁaɪbn̩/", example: { de: "Er schreibt eine E-Mail an den Kunden.", vi: "Anh ấy viết một e-mail cho khách hàng." }, usage_vi: "„sch“ đọc /ʃ/. „an + Akkusativ“ = gửi cho ai (ở đây chỉ ghi nhớ cụm).", lesson_refs: [a1.m07.l04] }
  - { id: a1.m07.v.sprechen, de: "sprechen", pos: verb, forms: { er: "spricht" }, vi: "nói, nói chuyện", ipa: "/ˈʃpʁɛçn̩/", example: { de: "Ich muss mit dem Chef sprechen.", vi: "Tôi phải nói chuyện với sếp." }, usage_vi: "Bất quy tắc: ich spreche, du sprichst, er spricht. „sp“ đầu từ đọc /ʃp/. „mit jemandem sprechen“ + Dativ.", lesson_refs: [a1.m07.l02] }
  - { id: a1.m07.v.drucken, de: "drucken", pos: verb, forms: { er: "druckt" }, vi: "in (tài liệu)", ipa: "/ˈdʁʊkn̩/", example: { de: "Kannst du bitte den Brief drucken?", vi: "Bạn in giúp bức thư này được không?" }, usage_vi: "Thường đi với Akkusativ: einen Brief drucken.", lesson_refs: [a1.m07.l02, a1.m07.l04] }
  - { id: a1.m07.v.anrufen, de: "anrufen", pos: verb, forms: { er: "ruft an", separable: true }, vi: "gọi điện thoại", ipa: "/ˈanˌʁuːfn̩/", example: { de: "Ich rufe den Kunden um zwei Uhr an.", vi: "Tôi gọi điện cho khách hàng lúc hai giờ." }, usage_vi: "Động từ tách; người được gọi ở Akkusativ: „Ich rufe dich an.“", lesson_refs: [a1.m07.l02] }
  - { id: a1.m07.v.helfen, de: "helfen", pos: verb, forms: { er: "hilft" }, vi: "giúp đỡ", ipa: "/ˈhɛlfn̩/", example: { de: "Der Kollege hilft der Kollegin.", vi: "Đồng nghiệp nam giúp đồng nghiệp nữ." }, usage_vi: "„helfen“ đi với Dativ (không phải Akkusativ): jemandem helfen. Bất quy tắc: er hilft.", lesson_refs: [a1.m07.l02] }
  - { id: a1.m07.v.brauchen, de: "brauchen", pos: verb, forms: { er: "braucht" }, vi: "cần", ipa: "/ˈbʁaʊxn̩/", example: { de: "Wir brauchen ein neues Passwort.", vi: "Chúng ta cần một mật khẩu mới." }, usage_vi: "Đi với Akkusativ: Ich brauche einen Drucker.", lesson_refs: [a1.m07.l02] }
  - { id: a1.m07.v.funktionieren, de: "funktionieren", pos: verb, forms: { er: "funktioniert" }, vi: "hoạt động, chạy được", ipa: "/fʊŋkʦi̯oˈniːʁən/", example: { de: "Das Internet funktioniert wieder.", vi: "Internet lại hoạt động rồi." }, usage_vi: "Đuôi -ieren: không có „ge-“ ở quá khứ (học ở Kapitel 10). Phủ định: „funktioniert nicht“.", lesson_refs: [a1.m07.l02] }
  - { id: a1.m07.v.gehen, de: "gehen", pos: verb, forms: { er: "geht" }, vi: "đi (bộ), đi đến", ipa: "/ˈɡeːən/", example: { de: "Ich gehe zu Fuß zur Arbeit.", vi: "Tôi đi bộ đến chỗ làm." }, usage_vi: "Đi với „zu“ + Dativ: zum Chef gehen, zur Bank gehen.", lesson_refs: [a1.m07.l03] }
  - { id: a1.m07.v.fahren, de: "fahren", pos: verb, forms: { er: "fährt" }, vi: "đi (bằng phương tiện), lái", ipa: "/ˈfaːʁən/", example: { de: "Meine Kollegin fährt mit dem Bus zur Firma.", vi: "Đồng nghiệp nữ của tôi đi xe buýt đến công ty." }, usage_vi: "Bất quy tắc: du fährst, er fährt. „mit dem Bus/Zug/Auto fahren“.", lesson_refs: [a1.m07.l03] }
  # ---- Tính từ / trạng từ ----
  - { id: a1.m07.v.kaputt, de: "kaputt", pos: adjective, vi: "hỏng", ipa: "/kaˈpʊt/", example: { de: "Der Computer ist leider kaputt.", vi: "Chiếc máy tính tiếc là bị hỏng." }, usage_vi: "Khẩu ngữ rất thông dụng. Không biến cách khi đứng sau „sein“.", lesson_refs: [a1.m07.l02] }
  - { id: a1.m07.v.wichtig, de: "wichtig", pos: adjective, vi: "quan trọng", ipa: "/ˈvɪçtɪç/", example: { de: "Der Termin ist heute sehr wichtig.", vi: "Cuộc hẹn hôm nay rất quan trọng." }, usage_vi: "Đuôi -ig đọc /ɪç/.", lesson_refs: [a1.m07.l01, a1.m07.l04] }
  - { id: a1.m07.v.frueh, de: "früh", pos: adjective, vi: "sớm", ipa: "/fʁyː/", example: { de: "Ich stehe früh auf und fahre früh zur Arbeit.", vi: "Tôi dậy sớm và đi làm sớm." }, usage_vi: "Trái nghĩa: spät. „Zu früh“ = quá sớm.", lesson_refs: [a1.m07.l01] }
  - { id: a1.m07.v.spaet, de: "spät", pos: adjective, vi: "muộn", ipa: "/ʃpɛːt/", example: { de: "Es ist schon spät, wir gehen nach Hause.", vi: "Đã muộn rồi, chúng ta về nhà." }, usage_vi: "Chú ý „Wie spät ist es?“ = mấy giờ rồi (đã học ở Kapitel 5).", lesson_refs: [a1.m07.l01] }
  # ---- Liên từ ----
  - { id: a1.m07.v.und, de: "und", pos: conjunction, vi: "và", ipa: "/ʊnt/", example: { de: "Ich arbeite und lerne Deutsch.", vi: "Tôi làm việc và học tiếng Đức." }, usage_vi: "Nối từ, cụm từ hoặc câu; không làm đổi vị trí động từ (vị trí 0).", lesson_refs: [a1.m07.l01] }
  - { id: a1.m07.v.oder, de: "oder", pos: conjunction, vi: "hoặc, hay", ipa: "/ˈoːdɐ/", example: { de: "Trinkst du Kaffee oder Tee?", vi: "Bạn uống cà phê hay trà?" }, usage_vi: "Đưa ra lựa chọn. Cũng dùng trong câu hỏi dạng „..., oder?“ để xác nhận.", lesson_refs: [a1.m07.l01] }
  - { id: a1.m07.v.aber, de: "aber", pos: conjunction, vi: "nhưng", ipa: "/ˈaːbɐ/", example: { de: "Die Arbeit ist schwer, aber sie macht Spaß.", vi: "Công việc vất vả nhưng nó vui." }, usage_vi: "Nối hai ý đối lập; trước „aber“ có dấu phẩy khi nối hai câu.", lesson_refs: [a1.m07.l01] }
  # ---- Giới từ đi với Dativ ----
  - { id: a1.m07.v.mit, de: "mit", pos: preposition, vi: "với, cùng; bằng (phương tiện)", ipa: "/mɪt/", example: { de: "Ich spreche mit dem Chef.", vi: "Tôi nói chuyện với sếp." }, usage_vi: "Luôn + Dativ. Hai nghĩa: đi cùng ai; dùng phương tiện/công cụ gì (mit dem Bus).", lesson_refs: [a1.m07.l02] }
  - { id: a1.m07.v.bei, de: "bei", pos: preposition, vi: "ở chỗ, tại (nơi làm việc, nhà ai)", ipa: "/baɪ/", example: { de: "Ich arbeite bei einer Bank.", vi: "Tôi làm việc ở một ngân hàng." }, usage_vi: "Luôn + Dativ; trả lời „Wo?“. bei + dem = beim.", lesson_refs: [a1.m07.l03] }
  - { id: a1.m07.v.zu, de: "zu", pos: preposition, vi: "đến (chỗ ai/nơi nào)", ipa: "/ʦuː/", example: { de: "Ich gehe zum Chef.", vi: "Tôi đi gặp sếp." }, usage_vi: "Luôn + Dativ; trả lời „Wohin?“ với người hoặc nơi/ tòa nhà. zu + dem = zum, zu + der = zur.", lesson_refs: [a1.m07.l03] }
  - { id: a1.m07.v.von, de: "von", pos: preposition, vi: "từ; của", ipa: "/fɔn/", example: { de: "Das ist eine E-Mail vom Chef.", vi: "Đây là một e-mail của sếp." }, usage_vi: "Luôn + Dativ. von + dem = vom.", lesson_refs: [a1.m07.l03] }
  - { id: a1.m07.v.aus, de: "aus", pos: preposition, vi: "từ (trong ra), xuất thân từ", ipa: "/aʊs/", example: { de: "Der Kunde kommt aus der Schweiz.", vi: "Vị khách hàng đến từ Thụy Sĩ." }, usage_vi: "Luôn + Dativ; „aus + Land/Stadt“ (nguồn gốc) hoặc „aus dem Büro“ (ra khỏi).", lesson_refs: [a1.m07.l03] }
  - { id: a1.m07.v.nach, de: "nach", pos: preposition, vi: "sau (thời gian); đến (thành phố, nước không có mạo từ)", ipa: "/naːx/", example: { de: "Nach der Pause arbeite ich weiter.", vi: "Sau giờ nghỉ tôi làm tiếp." }, usage_vi: "Luôn + Dativ. „nach Hause“ = về nhà (cụm cố định, không có Artikel).", lesson_refs: [a1.m07.l03] }
  # ---- Cụm ----
  - { id: a1.m07.v.zu-hause, de: "zu Hause", pos: phrase, vi: "ở nhà", ipa: "/ʦu ˈhaʊzə/", example: { de: "Am Wochenende bin ich zu Hause.", vi: "Cuối tuần tôi ở nhà." }, usage_vi: "Trả lời „Wo?“. Đừng nhầm với „nach Hause“ (Wohin?).", lesson_refs: [a1.m07.l03] }
  - { id: a1.m07.v.nach-hause, de: "nach Hause", pos: phrase, vi: "về nhà", ipa: "/naːx ˈhaʊzə/", example: { de: "Um sechs Uhr gehe ich nach Hause.", vi: "Lúc sáu giờ tôi về nhà." }, usage_vi: "Trả lời „Wohin?“. Cố định, không thêm Artikel.", lesson_refs: [a1.m07.l03] }
