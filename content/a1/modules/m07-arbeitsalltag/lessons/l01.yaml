blocks:
  - id: a1.m07.l01.b1
    kind: explanation
    skill: vocabulary
    title_vi: "Bắt đầu: một ngày ở văn phòng"
    body_vi: |
      Trong bài này bạn học cách nói về ngày làm việc: **Wann fängt dein Arbeitstag an?** (Ngày làm việc của bạn bắt đầu lúc nào?).
      Hãy chú ý các động từ tách **anfangen** và **aufhören**: tiền tố đứng cuối câu — *Der Arbeitstag fängt um acht Uhr an.* / *Die Arbeit hört um fünf Uhr auf.*
      Giờ giấc dùng lại cách nói đã học ở Kapitel 5 (um acht Uhr, um halb neun).
  - id: a1.m07.l01.b2
    kind: dialogue
    skill: speaking
    title_vi: "Hội thoại: Hai đồng nghiệp trò chuyện"
    lines:
      - { speaker: "Mia", de: "Hallo Jonas, wann fängt dein Arbeitstag an?", vi: "Chào Jonas, ngày làm việc của bạn bắt đầu lúc nào?" }
      - { speaker: "Jonas", de: "Um acht Uhr. Und dein Arbeitstag?", vi: "Lúc tám giờ. Còn ngày làm việc của bạn?" }
      - { speaker: "Mia", de: "Ich fange schon um sieben Uhr an, aber ich höre früh auf.", vi: "Tôi bắt đầu từ bảy giờ rồi nhưng tôi tan sớm." }
      - { speaker: "Jonas", de: "Super! Hast du heute einen Termin?", vi: "Hay quá! Hôm nay bạn có cuộc hẹn nào không?" }
      - { speaker: "Mia", de: "Ja, um zehn Uhr habe ich eine Besprechung mit dem Chef.", vi: "Có, lúc mười giờ tôi có cuộc họp với sếp." }
      - { speaker: "Jonas", de: "Machen wir danach Mittagspause? In der Kantine oder im Café?", vi: "Sau đó chúng ta nghỉ trưa nhé? Ở căng-tin hay quán cà phê?" }
      - { speaker: "Mia", de: "In der Kantine. Der Kaffee dort ist gut.", vi: "Ở căng-tin. Cà phê ở đó ngon." }
  - id: a1.m07.l01.b3
    kind: reading
    skill: reading
    title_vi: "Bài đọc: Ein Tag bei Frau Kaya"
    paragraphs:
      - { de: "Frau Kaya arbeitet in einer kleinen Firma. Ihr Arbeitstag fängt um halb acht an.", vi: "Chị Kaya làm việc ở một công ty nhỏ. Ngày làm việc của chị bắt đầu lúc bảy rưỡi." }
      - { de: "Zuerst schreibt sie E-Mails, dann hat sie eine Besprechung mit den Kollegen.", vi: "Trước tiên chị viết e-mail, sau đó chị có cuộc họp với các đồng nghiệp." }
      - { de: "Um zwölf Uhr ist Mittagspause. Sie isst in der Kantine oder sie geht in ein Café.", vi: "Mười hai giờ là giờ nghỉ trưa. Chị ăn ở căng-tin hoặc đến một quán cà phê." }
      - { de: "Um vier Uhr hört die Arbeit auf. Dann ist Feierabend!", vi: "Bốn giờ công việc kết thúc. Thế là tan làm!" }
  - id: a1.m07.l01.b4
    kind: explanation
    skill: grammar
    title_vi: "Ngữ pháp: nối câu bằng und, oder, aber"
    body_vi: |
      Hai câu có thể nối bằng **und** (và), **oder** (hoặc), **aber** (nhưng). Ba từ này không làm đổi vị trí động từ:
      *Ich fange um sieben an, **aber** ich höre früh auf.*
      Xem chi tiết và bảng trong chủ điểm ngữ pháp „Sätze verbinden: und, oder, aber“ (a1.g.konjunktionen).
  - id: a1.m07.l01.b5
    kind: culture
    skill: speaking
    title_vi: "Văn hóa: giờ nghỉ và lời chúc Feierabend"
    body_vi: |
      Ở nhiều công ty D-A-CH, nhân viên có giờ nghỉ trưa riêng (Mittagspause) và nhiều nơi có Kantine. Khi đồng nghiệp ra về, người ta hay nói **Schönen Feierabend!**. Đáp lại thường là **Danke, dir auch!**.
      Mức độ chính xác về giờ giấc (Pünktlichkeit) được đánh giá cao: đến đúng giờ họp là phép lịch sự cơ bản.
