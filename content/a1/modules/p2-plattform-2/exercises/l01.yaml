exercises:
- id: a1.p2.l01.ex.01
  type: multiple-choice
  skill: vocabulary
  difficulty: 1
  objective_refs:
  - a1.p2.l01.obj1
  instructions_vi: Chọn từ vựng phù hợp với ngữ cảnh.
  items:
  - id: a1.p2.l01.ex.01.q1
    prompt: Für den Salat brauche ich noch zwei ___.
    options:
    - id: a
      text: Terminkalender
    - id: b
      text: Kugelschreiber
    - id: c
      text: Zwiebeln
    answer:
    - c
    explanation_vi: die Zwiebel = củ hành tây (dùng cho món salad).
  - id: a1.p2.l01.ex.01.q2
    prompt: Meine Schwester hat eine Tochter. Das Mädchen ist meine ___.
    options:
    - id: a
      text: Schwägerin
    - id: b
      text: Nichte
    - id: c
      text: Tante
    answer:
    - b
    explanation_vi: Con gái của anh/chị/em là cháu gái (die Nichte).
  - id: a1.p2.l01.ex.01.q3
    prompt: 'Ich möchte im Restaurant bezahlen. Ich rufe den Kellner: „___ bitte!“'
    options:
    - id: a
      text: Der Terminkalender
    - id: b
      text: Die Rechnung
    - id: c
      text: Das Geschenk
    answer:
    - b
    explanation_vi: die Rechnung = hóa đơn thanh toán.
  - id: a1.p2.l01.ex.01.q4
    prompt: Wir machen am Samstag eine Party. Bringst du bitte Musik ___?
    options:
    - id: a
      text: mit
    - id: b
      text: an
    - id: c
      text: auf
    answer:
    - a
    explanation_vi: mitbringen = mang theo cùng.
- id: a1.p2.l01.ex.02
  type: matching
  skill: vocabulary
  difficulty: 1
  objective_refs:
  - a1.p2.l01.obj1
  instructions_vi: Nối từ ngữ với nhóm chủ đề tương ứng.
  items:
  - id: a1.p2.l01.ex.02.q1
    pairs:
    - left: der Käse, die Zwiebel
      right: Essen und Trinken
    - left: der Neffe, die Schwägerin
      right: Familie
    - left: der Terminkalender, die Uhrzeit
      right: Alltag und Termine
    - left: die Rechnung, das Geschenk
      right: Zeit mit Freunden
    explanation_vi: Phân loại từ vựng theo 4 chủ đề lớn của K04–K06.
- id: a1.p2.l01.ex.03
  type: fill-blank
  skill: grammar
  difficulty: 2
  objective_refs:
  - a1.p2.l01.obj2
  instructions_vi: Điền mạo từ thích hợp ở cách Akkusativ (den, einen, keinen) hoặc đại từ (ihn).
  items:
  - id: a1.p2.l01.ex.03.q1
    prompt: Ich brauche noch ___ Apfel für den Kuchen. (ein)
    answers:
    - einen
    explanation_vi: der Apfel (giống đực) ở Akkusativ đổi thành einen.
  - id: a1.p2.l01.ex.03.q2
    prompt: Kaufst du bitte ___ Käse im Supermarkt? (der)
    answers:
    - den
    explanation_vi: der Käse (giống đực) ở Akkusativ đổi thành den.
  - id: a1.p2.l01.ex.03.q3
    prompt: Ich habe ___ Hunger. Ich möchte nichts essen. (kein)
    answers:
    - keinen
    explanation_vi: der Hunger (giống đực) ở Akkusativ phủ định là keinen.
  - id: a1.p2.l01.ex.03.q4
    prompt: Wo ist dein Bruder? – Ich rufe ___ jetzt an. (er)
    answers:
    - ihn
    explanation_vi: Đại từ nhân xưng er ở Akkusativ là ihn.
- id: a1.p2.l01.ex.04
  type: sentence-construction
  skill: grammar
  difficulty: 2
  objective_refs:
  - a1.p2.l01.obj2
  instructions_vi: Sắp xếp và viết câu hoàn chỉnh với động từ tách.
  items:
  - id: a1.p2.l01.ex.04.q1
    prompt_vi: Wann / du / deine Mutter / anrufen ?
    answers:
    - Wann rufst du deine Mutter an?
    explanation_vi: Wann rufst du deine Mutter an? (gốc rufst ở vị trí 2, tiền tố an ở cuối câu).
  - id: a1.p2.l01.ex.04.q2
    prompt_vi: Peter / einen Salat / mitbringen .
    answers:
    - Peter bringt einen Salat mit.
    explanation_vi: Peter bringt einen Salat mit. (tiền tố mit đứng cuối câu).
- id: a1.p2.l01.ex.05
  type: true-false
  skill: reading
  difficulty: 1
  objective_refs:
  - a1.p2.l01.obj3
  instructions_vi: Đọc email của Leon và xác định đúng hay sai.
  stimulus:
    ref: a1.p2.l01.b6
  items:
  - id: a1.p2.l01.ex.05.q1
    prompt: Die Gartenparty von Elena hat um 15 Uhr begonnen.
    answer: true
    explanation_vi: 'Đúng, Leon viết: ''Um 15 Uhr sind alle Gäste angekommen''.'
  - id: a1.p2.l01.ex.05.q2
    prompt: Leon hat Fleisch vom Grill mitgebracht.
    answer: false
    explanation_vi: 'Sai, Leon mang bánh táo: ''Ich habe einen Apfelkuchen gebacken und mitgebracht''.'
- id: a1.p2.l01.ex.06
  type: multiple-choice
  skill: listening
  difficulty: 1
  objective_refs:
  - a1.p2.l01.obj3
  instructions_vi: Nghe đoạn hội thoại giữa Jonas và Sara rồi chọn đáp án đúng.
  stimulus:
    ref: a1.p2.l01.b5
  items:
  - id: a1.p2.l01.ex.06.q1
    prompt: Wann treffen sich Jonas und Sara?
    options:
    - id: a
      text: Am Freitagabend um 19 Uhr.
    - id: b
      text: Am Samstagabend um 18 Uhr.
    - id: c
      text: Am Sonntagmittag um 12 Uhr.
    answer:
    - b
    explanation_vi: 'Jonas hỏi: ''Kannst du um 18 Uhr zu mir kommen?'' vào tối thứ Bảy.'
  - id: a1.p2.l01.ex.06.q2
    prompt: Was bringt Sara mit?
    options:
    - id: a
      text: Einen großen Salat.
    - id: b
      text: Zwei Flaschen Saft.
    - id: c
      text: Einen Schokoladenkuchen.
    answer:
    - c
    explanation_vi: 'Sara nói: ''Ich kaufe einen Schokoladenkuchen und bringe ihn mit''.'
- id: a1.p2.l01.ex.07
  type: speaking-practice
  skill: speaking
  difficulty: 2
  objective_refs:
  - a1.p2.l01.obj3
  instructions_vi: Kể 4–5 câu về một ngày cuối tuần hoặc bữa tiệc đáng nhớ của bạn (dùng war / hatte).
  grading: self
  rubric:
  - criterion_vi: Dùng đúng thì quá khứ của sein (war) và haben (hatte)
    points: 2
  - criterion_vi: Nói rõ sự kiện, thời gian và cảm nghĩ
    points: 1
  items:
  - id: a1.p2.l01.ex.07.q1
    prompt_vi: Sprechen Sie über Ihr letztes Wochenende oder eine Party.
    model_answer:
      de: Am Samstag hatte mein Freund Geburtstag. Die Party war super. Das Essen war lecker. Wir hatten viel Spaß.
    explanation_vi: Nói rõ sự kiện, thời gian, món ăn và cảm nhận bằng war và hatte.
- id: a1.p2.l01.ex.08
  type: writing-practice
  skill: writing
  difficulty: 2
  objective_refs:
  - a1.p2.l01.obj3
  instructions_vi: Viết tin nhắn ngắn (30–40 từ) rủ bạn đến nhà ăn tối vào cuối tuần.
  grading: self
  rubric:
  - criterion_vi: 'Đủ thông tin: thời gian, món ăn và nhờ mang đồ uống với động từ tách mitbringen'
    points: 2
  - criterion_vi: Chào hỏi và kết thúc thư tự nhiên, đúng ngữ pháp
    points: 1
  items:
  - id: a1.p2.l01.ex.08.q1
    prompt_vi: Schreiben Sie eine Nachricht an einen Freund / eine Freundin.
    model_answer:
      de: Hallo Stefan, hast du am Samstag um 19 Uhr Zeit? Ich koche Pasta. Bringst du Saft mit? Bis Samstag!
    explanation_vi: Đảm bảo đủ lời rủ, giờ giấc, món ăn và lời nhờ mang đồ uống.
