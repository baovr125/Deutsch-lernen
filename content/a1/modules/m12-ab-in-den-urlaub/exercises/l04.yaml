exercises:
  - id: a1.m12.l04.ex.01
    type: multiple-choice
    skill: vocabulary
    difficulty: 1
    objective_refs: [a1.m12.l04.obj1, a1.m12.obj.wetter]
    instructions_vi: "Chọn đáp án đúng."
    items:
      - id: a1.m12.l04.ex.01.q1
        prompt: "Das Gegenteil von „heiß“ ist ___."
        options: [{ id: a, text: "kalt" }, { id: b, text: "warm" }, { id: c, text: "Sonne" }]
        answer: [a]
        explanation_vi: "heiß (nóng) – kalt (lạnh)."
      - id: a1.m12.l04.ex.01.q2
        prompt: "Was scheint am Himmel?"
        options: [{ id: a, text: "Der Regen" }, { id: b, text: "Die Sonne" }, { id: c, text: "Der Schnee" }]
        answer: [b]
        explanation_vi: "„Die Sonne scheint.“"
      - id: a1.m12.l04.ex.01.q3
        prompt: "Welchen Artikel hat „Wetter“?"
        options: [{ id: a, text: "der" }, { id: b, text: "die" }, { id: c, text: "das" }]
        answer: [c]
        explanation_vi: "Đúng là „das Wetter“ (không có số nhiều)."
      - id: a1.m12.l04.ex.01.q4
        prompt: "Was bedeutet „der Norden“?"
        options: [{ id: a, text: "phía bắc" }, { id: b, text: "phía nam" }, { id: c, text: "phía tây" }]
        answer: [a]
        explanation_vi: "Norden = bắc; Süden = nam; Westen = tây."
  - id: a1.m12.l04.ex.02
    type: matching
    skill: vocabulary
    difficulty: 1
    objective_refs: [a1.m12.l04.obj1, a1.m12.obj.wetter]
    instructions_vi: "Nối phương hướng với nghĩa tiếng Việt."
    items:
      - { id: a1.m12.l04.ex.02.q1, left: "der Norden", right: "phía bắc", explanation_vi: "im Norden = ở phía bắc." }
      - { id: a1.m12.l04.ex.02.q2, left: "der Süden", right: "phía nam", explanation_vi: "im Süden = ở phía nam." }
      - { id: a1.m12.l04.ex.02.q3, left: "der Osten", right: "phía đông", explanation_vi: "im Osten = ở phía đông." }
      - { id: a1.m12.l04.ex.02.q4, left: "der Westen", right: "phía tây", explanation_vi: "im Westen = ở phía tây." }
  - id: a1.m12.l04.ex.03
    type: fill-blank
    skill: vocabulary
    difficulty: 1
    objective_refs: [a1.m12.l04.obj1, a1.m12.obj.wetter]
    instructions_vi: "Điền từ thích hợp."
    word_bank: ["scheint", "regnet", "kalt", "heiß"]
    items:
      - { id: a1.m12.l04.ex.03.q1, prompt: "Heute ___ die Sonne.", answers: ["scheint"], explanation_vi: "„Die Sonne scheint.“" }
      - { id: a1.m12.l04.ex.03.q2, prompt: "Es ___ seit gestern.", answers: ["regnet"], explanation_vi: "Chủ ngữ „es“ + regnet." }
      - { id: a1.m12.l04.ex.03.q3, prompt: "Im Winter ist es oft ___.", answers: ["kalt"], explanation_vi: "Mùa đông lạnh." }
      - { id: a1.m12.l04.ex.03.q4, prompt: "Im August ist es manchmal sehr ___.", answers: ["heiß"], explanation_vi: "Tháng Tám có khi rất nóng." }
  - id: a1.m12.l04.ex.04
    type: reading-comprehension
    skill: reading
    difficulty: 2
    objective_refs: [a1.m12.l04.obj1, a1.m12.obj.wetter]
    instructions_vi: "Đọc dự báo thời tiết và trả lời."
    stimulus:
      text_de: "Das Wetter morgen: Im Norden regnet es und es ist kalt. Im Süden scheint die Sonne und es ist warm. Im Osten und im Westen gibt es viele Wolken."
      text_vi: "Thời tiết ngày mai: ở phía bắc mưa và lạnh. Ở phía nam nắng và ấm. Ở phía đông và phía tây có nhiều mây."
    items:
      - id: a1.m12.l04.ex.04.q1
        prompt: "Wo regnet es?"
        options: [{ id: a, text: "Im Norden." }, { id: b, text: "Im Süden." }, { id: c, text: "Im Osten." }]
        answer: [a]
        explanation_vi: "„Im Norden regnet es.“"
      - id: a1.m12.l04.ex.04.q2
        prompt: "Wo scheint die Sonne?"
        options: [{ id: a, text: "Im Westen." }, { id: b, text: "Im Süden." }, { id: c, text: "Im Norden." }]
        answer: [b]
        explanation_vi: "„Im Süden scheint die Sonne.“"
      - id: a1.m12.l04.ex.04.q3
        prompt: "Wie ist das Wetter im Westen?"
        options: [{ id: a, text: "Es regnet." }, { id: b, text: "Es ist heiß." }, { id: c, text: "Es gibt viele Wolken." }]
        answer: [c]
        explanation_vi: "„Im Osten und im Westen gibt es viele Wolken.“"
  - id: a1.m12.l04.ex.05
    type: writing-practice
    skill: writing
    difficulty: 3
    objective_refs: [a1.m12.l04.obj3, a1.m12.obj.berichten]
    instructions_vi: "Viết 3–4 câu để báo cáo lại dự báo thời tiết ở trên cho một người bạn sắp đi du lịch."
    items:
      - id: a1.m12.l04.ex.05.q1
        prompt_vi: "Tóm tắt thời tiết ngày mai ở các vùng và khuyên bạn nên đi đâu."
        model_answer: { de: "Morgen regnet es im Norden und es ist kalt. Im Süden scheint die Sonne und es ist warm. Fahr doch in den Süden!", vi: "Ngày mai ở phía bắc mưa và lạnh. Ở phía nam nắng và ấm. Hãy đi về phía nam nhé!" }
        rubric_vi: ["Nêu thời tiết của ít nhất hai vùng.", "Dùng đúng im Norden/im Süden.", "Có một lời khuyên bằng Imperativ.", "Câu hoàn chỉnh, đúng ngữ pháp."]
        explanation_vi: "Bài mẫu tóm tắt hai vùng và kết thúc bằng một lời khuyên."
  - id: a1.m12.l04.ex.06
    type: multiple-choice
    skill: pronunciation
    difficulty: 2
    objective_refs: [a1.m12.l04.obj2]
    instructions_vi: "Chọn đáp án đúng về cách phát âm."
    items:
      - id: a1.m12.l04.ex.06.q1
        prompt: "Wie spricht man „V“ in „Vater“?"
        options: [{ id: a, text: "/f/" }, { id: b, text: "/v/" }, { id: c, text: "/b/" }]
        answer: [a]
        explanation_vi: "V trong từ gốc Đức đọc /f/: Vater = /ˈfaːtɐ/."
      - id: a1.m12.l04.ex.06.q2
        prompt: "Wie spricht man „W“ in „Wetter“?"
        options: [{ id: a, text: "/f/" }, { id: b, text: "/v/" }, { id: c, text: "/b/" }]
        answer: [b]
        explanation_vi: "W luôn đọc /v/: Wetter = /ˈvɛtɐ/."
      - id: a1.m12.l04.ex.06.q3
        prompt: "Welches Wort beginnt mit /f/?"
        options: [{ id: a, text: "Wetter" }, { id: b, text: "Wolke" }, { id: c, text: "Vater" }]
        answer: [c]
        explanation_vi: "Vater bắt đầu bằng /f/; Wetter và Wolke bắt đầu bằng /v/."
  - id: a1.m12.l04.ex.07
    type: speaking-practice
    skill: speaking
    difficulty: 2
    objective_refs: [a1.m12.l04.obj1, a1.m12.l04.obj2, a1.m12.obj.wetter]
    instructions_vi: "Nói 3–4 câu như người dẫn dự báo thời tiết cho thành phố của bạn."
    items:
      - id: a1.m12.l04.ex.07.q1
        prompt_vi: "Mô tả thời tiết hôm nay và ngày mai."
        model_answer: { de: "Heute ist das Wetter schön. Die Sonne scheint und es ist warm. Morgen regnet es im Norden, aber im Süden bleibt es sonnig.", vi: "Hôm nay thời tiết đẹp. Trời nắng và ấm. Ngày mai ở phía bắc mưa, nhưng ở phía nam vẫn nắng." }
        rubric_vi: ["Dùng từ vựng thời tiết đúng.", "Dùng im Norden/im Süden đúng.", "Phát âm đúng w (/v/) và sch.", "Nói trôi chảy."]
        explanation_vi: "Bài mẫu có thời tiết hôm nay, ngày mai và hai vùng."
