title_de: "Ab in den Urlaub!"
title_vi: "Đi nghỉ thôi!"
summary_vi: "Lên kế hoạch và kể về kỳ nghỉ: hỏi thông tin du lịch thành phố, nêu lý do bằng denn, nói về thời tiết và phương hướng."
prerequisites: [a1.m11]
objectives:
  - { id: a1.m12.obj.urlaub, text_vi: "Bạn có thể nói về kế hoạch nghỉ và kể chuyến đi đã qua.", skill: speaking }
  - { id: a1.m12.obj.zeit, text_vi: "Bạn có thể dùng giới từ chỉ thời gian với Dativ (im, am, um, vor, nach, in).", skill: grammar }
  - { id: a1.m12.obj.fragen, text_vi: "Bạn có thể hỏi thông tin bằng các từ để hỏi và đặt động từ ở vị trí 2.", skill: grammar }
  - { id: a1.m12.obj.man, text_vi: "Bạn có thể dùng „man“ để nói điều chung về một nơi.", skill: grammar }
  - { id: a1.m12.obj.denn, text_vi: "Bạn có thể nêu lý do bằng „denn“.", skill: grammar }
  - { id: a1.m12.obj.wetter, text_vi: "Bạn có thể hiểu và nói về thời tiết và phương hướng.", skill: reading }
  - { id: a1.m12.obj.berichten, text_vi: "Bạn có thể viết ngắn để báo cáo lại thời tiết hoặc một chuyến đi.", skill: writing }
