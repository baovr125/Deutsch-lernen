entries:
  # ---- Bài 1: Ab in den Urlaub! ----
  - { id: a1.m12.v.urlaub, de: "Urlaub", pos: noun, article: der, no_plural: true, vi: "kỳ nghỉ, nghỉ phép", ipa: "/ˈuːɐ̯laʊp/", example: { de: "Im Sommer mache ich zwei Wochen Urlaub.", vi: "Mùa hè tôi nghỉ phép hai tuần." }, usage_vi: "„Urlaub machen“ = đi nghỉ; „im Urlaub“ = trong kỳ nghỉ. „b“ cuối từ đọc /p/.", lesson_refs: [a1.m12.l01] }
  - { id: a1.m12.v.reise, de: "Reise", pos: noun, article: die, plural: "Reisen", vi: "chuyến đi, chuyến du lịch", ipa: "/ˈʁaɪzə/", example: { de: "Die Reise nach Italien dauert drei Tage.", vi: "Chuyến đi Ý kéo dài ba ngày." }, usage_vi: "„eine Reise machen/buchen“. Gần nghĩa: die Fahrt (chuyến đi bằng xe).", lesson_refs: [a1.m12.l01] }
  - { id: a1.m12.v.hotel, de: "Hotel", pos: noun, article: das, plural: "Hotels", vi: "khách sạn", ipa: "/hoˈtɛl/", example: { de: "Wir übernachten im Hotel am Strand.", vi: "Chúng tôi ở khách sạn gần bãi biển." }, usage_vi: "Trọng âm ở âm tiết cuối: hoTEL. Số nhiều: Hotels.", lesson_refs: [a1.m12.l01] }
  - { id: a1.m12.v.koffer, de: "Koffer", pos: noun, article: der, plural: "Koffer", vi: "va li", ipa: "/ˈkɔfɐ/", example: { de: "Mein Koffer ist schwer.", vi: "Va li của tôi nặng." }, usage_vi: "„den Koffer packen“ = sắp xếp va li. Số nhiều không đổi.", lesson_refs: [a1.m12.l01] }
  - { id: a1.m12.v.fahrkarte, de: "Fahrkarte", pos: noun, article: die, plural: "Fahrkarten", vi: "vé tàu xe", ipa: "/ˈfaːɐ̯ˌkaʁtə/", example: { de: "Ich kaufe eine Fahrkarte für den Zug.", vi: "Tôi mua một vé cho chuyến tàu." }, usage_vi: "Vé tàu, xe buýt. Vé máy bay thường gọi là „das Flugticket“.", lesson_refs: [a1.m12.l01] }
  - { id: a1.m12.v.flugzeug, de: "Flugzeug", pos: noun, article: das, plural: "Flugzeuge", vi: "máy bay", ipa: "/ˈfluːkˌʦɔɪk/", example: { de: "Das Flugzeug fliegt um zehn Uhr ab.", vi: "Máy bay cất cánh lúc mười giờ." }, usage_vi: "Từ ghép: fliegen + Zeug. „mit dem Flugzeug“ = bằng máy bay.", lesson_refs: [a1.m12.l01] }
  - { id: a1.m12.v.meer, de: "Meer", pos: noun, article: das, plural: "Meere", vi: "biển", ipa: "/meːɐ̯/", example: { de: "Das Meer ist im Sommer warm.", vi: "Biển mùa hè thì ấm." }, usage_vi: "„am Meer“ = ở biển. „ee“ đọc /eː/.", lesson_refs: [a1.m12.l01] }
  - { id: a1.m12.v.strand, de: "Strand", pos: noun, article: der, plural: "Strände", vi: "bãi biển", ipa: "/ʃtʁant/", example: { de: "Am Strand liegt viel Sand.", vi: "Ở bãi biển có nhiều cát." }, usage_vi: "Số nhiều có Umlaut: Strände. „am Strand“ = ở bãi biển. „st-“ đọc /ʃt/.", lesson_refs: [a1.m12.l01] }
  - { id: a1.m12.v.berg, de: "Berg", pos: noun, article: der, plural: "Berge", vi: "núi", ipa: "/bɛʁk/", example: { de: "Im Winter fahren viele in die Berge.", vi: "Mùa đông nhiều người đi lên núi." }, usage_vi: "„in den Bergen“ = ở vùng núi. „g“ cuối từ đọc /k/.", lesson_refs: [a1.m12.l01] }
  - { id: a1.m12.v.reisen, de: "reisen", pos: verb, forms: { er: "reist", perfekt: "ist gereist" }, vi: "đi du lịch", ipa: "/ˈʁaɪzn̩/", example: { de: "Meine Eltern reisen gern.", vi: "Bố mẹ tôi thích đi du lịch." }, usage_vi: "Động từ chỉ di chuyển nên Perfekt dùng „sein“: ist gereist.", lesson_refs: [a1.m12.l01] }
  - { id: a1.m12.v.fliegen, de: "fliegen", pos: verb, forms: { er: "fliegt", perfekt: "ist geflogen" }, vi: "bay", ipa: "/ˈfliːɡn̩/", example: { de: "Wir fliegen im Juli nach Spanien.", vi: "Tháng Bảy chúng tôi bay đến Tây Ban Nha." }, usage_vi: "Perfekt dùng „sein“: ist geflogen (bất quy tắc).", lesson_refs: [a1.m12.l01] }
  - { id: a1.m12.v.buchen, de: "buchen", pos: verb, forms: { er: "bucht", perfekt: "hat gebucht" }, vi: "đặt (phòng, vé)", ipa: "/ˈbuːxn̩/", example: { de: "Ich buche ein Zimmer im Hotel.", vi: "Tôi đặt một phòng ở khách sạn." }, usage_vi: "Đi với Akkusativ. Perfekt dùng „haben“: hat gebucht.", lesson_refs: [a1.m12.l01] }
  - { id: a1.m12.v.packen, de: "packen", pos: verb, forms: { er: "packt", perfekt: "hat gepackt" }, vi: "đóng gói, sắp xếp hành lý", ipa: "/ˈpakn̩/", example: { de: "Ich packe den Koffer.", vi: "Tôi sắp xếp va li." }, usage_vi: "Hay đi với Koffer, Tasche. Perfekt: hat gepackt.", lesson_refs: [a1.m12.l01] }
  # ---- Bài 2: Städtereise ----
  - { id: a1.m12.v.sehenswuerdigkeit, de: "Sehenswürdigkeit", pos: noun, article: die, plural: "Sehenswürdigkeiten", vi: "danh lam thắng cảnh", ipa: "/ˈzeːənsˌvʏʁdɪçkaɪt/", example: { de: "Berlin hat viele Sehenswürdigkeiten.", vi: "Berlin có nhiều thắng cảnh." }, usage_vi: "Từ dài, đuôi -keit luôn là „die“. Gồm: sehen + würdig + keit.", lesson_refs: [a1.m12.l02] }
  - { id: a1.m12.v.stadtplan, de: "Stadtplan", pos: noun, article: der, plural: "Stadtpläne", vi: "bản đồ thành phố", ipa: "/ˈʃtatˌplaːn/", example: { de: "Ich brauche einen Stadtplan.", vi: "Tôi cần một bản đồ thành phố." }, usage_vi: "Số nhiều có Umlaut: Stadtpläne. Từ ghép: Stadt + Plan.", lesson_refs: [a1.m12.l02] }
  - { id: a1.m12.v.kirche, de: "Kirche", pos: noun, article: die, plural: "Kirchen", vi: "nhà thờ", ipa: "/ˈkɪʁçə/", example: { de: "Die Kirche ist sehr alt.", vi: "Nhà thờ rất cổ." }, usage_vi: "„ch“ sau i đọc /ç/. Số nhiều: Kirchen.", lesson_refs: [a1.m12.l02] }
  - { id: a1.m12.v.schloss, de: "Schloss", pos: noun, article: das, plural: "Schlösser", vi: "lâu đài, cung điện", ipa: "/ʃlɔs/", example: { de: "Das Schloss liegt im Norden der Stadt.", vi: "Lâu đài nằm ở phía bắc thành phố." }, usage_vi: "Số nhiều có Umlaut: Schlösser. Cũng nghĩa là ổ khóa.", lesson_refs: [a1.m12.l02] }
  - { id: a1.m12.v.platz, de: "Platz", pos: noun, article: der, plural: "Plätze", vi: "quảng trường; chỗ ngồi", ipa: "/plats/", example: { de: "Auf dem Platz steht eine Kirche.", vi: "Trên quảng trường có một nhà thờ." }, usage_vi: "Hai nghĩa: quảng trường và chỗ ngồi. Số nhiều: Plätze.", lesson_refs: [a1.m12.l02] }
  - { id: a1.m12.v.uebernachten, de: "übernachten", pos: verb, forms: { er: "übernachtet", perfekt: "hat übernachtet" }, vi: "ngủ lại qua đêm", ipa: "/yːbɐˈnaxtn̩/", example: { de: "Wir übernachten in einem Hotel.", vi: "Chúng tôi nghỉ đêm ở một khách sạn." }, usage_vi: "Tiền tố über- không tách: Partizip II không có ge-: übernachtet.", lesson_refs: [a1.m12.l02] }
  - { id: a1.m12.v.besichtigen, de: "besichtigen", pos: verb, forms: { er: "besichtigt", perfekt: "hat besichtigt" }, vi: "tham quan", ipa: "/bəˈzɪçtɪɡn̩/", example: { de: "Wir besichtigen das Schloss.", vi: "Chúng tôi tham quan lâu đài." }, usage_vi: "be- không tách: Partizip II besichtigt. Dùng cho công trình, tòa nhà.", lesson_refs: [a1.m12.l02] }
  - { id: a1.m12.v.warum, de: "warum", pos: adverb, vi: "tại sao", ipa: "/vaˈʁʊm/", example: { de: "Warum fährst du nicht mit?", vi: "Tại sao bạn không đi cùng?" }, usage_vi: "Từ để hỏi lý do. Có thể trả lời bằng câu với „denn“ hoặc câu đơn.", lesson_refs: [a1.m12.l02] }
  # ---- Bài 3: Wie war's? ----
  - { id: a1.m12.v.ankommen, de: "ankommen", pos: verb, forms: { er: "kommt an", separable: true, perfekt: "ist angekommen" }, vi: "đến nơi", ipa: "/ˈanˌkɔmən/", example: { de: "Der Zug kommt um acht Uhr an.", vi: "Tàu đến lúc tám giờ." }, usage_vi: "Động từ tách; Perfekt dùng „sein“: ist angekommen.", lesson_refs: [a1.m12.l03] }
  - { id: a1.m12.v.abfahren, de: "abfahren", pos: verb, forms: { er: "fährt ab", separable: true, perfekt: "ist abgefahren" }, vi: "khởi hành", ipa: "/ˈapˌfaːʁən/", example: { de: "Der Bus fährt um neun Uhr ab.", vi: "Xe buýt khởi hành lúc chín giờ." }, usage_vi: "Động từ tách; bất quy tắc: er fährt ab. Perfekt: ist abgefahren.", lesson_refs: [a1.m12.l03] }
  - { id: a1.m12.v.einsteigen, de: "einsteigen", pos: verb, forms: { er: "steigt ein", separable: true, perfekt: "ist eingestiegen" }, vi: "lên (xe, tàu)", ipa: "/ˈaɪnˌʃtaɪɡn̩/", example: { de: "Wir steigen in den Zug ein.", vi: "Chúng tôi lên tàu." }, usage_vi: "Trái nghĩa: aussteigen. Dùng „in + Akkusativ“.", lesson_refs: [a1.m12.l03] }
  - { id: a1.m12.v.aussteigen, de: "aussteigen", pos: verb, forms: { er: "steigt aus", separable: true, perfekt: "ist ausgestiegen" }, vi: "xuống (xe, tàu)", ipa: "/ˈaʊsˌʃtaɪɡn̩/", example: { de: "Am Bahnhof steigen wir aus.", vi: "Ở nhà ga chúng tôi xuống." }, usage_vi: "Trái nghĩa: einsteigen.", lesson_refs: [a1.m12.l03] }
  - { id: a1.m12.v.langweilig, de: "langweilig", pos: adjective, vi: "chán, nhàm", ipa: "/ˈlaŋvaɪlɪç/", example: { de: "Der Film war langweilig.", vi: "Bộ phim chán." }, usage_vi: "Trái nghĩa: interessant. Đuôi -ig đọc /ɪç/.", lesson_refs: [a1.m12.l03] }
  - { id: a1.m12.v.interessant, de: "interessant", pos: adjective, vi: "thú vị", ipa: "/ɪntəʁɛˈsant/", example: { de: "Die Stadt war sehr interessant.", vi: "Thành phố rất thú vị." }, usage_vi: "Trọng âm ở âm tiết cuối: interesSANT.", lesson_refs: [a1.m12.l03] }
  - { id: a1.m12.v.anstrengend, de: "anstrengend", pos: adjective, vi: "mệt mỏi, vất vả", ipa: "/ˈanˌʃtʁɛŋənt/", example: { de: "Die Reise war lang und anstrengend.", vi: "Chuyến đi dài và vất vả." }, usage_vi: "Dùng cho công việc, chuyến đi, ngày dài.", lesson_refs: [a1.m12.l03] }
  - { id: a1.m12.v.denn, de: "denn", pos: conjunction, vi: "vì, bởi vì", ipa: "/dɛn/", example: { de: "Ich bleibe zu Hause, denn es regnet.", vi: "Tôi ở nhà vì trời mưa." }, usage_vi: "Giải thích lý do cho mệnh đề trước. Ở vị trí 0: sau „denn“ vẫn chủ ngữ rồi động từ.", lesson_refs: [a1.m12.l03] }
  - { id: a1.m12.v.wie-wars, de: "Wie war's?", pos: phrase, vi: "(Chuyến đi/sự kiện) thế nào?", ipa: "/viː vaːɐ̯s/", example: { de: "Wie war's im Urlaub? – Super!", vi: "Kỳ nghỉ thế nào? – Tuyệt!" }, usage_vi: "Rút gọn của „Wie war es?“. Hỏi cảm nhận về điều đã xảy ra.", lesson_refs: [a1.m12.l03] }
  # ---- Bài 4: Immer dieses Wetter! ----
  - { id: a1.m12.v.wetter, de: "Wetter", pos: noun, article: das, no_plural: true, vi: "thời tiết", ipa: "/ˈvɛtɐ/", example: { de: "Das Wetter ist heute schön.", vi: "Hôm nay thời tiết đẹp." }, usage_vi: "Hỏi: „Wie ist das Wetter?“. „w“ đọc /v/.", lesson_refs: [a1.m12.l04] }
  - { id: a1.m12.v.sonne, de: "Sonne", pos: noun, article: die, no_plural: true, vi: "mặt trời, nắng", ipa: "/ˈzɔnə/", example: { de: "Heute scheint die Sonne.", vi: "Hôm nay trời nắng." }, usage_vi: "„Die Sonne scheint.“ = trời nắng. „s“ đầu từ đọc /z/.", lesson_refs: [a1.m12.l04] }
  - { id: a1.m12.v.regen, de: "Regen", pos: noun, article: der, no_plural: true, vi: "mưa", ipa: "/ˈʁeːɡn̩/", example: { de: "Bei Regen bleiben wir im Hotel.", vi: "Khi mưa chúng tôi ở trong khách sạn." }, usage_vi: "Động từ: regnen. Không dùng số nhiều.", lesson_refs: [a1.m12.l04] }
  - { id: a1.m12.v.schnee, de: "Schnee", pos: noun, article: der, no_plural: true, vi: "tuyết", ipa: "/ʃneː/", example: { de: "Im Winter liegt in den Bergen viel Schnee.", vi: "Mùa đông ở vùng núi có nhiều tuyết." }, usage_vi: "„sch“ đọc /ʃ/; „ee“ đọc /eː/.", lesson_refs: [a1.m12.l04] }
  - { id: a1.m12.v.wolke, de: "Wolke", pos: noun, article: die, plural: "Wolken", vi: "đám mây", ipa: "/ˈvɔlkə/", example: { de: "Am Himmel sind viele Wolken.", vi: "Trên trời có nhiều mây." }, usage_vi: "Số nhiều: Wolken. „viele Wolken“ = nhiều mây.", lesson_refs: [a1.m12.l04] }
  - { id: a1.m12.v.warm, de: "warm", pos: adjective, vi: "ấm", ipa: "/vaʁm/", example: { de: "Im Süden ist es warm.", vi: "Ở miền nam thì ấm." }, usage_vi: "Dùng „es ist warm“ để nói thời tiết.", lesson_refs: [a1.m12.l04] }
  - { id: a1.m12.v.kalt, de: "kalt", pos: adjective, vi: "lạnh", ipa: "/kalt/", example: { de: "Im Winter ist es kalt.", vi: "Mùa đông trời lạnh." }, usage_vi: "Trái nghĩa: warm, heiß.", lesson_refs: [a1.m12.l04] }
  - { id: a1.m12.v.heiss, de: "heiß", pos: adjective, vi: "nóng", ipa: "/haɪs/", example: { de: "Im August ist es oft sehr heiß.", vi: "Tháng Tám trời thường rất nóng." }, usage_vi: "„ß“ đọc /s/. Cũng dùng cho đồ uống nóng.", lesson_refs: [a1.m12.l04] }
  - { id: a1.m12.v.scheinen, de: "scheinen", pos: verb, forms: { er: "scheint", perfekt: "hat geschienen" }, vi: "chiếu sáng", ipa: "/ˈʃaɪnən/", example: { de: "Die Sonne scheint den ganzen Tag.", vi: "Mặt trời chiếu cả ngày." }, usage_vi: "Hay dùng: Die Sonne scheint. Bất quy tắc: hat geschienen.", lesson_refs: [a1.m12.l04] }
  - { id: a1.m12.v.regnen, de: "regnen", pos: verb, forms: { er: "regnet", perfekt: "hat geregnet" }, vi: "mưa", ipa: "/ˈʁeːɡnən/", example: { de: "Es regnet seit gestern.", vi: "Trời mưa từ hôm qua." }, usage_vi: "Chủ ngữ luôn là „es“: Es regnet.", lesson_refs: [a1.m12.l04] }
  - { id: a1.m12.v.norden, de: "Norden", pos: noun, article: der, no_plural: true, vi: "phía bắc", ipa: "/ˈnɔʁdn̩/", example: { de: "Hamburg liegt im Norden von Deutschland.", vi: "Hamburg nằm ở phía bắc nước Đức." }, usage_vi: "„im Norden“ = ở phía bắc.", lesson_refs: [a1.m12.l04] }
  - { id: a1.m12.v.sueden, de: "Süden", pos: noun, article: der, no_plural: true, vi: "phía nam", ipa: "/ˈzyːdn̩/", example: { de: "München liegt im Süden.", vi: "München nằm ở phía nam." }, usage_vi: "„im Süden“ = ở phía nam. „ü“ đọc /yː/.", lesson_refs: [a1.m12.l04] }
  - { id: a1.m12.v.osten, de: "Osten", pos: noun, article: der, no_plural: true, vi: "phía đông", ipa: "/ˈɔstn̩/", example: { de: "Dresden liegt im Osten.", vi: "Dresden nằm ở phía đông." }, usage_vi: "„im Osten“ = ở phía đông.", lesson_refs: [a1.m12.l04] }
  - { id: a1.m12.v.westen, de: "Westen", pos: noun, article: der, no_plural: true, vi: "phía tây", ipa: "/ˈvɛstn̩/", example: { de: "Köln liegt im Westen.", vi: "Köln nằm ở phía tây." }, usage_vi: "„im Westen“ = ở phía tây.", lesson_refs: [a1.m12.l04] }
