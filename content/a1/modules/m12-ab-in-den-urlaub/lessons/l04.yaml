blocks:
  - id: a1.m12.l04.b1
    kind: explanation
    skill: vocabulary
    title_vi: "Bắt đầu: thời tiết và phương hướng"
    body_vi: |
      Hỏi: **Wie ist das Wetter?** Trả lời: **Es ist warm / kalt / heiß. Die Sonne scheint. Es regnet. Es gibt viele Wolken.**
      Phương hướng: **im Norden, im Süden, im Osten, im Westen** (ở phía bắc, nam, đông, tây).
      **Chiến lược khi báo cáo lại một văn bản:** đọc, gạch ba từ khóa, rồi viết 3–4 câu bằng lời của mình.
  - id: a1.m12.l04.b2
    kind: reading
    skill: reading
    title_vi: "Dự báo thời tiết"
    paragraphs:
      - { de: "Das Wetter morgen: Im Norden regnet es und es ist kalt.", vi: "Thời tiết ngày mai: ở phía bắc mưa và lạnh." }
      - { de: "Im Süden scheint die Sonne und es ist warm.", vi: "Ở phía nam nắng và ấm." }
      - { de: "Im Osten und im Westen gibt es viele Wolken.", vi: "Ở phía đông và phía tây có nhiều mây." }
  - id: a1.m12.l04.b3
    kind: dialogue
    skill: speaking
    title_vi: "Hội thoại: Nhắn tin hỏi thời tiết"
    lines:
      - { speaker: "Jana", de: "Wie ist das Wetter bei euch im Norden?", vi: "Ở chỗ các bạn phía bắc thời tiết thế nào?" }
      - { speaker: "Paul", de: "Immer dieses Wetter! Es regnet schon drei Tage.", vi: "Lại cái thời tiết này! Mưa đã ba ngày rồi." }
      - { speaker: "Jana", de: "Bei uns im Süden scheint die Sonne. Kommt doch zu uns!", vi: "Ở chỗ mình phía nam thì nắng. Hay là đến chỗ mình đi!" }
      - { speaker: "Paul", de: "Gute Idee! Am Wochenende fahren wir los.", vi: "Ý hay! Cuối tuần chúng mình lên đường." }
  - id: a1.m12.l04.b4
    kind: pronunciation
    skill: pronunciation
    title_vi: "Phát âm: f, v, w"
    body_vi: |
      • **f** luôn đọc /f/: *Fahrkarte, Flugzeug.* • **v** trong từ gốc Đức thường đọc /f/: *Vater, viel.* • **w** luôn đọc /v/: *Wetter, Wolke, Westen.* • **v** trong từ mượn nước ngoài đọc /v/: *Vase, Visum.*
      Mẹo: **Wetter** bắt đầu bằng /v/, **Vater** bắt đầu bằng /f/.
    items:
      - { de: "Fahrkarte", ipa: "/ˈfaːɐ̯ˌkaʁtə/", note_vi: "f → /f/" }
      - { de: "Vater", ipa: "/ˈfaːtɐ/", note_vi: "v ở từ gốc Đức → /f/" }
      - { de: "Wetter", ipa: "/ˈvɛtɐ/", note_vi: "w → /v/" }
      - { de: "Wolke", ipa: "/ˈvɔlkə/", note_vi: "w → /v/" }
      - { de: "Westen", ipa: "/ˈvɛstn̩/", note_vi: "w → /v/" }
  - id: a1.m12.l04.b5
    kind: culture
    skill: reading
    title_vi: "Landeskunde: Reiseziele in Deutschland"
    body_vi: |
      **Im Norden:** Nordsee und Ostsee, Hamburg. **Im Süden:** Alpen und München. **Im Osten:** Dresden, Berlin. **Im Westen:** Rhein và Köln. Nhiều người Đức nghỉ hè ở biển hoặc ở vùng núi, và đi thành phố vào cuối tuần.
