exercises:
- id: a1.m04.l02.ex.01
  type: multiple-choice
  skill: grammar
  difficulty: 1
  objective_refs:
  - a1.m04.l02.obj2
  instructions_vi: Chọn dạng mạo từ Akkusativ đúng điền vào chỗ trống.
  items:
  - id: a1.m04.l02.ex.01.q1
    prompt: Wir brauchen ___ (der) Salat für die Party.
    options:
    - id: a
      text: die
    - id: b
      text: das
    - id: c
      text: der
    - id: d
      text: den
    answer:
    - d
    explanation_vi: der Salat là giống đực, ở cách Akkusativ sau brauchen đổi thành den.
  - id: a1.m04.l02.ex.01.q2
    prompt: Ich bringe ___ (ein) Kuchen mit.
    options:
    - id: a
      text: einen
    - id: b
      text: eine
    - id: c
      text: ein
    - id: d
      text: kein
    answer:
    - a
    explanation_vi: der Kuchen là giống đực, ở Akkusativ dùng einen.
  - id: a1.m04.l02.ex.01.q3
    prompt: Hast du ___ (das) Hähnchen gekauft?
    options:
    - id: a
      text: dem
    - id: b
      text: die
    - id: c
      text: das
    - id: d
      text: den
    answer:
    - c
    explanation_vi: das Hähnchen là giống trung, ở Akkusativ vẫn giữ nguyên là das.
- id: a1.m04.l02.ex.02
  type: fill-blank
  skill: grammar
  difficulty: 1
  objective_refs:
  - a1.m04.l02.obj3
  instructions_vi: Điền dạng chia đúng của động từ essen (e → i).
  items:
  - id: a1.m04.l02.ex.02.q1
    prompt: Was ___ (essen) du gern? – Ich esse gern Pizza.
    answers:
    - isst
    explanation_vi: Ngôi du chia là du isst (e đổi thành i).
  - id: a1.m04.l02.ex.02.q2
    prompt: Peter ___ (essen) kein Schweinefleisch.
    answers:
    - isst
    explanation_vi: Ngôi er (Peter) chia là er isst.
  - id: a1.m04.l02.ex.02.q3
    prompt: Wir ___ (essen) heute zusammen zu Abend.
    answers:
    - essen
    explanation_vi: 'Ngôi số nhiều wir chia theo nguyên mẫu: wir essen.'
- id: a1.m04.l02.ex.03
  type: multiple-choice
  skill: listening
  difficulty: 2
  objective_refs:
  - a1.m04.l02.obj1
  instructions_vi: Nghe hội thoại và chọn thông tin đúng.
  stimulus:
    ref: a1.m04.l02.b5
  items:
  - id: a1.m04.l02.ex.03.q1
    prompt: Wie viele Personen kommen zur Grillparty?
    options:
    - id: a
      text: acht Personen
    - id: b
      text: vier Personen
    - id: c
      text: zehn Personen
    - id: d
      text: zwei Personen
    answer:
    - a
    explanation_vi: 'Ben nói: ''Am Samstag kommen acht Leute zur Grillparty''.'
  - id: a1.m04.l02.ex.03.q2
    prompt: Was bringt Laura mit?
    options:
    - id: a
      text: Apfelsaft und Brot
    - id: b
      text: Salat und Wasser
    - id: c
      text: nur Kuchen
    - id: d
      text: Fleisch und Würste
    answer:
    - a
    explanation_vi: 'Laura nói: ''Klar, ich bringe Apfelsaft und ein Brot mit''.'
- id: a1.m04.l02.ex.04
  type: true-false
  skill: listening
  difficulty: 2
  objective_refs:
  - a1.m04.l02.obj1
  instructions_vi: Nghe lại và xác định câu sau là Đúng hay Sai.
  stimulus:
    ref: a1.m04.l02.b5
  items:
  - id: a1.m04.l02.ex.04.q1
    prompt: Ben kauft den Salat und Wasser im Supermarkt.
    answer: true
    explanation_vi: 'Ben nói: ''ich kaufe den Salat und Wasser im Supermarkt''.'
  - id: a1.m04.l02.ex.04.q2
    prompt: Sie haben noch kein Fleisch zu Hause.
    answer: false
    explanation_vi: 'Sai, Laura nói: ''Wir haben schon Fleisch und Würste''.'
- id: a1.m04.l02.ex.05
  type: matching
  skill: reading
  difficulty: 2
  objective_refs:
  - a1.m04.l02.obj1
  instructions_vi: Nối người tham gia với phản hồi của họ trong nhóm chat.
  stimulus:
    ref: a1.m04.l02.b6
  items:
  - id: a1.m04.l02.ex.05.q1
    pairs:
    - left: Sarah
      right: mang salad khoai tây đến
    - left: Felix
      right: mang nước lọc và nước ép đến
    - left: Tim
      right: bận đi làm, không thể đến dự
    - left: Ben
      right: người tổ chức bữa tiệc nướng
    explanation_vi: Nội dung phản hồi của các thành viên trong nhóm chat.
- id: a1.m04.l02.ex.06
  type: word-order
  skill: speaking
  difficulty: 2
  objective_refs:
  - a1.m04.l02.obj2
  instructions_vi: Sắp xếp các từ thành câu hoàn chỉnh với tân ngữ Akkusativ.
  items:
  - id: a1.m04.l02.ex.06.q1
    tokens:
    - mit
    - Ich
    - Kuchen
    - bringe
    - einen
    answer: Ich bringe einen Kuchen mit.
    prompt_vi: 'Sắp xếp câu: Ich / einen / mit / bringe / Kuchen .'
    explanation_vi: Ich (chủ ngữ) + bringe (động từ vị trí 2) + einen Kuchen (tân ngữ Akkusativ) + mit (tiền tố tách ở cuối câu).
- id: a1.m04.l02.ex.07
  type: fill-blank
  skill: writing
  difficulty: 2
  objective_refs:
  - a1.m04.l02.obj4
  instructions_vi: Điền nguyên âm biến âm ä, ö hoặc ü vào từ còn thiếu.
  items:
  - id: a1.m04.l02.ex.07.q1
    prompt: Das Essen schmeckt s___ß. (süß)
    answers:
    - ü
    explanation_vi: süß = ngọt.
  - id: a1.m04.l02.ex.07.q2
    prompt: Wir brauchen noch etwas ___l für den Salat. (Öl)
    answers:
    - Ö
    explanation_vi: das Öl = dầu ăn.
  - id: a1.m04.l02.ex.07.q3
    prompt: Am Wochenende grillen wir ein H___hnchen. (Hähnchen)
    answers:
    - ä
    explanation_vi: das Hähnchen = con gà.
