summary_vi: 'Chủ đề ẩm thực, ăn uống và mua bán hàng ngày: gọi tên các loại thực phẩm và cửa hàng thực phẩm, cách Akkusativ (đối cách), đơn vị đo lường và giá cả, mời mọc và các câu giao tiếp lịch sự tại bàn ăn, động từ möchten và mögen, các bữa ăn trong ngày và hiện tượng đảo ngữ, chiến lược học từ vựng và các nghề nghiệp ẩm thực.'
