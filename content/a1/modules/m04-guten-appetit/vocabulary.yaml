    er: kauft ein
    separable: true
  ipa: /ˈaɪ̯nˌkaʊ̯fn̩/
  example:
    de: Am Samstag kaufe ich ein.
    vi: Thứ Bảy tôi đi chợ/mua sắm.
  usage_vi: 'Động từ tách: ein ở cuối câu. So sánh: kaufen + vật cụ thể; einkaufen = đi mua sắm nói chung.'
  lesson_refs:
  - a1.m04.l01
  tags:
  - verb
  - einkaufen
  - trennbar
  source: nwn-lern
