summary_vi: Bài học giúp bạn thành thạo cách biểu đạt đơn vị đo lường (Kilo, Gramm, Liter, Packung...), hỏi và đọc giá tiền chuẩn bằng Euro và Cent, tự tin trò chuyện tại quầy tính tiền và chia động từ bất quy tắc nehmen (du nimmst, er nimmt).
self_check:
- Tôi có thể đọc lưu loát các mức giá tiền như 1,99 € hoặc 2,50 € bằng tiếng Đức.
- 'Tôi nhớ chia động từ nehmen: du nimmst, er nimmt.'
- Tôi biết dùng các đơn vị khối lượng như Gramm, Kilo, Liter khi mua sắm đồ ăn.
blocks:
- id: a1.m04.l03.b1
  kind: explanation
  title_vi: Giới thiệu bài học
  body_vi: 'Đi siêu thị hoặc đi chợ là một trải nghiệm thực tế không thể thiếu khi bạn sống, học tập hoặc du lịch tại Đức, Áo, Thụy Sĩ:

    - Bạn sẽ học cách hỏi khối lượng và số lượng: *ein Kilo Äpfel, 200 Gramm Käse, ein Liter Milch, eine Packung Reis, zwei Flaschen Wasser, ein Stück Kuchen*.

    - Cách hỏi và đọc chuẩn giá tiền bằng Euro và Cent: *Was kostet das? – Das kostet 1 Euro 99.*

    - Học các mẫu câu mua bán phổ biến nhất: *Ich nehme ..., Ich möchte ..., Sonst noch etwas? – Nein, das ist alles.*

    - Chia động từ bất quy tắc đặc biệt: *nehmen* (*du nimmst, er nimmt*).'
- id: a1.m04.l03.b2
  kind: explanation
  title_vi: Động từ bất quy tắc nehmen (lấy, chọn mua)
  skill: grammar
  body_vi: 'Động từ nehmen đổi nguyên âm e → i ở ngôi số ít du và er/sie/es. Ngoài ra, phụ âm h mất đi và gấp đôi phụ âm m: du nimmst, er/sie/es nimmt. Động từ này đi với tân ngữ Akkusativ.'
  examples:
  - de: Was nimmst du? – Ich nehme ein Kilo Tomaten.
    vi: Bạn chọn mua gì? – Tôi lấy một ký cà chua.
  - de: Er nimmt zwei Flaschen Mineralwasser.
    vi: Anh ấy lấy hai chai nước khoáng.
- id: a1.m04.l03.b3
  kind: explanation
  title_vi: Cách đọc giá tiền trong tiếng Đức
  skill: grammar
  body_vi: 'Trong tiếng Đức, dấu phẩy (Komma) được dùng làm dấu phân cách thập phân. Khi đọc giá tiền, ta chèn chữ ''Euro'' vào vị trí dấu phẩy: 1,99 € đọc là ''ein Euro neunundneunzig'' (hoặc nói tắt ''eins neunundneunzig''). Dưới 1 Euro đọc theo Cent: 0,79 € = ''neunundsiebzig Cent''.'
  examples:
  - de: Das Brot kostet 2,40 € (zwei Euro vierzig).
    vi: Ổ bánh mì có giá 2 euro 40 xu.
  - de: Die Banane kostet 45 Cent.
    vi: Quả chuối có giá 45 xu.
- id: a1.m04.l03.b4
  kind: pronunciation
  title_vi: Ngữ điệu và cách đọc giá tiền
  skill: pronunciation
  body_vi: 'Ngữ điệu và cách đọc giá tiền


    Khi đọc giá tiền có Euro và Cent, nhấn nhẹ vào số Euro và số Cent, không ngắt quãng quá lâu ở chữ Euro: zwei Euro FÜNF-zig, drei Euro NEUN-und-neun-zig.


    Luyện tập: Luyện đọc to các mức giá: 0,80 € (achtzig Cent), 2,15 € (zwei Euro fünfzehn), 5,49 € (fünf Euro neunundvierzig).'
  items:
  - de: 1,50 € – ein Euro fünfzig
    vi: 1 euro 50 xu
  - de: 3,99 € – drei Euro neunundneunzig
    vi: 3 euro 99 xu
- id: a1.m04.l03.b5
  kind: examples
  title_vi: Câu ví dụ
  examples:
  - de: Ich nehme bitte ein Kilo Bananen und eine Flasche Milch.
    vi: Cho tôi một ký chuối và một chai sữa.
  - de: Wie viel kosten die Tomaten? – Sie kosten 1,80 Euro pro Kilo.
    vi: Những quả cà chua này giá bao nhiêu? – Chúng có giá 1,80 euro mỗi ký.
  - de: Brauchen Sie eine Tüte? – Nein danke, ich habe eine Tasche.
    vi: Quý khách có cần túi không? – Dạ không, tôi có túi riêng rồi.
  - de: Können Sie bitte wechseln? Ich habe nur einen Fünfzig-Euro-Schein.
    vi: Anh/chị có thể đổi tiền giúp tôi được không? Tôi chỉ có tờ 50 euro.
  - de: Hier ist Ihr Kassenzettel. Einen schönen Tag noch!
    vi: Hóa đơn của quý khách đây ạ. Chúc quý khách một ngày tốt lành!
- id: a1.m04.l03.b6
  kind: listening
  title_vi: Hội thoại mua sắm tại chợ nông sản (Wochenmarkt)
  lines:
  - speaker: Verkäufer
    de: Guten Tag! Was darf es sein?
    vi: Xin chào! Bà muốn mua gì ạ?
  - speaker: Frau Weber
    de: Guten Tag! Ich möchte ein Kilo Äpfel und 300 Gramm Käse, bitte.
    vi: Xin chào! Cho tôi một ký táo và 300 gam phô mai.
  - speaker: Verkäufer
    de: Sehr gerne. Hier sind die Äpfel und der Käse. Möchten Sie sonst noch etwas?
    vi: Rất sẵn lòng. Táo và phô mai của bà đây. Bà còn muốn gì nữa không ạ?
  - speaker: Frau Weber
    de: Ja, ich nehme noch eine Packung Erdbeeren. Wie viel kostet das zusammen?
    vi: Có, tôi lấy thêm một hộp dâu tây nữa. Tổng cộng hết bao nhiêu vậy chú?
  - speaker: Verkäufer
    de: Das macht genau sieben Euro fünfzig, bitte.
    vi: Dạ tổng cộng đúng 7 euro 50 xu ạ.
  audio_status: pending-tts
  situation_vi: Frau Weber mua hoa quả và phô mai tại một quầy hàng ở chợ.
  skill: listening
  audio:
    speed: normal
