      TIỀN THỐI LẠI:               0,96 EUR

      Cảm ơn quý khách đã mua sắm!'
  text_type_vi: Hóa đơn mua hàng (Kassenzettel)
  skill: reading
  glossary:
  - de: die Gesamtsumme
    vi: tổng số tiền
  - de: das Rückgeld
    vi: tiền thối lại
- id: a1.m04.l03.b8
  kind: speaking
  title_vi: Đóng vai người mua và người bán hàng
  skill: speaking
  task_vi: Thực hành đoạn hội thoại mua bán thực phẩm tại quầy hàng với bạn học.
  steps_vi:
  - 'Chào hỏi: Guten Tag! Was möchten Sie?'
  - 'Chọn đồ: Ich möchte / Ich nehme ein Kilo ... und zwei Flaschen ...'
  - 'Hỏi giá: Wie viel kostet das?'
  - 'Thanh toán: Das macht zusammen ... Euro.'
  lines:
  - speaker: Verkäufer
    de: Guten Tag! Was kann ich für Sie tun?
    vi: Xin chào! Tôi có thể giúp gì cho bạn?
  - speaker: Kunde
    de: Ich nehme ein Kilo Bananen und eine Flasche Orangensaft. Was kostet das?
    vi: Tôi lấy một ký chuối và một chai nước cam. Hết bao nhiêu tiền ạ?
  - speaker: Verkäufer
    de: Das macht zusammen drei Euro achtzig.
    vi: Tổng cộng là 3 euro 80 xu ạ.
- id: a1.m04.l03.b9
  kind: writing
  title_vi: Viết đoạn hội thoại mua hàng tại siêu thị
  skill: writing
  task_vi: Viết một đoạn hội thoại mua bán ngắn (4–6 lượt lời) giữa bạn và nhân viên bán hàng bao gồm lượng hàng và giá tiền.
  model:
    de: – Guten Tag! Ich möchte 300 Gramm Käse und ein Kilo Äpfel, bitte. – Sonst noch etwas? – Nein danke, das ist alles. Was kostet das? – Das macht vier Euro fünfzig. – Hier bitte, fünf Euro. – Und fünfzig Cent zurück. Danke!
    vi: – Xin chào! Cho tôi 300 gam phô mai và một ký táo. – Còn gì nữa không ạ? – Dạ không, thế là hết rồi. Hết bao nhiêu ạ? – Tổng cộng là 4 euro 50 xu. – Gửi bạn 5 euro này. – Và trả lại bạn 50 xu. Cảm ơn!
  checklist_vi:
  - Có sử dụng ít nhất hai đơn vị đo lường (Gramm, Kilo, Liter, Packung...).
  - Có câu hỏi giá (Was kostet das?) và nêu số tiền bằng Euro/Cent.
