      ------------------------------------

      1x Sữa tươi hữu cơ 1L        1,19 EUR

      1x Bánh mì truyền thống 500g 2,49 EUR

      2x Thanh sô-cô-la            2,38 EUR

      1kg Táo giống Elstar         2,29 EUR

      1x Nước khoáng 1,5L          0,69 EUR

      ------------------------------------

