- id: a1.m04.review.b1
  kind: explanation
  title_vi: Giới thiệu bài học
  body_vi: '**Chúc mừng bạn đã hoàn thành trọn vẹn 6 bài học của Kapitel 4: Guten Appetit!**

    Bài học tổng kết này được thiết kế để:

    - Hệ thống hóa toàn bộ các mẫu câu giao tiếp quan trọng nhất (Redemittel) về mua bán và ăn uống.

    - Tóm tắt cô đọng 3 trụ cột ngữ pháp của chương: Cách Akkusativ, cặp động từ *möchten / mögen*, và quy tắc đảo ngữ V2 (*Inversion*).

    - Đánh giá năng lực toàn diện của bạn qua bài kiểm tra 4 kỹ năng (Nghe, Đọc, Viết, Nói) theo chuẩn CEFR A1.'
- id: a1.m04.review.b2
  kind: explanation
  title_vi: Bảng tổng hợp ngữ pháp Kapitel 4
  skill: grammar
  body_vi: '**1. Akkusativ (chỉ giống đực biến đổi):**

    - der Apfel → Ich brauche **den** Apfel.

    - ein Apfel → Ich esse **einen** Apfel.

    - kein Apfel → Ich habe **keinen** Apfel.

    - Giống trung (das/ein), cái (die/eine), số nhiều (die/–) giữ nguyên như Nominativ.


    **2. möchten và mögen:**

    - *möchten*: ich möchte, du möchtest, er möchte, wir möchten, ihr möchtet, sie möchten.

    - *mögen*: ich mag, du magst, er mag, wir mögen, ihr mögt, sie mögen.


    **3. Inversion (Trật tự từ):**

    - *Normal:* Ich frühstücke morgens um sieben Uhr.

    - *Inversion:* **Morgens** (1) **frühstücke** (2) **ich** (3) um sieben Uhr.

    '
  examples:
  - de: Morgens esse ich einen Apfel und trinke einen Kaffee.
    vi: Buổi sáng tôi ăn một quả táo và uống một ly cà phê.
  - de: Er mag keinen Fisch, aber er möchte einen Salat probieren.
    vi: Anh ấy không thích cá, nhưng anh ấy muốn nếm thử món salad.
- id: a1.m04.review.b3
  kind: pronunciation
  title_vi: 'Tổng ôn phát âm: Nguyên âm Umlaut và ngữ điệu giá tiền'
  skill: pronunciation
  body_vi: 'Tổng ôn phát âm: Nguyên âm Umlaut và ngữ điệu giá tiền


    Phát âm chuẩn xác ä, ö, ü trong các từ vựng ẩm thực quen thuộc và đọc lưu loát giá tiền bằng Euro và Cent.


    Luyện tập: Luyện đọc: ein Hähnchen, zwei Brötchen, süßes Obst, 3 Euro 40.'
  items:
  - de: das Hähnchen, das Öl, das Gemüse
    vi: con gà, dầu ăn, rau củ
  - de: 2,50 € = zwei Euro fünfzig
    vi: 2 euro 50 xu
- id: a1.m04.review.b4
  kind: examples
  title_vi: Câu ví dụ
  examples:
  - de: Wir kaufen das Gemüse im Supermarkt und das Brot in der Bäckerei.
    vi: Chúng tôi mua rau củ ở siêu thị và bánh mì ở tiệm bánh.
  - de: Ich brauche einen Kuchen und eine Flasche Orangensaft für die Party.
    vi: Tôi cần một cái bánh ngọt và một chai nước cam cho bữa tiệc.
  - de: Zum Frühstück esse ich immer ein Ei und trinke Tee.
    vi: Cho bữa sáng, tôi luôn ăn một quả trứng và uống trà.
  - de: Möchten Sie noch etwas probieren? – Nein danke, ich bin wirklich satt.
    vi: Quý khách có muốn thử thêm món gì không? – Dạ thôi cảm ơn, tôi thực sự no rồi.
- id: a1.m04.review.b5
  kind: listening
  title_vi: 'Kiểm tra nghe hiểu: Đi siêu thị và ăn tối'
  lines:
  - speaker: David
    de: Hallo Sandra! Was brauchen wir noch für das Abendessen?
    vi: Chào Sandra! Chúng ta còn cần gì cho bữa tối nữa?
  - speaker: Sandra
    de: Wir haben schon Fleisch und Reis. Aber wir brauchen noch einen Salat, zwei Tomaten und eine Flasche Mineralwasser.
    vi: Chúng ta có thịt và cơm rồi. Nhưng chúng ta vẫn cần thêm một món salad, hai quả cà chua và một chai nước khoáng.
  - speaker: David
    de: Alles klar, das kaufe ich schnell im Supermarkt. Was möchtest du später trinken?
    vi: Rõ rồi, anh sẽ mua nhanh ở siêu thị. Tí nữa em muốn uống gì?
  - speaker: Sandra
    de: Ich möchte einen Apfelsaft, bitte! Und bring bitte auch einen Schokoladenkuchen mit!
    vi: Em muốn một ly nước ép táo nhé! Và anh mang thêm một cái bánh sô-cô-la về nữa nhé!
  audio_status: pending-tts
  situation_vi: Hai người bạn cùng nhau lên danh sách mua đồ và chuẩn bị bữa tối.
  skill: listening
  audio:
    speed: normal
- id: a1.m04.review.b6
  kind: reading
  title_vi: 'Kiểm tra đọc hiểu: Thực đơn và văn hóa ẩm thực'
  paragraphs:
  - de: 'Tagesmenü im Restaurant „Zum Goldenen Apfel“:

      - Vorspeise: Frische Tomatensuppe mit Brötchen (3,50 EUR)

      - Hauptgericht 1: Gegrilltes Hähnchen mit Pommes frites und Salat (8,90 EUR)

      - Hauptgericht 2: Frischer Fisch mit Reis und Gemüse (9,50 EUR)

      - Nachspeise: Apfelkuchen mit Sahne (2,80 EUR)

      - Getränke: Mineralwasser 0,5L (2,00 EUR), Apfelsaft (2,50 EUR), Kaffee (2,20 EUR)

      Hinweis: Alle Gerichte kocht unser Küchenchef frisch für Sie. Guten Appetit!'
    vi: 'Thực đơn trong ngày tại nhà hàng ''Quả Táo Vàng'':

      - Khai vị: Súp cà chua tươi kèm bánh mì nhỏ (3,50 EUR)

      - Món chính 1: Gà nướng kèm khoai tây chiên và salad (8,90 EUR)

      - Món chính 2: Cá tươi kèm cơm và rau củ (9,50 EUR)

      - Tráng miệng: Bánh táo kèm kem tươi (2,80 EUR)

      - Đồ uống: Nước khoáng 0,5L (2,00 EUR), Nước táo (2,50 EUR), Cà phê (2,20 EUR)

      Ghi chú: Mọi món ăn đều do bếp trưởng của chúng tôi nấu tươi phục vụ quý khách. Chúc ngon miệng!'
  text_type_vi: Thực đơn và bài viết văn hóa (Menükarte)
  skill: reading
  glossary:
  - de: die Vorspeise
    vi: món khai vị
  - de: das Hauptgericht
    vi: món chính
  - de: die Nachspeise
    vi: món tráng miệng
- id: a1.m04.review.b7
  kind: speaking
  title_vi: 'Kiểm tra nói: Gọi món và giao tiếp tại nhà hàng'
  skill: speaking
  task_vi: 'Thực hành gọi món tại nhà hàng: chào hỏi, gọi món chính và đồ uống với möchten, chúc ngon miệng.'
  steps_vi:
  - 'Gọi món: Ich möchte bitte ... und ...'
  - 'Hỏi giá: Was kostet das zusammen?'
  - 'Chúc ngon miệng: Guten Appetit!'
  lines:
  - speaker: Kellner
    de: Guten Tag! Was möchten Sie bestellen?
    vi: Xin chào! Quý khách muốn gọi món gì ạ?
  - speaker: Gast
    de: Ich möchte ein Hähnchen mit Pommes frites und einen Apfelsaft, bitte.
    vi: Cho tôi một phần gà với khoai tây chiên và một ly nước ép táo.
  - speaker: Kellner
    de: Sehr gerne! Guten Appetit!
    vi: Rất sẵn lòng ạ! Chúc quý khách ngon miệng!
- id: a1.m04.review.b8
  kind: writing
  title_vi: 'Kiểm tra viết: Kể về thói quen ăn uống của bản thân'
  skill: writing
  task_vi: Viết đoạn văn ngắn 5–6 câu mô tả thói quen ăn uống một ngày của bạn, sử dụng các cấu trúc Akkusativ, Inversion và động từ möchten/mögen.
  model:
    de: Morgens trinke ich einen Kaffee und esse ein Brötchen mit Butter. Mittags esse ich mit Kollegen in der Kantine. Ich mag Fisch und Salat sehr. Abends koche ich oft Gemüsesuppe. Zum Trinken möchte ich am Abend nur Wasser. Kochen macht mir großen Spaß!
    vi: Buổi sáng tôi uống cà phê và ăn một cái bánh mì nhỏ với bơ. Buổi trưa tôi ăn cùng đồng nghiệp ở căng-tin. Tôi rất thích cá và salad. Buổi tối tôi thường nấu súp rau củ. Để uống vào buổi tối tôi chỉ muốn uống nước lọc. Nấu ăn mang lại niềm vui lớn cho tôi!
  checklist_vi:
  - Dùng đúng mạo từ Akkusativ (einen Kaffee, einen Salat...).
  - Có câu đảo ngữ (Morgens trinke ich..., Mittags esse ich...).
  - Sử dụng đúng möchten và mögen.
