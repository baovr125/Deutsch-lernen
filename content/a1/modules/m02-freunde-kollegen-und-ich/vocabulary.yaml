entries:
- id: a1.m02.v.gern
  de: gern
  pos: adverb
  vi: thích (làm gì); sẵn lòng
  ipa: /ɡɛʁn/
  example:
    de: Ich koche gern.
    vi: Tôi thích nấu ăn.
  usage_vi: 'Tiếng Đức nói “thích” bằng ĐỘNG TỪ + gern: Ich tanze gern. Phủ định: nicht gern. Mức độ: sehr gern > gern > nicht so gern > nicht gern.'
  lesson_refs:
  - a1.m02.l01
  tags:
  - hobby
  - grammatik-hinweis
  source: nwn-lern
- id: a1.m02.v.leute
  de: Leute
  pos: noun
  article: die
  no_plural: true
  vi: mọi người, người ta
  ipa: /ˈlɔʏ̯tə/
  example:
    de: Hallo, Leute!
    vi: Chào mọi người!
  usage_vi: 'Chỉ có dạng số nhiều. Không dùng cho một người (một người: die Person).'
  lesson_refs:
  - a1.m02.l01
  tags:
  - person
  - pl-only
  source: nwn-lern
- id: a1.m02.v.fotografieren
  de: fotografieren
  pos: verb
  vi: chụp ảnh
  forms:
    text: du fotografierst, er fotografiert
    er: fotografiert
  ipa: /fotoɡʁaˈfiːʁən/
  example:
    de: Ich fotografiere gern.
    vi: Tôi thích chụp ảnh.
  usage_vi: 'Động từ -ieren: nhấn vào “ie”.'
  lesson_refs:
  - a1.m02.l01
  tags:
  - hobby
  - verb
  source: nwn-lern
- id: a1.m02.v.freund
  de: Freund
  pos: noun
  article: der
  plural: Freunde
  vi: người bạn (nam); bạn trai
  ipa: /fʁɔʏ̯nt/
  example:
    de: Das ist mein Freund Paul.
    vi: Đây là bạn tôi, Paul.
  usage_vi: 'Từ nhiều nghĩa: “mein Freund” có thể là bạn trai. Muốn nói rõ “một người bạn” có thể dùng: ein Freund von mir.'
  lesson_refs:
  - a1.m02.l01
  tags:
  - person
  - mehrdeutig
  source: nwn-lern
- id: a1.m02.v.freundin
  de: Freundin
  pos: noun
  article: die
  plural: Freundinnen
  vi: người bạn (nữ); bạn gái
  ipa: /ˈfʁɔʏ̯ndɪn/
  example:
    de: Meine Freundin heißt Lisa.
    vi: Bạn gái tôi / bạn tôi tên là Lisa.
  usage_vi: Từ nhiều nghĩa giống Freund. Số nhiều -innen.
  lesson_refs:
  - a1.m02.l01
  tags:
  - person
  - mehrdeutig
  source: nwn-lern
- id: a1.m02.v.joggen
  de: joggen
  pos: verb
  vi: chạy bộ
  forms:
    text: du joggst, er joggt
    er: joggt
  ipa: /ˈdʒɔɡn̩/
  example:
    de: Wir joggen am Sonntag.
    vi: Chúng tôi chạy bộ vào Chủ nhật.
  usage_vi: Mượn từ tiếng Anh, j đọc [dʒ] như tiếng Anh.
  lesson_refs:
  - a1.m02.l01
  tags:
  - hobby
  - sport
  - verb
  source: nwn-lern
- id: a1.m02.v.kollege
  de: Kollege
  pos: noun
  article: der
  plural: Kollegen
  vi: đồng nghiệp (nam)
  ipa: /kɔˈleːɡə/
  example:
    de: Das ist mein Kollege Tom.
    vi: Đây là đồng nghiệp của tôi, Tom.
  usage_vi: 'Số nhiều -n: die Kollegen. Trọng âm: kol-LE-ge.'
  lesson_refs:
  - a1.m02.l01
  tags:
  - person
  - arbeit
  source: nwn-lern
- id: a1.m02.v.kollegin
  de: Kollegin
  pos: noun
  article: die
  plural: Kolleginnen
  vi: đồng nghiệp (nữ)
  ipa: /kɔˈleːɡɪn/
  example:
    de: Meine Kollegin kommt aus Polen.
    vi: Đồng nghiệp của tôi đến từ Ba Lan.
  usage_vi: 'Dạng nữ của der Kollege: thêm -in, số nhiều -innen. Dùng cho đồng nghiệp cùng nơi làm việc.'
  lesson_refs:
  - a1.m02.l01
  tags:
  - person
  - arbeit
  source: nwn-lern
- id: a1.m02.v.singen
  de: singen
  pos: verb
  vi: hát
  forms:
    text: du singst, er singt
    er: singt
  ipa: /ˈzɪŋən/
  example:
    de: Sie singt sehr gern.
    vi: Cô ấy rất thích hát.
  usage_vi: ng đọc [ŋ], không có âm g phía sau.
  lesson_refs:
  - a1.m02.l01
  tags:
  - hobby
  - musik
  - verb
  source: nwn-lern
- id: a1.m02.v.tanzen
  de: tanzen
  pos: verb
  vi: nhảy, khiêu vũ
  forms:
    text: du tanzt, er tanzt
    er: tanzt
  ipa: /ˈtantsn̩/
  example:
    de: Tanzt du gern?
    vi: Bạn có thích nhảy không?
  usage_vi: Gốc tận cùng bằng z → du tanzt (chỉ thêm -t).
  lesson_refs:
  - a1.m02.l01
  tags:
  - hobby
  - verb
  source: nwn-lern
- id: a1.m02.v.gehen
  de: gehen
  pos: verb
  vi: đi (bộ); đi (đến đâu)
  forms:
    text: du gehst, er geht
    er: geht
  ipa: /ˈɡeːən/
  example:
    de: Ich gehe gern ins Kino.
    vi: Tôi thích đi xem phim.
  usage_vi: Đã gặp trong “Wie geht's?”. gehen + ins Kino/ins Café = đi xem phim/đi cà phê. Đi bằng xe dùng fahren (bài 2).
  lesson_refs:
  - a1.m02.l01
  tags:
  - verb
  - freizeit
  - mehrdeutig
  source: nwn-lern
- id: a1.m02.v.kino
  de: Kino
  pos: noun
  article: das
  plural: Kinos
  vi: rạp chiếu phim
  ipa: /ˈkiːno/
  example:
    de: Gehen wir ins Kino?
    vi: Chúng ta đi xem phim nhé?
  usage_vi: 'ins = in das: ins Kino.'
  lesson_refs:
  - a1.m02.l01
  tags:
  - ort
  - freizeit
  source: nwn-lern
- id: a1.m02.v.kochen
  de: kochen
  pos: verb
  vi: nấu ăn
  forms:
    text: du kochst, er kocht
    er: kocht
  ipa: /ˈkɔxn̩/
  example:
    de: Er kocht gern Spaghetti.
    vi: Anh ấy thích nấu mì Ý.
  usage_vi: ch sau o đọc [x] như “kh”.
  lesson_refs:
  - a1.m02.l01
  tags:
  - hobby
  - essen
  - verb
  source: nwn-lern
- id: a1.m02.v.reisen
  de: reisen
  pos: verb
  vi: du lịch, đi xa
  forms:
    text: du reist, er reist
    er: reist
  ipa: /ˈʁaɪ̯zn̩/
  example:
    de: Wir reisen gern.
    vi: Chúng tôi thích du lịch.
  usage_vi: Gốc tận cùng bằng s → du reist (chỉ thêm -t).
  lesson_refs:
  - a1.m02.l01
  tags:
  - hobby
  - reise
  - verb
  source: nwn-lern
- id: a1.m02.v.schwimmen
  de: schwimmen
  pos: verb
  vi: bơi
  forms:
    text: du schwimmst, er schwimmt
    er: schwimmt
  ipa: /ˈʃvɪmən/
  example:
    de: Schwimmst du gern?
    vi: Bạn có thích bơi không?
  usage_vi: sch đọc [ʃ]; w đọc [v].
  lesson_refs:
  - a1.m02.l01
  tags:
  - hobby
  - sport
  - verb
  source: nwn-lern
- id: a1.m02.v.antworten
  de: antworten
  pos: verb
  vi: trả lời
  forms:
    text: du antwortest, er antwortet
    er: antwortet
  ipa: /ˈantvɔʁtn̩/
  example:
    de: Antworten Sie, bitte.
    vi: Xin hãy trả lời.
  usage_vi: 'Gốc tận cùng bằng t → thêm e: du antwortest, er antwortet (để dễ phát âm).'
  lesson_refs:
  - a1.m02.l01
  tags:
  - verb
  - kommunikation
  source: nwn-lern
- id: a1.m02.v.arbeiten
  de: arbeiten
  pos: verb
  vi: làm việc
  forms:
    text: du arbeitest, er arbeitet
    er: arbeitet
  ipa: /ˈaʁbaɪ̯tn̩/
  example:
    de: Ich arbeite in Hamburg.
    vi: Tôi làm việc ở Hamburg.
  usage_vi: 'Gốc tận cùng bằng t → du arbeitest, er arbeitet. Hỏi nghề: Was arbeitest du?'
  lesson_refs:
  - a1.m02.l01
  tags:
  - verb
  - arbeit
  source: nwn-lern
- id: a1.m02.v.so
  de: so
  pos: adverb
  vi: như thế; lắm (trong “nicht so”)
  ipa: /zoː/
  example:
    de: Ich tanze nicht so gern. – Es geht so.
    vi: Tôi không thích nhảy lắm. – Tàm tạm.
  usage_vi: “nicht so gern” = không thích lắm; “Es geht so.” = tàm tạm. Từ nhiều nghĩa, học theo cụm.
  lesson_refs:
  - a1.m02.l01
  tags:
  - mehrdeutig
  source: nwn-lern
- id: a1.m02.v.spielen
  de: spielen
  pos: verb
  vi: chơi (thể thao, nhạc cụ, trò chơi); đóng (vai)
  forms:
    text: du spielst, er spielt
    er: spielt
  ipa: /ˈʃpiːlən/
  example:
    de: Er spielt gern Fußball.
    vi: Anh ấy thích chơi bóng đá.
  usage_vi: 'sp đầu từ đọc [ʃp]. Môn thể thao sau spielen không có mạo từ: Fußball spielen, Tennis spielen.'
  lesson_refs:
  - a1.m02.l01
  tags:
  - hobby
  - verb
  source: nwn-lern
- id: a1.m02.v.machen
  de: machen
  pos: verb
  vi: làm
  forms:
    text: du machst, er macht
    er: macht
  ipa: /ˈmaxn̩/
  example:
    de: Was machst du gern?
    vi: Bạn thích làm gì?
  usage_vi: 'Động từ rất hay dùng: Sport machen (chơi thể thao), Yoga machen.'
  lesson_refs:
  - a1.m02.l01
  tags:
  - verb
  source: nwn-lern
- id: a1.m02.v.kennen
  de: kennen
  pos: verb
  vi: biết, quen (người, nơi chốn)
  forms:
    text: du kennst, er kennt
    er: kennt
  ipa: /ˈkɛnən/
  example:
    de: Kennst du Paul?
    vi: Bạn có quen Paul không?
  usage_vi: kennen = biết NGƯỜI/NƠI (đã gặp, đã đến). Biết MỘT ĐIỀU (thông tin) là wissen – học sau.
  lesson_refs:
  - a1.m02.l01
  tags:
  - verb
  source: nwn-lern
- id: a1.m02.v.wir
  de: wir
  pos: pronoun
  vi: chúng tôi, chúng ta
  ipa: /viːɐ̯/
  example:
    de: Wir lernen Deutsch.
    vi: Chúng tôi học tiếng Đức.
  usage_vi: 'Động từ đi với wir giống dạng nguyên mẫu: wir kommen, wir spielen (riêng sein: wir sind).'
  lesson_refs:
  - a1.m02.l02
  tags:
  - personalpronomen
  source: nwn-lern
- id: a1.m02.v.ihr
  de: ihr
  pos: pronoun
  vi: các bạn, mấy cậu (thân mật, số nhiều)
  ipa: /iːɐ̯/
  example:
    de: Joggt ihr morgen auch?
    vi: Ngày mai các bạn cũng chạy bộ chứ?
  usage_vi: 'Số nhiều của du. Động từ thêm -t: ihr kommt, ihr spielt (sein: ihr seid). Không nhầm với Ihr (của ông/bà).'
  lesson_refs:
  - a1.m02.l02
  tags:
  - personalpronomen
  - informell
  source: nwn-lern
- id: a1.m02.v.buch
  de: Buch
  pos: noun
  article: das
  plural: Bücher
  vi: quyển sách
  ipa: /buːx/
  example:
    de: Ich lese ein Buch.
    vi: Tôi đọc một quyển sách.
  usage_vi: 'Số nhiều có biến âm: die Bücher. ch sau u đọc [x].'
  lesson_refs:
  - a1.m02.l02
  tags:
  - freizeit
  - lernen
  source: nwn-lern
- id: a1.m02.v.fussball
  de: Fußball
  pos: noun
  article: der
  no_plural: true
  vi: bóng đá
  ipa: /ˈfuːsbal/
  example:
    de: Er spielt gern Fußball.
    vi: Anh ấy thích chơi bóng đá.
  usage_vi: 'Khi là môn thể thao: KHÔNG dùng mạo từ (Fußball spielen). der Fußball (quả bóng) có số nhiều die Fußbälle – ít dùng ở A1.'
  lesson_refs:
  - a1.m02.l02
  tags:
  - sport
  - sg-only
  source: nwn-lern
- id: a1.m02.v.lieben
  de: lieben
  pos: verb
  vi: yêu, rất thích
  forms:
    text: du liebst, er liebt
    er: liebt
  ipa: /ˈliːbn̩/
  example:
    de: Ich liebe Musik.
    vi: Tôi rất mê âm nhạc.
  usage_vi: 'Mạnh hơn “gern”: Ich liebe Pizza! = Tôi mê pizza!'
  lesson_refs:
  - a1.m02.l02
  tags:
  - verb
  - gefuehl
  source: nwn-lern
- id: a1.m02.v.super
  de: super
  pos: adjective
  vi: tuyệt vời
  ipa: /ˈzuːpɐ/
  example:
    de: Das ist super!
    vi: Thật tuyệt!
  usage_vi: Văn nói, rất phổ biến. s đầu từ đọc [z].
  lesson_refs:
  - a1.m02.l02
  tags:
  - bewertung
  source: nwn-lern
- id: a1.m02.v.toll
  de: toll
  pos: adjective
  vi: hay, tuyệt
  ipa: /tɔl/
  example:
    de: Der Film ist toll.
    vi: Bộ phim hay lắm.
  usage_vi: Gần nghĩa với super.
  lesson_refs:
  - a1.m02.l02
  tags:
  - bewertung
  source: nwn-lern
- id: a1.m02.v.am
  de: am
  pos: preposition
  vi: vào (ngày …)
  ipa: /am/
  example:
    de: Am Wochenende koche ich.
    vi: Vào cuối tuần tôi nấu ăn.
  usage_vi: 'am = an + dem. Dùng với ngày và cuối tuần: am Montag, am Wochenende. (Câu bắt đầu bằng “Am Wochenende” thì động từ vẫn ở vị trí 2, chủ ngữ ra sau – học kỹ ở Kapitel 4.)'
  lesson_refs:
  - a1.m02.l02
  tags:
  - zeit
  source: nwn-lern
- id: a1.m02.v.foto
  de: Foto
  pos: noun
  article: das
  plural: Fotos
  vi: bức ảnh
  ipa: /ˈfoːto/
  example:
    de: Das Foto ist schön.
    vi: Bức ảnh đẹp.
  usage_vi: Số nhiều -s.
  lesson_refs:
  - a1.m02.l02
  tags:
  - medien
  source: nwn-lern
- id: a1.m02.v.lustig
  de: lustig
  pos: adjective
  vi: vui, hài hước
  ipa: /ˈlʊstɪç/
  example:
    de: Paul ist lustig.
    vi: Paul vui tính.
  usage_vi: Đuôi -ig đọc [ɪç].
  lesson_refs:
  - a1.m02.l02
  tags:
  - person
  - bewertung
  source: nwn-lern
- id: a1.m02.v.moment
  de: Moment
  pos: noun
  article: der
  plural: Momente
  vi: lúc, khoảnh khắc
  ipa: /moˈmɛnt/
  example:
    de: Im Moment lese ich viel.
    vi: Dạo này tôi đọc nhiều.
  usage_vi: “im Moment” = hiện tại, dạo này. “Moment, bitte!” = Xin chờ một chút!
  lesson_refs:
  - a1.m02.l02
  tags:
  - zeit
  source: nwn-lern
- id: a1.m02.v.morgen
  de: morgen
  pos: adverb
  vi: ngày mai
  ipa: /ˈmɔʁɡn̩/
  example:
    de: Morgen spiele ich Tennis.
    vi: Ngày mai tôi chơi tennis.
  usage_vi: Viết thường = ngày mai. Viết hoa der Morgen = buổi sáng (Kapitel 1).
  lesson_refs:
  - a1.m02.l02
  tags:
  - zeit
  - mehrdeutig
  source: nwn-lern
- id: a1.m02.v.spaghetti
  de: Spaghetti
  pos: noun
  article: die
  no_plural: true
  vi: mì Ý (spaghetti)
  ipa: /ʃpaˈɡɛti/
  example:
    de: Wir kochen Spaghetti.
    vi: Chúng tôi nấu mì Ý.
  usage_vi: 'Chỉ có dạng số nhiều trong tiếng Đức: die Spaghetti.'
  lesson_refs:
  - a1.m02.l02
  tags:
  - essen
  - pl-only
  source: nwn
- id: a1.m02.v.von
  de: von
  pos: preposition
  vi: của; từ
  ipa: /fɔn/
  example:
    de: Ich lese ein Buch von Daniel Kehlmann.
    vi: Tôi đọc một cuốn sách của Daniel Kehlmann.
  usage_vi: 'Từ nhiều nghĩa: “của (tác giả)”, “từ … đến” (von … bis), “Was sind Sie von Beruf?” (nghề gì).'
  lesson_refs:
  - a1.m02.l02
  tags:
  - praeposition
  - mehrdeutig
  source: nwn-lern
- id: a1.m02.v.wirklich
  de: wirklich
  pos: adverb
  vi: thật sự, thật à
  ipa: /ˈvɪʁklɪç/
  example:
    de: Spielst du wirklich Fußball?
    vi: Bạn chơi bóng đá thật à?
  usage_vi: 'Dùng để tỏ ra ngạc nhiên: Wirklich? = Thật hả?'
  lesson_refs:
  - a1.m02.l02
  source: nwn-lern
- id: a1.m02.v.wochenende
  de: Wochenende
  pos: noun
  article: das
  plural: Wochenenden
  vi: cuối tuần
  ipa: /ˈvɔxn̩ˌʔɛndə/
  example:
    de: Am Wochenende schwimme ich.
    vi: Cuối tuần tôi đi bơi.
  usage_vi: 'Danh từ ghép: die Woche + das Ende → das Wochenende.'
  lesson_refs:
  - a1.m02.l02
  tags:
  - zeit
  source: nwn-lern
- id: a1.m02.v.nennen
  de: nennen
  pos: verb
  vi: nêu, kể tên
  forms:
    text: du nennst, er nennt
    er: nennt
  ipa: /ˈnɛnən/
  example:
    de: Nennen Sie drei Hobbys.
    vi: Hãy kể tên ba sở thích.
  usage_vi: Hay gặp trong đề bài.
  lesson_refs:
  - a1.m02.l02
