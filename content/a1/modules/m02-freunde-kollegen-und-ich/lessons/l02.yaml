- Tôi chia đúng arbeiten, reisen, lesen, fahren.
- 'Tôi hỏi được một nhóm bạn: Was macht ihr am Wochenende?'
- Tôi phản hồi được bằng super, toll, wirklich.
blocks:
- id: a1.m02.l02.b1
  kind: explanation
  title_vi: Giới thiệu bài học
  body_vi: 'Đến giờ bạn đã chia động từ cho **một người** (ich, du, er/sie, Sie). Bài này hoàn thiện bảng chia động từ với **nhiều người**:

    **wir** (chúng tôi), **ihr** (các bạn), **sie** (họ).


    Tin vui: **wir, sie, Sie** đều giống **dạng nguyên mẫu** (*wir spielen, sie spielen*). Chỉ cần nhớ thêm **ihr + -t**.


    Bạn cũng học ba nhóm động từ “khó tính” – xem chủ điểm *Chia động từ thì hiện tại đầy đủ*:

    - *arbeiten* → du arbeit**e**st (thêm e),

    - *reisen* → du reis**t** (chỉ thêm t),

    - *lesen, fahren* → du l**ie**st, du f**ä**hrst (đổi nguyên âm).'
- id: a1.m02.l02.b2
  kind: explanation
  title_vi: sie hay sie? – cô ấy và họ
  skill: grammar
  body_vi: 'sie (viết thường) có hai nghĩa: cô ấy (động từ -t) và họ (động từ -en). Phân biệt bằng đuôi động từ: Sie spielt = cô ấy chơi; sie spielen = họ chơi. Sie viết hoa + -en = ông/bà.'
  examples:
  - de: Lisa spielt Tennis. Sie spielt gern.
    vi: Lisa chơi tennis. Cô ấy thích chơi.
  - de: Lisa und Paul spielen Tennis. Sie spielen gern.
    vi: Lisa và Paul chơi tennis. Họ thích chơi.
- id: a1.m02.l02.b3
  kind: explanation
  title_vi: 'Từ chỉ thời gian: am Wochenende, morgen, im Moment'
  skill: grammar
  body_vi: 'Các từ này thường đứng sau động từ: Wir kochen am Wochenende. Nếu đưa chúng lên ĐẦU câu, động từ vẫn ở vị trí 2 và chủ ngữ ra sau: Am Wochenende kochen wir. (Quy tắc này học kỹ ở Kapitel 4 – bây giờ chỉ cần nhận ra.)'
  examples:
  - de: Wir kochen am Wochenende.
    vi: Cuối tuần chúng tôi nấu ăn.
  - de: Morgen spiele ich Tennis.
    vi: Ngày mai tôi chơi tennis.
- id: a1.m02.l02.b4
  kind: pronunciation
  title_vi: ihr [iːɐ̯] – er [eːɐ̯]; ä trong fährst, ie trong liest
  skill: pronunciation
  body_vi: 'ihr [iːɐ̯] – er [eːɐ̯]; ä trong fährst, ie trong liest


    ihr (các bạn) đọc “i” dài; er (anh ấy) đọc “ê” dài – đừng nhầm. fährst [fɛːɐ̯st]: ä dài như “e” kéo dài. liest [liːst]: ie = i dài.


    Luyện tập: Đọc to hàng chia của fahren: ich fahre, du fährst, er fährt, wir fahren, ihr fahrt, sie fahren.'
  items:
  - de: ihr spielt – er spielt
    vi: các bạn chơi – anh ấy chơi
    ipa: '[iːɐ̯ ʃpiːlt] – [eːɐ̯ ʃpiːlt]'
  - de: du fährst – du liest
    vi: bạn đi xe – bạn đọc
    ipa: '[duː fɛːɐ̯st] – [duː liːst]'
- id: a1.m02.l02.b5
  kind: examples
  title_vi: Câu ví dụ
  examples:
  - de: Wir spielen am Wochenende Fußball.
    vi: Cuối tuần chúng tôi chơi bóng đá.
  - de: Was macht ihr morgen?
    vi: Ngày mai các bạn làm gì?
  - de: Lisa und Paul tanzen gern.
    vi: Lisa và Paul thích nhảy.
  - de: Du liest viel! – Ja, ich liebe Bücher.
    vi: Bạn đọc nhiều thật! – Ừ, mình mê sách.
  - de: Er fährt am Wochenende nach Wien.
    vi: Cuối tuần anh ấy đi Viên.
  - de: Mein Hobby ist Kochen. Ich koche oft mit Freunden.
    vi: Sở thích của tôi là nấu ăn. Tôi hay nấu ăn với bạn bè.
- id: a1.m02.l02.b6
  kind: listening
  title_vi: 'Tin nhắn thoại: kế hoạch cuối tuần'
  lines:
  - speaker: Paul
    de: Hallo, Leute! Was macht ihr am Wochenende? Lisa und ich spielen am Samstag Fußball. Spielt ihr auch? Am Sonntag kochen wir Spaghetti. Minh, du kochst doch gern! Und Mai, du liest im Moment viel, oder? Bis morgen!
    vi: Chào mọi người! Cuối tuần các bạn làm gì? Lisa và mình chơi bóng đá vào thứ Bảy. Các bạn cũng chơi chứ? Chủ nhật bọn mình nấu mì Ý. Minh, bạn thích nấu ăn mà! Còn Mai, dạo này bạn đọc sách nhiều đúng không? Hẹn mai gặp!
  audio_status: pending-tts
  situation_vi: Paul gửi tin nhắn thoại cho nhóm bạn.
  skill: listening
  audio:
    speed: slow
- id: a1.m02.l02.b7
  kind: reading
  title_vi: Bình luận dưới ảnh
  paragraphs:
  - de: '📷 Foto: Kochabend mit Freunden

      Mai: Wir kochen heute Pho! 🍜 Super lustig!

      Tom: Wirklich? Kocht ihr oft zusammen?

      Mai: Ja, jedes Wochenende. Kommst du auch?

      Tom: Toll! Ich koche nicht gern, aber ich esse sehr gern! 😄'
    vi: '📷 Ảnh: Buổi tối nấu ăn với bạn bè

      Mai: Hôm nay bọn mình nấu phở! 🍜 Vui cực!

      Tom: Thật à? Các bạn hay nấu ăn cùng nhau à?

      Mai: Ừ, cuối tuần nào cũng thế. Bạn cũng đến chứ?

      Tom: Tuyệt! Mình không thích nấu ăn nhưng rất thích ăn! 😄'
  text_type_vi: Bài đăng và bình luận mạng xã hội
  skill: reading
  glossary:
  - de: heute
    vi: hôm nay
  - de: zusammen
    vi: cùng nhau
  - de: essen (du isst, er isst)
    vi: ăn
- id: a1.m02.l02.b8
  kind: speaking
  title_vi: Nhóm của chúng tôi
  skill: speaking
  task_vi: Kể về hoạt động của bạn và nhóm bạn/gia đình (dùng wir), rồi đặt 2 câu hỏi với ihr.
  steps_vi:
  - 'Nói 3 câu với wir: Wir … am Wochenende / morgen / oft.'
  - 'Hỏi 2 câu với ihr: Was macht ihr …? … ihr gern …?'
  lines:
  - speaker: Lan
    de: Meine Freunde und ich kochen oft. Am Wochenende spielen wir Tennis. Wir lesen auch gern. Und ihr? Was macht ihr am Wochenende? Spielt ihr auch Tennis?
    vi: Bạn bè và tôi hay nấu ăn. Cuối tuần chúng tôi chơi tennis. Chúng tôi cũng thích đọc sách. Còn các bạn? Cuối tuần các bạn làm gì? Các bạn cũng chơi tennis chứ?
- id: a1.m02.l02.b9
  kind: writing
  title_vi: Viết bình luận
  skill: writing
  task_vi: 'Viết 3–4 câu bình luận dưới bài đăng của Mai: bày tỏ cảm xúc, kể nhóm bạn mình làm gì, hỏi một câu với ihr.'
  model:
    de: Super! Meine Freunde und ich kochen auch gern. Wir kochen oft Spaghetti. Was kocht ihr morgen?
    vi: Tuyệt! Bạn bè mình và mình cũng thích nấu ăn. Bọn mình hay nấu mì Ý. Ngày mai các bạn nấu gì?
  checklist_vi:
  - Có một từ cảm xúc (super, toll, lustig…).
  - wir + động từ -en; ihr + động từ -t.
