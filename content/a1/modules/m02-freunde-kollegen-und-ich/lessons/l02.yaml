summary_vi: 'Đuôi đầy đủ: ich -e, du -st, er -t, wir -en, ihr -t, sie/Sie -en. Gốc -t: du arbeitest. Gốc -s/-z: du reist, du tanzt. Đổi nguyên âm ở du/er: liest, fährt, spricht. Hỏi nhóm bạn: Was macht ihr …? Phản hồi: Wirklich? Super! Toll!'
