- id: a1.m02.l06.b7
  kind: speaking
  title_vi: 'Đóng vai: đăng ký ở câu lạc bộ'
  skill: speaking
  task_vi: Bạn đến quầy câu lạc bộ. Nhân viên hỏi họ tên, địa chỉ, ngày sinh, email và khóa học bạn chọn. Trả lời bằng thông tin của bạn.
  steps_vi:
  - Chào và nói bạn là người mới.
  - Trả lời các câu hỏi; đánh vần họ nếu cần.
  - Chọn một khóa học và hỏi lịch.
  lines:
  - speaker: Lan
    de: Guten Tag! Ich bin neu hier. Mein Name ist Lan Nguyen.
    vi: Xin chào! Tôi là người mới. Tôi tên là Lan Nguyễn.
  - speaker: Mitarbeiter
    de: Wie ist Ihre Adresse?
    vi: Địa chỉ của chị là gì?
  - speaker: Lan
    de: Lindenstraße 12, 04109 Leipzig.
    vi: Số 12 phố Linden, 04109 Leipzig.
  - speaker: Lan
    de: Ich mache gern Yoga. Wann ist der Kurs?
    vi: Tôi thích tập yoga. Lớp học vào khi nào ạ?
- id: a1.m02.l06.b8
  kind: writing
  title_vi: Điền phiếu đăng ký
