blocks:
- id: a1.m02.l06.b1
  kind: explanation
  title_vi: Giới thiệu bài học
  body_vi: 'Ở Đức, Áo, Thụy Sĩ có rất nhiều **câu lạc bộ (Verein/Club)**: thể thao, âm nhạc, nấu ăn…

    Khi tham gia, bạn phải **điền biểu mẫu (Formular)**. Biểu mẫu cũng xuất hiện khi bạn đăng ký cư trú, mở tài khoản ngân hàng,

    đăng ký khóa học – và trong **đề thi A1** (phần Viết, Teil 1).


    **Hai điểm khác Việt Nam khi viết địa chỉ:**

    1. **Số nhà đứng SAU tên đường:** *Lindenstraße 12* (không phải “12 Lindenstraße”).

    2. **Mã bưu chính (5 số) đứng TRƯỚC tên thành phố:** *04109 Leipzig*.'
- id: a1.m02.l06.b2
  kind: explanation
  title_vi: Viết địa chỉ và ngày sinh
  skill: grammar
  body_vi: 'Địa chỉ: [Tên đường][Số nhà], [Mã bưu chính] [Thành phố] → Lindenstraße 12, 04109 Leipzig.

    Ngày sinh: ngày.tháng.năm → 12.05.2001 (giống Việt Nam, dùng dấu chấm).

    Trong biểu mẫu, Vorname = tên (có thể ghi cả tên đệm), Familienname/Nachname = họ.

    '
  examples:
  - de: 'Adresse: Goethestraße 7, 10115 Berlin'
    vi: 'Địa chỉ: số 7 phố Goethe, 10115 Berlin'
  - de: 'Geburtsdatum: 03.09.1999'
    vi: 'Ngày sinh: 03/09/1999'
- id: a1.m02.l06.b3
  kind: pronunciation
  title_vi: Từ ghép dài trong biểu mẫu
  skill: pronunciation
  body_vi: 'Từ ghép dài trong biểu mẫu


    Đọc từ ghép theo từng phần, nhấn phần ĐẦU: POST-leit-zahl, ge-BURTS-da-tum, FA-mi-li-en-na-me (Familie nhấn mi: fa-MI-li-e).


    Luyện tập: Đọc to các mục của biểu mẫu ở phần Đọc.'
  items:
  - de: die Postleitzahl
    vi: mã bưu chính
    ipa: '[ˈpɔstlaɪ̯tˌtsaːl]'
  - de: das Geburtsdatum
    vi: ngày sinh
    ipa: '[ɡəˈbuːɐ̯tsˌdaːtʊm]'
- id: a1.m02.l06.b4
  kind: examples
  title_vi: Câu ví dụ
  examples:
  - de: Ich bin neu im Club.
    vi: Tôi mới vào câu lạc bộ.
  - de: Wir spielen Basketball und Tennis.
    vi: Chúng tôi chơi bóng rổ và quần vợt.
  - de: Meine Postleitzahl ist 20095.
    vi: Mã bưu chính của tôi là 20095.
  - de: Wählen Sie einen Kurs.
    vi: Hãy chọn một khóa học.
  - de: Ich mache gern Yoga.
    vi: Tôi thích tập yoga.
- id: a1.m02.l06.b5
  kind: listening
  title_vi: Đăng ký qua điện thoại
  lines:
  - speaker: Mitarbeiterin
    de: Sportclub Lindenau, guten Tag!
    vi: Câu lạc bộ thể thao Lindenau, xin chào!
  - speaker: Huy
    de: Guten Tag! Mein Name ist Huy Le. Ich bin neu in Leipzig und spiele gern Basketball.
    vi: Xin chào! Tôi tên là Huy Lê. Tôi mới đến Leipzig và thích chơi bóng rổ.
  - speaker: Mitarbeiterin
    de: Super! Der Basketball-Kurs ist am Mittwoch. Wie ist Ihre Adresse?
    vi: Tuyệt! Lớp bóng rổ vào thứ Tư. Địa chỉ của anh là gì?
  - speaker: Huy
    de: Karl-Heine-Straße 28, 04229 Leipzig.
    vi: Số 28 phố Karl-Heine, 04229 Leipzig.
  - speaker: Mitarbeiterin
    de: Und Ihr Geburtsdatum?
    vi: Còn ngày sinh của anh?
  - speaker: Huy
    de: Der 14.07.1998.
    vi: Ngày 14/07/1998.
  - speaker: Mitarbeiterin
    de: Danke, Herr Le. Bis Mittwoch!
    vi: Cảm ơn anh Lê. Hẹn thứ Tư!
  audio_status: pending-tts
  situation_vi: Huy gọi đến câu lạc bộ thể thao để đăng ký.
  skill: listening
  audio:
    speed: slow
- id: a1.m02.l06.b6
  kind: reading
  title_vi: Khóa học và phiếu đăng ký
  paragraphs:
