      Straße, Hausnummer: Goethestraße 7

      Postleitzahl, Wohnort: 04109 Leipzig

      E-Mail: mai.pham@web.de

      Kurs: Yoga'
    vi: 'CÂU LẠC BỘ THỂ THAO LINDENAU – Các khóa

      Thứ Hai: Yoga · Thứ Tư: Bóng rổ · Thứ Sáu: Quần vợt · Thứ Bảy: Bóng đá


      PHIẾU ĐĂNG KÝ

      Họ: Phạm          Tên: Mai

      ☐ nam   ☒ nữ

      Ngày sinh: 03/09/1999    Nơi sinh: Đà Nẵng

      Đường, số nhà: số 7 phố Goethe

      Mã bưu chính, nơi ở: 04109 Leipzig

      Email: mai.pham@web.de

      Khóa: Yoga'
