  task_vi: Điền phiếu đăng ký câu lạc bộ với thông tin của bạn (có thể dùng địa chỉ tưởng tượng ở Đức).
  model:
    de: 'Familienname: Nguyen · Vorname: Lan · weiblich · Geburtsdatum: 21.02.2000 · Geburtsort: Hanoi · Straße, Hausnummer: Lindenstraße 12 · PLZ, Wohnort: 04109 Leipzig · E-Mail: lan.nguyen@web.de · Kurs: Tennis'
    vi: Phiếu mẫu đã điền.
