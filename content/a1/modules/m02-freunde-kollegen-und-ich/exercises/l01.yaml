      right: hát
    explanation_vi: Sáu hoạt động thời gian rảnh của bài.
- id: a1.m02.l01.ex.02
  type: multiple-choice
  skill: listening
  difficulty: 1
  objective_refs:
  - a1.m02.l01.obj2
  - a1.m02.l01.obj1
  instructions_vi: Nghe khảo sát. Mỗi người thích làm gì nhất?
  stimulus:
    ref: a1.m02.l01.b6
  items:
  - id: a1.m02.l01.ex.02.q1
    prompt: Minh rất thích …
    options:
    - id: a
      text: kochen
    - id: b
      text: fotografieren
    - id: c
      text: tanzen
    answer:
    - b
    explanation_vi: 'Minh: “… ich fotografiere sehr gern.” (nấu ăn: gern, chụp ảnh: sehr gern).'
  - id: a1.m02.l01.ex.02.q2
    prompt: Ana rất thích …
    options:
    - id: a
      text: tanzen
    - id: b
      text: singen
    - id: c
      text: schwimmen
    answer:
    - a
    explanation_vi: 'Ana: “Ich tanze sehr gern!”'
  - id: a1.m02.l01.ex.02.q3
    prompt: Kenji thích …
    options:
    - id: a
      text: Fußball spielen
    - id: b
      text: kochen
    - id: c
      text: joggen
    answer:
    - c
    explanation_vi: 'Kenji: “Ich jogge gern!”'
- id: a1.m02.l01.ex.03
  type: true-false
  skill: listening
  difficulty: 2
  objective_refs:
  - a1.m02.l01.obj2
  instructions_vi: Nghe lại. Đúng hay sai?
  stimulus:
    ref: a1.m02.l01.b6
  items:
  - id: a1.m02.l01.ex.03.q1
    prompt: Ana không thích bơi lắm.
    answer: true
    explanation_vi: “Ich schwimme nicht so gern.”
  - id: a1.m02.l01.ex.03.q2
    prompt: Kenji thích chơi bóng đá.
    answer: false
    explanation_vi: “Nein, nicht gern.”
  - id: a1.m02.l01.ex.03.q3
    prompt: 'Kenji tự sửa lỗi chia động từ: „ich joggen“ → „ich jogge“.'
    answer: true
    explanation_vi: Với ich phải là jogge.
- id: a1.m02.l01.ex.04
  type: multiple-choice
  skill: vocabulary
  difficulty: 1
  objective_refs:
  - a1.m02.l01.obj2
  instructions_vi: Chọn câu đúng với hình biểu tượng cảm xúc.
  items:
  - id: a1.m02.l01.ex.04.q1
    prompt: 😍 kochen
    options:
    - id: a
      text: Ich koche nicht gern.
    - id: b
      text: Ich koche nicht so gern.
    - id: c
      text: Ich koche sehr gern.
    answer:
    - c
    explanation_vi: 😍 = sehr gern.
  - id: a1.m02.l01.ex.04.q2
    prompt: 🙁 tanzen
    options:
    - id: a
      text: Ich tanze nicht gern.
    - id: b
      text: Ich tanze gern.
    - id: c
      text: Ich tanze sehr gern.
    answer:
    - a
    explanation_vi: 🙁 = nicht gern.
  - id: a1.m02.l01.ex.04.q3
    prompt: 😐 joggen
    options:
    - id: a
      text: Ich jogge gern.
    - id: b
      text: Ich jogge nicht so gern.
    - id: c
      text: Ich jogge sehr gern.
    answer:
    - b
    explanation_vi: 😐 = nicht so gern.
- id: a1.m02.l01.ex.05
  type: fill-blank
  skill: grammar
  difficulty: 2
  objective_refs:
  - a1.m02.l01.obj4
  - a1.m02.l01.obj3
  instructions_vi: Chia động từ trong ngoặc (ôn ngôi số ít từ Kapitel 1).
  items:
  - id: a1.m02.l01.ex.05.q1
    prompt: Was ___ du gern? (machen)
    answers:
    - machst
    explanation_vi: du → -st.
  - id: a1.m02.l01.ex.05.q2
    prompt: Meine Kollegin ___ gern. (singen)
    answers:
    - singt
    explanation_vi: sie → -t.
  - id: a1.m02.l01.ex.05.q3
    prompt: Mein Freund ___ gern Fußball. (spielen)
    answers:
    - spielt
    explanation_vi: er → -t.
  - id: a1.m02.l01.ex.05.q4
    prompt: ___ du gern? (tanzen)
    answers:
    - Tanzt
    explanation_vi: Gốc tận cùng z → du tanzt.
  - id: a1.m02.l01.ex.05.q5
    prompt: Er ___ in Hamburg. (arbeiten)
    answers:
    - arbeitet
    explanation_vi: Gốc tận cùng t → arbeitet (thêm e).
- id: a1.m02.l01.ex.06
  type: word-order
  skill: grammar
  difficulty: 1
  objective_refs:
  - a1.m02.l01.obj2
  - a1.m02.l01.obj3
  instructions_vi: Sắp xếp thành câu đúng.
  items:
  - id: a1.m02.l01.ex.06.q1
    tokens:
    - gern
    - koche
    - Ich
    answer: Ich koche gern.
    explanation_vi: gern đứng sau động từ.
  - id: a1.m02.l01.ex.06.q2
    tokens:
    - Fußball
    - gern
    - spielt
    - Er
    answer: Er spielt gern Fußball.
    explanation_vi: Er – spielt – gern – Fußball.
  - id: a1.m02.l01.ex.06.q3
    tokens:
    - gern
    - du
    - machst
    - Was
    answer: Was machst du gern?
    explanation_vi: 'W-Frage: Was – machst – du – gern.'
