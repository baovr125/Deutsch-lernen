- id: a1.m02.l01.ex.08
  type: translation
  skill: grammar
  difficulty: 2
  objective_refs:
  - a1.m02.l01.obj2
  - a1.m02.l01.obj3
  instructions_vi: Dịch sang tiếng Đức.
  items:
  - id: a1.m02.l01.ex.08.q1
    direction: vi-de
    source: Tôi thích du lịch.
    answers:
    - Ich reise gern.
    explanation_vi: Thích = động từ + gern.
  - id: a1.m02.l01.ex.08.q2
    direction: vi-de
    source: Bạn thích làm gì?
    answers:
    - Was machst du gern?
    - Was machen Sie gern?
    explanation_vi: 'Thân mật: du; trang trọng: Sie.'
  - id: a1.m02.l01.ex.08.q3
    direction: vi-de
    source: Anh ấy không thích bơi.
    answers:
    - Er schwimmt nicht gern.
    explanation_vi: nicht gern.
- id: a1.m02.l01.ex.09
  type: speaking-practice
  skill: speaking
  difficulty: 1
  objective_refs:
  - a1.m02.l01.obj2
  - a1.m02.l01.obj4
  instructions_vi: Ghi âm 4–5 câu về sở thích của bạn và của một người bạn (phần Nói).
  grading: self
  rubric:
  - criterion_vi: Có ít nhất 3 hoạt động với 2 mức độ khác nhau
    points: 2
  - criterion_vi: gern ở đúng vị trí, động từ chia đúng
    points: 2
  - criterion_vi: Có một câu về người khác (er/sie)
    points: 1
  items:
  - id: a1.m02.l01.ex.09.q1
    prompt_vi: Sở thích của tôi và bạn tôi.
    model_answer:
      de: Ich reise sehr gern. Ich koche auch gern. Ich schwimme nicht so gern. Meine Freundin Mai singt gern.
    explanation_vi: So sánh với mẫu ở phần Nói.
- id: a1.m02.l01.ex.10
