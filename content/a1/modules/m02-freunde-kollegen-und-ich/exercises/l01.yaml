- id: a1.m02.l01.ex.01
  type: matching
  skill: vocabulary
  difficulty: 1
  objective_refs:
  - a1.m02.l01.obj1
  instructions_vi: Nối hoạt động với nghĩa tiếng Việt.
  items:
  - id: a1.m02.l01.ex.01.q1
    pairs:
    - left: kochen
      right: nấu ăn
    - left: schwimmen
      right: bơi
    - left: tanzen
      right: nhảy
    - left: reisen
      right: du lịch
    - left: fotografieren
      right: chụp ảnh
