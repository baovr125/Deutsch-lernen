- Từ chỉ dùng trong bài tập của giáo trình (bilden, passend, doppelt, Konsonant, Vokal, klopfen, kreisen, würfeln, Start…) không đưa vào danh sách học; Konsonant/Vokal được giải thích trong phần phát âm.
