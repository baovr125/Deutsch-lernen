  difficulty: 1
  objective_refs:
  - a1.m03.l05.obj1
  instructions_vi: Nối từ quốc tế với nghĩa tiếng Việt.
  items:
  - id: a1.m03.l05.ex.01.q1
    pairs:
    - left: das Festival
      right: lễ hội
    - left: der Film
      right: bộ phim
    - left: das Ticket
      right: vé
    - left: der Star
      right: ngôi sao
    - left: das Event
      right: sự kiện
    explanation_vi: Những từ quốc tế này giúp bạn hiểu nhanh một văn bản.
- id: a1.m03.l05.ex.02
  type: multiple-choice
  skill: reading
  difficulty: 1
  objective_refs:
  - a1.m03.l05.obj2
  - a1.m03.l05.obj1
  instructions_vi: Đọc thông báo sự kiện. Chọn đáp án đúng.
  stimulus:
    ref: a1.m03.l05.b7
  items:
  - id: a1.m03.l05.ex.02.q1
    prompt: Sự kiện nào vào cửa miễn phí?
    options:
    - id: a
      text: Theater-Festival
    - id: b
      text: Konzert
    - id: c
      text: Filmfestival
    answer:
    - a
    explanation_vi: „Der Eintritt ist frei!“
  - id: a1.m03.l05.ex.02.q2
    prompt: Dàn nhạc đến từ đâu?
    options:
    - id: a
      text: aus zehn Ländern
    - id: b
      text: aus Hamburg
    - id: c
      text: aus Wien
    answer:
    - c
    explanation_vi: „Ein Orchester aus Wien …“
  - id: a1.m03.l05.ex.02.q3
    prompt: Vé liên hoan phim giá bao nhiêu?
    options:
    - id: a
      text: 60 Euro
    - id: b
      text: 10 Euro
    - id: c
      text: 25 Euro
    answer:
    - b
    explanation_vi: '„Tickets: 10 Euro.“'
- id: a1.m03.l05.ex.03
  type: true-false
  skill: reading
  difficulty: 2
  objective_refs:
  - a1.m03.l05.obj1
  - a1.m03.l05.obj4
  instructions_vi: Đúng hay sai?
  stimulus:
    ref: a1.m03.l05.b7
  items:
  - id: a1.m03.l05.ex.03.q1
    prompt: Liên hoan phim có 100 bộ phim.
    answer: true
    explanation_vi: „100 Filme …“
  - id: a1.m03.l05.ex.03.q2
    prompt: Lễ hội sân khấu diễn ra trong nhà hòa nhạc.
    answer: false
    explanation_vi: „… im Park“.
  - id: a1.m03.l05.ex.03.q3
    prompt: „ihre Produktionen“ = các vở diễn của họ (các diễn viên).
    answer: true
    explanation_vi: ihre = của họ/của cô ấy.
- id: a1.m03.l05.ex.04
  type: multiple-choice
  skill: listening
  difficulty: 2
  objective_refs:
  - a1.m03.l05.obj3
  - a1.m03.l05.obj2
  instructions_vi: Nghe Lisa và Minh. Chọn đáp án đúng.
  stimulus:
    ref: a1.m03.l05.b6
  items:
  - id: a1.m03.l05.ex.04.q1
    prompt: Minh thấy hòa nhạc thế nào?
    options:
    - id: a
      text: super
    - id: b
      text: toll
    - id: c
      text: nicht so interessant
    answer:
    - c
    explanation_vi: „… ich finde Konzerte nicht so interessant.“
  - id: a1.m03.l05.ex.04.q2
    prompt: Họ chọn đi đâu?
    options:
    - id: a
      text: zum Filmfestival
    - id: b
      text: zum Konzert
    - id: c
      text: ins Theater
    answer:
    - a
    explanation_vi: „Okay, gehen wir zum Filmfestival!“
  - id: a1.m03.l05.ex.04.q3
    prompt: Một vé liên hoan phim giá bao nhiêu?
    options:
    - id: a
      text: 12 Euro
    - id: b
      text: 10 Euro
    - id: c
      text: 100 Euro
    answer:
    - b
    explanation_vi: „Zehn Euro.“
- id: a1.m03.l05.ex.05
  type: fill-blank
  skill: grammar
  difficulty: 2
  objective_refs:
  - a1.m03.l05.obj3
  instructions_vi: Chia động từ finden.
  items:
  - id: a1.m03.l05.ex.05.q1
    prompt: Ich ___ das Festival toll.
    answers:
    - finde
    explanation_vi: ich finde.
  - id: a1.m03.l05.ex.05.q2
    prompt: Wie ___ du den Film?
    answers:
    - findest
    explanation_vi: Gốc -d → du findest.
  - id: a1.m03.l05.ex.05.q3
    prompt: Er ___ Konzerte interessant.
    answers:
    - findet
    explanation_vi: Gốc -d → er findet.
- id: a1.m03.l05.ex.06
  type: translation
  skill: vocabulary
  difficulty: 2
  objective_refs:
  - a1.m03.l05.obj3
  - a1.m03.l05.obj2
  instructions_vi: Dịch sang tiếng Đức.
  items:
  - id: a1.m03.l05.ex.06.q1
    direction: vi-de
    source: Tôi thấy bộ phim thú vị.
    answers:
    - Ich finde den Film interessant.
    - Ich finde den Film sehr interessant.
    explanation_vi: finden + den Film (Akkusativ – Kapitel 4) + tính từ.
  - id: a1.m03.l05.ex.06.q2
    direction: vi-de
    source: Vé giá bao nhiêu?
    answers:
    - Was kostet das Ticket?
    - Wie viel kostet das Ticket?
    explanation_vi: Was kostet …?
