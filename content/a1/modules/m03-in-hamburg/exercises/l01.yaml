- id: a1.m03.l01.ex.03
  type: multiple-choice
  skill: listening
  difficulty: 1
  objective_refs:
  - a1.m03.l01.obj3
  instructions_vi: Nghe chuyến tham quan. Chọn đáp án đúng.
  stimulus:
    ref: a1.m03.l01.b6
  items:
  - id: a1.m03.l01.ex.03.q1
    prompt: Điểm dừng đầu tiên là gì?
    options:
    - id: a
      text: die Kirche
    - id: b
      text: der Hafen
    - id: c
      text: das Rathaus
    answer:
    - c
    explanation_vi: „Die erste Station ist das Rathaus.“
  - id: a1.m03.l01.ex.03.q2
    prompt: „Der Michel“ là gì?
    options:
    - id: a
      text: ein Turm
    - id: b
      text: eine Kirche
    - id: c
      text: ein Schiff
    answer:
    - b
    explanation_vi: „Der Michel ist eine Kirche.“
  - id: a1.m03.l01.ex.03.q3
    prompt: Elbphilharmonie là gì?
    options:
    - id: a
      text: ein Museum
    - id: b
      text: ein Konzerthaus
    - id: c
      text: ein Bahnhof
    answer:
    - b
    explanation_vi: „… ein Konzerthaus und ein Star in Hamburg!“
- id: a1.m03.l01.ex.04
  type: true-false
  skill: listening
  difficulty: 2
  objective_refs:
  - a1.m03.l01.obj2
  - a1.m03.l01.obj3
  instructions_vi: Nghe lại. Đúng hay sai?
