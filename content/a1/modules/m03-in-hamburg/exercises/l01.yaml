    prompt: Tòa tháp của Michel cao hơn 130 mét.
    answer: true
    explanation_vi: „über 130 Meter hoch“.
  - id: a1.m03.l01.ex.04.q2
    prompt: Ở bến cảng, sông Elbe hẹp.
    answer: false
    explanation_vi: „Die Elbe ist hier sehr breit.“ – rộng.
  - id: a1.m03.l01.ex.04.q3
    prompt: Tòa thị chính hơn 100 năm tuổi.
    answer: true
    explanation_vi: „… über 100 Jahre alt.“
