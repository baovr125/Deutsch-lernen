- id: a1.m03.l03.ex.08
  type: speaking-practice
  skill: speaking
  difficulty: 2
  objective_refs:
  - a1.m03.l03.obj4
  - a1.m03.l03.obj2
  - a1.m03.l03.obj3
  instructions_vi: Ghi âm câu chuyện ngày không may của bạn (phần Nói).
  grading: self
  rubric:
  - criterion_vi: Có ít nhất 2 câu với kein/keine và 1 câu với nicht, dùng đúng
    points: 3
  - criterion_vi: Câu chuyện có mở đầu – vấn đề – kết thúc
    points: 1
  items:
  - id: a1.m03.l03.ex.08.q1
    prompt_vi: Ngày không may của tôi
    model_answer:
      de: Heute habe ich kein Glück. Der Bus kommt nicht. Ich habe kein Auto und kein Fahrrad. Also gehe ich zu Fuß. Ich bin nicht pünktlich!
    explanation_vi: So sánh với mẫu ở phần Nói.
- id: a1.m03.l03.ex.09
  type: writing-practice
  skill: writing
  difficulty: 1
  objective_refs:
