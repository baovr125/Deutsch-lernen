    prompt: Die U-Bahn ist heute ___ schnell.
    options:
    - id: a
      text: nicht
    - id: b
      text: kein
    - id: c
      text: keine
    answer:
    - a
    explanation_vi: Phủ định tính từ.
  - id: a1.m03.l03.ex.03.q4
    prompt: Das ist ___ Straßenbahn.
    options:
    - id: a
      text: nicht
    - id: b
      text: kein
    - id: c
      text: keine
    answer:
