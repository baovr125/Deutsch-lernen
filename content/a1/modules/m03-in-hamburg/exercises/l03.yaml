  - id: a1.m03.l03.ex.02.q3
    prompt: Das ist ___ Flugzeug.
    answers:
    - kein
    explanation_vi: das Flugzeug → kein.
  - id: a1.m03.l03.ex.02.q4
    prompt: Hier sind ___ Taxis.
    answers:
    - keine
