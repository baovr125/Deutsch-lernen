entries:
- id: a1.m03.v.bahnhof
  de: Bahnhof
  pos: noun
  article: der
  plural: Bahnhöfe
  vi: nhà ga (tàu hỏa)
  ipa: /ˈbaːnˌhoːf/
  example:
    de: Der Bahnhof ist in der Mitte von Hamburg.
    vi: Nhà ga ở trung tâm Hamburg.
  usage_vi: 'die Bahn (tàu) + der Hof (sân). Ga chính: der Hauptbahnhof (Hbf).'
  lesson_refs:
  - a1.m03.l01
  tags:
  - stadt
  - verkehr
  source: nwn-lern
- id: a1.m03.v.breit
  de: breit
  pos: adjective
  vi: rộng
  ipa: /bʁaɪ̯t/
  example:
    de: Der Fluss ist breit.
    vi: Con sông rộng.
  usage_vi: 'Trái nghĩa: schmal (hẹp) – học sau.'
  lesson_refs:
  - a1.m03.l01
  tags:
  - beschreibung
  source: nwn-lern
- id: a1.m03.v.erste
  de: erste
  pos: numeral
  vi: thứ nhất, đầu tiên
  ipa: /ˈeːɐ̯stə/
  example:
    de: Das ist die erste Station.
    vi: Đây là trạm đầu tiên.
  usage_vi: Số thứ tự (Ordinalzahlen) học kỹ ở Kapitel 6.
  lesson_refs:
  - a1.m03.l01
  tags:
  - zahl
  source: nwn-lern
- id: a1.m03.v.euro
  de: Euro
  pos: noun
  article: der
  plural: Euros
  vi: đồng euro
  ipa: /ˈɔʏ̯ʁo/
  example:
    de: Das Ticket kostet 20 Euro.
    vi: Vé giá 20 euro.
  usage_vi: 'Sau số đếm thường giữ nguyên „Euro“: 20 Euro. eu đọc [ɔʏ̯].'
  lesson_refs:
  - a1.m03.l01
  tags:
  - geld
  source: nwn-lern
- id: a1.m03.v.hoch
  de: hoch
  pos: adjective
  vi: cao
  ipa: /hoːx/
  example:
    de: Der Turm ist 130 Meter hoch.
    vi: Tòa tháp cao 130 mét.
  usage_vi: 'Trước danh từ đổi thành hoh-: ein hoher Turm (học ở A2).'
  lesson_refs:
  - a1.m03.l01
  tags:
  - beschreibung
  source: nwn-lern
- id: a1.m03.v.kirche
  de: Kirche
  pos: noun
  article: die
  plural: Kirchen
  vi: nhà thờ
  ipa: /ˈkɪʁçə/
  example:
    de: Die Kirche ist sehr alt.
    vi: Nhà thờ rất cổ.
  usage_vi: 'Số nhiều: Kirchen. „ch“ sau i đọc /ç/. „in der Kirche“ = trong nhà thờ; „zur Kirche gehen“ = đi đến nhà thờ.'
  lesson_refs:
  - a1.m03.l01
  tags:
  - stadt
  source: nwn-lern
- id: a1.m03.v.konzert
  de: Konzert
  pos: noun
  article: das
  plural: Konzerte
  vi: buổi hòa nhạc
  ipa: /kɔnˈtsɛʁt/
  example:
    de: Das Konzert ist am Samstag.
    vi: Buổi hòa nhạc vào thứ Bảy.
  usage_vi: 'Danh từ ghép: das Konzerthaus (nhà hòa nhạc).'
  lesson_refs:
  - a1.m03.l01
  tags:
  - freizeit
  - musik
  source: nwn-lern
- id: a1.m03.v.konzerthaus
  de: Konzerthaus
  pos: noun
  article: das
  plural: Konzerthäuser
  vi: nhà hòa nhạc
  ipa: /kɔnˈtsɛʁtˌhaʊ̯s/
  example:
    de: Die Elbphilharmonie ist ein Konzerthaus.
    vi: Elbphilharmonie là một nhà hòa nhạc.
  usage_vi: 'Từ ghép Konzert + Haus; mạo từ theo từ cuối (das Haus). Số nhiều: Konzerthäuser.'
  lesson_refs:
  - a1.m03.l01
  tags:
  - stadt
  - musik
  source: nwn
- id: a1.m03.v.meter
  de: Meter
  pos: noun
  article: der
  plural: Meter
  vi: mét
  ipa: /ˈmeːtɐ/
  example:
    de: Die Brücke ist 500 Meter lang.
    vi: Cây cầu dài 500 mét.
  usage_vi: 'Viết tắt: m. Số nhiều giống số ít.'
  lesson_refs:
  - a1.m03.l01
  tags:
  - mass
  source: nwn-lern
- id: a1.m03.v.mitte
  de: Mitte
  pos: noun
  article: die
  no_plural: true
  vi: giữa, trung tâm
  ipa: /ˈmɪtə/
  example:
    de: Das Rathaus ist in der Mitte der Stadt.
    vi: Tòa thị chính ở trung tâm thành phố.
  usage_vi: Chỉ dùng số ít.
  lesson_refs:
  - a1.m03.l01
  tags:
  - ort
  - sg-only
  source: nwn-lern
- id: a1.m03.v.rathaus
  de: Rathaus
  pos: noun
  article: das
  plural: Rathäuser
  vi: tòa thị chính
  ipa: /ˈʁaːtˌhaʊ̯s/
  example:
    de: Das Rathaus ist schön.
    vi: Tòa thị chính đẹp.
  usage_vi: Ở Đức, Rathaus là nơi làm việc của chính quyền thành phố.
  lesson_refs:
  - a1.m03.l01
  tags:
  - stadt
  source: nwn-lern
- id: a1.m03.v.star
  de: Star
  pos: noun
  article: der
  plural: Stars
  vi: ngôi sao (người nổi tiếng)
  ipa: /ʃtaːɐ̯/
  example:
    de: Die Elbphilharmonie ist ein Star.
    vi: Elbphilharmonie là một “ngôi sao”.
  usage_vi: Từ mượn tiếng Anh; người Đức đọc [ʃtaːɐ̯] hoặc [staːɐ̯] – cả hai đều được.
  lesson_refs:
  - a1.m03.l01
  tags:
  - person
  source: nwn-lern
- id: a1.m03.v.turm
  de: Turm
  pos: noun
  article: der
  plural: Türme
  vi: tòa tháp
  ipa: /tʊʁm/
  example:
    de: Der Turm ist hoch.
    vi: Tòa tháp cao.
  usage_vi: 'Số nhiều có biến âm: die Türme.'
  lesson_refs:
  - a1.m03.l01
  tags:
  - stadt
  source: nwn-lern
- id: a1.m03.v.ueber
  de: über
  pos: preposition
  vi: hơn (số lượng); về (chủ đề); qua, phía trên
  ipa: /ˈyːbɐ/
  example:
    de: Der Turm ist über 130 Meter hoch.
    vi: Tòa tháp cao hơn 130 mét.
  usage_vi: 'Từ nhiều nghĩa: über 100 = hơn 100; Informationen über Hamburg = thông tin về Hamburg.'
  lesson_refs:
  - a1.m03.l01
  tags:
  - praeposition
  - mehrdeutig
  source: nwn-lern
- id: a1.m03.v.circa
  de: circa
  pos: adverb
  vi: khoảng, chừng
  ipa: /ˈtsɪʁka/
  example:
    de: Die Tour dauert circa zwei Stunden.
    vi: Chuyến tham quan kéo dài khoảng hai giờ.
  usage_vi: 'Viết tắt: ca. – c đầu đọc [ts].'
  lesson_refs:
  - a1.m03.l01
  tags:
  - zahl
  source: nwn-lern
- id: a1.m03.v.da
  de: da
  pos: adverb
  vi: ở đó, đó
  ipa: /daː/
  example:
    de: Da ist das Rathaus!
    vi: Kìa, tòa thị chính đó!
  usage_vi: 'Chỉ vào một chỗ: Da! = Ở đó!'
  lesson_refs:
  - a1.m03.l01
  tags:
  - ort
  source: nwn-lern
- id: a1.m03.v.fluss
  de: Fluss
  pos: noun
  article: der
  plural: Flüsse
  vi: con sông
  ipa: /flʊs/
  example:
    de: Die Elbe ist ein Fluss.
    vi: Elbe là một con sông.
  usage_vi: 'ss sau nguyên âm ngắn. Số nhiều: die Flüsse.'
  lesson_refs:
  - a1.m03.l01
  tags:
  - natur
  - stadt
  source: nwn-lern
- id: a1.m03.v.hafen
  de: Hafen
  pos: noun
  article: der
  plural: Häfen
  vi: bến cảng
  ipa: /ˈhaːfn̩/
  example:
    de: Der Hafen in Hamburg ist groß.
    vi: Cảng Hamburg rất lớn.
  usage_vi: 'Số nhiều chỉ có biến âm: die Häfen.'
  lesson_refs:
  - a1.m03.l01
  tags:
  - stadt
  - verkehr
  source: nwn
- id: a1.m03.v.meer
  de: Meer
  pos: noun
  article: das
  plural: Meere
  vi: biển
  ipa: /meːɐ̯/
  example:
    de: Hamburg ist nicht am Meer.
    vi: Hamburg không nằm bên bờ biển.
  usage_vi: 'ee đọc [eː] dài. Phân biệt: das Meer (biển) – der See (hồ, bài 2) – die See (biển, văn viết).'
  lesson_refs:
  - a1.m03.l01
  tags:
  - natur
  source: nwn-lern
- id: a1.m03.v.mensch
  de: Mensch
  pos: noun
  article: der
  plural: Menschen
  vi: con người
  ipa: /mɛnʃ/
  example:
    de: In Hamburg wohnen viele Menschen.
    vi: Ở Hamburg có nhiều người sinh sống.
  usage_vi: Số nhiều -en.
  lesson_refs:
  - a1.m03.l01
  tags:
  - person
  source: nwn-lern
- id: a1.m03.v.nach
  de: nach
  pos: preposition
  vi: đến, tới (thành phố, nước)
  ipa: /naːx/
  example:
    de: Der Zug fährt nach Berlin.
    vi: Tàu chạy đến Berlin.
  usage_vi: 'nach + tên thành phố/nước không mạo từ. Đã gặp ở nghĩa khác: „nach … fragen“ (hỏi về). Từ nhiều nghĩa.'
  lesson_refs:
  - a1.m03.l01
  tags:
  - praeposition
  - verkehr
  - mehrdeutig
  source: nwn-lern
- id: a1.m03.v.schiff
  de: Schiff
  pos: noun
  article: das
  plural: Schiffe
  vi: con tàu (thủy)
  ipa: /ʃɪf/
  example:
    de: Die Schiffe fahren auf der Elbe.
    vi: Những con tàu chạy trên sông Elbe.
  usage_vi: auf der Elbe = trên sông Elbe (cụm cố định).
  lesson_refs:
  - a1.m03.l01
  tags:
  - verkehr
  source: nwn-lern
- id: a1.m03.v.sehen
  de: sehen
  pos: verb
  vi: nhìn thấy, xem
  forms:
    text: du siehst, er sieht
    er: sieht
  ipa: /ˈzeːən/
  example:
    de: Da sehen Sie das Rathaus.
    vi: Ở đó quý vị thấy tòa thị chính.
  usage_vi: 'Đổi nguyên âm e → ie: du siehst, er sieht.'
  lesson_refs:
  - a1.m03.l01
  tags:
  - verb
  - unregelmaessig
  source: nwn-lern
- id: a1.m03.v.zug
  de: Zug
  pos: noun
  article: der
  plural: Züge
  vi: tàu hỏa
  ipa: /tsuːk/
  example:
    de: Der Zug fährt nach Wien.
    vi: Tàu chạy đi Viên.
  usage_vi: 'g cuối đọc [k]. Số nhiều: die Züge.'
  lesson_refs:
  - a1.m03.l01
  tags:
  - verkehr
  source: nwn-lern
- id: a1.m03.v.ausstellung
  de: Ausstellung
  pos: noun
  article: die
  plural: Ausstellungen
  vi: triển lãm
  ipa: /ˈaʊ̯sˌʃtɛlʊŋ/
  example:
    de: Die Ausstellung ist interessant.
    vi: Cuộc triển lãm thú vị.
  usage_vi: -ung → die.
  lesson_refs:
  - a1.m03.l01
  tags:
  - freizeit
  - kultur
  source: nwn-lern
- id: a1.m03.v.bruecke
  de: Brücke
  pos: noun
  article: die
  plural: Brücken
  vi: cây cầu
  ipa: /ˈbʁʏkə/
  example:
    de: Hamburg hat viele Brücken.
    vi: Hamburg có nhiều cây cầu.
  usage_vi: ck sau nguyên âm ngắn.
  lesson_refs:
  - a1.m03.l01
  tags:
  - stadt
  source: nwn-lern
- id: a1.m03.v.lang
  de: lang
  pos: adjective
  vi: dài
  ipa: /laŋ/
  example:
    de: Die Brücke ist lang.
    vi: Cây cầu dài.
  usage_vi: 'Trái nghĩa: kurz (Kapitel 1).'
  lesson_refs:
  - a1.m03.l01
  tags:
  - beschreibung
  source: nwn-lern
- id: a1.m03.v.ort
  de: Ort
  pos: noun
  article: der
  plural: Orte
  vi: địa điểm, nơi chốn
  ipa: /ɔʁt/
  example:
    de: Der Hafen ist mein Lieblingsort.
    vi: Bến cảng là nơi tôi thích nhất.
  usage_vi: Đã gặp trong der Wohnort, der Geburtsort.
  lesson_refs:
  - a1.m03.l01
  tags:
  - ort
  source: nwn-lern
- id: a1.m03.v.stadttour
  de: Stadttour
  pos: noun
  article: die
  plural: Stadttouren
  vi: chuyến tham quan thành phố
  ipa: /ˈʃtatˌtuːɐ̯/
  example:
    de: Die Stadttour beginnt am Rathaus.
    vi: Chuyến tham quan bắt đầu ở tòa thị chính.
  usage_vi: die Stadt + die Tour.
  lesson_refs:
  - a1.m03.l01
  tags:
  - stadt
  - reise
  source: nwn
- id: a1.m03.v.ein
  de: ein
  pos: article
  vi: một (mạo từ không xác định)
  ipa: /aɪ̯n/
  example:
    de: Das ist ein Hotel.
    vi: Đó là một khách sạn.
  usage_vi: ein trước danh từ giống đực/trung, eine trước giống cái. Không có số nhiều. (Lernwortschatz Kapitel 1, dạy kỹ ở đây.)
  lesson_refs:
  - a1.m03.l02
  tags:
  - artikel
  source: nwn-lern
- id: a1.m03.v.weg
  de: Weg
  pos: noun
  article: der
  plural: Wege
  vi: con đường, lối đi
  ipa: /veːk/
  example:
    de: Wie ist der Weg zum Hotel?
    vi: Đường đến khách sạn thế nào?
  usage_vi: 'Phân biệt: der Weg (lối đi, đường đi đến đâu) – die Straße (con phố có tên).'
  lesson_refs:
  - a1.m03.l02
  tags:
  - ort
  - verkehr
  source: nwn-lern
- id: a1.m03.v.interessant
  de: interessant
  pos: adjective
  vi: thú vị
  ipa: /ɪntəʁɛˈsant/
  example:
    de: Hamburg ist interessant.
    vi: Hamburg rất thú vị.
  usage_vi: 'Trọng âm ở cuối: in-te-res-SANT.'
  lesson_refs:
  - a1.m03.l02
  tags:
  - bewertung
  source: nwn-lern
- id: a1.m03.v.loesung
  de: Lösung
  pos: noun
  article: die
  plural: Lösungen
  vi: lời giải, đáp án
  ipa: /ˈløːzʊŋ/
  example:
    de: Die Lösung ist richtig.
    vi: Đáp án đúng.
  usage_vi: -ung → die.
  lesson_refs:
  - a1.m03.l02
  tags:
  - lernen
  source: nwn-lern
- id: a1.m03.v.plan
  de: Plan
  pos: noun
  article: der
  plural: Pläne
  vi: bản đồ (thành phố); kế hoạch
  ipa: /plaːn/
  example:
    de: Hast du einen Stadtplan?
    vi: Bạn có bản đồ thành phố không?
  usage_vi: 'Từ nhiều nghĩa: der Stadtplan (bản đồ), der Plan (kế hoạch).'
  lesson_refs:
  - a1.m03.l02
  tags:
  - stadt
  - mehrdeutig
  source: nwn-lern
- id: a1.m03.v.rechts
  de: rechts
  pos: adverb
  vi: bên phải
  ipa: /ʁɛçts/
  example:
    de: Das Hotel ist rechts.
    vi: Khách sạn ở bên phải.
  usage_vi: 'Trái nghĩa: links (bài 4).'
  lesson_refs:
  - a1.m03.l02
  tags:
  - richtung
  source: nwn-lern
- id: a1.m03.v.schon
  de: schon
  pos: adverb
  vi: đã, rồi
  ipa: /ʃoːn/
  example:
    de: Da ist schon das Hotel!
    vi: Khách sạn kia rồi!
  usage_vi: Đừng nhầm với schön (đẹp) – chỉ khác Umlaut.
  lesson_refs:
  - a1.m03.l02
  tags:
  - zeit
  source: nwn-lern
- id: a1.m03.v.schoen
  de: schön
  pos: adjective
  vi: đẹp
  ipa: /ʃøːn/
  example:
    de: Der See ist schön.
    vi: Cái hồ đẹp.
  usage_vi: ö dài [øː]. „Schönes Wochenende!“ = Chúc cuối tuần vui vẻ!
  lesson_refs:
  - a1.m03.l02
  tags:
  - bewertung
  source: nwn-lern
- id: a1.m03.v.see
  de: See
  pos: noun
  article: der
  plural: Seen
  vi: hồ
  ipa: /zeː/
  example:
    de: Die Alster ist ein See in Hamburg.
    vi: Alster là một hồ ở Hamburg.
  usage_vi: 'der See = hồ; die See = biển (văn viết). Số nhiều: die Seen [ˈzeːən].'
  lesson_refs:
  - a1.m03.l02
  tags:
  - natur
  - mehrdeutig
  source: nwn-lern
- id: a1.m03.v.zeichnen
  de: zeichnen
  pos: verb
  vi: vẽ
  forms:
    text: du zeichnest, er zeichnet
    er: zeichnet
  ipa: /ˈtsaɪ̯çnən/
  example:
    de: Zeichnen Sie den Weg.
    vi: Hãy vẽ đường đi.
  usage_vi: Gốc tận cùng -n sau phụ âm → du zeichnest (thêm e).
  lesson_refs:
  - a1.m03.l02
  tags:
  - verb
  - arbeitsanweisung
  source: nwn-lern
- id: a1.m03.v.auf-stehen
  de: auf|stehen
  pos: verb
  vi: đứng dậy; thức dậy
  forms:
    text: du stehst auf, er steht auf
    er: steht auf
    separable: true
  ipa: /ˈaʊ̯fˌʃteːən/
  example:
    de: Stehen Sie auf!
    vi: Hãy đứng dậy!
  usage_vi: Động từ tách (Kapitel 6). Nghĩa “thức dậy” dùng nhiều ở Kapitel 5.
  lesson_refs:
  - a1.m03.l02
  tags:
  - verb
  - trennbar
  - mehrdeutig
  source: nwn-lern
- id: a1.m03.v.gruppe
  de: Gruppe
  pos: noun
  article: die
  plural: Gruppen
  vi: nhóm
  ipa: /ˈɡʁʊpə/
  example:
    de: Wir arbeiten in Gruppen.
    vi: Chúng ta làm việc theo nhóm.
  usage_vi: 'Số nhiều: Gruppen. „in Gruppen arbeiten“ = làm việc theo nhóm; „Gruppenarbeit“ = bài tập nhóm.'
  lesson_refs:
