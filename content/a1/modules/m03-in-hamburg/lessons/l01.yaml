summary_vi: 'Địa điểm: der Bahnhof, der Hafen, der Turm, der Fluss, die Kirche, die Brücke, die Ausstellung, das Rathaus, das Konzerthaus, das Meer, das Schiff. Mô tả: sein + (số đo) + tính từ: Der Turm ist 130 Meter hoch. sehen: du siehst, er sieht. nach + thành phố: Der Zug fährt nach Berlin.'
self_check:
- Tôi gọi tên được 10 địa điểm trong thành phố kèm mạo từ.
- 'Tôi mô tả được một địa điểm: hoch, lang, breit, alt, schön.'
- Tôi hiểu thông tin chính của một chuyến tham quan.
- Tôi giới thiệu được ngắn gọn thành phố của mình.
blocks:
- id: a1.m03.l01.b1
  kind: explanation
  title_vi: Giới thiệu bài học
  body_vi: '**Kapitel 3 đưa bạn đến Hamburg** – thành phố lớn thứ hai nước Đức, nằm bên **sông Elbe** và có **bến cảng** rất lớn.


    Trong bài này, bạn tham gia một **chuyến tham quan thành phố (Stadttour)** và học tên các địa điểm:

    *der Bahnhof, die Kirche, das Rathaus, der Hafen, die Brücke…* Nhớ học **kèm mạo từ**!


    Bạn cũng học cách **mô tả**: *Der Turm ist hoch. Die Brücke ist lang. Der Fluss ist breit.*

    Và nói số đo: *über 130 Meter hoch*, *circa 2 Stunden*.


    **Động từ mới quan trọng:** *sehen* (nhìn thấy) – đổi nguyên âm: *du siehst, er sieht*.'
- id: a1.m03.l01.b2
  kind: explanation
  title_vi: Mô tả với sein + tính từ
  skill: grammar
  body_vi: 'Tiếng Đức mô tả bằng sein + tính từ (tính từ đứng cuối, không đổi đuôi): Der Turm ist hoch. Số đo đứng trước tính từ: 130 Meter hoch, 500 Meter lang. Chủ điểm sein + tính từ được học kỹ hơn ở Kapitel 9.'
  examples:
  - de: Die Brücke ist 500 Meter lang.
    vi: Cây cầu dài 500 mét.
  - de: Die Elbe ist breit.
    vi: Sông Elbe rộng.
- id: a1.m03.l01.b3
  kind: explanation
  title_vi: 'nach + thành phố: đi đến đâu'
  skill: grammar
  body_vi: 'Tàu xe đi đến một thành phố/nước (không mạo từ): nach + tên. Der Zug fährt nach Berlin. Đến từ đâu: aus (Kapitel 1).'
  examples:
  - de: Die Schiffe fahren nach Amerika.
    vi: Những con tàu đi đến châu Mỹ.
- id: a1.m03.l01.b4
  kind: pronunciation
  title_vi: Từ ghép chỉ địa điểm
  skill: pronunciation
  body_vi: 'Từ ghép chỉ địa điểm


    Từ ghép nhấn phần đầu: BAHN-hof, RAT-haus, KON-zert-haus (Konzert nhấn ZERT: kon-ZERT-haus). th trong Rathaus đọc [t] (Rat + Haus).


    Luyện tập: Đọc to các địa điểm trong bài, mỗi từ kèm mạo từ.'
  items:
  - de: der Bahnhof
    vi: nhà ga
    ipa: '[ˈbaːnˌhoːf]'
  - de: das Rathaus
    vi: tòa thị chính
    ipa: '[ˈʁaːtˌhaʊ̯s]'
- id: a1.m03.l01.b5
  kind: examples
  title_vi: Câu ví dụ
  examples:
  - de: Hamburg ist eine Stadt in Deutschland.
    vi: Hamburg là một thành phố ở Đức.
  - de: Der Hafen ist sehr groß.
    vi: Bến cảng rất lớn.
  - de: Da sehen Sie die Kirche.
    vi: Ở đó quý vị thấy nhà thờ.
  - de: Die Tour dauert circa zwei Stunden.
    vi: Chuyến tham quan kéo dài khoảng hai tiếng.
  - de: Die Schiffe fahren auf der Elbe.
    vi: Những con tàu chạy trên sông Elbe.
  - de: In Hamburg wohnen fast zwei Millionen Menschen.
    vi: Hamburg có gần hai triệu người sinh sống.
- id: a1.m03.l01.b6
  kind: listening
  title_vi: 'Stadttour: chuyến tham quan Hamburg'
  lines:
  - speaker: Stadtführerin
    de: Herzlich willkommen in Hamburg! Die erste Station ist das Rathaus. Es ist sehr schön und über 100 Jahre alt.
    vi: Chào mừng quý vị đến Hamburg! Điểm dừng đầu tiên là tòa thị chính. Nó rất đẹp và hơn 100 năm tuổi.
  - speaker: Stadtführerin
    de: Und da sehen Sie den Michel. Der Michel ist eine Kirche. Der Turm ist über 130 Meter hoch.
    vi: Và ở đó quý vị thấy Michel. Michel là một nhà thờ. Tòa tháp cao hơn 130 mét.
  - speaker: Stadtführerin
    de: Jetzt sind wir am Hafen. Die Elbe ist hier sehr breit. Da sehen Sie viele Schiffe. Und da ist die Elbphilharmonie – ein Konzerthaus und ein Star in Hamburg!
    vi: Bây giờ chúng ta ở bến cảng. Sông Elbe ở đây rất rộng. Ở đó quý vị thấy nhiều con tàu. Và kia là Elbphilharmonie – một nhà hòa nhạc và là “ngôi sao” của Hamburg!
  audio_status: pending-tts
  situation_vi: Hướng dẫn viên giới thiệu ba điểm dừng.
  skill: listening
  audio:
    speed: slow
- id: a1.m03.l01.b7
  kind: reading
  title_vi: Tờ thông tin du lịch
  paragraphs:
  - de: 'Hamburg – Stadttour (circa 2 Stunden, 15 Euro)

      Station 1: das Rathaus – in der Mitte der Stadt

      Station 2: der Michel – eine Kirche, der Turm ist über 130 Meter hoch

      Station 3: der Hafen – viele Schiffe aus der ganzen Welt

      Station 4: die Elbphilharmonie – ein Konzerthaus, circa 110 Meter hoch

      Start: am Rathaus, jeden Tag um 11 Uhr'
    vi: 'Hamburg – Tham quan thành phố (khoảng 2 tiếng, 15 euro)

      Điểm 1: tòa thị chính – ở trung tâm thành phố

      Điểm 2: Michel – một nhà thờ, tòa tháp cao hơn 130 mét

      Điểm 3: bến cảng – nhiều con tàu từ khắp thế giới

      Điểm 4: Elbphilharmonie – một nhà hòa nhạc, cao khoảng 110 mét

      Xuất phát: ở tòa thị chính, mỗi ngày lúc 11 giờ'
  text_type_vi: Tờ rơi thông tin
  skill: reading
  glossary:
  - de: die Station
    vi: điểm dừng
  - de: um 11 Uhr
    vi: lúc 11 giờ (Kapitel 5)
- id: a1.m03.l01.b8
  kind: speaking
  title_vi: Giới thiệu thành phố của bạn
  skill: speaking
  task_vi: 'Giới thiệu thành phố của bạn (hoặc một thành phố bạn biết) bằng 4–5 câu: tên, có những địa điểm gì, mô tả một địa điểm.'
  steps_vi:
  - Das ist … Es ist eine Stadt in …
  - … hat einen Bahnhof / eine Kirche / viele Brücken …
  - 'Mô tả: Der Fluss ist breit. Die Brücke ist lang.'
  lines:
  - speaker: Minh
    de: Das ist Hanoi. Hanoi ist eine Stadt in Vietnam. Da ist der Rote Fluss. Er ist breit. Die Long-Bien-Brücke ist sehr lang und alt.
    vi: Đây là Hà Nội. Hà Nội là một thành phố ở Việt Nam. Ở đó có sông Hồng. Sông rộng. Cầu Long Biên rất dài và cổ.
- id: a1.m03.l01.b9
  kind: writing
  title_vi: Tờ thông tin cho thành phố của bạn
  skill: writing
  task_vi: Viết tờ thông tin ngắn (4 điểm dừng) cho một chuyến tham quan thành phố bạn biết, giống phần Đọc.
  model:
    de: 'Hanoi – Stadttour: Station 1: der See Hoan Kiem – in der Mitte der Stadt. Station 2: die Long-Bien-Brücke – sehr lang und alt. Station 3: der Bahnhof. Station 4: das Theater.'
    vi: 'Hà Nội – Tham quan: Điểm 1: hồ Hoàn Kiếm – ở trung tâm. Điểm 2: cầu Long Biên – rất dài và cổ. Điểm 3: nhà ga. Điểm 4: nhà hát.'
  checklist_vi:
  - Mỗi địa điểm có mạo từ đúng.
  - Có ít nhất 2 mô tả với tính từ (alt, lang, schön, hoch…).
