kind: kapitel
order: 7
title_de: Zeit mit Freunden
title_vi: Thời gian với bạn bè
summary_vi: 'Chủ đề giải trí và thời gian cùng bạn bè: các hoạt động ngoài trời và dạo phố, động từ tách (mitmachen, ausgehen, vorbeikommen...), tổ chức sinh nhật bất ngờ, số thứ tự và ngày tháng (am ersten Mai...), quà tặng và thiệp mời với für + Akkusativ, đại từ nhân xưng ở Akkusativ (mich, dich, ihn, uns...), gọi món và văn hóa thanh toán tại nhà hàng (getrennt, zusammen, Trinkgeld), kể lại sự việc cuối tuần với thì quá khứ của sein và haben (war, hatte), cùng văn hóa quán xá Kneipen & sự kiện giải trí ở D-A-CH.'
