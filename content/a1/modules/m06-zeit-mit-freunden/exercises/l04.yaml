exercises:
- id: a1.m06.l04.ex.01
  type: matching
  skill: vocabulary
  difficulty: 1
  objective_refs:
  - a1.m06.l04.obj1
  - a1.m06.l04.obj2
  instructions_vi: Nối từ vựng nhà hàng ở cột trái với ý nghĩa tiếng Việt tương ứng ở cột phải.
  items:
  - id: a1.m06.l04.ex.01.q1
    pairs:
    - left: die Speisekarte
      right: thực đơn món ăn
    - left: die Bedienung
      right: nhân viên phục vụ, việc phục vụ
    - left: getrennt zahlen
      right: thanh toán riêng phần của mỗi người
    - left: das Trinkgeld
      right: tiền boa cho nhân viên phục vụ
    - left: stimmt so
      right: khỏi thối lại, giữ lấy tiền thừa
    - left: die Quittung
      right: biên lai hóa đơn
    explanation_vi: Các thuật ngữ cơ bản khi đi ăn tại nhà hàng ở Đức.
- id: a1.m06.l04.ex.02
  type: multiple-choice
  skill: vocabulary
  difficulty: 1
  objective_refs:
  - a1.m06.l04.obj2
  - a1.m06.l04.obj3
  instructions_vi: Chọn từ hoặc cụm từ thích hợp nhất để hoàn thành câu.
  items:
  - id: a1.m06.l04.ex.02.q1
    prompt: Entschuldigung, bringen Sie uns bitte die ___!
    options:
    - id: a
      text: Quittung
    - id: b
      text: Speisekarte
    - id: c
      text: Endbetrag
    - id: d
      text: Trinkgeld
    answer:
    - b
    explanation_vi: 'Khi mới vào quán, khách xin xem thực đơn: ''die Speisekarte''.'
  - id: a1.m06.l04.ex.02.q2
    prompt: Zahlen Sie zusammen oder ___? – Getrennt, bitte!
    options:
    - id: a
      text: stimmt so
    - id: b
      text: bar
    - id: c
      text: getrennt
    - id: d
      text: geöffnet
    answer:
    - c
    explanation_vi: 'Cặp đối ứng quen thuộc: zusammen oder getrennt (chung hay riêng).'
  - id: a1.m06.l04.ex.02.q3
    prompt: 'Das Essen kostet 18 Euro. Ich gebe 20 Euro und sage: „___!“'
    options:
    - id: a
      text: Auf Wiedersehen
    - id: b
      text: Stimmt so
    - id: c
      text: Guten Appetit
    - id: d
      text: Herzlichen Glückwunsch
    answer:
    - b
    explanation_vi: 'Cụm câu quen thuộc khi boa tiền thừa: ''Stimmt so!'' (Khỏi thối lại).'
  - id: a1.m06.l04.ex.02.q4
    prompt: Kann ich mit ___ bezahlen? – Ja, wir nehmen Visa und Mastercard.
    options:
    - id: a
      text: Rechnung
    - id: b
      text: Trinkgeld
    - id: c
      text: Bedienung
    - id: d
      text: Kreditkarte
    answer:
    - d
    explanation_vi: 'Thanh toán bằng thẻ tín dụng: ''mit Kreditkarte''.'
- id: a1.m06.l04.ex.03
  type: multiple-choice
  skill: listening
  difficulty: 2
  objective_refs:
  - a1.m06.l04.obj1
  - a1.m06.l04.obj2
  instructions_vi: Nghe đoạn thoại trong nhà hàng rồi chọn câu trả lời đúng.
  stimulus:
    ref: a1.m06.l04.b6
  items:
  - id: a1.m06.l04.ex.03.q1
    prompt: Was bestellt Anna?
    options:
    - id: a
      text: ein Schnitzel mit Pommes
    - id: b
      text: nur einen Salat
    - id: c
      text: einen Fischteller mit Kartoffeln und einen Apfelsaft
    - id: d
      text: nur Bier
    answer:
    - c
    explanation_vi: 'Anna gọi: ''Ich möchte bitte einen Fischteller mit Kartoffeln und einen Apfelsaft''.'
  - id: a1.m06.l04.ex.03.q2
    prompt: Wie möchten Anna und Ben bezahlen?
    options:
    - id: a
      text: zusammen
    - id: b
      text: gar nicht
    - id: c
      text: nur mit Kreditkarte
    - id: d
      text: getrennt
    answer:
    - d
    explanation_vi: 'Ben nói rõ với nhân viên: ''Getrennt, bitte!''.'
- id: a1.m06.l04.ex.04
  type: fill-blank
  skill: listening
  difficulty: 2
  objective_refs:
  - a1.m06.l04.obj2
  - a1.m06.l04.obj3
  instructions_vi: Nghe và điền từ thích hợp vào chỗ trống.
  stimulus:
    ref: a1.m06.l04.b6
  items:
  - id: a1.m06.l04.ex.04.q1
    prompt: 'Bens Essen macht 14 Euro. Er gibt der Bedienung 16 Euro und sagt: „___ so!“'
    answers:
    - Stimmt
    explanation_vi: 'Mẫu câu: ''Stimmt so!'' (tiền boa 2 euro).'
- id: a1.m06.l04.ex.05
  type: true-false
  skill: reading
  difficulty: 2
  objective_refs:
  - a1.m06.l04.obj2
  - a1.m06.l04.obj4
  instructions_vi: Đọc bài viết về văn hóa nhà hàng tại Đức và xác định các câu sau là Đúng (true) hay Sai (false).
  stimulus:
    ref: a1.m06.l04.b7
  items:
  - id: a1.m06.l04.ex.05.q1
    prompt: In Deutschland ist es unhöflich, getrennt zu bezahlen.
    answer: false
    explanation_vi: Sai. Việc trả tiền riêng là hoàn toàn bình thường ('Es ist völlig normal...').
  - id: a1.m06.l04.ex.05.q2
    prompt: Das Trinkgeld ist immer schon automatisch in der Rechnung enthalten.
    answer: false
    explanation_vi: Sai. Tiền boa không bao gồm sẵn trong hóa đơn ('Das Trinkgeld ist nicht auf der Rechnung enthalten').
  - id: a1.m06.l04.ex.05.q3
    prompt: Man gibt in Deutschland circa 5 bis 10 Prozent Trinkgeld bei gutem Service.
    answer: true
    explanation_vi: Đúng. 'Wenn der Service gut war, gibt man circa 5 bis 10 Prozent Trinkgeld'.
- id: a1.m06.l04.ex.06
  type: fill-blank
  skill: speaking
  difficulty: 2
  objective_refs:
  - a1.m06.l04.obj1
  - a1.m06.l04.obj2
  instructions_vi: Điền từ thích hợp vào câu thanh toán tiền.
  items:
  - id: a1.m06.l04.ex.06.q1
    prompt: Wir möchten bitte ___. Zahlen Sie zusammen oder ___?
    answers:
    - bezahlen
    - getrennt
    explanation_vi: 1. bezahlen (thanh toán). 2. getrennt (riêng).
- id: a1.m06.l04.ex.07
  type: word-order
  skill: writing
  difficulty: 2
  objective_refs:
  - a1.m06.l04.obj2
  - a1.m06.l04.obj3
  instructions_vi: Sắp xếp các từ bị xáo trộn thành câu đúng ngữ pháp.
  items:
  - id: a1.m06.l04.ex.07.q1
    tokens:
    - zahlen
    - bitte
    - Wir
    - möchten
    - getrennt
    answer: Wir möchten bitte getrennt zahlen.
    prompt_vi: 'Sắp xếp câu yêu cầu tính tiền:'
    explanation_vi: Chủ ngữ 'Wir' + 'möchten' vị trí 2 + 'bitte getrennt' + Infinitiv 'zahlen' ở cuối câu.
  - id: a1.m06.l04.ex.07.q2
    tokens:
    - Fischteller
    - einen
    - Ich
    - nehme
    - bitte
    answer: Ich nehme bitte einen Fischteller.
    prompt_vi: 'Sắp xếp câu gọi món:'
    explanation_vi: Chủ ngữ 'Ich' + 'nehme' vị trí 2 + 'bitte' + tân ngữ Akkusativ 'einen Fischteller'.
