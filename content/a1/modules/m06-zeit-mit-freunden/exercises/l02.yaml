exercises:
- id: a1.m06.l02.ex.01
  type: matching
  skill: vocabulary
  difficulty: 1
  objective_refs:
  - a1.m06.l02.obj2
  instructions_vi: Nối số thứ tự viết bằng chữ số với cách đọc tương ứng khi đứng sau am.
  items:
  - id: a1.m06.l02.ex.01.q1
    pairs:
    - left: am 1. Mai
      right: am ersten Mai
    - left: am 3. Oktober
      right: am dritten Oktober
    - left: am 7. Juli
      right: am siebten Juli
    - left: am 8. August
      right: am achten August
    - left: am 20. Mai
      right: am zwanzigsten Mai
    - left: am 31. Dezember
      right: am einunddreißigsten Dezember
    explanation_vi: Quy tắc đọc số thứ tự ngày tháng đi kèm giới từ am.
- id: a1.m06.l02.ex.02
  type: multiple-choice
  skill: grammar
  difficulty: 1
  objective_refs:
  - a1.m06.l02.obj2
  instructions_vi: Chọn dạng đúng của số thứ tự để hoàn thành câu.
  items:
  - id: a1.m06.l02.ex.02.q1
    prompt: Mein Geburtstag ist am ___ (1.) Januar.
    options:
    - id: a
      text: eins
    - id: b
      text: erste
    - id: c
      text: ersten
    - id: d
      text: erster
    answer:
    - c
    explanation_vi: 'Sau am, số thứ tự thêm đuôi -ten: am ersten.'
  - id: a1.m06.l02.ex.02.q2
    prompt: Heute ist der ___ (3.) Mai.
    options:
    - id: a
      text: drei
    - id: b
      text: dritte
    - id: c
      text: dritten
    - id: d
      text: dreite
    answer:
    - b
    explanation_vi: 'Sau mạo từ der ở Nominativ, số thứ tự từ 1–19 thêm đuôi -te: der dritte.'
  - id: a1.m06.l02.ex.02.q3
    prompt: Die Party findet am ___ (20.) August statt.
    options:
    - id: a
      text: zwanzigste
    - id: b
      text: zwanzigster
    - id: c
      text: zwanzigsten
    - id: d
      text: zwanzig
    answer:
    - c
    explanation_vi: 'Từ 20 trở lên, sau am thêm đuôi -sten: am zwanzigsten.'
- id: a1.m06.l02.ex.03
  type: multiple-choice
  skill: listening
  difficulty: 2
  objective_refs:
  - a1.m06.l02.obj1
  - a1.m06.l02.obj4
  instructions_vi: Nghe đoạn hội thoại giữa Ben và Mia rồi chọn câu trả lời đúng.
  stimulus:
    ref: a1.m06.l02.b5
  items:
  - id: a1.m06.l02.ex.03.q1
    prompt: Wann hat Sofia Geburtstag?
    options:
    - id: a
      text: am 2. Mai
    - id: b
      text: am 15. Mai
    - id: c
      text: am 31. Mai
    - id: d
      text: am 20. Mai
    answer:
    - d
    explanation_vi: 'Mia nói: ''sie hat am zwanzigsten Mai Geburtstag''.'
  - id: a1.m06.l02.ex.03.q2
    prompt: Was planen Ben und Mia für Sofia?
    options:
    - id: a
      text: einen Ausflug in die Berge
    - id: b
      text: gar nichts
    - id: c
      text: eine Theaterreise
    - id: d
      text: eine Geburtstagsparty
    answer:
    - d
    explanation_vi: 'Ben nói: ''Dann können wir am zwanzigsten Mai eine tolle Geburtstagsparty für sie feiern''.'
- id: a1.m06.l02.ex.04
  type: fill-blank
  skill: listening
  difficulty: 2
  objective_refs:
  - a1.m06.l02.obj1
  - a1.m06.l02.obj2
  instructions_vi: Nghe và điền từ thích hợp vào chỗ trống.
  stimulus:
    ref: a1.m06.l02.b5
  items:
  - id: a1.m06.l02.ex.04.q1
    prompt: Der 20. Mai ist ein ___. Die Freunde feiern eine tolle ___.
    answers:
    - Samstag
    - Geburtstagsparty
    explanation_vi: 1. Samstag. 2. Geburtstagsparty.
- id: a1.m06.l02.ex.05
  type: true-false
  skill: reading
  difficulty: 2
  objective_refs:
  - a1.m06.l02.obj3
  - a1.m06.l02.obj4
  instructions_vi: Đọc tấm thiệp sinh nhật gửi David và xác định các câu sau là Đúng (true) hay Sai (false).
  stimulus:
    ref: a1.m06.l02.b6
  items:
  - id: a1.m06.l02.ex.05.q1
    prompt: David hat am 15. September Geburtstag.
    answer: true
    explanation_vi: Đúng. 'Heute ist der 15. September, dein großer Ehrentag!'.
  - id: a1.m06.l02.ex.05.q2
    prompt: Die Freunde wünschen David nur Pech und viel Arbeit.
    answer: false
    explanation_vi: Sai. Các bạn chúc may mắn, sức khỏe và niềm vui ('viel Glück, Gesundheit, Erfolg...').
  - id: a1.m06.l02.ex.05.q3
    prompt: Heute Abend gibt es eine Geburtstagsparty für David.
    answer: true
    explanation_vi: Đúng. 'Wir freuen uns schon sehr auf deine Geburtstagsparty heute Abend!'.
- id: a1.m06.l02.ex.06
  type: fill-blank
  skill: speaking
  difficulty: 2
  objective_refs:
  - a1.m06.l02.obj1
  - a1.m06.l02.obj3
  instructions_vi: Điền từ thích hợp vào câu chúc mừng sinh nhật.
  items:
  - id: a1.m06.l02.ex.06.q1
    prompt: Herzlichen ___ zum Geburtstag! Alles Gute zum neuen ___!
    answers:
    - Glückwunsch
    - Lebensjahr
    explanation_vi: 1. Glückwunsch (Herzlichen Glückwunsch). 2. Lebensjahr (tuổi mới).
- id: a1.m06.l02.ex.07
  type: word-order
  skill: writing
  difficulty: 2
  objective_refs:
  - a1.m06.l02.obj1
  - a1.m06.l02.obj2
  instructions_vi: Sắp xếp các từ bị xáo trộn thành câu hoàn chỉnh đúng ngữ pháp.
  items:
  - id: a1.m06.l02.ex.07.q1
    tokens:
    - Geburtstag
    - habe
    - achten
    - Ich
    - am
    - März
    answer: Ich habe am achten März Geburtstag.
    prompt_vi: 'Sắp xếp câu nói về ngày sinh nhật:'
    explanation_vi: Chủ ngữ 'Ich' + 'habe' ở vị trí 2 + 'am achten März' + 'Geburtstag'.
  - id: a1.m06.l02.ex.07.q2
    tokens:
    - Glückwunsch
    - Geburtstag
    - Herzlichen
    - zum
    answer: Herzlichen Glückwunsch zum Geburtstag.
    prompt_vi: 'Sắp xếp câu chúc mừng:'
    explanation_vi: 'Mẫu câu chúc mừng chuẩn: ''Herzlichen Glückwunsch zum Geburtstag''.'
