entries:
- id: a1.m06.v.vorbeikommen
  de: vorbeikommen
  pos: verb
  vi: ghé qua chơi, tạt qua thăm
  forms:
    text: du kommst vorbei, er kommt vorbei
    er: kommt vorbei
    separable: true
  ipa: /foːɐ̯ˈbaɪ̯ˌkɔmən/
  example:
    de: Kommst du heute Abend bei mir vorbei?
    vi: Tối nay bạn ghé qua nhà mình chơi nhé?
  usage_vi: 'Động từ tách: vorbei ở cuối câu.'
  lesson_refs:
  - a1.m06.l01
  tags:
  - verb
  - freizeit
  - trennbar
  source: nwn-lern
- id: a1.m06.v.ausgehen
  de: ausgehen
  pos: verb
  vi: đi ra ngoài chơi, đi chơi tối
  forms:
    text: du gehst aus, er geht aus
    er: geht aus
    separable: true
  ipa: /ˈaʊ̯sˌɡeːən/
  example:
    de: Am Freitag wollen wir ausgehen.
    vi: Tối thứ Sáu chúng tôi muốn đi chơi.
  usage_vi: 'Động từ tách: aus ở cuối câu.'
  lesson_refs:
  - a1.m06.l01
  tags:
  - verb
  - freizeit
  - trennbar
  source: nwn-lern
- id: a1.m06.v.mitmachen
  de: mitmachen
  pos: verb
  vi: tham gia cùng
  forms:
    text: du machst mit, er macht mit
    er: macht mit
    separable: true
  ipa: /ˈmɪtˌmaxn̩/
  example:
    de: Wer will beim Spiel mitmachen?
    vi: Ai muốn tham gia trò chơi cùng không?
  usage_vi: 'Động từ tách: mit ở cuối câu.'
  lesson_refs:
  - a1.m06.l01
  tags:
  - verb
  - freizeit
  - trennbar
  source: nwn-lern
- id: a1.m06.v.mitfeiern
  de: mitfeiern
  pos: verb
  vi: cùng ăn mừng, chung vui tiệc
  forms:
    text: du feierst mit, er feiert mit
    er: feiert mit
    separable: true
  ipa: /ˈmɪtˌfaɪ̯ɐn/
  example:
    de: Wir wollen heute zusammen mitfeiern.
    vi: Hôm nay chúng tôi muốn cùng chung vui tiệc.
  usage_vi: 'Động từ tách: mit ở cuối câu.'
  lesson_refs:
