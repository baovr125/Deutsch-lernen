  ipa: /ˈbaːdəˌzeː/
  example:
    de: Im Sommer fahren wir an den Badesee.
    vi: Mùa hè chúng tôi ra hồ tắm ngoài trời.
  usage_vi: baden + der See.
  lesson_refs:
  - a1.m06.l01
