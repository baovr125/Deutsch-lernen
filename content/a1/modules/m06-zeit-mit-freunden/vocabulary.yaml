- id: a1.m06.v.dabeisein
  de: dabeisein
  pos: verb
  vi: có mặt, tham gia cùng
  forms:
    text: du bist dabei, er ist dabei
    er: ist dabei
  ipa: /daˈbaɪ̯ˌzaɪ̯n/
  example:
    de: Bist du am Samstag auch dabei?
    vi: Thứ Bảy bạn cũng có mặt tham gia chứ?
  usage_vi: dabei sein = có mặt tham gia.
