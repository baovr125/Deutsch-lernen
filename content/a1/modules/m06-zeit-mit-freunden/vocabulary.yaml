- id: a1.m06.v.bummeln
  de: bummeln
  pos: verb
  vi: đi dạo thong thả ngắm phố
  forms:
    text: du bummelst, er bummelt
    er: bummelt
  ipa: /ˈbʊml̩n/
  example:
    de: Wir bummeln gern durch die Altstadt.
    vi: Chúng tôi thích đi dạo ngắm khu phố cổ.
  usage_vi: 'Khẩu ngữ: đi dạo thong thả, ngắm cửa hàng, không vội. „einen Stadtbummel machen“ = đi dạo phố.'
  lesson_refs:
  - a1.m06.l01
  tags:
  - verb
  - freizeit
  source: nwn-lern
