  plural: Treffpunkte
  vi: điểm hẹn, nơi gặp nhau
  ipa: /ˈtʁɛfˌpʊŋkt/
  example:
    de: Der Treffpunkt ist am Hauptbahnhof.
    vi: Điểm hẹn là ở ga trung tâm.
