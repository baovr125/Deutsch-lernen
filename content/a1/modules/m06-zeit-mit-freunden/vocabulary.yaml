- id: a1.m06.v.freibad
  de: Freibad
  pos: noun
  article: das
  plural: Freibäder
  vi: bể bơi ngoài trời
  ipa: /ˈfʁaɪ̯ˌbaːt/
  example:
    de: Das Freibad öffnet ab Mai.
    vi: Bể bơi ngoài trời mở cửa từ tháng 5.
  usage_vi: frei + das Bad.
  lesson_refs:
  - a1.m06.l01
