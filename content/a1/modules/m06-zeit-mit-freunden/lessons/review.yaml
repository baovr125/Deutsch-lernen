summary_vi: 'Bài ôn tập giúp bạn củng cố toàn diện kiến thức Kapitel 6: các hoạt động vui chơi giải trí, số thứ tự và ngày tháng (Ordinalzahlen), giới từ für + Akkusativ, đại từ nhân xưng ở Akkusativ (mich, dich, ihn...), thì quá khứ của sein/haben (war, hatte), cùng văn hóa quán ăn và tiền boa ở D-A-CH.'
self_check:
- Tôi có thể nói chính xác ngày tháng và sinh nhật bằng tiếng Đức.
- Tôi nhớ sau giới từ für luôn dùng cách Akkusativ.
- Tôi phân biệt và sử dụng đúng war (đã ở/là) và hatte (đã có) trong quá khứ.
- Tôi tự tin gọi món và thanh toán tiền tại quán ăn/nhà hàng (getrennt zahlen, stimmt so).
blocks:
- id: a1.m06.review.b1
  kind: explanation
  title_vi: Giới thiệu bài học
  body_vi: '**Chúc mừng bạn đã hoàn thành trọn vẹn 6 bài học của Kapitel 6: Zeit mit Freunden!**

    Bài học tổng kết này được thiết kế để:

    - Hệ thống hóa toàn bộ các mẫu câu giao tiếp quan trọng nhất (Redemittel) về rủ bạn đi chơi, chúc mừng sinh nhật, giao tiếp tại nhà hàng và kể về kỳ nghỉ cuối tuần.

    - Tóm tắt cô đọng 5 trụ cột ngữ pháp của chương: Động từ tách (*trennbare Verben*), Số thứ tự và ngày tháng (*Ordinalzahlen*), Giới từ *für + Akkusativ*, Đại từ nhân xưng ở Akkusativ (*mich, dich, ihn, uns, euch*), và Thì quá khứ đơn của sein/haben (*war, hatte*).

    - Đánh giá năng lực toàn diện của bạn qua bài kiểm tra 4 kỹ năng theo chuẩn CEFR A1.'
- id: a1.m06.review.b2
  kind: explanation
  title_vi: Bảng tổng hợp ngữ pháp then chốt Kapitel 6
  skill: grammar
  body_vi: '**1. Động từ tách (trennbare Verben):**

    - Động từ chia ở vị trí 2, tiền tố đứng ở cuối câu: *Ich lade dich zur Party **ein**.*

    - Khi có Modalverb: động từ chính nguyên thể ở cuối câu: *Können wir heute **ausgehen**?*


    **2. Số thứ tự (Ordinalzahlen) & Ngày tháng:**

    - 1–19: thêm đuôi *-te* (sau am thêm *-ten*): *am ersten, am dritten, am siebten*.

    - Từ 20: thêm đuôi *-ste* (sau am thêm *-sten*): *am zwanzigsten*.


    **3. Giới từ für & Đại từ nhân xưng Akkusativ:**

    - *für* luôn đi với Akkusativ: *Das Geschenk ist für **meinen** Freund.*

    - Đại từ Akkusativ: *ich $\rightarrow$ mich, du $\rightarrow$ dich, er $\rightarrow$ ihn, wir $\rightarrow$ uns, ihr $\rightarrow$ euch*.


    **4. Quá khứ Präteritum (war & hatte):**

    - *ich/er/sie/es war* (đã là/ở) · *wir/sie waren*.

    - *ich/er/sie/es hatte* (đã có) · *wir/sie hatten*.

    '
  examples:
  - de: Gestern war ich auf einer Party und hatte viel Spaß.
    vi: Hôm qua tôi đã ở một bữa tiệc và đã rất vui.
  - de: Er ruft mich morgen früh an.
    vi: Anh ấy sẽ gọi điện cho tôi vào sáng mai.
- id: a1.m06.review.b3
  kind: pronunciation
  title_vi: 'Tổng hợp các nguyên âm đôi: ei [aɪ̯], eu [ɔɪ̯], au [aʊ̯]'
  skill: pronunciation
  body_vi: 'Tổng hợp các nguyên âm đôi: ei [aɪ̯], eu [ɔɪ̯], au [aʊ̯]


    Phân biệt rõ: ''ei'' [aɪ̯] (die Kneipe, frei); ''eu'' [ɔɪ̯] (heute, euch, Freund); ''au'' [aʊ̯] (ausgehen, das Haus, der Ausflug).


    Luyện tập: Luyện đọc chuỗi câu có cả 3 nguyên âm đôi: Heute gehe ich mit meinen Freunden aus.'
  items:
  - de: die Kneipe – die Freunde – der Ausflug
    vi: quán rượu – bạn bè – chuyến dã ngoại
    ipa: '[ˈknaɪ̯pə] – [ˈfʁɔɪ̯ndə] – [ˈaʊ̯sˌfluːk]'
  - de: feiern – euch – das Restaurant
    vi: ăn mừng – các bạn – nhà hàng
    ipa: '[ˈfaɪ̯ɐn] – [ɔɪ̯ç] – [ʁɛstoˈʁãː]'
