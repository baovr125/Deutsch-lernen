    vi: Thứ Bảy chúng tôi tổ chức một bữa tiệc bất ngờ cho Sofia.
  - de: Ich habe ein schönes Geschenk für dich mitgebracht.
    vi: Tôi đã mang theo một món quà rất đẹp dành cho bạn.
