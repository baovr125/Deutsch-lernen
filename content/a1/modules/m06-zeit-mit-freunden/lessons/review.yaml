- id: a1.m06.review.b5
  kind: listening
  title_vi: 'Kiểm tra nghe: Kế hoạch tổ chức sinh nhật và đặt bàn'
  lines:
  - speaker: David
    de: Hallo Anna! Sofia hat am zwanzigsten Mai Geburtstag. Wollen wir eine Party für sie machen?
    vi: Chào Anna! Sofia sinh nhật vào ngày 20 tháng 5. Tụi mình tổ chức tiệc cho bạn ấy nhé?
  - speaker: Anna
    de: Tolle Idee! Ich lade alle Freunde per Mail ein. Wo wollen wir feiern?
    vi: Ý tưởng tuyệt vời! Mình sẽ mời tất cả bạn bè qua email. Chúng mình muốn ăn mừng ở đâu?
  - speaker: David
    de: Im Gasthaus am Park. Sie haben einen wunderschönen Biergarten. Ich reserviere einen großen Tisch für uns.
    vi: Ở quán ăn bên công viên nhé. Họ có một quán bia sân vườn rất đẹp. Mình sẽ đặt trước một bàn lớn cho tụi mình.
  - speaker: Anna
    de: Super! Und ich besorge einen Blumenstrauß und ein Geschenk für sie.
    vi: Tuyệt vời! Và mình sẽ chuẩn bị một bó hoa cùng một món quà cho bạn ấy.
  audio_status: pending-tts
  situation_vi: David và Anna thảo luận về việc chuẩn bị tiệc sinh nhật cho Sofia và đặt bàn ở quán bia sân vườn.
  skill: listening
  audio:
    speed: slow
- id: a1.m06.review.b6
  kind: reading
  title_vi: 'Kiểm tra đọc: Nhật ký cuối tuần đáng nhớ của Sarah'
  paragraphs:
  - de: 'Ein unvergessliches Wochenende in Hamburg!

      Am letzten Samstag war der 20. Mai – der 25. Geburtstag meiner besten Freundin Sofia.

      Wir hatten eine große Überraschung für sie vorbereitet:

      Am Nachmittag machten wir bei sonnigem Wetter eine Fahrradtour an den See.

      Um 19 Uhr trafen wir uns im Gasthaus an der Alster.

      Ich hatte einen Blumenstrauß và ein schönes Buch für sie gekauft.

      Sofia war total überrascht und glücklich!

      Wir aßen leckeres Essen, tranken Bier und zahlten am Ende getrennt.

      Das Wetter war wunderbar und wir hatten alle einen fantastischen Abend!'
    vi: 'Một cuối tuần khó quên ở Hamburg!

      Thứ Bảy tuần trước là ngày 20 tháng 5 – sinh nhật lần thứ 25 của bạn thân nhất của tôi, Sofia.

      Chúng tôi đã chuẩn bị một bất ngờ lớn cho bạn ấy:

      Buổi chiều trong thời tiết nắng ấm, chúng tôi làm một chuyến đạp xe ra hồ.

      Lúc 19 giờ chúng tôi gặp nhau tại quán ăn bên hồ Alster.

      Tôi đã mua một bó hoa và một cuốn sách hay cho bạn ấy.

      Sofia hoàn toàn bất ngờ và hạnh phúc!

      Chúng tôi đã ăn đồ ăn ngon, uống bia và cuối cùng thanh toán tiền riêng.

      Thời tiết đã tuyệt vời và tất cả chúng tôi đã có một buổi tối thật kỳ diệu!'
  text_type_vi: Bài viết nhật ký cuối tuần
  skill: reading
  glossary:
  - de: unvergesslich
    vi: khó quên
  - de: an der Alster
    vi: bên bờ hồ Alster
- id: a1.m06.review.b7
  kind: speaking
  title_vi: 'Kiểm tra nói: Rủ bạn đi ăn mừng sinh nhật và gọi món'
  skill: speaking
  task_vi: Thực hành đối thoại rủ bạn tham gia bữa tiệc sinh nhật cuối tuần và đóng vai thanh toán tại nhà hàng.
  steps_vi:
  - 'Rủ tiệc: Kommst du am Samstag zu meiner Geburtstagsparty mit?'
  - 'Đồng ý: Ja, super gern! Ich bin dabei!'
  - 'Thanh toán: Die Rechnung bitte! Zusammen oder getrennt? – Getrennt, bitte. Stimmt so!'
  lines:
  - speaker: A
    de: Kommst du am Samstag mit ins Restaurant? Wir feiern Sofias Geburtstag.
    vi: Thứ Bảy bạn cùng đến nhà hàng nhé? Tụi mình ăn mừng sinh nhật Sofia.
  - speaker: B
    de: Ja, natürlich, ich komme sehr gern mit! Was schenken wir ihr?
    vi: Có chứ, tất nhiên rồi, mình rất vui lòng đi cùng! Tụi mình tặng gì cho bạn ấy?
  - speaker: A
    de: Wir haben schon ein Geschenk für sie. Bis Samstag!
    vi: Tụi mình đã có quà cho bạn ấy rồi. Hẹn thứ Bảy nhé!
- id: a1.m06.review.b8
  kind: writing
  title_vi: 'Kiểm tra viết: Kể về một buổi tối đi chơi cùng bạn bè'
  skill: writing
  task_vi: Viết đoạn văn ngắn 5–6 câu kể về một buổi tối đi chơi cùng bạn bè (ở quán ăn, tiệc sinh nhật hoặc quán bia), sử dụng war, hatte và các cấu trúc đã học.
  model:
    de: Gestern war ich mit meinen Freunden im Biergarten. Das Wetter war sehr schön und warm. Wir hatten viel Spaß zusammen. Ich habe eine Bratwurst gegessen und ein Bier getrunken. Am Ende haben wir getrennt bezahlt. Der Abend war wirklich wunderbar!
    vi: Hôm qua tôi đã ở quán bia sân vườn cùng bạn bè của mình. Thời tiết đã rất đẹp và ấm áp. Chúng tôi đã có nhiều niềm vui bên nhau. Tôi đã ăn xúc xích nướng và uống một ly bia. Cuối cùng chúng tôi đã thanh toán tiền riêng. Buổi tối đã thực sự rất tuyệt vời!
  checklist_vi:
  - Sử dụng đúng thì quá khứ war và hatte.
  - Có chi tiết về địa điểm (im Biergarten / im Lokal).
  - Có chi tiết thanh toán (getrennt bezahlt).
