summary_vi: Bài học giúp bạn nắm vững từ vựng về các hoạt động giải trí (der Ausflug, die Fahrradtour, der Badesee, bummeln), cách sử dụng các động từ tách (ausgehen, vorbeikommen, mitmachen, losgehen) và mẫu câu rủ bạn bè đi chơi, thống nhất điểm hẹn.
