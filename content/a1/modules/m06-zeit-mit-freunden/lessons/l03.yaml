summary_vi: Bài học giúp bạn thành thạo từ vựng về quà tặng và thiệp mời, nắm chắc quy tắc giới từ für luôn đi với Akkusativ, cùng bảng đại từ nhân xưng ở Akkusativ (mich, dich, ihn, uns, euch).
self_check:
- Tôi có thể kể tên 3 món quà sinh nhật quen thuộc trong tiếng Đức.
- Tôi nhớ sau giới từ für luôn dùng cách Akkusativ (für meinen Freund, für dich).
- 'Tôi sử dụng đúng các đại từ nhân xưng: mich, dich, ihn, uns, euch.'
blocks:
- id: a1.m06.l03.b1
  kind: explanation
  title_vi: Giới thiệu bài học
  body_vi: 'Đi dự tiệc sinh nhật bạn bè không thể thiếu những món quà xinh xắn và lời mời trang trọng.

    Trong bài học này, bạn sẽ:

    - Khám phá từ vựng về quà tặng: món quà (*das Geschenk*), tặng quà (*schenken*), bó hoa (*der Blumenstrauß*), kẹo sô-cô-la (*die Praline*), phiếu quà tặng (*der Gutschein*), thiệp mời (*die Einladungskarte*), mang theo (*mitnehmen*).

    - Làm chủ giới từ *für* (dành cho ai): giới từ này **luôn luôn đi kèm cách Akkusativ** (*für meinen Bruder, für dich*).

    - Học bảng đại từ nhân xưng ở cách Akkusativ: *mich* (tôi), *dich* (bạn), *ihn* (anh ấy / nó), *uns* (chúng tôi), *euch* (các bạn).

    - Đọc và soạn thảo email mời dự tiệc sinh nhật một cách tự tin.'
- id: a1.m06.l03.b2
  kind: explanation
  title_vi: 'Đại từ nhân xưng thay thế danh từ: er → ihn, es → es, sie → sie'
  skill: grammar
  body_vi: 'Khi một danh từ làm tân ngữ trực tiếp hoặc đứng sau für, ta có thể dùng đại từ nhân xưng tương ứng theo giống của danh từ đó:

    - der Blumenstrauß (giống đực) → Ich kaufe **ihn** (er → ihn).

    - das Buch (giống trung) → Das ist für **es** (es → es).

    - die Schokolade (giống cái) → Ich schenke **sie** (sie → sie).'
  examples:
  - de: Wo ist der Kuchen? – Ich bringe ihn gleich mit.
    vi: Bánh ngọt đâu rồi? – Mình mang nó lại ngay đây.
  - de: Kennst du Sofia? – Ja, ich kenne sie gut.
    vi: Bạn có biết Sofia không? – Có, tôi biết rõ bạn ấy.
- id: a1.m06.l03.b3
  kind: pronunciation
  title_vi: Phát âm âm 'ch' mềm [ç] trong đại từ mich, dich, euch
  skill: pronunciation
  body_vi: 'Phát âm âm ''ch'' mềm [ç] trong đại từ mich, dich, euch


    Sau các nguyên âm trước (i, e, eu, ä, ö, ü), âm ''ch'' được phát âm là âm mềm xát vòm miệng [ç] (giống tiếng xù lông nhẹ của mèo), không phát âm thành [k] hay [tʃ].


    Luyện tập: Luyện phát âm rõ âm mềm [ç]: mich – dich – euch – sich.'
  items:
  - de: mich
    vi: tôi (Akk)
    ipa: '[mɪç]'
  - de: dich
    vi: bạn (Akk)
    ipa: '[dɪç]'
  - de: euch
    vi: các bạn (Akk)
    ipa: '[ɔɪ̯ç]'
- id: a1.m06.l03.b4
  kind: examples
  title_vi: Câu ví dụ
  examples:
  - de: Das schöne Geschenk ist für dich.
    vi: Món quà tuyệt đẹp này là dành cho bạn.
  - de: Florian kauft einen Blumenstrauß für seine Freundin.
    vi: Florian mua một bó hoa tặng bạn gái của anh ấy.
  - de: Rufst du mich morgen früh an?
    vi: Sáng mai bạn gọi điện cho mình nhé?
  - de: Lukas lädt uns alle zu seinem Geburtstag ein.
    vi: Lukas mời tất cả chúng tôi đến dự sinh nhật của anh ấy.
- id: a1.m06.l03.b5
  kind: listening
  title_vi: 'Hội thoại: Chọn quà sinh nhật cho bạn'
  lines:
  - speaker: Laura
    de: Tim, hast du schon ein Geschenk für Markus?
    vi: Tim, bạn đã có quà tặng Markus chưa?
  - speaker: Tim
    de: Nein, noch nicht. Was können wir für ihn kaufen?
    vi: Chưa, vẫn chưa. Chúng mình có thể mua gì cho anh ấy nhỉ?
  - speaker: Laura
    de: Markus liest sehr gern Bücher. Wollen wir ihm einen Gutschein für die Buchhandlung schenken?
    vi: Markus rất thích đọc sách. Chúng mình tặng anh ấy một phiếu quà tặng ở hiệu sách nhé?
  - speaker: Tim
    de: Das ist eine fantastische Idee! Und ich kaufe noch eine Schachtel Pralinen für ihn.
    vi: Đó là một ý kiến tuyệt vời! Và mình sẽ mua thêm một hộp kẹo sô-cô-la cho anh ấy nữa.
  audio_status: pending-tts
  situation_vi: Laura và Tim bàn bạc xem nên mua món quà gì tặng sinh nhật cho Markus.
  skill: listening
  audio:
    speed: slow
- id: a1.m06.l03.b6
  kind: reading
  title_vi: 'Đọc hiểu: Email mời dự tiệc sinh nhật của Sofia'
  paragraphs:
  - de: 'Liebe Freunde,

      am 20. Mai habe ich Geburtstag und werde 25 Jahre alt!

      Diesen besonderen Tag möchte ich unbedingt mit euch feiern.

      Deshalb lade ich euch ganz herzlich zu meiner Geburtstagsparty ein!

      Wann: Samstag, 20. Mai, ab 18:30 Uhr.

      Wo: Bei mir zu Hause (Goethestraße 12, München).

      Für Getränke und Musik ist gesorgt. Bringt bitte gute Laune mit!

      Gebt mir bitte bis zum 15. Mai Bescheid, ob ihr kommen könnt.

      Ich freue mich riesig auf euch!

      Eure Sofia'
    vi: 'Các bạn thân mến,

      Vào ngày 20 tháng 5 là sinh nhật của mình và mình tròn 25 tuổi!

      Ngày đặc biệt này mình nhất định muốn cùng ăn mừng với các bạn.

      Vì thế mình thân mời tất cả các bạn đến dự tiệc sinh nhật của mình!

      Thời gian: Thứ Bảy, ngày 20 tháng 5, từ 18:30.

      Địa điểm: Tại nhà mình (Goethestraße 12, München).

      Đồ uống và âm nhạc đã được chuẩn bị sẵn sàng. Các bạn chỉ cần mang theo tâm trạng vui vẻ nhé!

      Xin vui lòng báo cho mình biết trước ngày 15 tháng 5 xem các bạn có đến được không.

      Mình rất mong chờ được gặp các bạn!

      Sofia của các bạn'
  text_type_vi: Thư điện tử mời tiệc sinh nhật
  skill: reading
  glossary:
  - de: unbedingt
    vi: nhất định
  - de: für ... ist gesorgt
    vi: đã được chuẩn bị chu đáo
  - de: die Laune
    vi: tâm trạng
- id: a1.m06.l03.b7
  kind: speaking
  title_vi: 'Đóng vai: Hỏi và gợi ý quà tặng sinh nhật'
  skill: speaking
  task_vi: Thực hành cùng bạn học thảo luận chọn quà tặng cho một người bạn chung.
  steps_vi:
  - 'Hỏi quà: Was schenken wir ... zum Geburtstag?'
  - 'Gợi ý quà: Wir können einen Gutschein / Pralinen / Blumen schenken.'
  - 'Đồng ý: Das ist ein tolles Geschenk für ihn / für sie!'
  lines:
  - speaker: A
    de: Was schenken wir Florian?
    vi: Chúng mình tặng gì cho Florian đây?
  - speaker: B
    de: Er mag Sport. Wir können einen Gutschein für das Sportgeschäft kaufen.
    vi: Anh ấy thích thể thao. Tụi mình có thể mua một phiếu quà tặng ở cửa hàng thể thao.
  - speaker: A
    de: Super, das ist ein perfektes Geschenk für ihn!
    vi: Tuyệt vời, đó là món quà hoàn hảo cho anh ấy!
- id: a1.m06.l03.b8
  kind: writing
  title_vi: Viết email trả lời thư mời sinh nhật
  skill: writing
  task_vi: Viết email ngắn (4–5 câu) cảm ơn lời mời của Sofia và xác nhận bạn sẽ đến tham dự bữa tiệc.
  model:
    de: Liebe Sofia, vielen Dank für die Einladung zu deiner Party! Ich komme am 20. Mai sehr gerne zu dir. Ich bringe einen leckeren Salat für das Fest mit. Kann ich dir noch bei etwas helfen? Bis bald und liebe Grüße, Maria
    vi: Sofia thân mến, cảm ơn bạn rất nhiều vì lời mời đến dự tiệc! Mình rất vui lòng đến chỗ bạn vào ngày 20 tháng 5. Mình sẽ mang theo một món salad ngon cho bữa tiệc. Mình có thể giúp bạn thêm việc gì nữa không? Hẹn sớm gặp lại và thân ái, Maria
  checklist_vi:
  - 'Có câu cảm ơn lời mời: Vielen Dank für die Einladung!'
  - 'Có câu xác nhận sẽ đến: Ich komme sehr gerne.'
  - Có sử dụng giới từ für.
