blocks:
  - id: a1.m08.l03.b1
    kind: explanation
    skill: vocabulary
    title_vi: "Bắt đầu: cơ thể và cơn đau"
    body_vi: |
      Để nói chỗ nào đau, dùng **„Mein/Meine … tut weh.“**: *Mein Kopf tut weh. Meine Hand tut weh.* Nếu đau nhiều chỗ (số nhiều) dùng **tun**: *Meine Füße tun weh.*
      **Mẹo đoán nghĩa (Strategie):** nhiều từ ghép chứa bộ phận cơ thể, ví dụ *Kopf* + *Schmerzen* = *Kopfschmerzen* (đau đầu), *Hals* + *Schmerzen* = *Halsschmerzen* (đau họng).
  - id: a1.m08.l03.b2
    kind: dialogue
    skill: speaking
    title_vi: "Hội thoại: Sau cú ngã xe đạp"
    lines:
      - { speaker: "Tina", de: "Aua! Das tut weh!", vi: "Ối! Đau quá!" }
      - { speaker: "Paul", de: "Was ist los? Hast du einen Unfall?", vi: "Chuyện gì thế? Bạn bị tai nạn à?" }
      - { speaker: "Tina", de: "Ja, mit dem Fahrrad. Mein Arm und mein Bein tun weh.", vi: "Ừ, đi xe đạp. Tay và chân mình đau." }
      - { speaker: "Paul", de: "Kannst du aufstehen? Wir fahren zum Krankenhaus.", vi: "Bạn đứng dậy được không? Chúng ta đi đến bệnh viện." }
      - { speaker: "Tina", de: "Ja, aber bitte langsam. Der Rücken tut auch ein bisschen weh.", vi: "Được, nhưng làm ơn chậm thôi. Lưng mình cũng hơi đau." }
  - id: a1.m08.l03.b3
    kind: listening
    skill: listening
    title_vi: "Nghe: Báo tin tai nạn"
    audio_status: pending-tts
    lines:
      - { speaker: "Frau Schmidt", de: "Hier ist Frau Schmidt. Mein Mann hat einen Unfall.", vi: "Đây là bà Schmidt. Chồng tôi bị tai nạn." }
      - { speaker: "Frau Schmidt", de: "Sein Fuß tut sehr weh und sein Kopf auch.", vi: "Chân anh ấy rất đau và đầu cũng đau." }
      - { speaker: "Frau Schmidt", de: "Bitte kommen Sie schnell zum Park in der Bahnhofstraße.", vi: "Xin hãy đến nhanh đến công viên ở phố Bahnhofstraße." }
  - id: a1.m08.l03.b4
    kind: culture
    skill: speaking
    title_vi: "Văn hóa: số khẩn cấp 112"
    body_vi: |
      Trong Liên minh châu Âu, bao gồm Đức và Áo, số khẩn cấp chung là **112** (cứu hỏa và cấp cứu). Khi gọi, hãy nói rõ: *Wo? Was ist los? Wie viele Personen?* (Ở đâu? Có chuyện gì? Mấy người?).
