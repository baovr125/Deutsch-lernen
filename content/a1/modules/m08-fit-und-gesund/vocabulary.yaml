entries:
  # ---- Bài 1: Sport und Fitness ----
  - { id: a1.m08.v.sport, de: "Sport", pos: noun, article: der, no_plural: true, vi: "thể thao", ipa: "/ʃpɔʁt/", example: { de: "Ich mache jeden Tag Sport.", vi: "Ngày nào tôi cũng tập thể thao." }, usage_vi: "Không đếm được. „Sport machen“ = tập thể thao, chơi thể thao. sp- đầu từ đọc /ʃp/.", lesson_refs: [a1.m08.l01] }
  - { id: a1.m08.v.training, de: "Training", pos: noun, article: das, plural: "Trainings", vi: "buổi tập, việc tập luyện", ipa: "/ˈtʁeːnɪŋ/", example: { de: "Das Training beginnt um sieben Uhr.", vi: "Buổi tập bắt đầu lúc bảy giờ." }, usage_vi: "Số nhiều ít dùng; nói „ein Training“ cho một buổi tập.", lesson_refs: [a1.m08.l01] }
  - { id: a1.m08.v.fitnessstudio, de: "Fitnessstudio", pos: noun, article: das, plural: "Fitnessstudios", vi: "phòng tập thể hình", ipa: "/ˈfɪtnɛsˌʃtuːdi̯o/", example: { de: "Im Fitnessstudio gibt es viele Geräte.", vi: "Trong phòng tập có nhiều thiết bị." }, usage_vi: "Viết với ba chữ s: Fitness + Studio. „im Fitnessstudio“ = ở phòng tập.", lesson_refs: [a1.m08.l01] }
  - { id: a1.m08.v.trainer, de: "Trainer", pos: noun, article: der, plural: "Trainer", vi: "huấn luyện viên (nam)", ipa: "/ˈtʁeːnɐ/", example: { de: "Der Trainer zeigt die Übung.", vi: "Huấn luyện viên chỉ bài tập." }, usage_vi: "Nữ: die Trainerin. Số nhiều của dạng nam không đổi.", lesson_refs: [a1.m08.l01] }
  - { id: a1.m08.v.gesundheit, de: "Gesundheit", pos: noun, article: die, no_plural: true, vi: "sức khỏe", ipa: "/ɡəˈzʊnthaɪt/", example: { de: "Sport ist gut für die Gesundheit.", vi: "Thể thao tốt cho sức khỏe." }, usage_vi: "Đuôi -heit luôn là „die“. Khi ai đó hắt hơi, người Đức nói „Gesundheit!“.", lesson_refs: [a1.m08.l01] }
  - { id: a1.m08.v.trainieren, de: "trainieren", pos: verb, forms: { er: "trainiert" }, vi: "tập luyện", ipa: "/tʁeˈniːʁən/", example: { de: "Wir trainieren dreimal pro Woche.", vi: "Chúng tôi tập ba lần mỗi tuần." }, usage_vi: "Đuôi -ieren: chia như động từ thường ở thì hiện tại.", lesson_refs: [a1.m08.l01] }
  - { id: a1.m08.v.joggen, de: "joggen", pos: verb, forms: { er: "joggt" }, vi: "chạy bộ", ipa: "/ˈdʒɔɡn̩/", example: { de: "Am Morgen joggt sie im Park.", vi: "Buổi sáng cô ấy chạy bộ trong công viên." }, usage_vi: "Từ mượn tiếng Anh, „j“ đọc /dʒ/. Cũng nói „laufen“.", lesson_refs: [a1.m08.l01] }
  - { id: a1.m08.v.schwimmen, de: "schwimmen", pos: verb, forms: { er: "schwimmt" }, vi: "bơi", ipa: "/ˈʃvɪmən/", example: { de: "Am Samstag schwimmen wir im Hallenbad.", vi: "Thứ Bảy chúng tôi bơi ở bể bơi trong nhà." }, usage_vi: "„schw“ đọc /ʃv/. „schwimmen gehen“ = đi bơi.", lesson_refs: [a1.m08.l01] }
  - { id: a1.m08.v.fit, de: "fit", pos: adjective, vi: "khỏe mạnh, sung sức", ipa: "/fɪt/", example: { de: "Ich bin nach dem Training fit.", vi: "Sau buổi tập tôi thấy sung sức." }, usage_vi: "Hay dùng „fit bleiben“ = giữ vóc dáng khỏe. Không biến cách sau „sein“.", lesson_refs: [a1.m08.l01] }
  - { id: a1.m08.v.gesund, de: "gesund", pos: adjective, vi: "khỏe mạnh; tốt cho sức khỏe", ipa: "/ɡəˈzʊnt/", example: { de: "Obst und Gemüse sind gesund.", vi: "Trái cây và rau củ tốt cho sức khỏe." }, usage_vi: "Trái nghĩa: krank. Có thể nói về người hoặc đồ ăn.", lesson_refs: [a1.m08.l01] }
  # ---- Bài 2: Im Fitness-Studio ----
  - { id: a1.m08.v.muessen, de: "müssen", pos: verb, forms: { er: "muss" }, vi: "phải (bắt buộc)", ipa: "/ˈmʏsn̩/", example: { de: "Hier muss man die Handtücher mitbringen.", vi: "Ở đây phải tự mang khăn tắm." }, usage_vi: "Bất quy tắc: ich muss, du musst, er muss. Động từ chính ở cuối câu, dạng nguyên mẫu.", lesson_refs: [a1.m08.l02] }
  - { id: a1.m08.v.duerfen, de: "dürfen", pos: verb, forms: { er: "darf" }, vi: "được phép", ipa: "/ˈdʏʁfn̩/", example: { de: "Hier darf man nicht essen.", vi: "Ở đây không được ăn." }, usage_vi: "Bất quy tắc: ich darf, du darfst, er darf. „nicht dürfen“ = bị cấm.", lesson_refs: [a1.m08.l02] }
  - { id: a1.m08.v.bleiben, de: "bleiben", pos: verb, forms: { er: "bleibt" }, vi: "ở lại, giữ nguyên", ipa: "/ˈblaɪbn̩/", example: { de: "Bleibt bitte ruhig!", vi: "Xin hãy giữ bình tĩnh!" }, usage_vi: "„zu Hause bleiben“ = ở nhà. Dạng mệnh lệnh: Bleib! / Bleibt! / Bleiben Sie!", lesson_refs: [a1.m08.l02] }
  - { id: a1.m08.v.ausruhen, de: "ausruhen", pos: verb, forms: { er: "ruht aus", separable: true }, vi: "nghỉ ngơi (sau khi mệt)", ipa: "/ˈaʊsˌʁuːən/", example: { de: "Nach dem Training ruhe ich mich aus.", vi: "Sau buổi tập tôi nghỉ ngơi." }, usage_vi: "Động từ phản thân (sich ausruhen), tiền tố „aus“ tách ra cuối câu. Chỉ cần nhớ cụm „Ruh dich aus!“.", lesson_refs: [a1.m08.l02] }
  - { id: a1.m08.v.groesse, de: "Größe", pos: noun, article: die, plural: "Größen", vi: "kích cỡ; chiều cao", ipa: "/ˈɡʁøːsə/", example: { de: "Welche Größe hast du? – Größe M.", vi: "Bạn mặc cỡ nào? – Cỡ M." }, usage_vi: "Dùng cho cỡ quần áo, giày dép và chiều cao cơ thể.", lesson_refs: [a1.m08.l02] }
  # ---- Bài 3: Unfall, Körper ----
  - { id: a1.m08.v.unfall, de: "Unfall", pos: noun, article: der, plural: "Unfälle", vi: "tai nạn", ipa: "/ˈʊnfal/", example: { de: "Hier gibt es einen Unfall.", vi: "Ở đây có một vụ tai nạn." }, usage_vi: "Số nhiều có Umlaut: Unfälle. „einen Unfall haben“ = bị tai nạn.", lesson_refs: [a1.m08.l03] }
  - { id: a1.m08.v.krankenhaus, de: "Krankenhaus", pos: noun, article: das, plural: "Krankenhäuser", vi: "bệnh viện", ipa: "/ˈkʁaŋkn̩haʊs/", example: { de: "Der Mann ist im Krankenhaus.", vi: "Người đàn ông đang ở bệnh viện." }, usage_vi: "„im Krankenhaus“ = ở bệnh viện; „ins Krankenhaus“ = vào bệnh viện.", lesson_refs: [a1.m08.l03] }
  - { id: a1.m08.v.koerper, de: "Körper", pos: noun, article: der, plural: "Körper", vi: "cơ thể", ipa: "/ˈkœʁpɐ/", example: { de: "Der Körper braucht Wasser.", vi: "Cơ thể cần nước." }, usage_vi: "„ö“ đọc /œ/ (môi tròn như „o“, lưỡi như „e“).", lesson_refs: [a1.m08.l03] }
  - { id: a1.m08.v.kopf, de: "Kopf", pos: noun, article: der, plural: "Köpfe", vi: "cái đầu", ipa: "/kɔpf/", example: { de: "Mein Kopf tut weh.", vi: "Đầu tôi đau." }, usage_vi: "Số nhiều có Umlaut: Köpfe.", lesson_refs: [a1.m08.l03] }
  - { id: a1.m08.v.arm, de: "Arm", pos: noun, article: der, plural: "Arme", vi: "cánh tay", ipa: "/aʁm/", example: { de: "Der Mensch hat zwei Arme und zwei Beine.", vi: "Con người có hai tay và hai chân." }, usage_vi: "Số nhiều thêm -e: Arme. Cũng dùng trong „Armschmerzen“ (đau tay).", lesson_refs: [a1.m08.l03] }
  - { id: a1.m08.v.bein, de: "Bein", pos: noun, article: das, plural: "Beine", vi: "cái chân (cả chân)", ipa: "/baɪn/", example: { de: "Das Bein ist sehr müde.", vi: "Cái chân rất mỏi." }, usage_vi: "Chân nói chung là „Bein“; bàn chân là „Fuß“.", lesson_refs: [a1.m08.l03] }
  - { id: a1.m08.v.fuss, de: "Fuß", pos: noun, article: der, plural: "Füße", vi: "bàn chân", ipa: "/fuːs/", example: { de: "Mein linker Fuß tut weh.", vi: "Bàn chân trái của tôi đau." }, usage_vi: "Số nhiều: Füße. „zu Fuß“ = đi bộ.", lesson_refs: [a1.m08.l03] }
  - { id: a1.m08.v.hand, de: "Hand", pos: noun, article: die, plural: "Hände", vi: "bàn tay", ipa: "/hant/", example: { de: "Meine Hände sind kalt.", vi: "Tay tôi lạnh." }, usage_vi: "Số nhiều có Umlaut: Hände. „die Hand geben“ = bắt tay.", lesson_refs: [a1.m08.l03] }
  - { id: a1.m08.v.ruecken, de: "Rücken", pos: noun, article: der, plural: "Rücken", vi: "lưng", ipa: "/ˈʁʏkn̩/", example: { de: "Mein Rücken tut nach der Arbeit weh.", vi: "Sau giờ làm lưng tôi đau." }, usage_vi: "Số nhiều không đổi. „Rückenschmerzen“ = đau lưng.", lesson_refs: [a1.m08.l03] }
  - { id: a1.m08.v.bauch, de: "Bauch", pos: noun, article: der, plural: "Bäuche", vi: "bụng", ipa: "/baʊx/", example: { de: "Ich habe Schmerzen im Bauch.", vi: "Tôi bị đau bụng." }, usage_vi: "„ch“ sau a/o/u/au đọc /x/. Số nhiều: Bäuche.", lesson_refs: [a1.m08.l03] }
  - { id: a1.m08.v.hals, de: "Hals", pos: noun, article: der, plural: "Hälse", vi: "cổ, họng", ipa: "/hals/", example: { de: "Der Hals ist heute rot.", vi: "Hôm nay họng bị đỏ." }, usage_vi: "Vừa là cổ vừa là họng. „Halsschmerzen“ = đau họng.", lesson_refs: [a1.m08.l03] }
  - { id: a1.m08.v.auge, de: "Auge", pos: noun, article: das, plural: "Augen", vi: "con mắt", ipa: "/ˈaʊɡə/", example: { de: "Mein rechtes Auge tut weh.", vi: "Mắt phải của tôi đau." }, usage_vi: "Hay dùng ở số nhiều: die Augen.", lesson_refs: [a1.m08.l03] }
  - { id: a1.m08.v.schmerz, de: "Schmerz", pos: noun, article: der, plural: "Schmerzen", vi: "cơn đau", ipa: "/ʃmɛʁʦ/", example: { de: "Ich habe Schmerzen im Rücken.", vi: "Tôi bị đau lưng." }, usage_vi: "Thường dùng ở số nhiều: „Schmerzen haben“ = bị đau. „sch“ đọc /ʃ/.", lesson_refs: [a1.m08.l03] }
  - { id: a1.m08.v.wehtun, de: "wehtun", pos: verb, forms: { er: "tut weh", separable: true }, vi: "đau, làm đau", ipa: "/ˈveːˌtuːn/", example: { de: "Der Fuß tut sehr weh.", vi: "Bàn chân rất đau." }, usage_vi: "Động từ tách: „weh“ ở cuối câu. Dùng với bộ phận cơ thể làm chủ ngữ: „Der Kopf tut weh.“", lesson_refs: [a1.m08.l03] }
  - { id: a1.m08.v.das-tut-weh, de: "Das tut weh!", pos: phrase, vi: "Đau quá!", ipa: "/das tuːt veː/", example: { de: "Aua, das tut weh!", vi: "Ối, đau quá!" }, usage_vi: "Câu thốt ra khi đau. „Aua“ là tiếng kêu đau.", lesson_refs: [a1.m08.l03] }
  # ---- Bài 4: Beim Arzt ----
  - { id: a1.m08.v.arzt, de: "Arzt", pos: noun, article: der, plural: "Ärzte", vi: "bác sĩ (nam)", ipa: "/aʁʦt/", example: { de: "Der Arzt untersucht den Patienten.", vi: "Bác sĩ khám cho bệnh nhân." }, usage_vi: "Nữ: die Ärztin. Số nhiều có Umlaut: Ärzte. „zum Arzt gehen“ = đi khám bác sĩ.", lesson_refs: [a1.m08.l04] }
  - { id: a1.m08.v.aerztin, de: "Ärztin", pos: noun, article: die, plural: "Ärztinnen", vi: "bác sĩ (nữ)", ipa: "/ˈɛʁʦtɪn/", example: { de: "Die Ärztin hat heute viele Patienten.", vi: "Hôm nay bác sĩ nữ có nhiều bệnh nhân." }, usage_vi: "Thêm -in và Umlaut trong dạng cái.", lesson_refs: [a1.m08.l04] }
  - { id: a1.m08.v.patient, de: "Patient", pos: noun, article: der, plural: "Patienten", vi: "bệnh nhân (nam)", ipa: "/paˈʦi̯ɛnt/", example: { de: "Der Patient wartet im Wartezimmer.", vi: "Bệnh nhân đợi ở phòng chờ." }, usage_vi: "Nữ: die Patientin. Danh từ yếu: den Patienten.", lesson_refs: [a1.m08.l04] }
  - { id: a1.m08.v.praxis, de: "Praxis", pos: noun, article: die, plural: "Praxen", vi: "phòng khám", ipa: "/ˈpʁaksɪs/", example: { de: "Die Praxis öffnet um acht Uhr.", vi: "Phòng khám mở cửa lúc tám giờ." }, usage_vi: "Phòng khám tư của bác sĩ. Số nhiều đặc biệt: Praxen.", lesson_refs: [a1.m08.l04] }
  - { id: a1.m08.v.medikament, de: "Medikament", pos: noun, article: das, plural: "Medikamente", vi: "thuốc", ipa: "/medikaˈmɛnt/", example: { de: "Das Medikament gibt es in der Apotheke.", vi: "Loại thuốc này có ở hiệu thuốc." }, usage_vi: "Chữ chung cho các loại thuốc; viên thuốc cụ thể là „die Tablette“.", lesson_refs: [a1.m08.l04] }
  - { id: a1.m08.v.tablette, de: "Tablette", pos: noun, article: die, plural: "Tabletten", vi: "viên thuốc", ipa: "/taˈblɛtə/", example: { de: "Nehmen Sie dreimal täglich eine Tablette.", vi: "Hãy uống mỗi ngày ba lần, mỗi lần một viên." }, usage_vi: "Đi với „nehmen“: eine Tablette nehmen = uống một viên.", lesson_refs: [a1.m08.l04] }
  - { id: a1.m08.v.rezept, de: "Rezept", pos: noun, article: das, plural: "Rezepte", vi: "đơn thuốc; công thức nấu ăn", ipa: "/ʁeˈʦɛpt/", example: { de: "Die Ärztin schreibt ein Rezept.", vi: "Bác sĩ viết một đơn thuốc." }, usage_vi: "Hai nghĩa: đơn thuốc và công thức nấu ăn; ngữ cảnh quyết định.", lesson_refs: [a1.m08.l04] }
  - { id: a1.m08.v.erkaeltung, de: "Erkältung", pos: noun, article: die, plural: "Erkältungen", vi: "cảm lạnh", ipa: "/ɛɐ̯ˈkɛltʊŋ/", example: { de: "Ich habe eine Erkältung.", vi: "Tôi bị cảm lạnh." }, usage_vi: "Đuôi -ung luôn là „die“. „eine Erkältung haben“ = bị cảm.", lesson_refs: [a1.m08.l04] }
  - { id: a1.m08.v.fieber, de: "Fieber", pos: noun, article: das, no_plural: true, vi: "sốt", ipa: "/ˈfiːbɐ/", example: { de: "Das Kind hat Fieber.", vi: "Đứa trẻ bị sốt." }, usage_vi: "„Fieber haben“ không dùng mạo từ. „f“ đọc /f/, „ie“ đọc /iː/.", lesson_refs: [a1.m08.l04] }
  - { id: a1.m08.v.husten, de: "Husten", pos: noun, article: der, no_plural: true, vi: "ho (chứng ho)", ipa: "/ˈhuːstn̩/", example: { de: "Ich habe seit zwei Tagen Husten.", vi: "Tôi bị ho đã hai ngày." }, usage_vi: "Cũng là động từ „husten“. „Husten haben“ không có mạo từ.", lesson_refs: [a1.m08.l04] }
  - { id: a1.m08.v.tee, de: "Tee", pos: noun, article: der, no_plural: true, vi: "trà", ipa: "/teː/", example: { de: "Bei einer Erkältung hilft warmer Tee.", vi: "Khi bị cảm, trà ấm có ích." }, usage_vi: "Trà thảo mộc là một trong các Hausmittel (cách chữa dân gian) phổ biến.", lesson_refs: [a1.m08.l04] }
  - { id: a1.m08.v.krank, de: "krank", pos: adjective, vi: "ốm, bệnh", ipa: "/kʁaŋk/", example: { de: "Meine Kollegin ist heute krank.", vi: "Hôm nay đồng nghiệp nữ của tôi bị ốm." }, usage_vi: "Trái nghĩa: gesund. „krank sein“ = đang bị ốm.", lesson_refs: [a1.m08.l04] }
  - { id: a1.m08.v.sollen, de: "sollen", pos: verb, forms: { er: "soll" }, vi: "nên, được yêu cầu (bởi người khác)", ipa: "/ˈzɔlən/", example: { de: "Der Arzt sagt, ich soll viel Wasser trinken.", vi: "Bác sĩ bảo tôi nên uống nhiều nước." }, usage_vi: "Diễn đạt lời khuyên hoặc chỉ dẫn từ người khác. ich soll, du sollst, er soll.", lesson_refs: [a1.m08.l04] }
  - { id: a1.m08.v.nehmen, de: "nehmen", pos: verb, forms: { er: "nimmt" }, vi: "lấy; uống (thuốc)", ipa: "/ˈneːmən/", example: { de: "Sie nimmt zweimal am Tag eine Tablette.", vi: "Cô ấy uống một viên mỗi ngày hai lần." }, usage_vi: "Bất quy tắc: du nimmst, er nimmt. Mệnh lệnh: Nimm!", lesson_refs: [a1.m08.l04] }
  - { id: a1.m08.v.gute-besserung, de: "Gute Besserung!", pos: phrase, vi: "Chúc mau khỏe!", ipa: "/ˈɡuːtə ˈbɛsəʁʊŋ/", example: { de: "Gute Besserung und bis bald!", vi: "Chúc mau khỏe và hẹn sớm gặp lại!" }, usage_vi: "Nói với người đang ốm hoặc bị thương.", lesson_refs: [a1.m08.l04] }
