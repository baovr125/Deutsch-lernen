- id: a1.m01.l05.ex.01
  type: matching
  skill: vocabulary
  difficulty: 1
  objective_refs:
  - a1.m01.l05.obj1
  instructions_vi: Nối nước với ngôn ngữ chính.
  items:
  - id: a1.m01.l05.ex.01.q1
    pairs:
    - left: Frankreich
      right: Französisch
    - left: Spanien
      right: Spanisch
    - left: Japan
      right: Japanisch
    - left: Österreich
      right: Deutsch
    - left: China
      right: Chinesisch
    - left: Italien
      right: Italienisch
    explanation_vi: Áo nói tiếng Đức. Frankreich → Französisch (ngoại lệ, không phải “Frankreichisch”).
- id: a1.m01.l05.ex.02
  type: multiple-choice
  skill: grammar
  difficulty: 2
  objective_refs:
  - a1.m01.l05.obj2
  instructions_vi: Chọn dạng đúng.
  items:
  - id: a1.m01.l05.ex.02.q1
    prompt: Chiara kommt ___ Schweiz.
    options:
    - id: a
      text: aus
    - id: b
      text: aus der
    - id: c
      text: aus die
    answer:
    - b
    explanation_vi: die Schweiz → aus der Schweiz.
  - id: a1.m01.l05.ex.02.q2
    prompt: Olivia wohnt ___ USA.
    options:
    - id: a
      text: in den
    - id: b
      text: in
    - id: c
      text: in der
    answer:
    - a
    explanation_vi: die USA (số nhiều) → in den USA.
  - id: a1.m01.l05.ex.02.q3
    prompt: Lukas kommt ___ Österreich.
    options:
    - id: a
      text: aus den
    - id: b
      text: aus
    - id: c
      text: aus der
    answer:
    - b
    explanation_vi: Österreich không có mạo từ.
  - id: a1.m01.l05.ex.02.q4
    prompt: Emre kommt ___ Türkei.
    options:
    - id: a
      text: aus den
    - id: b
      text: aus der
    - id: c
      text: aus
    answer:
    - b
    explanation_vi: die Türkei → aus der Türkei.
- id: a1.m01.l05.ex.03
  type: fill-blank
  skill: vocabulary
  difficulty: 2
  objective_refs:
  - a1.m01.l05.obj1
  - a1.m01.l05.obj2
  instructions_vi: Điền tên nước hoặc ngôn ngữ.
  items:
  - id: a1.m01.l05.ex.03.q1
    prompt: Wien ist in ___.
    answers:
    - Österreich
    explanation_vi: Viên là thủ đô nước Áo.
  - id: a1.m01.l05.ex.03.q2
    prompt: Zürich ist in der ___.
    answers:
    - Schweiz
    explanation_vi: Zürich ở Thụy Sĩ.
  - id: a1.m01.l05.ex.03.q3
    prompt: In Japan spricht man ___.
    answers:
    - Japanisch
    explanation_vi: man = người ta; tiếng Nhật = Japanisch.
  - id: a1.m01.l05.ex.03.q4
    prompt: Hoa kommt aus Vietnam. Sie spricht ___.
    answers:
    - Vietnamesisch
    explanation_vi: Vietnam → Vietnamesisch.
- id: a1.m01.l05.ex.04
  type: multiple-choice
  skill: listening
  difficulty: 2
  objective_refs:
  - a1.m01.l05.obj1
  - a1.m01.l05.obj3
  instructions_vi: Nghe ba người tự giới thiệu. Chọn đáp án đúng.
  stimulus:
    ref: a1.m01.l05.b6
  items:
  - id: a1.m01.l05.ex.04.q1
    prompt: Lukas sống ở đâu?
    options:
    - id: a
      text: Hamburg
    - id: b
      text: Wien
    - id: c
      text: Zürich
    answer:
    - b
    explanation_vi: Ich wohne in Wien.
  - id: a1.m01.l05.ex.04.q2
    prompt: Chiara nói mấy ngôn ngữ?
    options:
    - id: a
      text: drei
    - id: b
      text: zwei
    - id: c
      text: vier
    answer:
    - a
    explanation_vi: Italienisch, Deutsch und Französisch.
  - id: a1.m01.l05.ex.04.q3
    prompt: Ai đang học tiếng Đức?
    options:
    - id: a
      text: Hoa
    - id: b
      text: Chiara
    - id: c
      text: Lukas
    answer:
    - a
    explanation_vi: 'Hoa: Ich lerne Deutsch.'
- id: a1.m01.l05.ex.05
  type: true-false
  skill: listening
  difficulty: 2
  objective_refs:
