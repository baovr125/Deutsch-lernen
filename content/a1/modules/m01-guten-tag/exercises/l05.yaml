    explanation_vi: Hoa đến từ Việt Nam nhưng sống ở Hamburg.
  - id: a1.m01.l05.ex.05.q3
    prompt: Lukas nói tiếng Anh.
    answer: true
    explanation_vi: Ich spreche Deutsch und Englisch.
