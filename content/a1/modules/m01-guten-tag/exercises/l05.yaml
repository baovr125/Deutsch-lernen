- id: a1.m01.l05.ex.09
  type: speaking-practice
  skill: speaking
  difficulty: 2
  objective_refs:
  - a1.m01.l05.obj4
  instructions_vi: Ghi âm phần giới thiệu bản thân 5–6 câu (phần Nói). Có thể dùng AI để chấm khi tính năng sẵn sàng.
  grading: self
  rubric:
  - criterion_vi: 'Đủ 5 thông tin: tên, quê, nơi ở, ngôn ngữ, đang học gì'
    points: 3
  - criterion_vi: Động từ chia đúng và ở vị trí 2
    points: 2
  - criterion_vi: Phát âm dễ hiểu (trọng âm tên nước, phụ âm cuối)
    points: 1
  items:
  - id: a1.m01.l05.ex.09.q1
    prompt_vi: Giới thiệu bản thân trước lớp.
    model_answer:
      de: Hallo! Ich heiße Lan. Ich komme aus Vietnam, aus Da Nang. Ich wohne jetzt in Leipzig. Ich spreche Vietnamesisch und Englisch. Ich lerne Deutsch.
    explanation_vi: So sánh với bài nói mẫu.
- id: a1.m01.l05.ex.10
  type: writing-practice
  skill: writing
  difficulty: 2
  objective_refs:
  - a1.m01.l05.obj4
  instructions_vi: Viết đoạn 5–6 câu giới thiệu bản thân (phần Viết). Tự chấm theo tiêu chí; sau này có thể gửi AI chấm.
  grading: self
  rubric:
  - criterion_vi: 'Nội dung: đủ 5 thông tin'
    points: 3
  - criterion_vi: 'Ngữ pháp: động từ chia đúng, ở vị trí 2; aus/in đúng'
    points: 2
  - criterion_vi: 'Chính tả: viết hoa danh từ, tên riêng; dấu câu'
    points: 1
  items:
  - id: a1.m01.l05.ex.10.q1
    prompt_vi: Viết về bản thân cho trang web của lớp.
    model_answer:
      de: Hallo! Ich heiße Minh. Ich komme aus Vietnam, aus Hanoi. Ich wohne in Hamburg. Ich spreche Vietnamesisch, Englisch und ein bisschen Deutsch. Ich lerne Deutsch.
    explanation_vi: So sánh với đoạn mẫu và checklist ở phần Viết.
