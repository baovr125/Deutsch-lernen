exercises:
- id: a1.m01.l03.ex.01
  type: multiple-choice
  skill: grammar
  difficulty: 1
  objective_refs:
  - a1.m01.l03.obj5
  - a1.m01.l03.obj1
  - a1.m01.l03.obj2
  instructions_vi: Chọn từ để hỏi đúng.
  items:
  - id: a1.m01.l03.ex.01.q1
    prompt: ___ kommen Sie? – Aus Deutschland.
    options:
    - id: a
      text: Woher
    - id: b
      text: Wo
    - id: c
      text: Wie
    answer:
    - a
    explanation_vi: aus → hỏi woher.
  - id: a1.m01.l03.ex.01.q2
    prompt: ___ wohnst du? – In Leipzig.
    options:
    - id: a
      text: Wer
    - id: b
      text: Woher
    - id: c
      text: Wo
    answer:
    - c
    explanation_vi: in → hỏi wo.
  - id: a1.m01.l03.ex.01.q3
    prompt: ___ ist das? – Das ist Frau Koch.
    options:
    - id: a
      text: Was
    - id: b
      text: Wo
    - id: c
      text: Wer
    answer:
    - c
    explanation_vi: Hỏi người → wer.
  - id: a1.m01.l03.ex.01.q4
    prompt: ___ ist das? – Das ist ein Taxi.
    options:
    - id: a
      text: Was
    - id: b
      text: Wer
    - id: c
      text: Woher
    answer:
    - a
    explanation_vi: Hỏi vật → was.
  - id: a1.m01.l03.ex.01.q5
    prompt: ___ Sprachen sprichst du? – Vietnamesisch und Deutsch.
    options:
    - id: a
      text: Was
    - id: b
      text: Wie
    - id: c
      text: Welche
    answer:
    - c
    explanation_vi: Hỏi chọn trong nhóm → welche.
- id: a1.m01.l03.ex.02
  type: word-order
  skill: grammar
  difficulty: 1
  objective_refs:
  - a1.m01.l03.obj5
  instructions_vi: Sắp xếp thành câu hỏi hoặc câu kể đúng.
  items:
  - id: a1.m01.l03.ex.02.q1
    tokens:
    - Sie
    - kommen
    - Woher
    answer: Woher kommen Sie?
    explanation_vi: W-Wort – động từ – chủ ngữ.
  - id: a1.m01.l03.ex.02.q2
    tokens:
    - in
    - wohne
    - Hamburg
    - Ich
    answer: Ich wohne in Hamburg.
    explanation_vi: Chủ ngữ (1) – động từ (2) – in Hamburg.
  - id: a1.m01.l03.ex.02.q3
    tokens:
    - spricht
    - Er
    - Englisch
    answer: Er spricht Englisch.
    explanation_vi: Er (1) – spricht (2) – Englisch.
- id: a1.m01.l03.ex.03
  type: fill-blank
  skill: grammar
  difficulty: 2
  objective_refs:
  - a1.m01.l03.obj4
  - a1.m01.l03.obj3
  instructions_vi: Chia động từ trong ngoặc.
  items:
  - id: a1.m01.l03.ex.03.q1
    prompt: Das ist Mai. Sie ___ aus Vietnam. (kommen)
    answers:
    - kommt
    explanation_vi: sie (cô ấy) → kommt.
  - id: a1.m01.l03.ex.03.q2
    prompt: Paul ___ in Köln. (wohnen)
    answers:
    - wohnt
    explanation_vi: er (Paul) → wohnt.
  - id: a1.m01.l03.ex.03.q3
    prompt: ___ du Deutsch? (sprechen)
    answers:
    - Sprichst
    explanation_vi: 'du: e → i → sprichst.'
  - id: a1.m01.l03.ex.03.q4
    prompt: Frau Koch ___ Englisch und Spanisch. (sprechen)
    answers:
    - spricht
    explanation_vi: sie → spricht.
  - id: a1.m01.l03.ex.03.q5
    prompt: Woher ___ Sie? (kommen)
    answers:
    - kommen
    explanation_vi: Sie → kommen.
- id: a1.m01.l03.ex.04
  type: matching
  skill: grammar
  difficulty: 1
  objective_refs:
  - a1.m01.l03.obj1
  - a1.m01.l03.obj2
  - a1.m01.l03.obj3
  - a1.m01.l03.obj5
  instructions_vi: Nối câu hỏi với câu trả lời phù hợp.
  items:
  - id: a1.m01.l03.ex.04.q1
    pairs:
    - left: Woher kommst du?
      right: Aus Vietnam.
    - left: Wo wohnst du?
      right: In Berlin.
    - left: Welche Sprachen sprichst du?
      right: Vietnamesisch und Englisch.
    - left: Wie heißt du?
      right: Ich heiße Hoa.
    - left: Wer ist das?
      right: Das ist Paul.
    explanation_vi: woher → aus; wo → in; welche Sprachen → tên ngôn ngữ; wie heißt → tên; wer → người.
