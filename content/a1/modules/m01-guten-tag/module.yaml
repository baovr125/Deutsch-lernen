title_vi: Xin chào!
summary_vi: 'Kapitel đầu tiên: chào hỏi thân mật và trang trọng, giới thiệu bản thân và người khác, hỏi về quê quán, nơi ở và ngôn ngữ, đếm từ 0 đến 20, đọc số điện thoại, đánh vần tên và email, nói tên các nước và ngôn ngữ. Ngữ pháp: du/Sie, chia động từ ở số ít, câu hỏi W- và câu kể với động từ ở vị trí 2.'
