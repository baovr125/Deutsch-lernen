summary_vi: 'Số 0–20 (13–19 = đơn vị + zehn; sechzehn, siebzehn). Số điện thoại đọc từng chữ số, dùng zwo cho 2. Email: at = @, Punkt = ., Unterstrich = _, Bindestrich = -. Đánh vần: Wie schreibt man das? / Buchstabieren Sie, bitte. Khi chưa hiểu: Wie bitte? / Noch einmal, bitte. / Langsam, bitte. / Ich verstehe das nicht.'
self_check:
- Tôi đếm được từ 0 đến 20 và ngược lại.
- Tôi đọc được số điện thoại của mình và ghi lại số khi nghe.
- Tôi đánh vần được họ tên của mình.
- Tôi đọc và ghi lại được một địa chỉ email.
- Khi chưa hiểu, tôi biết đề nghị nhắc lại hoặc nói chậm.
blocks:
- id: a1.m01.l04.b1
  kind: explanation
  title_vi: Giới thiệu bài học
  body_vi: 'Khi đăng ký khóa học, mở tài khoản hay hẹn gặp ai đó, bạn luôn phải trao đổi **số điện thoại**, **email**

    và **đánh vần tên** – nhất là tên tiếng Việt, người Đức thường không biết viết thế nào!


    Bài này gồm bốn phần:

    1. **Số 0–20** – cách đếm và mẹo nhớ.

    2. **Số điện thoại** – người Đức đọc từng chữ số, đôi khi theo cặp.

    3. **Đánh vần** – dùng bảng chữ cái bạn đã học ở phần nhập môn.

    4. **Email** – cách đọc các ký hiệu @ . _ -


    Và quan trọng nhất: **khi không hiểu, đừng im lặng!** Hãy nói *Wie bitte? Noch einmal, bitte. Langsam, bitte.*'
- id: a1.m01.l04.b2
  kind: explanation
  title_vi: 'Số 13–19: đơn vị + zehn (và hai ngoại lệ chính tả)'
  skill: grammar
  body_vi: 'Từ 13 đến 19: số hàng đơn vị đứng TRƯỚC, zehn đứng SAU – ngược với tiếng Việt (mười ba). Hai ngoại lệ chính tả: sechzehn (mất s), siebzehn (mất en). 11 (elf) và 12 (zwölf) phải học thuộc.'
  examples:
  - de: drei + zehn = dreizehn
    vi: '13 (nghĩa đen: ba-mười)'
  - de: sechs → sechzehn, sieben → siebzehn
    vi: 16, 17 – chú ý chính tả
- id: a1.m01.l04.b3
  kind: explanation
  title_vi: mein/dein/Ihr + danh từ giống cái thêm -e
  skill: grammar
  body_vi: 'Trước danh từ giống cái (die Nummer, die E-Mail-Adresse), thêm -e: meine, deine, Ihre. Trước danh từ giống đực/trung (der Name, das Handy) giữ nguyên: mein, dein, Ihr. Quy tắc đầy đủ học ở Kapitel 5.'
  examples:
  - de: Wie ist deine Handynummer?
    vi: Số di động của bạn là gì?
    note_vi: die Handynummer → deine
  - de: Wie ist Ihr Name?
    vi: Tên của ông/bà là gì?
    note_vi: der Name → Ihr
- id: a1.m01.l04.b4
  kind: explanation
  title_vi: Phủ định đơn giản với nicht
  skill: grammar
  body_vi: nicht phủ định động từ hoặc tính từ. Trong câu ngắn, nicht thường đứng ở CUỐI câu – khác tiếng Việt (“không” đứng trước động từ). Phủ định danh từ bằng kein/keine học ở Kapitel 3.
  examples:
  - de: Ich verstehe das nicht.
    vi: Tôi không hiểu cái đó.
  - de: Das ist nicht richtig.
    vi: Cái đó không đúng.
- id: a1.m01.l04.b5
  kind: explanation
  title_vi: 'Danh từ ghép: giống theo từ cuối'
  skill: grammar
  body_vi: 'Khi ghép hai danh từ, mạo từ (và số nhiều) theo từ CUỐI: das Telefon + die Nummer → die Telefonnummer. Đây là mẹo rất hữu ích để đoán giống.'
  examples:
  - de: das Handy + die Nummer → die Handynummer
    vi: số điện thoại di động
  - de: die E-Mail + die Adresse → die E-Mail-Adresse
    vi: địa chỉ email
- id: a1.m01.l04.b6
  kind: pronunciation
  title_vi: Các số dễ nhầm
  skill: pronunciation
  body_vi: 'Các số dễ nhầm


    - **vier [fiːɐ̯] – vierzehn [ˈfɪʁtseːn]**: ie dài trong vier nhưng NGẮN trong vierzehn.

    - **zwei – drei**: dễ nghe nhầm qua điện thoại → người Đức nói **zwo** cho số 2.

    - **sechs [zɛks]**: chs = [ks]. **sechzehn [ˈzɛçtseːn]**: ch = [ç].

    - **13–19 và 20**: nhấn âm tiết đầu: DREI-zehn, ZWAN-zig.

    - Đuôi **-zig [tsɪç]** trong zwanzig.



    Luyện tập: Đếm 0 → 20 rồi 20 → 0. Sau đó đọc số điện thoại của chính bạn 3 lần.'
  items:
  - de: vier – vierzehn
    vi: 4 – 14
    ipa: '[fiːɐ̯] – [ˈfɪʁtseːn]'
  - de: zwei / zwo
    vi: '2'
    ipa: '[tsvaɪ̯] / [tsvoː]'
  - de: sechs – sechzehn
    vi: 6 – 16
    ipa: '[zɛks] – [ˈzɛçtseːn]'
- id: a1.m01.l04.b7
  kind: pronunciation
  title_vi: Ký hiệu trong email
  skill: pronunciation
  body_vi: 'Ký hiệu trong email


    @ đọc là “at” [ɛt] (như tiếng Anh), dấu chấm là Punkt [pʊŋkt], _ là Unterstrich, - là Bindestrich (nhiều người nói Minus). Tên miền .de đọc là “de” [deː]: Punkt de.


    Luyện tập: Đọc to địa chỉ email thật của bạn theo cách tiếng Đức.'
  items:
  - de: lan.pham@gmx.de
    vi: lan Punkt pham at g-m-x Punkt de
    ipa: '[… ɛt ɡeː ɛm ɪks pʊŋkt deː]'
- id: a1.m01.l04.b8
  kind: examples
  title_vi: Câu ví dụ
  examples:
  - de: Wie ist deine Handynummer? – 0176 348902.
    vi: Số di động của bạn là gì? – 0176 348902.
  - de: 'Mein Nachname ist Nguyen: N – G – U – Y – E – N.'
    vi: 'Họ của tôi là Nguyễn: N – G – U – Y – E – N.'
  - de: Wie schreibt man das?
    vi: Cái đó viết thế nào?
  - de: Noch einmal, bitte. Langsam, bitte!
    vi: Làm ơn nói lại. Làm ơn nói chậm thôi!
  - de: Wie sagt man „cảm ơn“ auf Deutsch? – Danke.
    vi: “Cảm ơn” tiếng Đức nói thế nào? – Danke.
  - de: Ich verstehe das nicht.
    vi: Tôi không hiểu cái đó.
  - de: Zehn plus fünf ist fünfzehn.
    vi: Mười cộng năm là mười lăm.
