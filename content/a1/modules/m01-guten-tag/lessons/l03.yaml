summary_vi: 'Woher kommst du/kommen Sie? – Ich komme aus … | Wo wohnst du/wohnen Sie? – Ich wohne in … | Welche Sprachen sprichst du? – Ich spreche … | Das ist … Er/Sie kommt aus … Câu hỏi W-: W-Wort – động từ – chủ ngữ; câu kể: động từ ở vị trí 2. er/sie + -t; sprechen: du sprichst, er spricht.'
self_check:
- 'Tôi hỏi và trả lời được: Bạn đến từ đâu? Bạn sống ở đâu? Bạn nói ngôn ngữ nào?'
- Tôi không nhầm woher (→ aus) và wo (→ in).
- Tôi giới thiệu được một người khác bằng er/sie.
- Tôi đặt được câu hỏi W- với động từ ở vị trí 2.
blocks:
- id: a1.m01.l03.b1
  kind: explanation
  title_vi: Giới thiệu bài học
  body_vi: 'Sau tên, câu hỏi tiếp theo khi làm quen thường là: **Bạn đến từ đâu? Bạn sống ở đâu? Bạn nói những thứ tiếng nào?**


    Trong bài này bạn học:

    - Ba câu hỏi W- quan trọng: **Woher …? Wo …? Welche Sprachen …?** (chủ điểm *Câu hỏi W-*)

    - Câu kể với **động từ ở vị trí 2** (chủ điểm *Câu kể*)

    - Chia động từ cho **er** (anh ấy) và **sie** (cô ấy) để giới thiệu người khác (chủ điểm *Chia động từ ở số ít*)


    **Cặp dễ nhầm số 1 của người Việt:**

    - *Woher kommst du?* → trả lời bằng **aus**: *Ich komme **aus** Vietnam.*

    - *Wo wohnst du?* → trả lời bằng **in**: *Ich wohne **in** Berlin.*'
- id: a1.m01.l03.b2
  kind: explanation
  title_vi: 'Nói nghề nghiệp: không dùng mạo từ'
  skill: grammar
  body_vi: 'Khi nói ai đó làm nghề gì, tiếng Đức KHÔNG dùng mạo từ: Er ist Reiseführer (không nói “Er ist der Reiseführer” hay “ein Reiseführer”). Với nữ, thêm -in: Sie ist Reiseführerin. Bạn sẽ học thêm nhiều nghề ở Kapitel 2.'
  examples:
  - de: Er ist Reiseführer.
    vi: Anh ấy là hướng dẫn viên du lịch.
  - de: Sie ist Reiseführerin.
    vi: Cô ấy là hướng dẫn viên du lịch.
- id: a1.m01.l03.b3
  kind: pronunciation
  title_vi: 'sp đầu từ = [ʃp]: sprechen, Sprache'
  skill: pronunciation
  body_vi: 'sp đầu từ = [ʃp]: sprechen, Sprache


    Ở đầu từ (hoặc đầu phần từ), sp đọc [ʃp] và st đọc [ʃt] – như có chữ “sch” phía trước. sprechen [ˈʃpʁɛçn̩], Sprache [ˈʃpʁaːxə]. Không đọc “x-prê-khen”.


    Luyện tập: Đọc: Ich spreche – du sprichst – er spricht. Bật rõ t cuối trong spricht.'
  items:
  - de: sprechen
    vi: nói
    ipa: '[ˈʃpʁɛçn̩]'
  - de: Sprache
    vi: ngôn ngữ
    ipa: '[ˈʃpʁaːxə]'
  - de: spricht
    vi: (anh ấy) nói
    ipa: '[ʃpʁɪçt]'
- id: a1.m01.l03.b4
  kind: pronunciation
  title_vi: woher [voˈheːɐ̯] và ngữ điệu câu hỏi W-
  skill: pronunciation
  body_vi: 'woher [voˈheːɐ̯] và ngữ điệu câu hỏi W-


    woher nhấn ở âm tiết thứ hai: wo-HER. Câu hỏi W- xuống giọng ở cuối: Woher kommen Sie? ↘


    Luyện tập: Nói 5 câu hỏi W- của bài, mỗi câu kết thúc bằng giọng đi xuống.'
  items:
  - de: Woher kommen Sie? ↘
    vi: Ông/Bà đến từ đâu?
    ipa: '[voˈheːɐ̯ ˈkɔmən ziː]'
  - de: Wo wohnst du? ↘
    vi: Bạn sống ở đâu?
- id: a1.m01.l03.b5
  kind: examples
  title_vi: Câu ví dụ
  examples:
  - de: Woher kommen Sie? – Ich komme aus Vietnam.
    vi: Ông/Bà đến từ đâu? – Tôi đến từ Việt Nam.
  - de: Wo wohnst du? – Ich wohne in Hamburg.
    vi: Bạn sống ở đâu? – Mình sống ở Hamburg.
  - de: Welche Sprachen sprechen Sie? – Deutsch und Englisch.
    vi: Ông/Bà nói những ngôn ngữ nào? – Tiếng Đức và tiếng Anh.
  - de: Das ist Herr Novak. Er wohnt in Berlin.
    vi: Đây là ông Novak. Ông ấy sống ở Berlin.
  - de: Sie heißt Mai und spricht Vietnamesisch.
    vi: Cô ấy tên là Mai và nói tiếng Việt.
  - de: Wer ist die Person? – Das ist Frau Koch. Sie ist Reiseführerin.
    vi: Người đó là ai? – Đó là bà Koch. Bà ấy là hướng dẫn viên du lịch.
  - de: Was ist das? – Das ist ein Hotel.
    vi: Đó là cái gì? – Đó là một khách sạn.
