- id: a1.m01.l03.b9
  kind: writing
  title_vi: Viết về một người từ phiếu thông tin
  skill: writing
  task_vi: 'Đọc phiếu thông tin và viết 4 câu giới thiệu người đó. Phiếu: Name: Paul Weber · Herkunft: Deutschland (Hamburg) · Wohnort: München · Sprachen: Deutsch, Englisch'
  model:
    de: Das ist Paul Weber. Er kommt aus Deutschland, aus Hamburg. Er wohnt in München. Er spricht Deutsch und Englisch.
    vi: Đây là Paul Weber. Anh ấy đến từ Đức, từ Hamburg. Anh ấy sống ở München. Anh ấy nói tiếng Đức và tiếng Anh.
  checklist_vi:
  - Dùng er cho người nam (sie cho người nữ).
  - 'Động từ có đuôi -t: kommt, wohnt, spricht.'
  - kommen + aus, wohnen + in.
  - Động từ ở vị trí 2 trong mỗi câu.
