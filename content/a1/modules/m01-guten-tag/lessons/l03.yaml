- id: a1.m01.l03.b7
  kind: reading
  title_vi: Danh thiếp và lời giới thiệu
  paragraphs:
  - de: "┌─────────────────────────────┐\n  Sabine Koch\n  Reiseführerin\n  Stadtführungen in Berlin\n  Sprachen: Deutsch · Englisch · Spanisch\n└─────────────────────────────┘\n\nDas ist Sabine Koch. Sie kommt aus Österreich, aus Wien.\nSie wohnt in Berlin. Sie ist Reiseführerin.\nSie spricht Deutsch, Englisch und Spanisch."
    vi: 'Sabine Koch – Hướng dẫn viên du lịch – Dẫn tour tham quan thành phố ở Berlin –

      Ngôn ngữ: tiếng Đức · tiếng Anh · tiếng Tây Ban Nha


      Đây là Sabine Koch. Cô ấy đến từ Áo, từ Viên.

      Cô ấy sống ở Berlin. Cô ấy là hướng dẫn viên du lịch.

      Cô ấy nói tiếng Đức, tiếng Anh và tiếng Tây Ban Nha.'
  text_type_vi: Danh thiếp và đoạn giới thiệu ngắn
  skill: reading
