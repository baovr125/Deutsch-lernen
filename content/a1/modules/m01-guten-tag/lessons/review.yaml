  title_vi: Tìm bạn học tandem
  paragraphs:
  - de: 'Tandempartner gesucht!

      Hallo! Ich heiße Julia Berger. Ich komme aus Österreich, aus Graz.

      Ich wohne jetzt in Dresden. Ich spreche Deutsch und Englisch.

      Ich lerne Vietnamesisch – aber nur ein bisschen!

      Sprichst du Vietnamesisch und lernst du Deutsch?

      Meine E-Mail-Adresse: julia.berger@web.de

      Telefon: 0172 581346'
    vi: 'Tìm bạn học tandem (học trao đổi ngôn ngữ)!

      Xin chào! Mình tên là Julia Berger. Mình đến từ Áo, từ Graz.

      Bây giờ mình sống ở Dresden. Mình nói tiếng Đức và tiếng Anh.

      Mình đang học tiếng Việt – nhưng chỉ một chút thôi!

      Bạn nói tiếng Việt và đang học tiếng Đức không?

      Email của mình: julia.berger@web.de

      Điện thoại: 0172 581346'
  text_type_vi: Thông báo trên bảng tin
