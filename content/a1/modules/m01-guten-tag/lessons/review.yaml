summary_vi: 'Kapitel 1 – bạn có thể: chào hỏi thân mật và trang trọng; giới thiệu bản thân và người khác; hỏi và trả lời về tên, quê, nơi ở, ngôn ngữ; trao đổi số điện thoại, email; đánh vần; báo khi không hiểu. Ngữ pháp: du/Sie; chia động từ số ít (sein, heißen, kommen, wohnen, sprechen); câu hỏi W-; câu kể với động từ ở vị trí 2.'
self_check:
- Tôi có thể chào hỏi và tạm biệt đúng tình huống (du/Sie, thời điểm trong ngày).
- Tôi có thể giới thiệu bản thân và một người khác bằng 4–5 câu.
- Tôi có thể hỏi và trả lời về quê quán, nơi ở, ngôn ngữ.
- Tôi có thể đọc và ghi lại số điện thoại, đánh vần tên, đọc email.
- Tôi biết nói gì khi không hiểu.
- Tôi có thể điền một biểu mẫu đơn giản và viết tin nhắn giới thiệu ngắn.
blocks:
- id: a1.m01.review.b1
  kind: explanation
  title_vi: Giới thiệu bài học
  body_vi: '**Bạn đã hoàn thành 5 bài của Kapitel 1!** Bài này có hai phần:


    **Phần A – Tổng kết (kurz und klar):** đọc lại bảng Redemittel và các chủ điểm ngữ pháp. Nếu phần nào chưa chắc, quay lại bài tương ứng.


    **Phần B – Kiểm tra:** 10 bài tập kiểm tra cả 4 kỹ năng. Hệ thống sẽ ghi nhận kết quả theo **từng mục tiêu**, không chỉ điểm trung bình:

    - Mỗi kỹ năng (từ vựng, ngữ pháp, nghe, đọc, viết, nói) cần đạt **ít nhất 60%**.

    - Nếu một kỹ năng dưới 60%, hệ thống sẽ đề xuất bài cần ôn lại trước khi sang Kapitel 2.


    Hãy làm bài **không xem lại bài học**, sau đó mới xem đáp án và giải thích.'
- id: a1.m01.review.b2
  kind: explanation
  title_vi: Bảng tổng kết ngữ pháp Kapitel 1
  skill: grammar
  body_vi: '| | sein | heißen | kommen | wohnen | sprechen |

    |---|---|---|---|---|---|

    | ich | bin | heiße | komme | wohne | spreche |

    | du | bist | heißt | kommst | wohnst | sprichst |

    | er/sie/es | ist | heißt | kommt | wohnt | spricht |

    | Sie | sind | heißen | kommen | wohnen | sprechen |


    **Câu hỏi W-:** W-Wort (1) – động từ (2) – chủ ngữ: *Woher kommst du?*

    **Câu kể:** chủ ngữ (1) – động từ (2) – …: *Ich komme aus Vietnam.*

    '
  examples:
  - de: Woher kommen Sie? – Ich komme aus Vietnam.
    vi: Ông/Bà đến từ đâu? – Tôi đến từ Việt Nam.
  - de: Wo wohnt sie? – Sie wohnt in Wien.
    vi: Cô ấy sống ở đâu? – Cô ấy sống ở Viên.
- id: a1.m01.review.b3
  kind: pronunciation
  title_vi: Ôn phát âm Kapitel 1
  skill: pronunciation
  body_vi: 'Ôn phát âm Kapitel 1


    Tự kiểm tra: ü (tschüs), ß (heißen), ch [ç] (ich, nicht), ch [x] (acht, auch), sp [ʃp] (sprechen), z [ts] (zehn, zwanzig), v [f] (vier), w [v] (wo, wie, woher), phụ âm cuối rõ (Text, nicht, fünf), câu hỏi W- xuống giọng.


    Luyện tập: Đọc to hai câu ví dụ và ghi âm; so sánh với audio mẫu.'
  items:
  - de: Ich spreche ein bisschen Deutsch.
    vi: Tôi nói được một chút tiếng Đức.
    ipa: '[ɪç ˈʃpʁɛçə aɪ̯n ˈbɪsçən dɔʏ̯tʃ]'
  - de: Woher kommen Sie? ↘
    vi: Ông/Bà đến từ đâu?
- id: a1.m01.review.b4
  kind: examples
  title_vi: Câu ví dụ
  examples:
  - de: Guten Abend! Mein Name ist Minh Tran.
    vi: Chào buổi tối! Tên tôi là Minh Trần.
  - de: Das ist Anna. Sie kommt aus der Schweiz und spricht Deutsch und Französisch.
    vi: Đây là Anna. Cô ấy đến từ Thụy Sĩ và nói tiếng Đức và tiếng Pháp.
  - de: Wie ist Ihre Telefonnummer? – Null, eins, sieben, zwo …
    vi: Số điện thoại của ông/bà là gì? – 0, 1, 7, 2 …
  - de: Langsam, bitte! Noch einmal, bitte.
    vi: Làm ơn nói chậm thôi! Làm ơn nói lại.
