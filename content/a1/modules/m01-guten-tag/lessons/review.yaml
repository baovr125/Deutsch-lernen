- id: a1.m01.review.b7
  kind: speaking
  title_vi: 'Kiểm tra nói: giới thiệu và trả lời câu hỏi'
  skill: speaking
  task_vi: 'Phần 1: tự giới thiệu (tên, quê, nơi ở, ngôn ngữ, đánh vần họ). Phần 2: trả lời 3 câu hỏi trang trọng: Wie geht es Ihnen? / Wie ist Ihre Telefonnummer? / Welche Sprachen sprechen Sie?'
  steps_vi:
  - Chuẩn bị 1 phút, không viết thành câu hoàn chỉnh – chỉ ghi từ khóa.
  - Nói phần 1 (khoảng 1 phút) và ghi âm.
  - Nghe câu hỏi phần 2 (audio) và trả lời.
  lines:
  - speaker: Lernende
    de: 'Guten Tag! Mein Name ist Lan Pham. Pham: P – H – A – M. Ich komme aus Vietnam und wohne in Leipzig. Ich spreche Vietnamesisch, Englisch und ein bisschen Deutsch.'
    vi: 'Xin chào! Tên tôi là Lan Phạm. Phạm: P – H – A – M. Tôi đến từ Việt Nam và sống ở Leipzig. Tôi nói tiếng Việt, tiếng Anh và một chút tiếng Đức.'
