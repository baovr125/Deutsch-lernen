  references:
  - work: Netzwerk neu A1 (Klett)
    scope: 'Kapitel 1: Guten Tag! (Kapitelauftakt); Hallo! Tschüs!; Guten Tag! Auf Wiedersehen!; Woher kommen Sie?; Zahlen und Buchstaben; Landeskunde: Länder und Sprachen; Film: Die Netzwerk-WG; kurz und klar: Redemittel und Grammatik'
    verification: verified
  notes_vi: Trình tự và phạm vi theo Stoffverteilungsplan Netzwerk neu A1.1 (Kapitel 1, 10 UE). Toàn bộ giảng giải, hội thoại, bài đọc và bài tập là nội dung tự biên soạn.
entries:
- id: a1.m01.v.ich
  de: ich
  pos: pronoun
  vi: tôi
  ipa: /ɪç/
  example:
    de: Ich bin Minh.
    vi: Tôi là Minh.
  usage_vi: Viết thường (trừ khi đứng đầu câu). ch sau i đọc là [ç] – thổi hơi nhẹ, không đọc "ích" có âm k.
  lesson_refs:
  - a1.m01.l01
  tags:
  - personalpronomen
  source: nwn-lern
- id: a1.m01.v.du
  de: du
  pos: pronoun
  vi: bạn, cậu, em, anh… (xưng hô thân mật)
  ipa: /duː/
  example:
    de: Bist du Anna?
    vi: Bạn là Anna à?
  usage_vi: Một từ "du" thay cho rất nhiều đại từ tiếng Việt (bạn, cậu, em, anh, chị…). Dùng với bạn bè, gia đình, trẻ em, người trẻ cùng lứa.
  lesson_refs:
  - a1.m01.l01
  tags:
  - personalpronomen
  - informell
  source: nwn-lern
- id: a1.m01.v.sein
  de: sein
  pos: verb
  vi: là, thì, ở
  forms:
    text: ich bin, du bist, er/sie/es ist, Sie sind
    er: ist
  ipa: /zaɪ̯n/
  example:
    de: Ich bin Lan.
    vi: Tôi là Lan.
  usage_vi: 'Động từ bất quy tắc quan trọng nhất. Tiếng Việt có thể nói "Tôi Lan" nhưng tiếng Đức BẮT BUỘC có động từ: Ich bin Lan.'
  lesson_refs:
  - a1.m01.l01
  tags:
  - verb
  - unregelmaessig
  source: nwn-lern
- id: a1.m01.v.heissen
  de: heißen
  pos: verb
  vi: tên là, được gọi là
  forms:
    text: ich heiße, du heißt, er heißt, Sie heißen
    er: heißt
  ipa: /ˈhaɪ̯sn̩/
  example:
    de: Ich heiße Nam.
    vi: Tôi tên là Nam.
  usage_vi: du heißt (không phải "du heißst") vì gốc từ đã tận cùng bằng ß. Nói "Ich heiße…" hoặc "Mein Name ist…", không nói "Mein Name heißt…".
  lesson_refs:
  - a1.m01.l01
  tags:
  - verb
  source: nwn-lern
- id: a1.m01.v.wer
  de: wer
  pos: interrogative
  vi: ai
  ipa: /veːɐ̯/
  example:
    de: Wer ist das?
    vi: Đó là ai?
  usage_vi: 'Dễ nhầm: wer = ai (không phải "where"). w đọc là [v].'
  lesson_refs:
  - a1.m01.l01
  tags:
  - w-frage
  source: nwn-lern
- id: a1.m01.v.wie
  de: wie
  pos: interrogative
  vi: như thế nào, ra sao
  ipa: /viː/
  example:
    de: Wie heißt du?
    vi: Bạn tên là gì?
  usage_vi: 'Hỏi tên dùng "Wie heißt du?" (nghĩa đen: bạn được gọi thế nào?), KHÔNG dùng "Was heißt du?". ie đọc là [iː] dài.'
  lesson_refs:
  - a1.m01.l01
  tags:
  - w-frage
  source: nwn-lern
- id: a1.m01.v.name
  de: Name
  pos: noun
  article: der
  plural: Namen
  vi: tên
  ipa: /ˈnaːmə/
  example:
    de: Wie ist der Name?
    vi: Tên là gì?
  usage_vi: 'Danh từ giống đực: der Name. Số nhiều: die Namen.'
  lesson_refs:
  - a1.m01.l01
  tags:
  - person
  source: nwn-lern
- id: a1.m01.v.das
  de: das
  pos: pronoun
  vi: đây, đó, cái này/ cái đó
  ipa: /das/
  example:
    de: Das ist Tom.
    vi: Đây là Tom.
  usage_vi: 'Trong "Das ist…", "das" không đổi dù người được giới thiệu là nam hay nữ: Das ist Tom. / Das ist Anna. (Đừng nhầm với mạo từ "das" của danh từ.)'
  lesson_refs:
  - a1.m01.l01
  tags:
  - vorstellen
  source: nwn-lern
- id: a1.m01.v.gut
  de: gut
  pos: adjective
  vi: tốt, khỏe, giỏi
  ipa: /ɡuːt/
  example:
    de: Gut, danke!
    vi: Khỏe, cảm ơn!
  usage_vi: u đọc là [uː] dài; t cuối phải bật rõ.
  lesson_refs:
  - a1.m01.l01
  tags:
  - befinden
  source: nwn-lern
- id: a1.m01.v.sehr
  de: sehr
  pos: adverb
  vi: rất
  ipa: /zeːɐ̯/
  example:
    de: Sehr gut, danke!
    vi: Rất khỏe, cảm ơn!
  usage_vi: h sau nguyên âm không đọc, chỉ làm nguyên âm dài. r cuối đọc nhẹ như [ɐ].
  lesson_refs:
  - a1.m01.l01
  tags:
  - befinden
  source: nwn-lern
- id: a1.m01.v.ganz
  de: ganz
  pos: adverb
  vi: khá; hoàn toàn
  ipa: /ɡants/
  example:
    de: Ganz gut, danke.
    vi: Khá ổn, cảm ơn.
  usage_vi: '"Ganz gut" = khá ổn (KHÔNG phải "hoàn toàn tốt"). z đọc là [ts].'
  lesson_refs:
  - a1.m01.l01
  tags:
  - befinden
  - mehrdeutig
  source: nwn-lern
- id: a1.m01.v.auch
  de: auch
  pos: adverb
  vi: cũng
  ipa: /aʊ̯x/
  example:
    de: Ich heiße auch Anna.
    vi: Tôi cũng tên là Anna.
  usage_vi: au đọc gần "ao"; ch sau a, o, u, au đọc là [x] – giống "kh" trong tiếng Việt.
  lesson_refs:
  - a1.m01.l01
  source: nwn-lern
- id: a1.m01.v.und
  de: und
  pos: conjunction
  vi: và; còn
  ipa: /ʊnt/
  example:
    de: Gut, und dir?
    vi: Khỏe, còn bạn?
  usage_vi: d ở cuối từ đọc thành [t].
  lesson_refs:
  - a1.m01.l01
  source: nwn-lern
- id: a1.m01.v.oder
  de: oder
  pos: conjunction
  vi: hay, hoặc
  ipa: /ˈoːdɐ/
  example:
    de: Anna oder Julia?
    vi: Anna hay Julia?
  usage_vi: Đuôi -er đọc là [ɐ], không đọc "ơ" có âm r.
  lesson_refs:
  - a1.m01.l01
  source: nwn-lern
- id: a1.m01.v.wie-geht-s
  de: Wie geht's?
  pos: phrase
  vi: Bạn khỏe không?
  ipa: /viː ˈɡeːts/
  example:
    de: Hallo, Paul! Wie geht's?
    vi: Chào Paul! Khỏe không?
  usage_vi: 'Thân mật. Dạng đầy đủ: "Wie geht es dir?". Dạng trang trọng (bài 2): "Wie geht es Ihnen?".'
  lesson_refs:
  - a1.m01.l01
  tags:
  - befinden
  - informell
  source: nwn
- id: a1.m01.v.und-dir
  de: Und dir?
  pos: phrase
  vi: Còn bạn thì sao?
  ipa: /ʊnt ˈdiːɐ̯/
  example:
    de: Gut, danke. Und dir?
    vi: Khỏe, cảm ơn. Còn bạn?
  usage_vi: 'Chỉ dùng khi xưng "du". Với "Sie": "Und Ihnen?".'
  lesson_refs:
  - a1.m01.l01
  tags:
  - befinden
  - informell
  source: nwn
- id: a1.m01.v.es-geht
  de: Es geht.
  pos: phrase
  vi: Tạm được.
  ipa: /ɛs ˈɡeːt/
  example:
    de: – Wie geht's? – Es geht.
    vi: – Khỏe không? – Tạm được.
  usage_vi: Câu trả lời trung tính, hơi kém hơn "gut".
  lesson_refs:
  - a1.m01.l01
  tags:
  - befinden
  source: supplement
- id: a1.m01.v.nicht-so-gut
  de: Nicht so gut.
  pos: phrase
  vi: Không khỏe lắm.
  ipa: /nɪçt zoː ˈɡuːt/
  example:
    de: – Wie geht's? – Nicht so gut.
    vi: – Khỏe không? – Không khỏe lắm.
  usage_vi: 'Học nguyên cụm. Người nghe thường hỏi tiếp: "Oh, was ist los?" (Ồ, có chuyện gì vậy?).'
  lesson_refs:
  - a1.m01.l01
  tags:
  - befinden
  source: supplement
- id: a1.m01.v.freut-mich
  de: Freut mich!
  pos: phrase
  vi: Rất vui được gặp bạn!
  ipa: /ˈfʁɔʏ̯t mɪç/
  example:
    de: – Das ist Mai. – Freut mich!
    vi: – Đây là Mai. – Rất vui được gặp bạn!
  usage_vi: Nói khi được giới thiệu với ai đó. eu đọc là [ɔʏ̯] – gần "oi".
  lesson_refs:
  - a1.m01.l01
  tags:
  - vorstellen
  source: supplement
- id: a1.m01.v.bis-bald
  de: bis bald
  pos: phrase
  vi: hẹn sớm gặp lại
  ipa: /bɪs ˈbalt/
  example:
    de: Tschüs, bis bald!
    vi: Tạm biệt, hẹn sớm gặp lại!
  usage_vi: Thân mật, dùng khi chia tay người quen.
  lesson_refs:
  - a1.m01.l01
  tags:
  - verabschiedung
  - informell
  source: nwn
- id: a1.m01.v.ciao
  de: ciao
  pos: interjection
  vi: chào (khi gặp và khi chia tay)
  ipa: /tʃaʊ̯/
  example:
    de: Ciao, Lisa!
    vi: Chào Lisa!
  usage_vi: Mượn từ tiếng Ý, rất thân mật. Đọc là "chao".
  lesson_refs:
  - a1.m01.l01
  tags:
  - begruessung
  - verabschiedung
  - informell
  source: nwn
- id: a1.m01.v.guten-morgen
  de: Guten Morgen!
  pos: phrase
  vi: Chào buổi sáng!
  ipa: /ˈɡuːtn̩ ˈmɔʁɡn̩/
  example:
    de: Guten Morgen, Herr Weber!
    vi: Chào buổi sáng, ông Weber!
  usage_vi: Dùng từ sáng sớm đến khoảng 10–11 giờ.
  lesson_refs:
  - a1.m01.l02
  tags:
  - begruessung
  - tageszeit
  source: nwn
- id: a1.m01.v.guten-tag
  de: Guten Tag!
  pos: phrase
  vi: Xin chào! (ban ngày, trang trọng)
  ipa: /ˈɡuːtn̩ ˈtaːk/
  example:
    de: Guten Tag, Frau Schmidt!
    vi: Xin chào bà Schmidt!
  usage_vi: Dùng khoảng từ 10 giờ đến chiều tối. Văn nói hay rút gọn thành "Tag!". g cuối đọc là [k].
  lesson_refs:
  - a1.m01.l02
  tags:
  - begruessung
  - tageszeit
  - formell
  source: nwn
- id: a1.m01.v.guten-abend
  de: Guten Abend!
  pos: phrase
  vi: Chào buổi tối!
  ipa: /ˈɡuːtn̩ ˈaːbn̩t/
  example:
    de: Guten Abend! Wie geht es Ihnen?
    vi: Chào buổi tối! Ông/Bà có khỏe không?
  usage_vi: Dùng khi GẶP nhau, khoảng từ 18 giờ.
  lesson_refs:
  - a1.m01.l02
  tags:
  - begruessung
  - tageszeit
  source: nwn
- id: a1.m01.v.gute-nacht
  de: Gute Nacht!
  pos: phrase
  vi: Chúc ngủ ngon!
  ipa: /ˈɡuːtə ˈnaxt/
  example:
    de: Gute Nacht, Mama!
    vi: Chúc mẹ ngủ ngon!
  usage_vi: Chỉ dùng khi CHIA TAY buổi tối muộn hoặc trước khi đi ngủ, KHÔNG dùng để chào khi gặp.
  lesson_refs:
  - a1.m01.l02
  tags:
  - verabschiedung
  - tageszeit
  source: nwn
- id: a1.m01.v.auf-wiedersehen
  de: Auf Wiedersehen!
  pos: phrase
  vi: Tạm biệt! (trang trọng)
  ipa: /aʊ̯f ˈviːdɐˌzeːən/
  example:
    de: Auf Wiedersehen, Herr Klein!
    vi: Tạm biệt ông Klein!
  usage_vi: 'Trang trọng, dùng với người dùng "Sie". Nghĩa đen: hẹn gặp lại.'
  lesson_refs:
  - a1.m01.l02
  tags:
  - verabschiedung
  - formell
  source: nwn-lern
- id: a1.m01.v.sie
  de: Sie
  pos: pronoun
  vi: ông, bà, anh, chị… (xưng hô trang trọng)
  ipa: /ziː/
  example:
    de: Wie heißen Sie?
    vi: Ông/Bà tên là gì?
  usage_vi: 'Luôn VIẾT HOA chữ S, kể cả giữa câu. Dùng với người lạ, người lớn tuổi, trong công việc. Động từ đi với Sie giống dạng nguyên mẫu: Sie heißen, Sie kommen (riêng sein: Sie sind).'
  lesson_refs:
  - a1.m01.l02
  tags:
  - personalpronomen
  - formell
  source: nwn-lern
- id: a1.m01.v.wie-geht-es-ihnen
  de: Wie geht es Ihnen?
  pos: phrase
  vi: Ông/Bà… có khỏe không?
  ipa: /viː ˈɡeːt ɛs ˈiːnən/
  example:
    de: Guten Tag, Frau Lang! Wie geht es Ihnen?
    vi: Chào bà Lang! Bà có khỏe không?
  usage_vi: 'Trang trọng. Trả lời: "Danke, gut. Und Ihnen?".'
  lesson_refs:
  - a1.m01.l02
  tags:
  - befinden
  - formell
  source: nwn
- id: a1.m01.v.frau
  de: Frau
  pos: noun
  article: die
  plural: Frauen
  vi: bà, cô (+ họ); người phụ nữ; vợ
  ipa: /fʁaʊ̯/
  example:
    de: Guten Tag, Frau Weber!
    vi: Xin chào bà Weber!
  usage_vi: Từ nhiều nghĩa. "Frau + HỌ" là cách gọi trang trọng cho mọi phụ nữ trưởng thành (không dùng "Fräulein" nữa). Không nói "Frau + tên riêng".
  lesson_refs:
  - a1.m01.l02
  tags:
  - person
  - formell
  - mehrdeutig
  source: nwn-lern
- id: a1.m01.v.herr
  de: Herr
  pos: noun
  article: der
  plural: Herren
  vi: ông (+ họ); quý ông
  ipa: /hɛʁ/
  example:
    de: Guten Abend, Herr Schmidt!
    vi: Chào buổi tối ông Schmidt!
  usage_vi: '"Herr + HỌ" là cách gọi trang trọng. Số nhiều bất quy tắc: die Herren.'
  lesson_refs:
  - a1.m01.l02
  tags:
  - person
  - formell
  source: nwn-lern
- id: a1.m01.v.vorname
  de: Vorname
  pos: noun
  article: der
  plural: Vornamen
  vi: tên (tên gọi)
  ipa: /ˈfoːɐ̯ˌnaːmə/
  example:
    de: Mein Vorname ist Linh.
    vi: Tên tôi là Linh.
  usage_vi: 'Người Đức viết tên trước, họ sau. Khi điền form: Vorname = Linh (có thể ghi cả tên đệm: Thi Linh), Nachname = Nguyen.'
  lesson_refs:
  - a1.m01.l02
  tags:
  - person
  - formular
  source: nwn-lern
- id: a1.m01.v.nachname
  de: Nachname
  pos: noun
  article: der
  plural: Nachnamen
  vi: họ
  ipa: /ˈnaːxˌnaːmə/
  example:
    de: Mein Nachname ist Nguyen.
    vi: Họ của tôi là Nguyễn.
  usage_vi: Trong tình huống trang trọng, người Đức gọi nhau bằng Herr/Frau + Nachname.
  lesson_refs:
  - a1.m01.l02
  tags:
  - person
  - formular
  source: nwn
- id: a1.m01.v.mein
  de: mein
  pos: pronoun
  vi: của tôi
  ipa: /maɪ̯n/
  example:
    de: Mein Name ist Hoa.
    vi: Tên tôi là Hoa.
  usage_vi: Ở Kapitel 1 chỉ cần dùng "Mein Name ist…", "Mein Vorname ist…". Quy tắc đầy đủ của mạo từ sở hữu học ở Kapitel 5.
  lesson_refs:
  - a1.m01.l02
  tags:
  - possessiv
  source: nwn-lern
- id: a1.m01.v.formell
  de: formell
  pos: adjective
  vi: trang trọng
  ipa: /fɔʁˈmɛl/
  example:
    de: '"Guten Tag" ist formell.'
    vi: '"Guten Tag" là cách chào trang trọng.'
  usage_vi: Từ dùng trong đề bài và giải thích ngữ pháp.
  lesson_refs:
  - a1.m01.l02
  tags:
  - sprache-lernen
  source: nwn
- id: a1.m01.v.informell
  de: informell
  pos: adjective
  vi: thân mật, không trang trọng
  ipa: /ˈɪnfɔʁmɛl/
  example:
    de: '"Hallo" ist informell.'
    vi: '"Hallo" là cách chào thân mật.'
  usage_vi: Từ dùng trong đề bài và giải thích ngữ pháp.
  lesson_refs:
  - a1.m01.l02
  tags:
  - sprache-lernen
  source: nwn
- id: a1.m01.v.morgen
  de: Morgen
  pos: noun
  article: der
  plural: Morgen
  vi: buổi sáng
  ipa: /ˈmɔʁɡn̩/
  example:
    de: Der Morgen ist schön.
    vi: Buổi sáng thật đẹp.
  usage_vi: 'Số nhiều giống số ít: die Morgen. Lưu ý: "morgen" viết thường nghĩa là "ngày mai" (học sau).'
  lesson_refs:
  - a1.m01.l02
  tags:
  - tageszeit
  - mehrdeutig
  source: supplement
- id: a1.m01.v.tag
  de: Tag
  pos: noun
  article: der
  plural: Tage
  vi: ngày; ban ngày
  ipa: /taːk/
  example:
    de: Guten Tag!
    vi: 'Xin chào! (nghĩa đen: ngày tốt lành)'
  usage_vi: 'g cuối đọc [k], số nhiều die Tage đọc lại [ɡ]: [ˈtaːɡə].'
  lesson_refs:
  - a1.m01.l02
  tags:
  - tageszeit
  source: supplement
- id: a1.m01.v.abend
  de: Abend
  pos: noun
  article: der
  plural: Abende
  vi: buổi tối
  ipa: /ˈaːbn̩t/
  example:
    de: Guten Abend!
    vi: Chào buổi tối!
  usage_vi: d cuối đọc [t].
  lesson_refs:
  - a1.m01.l02
  tags:
  - tageszeit
  source: supplement
- id: a1.m01.v.nacht
  de: Nacht
  pos: noun
  article: die
  plural: Nächte
  vi: ban đêm
  ipa: /naxt/
  example:
    de: Gute Nacht!
    vi: 'Chúc ngủ ngon! (nghĩa đen: đêm tốt lành)'
