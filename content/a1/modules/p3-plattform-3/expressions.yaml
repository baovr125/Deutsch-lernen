  - { id: a1.p3.x.zimmer-einrichten, de: "Wo soll der Schrank stehen?", vi: "Cái tủ nên đặt ở đâu?", register: neutral, function: "Hỏi vị trí đặt đồ", situation_vi: "Khi cùng người khác sắp xếp phòng.", reply: { de: "Neben dem Bett, an der Wand.", vi: "Cạnh giường, sát tường." }, lesson_refs: [a1.p3.l01] }
