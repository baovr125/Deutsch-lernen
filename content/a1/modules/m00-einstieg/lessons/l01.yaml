summary_vi: 'Tiếng Đức có 26 chữ cái Latinh cộng với ä, ö, ü và ß. Chú ý tên các chữ dễ nhầm: E [eː], I [iː], J [jɔt], V [faʊ̯], W [veː], Z [tsɛt]. Umlaut có thể làm đổi nghĩa (schon ≠ schön). Khi không có bàn phím Đức: ae, oe, ue, ss.'
self_check:
- Tôi đọc được cả bảng chữ cái tiếng Đức.
- Tôi phân biệt được V và W, E và I khi nghe.
- Tôi đọc được ä, ö, ü và biết ß đọc như s.
- Tôi viết được Müller thành Mueller khi cần.
blocks:
- id: a1.m00.l01.b1
  kind: explanation
  title_vi: Giới thiệu bài học
  body_vi: '**Chào mừng bạn đến với tiếng Đức!**


    Tin vui đầu tiên: tiếng Đức dùng **bảng chữ cái Latinh** giống tiếng Việt và tiếng Anh, nên bạn đã biết viết gần hết các chữ.

    Khác biệt nằm ở **cách gọi tên chữ cái** và **bốn chữ đặc biệt**: **ä, ö, ü** (gọi là *Umlaut*) và **ß** (gọi là *Eszett*).


    **Cách học bài này:**

    1. Nghe và nhắc lại tên từng chữ cái (phần Phát âm).

    2. Chú ý những chữ người Việt hay đọc nhầm – được đánh dấu trong bài.

    3. Làm bài tập nghe và đánh vần.


    Trong mọi bài học, bạn sẽ thấy **phiên âm IPA** trong ngoặc vuông, ví dụ *[aː]*. Dấu **ː** nghĩa là nguyên âm **dài**.

    Bạn sẽ học cách đọc IPA kỹ hơn ở bài 2.'
- id: a1.m00.l01.b2
  kind: explanation
  title_vi: Khi không có bàn phím tiếng Đức
  skill: grammar
  body_vi: 'Nếu không gõ được ä, ö, ü, ß, hãy viết ae, oe, ue, ss. Cách viết này được chấp nhận rộng rãi (ví dụ trong địa chỉ email, tên đăng nhập). Lưu ý: ở Thụy Sĩ người ta không dùng ß mà luôn viết ss.'
  examples:
  - de: Müller → Mueller
    vi: họ Müller
  - de: Österreich → Oesterreich
    vi: nước Áo
  - de: Straße → Strasse
    vi: đường phố
- id: a1.m00.l01.b3
  kind: pronunciation
  title_vi: Tên 26 chữ cái
  skill: pronunciation
  body_vi: 'Tên 26 chữ cái


    Nghe và nhắc lại theo nhóm. Những chữ có dấu ⚠ là chữ người Việt hay đọc nhầm (do quen đọc theo tiếng Anh hoặc tiếng Việt):

    A [aː] · B [beː] · C [tseː] ⚠ · D [deː] · E [eː] ⚠ · F [ɛf] · G [ɡeː] ⚠ · H [haː] · I [iː] ⚠ · J [jɔt] ⚠ · K [kaː] · L [ɛl] · M [ɛm]

    N [ɛn] · O [oː] · P [peː] · Q [kuː] · R [ɛʁ] ⚠ · S [ɛs] · T [teː] · U [uː] · V [faʊ̯] ⚠ · W [veː] ⚠ · X [ɪks] · Y [ˈʏpsilɔn] ⚠ · Z [tsɛt] ⚠


    - **E** đọc là "ê" [eː] – không đọc "i" như tiếng Anh.

    - **I** đọc là "i" [iː] – không đọc "ai".

    - **G** đọc "ghê" [ɡeː]; **J** đọc "giót" [jɔt] (âm đầu như "d" giọng miền Nam).

    - **V** đọc "phao" [faʊ̯]; **W** đọc "vê" [veː]. Đây là cặp dễ nhầm nhất!

    - **Z** đọc "tset" [tsɛt]; **C** đọc "tsê" [tseː].

    - **R** đọc "e" + âm r phát ra ở cuống họng [ɛʁ].



    Luyện tập: Đọc to cả bảng chữ cái 3 lần. Lần 3, tự ghi âm và so sánh với audio mẫu.'
  items:
  - de: A, B, C
    vi: a, bê, tsê
    ipa: '[aː] [beː] [tseː]'
  - de: V, W
    vi: phao, vê
    ipa: '[faʊ̯] [veː]'
  - de: J, Y, Z
    vi: giót, uýp-xi-lon, tset
    ipa: '[jɔt] [ˈʏpsilɔn] [tsɛt]'
- id: a1.m00.l01.b4
  kind: pronunciation
  title_vi: Ä, Ö, Ü và ß
  skill: pronunciation
  body_vi: 'Ä, Ö, Ü và ß


    - **ä** [ɛ] hoặc [ɛː]: gần giống **"e"** tiếng Việt (như trong "em").

    - **ö** [ø] hoặc [œ]: miệng đặt như đọc **"ê"**, rồi **tròn môi** như đọc "ô". Không có trong tiếng Việt.

    - **ü** [y] hoặc [ʏ]: miệng đặt như đọc **"i"**, rồi **tròn môi** như đọc "u". Không có trong tiếng Việt.

    - **ß** [s]: đọc như **s** (không rung). Tên chữ: *Eszett* [ɛsˈtsɛt].

    Mẹo tập ö/ü: nói "iiii" kéo dài, giữ nguyên lưỡi, từ từ chu môi tròn lại → bạn sẽ nghe ra "üüüü".



    Luyện tập: Tập trước gương: đọc i → ü, ê → ö. Môi phải tròn rõ ràng.'
  items:
  - de: schon – schön
    vi: đã, rồi – đẹp
    ipa: '[ʃoːn] – [ʃøːn]'
    note_vi: Chỉ khác Umlaut nhưng khác nghĩa.
  - de: Tür
    vi: cửa
    ipa: '[tyːɐ̯]'
  - de: Käse
    vi: phô mai
    ipa: '[ˈkɛːzə]'
  - de: heißen
    vi: tên là
    ipa: '[ˈhaɪ̯sn̩]'
