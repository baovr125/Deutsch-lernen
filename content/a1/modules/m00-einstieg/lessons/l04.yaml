exercise_set_ref: a1.m00.l04.ex
summary_vi: 'Câu sống còn: Hallo, Tschüs, Danke, Bitte, Ja, Nein, Entschuldigung, Wie bitte?, Ich verstehe nicht. Đáp lại Danke bằng Bitte. Câu tiếng Đức: danh từ viết hoa và có giống; động từ chia theo người và đứng ở vị trí 2; xưng hô du/Sie.'
self_check:
- Tôi chào, cảm ơn và tạm biệt được bằng tiếng Đức.
- Tôi biết nói gì khi không nghe rõ hoặc không hiểu.
- Tôi giải thích được vì sao phải học danh từ cùng mạo từ.
blocks:
- id: a1.m00.l04.b1
  kind: explanation
  title_vi: Giới thiệu bài học
  body_vi: 'Với **9 từ và câu** trong bài này, bạn đã có thể xử lý những tình huống đơn giản nhất: chào, cảm ơn, xin lỗi,

    đồng ý/từ chối và báo cho người khác biết bạn chưa hiểu.


    Phần thứ hai của bài giới thiệu **5 đặc điểm cơ bản của câu tiếng Đức** (xem chủ điểm ngữ pháp

    *Những điều cơ bản về câu tiếng Đức*). Bạn chưa cần dùng thành thạo – chỉ cần nhận ra chúng

    khi gặp trong Kapitel 1.'
- id: a1.m00.l04.b2
  kind: pronunciation
  title_vi: Âm khó trong các từ sống còn
  skill: pronunciation
  body_vi: 'Âm khó trong các từ sống còn


    tschüs: tsch [tʃ] + ü dài [yː] – tròn môi. ja: j đọc [j], không đọc “gi-a”. nein: ei = [aɪ̯]. danke/bitte: đuôi -e [ə] nhẹ nhưng không bỏ. Entschuldigung: nhấn SCHUL.


    Luyện tập: Đọc 5 lần: Hallo – Danke – Bitte – Tschüs. Rồi đọc Entschuldigung thật chậm theo âm tiết: ent-SCHUL-di-gung.'
  items:
  - de: tschüs
    vi: tạm biệt
    ipa: '[tʃyːs]'
  - de: ja
    vi: vâng
    ipa: '[jaː]'
  - de: Entschuldigung
    vi: xin lỗi
    ipa: '[ɛntˈʃʊldɪɡʊŋ]'
- id: a1.m00.l04.b3
  kind: examples
  title_vi: Câu ví dụ
  examples:
  - de: Hallo, Anna!
    vi: Chào Anna!
  - de: Danke! – Bitte!
    vi: Cảm ơn! – Không có gì!
  - de: Ja, richtig!
    vi: Vâng, đúng rồi!
  - de: Nein, das ist falsch.
    vi: Không, cái đó sai.
  - de: Entschuldigung, ich verstehe nicht.
    vi: Xin lỗi, tôi không hiểu.
  - de: Ich bin Lan.
    vi: Tôi là Lan.
    note_vi: 'Ví dụ cho đặc điểm 3 và 4: động từ chia (bin) đứng ở vị trí 2.'
