- id: a1.m00.l02.b12
  kind: speaking
  title_vi: Gọi món ở quán cà phê
  skill: speaking
  task_vi: Đọc to thực đơn ở phần Đọc, sau đó gọi 2 món bằng mẫu “Ein …, bitte!” / “Eine Pizza, bitte!”.
  steps_vi:
  - Đọc to từng dòng thực đơn, chú ý z = [ts] trong Pizza và s = [z] trong Musik.
  - Gọi một đồ uống và một đồ ăn.
  - 'Ghi âm và nghe lại: bạn có bật rõ âm cuối không?'
  lines:
  - speaker: Gast
    de: Ein Tee, bitte! Und eine Pizza Margherita, bitte!
    vi: Cho tôi một tách trà! Và một pizza Margherita!
- id: a1.m00.l02.b13
  kind: writing
  title_vi: Sổ từ đầu tiên
  skill: writing
  task_vi: 'Viết 5 từ quốc tế đã học vào sổ từ theo đúng mẫu: mạo từ + danh từ – số nhiều.'
  model:
    de: 'das Hotel – die Hotels

      der Kaffee – die Kaffees

      die Pizza – die Pizzas'
    vi: khách sạn – những khách sạn; cà phê – những ly cà phê; pizza – những cái pizza
  checklist_vi:
  - Mỗi danh từ có mạo từ.
  - Danh từ viết hoa.
  - Có ghi dạng số nhiều (hoặc ghi “—” nếu không có).
