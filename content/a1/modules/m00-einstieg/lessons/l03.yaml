    vi: Đó có phải là khách sạn không?
  - speaker: Sprecherin
    de: Wo ist das Hotel?
    vi: Khách sạn ở đâu?
  audio_status: pending-tts
  situation_vi: Nghe ba câu và chú ý phần cuối câu.
  skill: listening
  audio:
    speed: slow
- id: a1.m00.l03.b8
  kind: reading
  title_vi: Đề bài tiếng Đức
  paragraphs:
  - de: '1. Hören Sie.

      2. Lesen Sie den Text.

      3. Hören Sie und sprechen Sie nach.

      4. Schreiben Sie die Wörter.

      5. Richtig oder falsch? Kreuzen Sie an.'
    vi: '1. Hãy nghe.

      2. Hãy đọc bài đọc.

      3. Hãy nghe và nhắc lại.

      4. Hãy viết các từ.

      5. Đúng hay sai? Hãy đánh dấu (x).'
  text_type_vi: Yêu cầu bài tập
  skill: reading
  glossary:
  - de: der Text
    vi: bài đọc, văn bản
  - de: die Wörter
    vi: các từ (số nhiều của das Wort)
  - de: an|kreuzen
    vi: đánh dấu x
- id: a1.m00.l03.b9
  kind: speaking
  title_vi: Đọc với trọng âm và ngữ điệu
  skill: speaking
  task_vi: Đọc to 5 từ và 3 câu, chú ý âm tiết nhấn và ngữ điệu cuối câu.
  steps_vi:
  - 'Đọc: Hotel – Taxi – Musik – Internet – richtig.'
  - 'Đọc: Das ist ein Taxi. ↘ / Ist das ein Taxi? ↗ / Wie heißt du? ↘'
  - Ghi âm, nghe lại và so sánh với audio mẫu.
  lines:
  - speaker: Sprecher
    de: Ho-TEL, TA-xi, Mu-SIK, IN-ter-net, RICH-tig.
    vi: (chữ in hoa = âm tiết nhấn)
- id: a1.m00.l03.b10
  kind: writing
  title_vi: Chép đề bài
  skill: writing
  task_vi: Chép lại chính xác 3 yêu cầu đề bài và viết nghĩa tiếng Việt bên cạnh.
  model:
    de: Hören Sie. – Lesen Sie. – Sprechen Sie nach.
    vi: Hãy nghe. – Hãy đọc. – Hãy nhắc lại.
  checklist_vi:
  - Viết hoa chữ đầu câu và chữ Sie.
  - Có dấu chấm cuối câu.
