summary_vi: 'Mỗi từ tiếng Đức có một âm tiết nhấn – thường là âm tiết đầu (trừ nhiều từ vay mượn, động từ -ieren, tiền tố be-/ver-/ent-). Câu kể và câu hỏi W- xuống giọng; câu hỏi có/không lên giọng. Đề bài thường có dạng: Hören Sie. Lesen Sie. Sprechen Sie nach.'
self_check:
- Tôi nói được âm tiết nhấn của Hotel, Taxi, Musik.
- Tôi biết câu hỏi W- xuống giọng ở cuối.
- 'Tôi hiểu các yêu cầu: Hören Sie, Lesen Sie, Schreiben Sie, Sprechen Sie nach, Richtig oder falsch.'
blocks:
- id: a1.m00.l03.b1
  kind: explanation
  title_vi: Giới thiệu bài học
  body_vi: 'Tiếng Việt là ngôn ngữ **thanh điệu**: mỗi chữ có dấu thanh riêng và các chữ được đọc gần như **dài bằng nhau**.

    Tiếng Đức thì khác:

    - **Không có thanh điệu** cho từng chữ.

    - Trong mỗi từ có **một âm tiết được nhấn** (to hơn, dài hơn, rõ hơn), các âm tiết còn lại đọc **nhẹ và lướt**.

    - Cả câu có **ngữ điệu**: giọng đi lên hoặc đi xuống ở cuối câu.


    Nếu bạn đọc mọi âm tiết đều nhau như tiếng Việt, người Đức sẽ khó hiểu dù bạn phát âm từng âm đúng.


    Bài này cũng dạy bạn **các yêu cầu tiếng Đức thường gặp trong bài tập** (*Hören Sie. Lesen Sie. Sprechen Sie nach.*),

    để bạn quen với chúng ngay từ đầu.'
- id: a1.m00.l03.b2
  kind: explanation
  title_vi: 'Câu yêu cầu trong đề bài: động từ + Sie'
  skill: grammar
  body_vi: 'Đề bài tiếng Đức thường có dạng ĐỘNG TỪ + Sie (lịch sự): Hören Sie. = Hãy nghe. Đây là thể mệnh lệnh trang trọng, sẽ học kỹ ở Kapitel 3. Bây giờ chỉ cần học thuộc như cụm từ.'
  examples:
  - de: Hören Sie.
    vi: Hãy nghe.
  - de: Lesen Sie.
    vi: Hãy đọc.
  - de: Hören Sie und sprechen Sie nach.
    vi: Hãy nghe và nhắc lại.
- id: a1.m00.l03.b3
  kind: pronunciation
  title_vi: Trọng âm từ (Wortakzent)
  skill: pronunciation
  body_vi: 'Trọng âm từ (Wortakzent)


    **Quy tắc chung:** từ gốc Đức thường nhấn **âm tiết đầu**: *HÖ-ren, LE-sen, SCHREI-ben, RICH-tig, DAN-ke*.


    **Ngoại lệ thường gặp ở A1:**

    - Nhiều **từ vay mượn** nhấn ở **cuối**: *Ho-TEL, Mu-SIK, Al-pha-BET*.

    - Động từ tận cùng **-ieren** nhấn vào **ie**: *buch-sta-BIE-ren*.

    - Từ có tiền tố **be-, ver-, ent-** không nhấn tiền tố: *ver-STE-hen, Ent-SCHUL-di-gung*.


    Trong sổ từ, IPA có dấu **ˈ** đứng trước âm tiết được nhấn: *Musik* [muˈziːk].



    Luyện tập: Đọc từng từ, vỗ tay mạnh ở âm tiết nhấn và vỗ nhẹ ở âm tiết còn lại.'
  items:
  - de: Hotel
    vi: khách sạn
    ipa: '[hoˈtɛl]'
  - de: Taxi
    vi: taxi
    ipa: '[ˈtaksi]'
  - de: richtig
    vi: đúng
    ipa: '[ˈʁɪçtɪç]'
  - de: Musik
    vi: âm nhạc
    ipa: '[muˈziːk]'
- id: a1.m00.l03.b4
  kind: pronunciation
  title_vi: Ngữ điệu câu (Satzmelodie)
  skill: pronunciation
  body_vi: 'Ngữ điệu câu (Satzmelodie)


    - **Câu kể** → giọng **đi xuống** ở cuối (↘): *Das ist ein Taxi.* ↘

    - **Câu hỏi W-** (wie, wo, wer…) → giọng **đi xuống** (↘): *Wie heißt du?* ↘

    - **Câu hỏi có/không** (động từ đứng đầu) → giọng **đi lên** (↗): *Ist das ein Taxi?* ↗


    Người Việt hay lên giọng ở mọi câu hỏi. Nhớ: câu hỏi W- của tiếng Đức hạ giọng!



    Luyện tập: Đọc ba câu trên, dùng tay vẽ mũi tên lên/xuống trong không khí khi đọc phần cuối câu.'
  items:
  - de: Das ist ein Taxi. ↘
    vi: Đó là một chiếc taxi.
  - de: Ist das ein Taxi? ↗
    vi: Đó có phải là taxi không?
  - de: Wie heißt du? ↘
    vi: Bạn tên là gì?
- id: a1.m00.l03.b5
  kind: pronunciation
  title_vi: 'Nhịp: âm tiết mạnh – âm tiết yếu'
  skill: pronunciation
  body_vi: 'Nhịp: âm tiết mạnh – âm tiết yếu


    Các âm tiết không nhấn, đặc biệt đuôi -e [ə] và -en, được đọc rất nhẹ và nhanh: lesen [ˈleːzn̩] gần như chỉ còn “LÊ-zn”. Ngược lại, âm tiết nhấn được kéo dài và đọc rõ.


    Luyện tập: Đọc “lesen – schreiben – hören” thật nhanh như nhịp trống: MẠNH-nhẹ, MẠNH-nhẹ.'
  items:
  - de: lesen
    vi: đọc
    ipa: '[ˈleːzn̩]'
  - de: schreiben
    vi: viết
    ipa: '[ˈʃʁaɪ̯bn̩]'
- id: a1.m00.l03.b6
  kind: examples
  title_vi: Câu ví dụ
  examples:
  - de: Hören Sie, bitte.
    vi: Xin hãy nghe.
  - de: Lesen Sie, bitte.
    vi: Xin hãy đọc.
  - de: Ich schreibe.
    vi: Tôi viết.
  - de: Richtig oder falsch?
    vi: Đúng hay sai?
  - de: Das ist falsch.
    vi: Cái đó sai.
