title_de: Einstieg
title_vi: 'Nhập môn: chữ cái, phát âm và những câu đầu tiên'
summary_vi: 'Bốn bài ngắn giúp bạn làm quen với tiếng Đức trước Kapitel 1: bảng chữ cái và chữ đặc biệt (ä, ö, ü, ß); cách đọc nguyên âm, phụ âm và ký hiệu phiên âm IPA; trọng âm và ngữ điệu; những câu giao tiếp đầu tiên và 5 đặc điểm cơ bản của câu tiếng Đức.'
