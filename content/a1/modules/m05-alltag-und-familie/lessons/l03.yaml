summary_vi: Bài học giúp bạn gọi tên chuẩn xác các thành viên trong gia đình, sử dụng nhuần nhuyễn các mạo từ sở hữu (mein, dein, sein, ihr, unser, euer, Ihr) ở cả Nominativ và Akkusativ (meinen Bruder) và tự tin chia sẻ về tổ ấm của mình.
self_check:
- 'Tôi nhớ chia đuôi mạo từ sở hữu: giống đực/trung không đuôi, giống cái/số nhiều thêm đuôi -e.'
- 'Tôi nhớ ở Akkusativ chỉ giống đực đổi thành -en: meinen Vater, meinen Bruder.'
- Tôi biết giới thiệu tên, tuổi và nghề nghiệp của người thân trong gia đình.
blocks:
- id: a1.m05.l03.b1
  kind: explanation
  title_vi: Giới thiệu bài học
  body_vi: 'Gia đình luôn là chủ đề trò chuyện ấm áp và gần gũi nhất trong mọi ngôn ngữ.

    Trong bài học này, bạn sẽ:

    - Khám phá từ vựng về cây phả hệ gia đình: *der Vater, die Mutter, die Eltern, der Sohn, die Tochter, die Kinder, der Bruder, die Schwester, die Geschwister, der Opa, die Oma, das Baby...*

    - Học cách nói về quyền sở hữu: "của tôi" (*mein/meine*), "của bạn" (*dein/deine*), "của anh ấy" (*sein/seine*), "của cô ấy" (*ihr/ihre*), "của chúng tôi" (*unser/unsere*), "của các bạn" (*euer/eure*).

    - Nắm vững quy tắc biến đổi mạo từ sở hữu ở cách Akkusativ: chỉ có giống đực thêm đuôi -en (*Ich besuche meinen Bruder*).

    - Tự hào giới thiệu bức ảnh gia đình và thú cưng yêu quý của bạn bằng tiếng Đức.'
- id: a1.m05.l03.b2
  kind: explanation
  title_vi: Danh từ chỉ dùng ở số nhiều (Pluralwörter) trong gia đình
  skill: grammar
  body_vi: 'Các danh từ như die Eltern (bố mẹ), die Großeltern (ông bà), die Geschwister (anh chị em ruột) chỉ có hình thức số nhiều. Động từ đi kèm luôn chia ở số nhiều (wohnen, sind, leben) và mạo từ sở hữu luôn có đuôi -e: meine Eltern, deine Geschwister.'
  examples:
  - de: Meine Eltern leben in Vietnam.
    vi: Bố mẹ tôi sống ở Việt Nam.
  - de: Hast du Geschwister? – Ja, zwei Brüder.
    vi: Bạn có anh chị em không? – Có, hai người anh trai.
- id: a1.m05.l03.b3
  kind: pronunciation
  title_vi: Biến âm Umlaut khi chuyển sang số nhiều
  skill: pronunciation
  body_vi: 'Biến âm Umlaut khi chuyển sang số nhiều


    Nhiều danh từ gia đình đổi nguyên âm sang biến âm khi sang số nhiều: der Vater → die Väter [ˈfɛːtɐ], die Mutter → die Mütter [ˈmʏtɐ], der Bruder → die Brüder [ˈbʁyːdɐ], die Tochter → die Töchter [ˈtɔxtɐ].


    Luyện tập: Luyện phát âm theo cặp: Vater – Väter, Mutter – Mütter, Bruder – Brüder.'
  items:
  - de: der Vater – die Väter
    vi: người cha – các người cha
    ipa: '[ˈfaːtɐ] – [ˈfɛːtɐ]'
  - de: die Mutter – die Mütter
    vi: người mẹ – các người mẹ
    ipa: '[ˈmʊtɐ] – [ˈmʏtɐ]'
  - de: die Tochter – die Töchter
    vi: con gái – các con gái
    ipa: '[ˈtɔxtɐ] – [ˈtɔxtɐ]'
- id: a1.m05.l03.b4
  kind: examples
  title_vi: Câu ví dụ
  examples:
  - de: Mein Vater ist Arzt und meine Mutter ist Lehrerin.
    vi: Bố tôi là bác sĩ và mẹ tôi là giáo viên.
  - de: 'Ich habe zwei Geschwister: einen Bruder und eine Schwester.'
    vi: 'Tôi có hai người anh chị em: một anh trai và một em gái.'
  - de: Wie heißt eure Katze? – Unsere Katze heißt Mimi.
    vi: Con mèo của các bạn tên là gì? – Con mèo của tụi mình tên là Mimi.
  - de: Herr Weber ruft seinen Sohn an.
    vi: Ông Weber gọi điện cho con trai của mình.
  - de: Meine Großeltern sind schon über achtzig Jahre alt.
    vi: Ông bà tôi đã ngoài 80 tuổi rồi.
- id: a1.m05.l03.b5
  kind: listening
  title_vi: Xem ảnh gia đình và giới thiệu người thân
  lines:
  - speaker: Jan
    de: Laura, ist das deine Familie auf dem Foto?
    vi: Laura, đây là gia đình bạn trong ảnh phải không?
  - speaker: Laura
    de: 'Ja, genau! Das hier sind meine Eltern: mein Vater Michael und meine Mutter Sabine.'
    vi: 'Đúng rồi! Đây là bố mẹ mình: bố Michael và mẹ Sabine.'
  - speaker: Jan
    de: Und wer ist das kleine Mädchen?
    vi: Còn cô bé nhỏ này là ai thế?
  - speaker: Laura
    de: Das ist meine Schwester Emma. Sie ist erst zehn Jahre alt. Und hier ist mein Bruder Felix. Er studiert Informatik in München.
    vi: Đó là em gái Emma của mình. Em ấy mới mười tuổi thôi. Còn đây là anh trai Felix của mình. Anh ấy học ngành tin học ở München.
  - speaker: Jan
    de: Und der Hund da?
    vi: Thế còn chú chó đằng kia?
  - speaker: Laura
    de: Das ist unser Hund Bruno. Er gehört zur Familie!
    vi: Đó là chú chó Bruno của tụi mình. Nó là một thành viên của gia đình đấy!
  audio_status: pending-tts
  situation_vi: Laura cho đồng nghiệp Jan xem bức ảnh gia đình chụp trong kỳ nghỉ.
  skill: listening
  audio:
    speed: normal
- id: a1.m05.l03.b6
  kind: reading
  title_vi: Bức thư ngắn kể về gia đình của David
  paragraphs:
  - de: 'Liebe Freunde,

      ich möchte euch meine Familie vorstellen!

      Ich lebe mit meiner Frau Julia và unseren zwei Kindern in Frankfurt. Unser Sohn Leo ist sechs Jahre alt und geht schon in die Schule. Unsere Tochter Sophie ist erst zwei.

      Meine Eltern wohnen auch in Frankfurt, ganz in der Nähe. Mein Vater hilft uns oft và holt Leo von der Schule ab.

      Wir haben auch ein Haustier: eine kleine schwarze Katze. Sie heißt Luna und schläft den ganzen Tag.

      Herzliche Grüße,

      David'
    vi: 'Các bạn thân mến,

      mình muốn giới thiệu với các bạn về gia đình mình!

      Mình sống cùng vợ là Julia và hai con ở Frankfurt. Con trai Leo của tụi mình sáu tuổi và đã đi học tiểu học rồi. Con gái Sophie của tụi mình mới hai tuổi.

      Bố mẹ mình cũng sống ở Frankfurt, ngay gần nhà. Bố mình thường giúp tụi mình và đón Leo đi học về.

      Tụi mình cũng có một con thú cưng: một chú mèo đen nhỏ. Nó tên là Luna và ngủ suốt cả ngày.

      Thân ái,

      David'
  text_type_vi: Thư cá nhân (Persönlicher Brief)
  skill: reading
  glossary:
  - de: in der Nähe
    vi: ở gần đây
  - de: den ganzen Tag
    vi: suốt cả ngày
- id: a1.m05.l03.b7
  kind: speaking
  title_vi: Giới thiệu các thành viên trong gia đình bạn
  skill: speaking
  task_vi: 'Thực hành giới thiệu gia đình bạn (3–4 người): tên, tuổi, nghề nghiệp hoặc sở thích.'
  steps_vi:
  - 'Bố/Mẹ: Mein Vater / Meine Mutter heißt ... Er/Sie ist ... Jahre alt.'
  - 'Anh/Chị/Em: Ich habe einen Bruder / eine Schwester ...'
  - 'Thú cưng: Wir haben einen Hund / eine Katze ...'
  lines:
  - speaker: A
    de: Hast du eine große Familie?
    vi: Gia đình bạn có đông người không?
  - speaker: B
    de: Ja, ich habe zwei Brüder und eine Schwester. Mein ältester Bruder wohnt in Berlin.
    vi: Có, mình có hai anh trai và một em gái. Anh cả của mình sống ở Berlin.
- id: a1.m05.l03.b8
  kind: writing
  title_vi: Viết đoạn văn ngắn giới thiệu về gia đình bạn
  skill: writing
  task_vi: Viết đoạn văn 4–5 câu giới thiệu các thành viên trong gia đình bạn, sử dụng các mạo từ sở hữu (mein, meine, meinen...).
  model:
    de: Das ist meine Familie. Mein Vater heißt Hung und ist 50 Jahre alt. Meine Mutter heißt Mai. Ich habe einen Bruder. Sein Name ist Nam. Wir haben auch einen Hund. Unser Hund ist sehr freundlich.
    vi: Đây là gia đình tôi. Bố tôi tên là Hùng và 50 tuổi. Mẹ tôi tên là Mai. Tôi có một người em trai. Tên của em ấy là Nam. Chúng tôi cũng nuôi một chú chó. Chú chó của chúng tôi rất thân thiện.
  checklist_vi:
  - Dùng đúng đuôi mạo từ sở hữu (mein cho giống đực/trung, meine cho giống cái/số nhiều).
  - Nếu có động từ Akkusativ tác động lên danh từ giống đực thì dùng meinen (Ich habe einen Bruder / Ich besuche meinen Bruder).
