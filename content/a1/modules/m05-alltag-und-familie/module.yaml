title_de: Alltag und Familie
title_vi: Cuộc sống hằng ngày và gia đình
summary_vi: 'Chủ đề cuộc sống thường nhật và gia đình: các hoạt động trong ngày, nói giờ giấc chính thức và không chính thức, giới từ chỉ thời gian (um, am, im, von... bis...), thành viên gia đình và mạo từ sở hữu (mein, dein, sein, ihr...), hẹn gặp và động từ khuyết thiếu (können, wollen), sắp xếp lịch hẹn qua điện thoại và văn hóa đúng giờ (Pünktlichkeit) ở các nước D-A-CH.'
