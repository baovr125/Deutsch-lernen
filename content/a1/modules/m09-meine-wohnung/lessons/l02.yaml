blocks:
  - id: a1.m09.l02.b1
    kind: explanation
    skill: vocabulary
    title_vi: "Bắt đầu: đọc tin rao căn hộ"
    body_vi: |
      Tin rao hay dùng viết tắt: **2 Zi.** = 2 Zimmer (2 phòng), **qm** hoặc **m²** = mét vuông, **EUR** = euro, **NK** = Nebenkosten (chi phí phụ).
      Hãy tìm ba thông tin chính: **bao nhiêu phòng, diện tích bao nhiêu, tiền thuê bao nhiêu**.
  - id: a1.m09.l02.b2
    kind: reading
    skill: reading
    title_vi: "Tin rao: Wohnung in Bonn"
    paragraphs:
      - { de: "Helle 2-Zimmer-Wohnung in Bonn, 55 Quadratmeter.", vi: "Căn hộ hai phòng sáng ở Bonn, 55 mét vuông." }
      - { de: "Mit Balkon und Küche. Miete: 620 Euro im Monat, Nebenkosten: 90 Euro.", vi: "Có ban công và bếp. Tiền thuê: 620 euro mỗi tháng, chi phí phụ: 90 euro." }
      - { de: "Besichtigung am Samstag um elf Uhr. Bitte rufen Sie an.", vi: "Xem nhà vào thứ Bảy lúc 11 giờ. Xin hãy gọi điện." }
  - id: a1.m09.l02.b3
    kind: dialogue
    skill: speaking
    title_vi: "Hội thoại: Gọi điện hỏi nhà thuê"
    lines:
      - { speaker: "Anna", de: "Guten Tag, ich suche eine Wohnung. Ist die Wohnung in Bonn noch frei?", vi: "Xin chào, tôi đang tìm nhà. Căn hộ ở Bonn còn trống không ạ?" }
      - { speaker: "Vermieter", de: "Ja, sie ist noch frei. Möchten Sie die Wohnung besichtigen?", vi: "Còn trống ạ. Bạn có muốn xem nhà không?" }
      - { speaker: "Anna", de: "Ja, gern. Wie hoch ist die Miete?", vi: "Vâng, rất sẵn lòng. Tiền thuê là bao nhiêu ạ?" }
      - { speaker: "Vermieter", de: "620 Euro. Die Nebenkosten sind nicht in der Miete.", vi: "620 euro. Chi phí phụ không nằm trong tiền thuê." }
      - { speaker: "Anna", de: "Danke. Ich komme am Samstag um elf Uhr in die Wohnung.", vi: "Cảm ơn. Thứ Bảy lúc 11 giờ tôi sẽ đến căn hộ." }
  - id: a1.m09.l02.b4
    kind: explanation
    skill: grammar
    title_vi: "Ngữ pháp: Wohin? và Wo? với „in“"
    body_vi: |
      **Wohin?** (đi vào đâu) → **in + Akkusativ**: *Ich gehe in die Küche. Wir gehen in den Flur. Er geht ins Zimmer.*
      **Wo?** (đang ở đâu) → **in + Dativ**: *Ich bin in der Küche. Wir sind im Flur. Er ist im Zimmer.*
      Xem chủ điểm a1.g.in-wohin-wo.
