blocks:
  - id: a1.m09.l03.b1
    kind: explanation
    skill: vocabulary
    title_vi: "Bắt đầu: đồ đạc và vị trí"
    body_vi: |
      Học đồ nội thất kèm mạo từ: **der Tisch, der Stuhl, der Schrank, das Bett, das Sofa, das Regal, die Lampe, der Teppich**.
      Khi nói vị trí, dùng **stehen** (đứng thẳng), **liegen** (nằm phẳng): *Der Schrank steht … / Der Teppich liegt …*
  - id: a1.m09.l03.b2
    kind: dialogue
    skill: speaking
    title_vi: "Hội thoại: Dọn vào nhà mới"
    lines:
      - { speaker: "Mia", de: "Wo steht das Sofa?", vi: "Ghế sofa để ở đâu?" }
      - { speaker: "Ben", de: "Es steht im Wohnzimmer, vor dem Fenster.", vi: "Nó ở trong phòng khách, trước cửa sổ." }
      - { speaker: "Mia", de: "Und die Lampe? Sie steht neben dem Sofa, oder?", vi: "Còn cái đèn? Nó đứng cạnh ghế sofa đúng không?" }
      - { speaker: "Ben", de: "Ja. Der Teppich liegt unter dem Tisch.", vi: "Đúng. Tấm thảm nằm dưới cái bàn." }
      - { speaker: "Mia", de: "Super! Dann steht der Kühlschrank in der Küche, neben dem Tisch.", vi: "Tuyệt! Vậy tủ lạnh đứng trong bếp, cạnh cái bàn." }
  - id: a1.m09.l03.b3
    kind: listening
    skill: listening
    title_vi: "Nghe: Căn phòng của Emma"
    audio_status: pending-tts
    lines:
      - { speaker: "Emma", de: "Mein Zimmer ist klein, aber gemütlich.", vi: "Phòng của mình nhỏ nhưng ấm cúng." }
      - { speaker: "Emma", de: "Das Bett steht an der Wand. Neben dem Bett steht ein Schrank.", vi: "Cái giường kê sát tường. Cạnh giường có một cái tủ." }
      - { speaker: "Emma", de: "Der Teppich liegt vor dem Fenster.", vi: "Tấm thảm nằm trước cửa sổ." }
  - id: a1.m09.l03.b4
    kind: explanation
    skill: grammar
    title_vi: "Ngữ pháp: Wechselpräpositionen + Dativ"
    body_vi: |
      Chín giới từ: **an, auf, hinter, in, neben, über, unter, vor, zwischen**. Khi nói vị trí (**Wo?**) dùng **Dativ**: *neben dem Sofa, auf dem Tisch, an der Wand, unter den Betten.*
      Xem chủ điểm a1.g.wechselpraepositionen.
  - id: a1.m09.l03.b5
    kind: culture
    skill: reading
    title_vi: "Văn hóa: nhà thuê ở Đức"
    body_vi: |
      Ở Đức nhiều căn hộ cho thuê **không có bếp hoặc tủ lạnh** (chỉ có chỗ để đặt), người thuê tự mang đến. Nhà thường được mô tả bằng **số Zimmer** và **Quadratmeter**.
