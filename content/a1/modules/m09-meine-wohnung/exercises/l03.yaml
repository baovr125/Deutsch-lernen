exercises:
  - id: a1.m09.l03.ex.01
    type: fill-blank
    skill: grammar
    difficulty: 2
    objective_refs: [a1.m09.l03.obj1, a1.g.wechselpraepositionen.obj1, a1.m09.obj.position]
    instructions_vi: "Điền giới từ thích hợp (gợi ý nghĩa)."
    word_bank: ["neben", "an", "unter", "vor"]
    items:
      - { id: a1.m09.l03.ex.01.q1, prompt: "Die Lampe steht ___ dem Sofa.", hint_vi: "bên cạnh", answers: ["neben"], explanation_vi: "neben = bên cạnh." }
      - { id: a1.m09.l03.ex.01.q2, prompt: "Das Bild hängt ___ der Wand.", hint_vi: "trên tường", answers: ["an"], explanation_vi: "an = sát, ở mặt tường." }
      - { id: a1.m09.l03.ex.01.q3, prompt: "Der Teppich liegt ___ dem Tisch.", hint_vi: "bên dưới", answers: ["unter"], explanation_vi: "unter = dưới." }
      - { id: a1.m09.l03.ex.01.q4, prompt: "Der Stuhl steht ___ dem Schrank.", hint_vi: "phía trước", answers: ["vor"], explanation_vi: "vor = trước." }
  - id: a1.m09.l03.ex.02
    type: multiple-choice
    skill: grammar
    difficulty: 2
    objective_refs: [a1.m09.l03.obj1, a1.g.wechselpraepositionen.obj1]
    instructions_vi: "Chọn mạo từ Dativ đúng."
    items:
      - id: a1.m09.l03.ex.02.q1
        prompt: "Das Buch liegt auf ___ Tisch."
        options: [{ id: a, text: "dem" }, { id: b, text: "den" }, { id: c, text: "der" }]
        answer: [a]
        explanation_vi: "„Tisch“ giống đực, Wo? → Dativ: dem."
      - id: a1.m09.l03.ex.02.q2
        prompt: "Die Lampe steht neben ___ Sofa."
        options: [{ id: a, text: "der" }, { id: b, text: "dem" }, { id: c, text: "den" }]
        answer: [b]
        explanation_vi: "„Sofa“ giống trung → dem."
      - id: a1.m09.l03.ex.02.q3
        prompt: "Der Stuhl steht vor ___ Schrank."
        options: [{ id: a, text: "den" }, { id: b, text: "der" }, { id: c, text: "dem" }]
        answer: [c]
        explanation_vi: "„Schrank“ giống đực → dem."
      - id: a1.m09.l03.ex.02.q4
        prompt: "Der Tisch steht in ___ Küche."
        options: [{ id: a, text: "dem" }, { id: b, text: "der" }, { id: c, text: "den" }]
        answer: [b]
        explanation_vi: "„Küche“ giống cái → der."
  - id: a1.m09.l03.ex.03
    type: matching
    skill: vocabulary
    difficulty: 1
    objective_refs: [a1.m09.l03.obj1]
    instructions_vi: "Nối đồ nội thất với nghĩa tiếng Việt."
    items:
      - { id: a1.m09.l03.ex.03.q1, left: "der Schrank", right: "cái tủ", explanation_vi: "der Schrank, số nhiều die Schränke." }
      - { id: a1.m09.l03.ex.03.q2, left: "das Regal", right: "cái kệ", explanation_vi: "das Regal, số nhiều die Regale." }
      - { id: a1.m09.l03.ex.03.q3, left: "der Kühlschrank", right: "tủ lạnh", explanation_vi: "kühl (mát) + Schrank (tủ)." }
      - { id: a1.m09.l03.ex.03.q4, left: "der Teppich", right: "tấm thảm", explanation_vi: "der Teppich, số nhiều die Teppiche." }
      - { id: a1.m09.l03.ex.03.q5, left: "der Stuhl", right: "cái ghế", explanation_vi: "der Stuhl, số nhiều die Stühle." }
  - id: a1.m09.l03.ex.04
    type: word-order
    skill: grammar
    difficulty: 2
    objective_refs: [a1.m09.l03.obj1, a1.g.wechselpraepositionen.obj1]
    instructions_vi: "Sắp xếp các từ thành câu đúng."
    items:
      - id: a1.m09.l03.ex.04.q1
        tokens: ["im", "Das", "Wohnzimmer.", "steht", "Sofa"]
        answer: "Das Sofa steht im Wohnzimmer."
        translation_vi: "Ghế sofa ở trong phòng khách."
        explanation_vi: "im = in dem; stehen cho vật đứng."
      - id: a1.m09.l03.ex.04.q2
        tokens: ["dem", "Lampe", "steht", "Sofa.", "neben", "Die"]
        answer: "Die Lampe steht neben dem Sofa."
        translation_vi: "Cái đèn đứng cạnh ghế sofa."
        explanation_vi: "neben + Dativ (dem Sofa)."
      - id: a1.m09.l03.ex.04.q3
        tokens: ["Tisch.", "liegt", "dem", "Buch", "auf", "Das"]
        answer: "Das Buch liegt auf dem Tisch."
        translation_vi: "Quyển sách nằm trên bàn."
        explanation_vi: "Sách nằm phẳng nên dùng „liegen“."
  - id: a1.m09.l03.ex.05
    type: listening-practice
    skill: listening
    difficulty: 2
    objective_refs: [a1.m09.l03.obj2, a1.m09.obj.position]
    instructions_vi: "Nghe mô tả (hoặc đọc transcript) rồi chọn đáp án."
    stimulus:
      text_de: "Mein Zimmer ist klein, aber gemütlich. Das Bett steht an der Wand. Neben dem Bett steht ein Schrank. Der Teppich liegt vor dem Fenster."
      audio_status: pending-tts
    items:
      - id: a1.m09.l03.ex.05.q1
        prompt: "Wo steht das Bett?"
        options: [{ id: a, text: "An der Wand." }, { id: b, text: "Vor dem Fenster." }, { id: c, text: "Neben dem Schrank." }]
        answer: [a]
        explanation_vi: "„Das Bett steht an der Wand.“"
      - id: a1.m09.l03.ex.05.q2
        prompt: "Was steht neben dem Bett?"
        options: [{ id: a, text: "Der Teppich." }, { id: b, text: "Ein Schrank." }, { id: c, text: "Ein Tisch." }]
        answer: [b]
        explanation_vi: "„Neben dem Bett steht ein Schrank.“"
      - id: a1.m09.l03.ex.05.q3
        prompt: "Wo liegt der Teppich?"
        options: [{ id: a, text: "An der Wand." }, { id: b, text: "Neben dem Bett." }, { id: c, text: "Vor dem Fenster." }]
        answer: [c]
        explanation_vi: "„Der Teppich liegt vor dem Fenster.“"
  - id: a1.m09.l03.ex.06
    type: sentence-construction
    skill: writing
    difficulty: 2
    objective_refs: [a1.m09.l03.obj1, a1.g.wechselpraepositionen.obj1]
    instructions_vi: "Viết câu tiếng Đức với các từ bắt buộc."
    items:
      - { id: a1.m09.l03.ex.06.q1, prompt_vi: "Cái đèn đứng cạnh ghế sofa.", required_words: ["Lampe", "neben", "Sofa"], answers: ["Die Lampe steht neben dem Sofa."], explanation_vi: "neben + Dativ: dem Sofa; đèn đứng nên dùng „stehen“." }
      - { id: a1.m09.l03.ex.06.q2, prompt_vi: "Tấm thảm nằm dưới cái bàn.", required_words: ["Teppich", "unter", "Tisch"], answers: ["Der Teppich liegt unter dem Tisch."], explanation_vi: "unter + Dativ: dem Tisch; thảm nằm nên dùng „liegen“." }
      - { id: a1.m09.l03.ex.06.q3, prompt_vi: "Cái ghế đứng trước cái tủ.", required_words: ["Stuhl", "vor", "Schrank"], answers: ["Der Stuhl steht vor dem Schrank."], explanation_vi: "vor + Dativ: dem Schrank." }
  - id: a1.m09.l03.ex.07
    type: speaking-practice
    skill: speaking
    difficulty: 2
    objective_refs: [a1.m09.l03.obj1, a1.m09.obj.position]
    instructions_vi: "Hãy nói 3–4 câu mô tả vị trí đồ vật trong phòng của bạn."
    items:
      - id: a1.m09.l03.ex.07.q1
        prompt_vi: "Nói đồ vật nào ở đâu."
        model_answer: { de: "In meinem Zimmer steht das Bett an der Wand. Neben dem Bett steht ein Schrank. Der Teppich liegt unter dem Tisch.", vi: "Trong phòng tôi cái giường kê sát tường. Cạnh giường có một cái tủ. Tấm thảm nằm dưới cái bàn." }
        rubric_vi: ["Dùng ít nhất hai giới từ (an, neben, unter…).", "Mạo từ Dativ đúng (dem/der).", "Dùng stehen/liegen đúng với đồ vật.", "Nói trôi chảy 3–4 câu."]
        explanation_vi: "Bài mẫu dùng an, neben, unter với stehen và liegen."
