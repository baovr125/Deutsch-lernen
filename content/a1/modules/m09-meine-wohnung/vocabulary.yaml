entries:
  # ---- Bài 1: Meine Wohnung ----
  - { id: a1.m09.v.wohnung, de: "Wohnung", pos: noun, article: die, plural: "Wohnungen", vi: "căn hộ", ipa: "/ˈvoːnʊŋ/", example: { de: "Meine Wohnung hat drei Zimmer.", vi: "Căn hộ của tôi có ba phòng." }, usage_vi: "Đuôi -ung luôn là „die“. „in der Wohnung“ = trong căn hộ.", lesson_refs: [a1.m09.l01] }
  - { id: a1.m09.v.zimmer, de: "Zimmer", pos: noun, article: das, plural: "Zimmer", vi: "phòng", ipa: "/ˈʦɪmɐ/", example: { de: "Das Zimmer ist klein, aber hell.", vi: "Căn phòng nhỏ nhưng sáng." }, usage_vi: "Số nhiều không đổi. Trong quảng cáo, „3 Zimmer“ thường không tính bếp và phòng tắm.", lesson_refs: [a1.m09.l01] }
  - { id: a1.m09.v.wohnzimmer, de: "Wohnzimmer", pos: noun, article: das, plural: "Wohnzimmer", vi: "phòng khách", ipa: "/ˈvoːnˌʦɪmɐ/", example: { de: "Das Sofa steht im Wohnzimmer.", vi: "Ghế sofa ở trong phòng khách." }, usage_vi: "Từ ghép wohnen + Zimmer.", lesson_refs: [a1.m09.l01] }
  - { id: a1.m09.v.schlafzimmer, de: "Schlafzimmer", pos: noun, article: das, plural: "Schlafzimmer", vi: "phòng ngủ", ipa: "/ˈʃlaːfˌʦɪmɐ/", example: { de: "Im Schlafzimmer ist es dunkel.", vi: "Trong phòng ngủ thì tối." }, usage_vi: "„sch“ đọc /ʃ/; schlafen = ngủ.", lesson_refs: [a1.m09.l01] }
  - { id: a1.m09.v.badezimmer, de: "Badezimmer", pos: noun, article: das, plural: "Badezimmer", vi: "phòng tắm", ipa: "/ˈbaːdəˌʦɪmɐ/", example: { de: "Das Badezimmer ist neben der Küche.", vi: "Phòng tắm ở cạnh nhà bếp." }, usage_vi: "Thường gọi tắt là „das Bad“.", lesson_refs: [a1.m09.l01] }
  - { id: a1.m09.v.kueche, de: "Küche", pos: noun, article: die, plural: "Küchen", vi: "nhà bếp", ipa: "/ˈkʏçə/", example: { de: "Ich koche in der Küche.", vi: "Tôi nấu ăn trong bếp." }, usage_vi: "„ü“ đọc /ʏ/ (môi tròn như „u“ nhưng lưỡi như „i“).", lesson_refs: [a1.m09.l01] }
  - { id: a1.m09.v.flur, de: "Flur", pos: noun, article: der, plural: "Flure", vi: "hành lang", ipa: "/fluːɐ̯/", example: { de: "Im Flur steht ein Schrank.", vi: "Ở hành lang có một cái tủ." }, usage_vi: "Khu vực giữa cửa vào và các phòng.", lesson_refs: [a1.m09.l01] }
  - { id: a1.m09.v.balkon, de: "Balkon", pos: noun, article: der, plural: "Balkone", vi: "ban công", ipa: "/balˈkɔŋ/", example: { de: "Auf dem Balkon trinken wir Kaffee.", vi: "Trên ban công chúng tôi uống cà phê." }, usage_vi: "Đọc /balˈkɔŋ/ hoặc /balˈkoːn/ ở Nam Đức và Áo. Số nhiều: Balkone.", lesson_refs: [a1.m09.l01] }
  - { id: a1.m09.v.wohnen, de: "wohnen", pos: verb, forms: { er: "wohnt" }, vi: "sống, ở (nơi cư trú)", ipa: "/ˈvoːnən/", example: { de: "Wir wohnen in einer Wohnung in der Stadt.", vi: "Chúng tôi sống trong một căn hộ trong thành phố." }, usage_vi: "„Wo wohnst du?“ = Bạn sống ở đâu? Đi với „in + Dativ“.", lesson_refs: [a1.m09.l01] }
  - { id: a1.m09.v.gross, de: "groß", pos: adjective, vi: "to, lớn, cao", ipa: "/ɡʁoːs/", example: { de: "Das Wohnzimmer ist sehr groß.", vi: "Phòng khách rất rộng." }, usage_vi: "Trái nghĩa: klein. Cũng chỉ chiều cao người.", lesson_refs: [a1.m09.l01] }
  - { id: a1.m09.v.klein, de: "klein", pos: adjective, vi: "nhỏ, bé", ipa: "/klaɪn/", example: { de: "Die Küche ist leider klein.", vi: "Tiếc là nhà bếp nhỏ." }, usage_vi: "Trái nghĩa: groß.", lesson_refs: [a1.m09.l01] }
  - { id: a1.m09.v.hell, de: "hell", pos: adjective, vi: "sáng", ipa: "/hɛl/", example: { de: "Das Schlafzimmer ist hell und freundlich.", vi: "Phòng ngủ sáng sủa và dễ chịu." }, usage_vi: "Trái nghĩa: dunkel. Cũng dùng cho màu nhạt.", lesson_refs: [a1.m09.l01] }
  - { id: a1.m09.v.dunkel, de: "dunkel", pos: adjective, vi: "tối", ipa: "/ˈdʊŋkl̩/", example: { de: "Der Flur ist ziemlich dunkel.", vi: "Hành lang khá tối." }, usage_vi: "Trái nghĩa: hell.", lesson_refs: [a1.m09.l01] }
  - { id: a1.m09.v.gemuetlich, de: "gemütlich", pos: adjective, vi: "ấm cúng, dễ chịu", ipa: "/ɡəˈmyːtlɪç/", example: { de: "Das Wohnzimmer ist klein, aber gemütlich.", vi: "Phòng khách nhỏ nhưng ấm cúng." }, usage_vi: "Từ rất đặc trưng văn hóa Đức: không gian thoải mái, ấm áp.", lesson_refs: [a1.m09.l01] }
  - { id: a1.m09.v.rot, de: "rot", pos: adjective, vi: "đỏ", ipa: "/ʁoːt/", example: { de: "Das Sofa ist rot.", vi: "Ghế sofa màu đỏ." }, usage_vi: "Màu sắc dùng sau „sein“ không biến cách.", lesson_refs: [a1.m09.l01] }
  - { id: a1.m09.v.blau, de: "blau", pos: adjective, vi: "xanh dương", ipa: "/blaʊ/", example: { de: "Der Teppich ist blau.", vi: "Tấm thảm màu xanh dương." }, usage_vi: "„au“ đọc /aʊ/.", lesson_refs: [a1.m09.l01] }
  - { id: a1.m09.v.gruen, de: "grün", pos: adjective, vi: "xanh lá", ipa: "/ɡʁyːn/", example: { de: "Die Lampe ist grün.", vi: "Cái đèn màu xanh lá." }, usage_vi: "„ü“ đọc /yː/ (môi tròn, lưỡi như „i“ kéo dài).", lesson_refs: [a1.m09.l01] }
  - { id: a1.m09.v.gelb, de: "gelb", pos: adjective, vi: "vàng", ipa: "/ɡɛlp/", example: { de: "Die Küche ist gelb.", vi: "Nhà bếp màu vàng." }, usage_vi: "„b“ cuối từ đọc /p/.", lesson_refs: [a1.m09.l01] }
  - { id: a1.m09.v.weiss, de: "weiß", pos: adjective, vi: "trắng", ipa: "/vaɪs/", example: { de: "Das Bett ist weiß.", vi: "Cái giường màu trắng." }, usage_vi: "„ß“ đọc /s/ (sau nguyên âm dài hoặc song âm).", lesson_refs: [a1.m09.l01] }
  - { id: a1.m09.v.schwarz, de: "schwarz", pos: adjective, vi: "đen", ipa: "/ʃvaʁʦ/", example: { de: "Der Schrank ist schwarz.", vi: "Cái tủ màu đen." }, usage_vi: "„schw-“ đọc /ʃv/.", lesson_refs: [a1.m09.l01] }
  - { id: a1.m09.v.braun, de: "braun", pos: adjective, vi: "nâu", ipa: "/bʁaʊn/", example: { de: "Der Tisch ist braun.", vi: "Cái bàn màu nâu." }, usage_vi: "„au“ đọc /aʊ/.", lesson_refs: [a1.m09.l01] }
  # ---- Bài 2: Die Wohnungssuche ----
  - { id: a1.m09.v.anzeige, de: "Anzeige", pos: noun, article: die, plural: "Anzeigen", vi: "tin rao, quảng cáo", ipa: "/ˈanˌʦaɪɡə/", example: { de: "Ich lese die Wohnungsanzeige im Internet.", vi: "Tôi đọc tin rao căn hộ trên Internet." }, usage_vi: "„eine Anzeige lesen/schreiben“. Từ ghép: Wohnungsanzeige.", lesson_refs: [a1.m09.l02] }
  - { id: a1.m09.v.miete, de: "Miete", pos: noun, article: die, plural: "Mieten", vi: "tiền thuê nhà", ipa: "/ˈmiːtə/", example: { de: "Die Miete ist 600 Euro im Monat.", vi: "Tiền thuê là 600 euro mỗi tháng." }, usage_vi: "„Kaltmiete“ = chưa gồm chi phí phụ; „Warmmiete“ = đã gồm.", lesson_refs: [a1.m09.l02] }
  - { id: a1.m09.v.quadratmeter, de: "Quadratmeter", pos: noun, article: der, plural: "Quadratmeter", vi: "mét vuông", ipa: "/kvaˈdʁaːtˌmeːtɐ/", example: { de: "Die Wohnung hat fünfzig Quadratmeter.", vi: "Căn hộ có năm mươi mét vuông." }, usage_vi: "Viết tắt m². Số nhiều không đổi.", lesson_refs: [a1.m09.l02] }
  - { id: a1.m09.v.nebenkosten, de: "Nebenkosten", pos: noun, article: pl, plural: "Nebenkosten", vi: "chi phí phụ (điện, nước, rác…)", ipa: "/ˈneːbn̩ˌkɔstn̩/", example: { de: "Die Nebenkosten sind nicht in der Miete.", vi: "Chi phí phụ không nằm trong tiền thuê." }, usage_vi: "Chỉ dùng số nhiều: die Nebenkosten.", lesson_refs: [a1.m09.l02] }
  - { id: a1.m09.v.mieten, de: "mieten", pos: verb, forms: { er: "mietet" }, vi: "thuê (nhà)", ipa: "/ˈmiːtn̩/", example: { de: "Wir mieten eine Wohnung in der Stadt.", vi: "Chúng tôi thuê một căn hộ trong thành phố." }, usage_vi: "Thân động từ kết thúc bằng -t: du mietest, er mietet.", lesson_refs: [a1.m09.l02] }
  - { id: a1.m09.v.suchen, de: "suchen", pos: verb, forms: { er: "sucht" }, vi: "tìm", ipa: "/ˈzuːxn̩/", example: { de: "Ich suche eine Wohnung mit Balkon.", vi: "Tôi tìm một căn hộ có ban công." }, usage_vi: "„ch“ sau u đọc /x/. Đi với Akkusativ.", lesson_refs: [a1.m09.l02] }
  - { id: a1.m09.v.einziehen, de: "einziehen", pos: verb, forms: { er: "zieht ein", separable: true }, vi: "chuyển vào ở", ipa: "/ˈaɪnˌʦiːən/", example: { de: "Wir ziehen am Samstag in die Wohnung ein.", vi: "Thứ Bảy chúng tôi chuyển vào căn hộ." }, usage_vi: "Động từ tách: „ein“ ở cuối câu.", lesson_refs: [a1.m09.l02] }
  - { id: a1.m09.v.teuer, de: "teuer", pos: adjective, vi: "đắt", ipa: "/ˈtɔɪɐ/", example: { de: "Die Wohnung ist zu teuer.", vi: "Căn hộ đắt quá." }, usage_vi: "Trái nghĩa: günstig. „zu teuer“ = quá đắt.", lesson_refs: [a1.m09.l02] }
  - { id: a1.m09.v.guenstig, de: "günstig", pos: adjective, vi: "rẻ, có giá hợp lý", ipa: "/ˈɡʏnstɪç/", example: { de: "Die Miete ist günstig.", vi: "Tiền thuê hợp lý." }, usage_vi: "Tích cực hơn „billig“ (rẻ tiền).", lesson_refs: [a1.m09.l02] }
  # ---- Bài 3: Die neue Wohnung ----
  - { id: a1.m09.v.moebel, de: "Möbel", pos: noun, article: pl, plural: "Möbel", vi: "đồ nội thất", ipa: "/ˈmøːbl̩/", example: { de: "Die Möbel sind neu.", vi: "Đồ nội thất mới." }, usage_vi: "Thường chỉ dùng số nhiều. Một món: „ein Möbelstück“.", lesson_refs: [a1.m09.l03] }
  - { id: a1.m09.v.tisch, de: "Tisch", pos: noun, article: der, plural: "Tische", vi: "cái bàn", ipa: "/tɪʃ/", example: { de: "Der Tisch steht in der Küche.", vi: "Cái bàn ở trong bếp." }, usage_vi: "„sch“ đọc /ʃ/.", lesson_refs: [a1.m09.l03] }
  - { id: a1.m09.v.stuhl, de: "Stuhl", pos: noun, article: der, plural: "Stühle", vi: "cái ghế", ipa: "/ʃtuːl/", example: { de: "Der Stuhl steht vor dem Schreibtisch.", vi: "Cái ghế đứng trước bàn làm việc." }, usage_vi: "Số nhiều có Umlaut: Stühle. „st-“ đầu từ đọc /ʃt/.", lesson_refs: [a1.m09.l03] }
  - { id: a1.m09.v.bett, de: "Bett", pos: noun, article: das, plural: "Betten", vi: "cái giường", ipa: "/bɛt/", example: { de: "Das Bett steht im Schlafzimmer.", vi: "Cái giường ở trong phòng ngủ." }, usage_vi: "„ins Bett gehen“ = đi ngủ.", lesson_refs: [a1.m09.l03] }
  - { id: a1.m09.v.sofa, de: "Sofa", pos: noun, article: das, plural: "Sofas", vi: "ghế sofa", ipa: "/ˈzoːfa/", example: { de: "Das Sofa ist weich und bequem.", vi: "Ghế sofa mềm và thoải mái." }, usage_vi: "„s“ đầu từ trước nguyên âm đọc /z/.", lesson_refs: [a1.m09.l03] }
  - { id: a1.m09.v.schrank, de: "Schrank", pos: noun, article: der, plural: "Schränke", vi: "cái tủ", ipa: "/ʃʁaŋk/", example: { de: "Der Schrank steht neben dem Bett.", vi: "Cái tủ đứng cạnh giường." }, usage_vi: "Số nhiều có Umlaut: Schränke. Từ ghép: Kleiderschrank, Kühlschrank.", lesson_refs: [a1.m09.l03] }
  - { id: a1.m09.v.regal, de: "Regal", pos: noun, article: das, plural: "Regale", vi: "cái giá, kệ sách", ipa: "/ʁeˈɡaːl/", example: { de: "Das Regal hängt an der Wand.", vi: "Cái kệ treo trên tường." }, usage_vi: "Thường là kệ sách; có thể treo hoặc đứng.", lesson_refs: [a1.m09.l03] }
  - { id: a1.m09.v.lampe, de: "Lampe", pos: noun, article: die, plural: "Lampen", vi: "cái đèn", ipa: "/ˈlampə/", example: { de: "Die Lampe steht neben dem Sofa.", vi: "Cái đèn đứng cạnh ghế sofa." }, usage_vi: "Số nhiều: Lampen.", lesson_refs: [a1.m09.l03] }
  - { id: a1.m09.v.teppich, de: "Teppich", pos: noun, article: der, plural: "Teppiche", vi: "tấm thảm", ipa: "/ˈtɛpɪç/", example: { de: "Der Teppich liegt unter dem Tisch.", vi: "Tấm thảm nằm dưới cái bàn." }, usage_vi: "Đuôi -ich đọc /ɪç/.", lesson_refs: [a1.m09.l03] }
  - { id: a1.m09.v.kuehlschrank, de: "Kühlschrank", pos: noun, article: der, plural: "Kühlschränke", vi: "tủ lạnh", ipa: "/ˈkyːlʃʁaŋk/", example: { de: "Der Kühlschrank ist in der Küche.", vi: "Tủ lạnh ở trong bếp." }, usage_vi: "Từ ghép: kühl + Schrank. Số nhiều: Kühlschränke.", lesson_refs: [a1.m09.l03] }
  - { id: a1.m09.v.stehen, de: "stehen", pos: verb, forms: { er: "steht" }, vi: "đứng (vật ở tư thế đứng)", ipa: "/ˈʃteːən/", example: { de: "Der Schrank steht im Flur.", vi: "Cái tủ đứng ở hành lang." }, usage_vi: "Dùng cho vật cao, đứng thẳng: Tisch, Stuhl, Schrank, Lampe. Trả lời „Wo?“.", lesson_refs: [a1.m09.l03] }
  - { id: a1.m09.v.liegen, de: "liegen", pos: verb, forms: { er: "liegt" }, vi: "nằm (vật ở tư thế nằm)", ipa: "/ˈliːɡn̩/", example: { de: "Das Buch liegt auf dem Tisch.", vi: "Quyển sách nằm trên bàn." }, usage_vi: "Dùng cho vật nằm phẳng: Buch, Teppich, Handy. Trả lời „Wo?“.", lesson_refs: [a1.m09.l03] }
  # ---- Bài 4: Alles fertig ----
  - { id: a1.m09.v.einladung, de: "Einladung", pos: noun, article: die, plural: "Einladungen", vi: "lời mời, thiệp mời", ipa: "/ˈaɪnˌlaːdʊŋ/", example: { de: "Vielen Dank für die Einladung!", vi: "Cảm ơn nhiều vì lời mời!" }, usage_vi: "Đuôi -ung luôn là „die“. „eine Einladung bekommen“ = nhận được lời mời.", lesson_refs: [a1.m09.l04] }
  - { id: a1.m09.v.zusagen, de: "zusagen", pos: verb, forms: { er: "sagt zu", separable: true }, vi: "nhận lời", ipa: "/ˈʦuːˌzaːɡn̩/", example: { de: "Ich sage gern zu.", vi: "Tôi vui lòng nhận lời." }, usage_vi: "Động từ tách: „zu“ cuối câu. Trái nghĩa: absagen.", lesson_refs: [a1.m09.l04] }
  - { id: a1.m09.v.absagen, de: "absagen", pos: verb, forms: { er: "sagt ab", separable: true }, vi: "từ chối, hủy", ipa: "/ˈapˌzaːɡn̩/", example: { de: "Leider muss ich absagen.", vi: "Tiếc là tôi phải từ chối." }, usage_vi: "Động từ tách: „ab“ cuối câu. Hay đi với „Leider“.", lesson_refs: [a1.m09.l04] }
  - { id: a1.m09.v.toll, de: "Toll!", pos: phrase, vi: "Tuyệt vời!", ipa: "/tɔl/", example: { de: "Toll! Die Wohnung ist wirklich schön.", vi: "Tuyệt! Căn hộ thật sự đẹp." }, usage_vi: "Cách bày tỏ sự hào hứng. Cũng là tính từ: „Das ist toll.“", lesson_refs: [a1.m09.l04] }
