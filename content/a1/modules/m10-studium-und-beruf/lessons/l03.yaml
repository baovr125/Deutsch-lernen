blocks:
  - id: a1.m10.l03.b1
    kind: explanation
    skill: grammar
    title_vi: "Bắt đầu: ba loại Partizip II"
    body_vi: |
      **Có quy tắc:** ge + thân + **t** (gekocht). **Đuôi -ieren:** thân + **t**, không có ge- (telefoniert, studiert). **Bất quy tắc:** ge + thân (thường đổi nguyên âm) + **en** (gesehen, getrunken, gegessen).
      Hãy học động từ cùng Partizip II: *essen – hat gegessen, sehen – hat gesehen*.
  - id: a1.m10.l03.b2
    kind: dialogue
    skill: speaking
    title_vi: "Hội thoại: Cuối tuần thế nào?"
    lines:
      - { speaker: "Lisa", de: "Wie war dein Wochenende?", vi: "Cuối tuần của bạn thế nào?" }
      - { speaker: "Omar", de: "Sehr schön! Am Samstag habe ich Freunde getroffen. Wir haben Pizza gegessen.", vi: "Rất vui! Thứ Bảy mình đã gặp bạn bè. Chúng mình đã ăn pizza." }
      - { speaker: "Lisa", de: "Und am Sonntag?", vi: "Còn Chủ nhật?" }
      - { speaker: "Omar", de: "Da habe ich lange geschlafen und einen Film gesehen. Und du?", vi: "Hôm đó mình đã ngủ rất lâu và xem một bộ phim. Còn bạn?" }
      - { speaker: "Lisa", de: "Ich habe viel telefoniert und ein Buch gelesen.", vi: "Mình đã nói điện thoại nhiều và đọc một quyển sách." }
  - id: a1.m10.l03.b3
    kind: listening
    skill: listening
    title_vi: "Nghe: Cuối tuần của Mira"
    audio_status: pending-tts
    lines:
      - { speaker: "Mira", de: "Am Wochenende habe ich viel gemacht.", vi: "Cuối tuần mình đã làm nhiều việc." }
      - { speaker: "Mira", de: "Am Samstag habe ich Freunde getroffen und wir haben Pizza gegessen.", vi: "Thứ Bảy mình đã gặp bạn bè và chúng mình ăn pizza." }
      - { speaker: "Mira", de: "Am Sonntag habe ich lange geschlafen und einen Film gesehen.", vi: "Chủ nhật mình đã ngủ rất lâu và xem một bộ phim." }
  - id: a1.m10.l03.b4
    kind: explanation
    skill: grammar
    title_vi: "Ngữ pháp: -ieren và bất quy tắc"
    body_vi: |
      **-ieren:** telefonieren → *telefoniert*, studieren → *studiert*, fotografieren → *fotografiert* (không có ge-).
      **Bất quy tắc:** sehen → *gesehen*, lesen → *gelesen*, essen → *gegessen*, trinken → *getrunken*, treffen → *getroffen*, finden → *gefunden*, schlafen → *geschlafen*.
      Động từ chỉ di chuyển dùng **sein**: *Ich bin gegangen / gefahren / gekommen.* Xem a1.g.partizip2-ieren và a1.g.partizip2-unregelmaessig.
