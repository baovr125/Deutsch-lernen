entries:
  # ---- Bài 1: Studium und Beruf ----
  - { id: a1.m10.v.beruf, de: "Beruf", pos: noun, article: der, plural: "Berufe", vi: "nghề nghiệp", ipa: "/bəˈʁuːf/", example: { de: "Mein Beruf ist Lehrer.", vi: "Nghề của tôi là giáo viên." }, usage_vi: "Hỏi nghề: „Was sind Sie von Beruf?“. Khi nói nghề không dùng mạo từ: „Ich bin Lehrerin.“", lesson_refs: [a1.m10.l01] }
  - { id: a1.m10.v.student, de: "Student", pos: noun, article: der, plural: "Studenten", vi: "sinh viên (nam)", ipa: "/ʃtuˈdɛnt/", example: { de: "Der Student lernt in der Bibliothek.", vi: "Anh sinh viên học trong thư viện." }, usage_vi: "Danh từ yếu: den Studenten. Nữ: die Studentin.", lesson_refs: [a1.m10.l01] }
  - { id: a1.m10.v.studentin, de: "Studentin", pos: noun, article: die, plural: "Studentinnen", vi: "sinh viên (nữ)", ipa: "/ʃtuˈdɛntɪn/", example: { de: "Meine Schwester ist Studentin.", vi: "Chị gái tôi là sinh viên." }, usage_vi: "Thêm -in; số nhiều -innen.", lesson_refs: [a1.m10.l01] }
  - { id: a1.m10.v.studium, de: "Studium", pos: noun, article: das, plural: "Studien", vi: "việc học đại học, chương trình học", ipa: "/ˈʃtuːdi̯ʊm/", example: { de: "Das Studium dauert drei Jahre.", vi: "Chương trình học kéo dài ba năm." }, usage_vi: "Số nhiều „Studien“ ít dùng. Động từ liên quan: studieren.", lesson_refs: [a1.m10.l01] }
  - { id: a1.m10.v.universitaet, de: "Universität", pos: noun, article: die, plural: "Universitäten", vi: "trường đại học", ipa: "/univɛʁziˈtɛːt/", example: { de: "Sie arbeitet an der Universität.", vi: "Cô ấy làm việc ở trường đại học." }, usage_vi: "Đuôi -tät luôn là „die“. Viết tắt: die Uni. „an der Uni“ = ở trường đại học.", lesson_refs: [a1.m10.l01] }
  - { id: a1.m10.v.lehrer, de: "Lehrer", pos: noun, article: der, plural: "Lehrer", vi: "giáo viên (nam)", ipa: "/ˈleːʁɐ/", example: { de: "Der Lehrer erklärt die Aufgabe.", vi: "Thầy giáo giải thích bài tập." }, usage_vi: "Nữ: die Lehrerin. Số nhiều của dạng nam không đổi.", lesson_refs: [a1.m10.l01] }
  - { id: a1.m10.v.lehrerin, de: "Lehrerin", pos: noun, article: die, plural: "Lehrerinnen", vi: "giáo viên (nữ)", ipa: "/ˈleːʁəʁɪn/", example: { de: "Die Lehrerin kommt aus Wien.", vi: "Cô giáo đến từ Wien." }, usage_vi: "Thêm -in; số nhiều -innen.", lesson_refs: [a1.m10.l01] }
  - { id: a1.m10.v.ingenieur, de: "Ingenieur", pos: noun, article: der, plural: "Ingenieure", vi: "kỹ sư (nam)", ipa: "/ɪnʒeˈni̯øːɐ̯/", example: { de: "Mein Vater ist Ingenieur.", vi: "Bố tôi là kỹ sư." }, usage_vi: "Nữ: die Ingenieurin. „g“ đọc /ʒ/ như tiếng Pháp.", lesson_refs: [a1.m10.l01] }
  - { id: a1.m10.v.verkaeufer, de: "Verkäufer", pos: noun, article: der, plural: "Verkäufer", vi: "nhân viên bán hàng (nam)", ipa: "/fɛɐ̯ˈkɔɪfɐ/", example: { de: "Der Verkäufer arbeitet im Supermarkt.", vi: "Nhân viên bán hàng làm việc ở siêu thị." }, usage_vi: "Nữ: die Verkäuferin.", lesson_refs: [a1.m10.l01] }
  - { id: a1.m10.v.koch, de: "Koch", pos: noun, article: der, plural: "Köche", vi: "đầu bếp (nam)", ipa: "/kɔx/", example: { de: "Der Koch arbeitet im Restaurant.", vi: "Đầu bếp làm việc ở nhà hàng." }, usage_vi: "Nữ: die Köchin. Số nhiều có Umlaut: Köche.", lesson_refs: [a1.m10.l01] }
  - { id: a1.m10.v.koechin, de: "Köchin", pos: noun, article: die, plural: "Köchinnen", vi: "đầu bếp (nữ)", ipa: "/ˈkœçɪn/", example: { de: "Die Köchin kocht jeden Tag.", vi: "Nữ đầu bếp nấu ăn mỗi ngày." }, usage_vi: "„ö“ đọc /œ/.", lesson_refs: [a1.m10.l01] }
  - { id: a1.m10.v.kurs, de: "Kurs", pos: noun, article: der, plural: "Kurse", vi: "khóa học", ipa: "/kʊʁs/", example: { de: "Ich besuche einen Deutschkurs.", vi: "Tôi tham gia một khóa học tiếng Đức." }, usage_vi: "Từ ghép: Deutschkurs, Sprachkurs.", lesson_refs: [a1.m10.l01] }
  - { id: a1.m10.v.job, de: "Job", pos: noun, article: der, plural: "Jobs", vi: "công việc (thường là việc làm thêm)", ipa: "/dʒɔp/", example: { de: "Im Sommer habe ich einen Job im Hotel.", vi: "Mùa hè tôi có một việc làm ở khách sạn." }, usage_vi: "Từ mượn tiếng Anh, khẩu ngữ. Công việc chính thức dùng „die Arbeit“, „die Stelle“.", lesson_refs: [a1.m10.l01] }
  - { id: a1.m10.v.studieren, de: "studieren", pos: verb, forms: { er: "studiert", perfekt: "hat studiert" }, vi: "học đại học, học ngành", ipa: "/ʃtuˈdiːʁən/", example: { de: "Meine Freundin studiert Medizin.", vi: "Bạn gái tôi học ngành y." }, usage_vi: "Động từ đuôi -ieren: Partizip II không có „ge-“.", lesson_refs: [a1.m10.l01] }
  # ---- Bài 2: Mein Tag ----
  - { id: a1.m10.v.fruehstuecken, de: "frühstücken", pos: verb, forms: { er: "frühstückt", perfekt: "hat gefrühstückt" }, vi: "ăn sáng", ipa: "/ˈfʁyːʃtʏkn̩/", example: { de: "Wir frühstücken um halb acht.", vi: "Chúng tôi ăn sáng lúc bảy rưỡi." }, usage_vi: "Danh từ: das Frühstück. Partizip II: gefrühstückt (có ge-).", lesson_refs: [a1.m10.l02] }
  - { id: a1.m10.v.kochen, de: "kochen", pos: verb, forms: { er: "kocht", perfekt: "hat gekocht" }, vi: "nấu ăn", ipa: "/ˈkɔxn̩/", example: { de: "Am Abend kocht er für die Familie.", vi: "Buổi tối anh ấy nấu cơm cho cả nhà." }, usage_vi: "Động từ có quy tắc: gekocht.", lesson_refs: [a1.m10.l02] }
  - { id: a1.m10.v.lernen, de: "lernen", pos: verb, forms: { er: "lernt", perfekt: "hat gelernt" }, vi: "học", ipa: "/ˈlɛʁnən/", example: { de: "Ich lerne jeden Tag eine Stunde Deutsch.", vi: "Mỗi ngày tôi học tiếng Đức một tiếng." }, usage_vi: "Phân biệt: lernen (học bài, tập) và studieren (học đại học).", lesson_refs: [a1.m10.l02] }
  - { id: a1.m10.v.aufraeumen, de: "aufräumen", pos: verb, forms: { er: "räumt auf", separable: true, perfekt: "hat aufgeräumt" }, vi: "dọn dẹp", ipa: "/ˈaʊfˌʁɔɪmən/", example: { de: "Am Samstag räume ich die Wohnung auf.", vi: "Thứ Bảy tôi dọn dẹp căn hộ." }, usage_vi: "Động từ tách: Partizip II chèn „ge“ vào giữa: auf-ge-räumt.", lesson_refs: [a1.m10.l02] }
  - { id: a1.m10.v.putzen, de: "putzen", pos: verb, forms: { er: "putzt", perfekt: "hat geputzt" }, vi: "lau chùi, vệ sinh", ipa: "/ˈpʊʦn̩/", example: { de: "Meine Mutter putzt das Bad.", vi: "Mẹ tôi lau phòng tắm." }, usage_vi: "Hay dùng: das Bad putzen, die Fenster putzen.", lesson_refs: [a1.m10.l02] }
  - { id: a1.m10.v.spielen, de: "spielen", pos: verb, forms: { er: "spielt", perfekt: "hat gespielt" }, vi: "chơi", ipa: "/ˈʃpiːlən/", example: { de: "Die Kinder spielen im Garten.", vi: "Bọn trẻ chơi trong vườn." }, usage_vi: "Dùng cho trò chơi, nhạc cụ, thể thao: Fußball spielen.", lesson_refs: [a1.m10.l02] }
  - { id: a1.m10.v.morgens, de: "morgens", pos: adverb, vi: "vào buổi sáng, mỗi sáng", ipa: "/ˈmɔʁɡn̩s/", example: { de: "Morgens trinke ich Tee.", vi: "Buổi sáng tôi uống trà." }, usage_vi: "Chỉ thói quen lặp lại. Tương tự: mittags, abends.", lesson_refs: [a1.m10.l02] }
  - { id: a1.m10.v.mittags, de: "mittags", pos: adverb, vi: "vào buổi trưa", ipa: "/ˈmɪtaːks/", example: { de: "Mittags essen wir in der Kantine.", vi: "Buổi trưa chúng tôi ăn ở căng-tin." }, usage_vi: "Giờ trưa khoảng 12–14 giờ.", lesson_refs: [a1.m10.l02] }
  - { id: a1.m10.v.abends, de: "abends", pos: adverb, vi: "vào buổi tối", ipa: "/ˈaːbn̩ts/", example: { de: "Abends lese ich ein Buch.", vi: "Buổi tối tôi đọc sách." }, usage_vi: "Thói quen lặp lại.", lesson_refs: [a1.m10.l02] }
  - { id: a1.m10.v.gestern, de: "gestern", pos: adverb, vi: "hôm qua", ipa: "/ˈɡɛstɐn/", example: { de: "Gestern habe ich lange gearbeitet.", vi: "Hôm qua tôi đã làm việc rất lâu." }, usage_vi: "Dấu hiệu của Perfekt. „gestern Abend“ = tối qua.", lesson_refs: [a1.m10.l02] }
  - { id: a1.m10.v.danach, de: "danach", pos: adverb, vi: "sau đó", ipa: "/daˈnaːx/", example: { de: "Zuerst koche ich, danach räume ich auf.", vi: "Trước tiên tôi nấu ăn, sau đó tôi dọn dẹp." }, usage_vi: "Đứng vị trí 1 thì động từ ở vị trí 2: Danach räume ich auf.", lesson_refs: [a1.m10.l02] }
  # ---- Bài 3: So war das ----
  - { id: a1.m10.v.sehen, de: "sehen", pos: verb, forms: { er: "sieht", perfekt: "hat gesehen" }, vi: "nhìn thấy, xem", ipa: "/ˈzeːən/", example: { de: "Wir haben einen Film gesehen.", vi: "Chúng tôi đã xem một bộ phim." }, usage_vi: "Bất quy tắc: du siehst, er sieht. Partizip II: gesehen.", lesson_refs: [a1.m10.l03] }
  - { id: a1.m10.v.lesen, de: "lesen", pos: verb, forms: { er: "liest", perfekt: "hat gelesen" }, vi: "đọc", ipa: "/ˈleːzn̩/", example: { de: "Ich habe gestern ein Buch gelesen.", vi: "Hôm qua tôi đã đọc một quyển sách." }, usage_vi: "Bất quy tắc: du liest, er liest. Partizip II: gelesen.", lesson_refs: [a1.m10.l03] }
  - { id: a1.m10.v.essen, de: "essen", pos: verb, forms: { er: "isst", perfekt: "hat gegessen" }, vi: "ăn", ipa: "/ˈɛsn̩/", example: { de: "Wir haben im Restaurant gegessen.", vi: "Chúng tôi đã ăn ở nhà hàng." }, usage_vi: "Bất quy tắc: du isst, er isst. Partizip II: gegessen.", lesson_refs: [a1.m10.l03] }
  - { id: a1.m10.v.trinken, de: "trinken", pos: verb, forms: { er: "trinkt", perfekt: "hat getrunken" }, vi: "uống", ipa: "/ˈtʁɪŋkn̩/", example: { de: "Er hat zu viel Kaffee getrunken.", vi: "Anh ấy đã uống quá nhiều cà phê." }, usage_vi: "Partizip II: getrunken (đổi nguyên âm).", lesson_refs: [a1.m10.l03] }
  - { id: a1.m10.v.treffen, de: "treffen", pos: verb, forms: { er: "trifft", perfekt: "hat getroffen" }, vi: "gặp (ai đó)", ipa: "/ˈtʁɛfn̩/", example: { de: "Ich habe meine Freunde am Wochenende getroffen.", vi: "Tôi đã gặp bạn bè vào cuối tuần." }, usage_vi: "Bất quy tắc: du triffst, er trifft. Đi với Akkusativ.", lesson_refs: [a1.m10.l03] }
  - { id: a1.m10.v.finden, de: "finden", pos: verb, forms: { er: "findet", perfekt: "hat gefunden" }, vi: "tìm thấy; thấy (cho rằng)", ipa: "/ˈfɪndn̩/", example: { de: "Ich habe den Schlüssel nicht gefunden.", vi: "Tôi đã không tìm thấy chìa khóa." }, usage_vi: "Partizip II: gefunden. Thân kết thúc -d nên du findest, er findet.", lesson_refs: [a1.m10.l03] }
  - { id: a1.m10.v.schlafen, de: "schlafen", pos: verb, forms: { er: "schläft", perfekt: "hat geschlafen" }, vi: "ngủ", ipa: "/ˈʃlaːfn̩/", example: { de: "Das Baby hat acht Stunden geschlafen.", vi: "Em bé đã ngủ tám tiếng." }, usage_vi: "Bất quy tắc: du schläfst, er schläft.", lesson_refs: [a1.m10.l03] }
  - { id: a1.m10.v.telefonieren, de: "telefonieren", pos: verb, forms: { er: "telefoniert", perfekt: "hat telefoniert" }, vi: "nói chuyện điện thoại", ipa: "/telefoˈniːʁən/", example: { de: "Sie hat lange mit ihrer Mutter telefoniert.", vi: "Cô ấy đã nói chuyện điện thoại lâu với mẹ." }, usage_vi: "Đuôi -ieren: Partizip II không có „ge-“: telefoniert.", lesson_refs: [a1.m10.l03] }
  - { id: a1.m10.v.fotografieren, de: "fotografieren", pos: verb, forms: { er: "fotografiert", perfekt: "hat fotografiert" }, vi: "chụp ảnh", ipa: "/fotoɡʁaˈfiːʁən/", example: { de: "Wir haben die Stadt fotografiert.", vi: "Chúng tôi đã chụp ảnh thành phố." }, usage_vi: "Đuôi -ieren: fotografiert (không có „ge-“).", lesson_refs: [a1.m10.l03] }
  # ---- Bài 4: Ein Anruf ----
  - { id: a1.m10.v.anruf, de: "Anruf", pos: noun, article: der, plural: "Anrufe", vi: "cuộc gọi", ipa: "/ˈanˌʁuːf/", example: { de: "Der Anruf kommt von meinem Chef.", vi: "Cuộc gọi này là của sếp tôi." }, usage_vi: "Từ động từ anrufen. „einen Anruf bekommen“ sẽ học ở Kapitel 11.", lesson_refs: [a1.m10.l04] }
  - { id: a1.m10.v.nachricht, de: "Nachricht", pos: noun, article: die, plural: "Nachrichten", vi: "tin nhắn, thông điệp", ipa: "/ˈnaːxˌʁɪçt/", example: { de: "Ich schreibe eine Nachricht.", vi: "Tôi viết một tin nhắn." }, usage_vi: "Số nhiều „Nachrichten“ còn là bản tin thời sự. „ch“ sau a đọc /x/.", lesson_refs: [a1.m10.l04] }
  - { id: a1.m10.v.gespraech, de: "Gespräch", pos: noun, article: das, plural: "Gespräche", vi: "cuộc trò chuyện", ipa: "/ɡəˈʃpʁɛːç/", example: { de: "Das Gespräch war kurz, aber nett.", vi: "Cuộc trò chuyện ngắn nhưng dễ chịu." }, usage_vi: "Số nhiều có Umlaut: Gespräche. Phát âm „sp“ /ʃp/.", lesson_refs: [a1.m10.l04] }
  - { id: a1.m10.v.handy, de: "Handy", pos: noun, article: das, plural: "Handys", vi: "điện thoại di động", ipa: "/ˈhɛndi/", example: { de: "Mein Handy ist leer.", vi: "Điện thoại của tôi hết pin." }, usage_vi: "Từ „Handy“ chỉ dùng ở tiếng Đức (không phải tiếng Anh). Số nhiều: Handys.", lesson_refs: [a1.m10.l04] }
  - { id: a1.m10.v.zurueckrufen, de: "zurückrufen", pos: verb, forms: { er: "ruft zurück", separable: true, perfekt: "hat zurückgerufen" }, vi: "gọi lại", ipa: "/tsuˈʁʏkˌʁuːfn̩/", example: { de: "Ich rufe Sie morgen zurück.", vi: "Ngày mai tôi sẽ gọi lại cho ông/bà." }, usage_vi: "Động từ tách: „zurück“ ở cuối câu. Partizip II: zurückgerufen.", lesson_refs: [a1.m10.l04] }
  - { id: a1.m10.v.besetzt, de: "besetzt", pos: adjective, vi: "máy bận; chỗ có người", ipa: "/bəˈzɛʦt/", example: { de: "Die Leitung ist leider besetzt.", vi: "Tiếc là đường dây đang bận." }, usage_vi: "Dùng khi gọi điện bận hoặc chỗ ngồi có người.", lesson_refs: [a1.m10.l04] }
  - { id: a1.m10.v.moment, de: "Einen Moment, bitte.", pos: phrase, vi: "Xin đợi một chút.", ipa: "/ˈaɪnən moˈmɛnt ˈbɪtə/", example: { de: "Einen Moment, bitte. Ich verbinde Sie.", vi: "Xin đợi một chút. Tôi nối máy cho ông/bà." }, usage_vi: "Câu thường nói khi nghe điện thoại. „verbinden“ chỉ học thuộc trong cụm này.", lesson_refs: [a1.m10.l04] }
  - { id: a1.m10.v.am-apparat, de: "am Apparat", pos: phrase, vi: "(đang) nghe máy", ipa: "/am apaˈʁaːt/", example: { de: "Müller am Apparat.", vi: "Müller đang nghe máy." }, usage_vi: "Cách nói khi nghe điện thoại: „Hier ist …“ / „… am Apparat.“", lesson_refs: [a1.m10.l04] }
