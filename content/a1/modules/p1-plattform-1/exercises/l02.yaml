      right: Hanoi
    explanation_vi: Thụy Sĩ không có thủ đô chính thức; Bern là thành phố liên bang.
- id: a1.p1.l02.ex.02
  type: multiple-choice
  skill: reading
  difficulty: 1
  objective_refs:
  - a1.p1.l02.obj2
  instructions_vi: Đọc ba Steckbrief. Chọn đáp án đúng.
  stimulus:
    ref: a1.p1.l02.b6
  items:
  - id: a1.p1.l02.ex.02.q1
    prompt: Ai sinh ra ở Ulm?
    options:
    - id: a
      text: Federer
    - id: b
      text: Einstein
    - id: c
      text: Mozart
    answer:
    - b
    explanation_vi: 'Geburtsort: Ulm.'
  - id: a1.p1.l02.ex.02.q2
    prompt: Mozart làm nghề gì?
    options:
    - id: a
      text: Tennisspieler
    - id: b
      text: Komponist
    - id: c
      text: Physiker
    answer:
    - b
    explanation_vi: 'Beruf: Komponist.'
  - id: a1.p1.l02.ex.02.q3
    prompt: Federer đến từ nước nào?
    options:
    - id: a
      text: Deutschland
    - id: b
      text: die Schweiz
    - id: c
      text: Österreich
    answer:
    - b
    explanation_vi: Basel (Schweiz).
