- id: a1.p1.l02.ex.04
  type: sentence-construction
  skill: grammar
  difficulty: 2
  objective_refs:
  - a1.p1.l02.obj3
  instructions_vi: Biến mục Steckbrief thành câu.
  items:
  - id: a1.p1.l02.ex.04.q1
    prompt_vi: 'Einstein – Beruf: Physiker'
    answers:
    - Er ist Physiker.
    - Einstein ist Physiker.
    explanation_vi: Nghề không mạo từ.
  - id: a1.p1.l02.ex.04.q2
    prompt_vi: 'Federer – Land: die Schweiz'
    answers:
    - Er kommt aus der Schweiz.
    - Federer kommt aus der Schweiz.
    explanation_vi: aus der Schweiz.
- id: a1.p1.l02.ex.05
  type: speaking-practice
  skill: speaking
  difficulty: 2
  objective_refs:
  - a1.p1.l02.obj3
  instructions_vi: Ghi âm phần giới thiệu người nổi tiếng (phần Nói).
  grading: self
  rubric:
  - criterion_vi: 'Đủ 4 thông tin: tên, quê, nghề, nổi tiếng'
    points: 2
  - criterion_vi: er/sie và động từ đúng
    points: 2
  items:
  - id: a1.p1.l02.ex.05.q1
    prompt_vi: Người nổi tiếng bạn thích
    model_answer:
      de: Das ist Son Tung M-TP. Er kommt aus Vietnam, aus Thai Binh. Er ist Sänger. Er ist in Vietnam sehr bekannt.
    explanation_vi: So sánh với mẫu.
- id: a1.p1.l02.ex.06
  type: writing-practice
  skill: writing
  difficulty: 1
  objective_refs:
  - a1.p1.l02.obj2
  - a1.p1.l02.obj3
  instructions_vi: Viết Steckbrief và 3 câu giới thiệu (phần Viết).
  grading: self
  rubric:
  - criterion_vi: Steckbrief 4 mục
    points: 2
  - criterion_vi: 3 câu đúng ngữ pháp
    points: 2
  items:
  - id: a1.p1.l02.ex.06.q1
    prompt_vi: Steckbrief + 3 câu
    model_answer:
      de: 'Name: Ho Xuan Huong · Land: Vietnam · Beruf: Dichterin · Bekannt für: Gedichte. – Ho Xuan Huong kommt aus Vietnam. Sie ist Dichterin. Sie ist sehr bekannt.'
    explanation_vi: die Dichterin = nữ nhà thơ; das Gedicht, die Gedichte = bài thơ.
