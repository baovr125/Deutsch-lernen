  instructions_vi: Nối nước với thủ đô / thành phố liên bang.
  items:
  - id: a1.p1.l02.ex.01.q1
    pairs:
    - left: Deutschland
      right: Berlin
    - left: Österreich
      right: Wien
    - left: die Schweiz
      right: Bern (Bundesstadt)
