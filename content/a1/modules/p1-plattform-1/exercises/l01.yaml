exercises:
- id: a1.p1.l01.ex.01
  type: multiple-choice
  skill: vocabulary
  difficulty: 1
  objective_refs:
  - a1.p1.l01.obj1
  instructions_vi: 'Quiz – Phần 1: Từ vựng.'
  items:
  - id: a1.p1.l01.ex.01.q1
    prompt: '„Woher kommen Sie?“ hỏi về:'
    options:
    - id: a
      text: nghề
    - id: b
      text: quê quán
    - id: c
      text: nơi ở
    answer:
    - b
    explanation_vi: woher = từ đâu (Kapitel 1).
  - id: a1.p1.l01.ex.01.q2
    prompt: Từ nào KHÔNG phải nghề?
    options:
    - id: a
      text: Kirche
    - id: b
      text: Lehrerin
    - id: c
      text: Kellner
    answer:
    - a
    explanation_vi: die Kirche = nhà thờ (Kapitel 3).
  - id: a1.p1.l01.ex.01.q3
    prompt: Từ nào KHÔNG phải phương tiện?
    options:
    - id: a
      text: der Turm
    - id: b
      text: die S-Bahn
    - id: c
      text: das Fahrrad
    answer:
    - a
    explanation_vi: der Turm = tòa tháp.
  - id: a1.p1.l01.ex.01.q4
    prompt: '„Am Wochenende“ nghĩa là:'
    options:
    - id: a
      text: vào cuối tuần
    - id: b
      text: vào tháng sau
    - id: c
      text: vào buổi tối
    answer:
    - a
    explanation_vi: das Wochenende (Kapitel 2).
- id: a1.p1.l01.ex.02
  type: fill-blank
  skill: grammar
  difficulty: 2
  objective_refs:
  - a1.p1.l01.obj2
  instructions_vi: 'Quiz – Phần 2: Chia động từ.'
  items:
  - id: a1.p1.l01.ex.02.q1
    prompt: Woher ___ du? (kommen)
    answers:
    - kommst
    explanation_vi: du → -st.
  - id: a1.p1.l01.ex.02.q2
    prompt: Er ___ Englisch. (sprechen)
    answers:
    - spricht
    explanation_vi: e → i.
  - id: a1.p1.l01.ex.02.q3
    prompt: ___ ihr am Samstag frei? (haben)
    answers:
    - Habt
    explanation_vi: ihr habt.
  - id: a1.p1.l01.ex.02.q4
    prompt: Da ___ Sie das Rathaus. (sehen)
    answers:
    - sehen
    explanation_vi: Sie sehen.
  - id: a1.p1.l01.ex.02.q5
    prompt: Wir ___ Studenten. (sein)
    answers:
    - sind
    explanation_vi: wir sind.
- id: a1.p1.l01.ex.03
  type: fill-blank
  skill: grammar
  difficulty: 2
  objective_refs:
  - a1.p1.l01.obj2
  instructions_vi: 'Quiz – Phần 3: Mạo từ (der/die/das, ein/eine, kein/keine).'
  items:
  - id: a1.p1.l01.ex.03.q1
    prompt: Das ist ___ Bahnhof. ___ Bahnhof ist groß.
    answers:
    - ein
    - Der
    explanation_vi: ein → Der (lần thứ hai).
  - id: a1.p1.l01.ex.03.q2
    prompt: Ich habe ___ Fahrkarte.
    answers:
    - keine
    explanation_vi: die Fahrkarte → keine.
  - id: a1.p1.l01.ex.03.q3
    prompt: ___ Rechnung, bitte!
    answers:
    - Die
    explanation_vi: die Rechnung.
- id: a1.p1.l01.ex.04
  type: matching
  skill: grammar
  difficulty: 1
  objective_refs:
  - a1.p1.l01.obj2
  - a1.p1.l01.obj3
  instructions_vi: 'Quiz – Phần 4: Nối câu hỏi với câu trả lời.'
  items:
  - id: a1.p1.l01.ex.04.q1
    pairs:
    - left: Wie alt sind Sie?
      right: Ich bin 34.
    - left: Was sind Sie von Beruf?
      right: Ich bin Koch.
    - left: Was machen Sie gern?
      right: Ich fotografiere gern.
    - left: Wo wohnen Sie?
      right: In Graz.
    - left: Haben Sie ein Auto?
      right: Nein, ich habe kein Auto.
    explanation_vi: Ôn các câu hỏi chính của Kapitel 1–3.
- id: a1.p1.l01.ex.05
  type: true-false
  skill: listening
  difficulty: 2
  objective_refs:
  - a1.p1.l01.obj1
  - a1.p1.l01.obj3
  instructions_vi: Nghe hội thoại ở tiệc (tốc độ bình thường). Đúng hay sai?
  stimulus:
    ref: a1.p1.l01.b5
  items:
  - id: a1.p1.l01.ex.05.q1
    prompt: Hoa học tin học.
    answer: true
    explanation_vi: „Ich studiere Informatik.“
  - id: a1.p1.l01.ex.05.q2
    prompt: Jonas là kỹ sư.
    answer: false
    explanation_vi: „Ich bin Lehrer.“
  - id: a1.p1.l01.ex.05.q3
    prompt: Hoa rất thích chơi bóng rổ.
    answer: false
    explanation_vi: „Nein, ich spiele nicht so gern. Aber ich schwimme sehr gern!“
- id: a1.p1.l01.ex.06
  type: multiple-choice
  skill: reading
  difficulty: 1
  objective_refs:
  - a1.p1.l01.obj1
  - a1.p1.l01.obj3
  instructions_vi: Đọc hồ sơ của Felix. Chọn đáp án đúng.
  stimulus:
    ref: a1.p1.l01.b6
  items:
  - id: a1.p1.l01.ex.06.q1
    prompt: Felix làm nghề gì?
    options:
    - id: a
      text: Lehrer
    - id: b
      text: Ingenieur
    - id: c
      text: Koch
    answer:
    - b
    explanation_vi: '„Beruf: Ingenieur …“'
  - id: a1.p1.l01.ex.06.q2
    prompt: Felix muốn học ngôn ngữ nào?
    options:
    - id: a
      text: Spanisch
    - id: b
      text: Vietnamesisch
    - id: c
      text: Englisch
    answer:
    - b
    explanation_vi: „… einen Tandempartner für Vietnamesisch!“
  - id: a1.p1.l01.ex.06.q3
    prompt: Felix rảnh khi nào?
    options:
    - id: a
      text: am Wochenende
    - id: b
      text: Montag und Dienstag
    - id: c
      text: Mittwoch und Freitag
    answer:
    - c
    explanation_vi: „… am Mittwoch und am Freitag Zeit.“
- id: a1.p1.l01.ex.07
  type: word-order
  skill: grammar
  difficulty: 2
  objective_refs:
  - a1.p1.l01.obj2
  instructions_vi: 'Quiz – Phần 5: Sắp xếp câu.'
  items:
  - id: a1.p1.l01.ex.07.q1
    tokens:
    - Sie
    - Sprachen
    - sprechen
    - Welche
    answer: Welche Sprachen sprechen Sie?
    explanation_vi: W-Frage.
  - id: a1.p1.l01.ex.07.q2
    tokens:
    - du
    - gern
    - Spielst
    - Tennis
    answer: Spielst du gern Tennis?
    explanation_vi: Ja/Nein-Frage.
  - id: a1.p1.l01.ex.07.q3
    tokens:
    - Sie
    - links
    - Gehen
    - dann
    answer: Gehen Sie dann links.
    explanation_vi: Imperativ mit Sie.
- id: a1.p1.l01.ex.08
  type: speaking-practice
  skill: speaking
  difficulty: 2
  objective_refs:
  - a1.p1.l01.obj3
  instructions_vi: Ghi âm phần giới thiệu hoàn chỉnh 8 câu (phần Nói).
  grading: self
  rubric:
  - criterion_vi: Đủ 8 thông tin
    points: 4
  - criterion_vi: Động từ chia đúng, vị trí 2
    points: 2
  - criterion_vi: Nói trôi chảy, không nhìn giấy
    points: 2
  items:
  - id: a1.p1.l01.ex.08.q1
    prompt_vi: Giới thiệu hoàn chỉnh
    model_answer:
      de: Ich heiße Lan Pham. Ich bin 25 Jahre alt. Ich komme aus Vietnam und wohne in Leipzig. Ich spreche Vietnamesisch, Englisch und ein bisschen Deutsch. Ich bin Krankenpflegerin. Ich koche gern und schwimme gern. Ich habe kein Auto – ich fahre Fahrrad.
    explanation_vi: So sánh với mẫu.
- id: a1.p1.l01.ex.09
  type: writing-practice
  skill: writing
  difficulty: 2
  objective_refs:
  - a1.p1.l01.obj3
  instructions_vi: Viết hồ sơ tandem của bạn (phần Viết).
  grading: self
  rubric:
  - criterion_vi: Đủ 8 mục
    points: 4
  - criterion_vi: Câu đúng ngữ pháp (gern, am, nghề không mạo từ)
    points: 2
  items:
  - id: a1.p1.l01.ex.09.q1
    prompt_vi: Hồ sơ tandem
    model_answer:
      de: 'Name: Minh Tran · Alter: 26 · Land: Vietnam · Wohnort: Hamburg · Beruf: Informatiker · Sprachen: Vietnamesisch, Englisch, ein bisschen Deutsch · Hobbys: Ich koche sehr gern. Ich spiele gern Fußball. · Ich suche: einen Tandempartner für Deutsch. Ich habe am Samstag Zeit.'
    explanation_vi: So sánh với hồ sơ của Felix.
