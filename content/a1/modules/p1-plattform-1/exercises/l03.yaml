- id: a1.p1.l03.ex.04
  type: matching
  skill: reading
  difficulty: 1
  objective_refs:
  - a1.p1.l03.obj3
  instructions_vi: Nối từ khóa trên thẻ với câu trả lời phù hợp.
  stimulus:
    ref: a1.p1.l03.b9
  items:
  - id: a1.p1.l03.ex.04.q1
    pairs:
    - left: Name?
      right: Ich heiße Minh Tran.
    - left: Alter?
      right: Ich bin 26 Jahre alt.
    - left: Land?
      right: Ich komme aus Vietnam.
    - left: Wohnort?
      right: Ich wohne in Hamburg.
    - left: Beruf?
      right: Ich bin Informatiker.
    - left: Hobby?
      right: Ich spiele gern Fußball.
    explanation_vi: Mỗi từ khóa → một câu hoàn chỉnh.
- id: a1.p1.l03.ex.05
  type: true-false
  skill: reading
  difficulty: 1
  objective_refs:
  - a1.p1.l03.obj1
  instructions_vi: 'Chiến lược thi: đúng hay sai?'
  items:
  - id: a1.p1.l03.ex.05.q1
    prompt: Ở Hören Teil 1, nên đọc câu hỏi và các lựa chọn trước khi nghe.
    answer: true
    explanation_vi: Giúp biết cần nghe thông tin gì.
  - id: a1.p1.l03.ex.05.q2
    prompt: Nếu nghe thấy một lựa chọn trong hội thoại thì đó chắc chắn là đáp án.
    answer: false
    explanation_vi: 'Bẫy: hội thoại thường nhắc cả 3 lựa chọn.'
  - id: a1.p1.l03.ex.05.q3
    prompt: Trong phần thi nói, được phép nói „Noch einmal, bitte“ khi không hiểu.
    answer: true
    explanation_vi: Đây là kỹ năng giao tiếp A1 (A1.SI3).
- id: a1.p1.l03.ex.06
  type: speaking-practice
  skill: speaking
  difficulty: 2
  objective_refs:
  - a1.p1.l03.obj3
  instructions_vi: Ghi âm phần thi thử Sprechen Teil 1 (phần Nói). Tự chấm theo tiêu chí.
  grading: self
  rubric:
  - criterion_vi: Trả lời đủ 7 từ khóa bằng câu hoàn chỉnh
    points: 4
  - criterion_vi: Đánh vần tên đúng
    points: 1
  - criterion_vi: Đọc số điện thoại đúng, rõ
    points: 1
  items:
  - id: a1.p1.l03.ex.06.q1
    prompt_vi: Sprechen Teil 1
    model_answer:
      de: 'Ich heiße Lan Nguyen. Ich bin 25 Jahre alt. Ich komme aus Vietnam. Ich wohne in Leipzig. Ich spreche Vietnamesisch, Englisch und ein bisschen Deutsch. Ich bin Studentin. Mein Hobby ist Kochen. – Lan: L – A – N. Nguyen: N – G – U – Y – E – N. – Meine Telefonnummer ist null, eins, sieben, sechs, zwo, vier, acht, fünf, null, drei.'
    explanation_vi: So sánh với mẫu ở phần Nói.
