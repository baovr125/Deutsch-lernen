  - a1.p1.l03.obj2
  instructions_vi: Hören Teil 1 – Hội thoại 1. Đọc câu hỏi trước, sau đó nghe hai lần.
  stimulus:
    ref: a1.p1.l03.b6
  items:
  - id: a1.p1.l03.ex.01.q1
    prompt: Wann ist der neue Termin?
    options:
    - id: a
      text: am Montag
    - id: b
      text: am Donnerstag
    - id: c
      text: am Mittwoch
    answer:
    - b
    explanation_vi: Cả ba ngày đều được nhắc đến; Montag không được, Mittwoch anh ấy làm việc → Donnerstag.
