  type: multiple-choice
  skill: listening
  difficulty: 2
  objective_refs:
  - a1.p1.l03.obj1
  - a1.p1.l03.obj2
  instructions_vi: Hören Teil 1 – Hội thoại 2.
  stimulus:
    ref: a1.p1.l03.b7
  items:
