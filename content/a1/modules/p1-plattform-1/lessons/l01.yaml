summary_vi: 'Ôn Kapitel 1–3: giới thiệu bản thân đầy đủ (tên, tuổi, quê, nơi ở, ngôn ngữ, nghề, sở thích, phương tiện); chia động từ; câu hỏi W- và có/không; der/die/das – ein/eine – kein/keine; Imperativ mit Sie.'
self_check:
- Tôi giới thiệu được bản thân bằng 8 câu không cần nhìn giấy.
- Tôi trả lời đúng ít nhất 80% câu đố.
- Tôi biết phần nào cần ôn lại (xem kết quả từng phần của Quiz).
blocks:
- id: a1.p1.l01.b1
  kind: explanation
  title_vi: Giới thiệu bài học
  body_vi: '**Chúc mừng!** Bạn đã học xong ba Kapitel đầu. Đây là lúc **ôn tập và kết nối** mọi thứ:

    tên, quê, nơi ở, ngôn ngữ (Kapitel 1) – sở thích, nghề, tuổi (Kapitel 2) – thành phố, phương tiện, mùa (Kapitel 3).


    Bài này có dạng **câu đố (Quiz)** để bạn tự kiểm tra nhanh. Câu nào sai, hãy xem phần giải thích và quay lại bài tương ứng.

    Cuối bài, bạn viết và nói một **lời giới thiệu hoàn chỉnh** dùng kiến thức của cả ba Kapitel.'
- id: a1.p1.l01.b2
  kind: explanation
  title_vi: Bản đồ kiến thức Kapitel 1–3
  skill: grammar
  body_vi: '| Chủ đề | Câu hỏi | Trả lời mẫu |

    |---|---|---|

    | Tên | Wie heißen Sie? | Ich heiße … |

    | Quê | Woher kommen Sie? | Ich komme aus … |

    | Nơi ở | Wo wohnen Sie? | Ich wohne in … |

    | Ngôn ngữ | Welche Sprachen sprechen Sie? | Ich spreche … |

    | Tuổi | Wie alt sind Sie? | Ich bin … (Jahre alt). |

    | Nghề | Was sind Sie von Beruf? | Ich bin … / Ich arbeite bei … |

    | Sở thích | Was machen Sie gern? | Ich … gern. |

    | Phương tiện | Wie kommen Sie zum Kurs? | Ich fahre Fahrrad. / Ich gehe zu Fuß. |

    '
  examples:
  - de: Ich heiße Lan, ich bin 25 und komme aus Vietnam.
    vi: Tôi tên Lan, 25 tuổi, đến từ Việt Nam.
- id: a1.p1.l01.b3
  kind: pronunciation
  title_vi: Ôn những âm khó nhất của Kapitel 1–3
  skill: pronunciation
  body_vi: 'Ôn những âm khó nhất của Kapitel 1–3


    ich [ç] – acht [x]; ü (tschüs, Brücke) – ö (schön, Österreich); z [ts] (zwei, Zug); sp/st [ʃp/ʃt] (sprechen, Stadt); w [v] – v [f] (wo, vier); phụ âm cuối rõ (Text, rechts, Herbst).


    Luyện tập: Đọc chậm câu ví dụ 3 lần, rồi ghi âm.'
  items:
  - de: Ich spreche Deutsch und fahre zwei Stationen mit dem Zug.
    vi: Tôi nói tiếng Đức và đi tàu hai trạm.
    ipa: '[ɪç ˈʃpʁɛçə dɔʏ̯tʃ ʊnt ˈfaːʁə tsvaɪ̯ ʃtaˈtsi̯oːnən mɪt deːm tsuːk]'
- id: a1.p1.l01.b4
  kind: examples
  title_vi: Câu ví dụ
  examples:
  - de: Mein Name ist Lan Pham. Ich komme aus Vietnam und wohne in Leipzig.
    vi: Tên tôi là Lan Phạm. Tôi đến từ Việt Nam và sống ở Leipzig.
  - de: Ich bin Krankenpflegerin und arbeite im Krankenhaus.
    vi: Tôi là điều dưỡng và làm ở bệnh viện.
  - de: Ich koche gern und lese viel.
    vi: Tôi thích nấu ăn và đọc nhiều.
  - de: Ich habe kein Auto. Ich fahre Fahrrad.
    vi: Tôi không có ô tô. Tôi đi xe đạp.
- id: a1.p1.l01.b5
  kind: listening
  title_vi: Làm quen ở tiệc
  lines:
  - speaker: Jonas
    de: Hallo! Ich bin Jonas. Und du?
    vi: Chào! Mình là Jonas. Còn bạn?
  - speaker: Hoa
    de: Ich heiße Hoa. Ich komme aus Vietnam, aus Hue.
    vi: Mình tên Hoa. Mình đến từ Việt Nam, từ Huế.
  - speaker: Jonas
    de: Was machst du in Leipzig?
    vi: Bạn làm gì ở Leipzig?
  - speaker: Hoa
    de: Ich studiere Informatik. Und du? Was bist du von Beruf?
    vi: Mình học tin học. Còn bạn? Bạn làm nghề gì?
  - speaker: Jonas
    de: Ich bin Lehrer. Am Wochenende spiele ich gern Basketball. Spielst du auch?
    vi: Mình là giáo viên. Cuối tuần mình thích chơi bóng rổ. Bạn có chơi không?
  - speaker: Hoa
    de: Nein, ich spiele nicht so gern. Aber ich schwimme sehr gern!
    vi: Không, mình không thích chơi lắm. Nhưng mình rất thích bơi!
  audio_status: pending-tts
  situation_vi: Hai người làm quen ở một bữa tiệc của lớp tiếng Đức.
  skill: listening
  audio:
    speed: normal
- id: a1.p1.l01.b6
  kind: reading
  title_vi: Hồ sơ trên trang tìm bạn học tandem
  paragraphs:
  - de: 'Name: Felix Wagner · Alter: 31 · Land: Österreich · Wohnort: Graz

      Beruf: Ingenieur bei einer Firma in Graz

      Sprachen: Deutsch, Englisch, ein bisschen Spanisch

      Hobbys: Ich reise sehr gern und fotografiere gern. Ich koche nicht so gern.

      Ich suche: einen Tandempartner für Vietnamesisch! Ich habe am Mittwoch und am Freitag Zeit.'
    vi: 'Tên: Felix Wagner · Tuổi: 31 · Nước: Áo · Nơi ở: Graz

      Nghề: kỹ sư ở một công ty tại Graz

      Ngôn ngữ: tiếng Đức, tiếng Anh, một chút tiếng Tây Ban Nha

      Sở thích: Tôi rất thích du lịch và thích chụp ảnh. Tôi không thích nấu ăn lắm.

      Tôi tìm: một bạn học tandem cho tiếng Việt! Tôi rảnh vào thứ Tư và thứ Sáu.'
  text_type_vi: Hồ sơ cá nhân
  skill: reading
  glossary:
  - de: das Alter
    vi: tuổi
  - de: die Zeit
    vi: thời gian
- id: a1.p1.l01.b7
  kind: speaking
  title_vi: Giới thiệu hoàn chỉnh
  skill: speaking
  task_vi: 'Nói 8 câu giới thiệu bản thân theo bản đồ kiến thức: tên, tuổi, quê, nơi ở, ngôn ngữ, nghề, sở thích, phương tiện.'
  steps_vi:
  - Nhìn bảng ở phần Ngữ pháp, chuẩn bị 8 câu trả lời.
  - Nói không nhìn giấy, ghi âm.
  lines:
  - speaker: Lan
    de: Ich heiße Lan Pham. Ich bin 25 Jahre alt. Ich komme aus Vietnam und wohne in Leipzig. Ich spreche Vietnamesisch, Englisch und ein bisschen Deutsch. Ich bin Krankenpflegerin. Ich koche gern und schwimme gern. Ich habe kein Auto – ich fahre Fahrrad.
    vi: Tôi tên Lan Phạm. Tôi 25 tuổi. Tôi đến từ Việt Nam và sống ở Leipzig. Tôi nói tiếng Việt, tiếng Anh và một chút tiếng Đức. Tôi là điều dưỡng. Tôi thích nấu ăn và bơi. Tôi không có ô tô – tôi đi xe đạp.
- id: a1.p1.l01.b8
  kind: writing
  title_vi: Hồ sơ tandem của bạn
  skill: writing
  task_vi: 'Viết hồ sơ giống của Felix (phần Đọc) với thông tin của bạn: tên, tuổi, nước, nơi ở, nghề, ngôn ngữ, sở thích, thời gian rảnh.'
  model:
    de: 'Name: Minh Tran · Alter: 26 · Land: Vietnam · Wohnort: Hamburg · Beruf: Informatiker · Sprachen: Vietnamesisch, Englisch, ein bisschen Deutsch · Hobbys: Ich koche sehr gern. Ich spiele gern Fußball. · Ich suche: einen Tandempartner für Deutsch. Ich habe am Samstag Zeit.'
    vi: Hồ sơ mẫu.
  checklist_vi:
  - Đủ 8 mục thông tin.
  - Câu sở thích dùng gern đúng.
  - Ngày dùng am.
