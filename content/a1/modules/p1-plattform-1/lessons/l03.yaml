summary_vi: 'Hören Teil 1: đọc câu hỏi trước, nghe thông tin chính, cẩn thận bẫy (cả 3 lựa chọn đều được nhắc). Sprechen Teil 1: tự giới thiệu theo 7 từ khóa (Name, Alter, Land, Wohnort, Sprachen, Beruf, Hobby), đánh vần tên, đọc số; khi không hiểu: Noch einmal, bitte.'
