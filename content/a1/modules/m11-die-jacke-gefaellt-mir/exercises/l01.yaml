  tags: ["kleidung", "dativ"]
exercises:
  - id: a1.m11.l01.ex.01
    type: multiple-choice
    skill: vocabulary
    difficulty: 1
    objective_refs: [a1.m11.l01.obj1, a1.m11.obj.kleidung]
    instructions_vi: "Chọn đáp án đúng."
    items:
      - id: a1.m11.l01.ex.01.q1
        prompt: "Welchen Artikel hat „Jacke“?"
        options: [{ id: a, text: "der" }, { id: b, text: "die" }, { id: c, text: "das" }]
        answer: [b]
        explanation_vi: "Đúng là „die Jacke“ (số nhiều die Jacken)."
      - id: a1.m11.l01.ex.01.q2
        prompt: "Was trägt man an den Füßen?"
        options: [{ id: a, text: "Schuhe" }, { id: b, text: "Eine Mütze" }, { id: c, text: "Ein Hemd" }]
        answer: [a]
        explanation_vi: "Giày (Schuhe) mang ở chân."
      - id: a1.m11.l01.ex.01.q3
        prompt: "Wie heißt der Plural von „der Rock“?"
        options: [{ id: a, text: "die Rocks" }, { id: b, text: "die Röcke" }, { id: c, text: "die Rock" }]
        answer: [b]
        explanation_vi: "Số nhiều có Umlaut: die Röcke."
      - id: a1.m11.l01.ex.01.q4
        prompt: "gut – ___"
        options: [{ id: a, text: "besser" }, { id: b, text: "guter" }, { id: c, text: "gutest" }]
        answer: [a]
        explanation_vi: "Dạng so sánh bất quy tắc: gut – besser."
  - id: a1.m11.l01.ex.02
    type: matching
    skill: vocabulary
    difficulty: 1
    objective_refs: [a1.m11.l01.obj1, a1.m11.obj.kleidung]
    instructions_vi: "Nối quần áo với nghĩa tiếng Việt."
    items:
      - { id: a1.m11.l01.ex.02.q1, left: "die Hose", right: "quần dài", explanation_vi: "die Hose = quần dài, số nhiều die Hosen." }
      - { id: a1.m11.l01.ex.02.q2, left: "der Mantel", right: "áo măng tô", explanation_vi: "der Mantel, số nhiều die Mäntel." }
      - { id: a1.m11.l01.ex.02.q3, left: "die Mütze", right: "mũ len", explanation_vi: "die Mütze, số nhiều die Mützen." }
      - { id: a1.m11.l01.ex.02.q4, left: "das Kleid", right: "váy liền", explanation_vi: "das Kleid, số nhiều die Kleider." }
      - { id: a1.m11.l01.ex.02.q5, left: "das Hemd", right: "áo sơ mi", explanation_vi: "das Hemd, số nhiều die Hemden." }
  - id: a1.m11.l01.ex.03
    type: fill-blank
    skill: grammar
    difficulty: 2
    objective_refs: [a1.m11.l01.obj2, a1.g.personalpronomen-dativ.obj1, a1.m11.obj.dativ]
    instructions_vi: "Điền đại từ Dativ đúng (gợi ý ngôi)."
    word_bank: ["mir", "dir", "ihr", "ihm"]
    items:
      - { id: a1.m11.l01.ex.03.q1, prompt: "Die Jacke gefällt ___.", hint_vi: "ich", answers: ["mir"], explanation_vi: "ich → mir (Dativ)." }
      - { id: a1.m11.l01.ex.03.q2, prompt: "Gefällt ___ das Kleid?", hint_vi: "du", answers: ["dir"], explanation_vi: "du → dir (Dativ)." }
      - { id: a1.m11.l01.ex.03.q3, prompt: "Der Rock gefällt ___.", hint_vi: "sie (một người nữ)", answers: ["ihr"], explanation_vi: "sie → ihr (Dativ)." }
      - { id: a1.m11.l01.ex.03.q4, prompt: "Die Schuhe gefallen ___.", hint_vi: "er", answers: ["ihm"], explanation_vi: "er → ihm (Dativ). „Schuhe“ số nhiều nên dùng „gefallen“." }
  - id: a1.m11.l01.ex.04
    type: word-order
    skill: grammar
    difficulty: 2
    objective_refs: [a1.m11.l01.obj2, a1.g.personalpronomen-dativ.obj1]
    instructions_vi: "Sắp xếp các từ thành câu đúng."
    items:
      - id: a1.m11.l01.ex.04.q1
        tokens: ["mir.", "gefällt", "Jacke", "Die"]
        answer: "Die Jacke gefällt mir."
        translation_vi: "Tôi thích chiếc áo khoác này."
        explanation_vi: "Chủ ngữ (thứ được thích) + gefällt + Dativ."
      - id: a1.m11.l01.ex.04.q2
        tokens: ["dir", "das", "Gefällt", "Kleid?"]
        answer: "Gefällt dir das Kleid?"
        translation_vi: "Bạn có thích chiếc váy này không?"
        explanation_vi: "Câu hỏi Ja/Nein: động từ đứng đầu."
      - id: a1.m11.l01.ex.04.q3
        tokens: ["nicht.", "Schuhe", "gefallen", "ihm", "Die"]
        answer: "Die Schuhe gefallen ihm nicht."
        translation_vi: "Anh ấy không thích đôi giày này."
        explanation_vi: "„Schuhe“ số nhiều → gefallen; „nicht“ ở cuối."
  - id: a1.m11.l01.ex.05
    type: reading-comprehension
    skill: reading
    difficulty: 1
    objective_refs: [a1.m11.l01.obj1, a1.m11.obj.kleidung]
    instructions_vi: "Đọc và trả lời."
    stimulus:
      text_de: "Pia geht heute einkaufen. Sie braucht eine Jacke und einen Pullover. Die Jacke ist rot und gefällt ihr sehr. Der Pullover ist blau, aber er ist zu groß. Pia kauft die Jacke."
      text_vi: "Hôm nay Pia đi mua sắm. Cô ấy cần một chiếc áo khoác và một chiếc áo len. Chiếc áo khoác màu đỏ và cô ấy rất thích. Chiếc áo len màu xanh dương nhưng quá rộng. Pia mua chiếc áo khoác."
    items:
      - id: a1.m11.l01.ex.05.q1
        prompt: "Was braucht Pia?"
        options: [{ id: a, text: "Eine Jacke und einen Pullover." }, { id: b, text: "Eine Hose und einen Rock." }, { id: c, text: "Einen Mantel." }]
        answer: [a]
        explanation_vi: "„Sie braucht eine Jacke und einen Pullover.“"
      - id: a1.m11.l01.ex.05.q2
        prompt: "Welche Farbe hat die Jacke?"
        options: [{ id: a, text: "Blau." }, { id: b, text: "Rot." }, { id: c, text: "Schwarz." }]
        answer: [b]
        explanation_vi: "„Die Jacke ist rot.“"
      - id: a1.m11.l01.ex.05.q3
        prompt: "Warum kauft Pia den Pullover nicht?"
        options: [{ id: a, text: "Er ist zu groß." }, { id: b, text: "Er ist zu teuer." }, { id: c, text: "Er ist rot." }]
        answer: [a]
        explanation_vi: "„Der Pullover ist blau, aber er ist zu groß.“"
  - id: a1.m11.l01.ex.06
    type: translation
    skill: writing
    difficulty: 2
    objective_refs: [a1.m11.l01.obj1, a1.m11.l01.obj2]
    instructions_vi: "Dịch sang tiếng Đức."
    items:
      - { id: a1.m11.l01.ex.06.q1, direction: vi-de, source: "Tôi thích cái quần này.", answers: ["Die Hose gefällt mir.", "Diese Hose gefällt mir."], explanation_vi: "Thứ được thích là chủ ngữ (die Hose), người thích ở Dativ (mir)." }
      - { id: a1.m11.l01.ex.06.q2, direction: vi-de, source: "Anh ấy mặc một chiếc áo khoác.", answers: ["Er trägt eine Jacke."], explanation_vi: "tragen: er trägt; „Jacke“ giống cái nên dùng „eine“." }
      - { id: a1.m11.l01.ex.06.q3, direction: vi-de, source: "Bạn có thích chiếc váy không?", answers: ["Gefällt dir das Kleid?", "Gefällt Ihnen das Kleid?"], explanation_vi: "Câu hỏi Ja/Nein: động từ đầu câu; Dativ dir (thân) hoặc Ihnen (lịch sự)." }
  - id: a1.m11.l01.ex.07
    type: speaking-practice
    skill: speaking
    difficulty: 2
    objective_refs: [a1.m11.l01.obj1, a1.m11.l01.obj2, a1.m11.obj.kleidung]
    instructions_vi: "Hãy nói 3–4 câu: bạn đang mặc gì và bạn thích hay không thích món nào."
    items:
      - id: a1.m11.l01.ex.07.q1
        prompt_vi: "Nói bạn mặc gì và thích món nào."
        model_answer: { de: "Heute trage ich eine Hose und einen Pullover. Der Pullover gefällt mir sehr. Die Schuhe gefallen mir nicht so gut.", vi: "Hôm nay tôi mặc quần dài và áo len. Tôi rất thích chiếc áo len. Đôi giày thì tôi không thích lắm." }
        rubric_vi: ["Gọi tên ít nhất hai món quần áo đúng mạo từ.", "Dùng tragen đúng (ich trage).", "Dùng gefallen + Dativ đúng.", "Phân biệt số ít (gefällt) và số nhiều (gefallen)."]
        explanation_vi: "Bài mẫu có tragen và hai câu gefallen (số ít và số nhiều)."
