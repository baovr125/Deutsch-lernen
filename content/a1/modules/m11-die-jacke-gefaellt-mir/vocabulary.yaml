entries:
  # ---- Bài 1: Die Jacke gefällt mir! ----
  - { id: a1.m11.v.jacke, de: "Jacke", pos: noun, article: die, plural: "Jacken", vi: "áo khoác", ipa: "/ˈjakə/", example: { de: "Die Jacke ist warm.", vi: "Chiếc áo khoác ấm." }, usage_vi: "„j“ đọc /j/ như „y“ tiếng Anh. Số nhiều: Jacken.", lesson_refs: [a1.m11.l01] }
  - { id: a1.m11.v.pullover, de: "Pullover", pos: noun, article: der, plural: "Pullover", vi: "áo len chui đầu", ipa: "/pʊˈloːvɐ/", example: { de: "Der Pullover ist blau.", vi: "Chiếc áo len màu xanh dương." }, usage_vi: "Số nhiều không đổi. Viết tắt khẩu ngữ: der Pulli.", lesson_refs: [a1.m11.l01] }
  - { id: a1.m11.v.tshirt, de: "T-Shirt", pos: noun, article: das, plural: "T-Shirts", vi: "áo phông", ipa: "/ˈtiːʃœʁt/", example: { de: "Im Sommer trage ich ein T-Shirt.", vi: "Mùa hè tôi mặc áo phông." }, usage_vi: "Từ mượn tiếng Anh nhưng đọc theo tiếng Đức.", lesson_refs: [a1.m11.l01] }
  - { id: a1.m11.v.hose, de: "Hose", pos: noun, article: die, plural: "Hosen", vi: "quần dài", ipa: "/ˈhoːzə/", example: { de: "Die Hose ist zu lang.", vi: "Chiếc quần dài quá." }, usage_vi: "Dùng số ít cho một cái quần: „eine Hose“.", lesson_refs: [a1.m11.l01] }
  - { id: a1.m11.v.kleid, de: "Kleid", pos: noun, article: das, plural: "Kleider", vi: "váy liền", ipa: "/klaɪt/", example: { de: "Das Kleid gefällt mir sehr.", vi: "Tôi rất thích chiếc váy này." }, usage_vi: "Số nhiều: Kleider. „d“ cuối từ đọc /t/.", lesson_refs: [a1.m11.l01] }
  - { id: a1.m11.v.rock, de: "Rock", pos: noun, article: der, plural: "Röcke", vi: "váy ngắn (chân váy)", ipa: "/ʁɔk/", example: { de: "Der Rock ist kurz.", vi: "Chân váy ngắn." }, usage_vi: "Số nhiều có Umlaut: Röcke.", lesson_refs: [a1.m11.l01] }
  - { id: a1.m11.v.hemd, de: "Hemd", pos: noun, article: das, plural: "Hemden", vi: "áo sơ mi", ipa: "/hɛmt/", example: { de: "Mein Chef trägt jeden Tag ein Hemd.", vi: "Sếp tôi ngày nào cũng mặc áo sơ mi." }, usage_vi: "Số nhiều: Hemden.", lesson_refs: [a1.m11.l01] }
  - { id: a1.m11.v.schuh, de: "Schuh", pos: noun, article: der, plural: "Schuhe", vi: "giày", ipa: "/ʃuː/", example: { de: "Die Schuhe sind neu.", vi: "Đôi giày mới." }, usage_vi: "Thường dùng ở số nhiều: die Schuhe (một đôi).", lesson_refs: [a1.m11.l01] }
  - { id: a1.m11.v.mantel, de: "Mantel", pos: noun, article: der, plural: "Mäntel", vi: "áo choàng dài, măng tô", ipa: "/ˈmantl̩/", example: { de: "Im Winter brauche ich einen Mantel.", vi: "Mùa đông tôi cần một chiếc áo măng tô." }, usage_vi: "Số nhiều có Umlaut: Mäntel.", lesson_refs: [a1.m11.l01] }
  - { id: a1.m11.v.muetze, de: "Mütze", pos: noun, article: die, plural: "Mützen", vi: "mũ len", ipa: "/ˈmʏʦə/", example: { de: "Die Mütze ist rot.", vi: "Chiếc mũ len màu đỏ." }, usage_vi: "„ü“ đọc /ʏ/; „tz“ đọc /ʦ/.", lesson_refs: [a1.m11.l01] }
  - { id: a1.m11.v.kleidung, de: "Kleidung", pos: noun, article: die, no_plural: true, vi: "quần áo (nói chung)", ipa: "/ˈklaɪdʊŋ/", example: { de: "Ich brauche neue Kleidung.", vi: "Tôi cần quần áo mới." }, usage_vi: "Danh từ tập hợp, không có số nhiều. Cụm „neue Kleidung“ học thuộc như một khối.", lesson_refs: [a1.m11.l01] }
  - { id: a1.m11.v.gefallen, de: "gefallen", pos: verb, forms: { er: "gefällt", perfekt: "hat gefallen" }, vi: "thích, làm hài lòng", ipa: "/ɡəˈfalən/", example: { de: "Die Jacke gefällt mir.", vi: "Tôi thích chiếc áo khoác này." }, usage_vi: "Chủ ngữ là thứ được thích; người thích ở Dativ: „mir, dir, ihm…“. Số nhiều: „Die Schuhe gefallen mir.“", lesson_refs: [a1.m11.l01] }
  - { id: a1.m11.v.tragen, de: "tragen", pos: verb, forms: { er: "trägt", perfekt: "hat getragen" }, vi: "mặc, mang vác", ipa: "/ˈtʁaːɡn̩/", example: { de: "Er trägt heute einen Anzug.", vi: "Hôm nay anh ấy mặc vest." }, usage_vi: "Bất quy tắc: du trägst, er trägt. Cũng nghĩa là mang, vác đồ.", lesson_refs: [a1.m11.l01] }
  - { id: a1.m11.v.anziehen, de: "anziehen", pos: verb, forms: { er: "zieht an", separable: true, perfekt: "hat angezogen" }, vi: "mặc vào", ipa: "/ˈanˌʦiːən/", example: { de: "Ich ziehe die Jacke an.", vi: "Tôi mặc áo khoác vào." }, usage_vi: "Động từ tách: „an“ ở cuối câu. Chỉ hành động mặc; „tragen“ chỉ trạng thái đang mặc.", lesson_refs: [a1.m11.l01] }
  - { id: a1.m11.v.besser, de: "besser", pos: adjective, vi: "tốt hơn", ipa: "/ˈbɛsɐ/", example: { de: "Diese Jacke ist besser.", vi: "Chiếc áo khoác này tốt hơn." }, usage_vi: "Dạng so sánh của „gut“: gut – besser. Học thuộc, bất quy tắc.", lesson_refs: [a1.m11.l01] }
  # ---- Bài 2: Ich brauche neue Kleidung! ----
  - { id: a1.m11.v.geschaeft, de: "Geschäft", pos: noun, article: das, plural: "Geschäfte", vi: "cửa hàng", ipa: "/ɡəˈʃɛft/", example: { de: "Das Geschäft öffnet um neun Uhr.", vi: "Cửa hàng mở cửa lúc chín giờ." }, usage_vi: "Số nhiều: Geschäfte. „sch“ đọc /ʃ/.", lesson_refs: [a1.m11.l02] }
  - { id: a1.m11.v.kaufhaus, de: "Kaufhaus", pos: noun, article: das, plural: "Kaufhäuser", vi: "trung tâm bách hóa", ipa: "/ˈkaʊfˌhaʊs/", example: { de: "Im Kaufhaus gibt es viele Etagen.", vi: "Trong trung tâm bách hóa có nhiều tầng." }, usage_vi: "Số nhiều có Umlaut: Kaufhäuser. Từ ghép: kaufen + Haus.", lesson_refs: [a1.m11.l02] }
  - { id: a1.m11.v.laden, de: "Laden", pos: noun, article: der, plural: "Läden", vi: "cửa tiệm nhỏ", ipa: "/ˈlaːdn̩/", example: { de: "Der Laden ist klein, aber schön.", vi: "Cửa tiệm nhỏ nhưng đẹp." }, usage_vi: "Số nhiều có Umlaut: Läden. Thân mật hơn „Geschäft“.", lesson_refs: [a1.m11.l02] }
  - { id: a1.m11.v.preis, de: "Preis", pos: noun, article: der, plural: "Preise", vi: "giá cả", ipa: "/pʁaɪs/", example: { de: "Der Preis ist nicht hoch.", vi: "Giá không cao." }, usage_vi: "Hỏi giá: „Was kostet …?“ hoặc „Wie viel kostet …?“", lesson_refs: [a1.m11.l02] }
  - { id: a1.m11.v.angebot, de: "Angebot", pos: noun, article: das, plural: "Angebote", vi: "ưu đãi, hàng khuyến mãi", ipa: "/ˈanɡəˌboːt/", example: { de: "Heute gibt es Angebote für Jacken.", vi: "Hôm nay có ưu đãi cho áo khoác." }, usage_vi: "Số nhiều: Angebote. „im Angebot“ = đang giảm giá.", lesson_refs: [a1.m11.l02] }
  - { id: a1.m11.v.kasse, de: "Kasse", pos: noun, article: die, plural: "Kassen", vi: "quầy thu ngân", ipa: "/ˈkasə/", example: { de: "Sie bezahlt an der Kasse.", vi: "Cô ấy thanh toán ở quầy thu ngân." }, usage_vi: "„an der Kasse“ = tại quầy thu ngân. Số nhiều: Kassen.", lesson_refs: [a1.m11.l02] }
  - { id: a1.m11.v.etage, de: "Etage", pos: noun, article: die, plural: "Etagen", vi: "tầng (của tòa nhà)", ipa: "/eˈtaːʒə/", example: { de: "Die Schuhe sind in der Etage zwei.", vi: "Giày ở tầng hai." }, usage_vi: "„g“ đọc /ʒ/ như tiếng Pháp. Từ đồng nghĩa: der Stock.", lesson_refs: [a1.m11.l02] }
  - { id: a1.m11.v.eingang, de: "Eingang", pos: noun, article: der, plural: "Eingänge", vi: "lối vào", ipa: "/ˈaɪnˌɡaŋ/", example: { de: "Der Eingang ist rechts.", vi: "Lối vào ở bên phải." }, usage_vi: "Trái nghĩa: der Ausgang. Số nhiều có Umlaut: Eingänge.", lesson_refs: [a1.m11.l02] }
  - { id: a1.m11.v.oeffnen, de: "öffnen", pos: verb, forms: { er: "öffnet", perfekt: "hat geöffnet" }, vi: "mở (cửa), mở cửa (cửa hàng)", ipa: "/ˈœfnən/", example: { de: "Das Kaufhaus öffnet um zehn Uhr.", vi: "Trung tâm bách hóa mở cửa lúc mười giờ." }, usage_vi: "Thân kết thúc -n nên thêm e: er öffnet.", lesson_refs: [a1.m11.l02] }
  - { id: a1.m11.v.schliessen, de: "schließen", pos: verb, forms: { er: "schließt", perfekt: "hat geschlossen" }, vi: "đóng cửa", ipa: "/ˈʃliːsn̩/", example: { de: "Der Laden schließt um achtzehn Uhr.", vi: "Cửa tiệm đóng cửa lúc 18 giờ." }, usage_vi: "Bất quy tắc: geschlossen. „geschlossen“ cũng là tính từ ‘đã đóng cửa’.", lesson_refs: [a1.m11.l02] }
  # ---- Bài 3: Die Reaktionen / Kann ich Ihnen helfen? ----
  - { id: a1.m11.v.passen, de: "passen", pos: verb, forms: { er: "passt", perfekt: "hat gepasst" }, vi: "vừa, hợp", ipa: "/ˈpasn̩/", example: { de: "Die Hose passt mir nicht.", vi: "Cái quần không vừa với tôi." }, usage_vi: "Đi với Dativ: „Der Mantel passt mir.“ Cũng nghĩa là ‘hợp’ (về thời gian): „Passt Ihnen Montag?“", lesson_refs: [a1.m11.l03] }
  - { id: a1.m11.v.gehoeren, de: "gehören", pos: verb, forms: { er: "gehört", perfekt: "hat gehört" }, vi: "thuộc về (ai)", ipa: "/ɡəˈhøːʁən/", example: { de: "Die Mütze gehört mir.", vi: "Chiếc mũ này là của tôi." }, usage_vi: "Đi với Dativ: „Das gehört mir/dir/ihm.“", lesson_refs: [a1.m11.l03] }
  - { id: a1.m11.v.bequem, de: "bequem", pos: adjective, vi: "thoải mái, tiện", ipa: "/bəˈkveːm/", example: { de: "Der Pullover ist sehr bequem.", vi: "Chiếc áo len rất thoải mái." }, usage_vi: "Dùng cho quần áo, giày, ghế.", lesson_refs: [a1.m11.l03] }
  - { id: a1.m11.v.lang, de: "lang", pos: adjective, vi: "dài", ipa: "/laŋ/", example: { de: "Der Mantel ist zu lang.", vi: "Chiếc áo măng tô dài quá." }, usage_vi: "Trái nghĩa: kurz.", lesson_refs: [a1.m11.l03] }
  - { id: a1.m11.v.kurz, de: "kurz", pos: adjective, vi: "ngắn", ipa: "/kʊʁʦ/", example: { de: "Der Rock ist ein bisschen kurz.", vi: "Chân váy hơi ngắn." }, usage_vi: "Trái nghĩa: lang.", lesson_refs: [a1.m11.l03] }
  - { id: a1.m11.v.eng, de: "eng", pos: adjective, vi: "chật, hẹp", ipa: "/ɛŋ/", example: { de: "Die Schuhe sind mir zu eng.", vi: "Đôi giày này chật với tôi." }, usage_vi: "Trái nghĩa: weit. „zu eng“ = quá chật.", lesson_refs: [a1.m11.l03] }
  - { id: a1.m11.v.weit, de: "weit", pos: adjective, vi: "rộng; xa", ipa: "/vaɪt/", example: { de: "Das Hemd ist weit.", vi: "Chiếc áo sơ mi rộng." }, usage_vi: "Hai nghĩa: rộng (quần áo) và xa (khoảng cách).", lesson_refs: [a1.m11.l03] }
  - { id: a1.m11.v.helfen-hoeflich, de: "Kann ich Ihnen helfen?", pos: phrase, vi: "Tôi có thể giúp gì cho ông/bà ạ?", ipa: "/kan ɪç ˈiːnən ˈhɛlfn̩/", example: { de: "Guten Tag! Kann ich Ihnen helfen?", vi: "Xin chào! Tôi có thể giúp gì cho ông/bà ạ?" }, usage_vi: "Câu nhân viên bán hàng hay hỏi. „Ihnen“ là đại từ Dativ trang trọng (helfen + Dativ).", lesson_refs: [a1.m11.l03] }
  - { id: a1.m11.v.bitte-schoen, de: "Bitte schön.", pos: phrase, vi: "Xin mời; không có gì ạ.", ipa: "/ˈbɪtə ʃøːn/", example: { de: "Hier ist Ihre Jacke. – Danke! – Bitte schön.", vi: "Đây là áo khoác của quý khách. – Cảm ơn! – Không có gì ạ." }, usage_vi: "Đáp lại „Danke“ hoặc khi đưa đồ cho ai.", lesson_refs: [a1.m11.l03] }
  # ---- Bài 4: Im Kaufhaus und Berlin ----
  - { id: a1.m11.v.umkleidekabine, de: "Umkleidekabine", pos: noun, article: die, plural: "Umkleidekabinen", vi: "phòng thử đồ", ipa: "/ˈʊmklaɪdəkaˌbiːnə/", example: { de: "Die Umkleidekabine ist dort hinten.", vi: "Phòng thử đồ ở phía sau kia." }, usage_vi: "Thường gọi tắt: die Kabine.", lesson_refs: [a1.m11.l04] }
  - { id: a1.m11.v.tasche, de: "Tasche", pos: noun, article: die, plural: "Taschen", vi: "túi, cặp", ipa: "/ˈtaʃə/", example: { de: "Die Tasche ist leider zu teuer.", vi: "Tiếc là cái túi quá đắt." }, usage_vi: "„sch“ đọc /ʃ/.", lesson_refs: [a1.m11.l04] }
  - { id: a1.m11.v.museum, de: "Museum", pos: noun, article: das, plural: "Museen", vi: "bảo tàng", ipa: "/muˈzeːʊm/", example: { de: "In Berlin gibt es viele Museen.", vi: "Ở Berlin có nhiều bảo tàng." }, usage_vi: "Số nhiều bất thường: Museen.", lesson_refs: [a1.m11.l04] }
  - { id: a1.m11.v.anprobieren, de: "anprobieren", pos: verb, forms: { er: "probiert an", separable: true, perfekt: "hat anprobiert" }, vi: "thử (quần áo)", ipa: "/ˈanpʁoˌbiːʁən/", example: { de: "Ich probiere die Hose an.", vi: "Tôi thử cái quần." }, usage_vi: "Động từ tách có đuôi -ieren: Partizip II không có „ge-“: anprobiert.", lesson_refs: [a1.m11.l04] }
  - { id: a1.m11.v.bezahlen, de: "bezahlen", pos: verb, forms: { er: "bezahlt", perfekt: "hat bezahlt" }, vi: "thanh toán", ipa: "/bəˈʦaːlən/", example: { de: "Ich bezahle mit Karte.", vi: "Tôi thanh toán bằng thẻ." }, usage_vi: "Tiền tố be- không tách, Partizip II không có „ge-“: bezahlt.", lesson_refs: [a1.m11.l04] }
  - { id: a1.m11.v.bekommen, de: "bekommen", pos: verb, forms: { er: "bekommt", perfekt: "hat bekommen" }, vi: "nhận được", ipa: "/bəˈkɔmən/", example: { de: "Er hat ein Geschenk bekommen.", vi: "Anh ấy đã nhận được một món quà." }, usage_vi: "Đừng nhầm với „become“ tiếng Anh! „bekommen“ = nhận được. Partizip II: bekommen (không ge-).", lesson_refs: [a1.m11.l04] }
  - { id: a1.m11.v.verkaufen, de: "verkaufen", pos: verb, forms: { er: "verkauft", perfekt: "hat verkauft" }, vi: "bán", ipa: "/fɛɐ̯ˈkaʊfn̩/", example: { de: "Das Geschäft verkauft Schuhe.", vi: "Cửa hàng bán giày." }, usage_vi: "Trái nghĩa: kaufen. Partizip II: verkauft (không ge-).", lesson_refs: [a1.m11.l04] }
  - { id: a1.m11.v.besuchen, de: "besuchen", pos: verb, forms: { er: "besucht", perfekt: "hat besucht" }, vi: "thăm, đến thăm", ipa: "/bəˈzuːxn̩/", example: { de: "Wir besuchen das Museum.", vi: "Chúng tôi đến thăm bảo tàng." }, usage_vi: "Đi với Akkusativ. Partizip II: besucht.", lesson_refs: [a1.m11.l04] }
  - { id: a1.m11.v.verstehen, de: "verstehen", pos: verb, forms: { er: "versteht", perfekt: "hat verstanden" }, vi: "hiểu", ipa: "/fɛɐ̯ˈʃteːən/", example: { de: "Ich verstehe das Wort nicht.", vi: "Tôi không hiểu từ này." }, usage_vi: "Bất quy tắc: verstanden (không ge-).", lesson_refs: [a1.m11.l04] }
  - { id: a1.m11.v.umtauschen, de: "umtauschen", pos: verb, forms: { er: "tauscht um", separable: true, perfekt: "hat umgetauscht" }, vi: "đổi hàng", ipa: "/ˈʊmˌtaʊʃn̩/", example: { de: "Ich tausche die Hose um.", vi: "Tôi đổi cái quần." }, usage_vi: "Động từ tách: um-ge-tauscht.", lesson_refs: [a1.m11.l04] }
