blocks:
  - id: a1.m11.l02.b1
    kind: explanation
    skill: grammar
    title_vi: "Bắt đầu: chọn đồ khi mua sắm"
    body_vi: |
      Khi có nhiều món để chọn, hỏi bằng **welch-**: *Welcher Pullover? Welche Jacke? Welches Kleid? Welche Schuhe?* Trả lời bằng **dies-**: *Dieser Pullover. Diese Jacke. Dieses Kleid. Diese Schuhe.*
      Với tân ngữ giống đực, đuôi đổi: **welchen / diesen** (*Ich nehme diesen Pullover.*).
  - id: a1.m11.l02.b2
    kind: dialogue
    skill: speaking
    title_vi: "Hội thoại: Ở trung tâm bách hóa"
    lines:
      - { speaker: "Verkäuferin", de: "Guten Tag! Wir haben heute viele Angebote.", vi: "Xin chào! Hôm nay chúng tôi có nhiều ưu đãi." }
      - { speaker: "Kunde", de: "Gut. Ich brauche eine Hose. Welche Hose ist im Angebot?", vi: "Tốt. Tôi cần một cái quần. Quần nào đang khuyến mãi?" }
      - { speaker: "Verkäuferin", de: "Diese Hose kostet nur fünfzig Euro.", vi: "Cái quần này chỉ năm mươi euro." }
      - { speaker: "Kunde", de: "Und welches Hemd passt dazu?", vi: "Và áo sơ mi nào hợp với nó?" }
      - { speaker: "Verkäuferin", de: "Dieses Hemd hier. Die Kasse ist im Erdgeschoss.", vi: "Chiếc áo sơ mi này đây. Quầy thu ngân ở tầng trệt." }
  - id: a1.m11.l02.b3
    kind: reading
    skill: reading
    title_vi: "Biển hướng dẫn: Kaufhaus Merkur"
    paragraphs:
      - { de: "Erdgeschoss: Eingang, Kasse, Taschen.", vi: "Tầng trệt: lối vào, quầy thu ngân, túi xách." }
      - { de: "Erste Etage: Damenkleidung und Schuhe.", vi: "Tầng 1: quần áo nữ và giày." }
      - { de: "Zweite Etage: Herrenkleidung und Angebote.", vi: "Tầng 2: quần áo nam và hàng khuyến mãi." }
      - { de: "Öffnungszeiten: Montag bis Samstag, 9 bis 20 Uhr.", vi: "Giờ mở cửa: thứ Hai đến thứ Bảy, 9 đến 20 giờ." }
  - id: a1.m11.l02.b4
    kind: listening
    skill: listening
    title_vi: "Nghe: Thông báo ở trung tâm bách hóa"
    audio_status: pending-tts
    lines:
      - { speaker: "Durchsage", de: "Liebe Kunden, heute gibt es im Erdgeschoss Angebote für Jacken und Mäntel.", vi: "Kính gửi quý khách, hôm nay ở tầng trệt có ưu đãi cho áo khoác và áo măng tô." }
      - { speaker: "Durchsage", de: "Das Kaufhaus schließt heute um zwanzig Uhr.", vi: "Trung tâm bách hóa hôm nay đóng cửa lúc 20 giờ." }
  - id: a1.m11.l02.b5
    kind: culture
    skill: reading
    title_vi: "Chiến lược: đọc biển báo"
    body_vi: |
      Biển hướng dẫn thường chỉ có từ khóa, không có câu đầy đủ. Hãy tìm **tầng** (Etage/Erdgeschoss), **loại hàng** (Damen = nữ, Herren = nam, Kinder = trẻ em) và **giờ mở cửa** (Öffnungszeiten).
